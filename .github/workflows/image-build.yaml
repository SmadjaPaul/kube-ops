name: Build and Push Docker Images

on:
  pull_request:
    paths:
      - 'images/**'

  push:
    branches:
      - main
    paths:
      - 'images/**'

  workflow_dispatch:
    inputs:
      image:
        description: 'Image name to build (leave empty to build all changed images)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  detect-dockerfiles:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.detect.outputs.images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Dockerfiles
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          REQUESTED_IMAGE: ${{ inputs.image }}
        shell: bash
        run: |
          set -euo pipefail

          image_list() {
            local changed path image
            changed="$1"
            while IFS= read -r path; do
              [[ -z "$path" || "$path" == *.md || "$path" == *.MD ]] && continue
              image="${path#images/}"
              image="${image%%/*}"
              [[ -n "$image" && -f "images/$image/Dockerfile" ]] && printf '%s\n' "$image"
            done <<< "$changed" | sort -u
          }

          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            if [[ -n "$REQUESTED_IMAGE" ]]; then
              [[ "$REQUESTED_IMAGE" =~ ^[A-Za-z0-9._-]+$ ]] || {
                echo 'The manual image input must name one image directory' >&2
                exit 1
              }
              test -f "images/$REQUESTED_IMAGE/Dockerfile"
              images="$REQUESTED_IMAGE"
            else
              images=$(find images -mindepth 1 -maxdepth 1 -type d ! -name '.*' -exec basename {} \; | sort)
            fi
          elif [[ "$EVENT_NAME" == pull_request ]]; then
            # A fork branch does not necessarily exist as origin/<head_ref>.
            # Fetch the GitHub PR ref and verify the exact event head SHA.
            [[ "$PR_NUMBER" =~ ^[0-9]+$ && "$PR_BASE_SHA" =~ ^[a-f0-9]{40}$ && "$PR_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            git fetch --no-tags origin "pull/$PR_NUMBER/head"
            [[ "$(git rev-parse FETCH_HEAD)" == "$PR_HEAD_SHA" ]] || exit 1
            images=$(image_list "$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" -- 'images/*')")
          else
            before="${BEFORE_SHA:-HEAD~1}"
            images=$(image_list "$(git diff --name-only "$before" "$CURRENT_SHA" -- 'images/*')")
          fi

          printf 'images=%s\n' "$(printf '%s\n' "$images" | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  # Untrusted PR code is built for validation only. It receives no GHCR
  # credentials, cannot publish tags, and has read-only repository access.
  build-pr:
    name: Validate image build (PR, no publish)
    runs-on: ubuntu-latest
    needs: detect-dockerfiles
    if: github.event_name == 'pull_request' && needs.detect-dockerfiles.outputs.images != '[]'
    permissions:
      contents: read
    strategy:
      matrix:
        image: ${{ fromJson(needs.detect-dockerfiles.outputs.images) }}
      fail-fast: false
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify submodule checkout
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          git submodule status
          if [[ -d "images/$IMAGE_NAME/upstream" && ! -d "images/$IMAGE_NAME/upstream/requirements" ]]; then
            echo 'Expected upstream requirements directory is missing' >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: images/${{ matrix.image }}
          file: images/${{ matrix.image }}/Dockerfile
          pull: true
          push: false
          platforms: linux/amd64
          tags: local/${{ matrix.image }}:pr-${{ github.event.pull_request.number }}

  # Only trusted main pushes and explicit manual dispatches from main may
  # receive packages:write or authenticate to GHCR.
  publish:
    name: Publish image (trusted main only)
    runs-on: ubuntu-latest
    needs: detect-dockerfiles
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.detect-dockerfiles.outputs.images != '[]'
    permissions:
      contents: read
      packages: write # Publication is restricted to trusted main push/manual runs below.
    strategy:
      matrix:
        image: ${{ fromJson(needs.detect-dockerfiles.outputs.images) }}
      fail-fast: false
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify submodule checkout
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          git submodule status
          if [[ -d "images/$IMAGE_NAME/upstream" && ! -d "images/$IMAGE_NAME/upstream/requirements" ]]; then
            echo 'Expected upstream requirements directory is missing' >&2
            exit 1
          fi

      - name: Set lowercase owner for GHCR
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract base image and version tags
        id: image-tags
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          dockerfile="images/$IMAGE_NAME/Dockerfile"
          from_line=$(grep -m 1 '^FROM' "$dockerfile")
          from_image=$(echo "$from_line" | sed -E 's/^FROM[[:space:]]+//; s/[[:space:]]+AS[[:space:]].*$//; s/^--platform=[^[:space:]]+[[:space:]]+//')
          base_image_tag=$(echo "$from_image" | awk -F':' 'NF>1{print $NF; next}{print "latest"}')
          image_version=$(grep -m1 'ARG IMAGE_VERSION=' "$dockerfile" | cut -d'=' -f2 | sed 's/#.*$//' | xargs || true)
          [[ -n "$image_version" ]] || image_version=latest
          printf 'base_tag=%s\nimage_version=%s\n' "$base_image_tag" "$image_version" >> "$GITHUB_OUTPUT"

      - name: Generate revision tag
        id: revision
        env:
          IMAGE_VERSION: ${{ steps.image-tags.outputs.image_version }}
        run: echo "revision_tag=${IMAGE_VERSION}-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build and publish Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: images/${{ matrix.image }}
          file: images/${{ matrix.image }}/Dockerfile
          pull: true
          push: true
          build-args: |
            IMAGE_VERSION=${{ steps.image-tags.outputs.image_version }}
          platforms: linux/amd64
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER_LC }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.OWNER_LC }}/${{ matrix.image }}:buildcache,mode=max
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.image }}:latest
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.image }}:${{ steps.image-tags.outputs.base_tag }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.image }}:${{ steps.image-tags.outputs.image_version }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.image }}:${{ steps.revision.outputs.revision_tag }}
