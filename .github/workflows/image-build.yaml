name: Build and Push Docker Images

on:
  pull_request:
    paths:
      - 'images/**'

  push:
    branches:
      - main
    paths:
      - 'images/**'

  workflow_dispatch:
    inputs:
      image:
        description: 'Image name to build (leave empty to build all changed images)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-dockerfiles:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.detect.outputs.images }}
      builds: ${{ steps.detect.outputs.builds }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Dockerfiles
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          REQUESTED_IMAGE: ${{ inputs.image }}
        shell: bash
        run: |
          set -euo pipefail

          image_list() {
            local changed path image
            changed="$1"
            while IFS= read -r path; do
              [[ -z "$path" || "$path" == *.md || "$path" == *.MD ]] && continue
              image="${path#images/}"
              image="${image%%/*}"
              # `if`, not `&&`: a deleted image directory must not make the loop
              # (and the pipefail pipeline) return non-zero.
              if [[ -n "$image" && -f "images/$image/Dockerfile" ]]; then
                printf '%s\n' "$image"
              fi
            done <<< "$changed" | sort -u
          }

          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            if [[ -n "$REQUESTED_IMAGE" ]]; then
              [[ "$REQUESTED_IMAGE" =~ ^[A-Za-z0-9._-]+$ ]] || {
                echo 'The manual image input must name one image directory' >&2
                exit 1
              }
              test -f "images/$REQUESTED_IMAGE/Dockerfile"
              images="$REQUESTED_IMAGE"
            else
              images=$(find images -mindepth 1 -maxdepth 1 -type d ! -name '.*' -exec basename {} \; | sort)
            fi
          elif [[ "$EVENT_NAME" == pull_request ]]; then
            # A fork branch does not necessarily exist as origin/<head_ref>.
            # Fetch the GitHub PR ref and verify the exact event head SHA.
            [[ "$PR_NUMBER" =~ ^[0-9]+$ && "$PR_BASE_SHA" =~ ^[a-f0-9]{40}$ && "$PR_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            git fetch --no-tags origin "pull/$PR_NUMBER/head"
            [[ "$(git rev-parse FETCH_HEAD)" == "$PR_HEAD_SHA" ]] || exit 1
            images=$(image_list "$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" -- 'images/*')")
          else
            before="${BEFORE_SHA:-HEAD~1}"
            images=$(image_list "$(git diff --name-only "$before" "$CURRENT_SHA" -- 'images/*')")
          fi

          printf 'images=%s\n' "$(printf '%s\n' "$images" | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

          # One build per (image, platform). images/<name>/platforms lists the
          # platforms (one per line); without it, linux/amd64 only. Each
          # platform builds on a native runner (no QEMU): ubuntu-24.04-arm is
          # free for public repositories.
          builds='[]'
          while IFS= read -r image; do
            [[ -n "$image" ]] || continue
            platforms=linux/amd64
            if [[ -f "images/$image/platforms" ]]; then
              platforms=$(grep -Ev '^[[:space:]]*(#|$)' "images/$image/platforms")
            fi
            for platform in $platforms; do
              case "$platform" in
                linux/amd64) runner=ubuntu-latest ;;
                linux/arm64) runner=ubuntu-24.04-arm ;;
                *) echo "Unsupported platform for $image: $platform" >&2; exit 1 ;;
              esac
              builds=$(jq -c --arg i "$image" --arg p "$platform" --arg a "${platform#linux/}" --arg r "$runner" \
                '. + [{image: $i, platform: $p, arch: $a, runner: $r}]' <<< "$builds")
            done
          done <<< "$images"
          printf 'builds=%s\n' "$builds" >> "$GITHUB_OUTPUT"

  # Untrusted PR code is built for validation only. It receives no GHCR
  # credentials, cannot publish tags, and has read-only repository access.
  build-pr:
    name: Validate image build (PR, no publish)
    runs-on: ${{ matrix.runner }}
    needs: detect-dockerfiles
    if: github.event_name == 'pull_request' && needs.detect-dockerfiles.outputs.builds != '[]'
    permissions:
      contents: read
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect-dockerfiles.outputs.builds) }}
      fail-fast: false
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify submodule checkout
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          git submodule status
          if [[ -d "images/$IMAGE_NAME/upstream" && ! -d "images/$IMAGE_NAME/upstream/requirements" ]]; then
            echo 'Expected upstream requirements directory is missing' >&2
            exit 1
          fi

      - name: Verify runner architecture matches target platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            linux/arm64) expected=aarch64 ;;
            linux/amd64) expected=x86_64 ;;
            *) echo "Unsupported platform: $PLATFORM" >&2; exit 1 ;;
          esac
          actual=$(uname -m)
          [[ "$actual" == "$expected" ]] || { echo "Runner $actual != target $expected" >&2; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/${{ matrix.image }}
          file: images/${{ matrix.image }}/Dockerfile
          pull: true
          push: false
          platforms: ${{ matrix.platform }}
          tags: local/${{ matrix.image }}:pr-${{ github.event.pull_request.number }}-${{ matrix.arch }}

  # Only trusted main pushes and explicit manual dispatches from main may
  # receive packages:write or authenticate to GHCR.
  # One job per (image, platform), native runner. It pushes only the
  # per-arch tag <revision>-<arch>; the merge job below builds the multi-arch
  # index and the public tags from these digests.
  publish:
    name: Publish image per platform (trusted main only)
    runs-on: ${{ matrix.runner }}
    needs: detect-dockerfiles
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.detect-dockerfiles.outputs.builds != '[]'
    permissions:
      contents: read
      packages: write # Publication is restricted to trusted main push/manual runs below.
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect-dockerfiles.outputs.builds) }}
      fail-fast: false
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify submodule checkout
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          git submodule status
          if [[ -d "images/$IMAGE_NAME/upstream" && ! -d "images/$IMAGE_NAME/upstream/requirements" ]]; then
            echo 'Expected upstream requirements directory is missing' >&2
            exit 1
          fi

      - name: Set lowercase owner for GHCR
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Verify runner architecture matches target platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            linux/arm64) expected=aarch64 ;;
            linux/amd64) expected=x86_64 ;;
            *) echo "Unsupported platform: $PLATFORM" >&2; exit 1 ;;
          esac
          actual=$(uname -m)
          [[ "$actual" == "$expected" ]] || { echo "Runner $actual != target $expected" >&2; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract base image and version tags
        id: image-tags
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          dockerfile="images/$IMAGE_NAME/Dockerfile"
          from_line=$(grep -m 1 '^FROM' "$dockerfile")
          from_image=$(echo "$from_line" | sed -E 's/^FROM[[:space:]]+//; s/[[:space:]]+AS[[:space:]].*$//; s/^--platform=[^[:space:]]+[[:space:]]+//')
          base_image_tag=$(echo "$from_image" | awk -F':' 'NF>1{print $NF; next}{print "latest"}')
          image_version=$(grep -m1 'ARG IMAGE_VERSION=' "$dockerfile" | cut -d'=' -f2 | sed 's/#.*$//' | xargs || true)
          [[ -n "$image_version" ]] || image_version=latest
          printf 'base_tag=%s\nimage_version=%s\n' "$base_image_tag" "$image_version" >> "$GITHUB_OUTPUT"

      - name: Generate revision tag
        id: revision
        env:
          IMAGE_VERSION: ${{ steps.image-tags.outputs.image_version }}
        run: echo "revision_tag=${IMAGE_VERSION}-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build and publish the platform image
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/${{ matrix.image }}
          file: images/${{ matrix.image }}/Dockerfile
          pull: true
          push: true
          build-args: |
            IMAGE_VERSION=${{ steps.image-tags.outputs.image_version }}
          platforms: ${{ matrix.platform }}
          # One cache per arch: a shared ref would be overwritten by the other arch.
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER_LC }}/${{ matrix.image }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/${{ env.OWNER_LC }}/${{ matrix.image }}:buildcache-${{ matrix.arch }},mode=max
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.image }}:${{ steps.revision.outputs.revision_tag }}-${{ matrix.arch }}

      - name: Record platform digest
        env:
          IMAGE_NAME: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          tick='`'
          printf '### %s (%s)\n- digest: %s\n' "$IMAGE_NAME" "$PLATFORM" "$tick$DIGEST$tick" >> "$GITHUB_STEP_SUMMARY"

  # Multi-arch index per image, from the per-arch digests. The public tags
  # (latest, base tag, image version, revision) point to this index; pin its
  # digest in the GitOps overlays.
  merge:
    name: Publish multi-arch index (trusted main only)
    runs-on: ubuntu-latest
    needs: [detect-dockerfiles, publish]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.detect-dockerfiles.outputs.images != '[]'
    permissions:
      contents: read
      packages: write # Writes the index and its tags; trusted main push/manual runs only.
    strategy:
      matrix:
        image: ${{ fromJson(needs.detect-dockerfiles.outputs.images) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set lowercase owner for GHCR
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract base image and version tags
        id: image-tags
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          dockerfile="images/$IMAGE_NAME/Dockerfile"
          from_line=$(grep -m 1 '^FROM' "$dockerfile")
          from_image=$(echo "$from_line" | sed -E 's/^FROM[[:space:]]+//; s/[[:space:]]+AS[[:space:]].*$//; s/^--platform=[^[:space:]]+[[:space:]]+//')
          base_image_tag=$(echo "$from_image" | awk -F':' 'NF>1{print $NF; next}{print "latest"}')
          image_version=$(grep -m1 'ARG IMAGE_VERSION=' "$dockerfile" | cut -d'=' -f2 | sed 's/#.*$//' | xargs || true)
          [[ -n "$image_version" ]] || image_version=latest
          printf 'base_tag=%s\nimage_version=%s\n' "$base_image_tag" "$image_version" >> "$GITHUB_OUTPUT"

      - name: Create and record the multi-arch index
        env:
          IMAGE_NAME: ${{ matrix.image }}
          BASE_TAG: ${{ steps.image-tags.outputs.base_tag }}
          IMAGE_VERSION: ${{ steps.image-tags.outputs.image_version }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${OWNER_LC}/${IMAGE_NAME}"
          revision="${IMAGE_VERSION}-${GITHUB_SHA:0:7}"
          platforms=linux/amd64
          if [[ -f "images/$IMAGE_NAME/platforms" ]]; then
            platforms=$(grep -Ev '^[[:space:]]*(#|$)' "images/$IMAGE_NAME/platforms")
          fi
          sources=()
          for platform in $platforms; do
            digest=$(docker buildx imagetools inspect "$repo:$revision-${platform#linux/}" --format '{{json .Manifest}}' | jq -r .digest)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "No digest for $repo:$revision-${platform#linux/}" >&2; exit 1; }
            sources+=("$repo@$digest")
          done
          docker buildx imagetools create \
            -t "$repo:latest" -t "$repo:$BASE_TAG" -t "$repo:$IMAGE_VERSION" -t "$repo:$revision" \
            "${sources[@]}"
          index=$(docker buildx imagetools inspect "$repo:$revision" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$index" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "No index digest for $repo:$revision" >&2; exit 1; }
          # Digest a epingler dans l'overlay GitOps apres publication (index multi-arch).
          tick='`'
          printf '### %s\n- platforms: %s\n- image: %s\n' \
            "$IMAGE_NAME" "$tick${platforms//$'\n'/ }$tick" "$tick$repo:$revision@$index$tick" >> "$GITHUB_STEP_SUMMARY"
