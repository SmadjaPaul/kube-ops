name: V1 Contract

on:
  pull_request:
    paths:
      - 'k8s/**'
      - 'scripts/**'
      - '.agents/**'
      - '.justfile'
      - 'docs/agent-harness.md'
      - 'docs/operations/acceptance-levels.md'
      - 'AGENTS.md'
      - 'README.md'
      - '.github/workflows/v1-contract.yaml'
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - 'scripts/**'
      - 'AGENTS.md'
      - 'README.md'
      - '.github/workflows/v1-contract.yaml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSLo /tmp/helm.tgz https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Install Kustomize
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSLo /tmp/kustomize.tgz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tgz -C /tmp
          sudo install -m 0755 /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Install yq
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSLo /tmp/yq https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version

      - name: Install Kubeconform
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSLo /tmp/kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tgz -C /tmp
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate V1 desired state and backup coverage
        run: npm run check

      - name: Validate Paperclip backlog importer
        run: node --test scripts/paperclip/import-backlog-seed.test.mjs

      - name: Validate Paperclip credential preflight
        run: |
          node --test scripts/paperclip/github-credential-preflight.test.mjs
          node --test scripts/paperclip/managed-github-preflight.test.mjs
          python3 -m py_compile scripts/paperclip/litellm-vkey-diagnostic.py
          bash -n scripts/paperclip/runtime-preflight.sh

      - name: Render Paperclip production and sandbox candidate
        run: |
          kustomize build k8s/applications/ai/paperclip >/tmp/paperclip-production.yaml
          ! grep -qE 'plugin-kubernetes|mode: kubernetes|backend: sandbox-cr' /tmp/paperclip-production.yaml
          kustomize build k8s/applications/ai/paperclip/poc/kubernetes-execution >/tmp/paperclip-sandbox-candidate.yaml

      - name: Validate bootstrap shell
        run: bash -n scripts/bootstrap-cluster.sh
