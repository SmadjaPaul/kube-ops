name: V1 Contract

on:
  pull_request:
    paths:
      - 'k8s/**'
      - 'scripts/**'
      - '.agents/**'
      - '.justfile'
      - 'docs/agent-harness.md'
      - 'docs/contracts/**'
      - 'tests/harness/**'
      - 'docs/operations/acceptance-levels.md'
      - 'AGENTS.md'
      - 'README.md'
      - '.github/workflows/v1-contract.yaml'
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - 'scripts/**'
      - 'docs/contracts/**'
      - 'tests/harness/**'
      - 'AGENTS.md'
      - 'README.md'
      - '.github/workflows/v1-contract.yaml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSLo /tmp/helm.tgz https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Install Kustomize
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSLo /tmp/kustomize.tgz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tgz -C /tmp
          sudo install -m 0755 /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Install yq
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSLo /tmp/yq https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version

      - name: Install Kubeconform
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSLo /tmp/kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tgz -C /tmp
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate V1 desired state and backup coverage
        run: npm run check

      - name: Validate Factory supervised promotion contract
        run: bash tests/harness/mastra-factory-supervised-promotion-test.sh

      - name: Validate staged Configarr pilot
        run: |
          kustomize build k8s/applications/media/configarr > /tmp/configarr-rendered.yaml
          kubeconform -summary -ignore-missing-schemas /tmp/configarr-rendered.yaml
          bash tests/harness/configarr-gitops-contract-test.sh

      - name: Validate dormant Polyfin private pilot
        run: |
          kustomize build k8s/applications/media/polyfin > /tmp/polyfin-rendered.yaml
          kubeconform -summary -ignore-missing-schemas /tmp/polyfin-rendered.yaml
          bash tests/harness/polyfin-private-pilot-contract-test.sh

      - name: Validate Arr Authentik proxy first-run contract
        run: bash tests/harness/arr-authentik-proxy-contract-test.sh

      - name: Validate bounded Prowlarr-to-Arr egress
        run: |
          kustomize build k8s/infrastructure/network/policies/applications/media/media > /tmp/media-policies.yaml
          kubeconform -summary -ignore-missing-schemas /tmp/media-policies.yaml
          bash tests/harness/prowlarr-arr-egress-contract-test.sh

      - name: Validate bounded Arr-to-Prowlarr return egress
        run: |
          kustomize build k8s/infrastructure/network/policies/applications/media/media > /tmp/media-policies.yaml
          kubeconform -summary -ignore-missing-schemas /tmp/media-policies.yaml
          bash tests/harness/arr-prowlarr-reverse-egress-contract-test.sh

      - name: Validate native Media operator tool offline
        run: |
          python3 -m py_compile scripts/media/plt118-native-setup.py
          python3 -m unittest discover -s tests/harness -p 'plt118_native_setup_test.py' -v

      - name: Validate ARC GitOps contract
        run: bash tests/harness/arc-gitops-contract-test.sh

      - name: Validate GitHub Atlantis admission boundary
        run: bash tests/harness/github-atlantis-guard-test.sh

      - name: Validate bootstrap shell
        run: bash -n scripts/bootstrap-cluster.sh
