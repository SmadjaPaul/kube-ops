name: V1 Contract
# PLT-131: workflow-integrity becomes required after its bootstrap PR.

on:
  # Always run this CI on every PR so a required check cannot be skipped by
  # changing only renovate.json or unrelated documentation.
  pull_request:
  # Requis pour la merge queue : sans cet evenement, le check requis ne tourne pas dans la queue.
  merge_group:
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - 'scripts/**'
      - 'policy/**'
      - 'tests/policies/**'
      - 'docs/contracts/**'
      - 'tests/harness/**'
      - 'AGENTS.md'
      - 'README.md'
      - '.github/workflows/v1-contract.yaml'
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

# A new push to a PR supersedes the previous run: cancel it to save runner time.
# main and scheduled runs are never cancelled.
concurrency:
  group: v1-contract-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    # Stable, unique check-run name for eventual GitHub branch protection.
    name: v1-contract
    # Scale set without Kubernetes token (PLT-442); rollback: ubuntu-latest.
    runs-on: kube-ops-pr-ci-arc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # helm, kustomize, yq, kubeconform and kyverno are in the arc-ci-runner image (no sudo there).
      - name: Show preinstalled tool versions
        run: |
          helm version --short
          kustomize version
          yq --version
          kubeconform -v
          kyverno version

      - name: Validate Renovate configuration syntax
        run: python3 -m json.tool renovate.json > /dev/null

      - name: Select V1 render scope
        id: scope
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || '' }}
        run: echo "roots=$(bash scripts/select-v1-contract-roots.sh)" >> "$GITHUB_OUTPUT"

      - name: Validate V1 desired state and backup coverage
        env:
          V1_CONTRACT_ROOTS: ${{ steps.scope.outputs.roots }}
        run: npm run check

      - name: App-test static on the apps touched by the diff (PLT-390, ratchet policy/app-test-baseline.tsv)
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || '' }}
        run: bash scripts/app-test-changed.sh

      - name: Validate Factory supervised promotion contract
        run: bash tests/harness/mastra-factory-supervised-promotion-test.sh

      - name: Validate dormant Polyfin private pilot
        run: |
          kustomize build k8s/applications/media/polyfin > /tmp/polyfin-rendered.yaml
          kubeconform -summary -ignore-missing-schemas /tmp/polyfin-rendered.yaml
          bash tests/harness/polyfin-private-pilot-contract-test.sh

      - name: Validate Argo AppProject namespace contract (rendered and nested Application namespaces)
        run: bash tests/harness/argo-project-namespaces-contract-test.sh

      - name: Validate argocd-app.yaml descriptors (schema, extraPaths, render equivalence, single generator)
        run: |
          bash scripts/check-argo-app-descriptors.sh
          bash tests/harness/argo-app-descriptors-contract-test.sh

      - name: Validate OKE images ship linux/arm64 (contract test, then the real OKE images)
        run: |
          bash tests/harness/oke-images-arm64-contract-test.sh
          bash scripts/check-oke-images-arm64.sh

      - name: Validate ARC GitOps contract
        run: bash tests/harness/arc-gitops-contract-test.sh

      - name: Validate Longhorn off-site PVC and retired Atlantis recovery volume contract
        run: bash tests/harness/longhorn-offsite-pvc-contract-test.sh

      - name: Validate D recovery contract (alerting, restore fixtures, storage classification)
        run: bash tests/harness/d-recovery-contract-test.sh

      - name: Validate Authentik human accounts contract (PLT-176)
        run: bash tests/harness/authentik-human-users-contract-test.sh
      - name: Validate Authentik friends access contract (PLT-176)
        run: bash tests/harness/authentik-friends-contract-test.sh

      - name: Validate agent-operator identity contract
        run: bash tests/agent-guard/agent-operator-identity-test.sh

      - name: Validate bootstrap shell
        run: bash -n scripts/bootstrap-cluster.sh
