name: Documentation integrity

on:
  pull_request:
  # Requis pour la merge queue (check requis docs-required).
  merge_group:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'docs/**'
      - 'website/**'
      - 'scripts/check-documentation-integrity.mjs'
      - 'tests/harness/documentation-integrity-test.mjs'
      - '.justfile'
      - 'package.json'
      - '.github/workflows/documentation-integrity.yaml'

permissions:
  contents: read

# A new push to a PR supersedes the previous run: cancel it to save runner time.
concurrency:
  group: documentation-integrity-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-required:
    name: docs-required
    # Stays GitHub-hosted (PLT-442): remark-lint-no-dead-urls checks arbitrary external URLs, which the
    # minimal egress of the kube-ops-pr-ci-arc scale set (no open internet) blocks; the job failed there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          # merge_group : head_sha == github.sha (commit de la file) ; explicite pour ne rien supposer d'un payload PR.
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          relevant=false
          # Capture the diff in a standalone assignment so git failures abort the job.
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            case "$file" in
              AGENTS.md|docs/*|website/*|package.json|.justfile|\
              scripts/check-documentation-integrity.mjs|\
              tests/harness/documentation-integrity-test.mjs|\
              .github/workflows/documentation-integrity.yaml)
                relevant=true
                ;;
            esac
          done <<< "$changed_files"
          echo "documentation_relevant=$relevant" >> "$GITHUB_OUTPUT"
          if [[ "$relevant" == true ]]; then
            echo 'DOCS_REQUIRED_CLASSIFICATION=documentation-change'
          else
            echo 'DOCS_REQUIRED_CLASSIFICATION=no-documentation-change'
          fi

      - name: Pass non-documentation changes explicitly
        if: steps.classify.outputs.documentation_relevant != 'true'
        run: echo 'DOCS_REQUIRED=PASS_NO_DOCUMENTATION_CHANGES'

      # Node is only needed when a documentation file changed (saves ~5 s on other PRs).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.classify.outputs.documentation_relevant == 'true'
        with:
          node-version: '26.13.1'

      - name: Run repository documentation integrity checks
        if: steps.classify.outputs.documentation_relevant == 'true'
        run: |
          npm run check:documentation
          node scripts/check-documentation-integrity.mjs --changed-from "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

      - name: Install website dependencies
        if: steps.classify.outputs.documentation_relevant == 'true'
        working-directory: website
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint Remark
        if: steps.classify.outputs.documentation_relevant == 'true'
        working-directory: website
        run: npm exec --no -- remark . -q

      - name: Typecheck documentation site
        if: steps.classify.outputs.documentation_relevant == 'true'
        working-directory: website
        run: npm run typecheck

      - name: Build Docusaurus and reject broken links
        if: steps.classify.outputs.documentation_relevant == 'true'
        working-directory: website
        run: npm run build
