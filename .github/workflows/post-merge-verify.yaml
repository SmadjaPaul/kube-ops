name: Post-merge verify

# PLT-390 lot 3. After a merge to main that touches an app: wait for Argo to reconcile that commit, run
# `just app-test APP NS --phase runtime`, and on FAIL open ONE auto-merge `git revert` PR, then notify via ntfy.
# Rules of PLT-141: no revert if the commit touches more than apps, if a newer commit touches the same app,
# for a revert itself, or if a revert was already attempted (escalation instead). BLOCKED => notification only.
#
# INERT until Paul sets the repository variable POST_MERGE_VERIFY_ENABLED=true (prerequisites in
# docs/operations/post-merge-verify.md). Triggered by push on main only: the self-hosted job never runs PR code.
#
# Three jobs, two identities, no Doppler and no kubeconfig:
#   verify    ARC runner in the cluster (scale set kube-ops-ci-arc), identity = its own ServiceAccount
#             kube-ops-post-merge (read-only RBAC, k8s/optional/github-actions-arc-kube-ops). Decides.
#   revert    GitHub-hosted, revert bot GitHub App token. Opens the revert PR. Never has cluster access.
#   announce  same runner. ntfy of the revert PR; the URL is read from one cluster Secret by the ServiceAccount.
#   alert     same runner. ntfy when verify, revert or announce failed or was cancelled (PLT-398): no silent failure.
#   verify-oke (PLT-407) ARC runner ON OKE (scale set kube-ops-oke-arc, arm64, k8s/clusters/oracle-a1/arc-runner),
#             identity = its own ServiceAccount kube-ops-post-merge-oke (read-only). Verifies the apps that have an
#             argocd-app.oracle-a1.yaml from inside oracle-a1; NOTIFY only (ntfy), never a revert. The homelab
#             runner verifies homelab apps only (--only-cluster): no homelab -> OKE access exists.
# A stateful app (PVC or CNPG) never gets an auto-merge revert: the decision is ESCALATE (PLT-398).

on:
  push:
    branches: [main]
    paths:
      - 'k8s/applications/**'
  # Drill / diagnosis on main code only: always --dry-run (no revert PR, no ntfy).
  workflow_dispatch:
    inputs:
      sha:
        description: 'Merge commit to verify (dry-run)'
        required: true

permissions:
  contents: read

concurrency:
  group: post-merge-verify-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ vars.POST_MERGE_VERIFY_ENABLED == 'true' }}
    runs-on: kube-ops-ci-arc
    timeout-minutes: 30
    # Read-only token for the loop guards (`gh pr list`, `gh api commits/<sha>/pulls`): without it gh fails (PLT-398).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      decision: ${{ steps.verify.outputs.decision }}
      reason: ${{ steps.verify.outputs.reason }}
      stateful: ${{ steps.verify.outputs.stateful }}
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and decide
        id: verify
        env:
          KUBECTL_RO_IN_CLUSTER: "1"
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_SHA: ${{ inputs.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          bash scripts/ci-install-tools.sh || { echo "::error::tool install failed: POST_MERGE=BLOCKED"; echo "decision=NOTIFY" >>"$GITHUB_OUTPUT"; echo "reason=tool_install_failed" >>"$GITHUB_OUTPUT"; exit 0; }
          export PATH="$HOME/.local/bin:$PATH"
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            git cat-file -e "${INPUT_SHA}^{commit}" || { echo "::error::unknown sha"; exit 1; }
            bash scripts/post-merge-verify.sh --dry-run --only-cluster homelab "$INPUT_SHA" --timeout 600 || true
          else
            # before..after: every commit of the push counts, not only the tip (PLT-398).
            bash scripts/post-merge-verify.sh --only-cluster homelab "$GITHUB_SHA" --timeout 600 --base "$EVENT_BEFORE" || true
          fi
  verify-oke:
    if: ${{ vars.POST_MERGE_VERIFY_ENABLED == 'true' }}
    runs-on: kube-ops-oke-arc
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the OKE apps from inside oracle-a1
        env:
          KUBECTL_RO_IN_CLUSTER: "1"
          KUBECTL_RO_IN_CLUSTER_CLUSTER: oracle-a1
          PM_NTFY_SECRET_NS: arc-runners-oke
          PM_NTFY_SECRET_NAME: ntfy-publish-url
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_SHA: ${{ inputs.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          bash scripts/ci-install-tools.sh || { echo "::error::tool install failed: POST_MERGE=BLOCKED"; exit 1; }
          export PATH="$HOME/.local/bin:$PATH"
          echo "RUNNER_ARCH=$(uname -m)"
          bash scripts/kubectl-ro.sh --cluster oracle-a1 auth whoami
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            git cat-file -e "${INPUT_SHA}^{commit}" || { echo "::error::unknown sha"; exit 1; }
            bash scripts/post-merge-verify.sh --dry-run --only-cluster oracle-a1 "$INPUT_SHA" --timeout 600 || true
          else
            bash scripts/post-merge-verify.sh --only-cluster oracle-a1 "$GITHUB_SHA" --timeout 600 --base "$EVENT_BEFORE" || true
          fi
  revert:
    needs: verify
    if: ${{ github.event_name == 'push' && needs.verify.outputs.decision == 'REVERT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    steps:
      - name: Mint the revert bot token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.REVERT_BOT_APP_ID }}
          private-key: ${{ secrets.REVERT_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - name: Open the revert PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ needs.verify.outputs.sha }}
          STATEFUL: ${{ needs.verify.outputs.stateful }}
          REASON: ${{ needs.verify.outputs.reason }}
        run: |
          set -euo pipefail
          git config user.name "kube-ops-revert-bot[bot]"
          git config user.email "kube-ops-revert-bot[bot]@users.noreply.github.com"
          st=(); [[ $STATEFUL == yes ]] && st=(--stateful)
          out=$(bash scripts/post-merge-revert.sh "$SHA" ${st[@]+"${st[@]}"} --reason "$REASON") || { echo "$out"; echo "pr=FAILED" >>"$GITHUB_OUTPUT"; exit 0; }
          echo "$out"
          echo "pr=$(sed -n 's/^REVERT_PR=//p' <<<"$out")" >>"$GITHUB_OUTPUT"
  announce:
    needs: [verify, revert]
    if: ${{ always() && github.event_name == 'push' && needs.verify.outputs.decision == 'REVERT' }}
    runs-on: kube-ops-ci-arc
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ntfy
        env:
          KUBECTL_RO_IN_CLUSTER: "1"
          PR: ${{ needs.revert.outputs.pr }}
          SHA: ${{ needs.verify.outputs.sha }}
          STATEFUL: ${{ needs.verify.outputs.stateful }}
        run: |
          bash scripts/ci-install-tools.sh
          export PATH="$HOME/.local/bin:$PATH"
          msg="app-test FAIL after merge ${SHA:0:12}. Revert PR: ${PR:-not created (see run ${GITHUB_RUN_ID})}. The revert does not restore data."
          [[ $STATEFUL == yes ]] && msg="$msg Stateful app: verify the migration."
          [[ ${PR:-FAILED} == FAILED || ${PR:-} == REFUSED* || ${PR:-} == CONFLICT* ]] && prio=urgent || prio=high
          bash scripts/post-merge-notify.sh "kube-ops post-merge REVERT" "$prio" "$msg"
  alert:
    # No silent failure (PLT-398): verify/revert/announce failed or was cancelled (timeout, runner lost) => ntfy.
    needs: [verify, verify-oke, revert, announce]
    if: ${{ always() && github.event_name == 'push' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: kube-ops-ci-arc
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ntfy
        env:
          KUBECTL_RO_IN_CLUSTER: "1"
          SHA: ${{ github.sha }}
          RESULTS: verify=${{ needs.verify.result }} verify-oke=${{ needs.verify-oke.result }} revert=${{ needs.revert.result }} announce=${{ needs.announce.result }}
        run: |
          bash scripts/ci-install-tools.sh
          export PATH="$HOME/.local/bin:$PATH"
          bash scripts/post-merge-notify.sh "kube-ops post-merge FAILED" urgent \
            "Post-merge verification did not complete for ${SHA:0:12} ($RESULTS). No revert was decided: check run ${GITHUB_RUN_ID}."
