name: Polyfin downstream candidate build

on:
  pull_request:
    paths:
      - '.github/workflows/polyfin-downstream-build.yaml'
      - '.github/polyfin/Dockerfile.v0.61.1-apt.patch'
      - '.github/polyfin/CVE-2026-76844-zlib-1.3.1.patch'
      - '.github/polyfin/poc-cve-2026-76844.c'
  workflow_dispatch:

# Pull requests only validate the upstream patch. They cannot publish images.
permissions:
  contents: read

jobs:
  verify-source-patch:
    name: Verify exact upstream tag and minimal patch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out GitOps source (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify upstream commit and Dockerfile-only patch
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/moodiness/polyfin.git upstream
          git -C upstream checkout --quiet --detach 2c1576329fba3546202a47f0f3a157cd7cb0623d
          test "$(git -C upstream rev-parse HEAD)" = 2c1576329fba3546202a47f0f3a157cd7cb0623d
          test "$(git -C upstream describe --tags --exact-match)" = v0.61.1
          git -C upstream apply --check "$GITHUB_WORKSPACE/.github/polyfin/Dockerfile.v0.61.1-apt.patch"
          git -C upstream apply "$GITHUB_WORKSPACE/.github/polyfin/Dockerfile.v0.61.1-apt.patch"
          git -C upstream diff --check
          test "$(git -C upstream diff --name-only)" = Dockerfile

      - name: Verify Debian Trixie zlib backport against upstream
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/madler/zlib.git zlib-upstream
          git -C zlib-upstream checkout --quiet --detach v1.3.1
          test "$(git -C zlib-upstream rev-parse HEAD)" = 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
          git -C zlib-upstream apply --check "$GITHUB_WORKSPACE/.github/polyfin/CVE-2026-76844-zlib-1.3.1.patch"
          git -C zlib-upstream apply "$GITHUB_WORKSPACE/.github/polyfin/CVE-2026-76844-zlib-1.3.1.patch"
          git -C zlib-upstream diff --check
          test "$(git -C zlib-upstream diff --name-only)" = gzwrite.c
          grep -q 'state->strm.avail_in = 0' zlib-upstream/gzwrite.c
          grep -q 'state->strm.next_in = state->in' zlib-upstream/gzwrite.c
          printf 'ZLIB_PATCH_SHA256=%s\n' "$(sha256sum "$GITHUB_WORKSPACE/.github/polyfin/CVE-2026-76844-zlib-1.3.1.patch" | awk '{print $1}')"

  build-scan-sign:
    if: github.event_name == 'workflow_dispatch'
    needs: verify-source-patch
    # Publishing is strictly manual and restricted to a trusted default-branch
    # workflow. The candidate is quarantined and is NEVER promoted here.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    name: Build, scan and sign Polyfin downstream candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      UPSTREAM_REPOSITORY: https://github.com/moodiness/polyfin.git
      UPSTREAM_TAG: v0.61.1
      UPSTREAM_COMMIT: 2c1576329fba3546202a47f0f3a157cd7cb0623d
      PATCH_FILE: .github/polyfin/Dockerfile.v0.61.1-apt.patch
      ZLIB_PATCH_FILE: .github/polyfin/CVE-2026-76844-zlib-1.3.1.patch
      ZLIB_POC_FILE: .github/polyfin/poc-cve-2026-76844.c
      ZLIB_SOURCE_VERSION: 1:1.3.dfsg+really1.3.1-1
      ZLIB_BASE_IMAGE: debian:trixie-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a
    steps:
      - name: Check out the GitOps repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out the exact upstream source commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$UPSTREAM_REPOSITORY" upstream
          git -C upstream checkout --quiet --detach "$UPSTREAM_COMMIT"
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          test "$(git -C upstream describe --tags --exact-match)" = "$UPSTREAM_TAG"

      - name: Apply and verify the minimal downstream Dockerfile patch
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream apply --check "$GITHUB_WORKSPACE/$PATCH_FILE"
          git -C upstream apply "$GITHUB_WORKSPACE/$PATCH_FILE"
          test "$(git -C upstream diff --name-only)" = Dockerfile
          git -C upstream diff --check
          printf 'PATCH_SHA256=%s\n' "$(sha256sum "$PATCH_FILE" | awk '{print $1}')"

      - name: Build Debian Trixie zlib backport and run proof tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e ZLIB_PATCH_FILE="$ZLIB_PATCH_FILE" \
            -e ZLIB_POC_FILE="$ZLIB_POC_FILE" \
            -e ZLIB_SOURCE_VERSION="$ZLIB_SOURCE_VERSION" \
            "$ZLIB_BASE_IMAGE" \
            bash -euxo pipefail -c '
              printf "%s\\n" \
                "Types: deb-src" \
                "URIs: http://deb.debian.org/debian" \
                "Suites: trixie trixie-updates" \
                "Components: main" \
                "Signed-By: /usr/share/keyrings/debian-archive-keyring.pgp" \
                > /etc/apt/sources.list.d/debian-src.sources
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential devscripts dpkg-dev ca-certificates patch \
                zlib1g-dev libasan8 libubsan1
              cp "/workspace/$ZLIB_PATCH_FILE" /tmp/CVE-2026-76844.patch
              cp "/workspace/$ZLIB_POC_FILE" /tmp/poc-cve-2026-76844.c

              ldconfig -p | awk "/libz.so.1 / {print \$4; exit}" | xargs -r cp -t /tmp
              before_lib="$(find /tmp -maxdepth 1 -name "libz.so.1*" -type f -print -quit)"
              readelf --dyn-syms --wide "$before_lib" | awk "\$4 == \"FUNC\" && \$7 != \"UND\" {print \$8}" | sort -u > /tmp/libz-before.symbols
              gcc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
                /tmp/poc-cve-2026-76844.c -o /tmp/poc-before -lz
              set +e
              ASAN_OPTIONS=abort_on_error=1:detect_leaks=0 /tmp/poc-before > /tmp/zlib-poc-before.log 2>&1
              before_rc=$?
              set -e
              test "$before_rc" -ne 0
              grep -Eq "AddressSanitizer|SEGV|runtime error" /tmp/zlib-poc-before.log

              apt-get build-dep -y "zlib=$ZLIB_SOURCE_VERSION"
              apt-get source "zlib=$ZLIB_SOURCE_VERSION"
              source_dir="$(find /workspace -mindepth 1 -maxdepth 1 -type d -name "zlib-*" -print -quit)"
              cd "$source_dir"
              patch -p1 < /tmp/CVE-2026-76844.patch
              ./configure --static --prefix=/tmp/zlib-check
              make -j"$(nproc)" check
              DEBEMAIL=polyfin-build@example.invalid DEBFULLNAME="Polyfin downstream" \
                dch --newversion "${ZLIB_SOURCE_VERSION}+polyfin1" --distribution trixie \
                "Backport CVE-2026-76844 gzwrite fix from upstream df84af2"
              dpkg-buildpackage -us -uc -b
              cp ../zlib1g_*.deb /workspace/zlib1g-backport.deb
              cp ../zlib1g-dev_*.deb /workspace/zlib1g-dev-backport.deb
              dpkg -i /workspace/zlib1g-backport.deb /workspace/zlib1g-dev-backport.deb
              test "$(dpkg-query -W -f="\${Version}" zlib1g)" = "1:1.3.dfsg+really1.3.1-1+polyfin1"
              gcc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
                /tmp/poc-cve-2026-76844.c -o /tmp/poc-after -lz
              ldd /tmp/poc-after | grep -F "libz.so.1"
              /tmp/poc-after > /tmp/zlib-poc-after.log 2>&1
              grep -q survived /tmp/zlib-poc-after.log
              ! grep -Eq "AddressSanitizer|runtime error|SEGV" /tmp/zlib-poc-after.log
              after_lib="$(ldconfig -p | awk "/libz.so.1 / {print \$4; exit}")"
              readelf --dyn-syms --wide "$after_lib" | awk "\$4 == \"FUNC\" && \$7 != \"UND\" {print \$8}" | sort -u > /tmp/libz-after.symbols
              diff -u /tmp/libz-before.symbols /tmp/libz-after.symbols
              dpkg-query -W -f="Package=\${Package}\\nVersion=\${Version}\\nArchitecture=\${Architecture}\\n" zlib1g > /workspace/zlib-package.txt
              cp /tmp/zlib-poc-before.log /workspace/zlib-poc-before.log
              cp /tmp/zlib-poc-after.log /workspace/zlib-poc-after.log
              cp /tmp/libz-before.symbols /workspace/libz-before.symbols
              cp /tmp/libz-after.symbols /workspace/libz-after.symbols
            '
          cp "$ZLIB_PATCH_FILE" upstream/CVE-2026-76844-zlib-1.3.1.patch
          cp "$ZLIB_POC_FILE" upstream/poc-cve-2026-76844.c
          cp zlib1g-backport.deb upstream/zlib1g-backport.deb

      - name: Derive immutable candidate reference
        shell: bash
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/polyfin-downstream"
          # Each manual attempt gets a unique non-overwritten tag.
          tag="0.61.1-zlib-backport-${GITHUB_SHA::12}-run${GITHUB_RUN_ID}-attempt${GITHUB_RUN_ATTEMPT}"
          {
            echo "IMAGE_REPOSITORY=$repository"
            echo "IMAGE_TAG=$tag"
            echo "IMAGE_REF=$repository:$tag"
          } >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the linux/amd64 candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: upstream
          file: upstream/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REF }}
          provenance: mode=max
          sbom: true

      - name: Generate an explicit SPDX SBOM for the immutable digest
        uses: anchore/sbom-action@cee1b8e05ae5b2593a75e197229729eabaa9f8ec # v0.20.2
        with:
          image: ${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: polyfin-sbom.spdx.json
          upload-artifact: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign and verify the immutable candidate digest
        shell: bash
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          digest='${{ steps.build.outputs.digest }}'
          cosign sign "$IMAGE_REPOSITORY@$digest"
          cosign verify \
            --certificate-identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/polyfin-downstream-build.yaml@${GITHUB_REF}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "$IMAGE_REPOSITORY@$digest" > polyfin-cosign-verify.json

      - name: Publish GitHub build provenance for the digest
        uses: actions/attest-build-provenance@bd77c077858b8d561b7a36cbe48ef4cc642ca39d # v2.2.2
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Scan the exact candidate digest with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
          version: v0.76.1
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          format: json
          output: polyfin-candidate-trivy.json
          timeout: 15m
        env:
          TRIVY_PLATFORM: linux/amd64

      - name: Classify remediation and residual risk
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.Results[]? | .Target as $target | .Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL") | [$target, .VulnerabilityID, .PkgName, .InstalledVersion, (.FixedVersion // "UNFIXED"), .Severity, (.Status // "UNKNOWN")] | @tsv' polyfin-candidate-trivy.json > polyfin-candidate-findings.tsv
          fixable=$'CVE-2026-109518'
          : > polyfin-remediation.tsv
          while IFS= read -r cve; do
            if grep -Fq $'\t'"$cve"$'\t' polyfin-candidate-findings.tsv; then
              printf '%s\tRESIDUAL\n' "$cve" >> polyfin-remediation.tsv
            else
              printf '%s\tELIMINATED\n' "$cve" >> polyfin-remediation.tsv
            fi
          done <<< "$fixable"
          unique="$(cut -f2 polyfin-candidate-findings.tsv | sort -u | sed '/^$/d' | wc -l | tr -d ' ')"
          occurrences="$(wc -l < polyfin-candidate-findings.tsv | tr -d ' ')"
          eliminated="$(grep -c $'\tELIMINATED$' polyfin-remediation.tsv || true)"
          zlib_status='VERIFIED_ABSENT_FROM_TRIVY'
          if grep -Fq $'\tCVE-2026-76844\t' polyfin-candidate-findings.tsv; then
            zlib_status='REPORTED_AFTER_VERIFIED_BACKPORT'
          fi
          zlib_package_version="$(awk -F= '$1 == "Version" {print $2}' zlib-package.txt)"
          {
            echo '## Polyfin downstream candidate security result'
            echo "Candidate: \`$IMAGE_REPOSITORY@${{ steps.build.outputs.digest }}\`"
            echo 'Target: linux/amd64; Trivy v0.76.1; OS and library; unfixed findings included.'
            echo "HIGH/CRITICAL occurrences: **$occurrences**; unique CVEs: **$unique**."
            echo "Correctable CVEs eliminated: **$eliminated/6**."
            echo "zlib package: `$zlib_package_version`; CVE-2026-76844 status: **$zlib_status**."
            echo ''
            echo 'Per-CVE remediation:'
            echo '~~~text'
            cat polyfin-remediation.tsv
            echo '~~~'
            echo ''
            echo 'Residual findings are not waived by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
          jq -n \
            --arg source "$UPSTREAM_COMMIT" \
            --arg tag "$UPSTREAM_TAG" \
            --arg patch "$(sha256sum "$PATCH_FILE" | awk '{print $1}')" \
            --arg image "$IMAGE_REPOSITORY" \
            --arg digest '${{ steps.build.outputs.digest }}' \
            --arg sbom "$(sha256sum polyfin-sbom.spdx.json | awk '{print $1}')" \
            --argjson occurrences "$occurrences" \
            --argjson uniqueCves "$unique" \
            --argjson eliminated "$eliminated" \
            --arg zlibPatch "$(sha256sum "$ZLIB_PATCH_FILE" | awk '{print $1}')" \
            --arg zlibPackage "$zlib_package_version" \
            --arg zlibStatus "$zlib_status" \
            '{upstreamTag:$tag,upstreamCommit:$source,dockerfilePatchSha256:$patch,zlibPatchSha256:$zlibPatch,zlibPackageVersion:$zlibPackage,zlibCveStatus:$zlibStatus,image:$image,digest:$digest,sbomSha256:$sbom,trivy:"0.76.1",platform:"linux/amd64",highCriticalOccurrences:$occurrences,uniqueCves:$uniqueCves,correctableCvesEliminated:$eliminated,admission:"NO-GO-until-residual-risk-approved"}' \
            > polyfin-candidate-metadata.json

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polyfin-downstream-candidate-${{ github.sha }}
          path: |
            polyfin-candidate-metadata.json
            polyfin-sbom.spdx.json
            polyfin-cosign-verify.json
            polyfin-candidate-trivy.json
            polyfin-candidate-findings.tsv
            polyfin-remediation.tsv
            zlib-package.txt
            zlib-poc-before.log
            zlib-poc-after.log
            libz-before.symbols
            libz-after.symbols
          if-no-files-found: error
          retention-days: 30

      - name: Keep admission blocked while residual severe findings exist
        shell: bash
        run: |
          set -euo pipefail
          if grep -q $'\tRESIDUAL$' polyfin-remediation.tsv; then
            echo '::error::At least one of the six targeted CVEs remains in the candidate; admission is NO-GO'
            exit 1
          fi
          if [[ -s polyfin-candidate-findings.tsv ]]; then
            echo '::error::Residual HIGH/CRITICAL findings remain; no waiver is applied'
            exit 1
          fi
