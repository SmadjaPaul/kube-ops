name: Workflow integrity

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  protected-automation:
    name: workflow-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out the base revision only
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Reject unqualified workflow and gate changes
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin \
            "pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}"

          head_ref="refs/remotes/origin/pr-${PR_NUMBER}"
          changed_files="$(git diff --name-only "$BASE_SHA" "$head_ref")"
          blocked_files=()

          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            case "$file" in
              .github/workflows/*|.github/actions/*|.justfile|\
              scripts/check-*.sh|tests/harness/*|\
              docs/contracts/agent-test-result-v1.schema.json)
                blocked_files+=("$file")
                ;;
              package.json)
                package_diff="$(git diff --unified=0 "$BASE_SHA" "$head_ref" -- package.json)"
                invalid_package_changes="$(
                  printf '%s\n' "$package_diff" |
                    awk '
                      /^@@/ || /^---/ || /^\+\+\+/ { next }
                      /^[+-]/ {
                        line = substr($0, 2)
                        if (line ~ /^[[:space:]]*"@commitlint\/(cli|config-conventional)"[[:space:]]*:[[:space:]]*"\^?[0-9]+\.[0-9]+\.[0-9]+"[[:space:]]*,?[[:space:]]*$/) {
                          next
                        }
                        print
                      }
                    '
                )"
                if [[ -n "$invalid_package_changes" ]]; then
                  blocked_files+=("$file")
                fi
                ;;
            esac
          done <<< "$changed_files"

          if ((${#blocked_files[@]} > 0)); then
            printf 'WORKFLOW_INTEGRITY=FAIL\n'
            printf 'UNQUALIFIED_AUTOMATION_CHANGES=%s\n' \
              "$(printf '%s\n' "${blocked_files[@]}" | sort -u | paste -sd, -)"
            exit 1
          fi

          printf 'WORKFLOW_INTEGRITY=PASS\n'
