name: Workflow integrity

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  protected-automation:
    name: workflow-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out the base revision only
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Verify admission from trusted base revision
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}"
          python3 -m unittest discover \
            -s .github/actions/workflow-integrity -p 'test_*.py'
          python3 .github/actions/workflow-integrity/verify.py \
            --repo "$GITHUB_REPOSITORY" \
            --base-ref "$BASE_REF" \
            --base-sha "$BASE_SHA" \
            --pr "$PR_NUMBER" \
            --sha "$PR_HEAD_SHA" \
            --author "$PR_AUTHOR" \
            --head-repo "$PR_HEAD_REPO" \
            --head-ref "refs/remotes/origin/pr-${PR_NUMBER}"
