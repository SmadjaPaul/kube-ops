name: E2E Static

on:
  pull_request:
    paths:
      - 'tests/e2e/**'
      - 'k8s/infrastructure/monitoring/blackbox/**'
      - 'k8s/infrastructure/auth/authentik/extra/**'
      - '.github/workflows/e2e-static.yaml'
  push:
    branches: [main]
    paths:
      - 'tests/e2e/**'
      - 'k8s/infrastructure/monitoring/blackbox/**'
      - 'k8s/infrastructure/auth/authentik/extra/**'
      - '.github/workflows/e2e-static.yaml'

permissions:
  contents: read

jobs:
  validate-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - name: Install pinned Playwright package
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Discover browser tests
        run: npm run list
