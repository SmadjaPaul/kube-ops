name: apps-generated contract

# Tests négatifs de la frontière apps-generated : aucune application rendue par le
# golden path ne doit obtenir de privilège cluster-wide. Voir tests/apps-generated/run.py.

on:
  pull_request:
    paths:
      - 'k8s/bootstrap/argocd-root/**'
      - 'k8s/infrastructure/security/policies/**'
      - 'k8s/applications/**'
      - 'tests/apps-generated/**'
      - '.github/workflows/apps-generated-contract.yaml'
  push:
    branches: [main]
    paths:
      - 'k8s/bootstrap/argocd-root/**'
      - 'k8s/infrastructure/security/policies/**'
      - 'k8s/applications/**'
      - 'tests/apps-generated/**'
      - '.github/workflows/apps-generated-contract.yaml'

permissions:
  contents: read

jobs:
  apps-generated-negative-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Kustomize
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSLo /tmp/kustomize.tgz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tgz -C /tmp
          sudo install -m 0755 /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Install Helm (inflation of the applications roots)
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSLo /tmp/helm.tgz https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Install Kyverno CLI (pinned, sha256 from the v1.20.0 release digest)
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSLo /tmp/kyverno.tgz https://github.com/kyverno/kyverno/releases/download/v1.20.0/kyverno-cli_v1.20.0_linux_x86_64.tar.gz
          echo "06b8f3ca7b5626473be8fb4d343ad54ab84e317142766f72420e7d44b80942e2  /tmp/kyverno.tgz" | sha256sum -c -
          mkdir -p /tmp/kyverno-cli && tar -xzf /tmp/kyverno.tgz -C /tmp/kyverno-cli
          sudo install -m 0755 /tmp/kyverno-cli/kyverno /usr/local/bin/kyverno
          kyverno version

      - name: Install PyYAML
        run: sudo apt-get install -y python3-yaml

      - name: Run apps-generated negative tests
        run: python3 tests/apps-generated/run.py
