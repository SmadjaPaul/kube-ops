# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# yamllint disable-file
# Genere par golden-path service-postgres-oidc@v1 pour ${{ values.name }}.
---
version: 1
metadata:
  name: Apps - ${{ values.name }}
entries:
  - id: ${{ values.name }}_provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers: {name: k8s.smadja.dev/catalog/${{ values.name }}}
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "default-provider-invalidation-flow"]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      client_type: confidential
      grant_types: [authorization_code]
      client_id: ${{ values.name }}
      client_secret: !Env ${{ values.oidcEnvKey }}
      redirect_uris:
        - {url: "https://${{ values.hostname }}${{ values.callbackPath }}", matching_mode: strict}
      property_mappings:
{% for s in values.oidcScopes %}
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "${{ s }}"]]
{% endfor %}
  - id: ${{ values.name }}_application
    model: authentik_core.application
    identifiers: {slug: ${{ values.name }}}
    attrs:
      name: ${{ values.name }}
      group: Homelab
      meta_launch_url: "https://${{ values.hostname }}"
      provider: !KeyOf ${{ values.name }}_provider
      policy_engine_mode: any
{% for g in values.accessGroups %}
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf ${{ values.name }}_application
      group: !Find [authentik_core.group, [name, "${{ g }}"]]
    attrs: {order: ${{ loop.index * 10 }}}
{% endfor %}
