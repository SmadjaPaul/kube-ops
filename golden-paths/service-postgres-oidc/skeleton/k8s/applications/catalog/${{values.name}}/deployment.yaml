apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.name }}
  labels:
    app.kubernetes.io/name: ${{ values.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ${{ values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${{ values.name }}
    spec:
      serviceAccountName: ${{ values.name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: ${{ values.image }}
          ports:
            - {name: http, containerPort: ${{ values.containerPort }}}
          env:
            - {name: GF_SERVER_HTTP_PORT, value: "${{ values.containerPort }}"}
            - {name: GF_SERVER_ROOT_URL, value: "https://${{ values.hostname }}/"}
            - {name: GF_DATABASE_TYPE, value: postgres}
            - {name: GF_DATABASE_HOST, value: "pg-shared-homelab-rw.databases.svc.cluster.local:5432"}
            - {name: GF_DATABASE_NAME, value: "${{ values.pgDatabase }}"}
            - {name: GF_DATABASE_USER, value: "${{ values.pgDatabase }}"}
            - {name: GF_DATABASE_SSL_MODE, value: require}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_AUTH_GENERIC_OAUTH_ENABLED, value: "true"}
            - {name: GF_AUTH_GENERIC_OAUTH_NAME, value: Authentik}
            - {name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID, value: "${{ values.name }}"}
            - {name: GF_AUTH_GENERIC_OAUTH_SCOPES, value: "${{ values.oidcScopes | join(' ') }}"}
            - {name: GF_AUTH_GENERIC_OAUTH_AUTH_URL, value: "https://auth.smadja.dev/application/o/${{ values.name }}/authorize/"}
            - {name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL, value: "https://auth.smadja.dev/application/o/${{ values.name }}/token/"}
            - {name: GF_AUTH_GENERIC_OAUTH_API_URL, value: "https://auth.smadja.dev/application/o/${{ values.name }}/userinfo/"}
            - {name: GF_AUTH_GENERIC_OAUTH_USE_PKCE, value: "true"}
          envFrom:
            - secretRef: {name: ${{ values.name }}-db}
            - secretRef: {name: ${{ values.name }}-oidc}
            - secretRef: {name: ${{ values.name }}-secret-key}
            - secretRef: {name: ${{ values.name }}-admin}
          readinessProbe:
            httpGet: {path: "${{ values.healthPath }}", port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: "${{ values.healthPath }}", port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "${{ values.cpuRequestMillicores }}m"
              memory: "${{ values.memoryRequestMi }}Mi"
            limits:
              cpu: "${{ values.cpuLimitMillicores }}m"
              memory: "${{ values.memoryLimitMi }}Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: grafana-data, mountPath: /var/lib/grafana}
            - {name: grafana-logs, mountPath: /var/log/grafana}
            - {name: tmp, mountPath: /tmp}
      volumes:
        # Etat durable dans PostgreSQL : ces volumes sont des emptyDir (plugins, cache).
        - {name: grafana-data, emptyDir: {}}
        - {name: grafana-logs, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
