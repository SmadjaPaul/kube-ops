apiVersion: v1
kind: Service
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.name }}
spec:
  selector: {app.kubernetes.io/name: ${{ values.name }}}
  ports:
    - {name: http, port: 80, targetPort: http}
---
# Exposition interne uniquement : Gateway/internal (exposure = internal, non negociable dans le pilote).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.name }}
spec:
  parentRefs:
    - {name: internal, namespace: gateway}
  hostnames: ["${{ values.hostname }}"]
  rules:
    - backendRefs:
        - {name: ${{ values.name }}, port: 80}
