# Distribution des credentials sans donner de Secret au pod.
# - SA dedie aux SecretStore ESO (PAS le SA du pod, qui n'a aucun droit sur les Secrets).
# - SecretStore pg-source : lit UNIQUEMENT pg-shared-homelab-${{ values.name }} dans databases (Role get, resourceNames).
# - SecretStore auth-source : lit UNIQUEMENT authentik-blueprint-${{ values.name }} dans auth (Role get, resourceNames).
# - Secrets propres a l'application : generes dans le namespace (Password CreatedOnce), aucun Secret tiers.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ values.name }}-secret-reader
  namespace: ${{ values.name }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ${{ values.name }}-pg-source
  namespace: ${{ values.name }}
spec:
  provider:
    kubernetes:
      remoteNamespace: databases
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: ${{ values.name }}-secret-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ${{ values.name }}-auth-source
  namespace: ${{ values.name }}
spec:
  provider:
    kubernetes:
      remoteNamespace: auth
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: ${{ values.name }}-secret-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${{ values.name }}-db
  namespace: ${{ values.name }}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: ${{ values.name }}-pg-source, kind: SecretStore}
  target:
    name: ${{ values.name }}-db
    creationPolicy: Orphan
    template:
      engineVersion: v2
      type: Opaque
      data:
        GF_DATABASE_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: {key: pg-shared-homelab-${{ values.name }}, property: password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${{ values.name }}-oidc
  namespace: ${{ values.name }}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: ${{ values.name }}-auth-source, kind: SecretStore}
  target:
    name: ${{ values.name }}-oidc
    creationPolicy: Orphan
    template:
      engineVersion: v2
      type: Opaque
      data:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef: {key: authentik-blueprint-${{ values.name }}, property: ${{ values.oidcEnvKey }}}
---
# Secrets internes de l'application (chiffrement et mot de passe admin local), generes une fois.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${{ values.name }}-secret-key
  namespace: ${{ values.name }}
spec:
  length: 64
  digits: 10
  symbols: 0
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${{ values.name }}-admin
  namespace: ${{ values.name }}
spec:
  length: 40
  digits: 8
  symbols: 0
  allowRepeat: true
---
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${{ values.name }}-secret-key
  namespace: ${{ values.name }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: ${{ values.name }}-secret-key
    creationPolicy: Orphan
    template:
      engineVersion: v2
      type: Opaque
      data:
        GF_SECURITY_SECRET_KEY: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${{ values.name }}-secret-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${{ values.name }}-admin
  namespace: ${{ values.name }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: ${{ values.name }}-admin
    creationPolicy: Orphan
    template:
      engineVersion: v2
      type: Opaque
      data:
        GF_SECURITY_ADMIN_PASSWORD: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${{ values.name }}-admin
