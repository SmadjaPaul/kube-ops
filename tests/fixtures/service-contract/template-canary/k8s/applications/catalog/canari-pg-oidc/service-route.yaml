apiVersion: v1
kind: Service
metadata:
  name: canari-pg-oidc
  namespace: canari-pg-oidc
spec:
  selector: {app.kubernetes.io/name: canari-pg-oidc}
  ports:
    - {name: http, port: 80, targetPort: http}
---
# Exposition interne uniquement : Gateway/internal (exposure = internal, non negociable dans le pilote).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: canari-pg-oidc
  namespace: canari-pg-oidc
spec:
  parentRefs:
    - {name: internal, namespace: gateway}
  hostnames: ["canari-pg-oidc.smadja.dev"]
  rules:
    - backendRefs:
        - {name: canari-pg-oidc, port: 80}
