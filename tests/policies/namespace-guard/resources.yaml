apiVersion: v1
kind: Pod
metadata:
  name: pod-low-priority
  namespace: pr-7-demo
spec:
  containers:
  - image: registry.example/app:1.2.3
    name: main
    resources:
      limits:
        cpu: 100m
        memory: 64Mi
      requests:
        cpu: 10m
        memory: 32Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
  priorityClassName: preview-low
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  volumes:
  - emptyDir:
      sizeLimit: 64Mi
    name: tmp
