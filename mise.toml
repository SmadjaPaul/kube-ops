# Repository toolchain contract (tool-portability design, batch 4, PLT-484).
# Exact versions, locked in mise.lock for macos-arm64, linux-x64 and linux-arm64
# (`mise lock --platform macos-arm64,linux-x64,linux-arm64`); install with `mise install --locked`.
# Versions match images/arc-ci-runner/mise.lock (the CI runner) and the repo's own pins
# (.nvmrc, package.json engines, .pre-commit-config.yaml). Recipes stay in .justfile.
# No secrets here: [env] only carries non-sensitive tool settings.
[env]
MISE_AUTO_UPDATE = "false"

[tools]
node = "26.13.1"        # .nvmrc, package.json engines (bundles npm)
python = "3.12.13"      # tests/harness/*.py, scripts
just = "1.59.0"         # .justfile
jq = "1.8.2"
yq = "4.54.3"           # scripts/ci-install-tools.sh pin
kustomize = "5.8.3"
helm = "4.3.2"
kubeconform = "0.8.0"
kyverno = "1.20.0"      # scripts/policy-check.sh
kubectl = "1.37.2"      # scripts/ci-install-tools.sh pin; read-only access via scripts/kubectl-ro.sh
shellcheck = "0.11.0"
ripgrep = "14.1.1"
vale = "3.28.1"         # .pre-commit-config.yaml (errata-ai/vale v3.28.1)
prek = "0.5.11"         # runs .pre-commit-config.yaml

[settings]
lockfile = true
