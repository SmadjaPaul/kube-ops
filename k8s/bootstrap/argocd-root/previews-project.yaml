apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: previews
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: previews
    app.kubernetes.io/managed-by: argocd
spec:
  description: Per-PR preview environments (PLT-390), namespaces pr-* only
  sourceRepos:
    - https://github.com/SmadjaPaul/kube-ops.git
  destinations:
    - namespace: 'pr-*'
      server: https://kubernetes.default.svc
  # No clusterResourceWhitelist: a preview cannot create any cluster-scoped
  # object. The namespace itself comes from the CreateNamespace sync option.
  # Explicit allow-list (PLT-395): nothing else is admitted, so a PR cannot add a
  # CiliumNetworkPolicy (additive, would open Internet/LAN/pg-shared), a Role or
  # RoleBinding, a Kyverno or networking.k8s.io object, a GRPCRoute or any other
  # Route. The platform guardrails (quota, limits, CiliumNetworkPolicy) come from
  # main through the separate AppProject previews-guardrails.
  namespaceResourceWhitelist:
    - {group: apps, kind: Deployment}
    - {group: apps, kind: StatefulSet}
    - {group: batch, kind: Job}
    - {group: batch, kind: CronJob}
    - {group: '', kind: Service}
    - {group: '', kind: ConfigMap}
    - {group: '', kind: Secret}
    - {group: '', kind: PersistentVolumeClaim}
    - {group: '', kind: ServiceAccount}
    - {group: policy, kind: PodDisruptionBudget}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute}
    - {group: external-secrets.io, kind: ExternalSecret}
    - {group: generators.external-secrets.io, kind: Password}
  # Defence in depth, redundant with the allow-list above. Never in a preview:
  # cross-namespace grants, non-HTTP routes, backups.
  namespaceResourceBlacklist:
    - group: gateway.networking.k8s.io
      kind: ReferenceGrant
    - group: gateway.networking.k8s.io
      kind: TCPRoute
    - group: gateway.networking.k8s.io
      kind: UDPRoute
    - group: gateway.networking.k8s.io
      kind: TLSRoute
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
    - group: velero.io
      kind: '*'
    - group: postgresql.cnpg.io
      kind: ScheduledBackup
    - group: postgresql.cnpg.io
      kind: Backup
    - group: barmancloud.cnpg.io
      kind: ObjectStore
    # No shared database: a preview never gets a pg-shared-homelab role or base.
    - group: postgresql.cnpg.io
      kind: Database
    # No store of its own and no push: secrets come from in-namespace generators.
    - group: external-secrets.io
      kind: SecretStore
    - group: external-secrets.io
      kind: PushSecret
  orphanedResources:
    warn: false
---
# Platform guardrails of a preview (ResourceQuota, LimitRange, CiliumNetworkPolicy),
# read from main only. Separate project because an AppProject allow-list is not
# per source: the workload project `previews` must not admit cilium.io objects.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: previews-guardrails
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: previews
    app.kubernetes.io/managed-by: argocd
spec:
  description: Guardrails of per-PR preview namespaces (PLT-395), from main, namespaces pr-* only
  sourceRepos:
    - https://github.com/SmadjaPaul/kube-ops.git
  destinations:
    - namespace: 'pr-*'
      server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
    - {group: '', kind: ResourceQuota}
    - {group: '', kind: LimitRange}
    - {group: cilium.io, kind: CiliumNetworkPolicy}
  orphanedResources:
    warn: false
