apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  namespace: argocd
  name: applications
  labels:
    app.kubernetes.io/part-of: applications
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  generators:
    - git:
        repoURL: https://github.com/SmadjaPaul/kube-ops.git
        revision: main
        # PLT-394 : tous les domaines sont migres vers apps (descripteurs argocd-app.yaml) ; cet
        # ApplicationSet ne genere plus aucune Application. Entree d'exclusion seule (un
        # generateur git sans directories est invalide) en attendant la suppression de
        # l'ApplicationSet (lane PLT-394, hors de cette PR).
        directories:
          - path: k8s/applications/media
            exclude: true
  # Retrait sans cascade : la suppression d'une Application générée par cet ApplicationSet
  # ne supprime plus ses ressources (pas de finalizer resources-finalizer à la génération,
  # et retrait du finalizer des Applications existantes au prochain reconcile).
  # Voir le corps de PR : impact runtime listé.
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: 'apps-{{ path.basename }}'
      namespace: argocd
      labels:
        app.kubernetes.io/component: 'static-applications'
        app.kubernetes.io/part-of: applications
    spec:
      project: applications
      source:
        repoURL: https://github.com/SmadjaPaul/kube-ops.git
        targetRevision: main
        path: '{{ path }}'
        kustomize: {}
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 3
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - PruneLast=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
