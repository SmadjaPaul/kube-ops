apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  namespace: argocd
  name: applications
  labels:
    app.kubernetes.io/part-of: applications
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  generators:
    - git:
        repoURL: https://github.com/SmadjaPaul/kube-ops.git
        revision: main
        directories:
          - path: k8s/applications/media
          - path: k8s/applications/tools
          - path: k8s/applications/ai
          - path: k8s/applications/web
          - path: k8s/applications/automation
          - path: k8s/applications/games
          # Business workloads are activated progressively, one Argo Application
          # per app so an unhealthy app does not block its peers.
          - path: k8s/applications/business/listmonk
          - path: k8s/applications/business/stalwart
          - path: k8s/applications/business/bulwark
          - path: k8s/applications/business/twenty
          - path: k8s/applications/business/chatwoot
          - path: k8s/applications/business/messages
          - path: k8s/applications/catalog
          - path: k8s/applications/restore
  template:
    metadata:
      name: 'apps-{{ path.basename }}'
      namespace: argocd
      labels:
        app.kubernetes.io/component: 'static-applications'
        app.kubernetes.io/part-of: applications
    spec:
      project: applications
      source:
        repoURL: https://github.com/SmadjaPaul/kube-ops.git
        targetRevision: main
        path: '{{ path }}'
        kustomize: {}
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 1
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - PruneLast=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
