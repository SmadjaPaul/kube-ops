apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  namespace: argocd
  name: applications
  labels:
    app.kubernetes.io/part-of: applications
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  generators:
    - git:
        repoURL: https://github.com/SmadjaPaul/kube-ops.git
        revision: main
        directories:
          - path: k8s/applications/media
          - path: k8s/applications/tools
          - path: k8s/applications/ai
          - path: k8s/applications/web
          - path: k8s/applications/automation
          - path: k8s/applications/games
          - path: k8s/applications/business/invoice-ninja
          - path: k8s/applications/catalog
          - path: k8s/applications/platform
  # Retrait sans cascade : la suppression d'une Application générée par cet ApplicationSet
  # ne supprime plus ses ressources (pas de finalizer resources-finalizer à la génération,
  # et retrait du finalizer des Applications existantes au prochain reconcile).
  # Voir le corps de PR : impact runtime listé.
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: 'apps-{{ path.basename }}'
      namespace: argocd
      labels:
        app.kubernetes.io/component: 'static-applications'
        app.kubernetes.io/part-of: applications
    spec:
      project: applications
      source:
        repoURL: https://github.com/SmadjaPaul/kube-ops.git
        targetRevision: main
        path: '{{ path }}'
        kustomize: {}
      ignoreDifferences:
        # PLT-140 shadow: only the two Rollouts-owned hash selectors.
        - group: ""
          kind: Service
          namespace: gpt-researcher
          name: ws-rewriter-rollout-active
          jsonPointers:
            - /spec/selector/rollouts-pod-template-hash
        - group: ""
          kind: Service
          namespace: gpt-researcher
          name: ws-rewriter-rollout-preview
          jsonPointers:
            - /spec/selector/rollouts-pod-template-hash
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 3
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - PruneLast=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
