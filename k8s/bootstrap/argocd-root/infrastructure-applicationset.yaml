apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  namespace: argocd
  name: infrastructure
  labels:
    app.kubernetes.io/part-of: infrastructure
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
spec:
  generators:
    - git:
        repoURL: https://github.com/SmadjaPaul/kube-ops.git
        revision: main
        directories:
          - path: k8s/infrastructure/controllers
          - path: k8s/infrastructure/network
          - path: k8s/infrastructure/storage
          - path: k8s/infrastructure/monitoring
          - path: k8s/infrastructure/deployment
          - path: k8s/infrastructure/auth
          - path: k8s/infrastructure/database
          - path: k8s/infrastructure/security
          - path: k8s/infrastructure/previews
          - path: k8s/optional/github-actions-arc
          - path: k8s/optional/github-actions-arc-homelab-infra
          - path: k8s/optional/github-actions-arc-website
          - path: k8s/optional/github-actions-arc-kube-ops
          - path: k8s/optional/github-actions-arc-homelab-iac-pilot
  # Retrait sans cascade : la suppression d'une Application générée par cet ApplicationSet
  # ne supprime plus ses ressources (pas de finalizer resources-finalizer à la génération,
  # et retrait du finalizer des Applications existantes au prochain reconcile).
  # Voir le corps de PR : impact runtime listé.
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: 'infra-{{ path.basename }}'
      namespace: argocd
      labels:
        app.kubernetes.io/component: 'static-infrastructure'
        app.kubernetes.io/part-of: infrastructure
    spec:
      project: infrastructure
      source:
        repoURL: https://github.com/SmadjaPaul/kube-ops.git
        targetRevision: main
        path: '{{ path }}'
        kustomize: {}
      # PLT-213: External Secrets (creationPolicy Merge) copies the ExternalSecret's
      # Argo tracking-id onto argocd-secret, so it never equals the Secret's own
      # id and the app stays OutOfSync. Exact name and one annotation only.
      ignoreDifferences:
        - group: ""
          kind: Secret
          namespace: argocd
          name: argocd-secret
          jsonPointers:
            - /metadata/annotations/argocd.argoproj.io~1tracking-id
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
          - PruneLast=true
          - RespectIgnoreDifferences=true
