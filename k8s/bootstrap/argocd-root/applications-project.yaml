apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: applications
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: applications
    app.kubernetes.io/managed-by: argocd
spec:
  description: User workloads reconciled from the canonical kube-ops repository
  sourceRepos:
    - https://github.com/SmadjaPaul/kube-ops.git
    - https://github.com/CodeWithCJ/SparkyFitness.git
    - ghcr.io/actions/actions-runner-controller-charts
  destinations:
    # Applications use an empty destination namespace because their rendered
    # manifests carry explicit namespaces; this is not a wildcard namespace.
    - namespace: ''
      server: https://kubernetes.default.svc
    # Keep orphan monitoring limited to namespaces rendered by the application
    # roots. Restore drills and cluster-owned namespaces are not application
    # project scope and must not amplify every Application warning.
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: arc-runners
      server: https://kubernetes.default.svc
    - namespace: agentgateway
      server: https://kubernetes.default.svc
    - namespace: executor
      server: https://kubernetes.default.svc
    - namespace: factory-platform
      server: https://kubernetes.default.svc
    - namespace: gpt-researcher
      server: https://kubernetes.default.svc
    - namespace: home-assistant
      server: https://kubernetes.default.svc
    - namespace: hindsight-personal
      server: https://kubernetes.default.svc
    - namespace: hindsight-restore-20261110
      server: https://kubernetes.default.svc
    - namespace: immich
      server: https://kubernetes.default.svc
    # PLT-243: temporary isolated R2 restore drill of immich/immich-postgresql;
    # removed by PR once the drill root is pruned.
    - namespace: immich-drill
      server: https://kubernetes.default.svc
    - namespace: invoice-ninja
      server: https://kubernetes.default.svc
    - namespace: it-tools
      server: https://kubernetes.default.svc
    # PLT-181: LibreChat namespace resources are rendered by apps-ai; the
    # Application itself is owned by AppProject personal-ai-pilot.
    - namespace: librechat
      server: https://kubernetes.default.svc
    # PLT-141: isolated opt-in Rollouts fixture; never grant tenant namespaces broadly.
    - namespace: argo-rollouts-demo
      server: https://kubernetes.default.svc
    - namespace: karakeep
      server: https://kubernetes.default.svc
    - namespace: mastra-factory
      server: https://kubernetes.default.svc
    - namespace: mastra-sandbox
      server: https://kubernetes.default.svc
    - namespace: matrix
      server: https://kubernetes.default.svc
    - namespace: mealie
      server: https://kubernetes.default.svc
    - namespace: media
      server: https://kubernetes.default.svc
    - namespace: mqtt
      server: https://kubernetes.default.svc
    - namespace: ntfy
      server: https://kubernetes.default.svc
    - namespace: open-connector
      server: https://kubernetes.default.svc
    - namespace: opencode
      server: https://kubernetes.default.svc
    - namespace: paperless
      server: https://kubernetes.default.svc
    - namespace: pinepods
      server: https://kubernetes.default.svc
    - namespace: romm
      server: https://kubernetes.default.svc
    - namespace: rustical-pilot
      server: https://kubernetes.default.svc
    # PLT-221: temporary isolated R2 restore drill of auth/authentik-postgresql-restored;
    # removed by PR once the drill root is pruned.
    - namespace: authentik-drill
      server: https://kubernetes.default.svc
    - namespace: wellness
      server: https://kubernetes.default.svc
    - namespace: searxng
      server: https://kubernetes.default.svc
    - namespace: stirling-pdf
      server: https://kubernetes.default.svc
    - namespace: sure
      server: https://kubernetes.default.svc
    - namespace: trilium
      server: https://kubernetes.default.svc
    - namespace: vikunja
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  orphanedResources:
    warn: true
    # These are deterministic children of active operators. Keep the
    # exception list name-scoped; workloads and unknown objects remain visible.
    ignore:
      - kind: ConfigMap
        name: cnpg-default-monitoring
      - kind: ConfigMap
        name: reloader-meta-info
      - group: aquasecurity.github.io
        kind: ConfigAuditReport
        name: '*'
      - group: aquasecurity.github.io
        kind: ExposedSecretReport
        name: '*'
      - group: aquasecurity.github.io
        kind: RbacAssessmentReport
        name: '*'
      - group: aquasecurity.github.io
        kind: SbomReport
        name: '*'
      - group: aquasecurity.github.io
        kind: VulnerabilityReport
        name: '*'
      - group: autoscaling.k8s.io
        kind: VerticalPodAutoscalerCheckpoint
        name: '*'
