# AppProject des applications générées par le golden path (k8s/apps-generated/<name>/app.yaml).
#
# Frontière Argo CD v3.5.1 (vérifiée sur le tag v3.5.1, controller/sync.go validateSyncPermissions) :
# chaque ressource rendue est contrôlée. Namespacée : son kind doit être dans
# namespaceResourceWhitelist et son namespace doit matcher destinations. Cluster-scoped : son kind
# doit être dans clusterResourceWhitelist, avec name glob si défini.
#
# Volontairement absent : ClusterRole, ClusterRoleBinding, CRD, toute ressource hors liste, roles
# (aucun accès sync/override à un compte non admin), destinationServiceAccounts (impersonation,
# bêta v3.5, désactivée côté argocd-cm : voir checkpoint APPPROJECT).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps-generated
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: apps-generated
    app.kubernetes.io/managed-by: argocd
spec:
  description: Golden-path applications rendered by the platform-app chart, confined to svc-* namespaces with no cluster RBAC
  sourceRepos:
    - https://github.com/SmadjaPaul/kube-ops.git
  destinations:
    # Namespace de l'application : svc-<name>, dans le cluster local uniquement.
    # Pas de négation nécessaire : le préfixe exclut les namespaces existants.
    - namespace: 'svc-*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    # Seule ressource cluster-scoped rendue par le chart : son Namespace, nommé svc-*.
    - group: ''
      kind: Namespace
      name: 'svc-*'
  namespaceResourceWhitelist:
    # Exactement les kinds rendus par k8s/charts/platform-app (templates/*.yaml).
    - group: apps
      kind: Deployment
    - group: ''
      kind: Service
    - group: ''
      kind: ServiceAccount
    - group: policy
      kind: PodDisruptionBudget
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
    - group: cilium.io
      kind: CiliumNetworkPolicy
  namespaceResourceBlacklist:
    # Défense explicite : même si une entrée ci-dessus s'élargissait, ces kinds restent refusés.
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: ''
      kind: Secret
    - group: ''
      kind: ResourceQuota
    - group: ''
      kind: LimitRange
  orphanedResources:
    warn: true
