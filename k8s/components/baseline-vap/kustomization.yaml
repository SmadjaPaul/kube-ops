# Bibliotheque de baseline de securite (ADR oke-target-architecture, section 4 et 7).
# Reutilisable par le homelab : aucun nom de cluster ici. Les namespaces vises sont
# des bindings (matchResources), pas des policies ; un cluster ajuste ses bindings
# dans son propre overlay. Testee par tests/oke-baseline/ (kind, admission serveur).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pod-hardening.yaml
  - automount-token.yaml
  - image-digest.yaml
