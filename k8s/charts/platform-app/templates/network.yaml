# Exposition private uniquement : Gateway internal (ns gateway), hostname <name>.smadja.dev.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.metadata.name }}
  namespace: svc-{{ .Values.metadata.name }}
  labels:
    {{- include "platform-app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: internal
      namespace: gateway
  hostnames:
    - {{ printf "%s.smadja.dev" .Values.metadata.name | quote }}
  rules:
    - backendRefs:
        - name: {{ .Values.metadata.name }}
          port: 80
---
# Default-deny par CiliumNetworkPolicy ; ingress et egress declares explicitement.
# Ingress depuis le Gateway Envoy (hostNetwork : identite host, cf. ntfy) et le namespace gateway.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Values.metadata.name }}
  namespace: svc-{{ .Values.metadata.name }}
  labels:
    {{- include "platform-app.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.metadata.name }}
  ingress:
    - fromEntities: [host, remote-node, ingress]
      toPorts:
        - ports:
            - port: {{ .Values.spec.runtime.port | quote }}
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: gateway
      toPorts:
        - ports:
            - port: {{ .Values.spec.runtime.port | quote }}
              protocol: TCP
    {{- if .Values.spec.observability.metrics }}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: {{ .Values.spec.runtime.port | quote }}
              protocol: TCP
    {{- end }}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          {{- if .Values.spec.egress }}
          # DNS visible uniquement pour les FQDN declares (requis par toFQDNs).
          rules:
            dns:
              {{- range .Values.spec.egress.https }}
              - matchName: {{ . | quote }}
              {{- end }}
          {{- end }}
    {{- if .Values.spec.egress }}
    - toFQDNs:
        {{- range .Values.spec.egress.https }}
        - matchName: {{ . | quote }}
        {{- end }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- end }}
{{- if .Values.spec.observability.metrics }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.metadata.name }}
  namespace: svc-{{ .Values.metadata.name }}
  labels:
    {{- include "platform-app.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.metadata.name }}
  endpoints:
    - port: http
      path: {{ .Values.spec.observability.path }}
      interval: 60s
{{- end }}
