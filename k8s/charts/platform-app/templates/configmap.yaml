{{- if .Values.spec.config }}
# Configuration NON secrète (fichiers), montée en lecture seule dans /etc/platform-config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.metadata.name }}-config
  namespace: svc-{{ .Values.metadata.name }}
  labels:
    {{- include "platform-app.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.spec.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
