{{- if .Values.spec.secrets }}
# Secrets : seules les clés listées sont synchronisées depuis le store doppler-cluster (refs, jamais de valeur).
# Le Secret <name>-env est injecté en envFrom ; un changement Doppler exige un redémarrage du pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.metadata.name }}-env
  namespace: svc-{{ .Values.metadata.name }}
  labels:
    {{- include "platform-app.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: {{ .Values.metadata.name }}-env
    creationPolicy: Owner
  data:
    {{- range .Values.spec.secrets }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ . }}
    {{- end }}
{{- end }}
