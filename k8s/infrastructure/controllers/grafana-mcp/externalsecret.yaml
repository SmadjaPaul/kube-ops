apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-mcp
  namespace: agent-observers
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: grafana-mcp
    creationPolicy: Owner
  data:
    - secretKey: GRAFANA_SERVICE_ACCOUNT_TOKEN
      remoteRef:
        key: GRAFANA_MCP_SERVICE_ACCOUNT_TOKEN
    - secretKey: MCP_GRAFANA_SERVER_TOKEN
      remoteRef:
        key: GRAFANA_MCP_AUTH_TOKEN
