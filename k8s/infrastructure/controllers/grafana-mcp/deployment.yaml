apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-mcp
  namespace: agent-observers
  annotations:
    secret.reloader.stakater.com/reload: "grafana-mcp"
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-mcp
        sre.smadja.dev/component: grafana-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: docker.io/grafana/mcp-grafana:v2.0.0
          args:
            - -t
            - streamable-http
            - --address
            - :8000
            - --enabled-tools
            - search,datasource,prometheus,loki,alerting,dashboard,navigation,annotations
          env:
            - name: GRAFANA_URL
              value: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-mcp
                  key: GRAFANA_SERVICE_ACCOUNT_TOKEN
            - name: MCP_GRAFANA_SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-mcp
                  key: MCP_GRAFANA_SERVER_TOKEN
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
