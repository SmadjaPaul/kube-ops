apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-mcp-ingress
  namespace: agent-observers
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana-mcp
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
