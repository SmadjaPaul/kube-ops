apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - pocket-tts-referencegrant.yaml
helmCharts:
  - name: keda
    repo: https://kedacore.github.io/charts
    version: 2.21.0
    releaseName: keda
    namespace: keda
    valuesInline:
      operator:
        replicaCount: 1
      metricsServer:
        replicaCount: 1
      webhooks:
        replicaCount: 1
      resources:
        operator:
          requests:
            cpu: 50m
            memory: 64Mi
        metricServer:
          requests:
            cpu: 50m
            memory: 64Mi
        webhooks:
          requests:
            cpu: 50m
            memory: 64Mi
  - name: keda-add-ons-http
    repo: https://kedacore.github.io/charts
    version: 0.16.0
    releaseName: http-add-on
    namespace: keda
    valuesInline:
      operator:
        replicas: 1
      scaler:
        replicas: 1
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
      interceptor:
        replicas:
          min: 1
          max: 1
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
      operator:
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
