replicas: 1

image:
  repository: registry.k8s.io/metrics-server/metrics-server
  tag: v0.9.0
  pullPolicy: IfNotPresent

# The chart prepends `defaultArgs` to `args`; override the former so the
# Talos kubelet hostname (present in its serving certificate) is selected
# before the node InternalIP.
defaultArgs:
  - --cert-dir=/tmp
  - --kubelet-preferred-address-types=Hostname,InternalIP
  - --kubelet-use-node-status-port
  - --metric-resolution=30s

args: []

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 192Mi

podDisruptionBudget:
  enabled: false
