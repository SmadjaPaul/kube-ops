replicas: 1

image:
  repository: registry.k8s.io/metrics-server/metrics-server
  tag: v0.9.0
  pullPolicy: IfNotPresent

# The Talos machine configuration requests a kubelet serving certificate with
# the node InternalIP SAN. Prefer that routable address and keep TLS
# verification enabled; do not add --kubelet-insecure-tls.
defaultArgs:
  - --cert-dir=/tmp
  - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
  - --kubelet-use-node-status-port
  - --metric-resolution=30s

args: []

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 192Mi

podDisruptionBudget:
  enabled: false
