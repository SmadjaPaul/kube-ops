# Observation only: no automatic updates, no evictions, no CPU/RAM mutation.
# Candidate workloads with comparatively high declared CPU/memory budgets.
# Qualify recommendations against 7–30d Prometheus history and peak tests.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: jellyfin
  namespace: media
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: jellyfin
  updatePolicy:
    updateMode: "Off"
