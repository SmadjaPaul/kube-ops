# Recommendation-only VPA profile.
# No admission mutation and no updater/eviction path are installed.
admissionController:
  enabled: false

updater:
  enabled: false

recommender:
  enabled: true
  replicas: 1
  # PLT-417: the default 1m loop writes one VerticalPodAutoscalerCheckpoint and
  # one VPA status per object every minute (~4.6k + 3.1k etcd writes per 6h,
  # measured 23/11). Recommendation-only, so a 10m loop only slows the refresh.
  extraArgs:
    - --recommender-interval=10m
  podDisruptionBudget:
    enabled: false
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

crds:
  enabled: true
  keep: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
