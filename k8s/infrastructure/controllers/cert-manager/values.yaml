crds:
  enabled: true
  keep: true

extraArgs:
  - --v=2
  - --cluster-resource-namespace=$(POD_NAMESPACE)
  - --leader-election-namespace=kube-system
  # Use public recursive resolvers for ACME DNS-01 self-checks. CoreDNS
  # forwards first to the split-horizon LAN resolver, which cannot observe
  # Cloudflare's public _acme-challenge records after they are presented.
  - --dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53
  - --dns01-recursive-nameservers-only=true

resources:
  limits:
    cpu: 75m
    memory: 96Mi
  requests:
    cpu: 75m
    memory: 96Mi
replicaCount: 1

webhook:
  securePort: 10250
  hostNetwork: false
  serviceType: ClusterIP
  extraArgs:
    - --secure-port=10250
  resources:
    limits:
      cpu: 125m
      memory: 144Mi
    requests:
      cpu: 125m
      memory: 144Mi
  securityContext:
    runAsNonRoot: true
  replicaCount: 1

cainjector:
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  replicaCount: 1
