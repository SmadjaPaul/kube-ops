upgradeCRDs: false
deployNodeAgent: true
snapshotsEnabled: false
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.14.1
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

rbac:
  create: true
  clusterAdministrator: true

serviceAccount:
  server:
    create: true

credentials:
  useSecret: true
  existingSecret: velero-hetzner-credentials

configuration:
  uploaderType: kopia
  uploaderConfig:
    # Keep WAN pressure and local disk contention bounded on the single node.
    parallelFilesUpload: 2
  backupRepositoryConfigMap: velero-repository-config
  repoMaintenanceJobConfigMap: velero-repo-maintenance-job-config
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: smadja-dev-homelab-backups
      prefix: velero
      default: true
      config:
        region: fsn1
        s3ForcePathStyle: "false"
        s3Url: https://fsn1.your-objectstorage.com
  repositoryMaintenanceJob:
    repositoryConfigData:
      name: "velero-repo-maintenance"
      global:
        keepLatestMaintenanceJobs: 2
        podResources:
          cpuRequest: "100m"
          cpuLimit: "500m"
          memoryRequest: "256Mi"
          memoryLimit: "512Mi"
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534
          seccompProfile:
            type: RuntimeDefault
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeAgent:
  tolerations:
    - key: "gpu"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: velero
