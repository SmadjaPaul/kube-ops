# Install and manage Velero CRDs on a fresh cluster so BackupStorageLocation,
# Schedule, and Repository resources can be reconciled before any backup
# destination credentials are supplied.
upgradeCRDs: true
deployNodeAgent: true
snapshotsEnabled: false
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.14.4
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

rbac:
  create: true
  clusterAdministrator: true

serviceAccount:
  server:
    create: true

credentials:
  useSecret: true
  existingSecret: velero-hetzner-credentials

configuration:
  uploaderType: kopia
  uploaderConfig:
    # Keep WAN pressure and local disk contention bounded on the single node.
    parallelFilesUpload: 2
  # R2 does not support every flexible checksum of recent AWS SDKs (aws-sdk-go-v2).
  extraEnvVars:
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: when_required
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: when_required
  backupRepositoryConfigMap: velero-repository-config
  repoMaintenanceJobConfigMap: velero-repo-maintenance-job-config
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: smadja-dev-homelab-backups
      prefix: velero
      default: true
      config:
        region: fsn1
        s3ForcePathStyle: "false"
        s3Url: https://fsn1.your-objectstorage.com
    # PLT-222: Cloudflare R2 (jurisdiction eu), added NEXT TO the Hetzner BSL.
    # Not default: schedules keep `storageLocation: default` until the R2
    # backup + isolated restore is proven (docs/operations/r2-migration.md, step 6).
    - name: r2
      provider: aws
      bucket: homelab-backup-velero
      default: false
      accessMode: ReadWrite
      credential:
        name: velero-r2-credentials
        key: cloud
      config:
        region: auto
        s3ForcePathStyle: "true"
        # Endpoint R2, juridiction eu. L'account ID n'est pas un credential.
        s3Url: https://a98efb1065ad3ae6b7259dce75f2a980.eu.r2.cloudflarestorage.com
  repositoryMaintenanceJob:
    repositoryConfigData:
      name: "velero-repo-maintenance"
      global:
        keepLatestMaintenanceJobs: 2
        podResources:
          cpuRequest: "100m"
          cpuLimit: "500m"
          memoryRequest: "256Mi"
          memoryLimit: "512Mi"
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534
          seccompProfile:
            type: RuntimeDefault
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

nodeAgent:
  # No nodeAgent.extraEnvVars: chart 12.x already injects configuration.extraEnvVars
  # (AWS_*_CHECKSUM) into node-agent. Declaring them twice yields duplicate env keys,
  # which makes Argo server-side diff fail for the whole infra-controllers app.
  tolerations:
    - key: "gpu"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: velero
