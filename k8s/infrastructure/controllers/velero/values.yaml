# Velero owns Kubernetes API/resource disaster recovery only.
# PVC bytes are intentionally protected by VolSync/restic, while PostgreSQL
# is protected by CloudNativePG/Barman. Keeping these roles separate avoids
# duplicate large-volume backups and makes restore ownership explicit.
upgradeCRDs: true
deployNodeAgent: false
snapshotsEnabled: false

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.14.1
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

rbac:
  create: true
  clusterAdministrator: true

serviceAccount:
  server:
    create: true

credentials:
  useSecret: true
  existingSecret: velero-hetzner-credentials

configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: smadja-dev-homelab-backups
      prefix: velero
      default: true
      config:
        region: fsn1
        s3ForcePathStyle: "false"
        s3Url: https://fsn1.your-objectstorage.com

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: velero
