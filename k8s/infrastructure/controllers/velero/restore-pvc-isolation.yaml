apiVersion: v1
kind: ConfigMap
metadata:
  name: restore-pvc-isolation
  namespace: velero
  labels:
    velero.io/restore-resource-modifier: invoice-ninja
data:
  resource-modifier.yaml: |
    version: v1
    resourceModifierRules:
      - conditions:
          groupResource: persistentvolumeclaims
          resourceNameRegex: ".*"
          namespaces:
            - invoice-ninja
        patches:
          - operation: remove
            path: "/spec/volumeName"
          - operation: replace
            path: "/spec/storageClassName"
            value: proxmox-csi
      # Velero copies the source object's Argo tracking annotation into the
      # isolated namespace. Remove it before restore so the drill cannot be
      # attributed to the production Application or inflate orphan warnings.
      - conditions:
          groupResource: "*.*"
          namespaces:
            - invoice-ninja
        mergePatches:
          - patchData: |
              {
                "metadata": {
                  "annotations": {
                    "argocd.argoproj.io/tracking-id": null
                  }
                }
              }
