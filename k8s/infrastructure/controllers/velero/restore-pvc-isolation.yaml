apiVersion: v1
kind: ConfigMap
metadata:
  name: restore-pvc-isolation
  namespace: velero
  labels:
    velero.io/restore-resource-modifier: invoice-ninja
data:
  resource-modifier.yaml: |
    version: v1
    resourceModifierRules:
      - conditions:
          groupResource: persistentvolumeclaims
          resourceNameRegex: ".*"
          namespaces:
            - invoice-ninja
            - longhorn-tier-dr-source
            - home-assistant
        # JSON Merge Patch deletion is idempotent: unlike a JSON Patch remove,
        # it also succeeds when Velero has already omitted volumeName.
        mergePatches:
          - patchData: |
              {
                "spec": {
                  "volumeName": null
                }
              }
      # Velero copies the source object's Argo tracking annotation into the
      # isolated namespace. Remove it before restore so the drill cannot be
      # attributed to the production Application or inflate orphan warnings.
      - conditions:
          groupResource: "*.*"
          namespaces:
            - invoice-ninja
            - longhorn-tier-dr-source
            - home-assistant
        mergePatches:
          - patchData: |
              {
                "metadata": {
                  "annotations": {
                    "argocd.argoproj.io/tracking-id": null
                  }
                }
              }
      # PRD-76 : drill de restauration de Home Assistant (CronJob suspendu
      # ha-restore-drill, k8s/infrastructure/controllers/velero-ha-restore-drill).
      # Le PVC restauré prend la classe longhorn-drill (Delete) : supprimer le
      # PVC du drill supprime le PV et le volume Longhorn, aucun Released.
      # Ne pas utiliser ce modifier pour une vraie reprise de HA.
      - conditions:
          groupResource: persistentvolumeclaims
          resourceNameRegex: "^home-assistant-home-assistant-0$"
          namespaces:
            - home-assistant
        mergePatches:
          - patchData: |
              {
                "spec": {
                  "storageClassName": "longhorn-drill"
                }
              }
      # Neutralise le pod home-assistant-0 restauré (hostNetwork, NET_ADMIN,
      # init containers, ConfigMap/Secret) : il ne garde que l'init container
      # restore-wait de Velero (durci) et devient un vérificateur en lecture
      # seule, sans réseau hôte ni jeton. Velero 1.18 applique ce patch APRÈS
      # ses actions de restauration (restore-wait déjà en tête, avec les
      # capabilities du conteneur HA) ; si un `test` échoue, le pod part non
      # modifié : la ValidatingAdmissionPolicy ha-restore-test-guard le refuse.
      # Contrat : tests/harness/ha-restore-drill-test.sh.
      - conditions:
          groupResource: pods
          resourceNameRegex: "^home-assistant-0$"
          namespaces:
            - home-assistant
        patches:
            - operation: test
              path: "/spec/initContainers/0/name"
              value: 'restore-wait'
            - operation: test
              path: "/spec/containers/0/name"
              value: 'home-assistant'
            - operation: add
              path: "/spec/containers"
              value: '[]'
            - operation: move
              from: "/spec/initContainers/0"
              path: "/spec/containers/0"
            - operation: add
              path: "/spec/initContainers"
              value: '[]'
            - operation: move
              from: "/spec/containers/0"
              path: "/spec/initContainers/0"
            - operation: add
              path: "/spec/initContainers/0/securityContext"
              value: '{"allowPrivilegeEscalation":false,"capabilities":{"drop":["ALL"]},"seccompProfile":{"type":"RuntimeDefault"}}'
            - operation: add
              path: "/spec/containers"
              value: '[{"name":"ha-restore-verify","image":"ghcr.io/home-assistant/home-assistant:2026.11.2@sha256:493a07e8f6530fc640223f4a0a5248f20a61ca2f718bb1d31efbf08a2c5ea28f","imagePullPolicy":"IfNotPresent","command":["python3","-I","-c","import glob, json, os, sqlite3, sys\nc = sys.argv[1]\nr = {\"check\": \"ha-restore-verify\"}\nst = os.path.join(c, \".storage\")\nr[\"storage_files\"] = len(os.listdir(st)) if os.path.isdir(st) else 0\nr[\"configuration_yaml\"] = os.path.isfile(os.path.join(c, \"configuration.yaml\"))\ntars = sorted(glob.glob(os.path.join(c, \"backups\", \"*.tar\")), key=os.path.getmtime)\nr[\"native_backups\"] = len(tars)\nr[\"latest_native_backup_bytes\"] = os.path.getsize(tars[-1]) if tars else 0\ndb = os.path.join(c, \"home-assistant_v2.db\")\nr[\"db_bytes\"] = os.path.getsize(db) if os.path.isfile(db) else 0\ntry:\n    con = sqlite3.connect(\"file:\" + db + \"?mode=ro&immutable=1\", uri=True)\n    r[\"db_integrity\"] = con.execute(\"PRAGMA integrity_check\").fetchone()[0]\n    r[\"db_states\"] = con.execute(\"SELECT count(*) FROM states\").fetchone()[0]\n    r[\"db_last_state_ts\"] = con.execute(\"SELECT max(last_updated_ts) FROM states\").fetchone()[0]\n    con.close()\nexcept Exception as e:\n    r[\"db_integrity\"] = \"error:\" + type(e).__name__\nhits = []\nfor f in [os.path.join(c, \"scripts.yaml\"), os.path.join(c, \"automations.yaml\")] + sorted(glob.glob(os.path.join(st, \"*\"))):\n    try:\n        with open(f, \"rb\") as h:\n            if b\"maison_musique_\" in h.read():\n                hits.append(os.path.relpath(f, c))\n    except OSError:\n        pass\nr[\"maison_musique_files\"] = hits\nok = r[\"storage_files\"] > 0 and r[\"db_integrity\"] == \"ok\" and bool(hits)\nr[\"status\"] = \"PASS\" if ok else \"FAIL\"\nprint(json.dumps(r, sort_keys=True), flush=True)\nsys.exit(0 if ok else 1)\n","/config"],"env":[{"name":"PYTHONDONTWRITEBYTECODE","value":"1"}],"securityContext":{"allowPrivilegeEscalation":false,"readOnlyRootFilesystem":true,"capabilities":{"drop":["ALL"]}},"resources":{"requests":{"cpu":"50m","memory":"64Mi"},"limits":{"cpu":"500m","memory":"256Mi"}},"volumeMounts":[{"name":"data","mountPath":"/config","readOnly":true}]}]'
            - operation: add
              path: "/spec/volumes"
              value: '[{"name":"data","persistentVolumeClaim":{"claimName":"home-assistant-home-assistant-0","readOnly":false}}]'
            - operation: add
              path: "/spec/hostNetwork"
              value: 'false'
            - operation: add
              path: "/spec/dnsPolicy"
              value: 'ClusterFirst'
            - operation: add
              path: "/spec/serviceAccountName"
              value: 'default'
            - operation: add
              path: "/spec/serviceAccount"
              value: 'default'
            - operation: add
              path: "/spec/automountServiceAccountToken"
              value: 'false'
            - operation: add
              path: "/spec/enableServiceLinks"
              value: 'false'
            - operation: add
              path: "/spec/restartPolicy"
              value: 'Never'
            - operation: add
              path: "/spec/securityContext"
              value: '{"seccompProfile":{"type":"RuntimeDefault"}}'
            - operation: add
              path: "/metadata/labels"
              value: '{"app.kubernetes.io/name":"ha-restore-verify","app.kubernetes.io/part-of":"ha-restore-drill"}'
            - operation: add
              path: "/metadata/annotations"
              value: '{}'
