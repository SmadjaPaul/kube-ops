apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-hetzner-credentials
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: velero-hetzner-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .ACCESS_KEY_ID }}
          aws_secret_access_key={{ .SECRET_ACCESS_KEY }}
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: HETZNER_S3_ACCESS_KEY_ID
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: HETZNER_S3_SECRET_ACCESS_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-repo-credentials
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: velero-repo-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        repository-password: "{{ .REPOSITORY_PASSWORD }}"
  data:
    - secretKey: REPOSITORY_PASSWORD
      remoteRef:
        key: HETZNER_S3_VELERO_REPOSITORY_PASSWORD
