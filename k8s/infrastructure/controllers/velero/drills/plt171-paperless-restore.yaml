# PLT-171: isolated Velero/Kopia restore of paperless from the R2 BSL into
# drill-paperless (full restore drill with the CNPG leg in
# k8s/optional/paperless-full-drill). The namespace, default-deny policies and
# ExternalSecrets exist before this Restore (PR #1502). persistentvolumes is
# listed so PodVolumeRestores are created (Velero 1.18, lesson of PLT-222);
# includeClusterResources stays false, so no PV is restored and the
# production PVs are untouched (the PVCs get fresh longhorn-bulk PVs).
# No Secret, ExternalSecret, CiliumNetworkPolicy, HTTPRoute or CRD; CNPG
# objects are excluded from the source Backup by its label selector.
# Never prune this Restore: deleting a Restore CR can make Velero delete its
# result files in the bucket. Remove the manifest from Git after the proof
# (Prune=false keeps the live CR as the record).
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: plt171-paperless-drill-20261115
  namespace: velero
  labels:
    backup-tier: drill
    backup-app: paperless
    plt: "171"
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  backupName: velero-daily-paperless-20261115044028
  includedNamespaces:
    - paperless
  namespaceMapping:
    paperless: drill-paperless
  includedResources:
    - deployments.apps
    - replicasets.apps
    - pods
    - persistentvolumeclaims
    - persistentvolumes
    - services
    - configmaps
    - serviceaccounts
  includeClusterResources: false
  existingResourcePolicy: none
  restorePVs: true
  resourceModifier:
    kind: ConfigMap
    name: paperless-drill-restore-modifier
