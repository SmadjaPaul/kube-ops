# PLT-222: isolated restore drill of ntfy from the R2 BSL, into drill-ntfy.
# The namespace, default-deny policy and ExternalSecret come from
# k8s/optional/ntfy-drill (applied before this Restore). Whitelist only: no
# Secret, ExternalSecret, CiliumNetworkPolicy, HTTPRoute, PV or CRD.
# Never prune this Restore: deleting a Restore CR can make Velero delete its
# result files in the bucket. Remove the manifest from Git after the proof
# (the live CR stays as the record).
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: plt222-ntfy-drill-20261115
  namespace: velero
  labels:
    backup-tier: drill
    backup-app: ntfy
    plt: "222"
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  backupName: velero-daily-ntfy-20261115042528
  includedNamespaces:
    - ntfy
  namespaceMapping:
    ntfy: drill-ntfy
  includedResources:
    - deployments.apps
    - replicasets.apps
    - pods
    - persistentvolumeclaims
    - services
    - configmaps
    - serviceaccounts
  includeClusterResources: false
  existingResourcePolicy: none
  restorePVs: true
  resourceModifier:
    kind: ConfigMap
    name: ntfy-drill-restore-modifier
