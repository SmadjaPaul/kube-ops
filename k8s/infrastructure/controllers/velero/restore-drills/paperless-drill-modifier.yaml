# PLT-171: resource modifier of the paperless restore drill (namespace
# paperless -> drill-paperless). The namespace in the conditions is the SOURCE
# namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-drill-restore-modifier
  namespace: velero
  labels:
    restore.smadja.dev/purpose: isolated-restore-drill
data:
  resource-modifier.yaml: |
    version: v1
    resourceModifierRules:
      # volumeName is immutable and points at the production PV: drop it so
      # the isolated PVC gets a fresh PV and Kopia restores into it. The drill
      # PVCs go to longhorn-bulk (HDD, free capacity) instead of the nearly
      # fully scheduled longhorn-fast NVMe disk.
      - conditions:
          groupResource: persistentvolumeclaims
          resourceNameRegex: ".*"
          namespaces:
            - paperless
        mergePatches:
          - patchData: |
              {
                "spec": {
                  "volumeName": null,
                  "storageClassName": "longhorn-bulk"
                }
              }
      # Keep the drill out of the production Argo Application.
      - conditions:
          groupResource: "*.*"
          namespaces:
            - paperless
        mergePatches:
          - patchData: |
              {
                "metadata": {
                  "annotations": {
                    "argocd.argoproj.io/tracking-id": null
                  }
                }
              }
