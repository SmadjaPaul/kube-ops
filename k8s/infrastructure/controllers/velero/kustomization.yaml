apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: velero

resources:
  - namespace.yaml
  - externalsecret.yaml
  - restore-pvc-isolation.yaml
  - schedules/
  - drills/plt222-ntfy-r2-backup.yaml
  # PLT-171: isolated full restore drill of paperless (remove by PR after proof).
  - restore-drills/paperless-drill-modifier.yaml
  - drills/plt171-paperless-restore.yaml
  - repository-config.yaml
  - auto-cleanup-jobs-policy.yaml
  - maintenance-job-config.yaml
  - prometheusrule.yaml

helmCharts:
  - name: velero
    repo: https://vmware-tanzu.github.io/helm-charts
    version: 12.0.1
    releaseName: velero
    namespace: velero
    valuesFile: values.yaml

generatorOptions:
  disableNameSuffixHash: true
