apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: velero-daily-karakeep
  namespace: velero
  labels:
    backup-tier: daily
    backup-app: karakeep
spec:
  schedule: "0 2 * * *"
  template:
    includedNamespaces:
      - karakeep
    # Meilisearch's index is rebuildable from Karakeep's durable data. Select
    # only the web workload so the index PVC is not uploaded by Kopia.
    labelSelector:
      matchLabels:
        app: karakeep-web
    includedResources:
      - '*'
    excludedResources:
      - events
      - storageclasses.storage.k8s.io
    defaultVolumesToFsBackup: true
    storageLocation: default
    ttl: 336h
