# BookOrbit /appdata metadata PVC is durable. The 2-TiB media-share PVC
# MUST NOT be included. FSB is pod opt-in for volume 'data' only;
# snapshots are disabled to avoid fallbacks for excluded volumes.
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: velero-daily-bookorbit
  namespace: velero
  labels:
    backup-tier: daily
    backup-app: bookorbit
spec:
  schedule: "0 2 * * *"
  template:
    includedNamespaces:
      - media
    orLabelSelectors:
      - matchLabels:
          app.kubernetes.io/name: bookorbit
    includedResources:
      - '*'
    excludedResources:
      - events
      - storageclasses.storage.k8s.io
    # Pod annotation backup.velero.io/backup-volumes: data permits only /appdata.
    defaultVolumesToFsBackup: false
    snapshotVolumes: false
    storageLocation: default
    ttl: 336h
