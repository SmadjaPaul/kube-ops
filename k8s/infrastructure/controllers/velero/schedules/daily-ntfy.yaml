apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: velero-daily-ntfy
  namespace: velero
  labels:
    backup-tier: daily
    backup-app: ntfy
spec:
  schedule: "35 2 * * *"
  template:
    includedNamespaces:
      - ntfy
    includedResources:
      - '*'
    excludedResources:
      - events
      - storageclasses.storage.k8s.io
    defaultVolumesToFsBackup: true
    storageLocation: default
    ttl: 336h
