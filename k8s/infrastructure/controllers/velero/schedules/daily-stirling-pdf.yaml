apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: velero-daily-stirling-pdf
  namespace: velero
  labels:
    backup-tier: daily
    backup-app: stirling-pdf
spec:
  schedule: "45 2 * * *"
  template:
    includedNamespaces:
      - stirling-pdf
    includedResources:
      - '*'
    excludedResources:
      - events
      - storageclasses.storage.k8s.io
    defaultVolumesToFsBackup: true
    storageLocation: default
    ttl: 336h
