apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: velero-daily-mealie
  namespace: velero
  labels:
    backup-tier: daily
    backup-app: mealie
spec:
  schedule: "15 2 * * *"
  template:
    includedNamespaces:
      - mealie
    includedResources:
      - '*'
    excludedResources:
      - events
      - storageclasses.storage.k8s.io
    defaultVolumesToFsBackup: true
    storageLocation: default
    ttl: 336h
