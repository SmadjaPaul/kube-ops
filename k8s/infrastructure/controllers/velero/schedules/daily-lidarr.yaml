apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: velero-daily-lidarr
  namespace: velero
  labels:
    backup-tier: daily
    backup-app: lidarr
spec:
  schedule: "0 2 * * *"
  template:
    includedNamespaces:
      - media
    labelSelector:
      matchLabels:
        app: lidarr
    includedResources:
      - '*'
    excludedResources:
      - events
      - storageclasses.storage.k8s.io
    defaultVolumesToFsBackup: true
    storageLocation: default
    ttl: 336h
