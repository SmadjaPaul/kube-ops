# PLT-222: RustiCal pilot (calendars and contacts, SQLite). The base Schedule in
# k8s/optional/rustical/backup.yaml is deleted by the pilot overlay, because the
# overlay namespace moved it out of the velero namespace.
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: velero-daily-rustical-pilot
  namespace: velero
  labels:
    backup-tier: daily
    backup-app: rustical
spec:
  schedule: "15 2 * * *"
  template:
    includedNamespaces:
      - rustical-pilot
    includedResources:
      - '*'
    excludedResources:
      - events
      - storageclasses.storage.k8s.io
    defaultVolumesToFsBackup: true
    storageLocation: r2
    ttl: 336h
