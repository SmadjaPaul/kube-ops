apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # One offsite tier only: daily Kopia backups, 14-day TTL.
  # CNPG database volumes are protected independently through Barman/WAL archiving.
  - daily-home-assistant.yaml
  # Monitoring metrics and Loki logs are explicitly excluded from the durable
  # application-data policy; dashboards and rules are GitOps state.
  - daily-immich.yaml
  - daily-bookorbit.yaml
  - daily-prowlarr.yaml
  - daily-karakeep.yaml
  - daily-pinepods.yaml
  - daily-mqtt.yaml
  - daily-gpt-researcher.yaml
  - daily-opencode.yaml
  - daily-trilium.yaml
  - daily-romm.yaml
  - daily-invoice-ninja.yaml
  - daily-mealie.yaml
  - daily-ntfy.yaml
  - daily-paperless.yaml
  - daily-sure.yaml
  - daily-stirling-pdf.yaml
  - daily-vikunja.yaml
  - daily-open-connector.yaml
  - daily-agentgateway.yaml
  - daily-factory-platform.yaml
  - daily-matrix.yaml
  - daily-aiostreams.yaml
  - daily-librechat.yaml
  - daily-rustical-pilot.yaml
  - daily-sparkyfitness.yaml
  # PLT-315: Fleet MySQL (logical dump by pre-backup hook).
  - daily-fleet.yaml
  # Namespaces holding internal secrets that are rebuilt from Git/Doppler today
  # and must stay restorable once they become native Secrets.
  # auth: Authentik Secrets + Redis volume, PostgreSQL left to CNPG/Barman.
  - daily-auth.yaml
  # databases: Kubernetes resources only (no PG volumes; Barman covers data).
  - daily-databases.yaml
