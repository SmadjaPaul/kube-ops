apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # One offsite tier only: daily Kopia backups, 14-day TTL.
  # CNPG database volumes are protected independently through Barman/WAL archiving.
  - daily-home-assistant.yaml
  # Monitoring metrics and Loki logs are explicitly excluded from the durable
  # application-data policy; dashboards and rules are GitOps state.
  - daily-immich.yaml
  - daily-audiobookrequest.yaml
  - daily-bookorbit.yaml
  - daily-karakeep.yaml
  # Owner ACCEPT_LOSS applies only to two identified Longhorn Executor volumes.
  # Keep the daily schedule for all future Executor data.
  - daily-executor.yaml
  - daily-pinepods.yaml
  - daily-mqtt.yaml
  - daily-gpt-researcher.yaml
  - daily-opencode.yaml
  - daily-trilium.yaml
  - daily-romm.yaml
  - daily-invoice-ninja.yaml
  - daily-mealie.yaml
  - daily-ntfy.yaml
  - daily-paperless.yaml
  - daily-sure.yaml
  - daily-stirling-pdf.yaml
  - daily-vikunja.yaml
  - daily-open-connector.yaml
  - daily-agentgateway.yaml
  - daily-atlantis.yaml
  - daily-factory-platform.yaml
  - daily-matrix.yaml
  - daily-aiostreams.yaml
  - daily-librechat.yaml
