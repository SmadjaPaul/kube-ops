apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: velero-daily-librechat
  namespace: velero
  labels:
    backup-tier: daily
    backup-app: librechat
spec:
  schedule: "50 5 * * *"
  template:
    includedNamespaces:
      - librechat
    includedResources:
      - '*'
    excludedResources:
      - events
      - storageclasses.storage.k8s.io
    defaultVolumesToFsBackup: true
    storageLocation: default
    ttl: 336h
