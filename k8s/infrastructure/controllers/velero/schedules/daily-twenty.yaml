apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: velero-daily-twenty
  namespace: velero
  labels:
    backup-tier: daily
    backup-app: twenty
spec:
  schedule: "25 5 * * *"
  template:
    includedNamespaces:
      - twenty
    labelSelector:
      matchExpressions:
        - key: cnpg.io/cluster
          operator: DoesNotExist
    includedResources:
      - '*'
    excludedResources:
      - events
      - storageclasses.storage.k8s.io
      - clusters.postgresql.cnpg.io
      - backups.postgresql.cnpg.io
      - scheduledbackups.postgresql.cnpg.io
      - objectstores.barmancloud.cnpg.io
    defaultVolumesToFsBackup: true
    storageLocation: default
    ttl: 336h
