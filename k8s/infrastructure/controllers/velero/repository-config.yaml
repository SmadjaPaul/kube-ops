# Kopia Repository Configuration for Velero
# Conservative settings for the Velero Kopia repository on the R2 BackupStorageLocation `r2`
# (PLT-94 lot 6: the former Hetzner `default` BSL is retired).
apiVersion: v1
kind: ConfigMap
metadata:
  name: velero-repository-config
  namespace: velero
data:
  kopia: |
    {
      "cacheLimitMB": 8192,
      "compression": "lz4",
      "fullMaintenanceInterval": "6h",
      "maintenanceMode": "periodic",
      "maintenanceInterval": "1h",
      "maxFileSizeBytes": 67108864,
      "chunkSizeBytes": 16777216
    }
