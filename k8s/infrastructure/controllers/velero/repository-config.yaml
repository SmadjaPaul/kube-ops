# Kopia Repository Configuration for Velero
# Conservative settings for the single Hetzner S3 offsite tier.
apiVersion: v1
kind: ConfigMap
metadata:
  name: velero-repository-config
  namespace: velero
data:
  kopia: |
    {
      "cacheLimitMB": 8192,
      "compression": "lz4",
      "fullMaintenanceInterval": "6h",
      "maintenanceMode": "periodic",
      "maintenanceInterval": "1h",
      "maxFileSizeBytes": 67108864,
      "chunkSizeBytes": 16777216
    }
