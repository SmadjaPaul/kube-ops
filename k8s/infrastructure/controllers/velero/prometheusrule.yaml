apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: velero-backup-alerts
  namespace: velero
spec:
  groups:
    - name: velero.rules
      rules:
        - alert: VeleroBackupFailure
          annotations:
            runbook_url: https://github.com/SmadjaPaul/kube-ops/blob/main/docs/operations/alert-runbooks.md#velerobackupfailure
            description: >-
              Velero backup {{ $labels.schedule }} has failed.
              Check velero backup logs for details.
            summary: Velero backup failure detected.
          expr: |-
            increase(velero_backup_failure_total{schedule!=""}[1h]) > 0
          for: 0m
          labels:
            severity: warning
        - alert: VeleroBackupPartialFailure
          annotations:
            runbook_url: https://github.com/SmadjaPaul/kube-ops/blob/main/docs/operations/alert-runbooks.md#velerobackuppartialfailure
            description: >-
              Velero backup {{ $labels.schedule }} completed with partial failures,
              which often indicates storage issues.
            summary: Velero backup partial failure detected.
          expr: |-
            increase(velero_backup_partial_failure_total{schedule!=""}[1h]) > 0
          for: 0m
          labels:
            severity: warning
        - alert: VeleroBackupNotRunRecently
          annotations:
            runbook_url: https://github.com/SmadjaPaul/kube-ops/blob/main/docs/operations/alert-runbooks.md#velerobackupnotrunrecently
            description: >-
              No successful Velero backup has completed in the last 48 hours.
              This may indicate storage full, scheduler issues, or broken repositories.
            summary: No successful Velero backup in 48 hours.
          expr: |-
            time() - velero_backup_last_successful_timestamp{schedule!=""} > 48 * 60 * 60
          for: 5m
          labels:
            severity: critical
        - alert: VeleroScheduleNeverSucceeded
          annotations:
            runbook_url: https://github.com/SmadjaPaul/kube-ops/blob/main/docs/operations/alert-runbooks.md#veleroscheduleneversucceeded
            description: >-
              Velero schedule {{ $labels.schedule }} has attempted backups in the last
              24 hours but has never produced a successful one (no
              velero_backup_last_successful_timestamp series). VeleroBackupNotRunRecently
              cannot fire in that case because the series does not exist.
            summary: Velero schedule has never had a successful backup.
          expr: |-
            increase(velero_backup_attempt_total{schedule!=""}[24h]) > 0
            unless on (schedule) velero_backup_last_successful_timestamp
          for: 30m
          labels:
            severity: critical
