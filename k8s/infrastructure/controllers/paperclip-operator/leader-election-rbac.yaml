apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: paperclip-operator-leader-election
  namespace: paperclip-operator-system
  annotations:
    argocd.argoproj.io/sync-wave: "-19"
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - create
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: paperclip-operator-leader-election
  namespace: paperclip-operator-system
  annotations:
    argocd.argoproj.io/sync-wave: "-19"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: paperclip-operator-leader-election
subjects:
  - kind: ServiceAccount
    name: paperclip-operator
    namespace: paperclip-operator-system
