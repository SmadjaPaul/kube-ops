# PRD-76 — barrière d'admission du namespace home-assistant-restore-test, pour
# toute identité (Velero compris), une policy par type d'objet (une policy
# commune pods + PVC produisait des avertissements typeChecking). Velero 1.18
# applique les resource modifiers après ses actions et crée l'objet même si un
# patch échoue : seule l'admission garantit qu'aucun second Home Assistant
# (hostNetwork, NET_ADMIN, ConfigMap, Secret) ne démarre. Le pod n'est admis
# que sous la forme exacte produite par la règle pods de restore-pvc-isolation :
# init container restore-wait de Velero durci et un vérificateur en lecture
# seule ; PVC seulement en longhorn-drill.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ha-restore-test-pod-guard
  labels:
    app.kubernetes.io/part-of: ha-restore-drill
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  variables:
    - name: isPod
      expression: "!has(request.subResource) || request.subResource == ''"
    - name: ctrs
      expression: >-
        object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])
  validations:
    - expression: "variables.isPod"
      reason: Forbidden
      message: "ha-restore-test-pod-guard : aucun conteneur éphémère"
    - expression: >-
        !variables.isPod ||
        (!(has(object.spec.hostNetwork) && object.spec.hostNetwork) &&
        !(has(object.spec.hostPID) && object.spec.hostPID) &&
        !(has(object.spec.hostIPC) && object.spec.hostIPC))
      reason: Forbidden
      message: "ha-restore-test-pod-guard : hostNetwork, hostPID et hostIPC interdits"
    - expression: >-
        !variables.isPod || variables.ctrs.all(c,
        !(has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged) &&
        !(has(c.securityContext) && has(c.securityContext.capabilities) &&
        has(c.securityContext.capabilities.add) && size(c.securityContext.capabilities.add) > 0) &&
        has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) &&
        !c.securityContext.allowPrivilegeEscalation)
      reason: Forbidden
      message: "ha-restore-test-pod-guard : conteneur privilégié, capability ajoutée ou escalade de privilèges"
    - expression: >-
        !variables.isPod ||
        (has(object.spec.initContainers) && size(object.spec.initContainers) == 1 &&
        object.spec.initContainers[0].name == 'restore-wait' &&
        object.spec.initContainers[0].image.matches('^docker\\.io/velero/velero:v[0-9]+\\.[0-9]+\\.[0-9]+$') &&
        size(object.spec.containers) == 1 &&
        object.spec.containers[0].name == 'ha-restore-verify' &&
        object.spec.containers[0].image == 'ghcr.io/home-assistant/home-assistant:2026.11.2@sha256:493a07e8f6530fc640223f4a0a5248f20a61ca2f718bb1d31efbf08a2c5ea28f' &&
        has(object.spec.containers[0].volumeMounts) &&
        object.spec.containers[0].volumeMounts.all(m, has(m.readOnly) && m.readOnly) &&
        !has(object.spec.ephemeralContainers))
      reason: Forbidden
      message: "ha-restore-test-pod-guard : seuls restore-wait et le vérificateur ha-restore-verify (lecture seule) sont admis"
    - expression: >-
        !variables.isPod ||
        (has(object.spec.volumes) && size(object.spec.volumes) == 1 &&
        object.spec.volumes[0].name == 'data' && has(object.spec.volumes[0].persistentVolumeClaim) &&
        object.spec.volumes[0].persistentVolumeClaim.claimName == 'home-assistant-home-assistant-0')
      reason: Forbidden
      message: "ha-restore-test-pod-guard : seul le volume data (PVC restauré) est admis, ni ConfigMap, ni Secret, ni jeton"
    - expression: >-
        !variables.isPod ||
        (has(object.spec.serviceAccountName) && object.spec.serviceAccountName == 'default' &&
        has(object.spec.automountServiceAccountToken) && !object.spec.automountServiceAccountToken)
      reason: Forbidden
      message: "ha-restore-test-pod-guard : ServiceAccount default sans jeton monté"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ha-restore-test-pod-guard
  labels:
    app.kubernetes.io/part-of: ha-restore-drill
spec:
  policyName: ha-restore-test-pod-guard
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: home-assistant-restore-test
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ha-restore-test-pvc-guard
  labels:
    app.kubernetes.io/part-of: ha-restore-drill
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [persistentvolumeclaims]
  validations:
    - expression: "has(object.spec.storageClassName) && object.spec.storageClassName == 'longhorn-drill'"
      reason: Forbidden
      message: "ha-restore-test-pvc-guard : PVC du drill seulement en longhorn-drill (Delete)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ha-restore-test-pvc-guard
  labels:
    app.kubernetes.io/part-of: ha-restore-drill
spec:
  policyName: ha-restore-test-pvc-guard
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: home-assistant-restore-test
---
# PRD-76 — Velero 1.18.2 (restore finalizer, patchDynamicPVWithVolumeInfo) recopie
# sur le PV provisionné pour le drill la reclaimPolicy du PV sauvegardé
# (longhorn-fast, Retain) : le PV longhorn-drill resterait Released. Le Job
# ha-restore-drill le repasse en Delete avant de supprimer le PVC. Cette policy
# borne ce droit `patch` sur les PV : seul changement admis, reclaimPolicy ->
# Delete, et seulement sur un PV Longhorn longhorn-drill réclamé depuis
# home-assistant-restore-test. Ni création, ni suppression, ni status.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ha-restore-drill-pv-guard
  labels:
    app.kubernetes.io/part-of: ha-restore-drill
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["*"]
        resources: [persistentvolumes, persistentvolumes/status]
  matchConditions:
    - name: ha-restore-drill-identity
      expression: request.userInfo.username == 'system:serviceaccount:velero:ha-restore-drill'
  variables:
    - name: upd
      expression: >-
        request.operation == 'UPDATE' && (!has(request.subResource) || request.subResource == '')
  validations:
    - expression: "variables.upd"
      reason: Forbidden
      message: "ha-restore-drill-pv-guard : seul un patch de PV est admis (ni création, ni suppression, ni status)"
    - expression: >-
        !variables.upd ||
        (has(oldObject.spec.storageClassName) && oldObject.spec.storageClassName == 'longhorn-drill' &&
        has(oldObject.spec.claimRef) && has(oldObject.spec.claimRef.namespace) &&
        oldObject.spec.claimRef.namespace == 'home-assistant-restore-test' &&
        has(oldObject.spec.csi) && oldObject.spec.csi.driver == 'driver.longhorn.io')
      reason: Forbidden
      message: "ha-restore-drill-pv-guard : PV hors du drill (longhorn-drill réclamé depuis home-assistant-restore-test)"
    - expression: >-
        !variables.upd ||
        (has(object.spec.persistentVolumeReclaimPolicy) && object.spec.persistentVolumeReclaimPolicy == 'Delete')
      reason: Forbidden
      message: "ha-restore-drill-pv-guard : seule la reclaimPolicy Delete est admise"
    - expression: >-
        !variables.upd ||
        (has(object.spec.storageClassName) && object.spec.storageClassName == oldObject.spec.storageClassName &&
        has(object.spec.claimRef) && object.spec.claimRef == oldObject.spec.claimRef &&
        has(object.spec.csi) && object.spec.csi == oldObject.spec.csi &&
        object.spec.accessModes == oldObject.spec.accessModes &&
        has(object.spec.nodeAffinity) == has(oldObject.spec.nodeAffinity) &&
        (!has(object.spec.nodeAffinity) || object.spec.nodeAffinity == oldObject.spec.nodeAffinity) &&
        has(object.spec.mountOptions) == has(oldObject.spec.mountOptions) &&
        (!has(object.spec.mountOptions) || object.spec.mountOptions == oldObject.spec.mountOptions))
      reason: Forbidden
      message: "ha-restore-drill-pv-guard : seule spec.persistentVolumeReclaimPolicy peut changer"
    - expression: >-
        !variables.upd ||
        (has(object.metadata.labels) == has(oldObject.metadata.labels) &&
        (!has(object.metadata.labels) || object.metadata.labels == oldObject.metadata.labels) &&
        has(object.metadata.annotations) == has(oldObject.metadata.annotations) &&
        (!has(object.metadata.annotations) || object.metadata.annotations == oldObject.metadata.annotations) &&
        has(object.metadata.finalizers) == has(oldObject.metadata.finalizers) &&
        (!has(object.metadata.finalizers) || object.metadata.finalizers == oldObject.metadata.finalizers) &&
        has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences) &&
        (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences == oldObject.metadata.ownerReferences))
      reason: Forbidden
      message: "ha-restore-drill-pv-guard : labels, annotations, finalizers et ownerReferences inchangés"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ha-restore-drill-pv-guard
  labels:
    app.kubernetes.io/part-of: ha-restore-drill
spec:
  policyName: ha-restore-drill-pv-guard
  validationActions: [Deny]
  # PV cluster-scoped : pas de namespaceSelector ; matchConditions borne à l'identité du Job.
---
# PRD-76 — le ServiceAccount velero/ha-restore-drill ne peut créer qu'UN Restore
# de forme exacte : dernier backup du schedule velero-daily-home-assistant, pods,
# PVC et PV (sans les PV, Velero 1.18 ne crée aucun PodVolumeRestore), namespace
# home-assistant vers home-assistant-restore-test, modifier restore-pvc-isolation,
# ni hook, ni sélecteur, ni existingResourcePolicy. Ni UPDATE ni DELETE.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ha-restore-drill-restore-guard
  labels:
    app.kubernetes.io/part-of: ha-restore-drill
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [velero.io]
        apiVersions: ["*"]
        operations: ["*"]
        resources: ["*"]
  matchConditions:
    - name: ha-restore-drill-identity
      expression: request.userInfo.username == 'system:serviceaccount:velero:ha-restore-drill'
  validations:
    - expression: >-
        request.operation == 'CREATE' && request.resource.resource == 'restores' &&
        (!has(request.subResource) || request.subResource == '')
      reason: Forbidden
      message: "ha-restore-drill : seule la création d'un Restore est admise"
    - expression: >-
        request.namespace == 'velero' &&
        object.metadata.name.matches('^ha-restore-drill-[0-9]{14}$') &&
        has(object.spec.backupName) &&
        object.spec.backupName.matches('^velero-daily-home-assistant-[0-9]{14}$')
      reason: Forbidden
      message: "ha-restore-drill : nom du Restore ou backup hors du schedule velero-daily-home-assistant"
    - expression: >-
        has(object.spec.includedNamespaces) && object.spec.includedNamespaces == ['home-assistant'] &&
        has(object.spec.includedResources) &&
        object.spec.includedResources == ['pods', 'persistentvolumeclaims', 'persistentvolumes'] &&
        has(object.spec.namespaceMapping) &&
        object.spec.namespaceMapping == {'home-assistant': 'home-assistant-restore-test'} &&
        has(object.spec.restorePVs) && object.spec.restorePVs &&
        has(object.spec.resourceModifier) && object.spec.resourceModifier.kind == 'ConfigMap' &&
        object.spec.resourceModifier.name == 'restore-pvc-isolation' &&
        (!has(object.spec.resourceModifier.apiGroup) || object.spec.resourceModifier.apiGroup == '')
      reason: Forbidden
      message: "ha-restore-drill : périmètre du Restore différent du drill (namespaces, ressources, mapping, modifier)"
    - expression: >-
        !has(object.spec.scheduleName) && !has(object.spec.excludedNamespaces) &&
        !has(object.spec.excludedResources) && !has(object.spec.labelSelector) &&
        !has(object.spec.orLabelSelectors) && !has(object.spec.restoreStatus) &&
        !has(object.spec.preserveNodePorts) && !has(object.spec.includeClusterResources) &&
        !has(object.spec.hooks) && !has(object.spec.existingResourcePolicy) &&
        !has(object.spec.itemOperationTimeout) && !has(object.spec.uploaderConfig)
      reason: Forbidden
      message: "ha-restore-drill : champ de Restore non admis (hooks, sélecteurs, existingResourcePolicy...)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ha-restore-drill-restore-guard
  labels:
    app.kubernetes.io/part-of: ha-restore-drill
spec:
  policyName: ha-restore-drill-restore-guard
  validationActions: [Deny]
