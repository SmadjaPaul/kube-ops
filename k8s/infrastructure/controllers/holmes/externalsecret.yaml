apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: holmes-runtime
  namespace: agent-observers
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: holmes-runtime
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: APP_LITELLM_MASTER_KEY
    - secretKey: HOLMES_API_KEY
      remoteRef:
        key: HOLMES_API_KEY
    - secretKey: ARGOCD_MCP_AUTH_TOKEN
      remoteRef:
        key: ARGOCD_MCP_AUTH_TOKEN
    - secretKey: GRAFANA_MCP_AUTH_TOKEN
      remoteRef:
        key: GRAFANA_MCP_AUTH_TOKEN
