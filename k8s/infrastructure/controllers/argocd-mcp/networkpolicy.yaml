apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argocd-mcp
  namespace: agent-observers
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-mcp
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: omnigent-sandboxes
      ports:
        - protocol: TCP
          port: 3000
