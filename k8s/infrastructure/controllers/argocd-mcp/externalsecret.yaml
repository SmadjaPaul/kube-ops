apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-mcp
  namespace: agent-observers
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: argocd-mcp
    creationPolicy: Owner
  data:
    - secretKey: ARGOCD_API_TOKEN
      remoteRef:
        key: ARGOCD_MCP_API_TOKEN
