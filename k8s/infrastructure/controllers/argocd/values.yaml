configs:
  cm:
    create: true
    application.resourceTrackingMethod: annotation
    admin.enabled: false
    accounts.argocd-mcp: apiKey
    url: https://argocd.smadja.dev
    kustomize.buildOptions: '--enable-helm'
    resource.customizations.health.ConfigMap: |
      hs = {status = "Healthy", message = "Declarative configuration"}
      if obj.metadata ~= nil and obj.metadata.deletionTimestamp ~= nil then
        hs.status = "Progressing"
        hs.message = "ConfigMap is terminating"
      end
      return hs
    resource.customizations.health.Namespace: |
      hs = {status = "Healthy", message = "Namespace exists"}
      if obj.metadata ~= nil and obj.metadata.deletionTimestamp ~= nil then
        hs.status = "Progressing"
        hs.message = "Namespace is terminating"
      end
      return hs
    resource.customizations.health.argoproj.io_AppProject: |
      hs = {status = "Healthy", message = "Declarative Argo policy resource"}
      if obj.metadata ~= nil and obj.metadata.deletionTimestamp ~= nil then
        hs.status = "Progressing"
        hs.message = "AppProject is terminating"
      end
      return hs
    resource.customizations.health.external-secrets.io_ExternalSecret: |
      hs = {status = "Progressing", message = "Waiting for ExternalSecret Ready condition"}
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" and condition.status == "True" then
            return {status = "Healthy", message = condition.message or "Secret synchronized"}
          end
          if condition.type == "Ready" and condition.status == "False" then
            return {status = "Degraded", message = condition.message or "ExternalSecret not ready"}
          end
        end
      end
      return hs
    resource.customizations.health.gateway.networking.k8s.io_HTTPRoute: |
      hs = {status = "Progressing", message = "Waiting for Gateway controller"}
      if obj.status == nil or obj.status.parents == nil or #obj.status.parents == 0 then
        return hs
      end
      local accepted = false
      for _, parent in ipairs(obj.status.parents) do
        if parent.conditions ~= nil then
          for _, condition in ipairs(parent.conditions) do
            if condition.type == "Accepted" then
              if condition.status == "False" then
                return {status = "Degraded", message = condition.message or "HTTPRoute rejected"}
              elseif condition.status == "True" then
                accepted = true
              end
            end
            if condition.type == "ResolvedRefs" and condition.status == "False" then
              return {status = "Degraded", message = condition.message or "HTTPRoute backend references unresolved"}
            end
          end
        end
      end
      if accepted then
        return {status = "Healthy", message = "HTTPRoute accepted"}
      end
      return hs
    resource.customizations.health.gateway.networking.k8s.io_Gateway: |
      hs = {status = "Progressing", message = "Waiting for Gateway Programmed condition"}
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Programmed" and condition.status == "True" then
            return {status = "Healthy", message = condition.message or "Gateway programmed"}
          end
          if condition.type == "Programmed" and condition.status == "False" then
            return {status = "Degraded", message = condition.message or "Gateway not programmed"}
          end
        end
      end
      return hs
    dex.config: |
      connectors:
      - config:
          issuer: https://auth.smadja.dev/application/o/argocd/
          clientID: argocd
          clientSecret: $dex.authentik.clientSecret
          insecureEnableGroups: true
          scopes:
            - openid
            - profile
            - email
            - groups
        name: authentik
        type: oidc
        id: authentik

  params:
    controller.diff.server.side: true
    server.insecure: true
    # Kustomize's Helm inflator extracts charts into the repo-server working
    # directory. Serialize manifest generation so concurrent applications do
    # not untar the same chart into the same destination.
    reposerver.parallelism.limit: "1"

  rbac:
    create: true
    policy.default: role:readonly
    policy.csv: |
      g, admin, role:admin
      g, authentik-admins, role:admin
      g, dev, role:readonly
      g, argocd-mcp, role:readonly

crds:
  install: true
  keep: true

controller:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 512Mi
    limits:
      memory: 2Gi
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop: [ALL]

dex:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  # Dex can remain Ready after a connector initialization failure unless its
  # health endpoints are wired into kubelet. Keep Argo from routing SSO to a
  # process that is not listening and let kubelet recover transient failures.
  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true
  startupProbe:
    enabled: true

redis-ha:
  enabled: false

redis:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi

server:
  autoscaling:
    enabled: false
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 512Mi

repoServer:
  autoscaling:
    enabled: false
  pdb:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

applicationSet:
  replicas: 1
  pdb:
    enabled: false
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

notifications:
  enabled: false
