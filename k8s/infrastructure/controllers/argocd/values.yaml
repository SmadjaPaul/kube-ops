configs:
  cm:
    create: true
    application.resourceTrackingMethod: annotation
    admin.enabled: false
    accounts.argocd-mcp: apiKey
    url: https://argocd.smadja.dev
    kustomize.buildOptions: '--enable-helm'
    resource.customizations.health.ConfigMap: |
      hs = {status = "Healthy", message = "Declarative configuration"}
      if obj.metadata ~= nil and obj.metadata.deletionTimestamp ~= nil then
        hs.status = "Progressing"
        hs.message = "ConfigMap is terminating"
      end
      return hs
    resource.customizations.health.Namespace: |
      hs = {status = "Healthy", message = "Namespace exists"}
      if obj.metadata ~= nil and obj.metadata.deletionTimestamp ~= nil then
        hs.status = "Progressing"
        hs.message = "Namespace is terminating"
      end
      return hs
    # PLT-396: Argo CD 3.x no longer assesses child Application health by
    # default; without it an App of Apps stays Healthy while a child is broken
    # and sync waves are decorative. Same Lua as oracle-a1.
    resource.customizations.health.argoproj.io_Application: |
      hs = {status = "Progressing", message = "Waiting for the child Application to be Synced and Healthy"}
      -- A self-managed Application (root tracks itself) must not wait for its
      -- own health, or its sync deadlocks until the controller timeout.
      -- Argo's Lua VM has no string library: exact match, concatenation only.
      if obj.metadata ~= nil and obj.metadata.annotations ~= nil and obj.metadata.name ~= nil and obj.metadata.namespace ~= nil then
        local name = obj.metadata.name
        local self_tid = name .. ":argoproj.io/Application:" .. obj.metadata.namespace .. "/" .. name
        if obj.metadata.annotations["argocd.argoproj.io/tracking-id"] == self_tid then
          hs.status = "Healthy"
          hs.message = "Self-managed Application"
          return hs
        end
      end
      if obj.status ~= nil and obj.status.health ~= nil and obj.status.sync ~= nil then
        if obj.status.health.status == "Healthy" and obj.status.sync.status == "Synced" then
          hs.status = "Healthy"
          hs.message = obj.status.health.message or ""
        elseif obj.status.health.status == "Degraded" then
          hs.status = "Degraded"
          hs.message = obj.status.health.message or ""
        end
      end
      return hs
    # PLT-417: Argo CD 3.6 ships a built-in health check that maps a Velero Backup
    # in PartiallyFailed/Failed to Degraded. Backups are history records kept for
    # weeks, so one old failure kept infra-controllers Degraded and paged ntfy.
    # A finished Backup is therefore Healthy here; a real failure is alerted from
    # Velero metrics (VeleroBackupFailure, VeleroBackupPartialFailure,
    # VeleroBackupNotRunRecently in velero/prometheusrule.yaml). No Backup is deleted.
    resource.customizations.health.velero.io_Backup: |
      hs = {status = "Progressing", message = "Backup in progress"}
      if obj.status == nil or obj.status.phase == nil then
        hs.message = "Waiting for the Velero controller"
        return hs
      end
      local phase = obj.status.phase
      if phase == "Completed" then
        return {status = "Healthy", message = "Backup completed"}
      end
      if phase == "PartiallyFailed" or phase == "Failed" or phase == "FailedValidation" then
        return {status = "Healthy", message = "Backup finished as " .. phase .. " (alerted by VeleroBackup* rules, not by Argo)"}
      end
      return hs
    # PLT-417: the built-in ValidatingPolicy check (Argo CD 3.6) is Degraded as soon
    # as conditionStatus.ready is not true, which also covers background-scan
    # resolution errors (apiVersions "*" on external-secrets.io and cnpg kinds) while
    # the admission webhook is configured and enforcing. What matters for a Deny
    # policy is the WebhookConfigured condition: Healthy when True, Degraded when
    # False, Progressing while Kyverno has not reported.
    resource.customizations.health.policies.kyverno.io_ValidatingPolicy: |
      hs = {status = "Progressing", message = "Waiting for ValidatingPolicy status"}
      if obj.status ~= nil and obj.status.conditionStatus ~= nil and obj.status.conditionStatus.conditions ~= nil then
        for _, condition in ipairs(obj.status.conditionStatus.conditions) do
          if condition.type == "WebhookConfigured" then
            if condition.status == "True" then
              return {status = "Healthy", message = condition.message or "Webhook configured"}
            end
            return {status = "Degraded", message = "WebhookConfigured: " .. (condition.message or "webhook not configured")}
          end
        end
      end
      return hs
    resource.customizations.health.argoproj.io_AppProject: |
      hs = {status = "Healthy", message = "Declarative Argo policy resource"}
      if obj.metadata ~= nil and obj.metadata.deletionTimestamp ~= nil then
        hs.status = "Progressing"
        hs.message = "AppProject is terminating"
      end
      return hs
    resource.customizations.health.external-secrets.io_ExternalSecret: |
      hs = {status = "Progressing", message = "Waiting for ExternalSecret Ready condition"}
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" and condition.status == "True" then
            return {status = "Healthy", message = condition.message or "Secret synchronized"}
          end
          if condition.type == "Ready" and condition.status == "False" then
            return {status = "Degraded", message = condition.message or "ExternalSecret not ready"}
          end
        end
      end
      return hs
    resource.customizations.health.gateway.networking.k8s.io_HTTPRoute: |
      hs = {status = "Progressing", message = "Waiting for Gateway controller"}
      if obj.status == nil or obj.status.parents == nil or #obj.status.parents == 0 then
        return hs
      end
      local accepted = false
      for _, parent in ipairs(obj.status.parents) do
        if parent.conditions ~= nil then
          for _, condition in ipairs(parent.conditions) do
            if condition.type == "Accepted" then
              if condition.status == "False" then
                return {status = "Degraded", message = condition.message or "HTTPRoute rejected"}
              elseif condition.status == "True" then
                accepted = true
              end
            end
            if condition.type == "ResolvedRefs" and condition.status == "False" then
              return {status = "Degraded", message = condition.message or "HTTPRoute backend references unresolved"}
            end
          end
        end
      end
      if accepted then
        return {status = "Healthy", message = "HTTPRoute accepted"}
      end
      return hs
    resource.customizations.health.gateway.networking.k8s.io_Gateway: |
      hs = {status = "Progressing", message = "Waiting for Gateway Programmed condition"}
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Programmed" and condition.status == "True" then
            return {status = "Healthy", message = condition.message or "Gateway programmed"}
          end
          if condition.type == "Programmed" and condition.status == "False" then
            return {status = "Degraded", message = condition.message or "Gateway not programmed"}
          end
        end
      end
      return hs
    dex.config: |
      connectors:
      - config:
          issuer: https://auth.smadja.dev/application/o/argocd/
          clientID: argocd
          clientSecret: $dex.authentik.clientSecret
          insecureEnableGroups: true
          scopes:
            - openid
            - profile
            - email
            - groups
        name: authentik
        type: oidc
        id: authentik

  params:
    controller.diff.server.side: true
    server.insecure: true
    # Kustomize's Helm inflator extracts charts into the repo-server working
    # directory. Serialize manifest generation so concurrent applications do
    # not untar the same chart into the same destination.
    reposerver.parallelism.limit: "1"
    # Bound every sync operation (supported since Argo CD 2.x; chart 10.3.3 /
    # Argo CD v3.5.1 wires it as ARGOCD_APPLICATION_CONTROLLER_SYNC_TIMEOUT).
    # A sync stuck "waiting for healthy state" (fenced CNPG Cluster, image
    # pull failure) fails after 30 min instead of hanging until a manual
    # Terminate; automated retry/selfHeal then resumes. Default 0 = never.
    controller.sync.timeout.seconds: "1800"

  rbac:
    create: true
    policy.default: role:readonly
    policy.csv: |
      g, admin, role:admin
      g, authentik-admins, role:admin
      g, dev, role:readonly
      g, argocd-mcp, role:readonly

crds:
  install: true
  keep: true

controller:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 2Gi
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop: [ALL]

dex:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  # copyutil copies the ~200 MB argocd binary with `cp -n`. Under the dex 128Mi
  # limit it was OOMKilled mid-copy; the retry kept the truncated file and dex
  # segfaulted (exit 139) on every start. Give the init container its own budget.
  initImage:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 512Mi
  # Dex can remain Ready after a connector initialization failure unless its
  # health endpoints are wired into kubelet. Keep Argo from routing SSO to a
  # process that is not listening and let kubelet recover transient failures.
  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true
  startupProbe:
    enabled: true

redis-ha:
  enabled: false

redis:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi

server:
  autoscaling:
    enabled: false
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 512Mi

repoServer:
  autoscaling:
    enabled: false
  pdb:
    enabled: false
  resources:
    requests:
      cpu: 150m
      memory: 512Mi
    limits:
      memory: 2Gi

applicationSet:
  replicas: 1
  pdb:
    enabled: false
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

notifications:
  enabled: true
  # PLT-396: the ntfy publish URL (secret topic) is never in Git. The
  # ExternalSecret argocd-notifications-secret (externalsecret-notifications.yaml)
  # provides key ntfy-url from the existing Doppler key ALERTMANAGER_NTFY_URL.
  secret:
    create: false
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  context:
    argocdUrl: https://argocd.smadja.dev
  notifiers:
    service.webhook.ntfy: |
      url: $ntfy-url
      headers:
        - name: Content-Type
          value: text/plain
        - name: Title
          value: Argo CD
        - name: Priority
          value: high
        - name: Tags
          value: warning
  templates:
    template.app-sync-failed: |
      webhook:
        ntfy:
          method: POST
          body: |
            Sync en echec : {{.app.metadata.name}} (projet {{.app.spec.project}})
            Phase : {{.app.status.operationState.phase}}
            {{.app.status.operationState.message}}
            {{.context.argocdUrl}}/applications/{{.app.metadata.name}}
    template.app-health-degraded: |
      webhook:
        ntfy:
          method: POST
          body: |
            Application Degraded : {{.app.metadata.name}} (projet {{.app.spec.project}})
            Sync : {{.app.status.sync.status}}
            {{.context.argocdUrl}}/applications/{{.app.metadata.name}}
  triggers:
    # The previews project (per-PR environments) is excluded: it is noisy by
    # design. oncePer keeps one message per revision.
    trigger.on-sync-failed: |
      - when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed'] and app.spec.project != 'previews'
        oncePer: app.status.operationState.syncResult.revision
        send: [app-sync-failed]
    trigger.on-health-degraded: |
      - when: app.status.health.status == 'Degraded' and app.spec.project != 'previews'
        oncePer: app.status.sync.revision
        send: [app-health-degraded]
  subscriptions:
    - recipients:
        - webhook:ntfy
      triggers:
        - on-sync-failed
        - on-health-degraded
