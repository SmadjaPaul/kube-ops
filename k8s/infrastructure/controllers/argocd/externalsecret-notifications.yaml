# PLT-396: Argo CD Notifications -> ntfy. Reuses the Doppler key already used
# by Alertmanager (cluster/prd); no value in Git. The stored value may carry a
# query string (?template=alertmanager, Alertmanager JSON format): the template
# keeps only the bare topic URL because Argo sends plain text.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: argocd-notifications-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ntfy-url: '{{ .url | splitList "?" | first }}'
  data:
    - secretKey: url
      remoteRef:
        key: ALERTMANAGER_NTFY_URL
