# TEMPORARY (drill D0). Consumers in `eso-drill`, form (B): store k8s-auth, one remoteRef per key, no
# dataFrom, key = oidc-<namespace> or oidc-<namespace>--<usage> (admission rule eso-k8s-store-guard).
# The negative RBAC ExternalSecret (`eso-drill-forbidden`) was removed once proofs 3 and 6 were recorded:
# its permanent failure made every Argo sync operation of `infra-controllers` Failed, so the PostSync
# fingerprint Job (proof 4) never ran.
---
# Copy of the source: must become Ready (proof 2).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eso-drill-oidc
  namespace: eso-drill
  labels:
    kube-ops.io/drill: "true"
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: k8s-auth
  target:
    name: eso-drill-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: oidc-eso-drill
        property: password
