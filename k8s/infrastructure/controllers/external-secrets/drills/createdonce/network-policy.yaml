# TEMPORARY (drill D0). Default-deny ingress and egress for every pod of eso-drill (k8s/CLAUDE.md).
# The fingerprint Job only reads a mounted Secret: it needs no network, so nothing is opened.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: eso-drill-default-deny
  namespace: eso-drill
  labels:
    kube-ops.io/drill: "true"
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
