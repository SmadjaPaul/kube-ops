apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: external-secrets
resources:
- doppler-store.yaml
- namespace.yaml
- clusterrolebinding-clusterpushsecret.yaml
- clusterrole-clusterpushsecret.yaml

helmCharts:
  # Vendored from the official v2.6.0 release asset. Keeping the exact chart
  # in Git makes CI independent of transient Helm repository/proxy 504s.
  - name: external-secrets
    releaseName: external-secrets
    namespace: external-secrets
    valuesFile: values.yaml

helmGlobals:
  chartHome: charts
