apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: doppler-cluster
  annotations:
    smadja.dev/provider: doppler
spec:
  # PLT-395: never served to a preview namespace (smadja.dev/preview=true).
  conditions:
    - namespaceSelector:
        matchExpressions:
          - {key: smadja.dev/preview, operator: NotIn, values: ["true"]}
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            key: token
            name: doppler-access-token
            namespace: external-secrets
