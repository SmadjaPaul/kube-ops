# Compatibility store name retained for minimal upstream delta in V1.
# Provider is Doppler; V2 may rename this object and its consumers.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-backend
  annotations:
    smadja.dev/provider: doppler
spec:
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            key: token
            name: doppler-access-token
            namespace: external-secrets
