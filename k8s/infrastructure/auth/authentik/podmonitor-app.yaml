apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: authentik-app
  namespace: auth
  labels:
    app.kubernetes.io/name: authentik
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
  namespaceSelector:
    matchNames:
      - auth
