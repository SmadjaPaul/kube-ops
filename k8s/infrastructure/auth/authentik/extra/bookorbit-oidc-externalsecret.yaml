# BookOrbit OIDC identity consumed by the Authentik blueprint worker.
# Same remote key is provided securely to the BookOrbit admin configuration
# after bootstrap; never hardcode the client secret in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-bookorbit
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: authentik-blueprint-bookorbit
    creationPolicy: Owner
  data:
    - secretKey: BOOKORBIT_CLIENT_SECRET
      remoteRef:
        key: APP_BOOKORBIT_OIDC_CLIENT_SECRET
