# RustiCal is admitted only with the matching client secret present in
# cluster/prd. The same remote value is consumed by the RustiCal runtime ESO.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-rustical
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: authentik-blueprint-rustical
    creationPolicy: Owner
  data:
    - secretKey: RUSTICAL_OIDC_CLIENT_SECRET
      remoteRef:
        key: APP_RUSTICAL_OIDC_CLIENT_SECRET
