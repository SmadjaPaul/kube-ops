apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-matrix-mas-oidc
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: authentik-blueprint-matrix-mas-oidc, creationPolicy: Owner}
  data:
    - secretKey: MATRIX_MAS_OIDC_CLIENT_ID
      remoteRef: {key: APP_MATRIX_MAS_AUTHENTIK_OIDC_CLIENT_ID}
    - secretKey: MATRIX_MAS_OIDC_CLIENT_SECRET
      remoteRef: {key: APP_MATRIX_MAS_AUTHENTIK_OIDC_CLIENT_SECRET}
