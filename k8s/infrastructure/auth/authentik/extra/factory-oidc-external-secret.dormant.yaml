# Authentik's Factory blueprint consumes this secret through the Helm release.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-factory-oidc
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: authentik-blueprint-factory-oidc, creationPolicy: Owner}
  data:
    - secretKey: FACTORY_OIDC_CLIENT_SECRET
      remoteRef: {key: APP_MASTRA_FACTORY_AUTHENTIK_OIDC_CLIENT_SECRET}
