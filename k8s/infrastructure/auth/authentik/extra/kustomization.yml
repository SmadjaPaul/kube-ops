---
kind: Kustomization

resources:
  - secrets.yml
  - smtp-externalsecret.yaml

generatorOptions:
  disableNameSuffixHash: false

configMapGenerator:
  - name: authentik-blueprints
    files:
      - ./blueprints/apps-opencode.yaml
      - ./blueprints/apps-argocd.yaml
      - ./blueprints/apps-frigate.yaml
      - ./blueprints/apps-grafana.yaml
      - ./blueprints/apps-home-assistant.yaml
      - ./blueprints/apps-immich.yaml
      - ./blueprints/apps-jellyfin.yaml
      - ./blueprints/apps-media.yaml
      - ./blueprints/apps-openwebui.yaml
      - ./blueprints/apps-litellm.yaml
      - ./blueprints/apps-karakeep.yaml
      - ./blueprints/apps-kubernetes.yaml
      - ./blueprints/apps-cloudflare.yaml
      - ./blueprints/apps-pinepods.yaml
      - ./blueprints/apps-romm.yaml
      - ./blueprints/apps-mealie.yaml
      - ./blueprints/apps-vikunja.yaml
      - ./blueprints/apps-messages.yaml
      - ./blueprints/groups.yaml
      - ./blueprints/flows-invitation-operator.yaml
      - ./blueprints/qa-e2e-user.yaml
      - ./blueprints/brands.yaml
      - ./blueprints/authentication.yaml
      - ./blueprints/flows-default-provider-authorization-one-time-consent.yaml
      - ./blueprints/oauth-scopes.yaml
      - ./blueprints/outposts.yaml    # Human users enroll through short-lived Authentik invitations; no human
    # password or invitation token is stored in Git/Doppler. notifications.yaml
    # stays excluded until its optional Slack webhook exists.
