---
kind: Kustomization

resources:
  - secrets.yml
  - smtp-externalsecret.yaml
  - talos-bluegreen-externalsecret.yaml
  - factory-oidc-external-secret.dormant.yaml
  - matrix-mas-oidc-externalsecret.yaml
  # Legacy filename retained; this AIOStreams ExternalSecret is active.
  - aiostreams-oidc-externalsecret.dormant.yaml
  - rustical-oidc-externalsecret.yaml
  - polyfin-oidc-externalsecret.yaml
  - sparkyfitness-oidc-externalsecret.yaml
  - bookorbit-oidc-externalsecret.yaml
  # LibreChat's OIDC Secret and provider blueprint are both dormant files.
  # Include them together only in the activation PR after Doppler admission;
  # do not create an unready ExternalSecret in the active Authentik tree.

generatorOptions:
  disableNameSuffixHash: false

configMapGenerator:
  - name: authentik-blueprints
    files:
      - ./blueprints/apps-opencode.yaml
      - ./blueprints/apps-argocd.yaml
      - ./blueprints/apps-grafana.yaml
      - ./blueprints/apps-home-assistant.yaml
      - ./blueprints/apps-immich.yaml
      - ./blueprints/apps-jellyfin.yaml
      - ./blueprints/apps-media-v2.yaml
      - ./blueprints/apps-media.yaml
      - ./blueprints/apps-openwebui.yaml
      - ./blueprints/apps-litellm.yaml
      - ./blueprints/apps-karakeep.yaml
      - ./blueprints/apps-kubernetes.yaml
      - ./blueprints/apps-cloudflare.yaml
      - ./blueprints/apps-pinepods.yaml
      - ./blueprints/apps-romm.yaml
      - ./blueprints/apps-mealie.yaml
      - ./blueprints/apps-vikunja.yaml
      - ./blueprints/apps-paperless.yaml
      - ./blueprints/apps-ntfy.yaml
      - ./blueprints/apps-stirling-pdf.yaml
      - ./blueprints/apps-sure.yaml
      - ./blueprints/apps-searxng.yaml
      - ./blueprints/apps-invoice-ninja.yaml
      - ./blueprints/groups.yaml
      - ./blueprints/flows-invitation-operator.yaml
      - ./blueprints/qa-e2e-user.yaml
      - ./blueprints/brands.yaml
      - ./blueprints/authentication.yaml
      - ./blueprints/flows-default-provider-authorization-one-time-consent.yaml
      - ./blueprints/oauth-scopes.yaml
      - ./blueprints/outposts-v2.yaml    # Human users enroll through short-lived Authentik invitations; no human
      - ./blueprints/outposts.yaml    # Legacy managed instance compatibility; source is Git-owned.
      # password or invitation token is stored in Git/Doppler. notifications.yaml
      # stays excluded until its optional Slack webhook exists.
      - ./blueprints/apps-talos-bluegreen.yaml
      - ./blueprints/apps-factory.yaml
      - ./blueprints/apps-matrix-mas.yaml
      - ./blueprints/apps-aiostreams.yaml
      - ./blueprints/apps-rustical.yaml
      - ./blueprints/apps-polyfin.yaml
      - ./blueprints/apps-bookorbit.yaml
      - ./blueprints/apps-sparkyfitness.yaml
