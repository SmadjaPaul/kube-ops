# PLT-509: the Optio blueprint (blueprints/apps-optio.yaml) consumes these values through the
# Authentik server/worker env (values.yaml, envFrom optional). The same Doppler values are read by
# the Optio runtime ExternalSecret optio-oidc (k8s/applications/platform/optio). Created by Paul.
# Separate ExternalSecret: a missing Doppler key never breaks the existing authentik secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-optio
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: authentik-blueprint-optio
    creationPolicy: Owner
  data:
    - secretKey: OPTIO_OIDC_CLIENT_ID
      remoteRef:
        key: APP_OPTIO_OIDC_CLIENT_ID
    - secretKey: OPTIO_OIDC_CLIENT_SECRET
      remoteRef:
        key: APP_OPTIO_OIDC_CLIENT_SECRET
