# DORMANT. Intentionally NOT included in extra/kustomization.yml.
# Admit ONLY when Doppler key exists, Authentik OIDC issuer is qualified,
# and the matching application secret has been created.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-aiostreams-oidc
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: authentik-blueprint-aiostreams-oidc
    creationPolicy: Owner
  data:
    - secretKey: AIOSTREAMS_CLIENT_SECRET
      remoteRef:
        key: APP_AIOSTREAMS_OIDC_CLIENT_SECRET
