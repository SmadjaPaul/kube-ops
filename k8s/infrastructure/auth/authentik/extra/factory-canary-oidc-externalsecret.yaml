apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-factory-canary-oidc
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: authentik-blueprint-factory-canary-oidc, creationPolicy: Owner}
  data:
    - secretKey: FACTORY_CANARY_OIDC_CLIENT_SECRET
      remoteRef: {key: APP_MASTRA_FACTORY_CANARY_AUTHENTIK_OIDC_CLIENT_SECRET}
    - secretKey: FACTORY_CANARY_USER_PASSWORD
      remoteRef: {key: APP_MASTRA_FACTORY_CANARY_AUTHENTIK_USER_PASSWORD}
