# Authentik core bootstrap material for the V1 substrate.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-core-secrets
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: authentik-core-secrets
    creationPolicy: Owner
  data:
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: APP_AUTHENTIK_SECRET_KEY
    - secretKey: redis-password
      remoteRef:
        key: APP_AUTHENTIK_REDIS_PASSWORD
    - secretKey: AUTHENTIK_REDIS__PASSWORD
      remoteRef:
        key: APP_AUTHENTIK_REDIS_PASSWORD
    - secretKey: AUTHENTIK_BOOTSTRAP_TOKEN
      remoteRef:
        key: APP_AUTHENTIK_BOOTSTRAP_TOKEN
    - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
      remoteRef:
        key: APP_AUTHENTIK_BOOTSTRAP_PASSWORD
