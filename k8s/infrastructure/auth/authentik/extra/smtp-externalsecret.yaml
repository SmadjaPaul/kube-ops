# V1 keeps Migadu only as a managed SMTP transport.
# The business mail stack (Stalwart/Bulwark/Listmonk/etc.) remains deferred.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-smtp-credentials
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-backend
  target:
    name: authentik-smtp-credentials
    creationPolicy: Owner
  data:
    - secretKey: AUTHENTIK_EMAIL__HOST
      remoteRef:
        key: MIGADU_SMTP_HOST
    - secretKey: AUTHENTIK_EMAIL__PORT
      remoteRef:
        key: MIGADU_SMTP_PORT
    - secretKey: AUTHENTIK_EMAIL__USERNAME
      remoteRef:
        key: MIGADU_SMTP_USER
    - secretKey: AUTHENTIK_EMAIL__PASSWORD
      remoteRef:
        key: MIGADU_SMTP_PASSWORD
    - secretKey: AUTHENTIK_EMAIL__FROM
      remoteRef:
        key: MIGADU_SMTP_FROM
