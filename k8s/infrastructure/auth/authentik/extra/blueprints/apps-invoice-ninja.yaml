# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# yamllint disable-file
---
version: 1
metadata:
  name: Apps - Invoice Ninja
entries:
  - id: invoice_ninja_provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers: {name: k8s.smadja.dev/business/invoice-ninja}
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "default-provider-invalidation-flow"]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      client_type: confidential
      grant_types: [authorization_code]
      client_id: invoice-ninja
      client_secret: !Env INVOICE_NINJA_CLIENT_SECRET
      redirect_uris:
        - {url: https://gestion.lechaplais.com/auth/oidc, matching_mode: strict}
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
  - id: invoice_ninja_application
    model: authentik_core.application
    identifiers: {slug: invoice-ninja}
    attrs:
      name: Invoice Ninja
      group: Business
      meta_launch_url: https://gestion.lechaplais.com
      provider: !KeyOf invoice_ninja_provider
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf invoice_ninja_application, group: !Find [authentik_core.group, [name, "family"]]}
    attrs: {order: 10}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf invoice_ninja_application, group: !Find [authentik_core.group, [name, "authentik-admins"]]}
    attrs: {order: 100}
