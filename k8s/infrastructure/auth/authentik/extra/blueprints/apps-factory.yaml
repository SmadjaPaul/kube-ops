# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
---
version: 1
metadata:
  name: Apps - Mastra Factory
entries:
  - id: factory_oidc_provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: k8s.smadja.dev/platform/mastra-factory
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-one-time-consent"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "default-provider-invalidation-flow"]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      client_type: confidential
      grant_types: [authorization_code]
      redirect_uris:
        - url: https://factory.smadja.dev/auth/api/callback/authentik
          matching_mode: strict
      client_id: mastra-factory
      client_secret: !Env FACTORY_OIDC_CLIENT_SECRET
      access_code_validity: minutes=1
      access_token_validity: minutes=5
      refresh_token_validity: days=30
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "groups"]]

  - id: factory_oidc_application
    model: authentik_core.application
    identifiers:
      slug: factory
    attrs:
      name: Mastra Factory
      group: Infrastructure
      meta_description: AI-native software delivery
      provider: !KeyOf factory_oidc_provider
      policy_engine_mode: any

  - id: factory_admin_group_binding
    model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf factory_oidc_application
      group: !Find [authentik_core.group, [name, "admin"]]
    attrs: {order: 1}

  - id: factory_authentik_admin_group_binding
    model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf factory_oidc_application
      group: !Find [authentik_core.group, [name, "authentik-admins"]]
    attrs: {order: 2}
