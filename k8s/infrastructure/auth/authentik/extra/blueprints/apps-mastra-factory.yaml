# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# yamllint disable-file
# STAGED / INACTIVE: intentionally NOT included in extra/kustomization.yml.
# Do not load until the pinned Better Auth version, Factory browser SSO path,
# production license boundary and APP_MASTRA_FACTORY_OIDC_CLIENT_SECRET are verified.
---
version: 1
metadata:
  name: Apps - Mastra Factory
entries:
  - id: mastra_factory_oidc_provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: factory.smadja.dev/oidc
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-one-time-consent"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "default-provider-invalidation-flow"]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      client_type: confidential
      grant_types: [authorization_code]
      # Only one redirect should remain active after the actual Better Auth
      # version is confirmed. Better Auth 1.6 and 1.7 differ in callback path.
      redirect_uris:
        - url: https://factory.smadja.dev/api/auth/oauth2/callback/authentik
          matching_mode: strict
        - url: https://factory.smadja.dev/api/auth/callback/authentik
          matching_mode: strict
      client_id: mastra-factory
      client_secret: !Env MASTRA_FACTORY_OIDC_CLIENT_SECRET
      access_code_validity: minutes=1
      access_token_validity: hours=1
      refresh_token_validity: days=30
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "groups"]]

  - id: mastra_factory_application
    model: authentik_core.application
    identifiers:
      slug: mastra-factory
    attrs:
      name: Mastra Factory
      group: Infrastructure
      meta_description: Authenticated Software Factory (staged)
      meta_launch_url: https://factory.smadja.dev
      provider: !KeyOf mastra_factory_oidc_provider
      policy_engine_mode: any

  # Initial rollout restricted to operators; expand only after cross-user ACL E2E.
  - id: mastra_factory_admin_binding
    model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf mastra_factory_application
      group: !Find [authentik_core.group, [name, "admin"]]
    attrs: {order: 1}

  - id: mastra_factory_superadmin_binding
    model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf mastra_factory_application
      group: !Find [authentik_core.group, [name, "authentik-admins"]]
    attrs: {order: 2}
