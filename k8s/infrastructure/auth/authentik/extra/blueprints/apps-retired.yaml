# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# yamllint disable-file
# PRD-122: Authentik objects retired from this platform (deletion confirmed by
# Paul, 2026-11-25). `state: absent` deletes the object when it exists and does
# nothing when it does not (Authentik 2026.8.6, blueprints/v1/importer.py).
# Rules, enforced by tests/harness/authentik-retirements-contract-test.sh:
#   - only applications and providers, never users, groups or flows;
#   - identifiers only (slug or name), no attrs: an incomplete entry cannot
#     create anything;
#   - keep the entries: a retired object stays listed (retired and declared at
#     the same time is refused).
# Each application is listed before its provider.
# `frigate` is not here: the `Proxy Outpost` (outposts*.yaml) still uses its
# provider, and Authentik refuses a proxy outpost without a provider.
---
version: 1
metadata:
  name: Apps - Retired
entries:
