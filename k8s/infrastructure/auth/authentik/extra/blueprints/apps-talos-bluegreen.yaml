# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# yamllint disable-file
# prettier-ignore-start
# eslint-disable
---
version: 1
metadata:
  name: Apps - Talos blue green identity cells
entries:
  # These groups intentionally have no users in Git. Runtime identity
  # assignment is a separate operator-controlled action after a cell is
  # proven, and is not part of this reversible staging change.
  - id: talos-personal-users
    model: authentik_core.group
    identifiers: {name: Talos Personal Users}
    attrs: {name: Talos Personal Users}
  - id: talos-ops-users
    model: authentik_core.group
    identifiers: {name: Talos Ops Users}
    attrs: {name: Talos Ops Users}
  - id: talos-test-users
    model: authentik_core.group
    identifiers: {name: Talos Test Users}
    attrs: {name: Talos Test Users}

  # Every color is a separate confidential client. Never reuse a client
  # secret across colors: this keeps blue/green rollback and revocation
  # independent. The six client IDs and secrets are supplied by ESO/Doppler
  # through the companion ExternalSecret; no credential value is stored here.
  - id: talos-personal-blue-provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers: {name: k8s.smadja.dev/talos/personal-blue}
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "default-provider-invalidation-flow"]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      client_type: confidential
      grant_types: [authorization_code]
      client_id: !Env TALOS_PERSONAL_BLUE_CLIENT_ID
      client_secret: !Env TALOS_PERSONAL_BLUE_CLIENT_SECRET
      redirect_uris:
        - {url: https://talos-personal-blue.smadja.dev/auth/oidc/callback, matching_mode: strict}
      sub_mode: hashed_user_id
      access_code_validity: minutes=1
      access_token_validity: hours=1
      refresh_token_validity: days=30
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "groups"]]

  - id: talos-personal-green-provider
