  # The same tenant group is bound to both colors, so a future color cutover
  # does not require changing identity membership. Membership itself remains
  # outside this PR.
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf talos-personal-blue-application, group: !Find [authentik_core.group, [name, "Talos Personal Users"]]}
    attrs: {order: 10}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf talos-personal-green-application, group: !Find [authentik_core.group, [name, "Talos Personal Users"]]}
    attrs: {order: 10}
