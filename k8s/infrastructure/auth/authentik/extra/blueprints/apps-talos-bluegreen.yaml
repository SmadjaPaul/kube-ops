        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "groups"]]

  - id: talos-personal-blue-application
    model: authentik_core.application
    identifiers: {slug: talos-personal-blue}
    attrs:
      name: Talos Personal (blue)
      group: Talos
      meta_description: Staged Talos Personal native OIDC cell
      meta_launch_url: https://talos-personal-blue.smadja.dev
      provider: !KeyOf talos-personal-blue-provider
      policy_engine_mode: any
  - id: talos-personal-green-application
    model: authentik_core.application
    identifiers: {slug: talos-personal-green}
    attrs:
      name: Talos Personal (green)
