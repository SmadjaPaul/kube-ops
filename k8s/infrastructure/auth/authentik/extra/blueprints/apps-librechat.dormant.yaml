# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# yamllint disable-file
# This file is admitted only by the single Draft LibreChat activation PR. The
# PR must remain unmerged until the two Doppler keys exist and normal admission
# checks pass.
---
version: 1
metadata:
  name: Apps - LibreChat (dormant)
entries:
  - id: librechat_provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: k8s.smadja.dev/personal-ai/librechat
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "default-provider-invalidation-flow"]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      client_type: confidential
      grant_types: [authorization_code]
      client_id: librechat
      client_secret: !Env LIBRECHAT_OIDC_CLIENT_SECRET
      redirect_uris:
        - {url: https://librechat.smadja.dev/oauth/openid/callback, matching_mode: strict}
      sub_mode: user_email
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "groups"]]
  - id: librechat_application
    model: authentik_core.application
    identifiers: {slug: librechat}
    attrs:
      name: LibreChat
      group: Personal AI
      meta_launch_url: https://librechat.smadja.dev
      provider: !KeyOf librechat_provider
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf librechat_application, group: !Find [authentik_core.group, [name, "family"]]}
    attrs: {order: 10}
