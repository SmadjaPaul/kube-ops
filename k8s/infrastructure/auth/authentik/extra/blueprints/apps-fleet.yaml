# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# PLT-316 (D-2026-11-14-06 point 3, Paul's agreement of 2026-11-15): SAML SSO for
# Fleet. Fields validated against the Authentik 2026.8.3 blueprint schema
# (blueprints/schema.json, model authentik_providers_saml.samlprovider).
# Rollback (docs/operations/fleet-saml-sso.md): set enable_sso: false in Fleet,
# revert this file and its line in ../kustomization.yml, then delete the
# application and provider in the Authentik UI (blueprint removal keeps them).
# Fleet keeps its local admin account.
version: 1
metadata:
  name: Apps - Fleet
entries:
  - id: fleet_saml_provider
    model: authentik_providers_saml.samlprovider
    identifiers:
      name: k8s.smadja.dev/identity/fleet
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "default-provider-invalidation-flow"]]
      acs_url: https://fleet.smadja.dev/api/v1/fleet/sso/callback
      audience: https://fleet.smadja.dev
      issuer_override: authentik
      sp_binding: post
      signing_kp: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      name_id_mapping: !Find
        - authentik_providers_saml.samlpropertymapping
        - [managed, "goauthentik.io/providers/saml/email"]
      property_mappings:
        - !Find [authentik_providers_saml.samlpropertymapping, [managed, "goauthentik.io/providers/saml/email"]]
        - !Find [authentik_providers_saml.samlpropertymapping, [managed, "goauthentik.io/providers/saml/name"]]
  - id: fleet_application
    model: authentik_core.application
    identifiers: {slug: fleet}
    attrs:
      name: Fleet
      group: Administration
      meta_launch_url: https://fleet.smadja.dev
      meta_icon: https://raw.githubusercontent.com/fleetdm/fleet/02e64b1fb37ddc4196b16eda2babaa6f8f5a535a/apps/fleet-desktop-macos/FleetDesktop/fleet-logo.png
      provider: !KeyOf fleet_saml_provider
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf fleet_application, group: !Find [authentik_core.group, [name, "admin"]]}
    attrs: {order: 10}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf fleet_application, group: !Find [authentik_core.group, [name, "authentik-admins"]]}
    attrs: {order: 100}
