# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# yamllint disable-file
---
version: 1
metadata:
  name: Apps - ntfy
entries:
  - id: ntfy_provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: k8s.smadja.dev/catalog/ntfy
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "default-provider-invalidation-flow"]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      client_type: confidential
      grant_types: [authorization_code]
      client_id: ntfy
      client_secret: !Env NTFY_CLIENT_SECRET
      redirect_uris:
        - {url: https://ntfy.smadja.dev/_oauth2/callback, matching_mode: strict}
      sub_mode: user_email
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
  - id: ntfy_application
    model: authentik_core.application
    identifiers: {slug: ntfy}
    attrs:
      name: ntfy
      group: Family
      meta_launch_url: https://ntfy.smadja.dev
      provider: !KeyOf ntfy_provider
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf ntfy_application, group: !Find [authentik_core.group, [name, "family"]]}
    attrs: {order: 10}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf ntfy_application, group: !Find [authentik_core.group, [name, "authentik-admins"]]}
    attrs: {order: 100}