# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# yamllint disable-file
---
version: 1
metadata:
  name: Apps - Mealie
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: { name: System - OAuth2 Provider - Scopes }
      required: true
  - model: authentik_providers_oauth2.oauth2provider
    id: mealie-provider
    identifiers:
      name: mealie
    attrs:
      name: mealie
      client_id: mealie
      client_type: confidential
      client_secret: !Env MEALIE_OIDC_CLIENT_SECRET
      grant_types: [authorization_code]
      include_claims_in_id_token: true
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
      redirect_uris:
        - matching_mode: strict
          url: https://mealie.smadja.dev/login
        - matching_mode: strict
          url: https://mealie.smadja.dev/login?direct=1
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
  - model: authentik_core.application
    id: mealie-application
    identifiers:
      slug: mealie
    attrs:
      name: Mealie
      slug: mealie
      provider: !KeyOf mealie-provider
      policy_engine_mode: any
      meta_launch_url: https://mealie.smadja.dev
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, mealie]]
      group: !Find [authentik_core.group, [name, family]]
    attrs:
      order: 0
