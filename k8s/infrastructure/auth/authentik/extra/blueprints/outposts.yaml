
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# yamllint disable-file
---
version: 1
metadata:
  name: Outposts
entries:
  # File-based blueprints are discovered/applied in unspecified order.
  # Official meta model ensures the proxy providers are present before
  # this outpost resolves them via !Find (no best-effort ordering guesses).
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Apps - Media
      required: true
  # Native OIDC is the default. Keep a single managed proxy outpost only for
  # applications that cannot consume OIDC directly.
  - model: authentik_outposts.outpost
    state: present
    identifiers:
      name: "Proxy Outpost"
    attrs:
      type: proxy
      service_connection:
        !Find [
          authentik_outposts.outpostserviceconnection,
          [name, "Local Kubernetes Cluster"],
        ]
      providers:
        - !Find [
            authentik_core.provider,
            [name, "k8s.smadja.dev/services-frigate"],
          ]
        - !Find [
            authentik_core.provider,
            [name, "k8s.smadja.dev/services-media/radarr-proxy"],
          ]
        - !Find [
            authentik_core.provider,
            [name, "k8s.smadja.dev/services-media/sonarr-proxy"],
          ]
        - !Find [
            authentik_core.provider,
            [name, "k8s.smadja.dev/services-media/prowlarr-proxy"],
          ]
      config:
        log_level: info
        authentik_host: https://auth.smadja.dev
        object_naming_template: ak-outpost-%(name)s
        kubernetes_namespace: auth
        kubernetes_replicas: 1
        kubernetes_service_type: ClusterIP
        # Gateway API resources are Git-owned in kube-ops.
        kubernetes_disabled_components:
          - ingress
          - httproute


