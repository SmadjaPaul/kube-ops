# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# STAGED ONLY: do not import into active Authentik blueprint bundle until
# APP_AIOSTREAMS_OIDC_CLIENT_SECRET exists and AIOStreams local login passes.
---
version: 1
metadata:
  name: Apps - AIOStreams
entries:
  - id: aiostreams_provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: k8s.smadja.dev/media/aiostreams
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "default-provider-invalidation-flow"]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      client_type: confidential
      grant_types: [authorization_code]
      client_id: aiostreams
      client_secret: !Env AIOSTREAMS_CLIENT_SECRET
      redirect_uris:
        - {url: https://aiostreams.smadja.dev/api/v1/auth/oidc/callback, matching_mode: strict}
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "groups"]]
  - id: aiostreams_application
    model: authentik_core.application
    identifiers: {slug: aiostreams}
    attrs:
      name: AIOStreams
      group: Media
      meta_launch_url: https://aiostreams.smadja.dev
      provider: !KeyOf aiostreams_provider
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf aiostreams_application, group: !Find [authentik_core.group, [name, "authentik-admins"]]}
    attrs: {order: 10}
