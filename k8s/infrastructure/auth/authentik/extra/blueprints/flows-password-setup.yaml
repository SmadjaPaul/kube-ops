# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# yamllint disable-file
---
version: 1
metadata:
  name: Recovery - Admin password setup link
entries:
  # Generic password setup for human accounts declared without a password
  # (groups.yaml) or for an admin-initiated reset. Procedure:
  # docs/operations/authentik-human-accounts.md.
  #
  # The flow has no identification and no e-mail stage: it cannot start from a
  # username or an e-mail address. It runs only from a link created by an admin
  # (Directory > Users > Send recovery link / Create recovery link), whose token
  # carries the target user. The public "forgot password" link of the
  # identification stage is unchanged (authentication.yaml).
  - id: password-setup-flow
    model: authentik_flows.flow
    identifiers:
      slug: password-setup
    attrs:
      name: Password setup
      title: Définir votre mot de passe
      designation: recovery
      authentication: require_unauthenticated

  # Flow policies are evaluated with the pending user of the link
  # (FlowPlanner.plan). An anonymous visitor has no pending user and is
  # refused. Superuser accounts (authentik-admins) are excluded: a leaked link
  # cannot reset an admin password, and admin recovery stays out of band.
  - id: password-setup-target-policy
    model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: password-setup-internal-non-admin
    attrs:
      name: password-setup-internal-non-admin
      expression: |
        user = request.user
        return (
            user.is_authenticated
            and str(user.type) == "internal"
            and not user.is_superuser
        )

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf password-setup-flow
      policy: !KeyOf password-setup-target-policy
    attrs:
      order: 0

  - id: password-setup-password-policy
    model: authentik_policies_password.passwordpolicy
    identifiers:
      name: password-setup-password-policy
    attrs:
      password_field: password
      check_static_rules: true
      length_min: 12
      check_zxcvbn: true
      # Fails when the score is <= threshold: 2 means a zxcvbn score of 3 or 4.
      zxcvbn_score_threshold: 2
      # Disabled: it calls an external API from the Authentik pod.
      check_have_i_been_pwned: false
      error_message: Mot de passe trop faible (12 caractères minimum, difficile à deviner).

  - id: password-setup-field-password
    model: authentik_stages_prompt.prompt
    identifiers:
      name: password-setup-field-password
    attrs:
      field_key: password
      label: Mot de passe
      type: password
      required: true
      placeholder: Mot de passe
      placeholder_expression: false
      order: 0

  - id: password-setup-field-password-repeat
    model: authentik_stages_prompt.prompt
    identifiers:
      name: password-setup-field-password-repeat
    attrs:
      field_key: password_repeat
      label: Mot de passe (confirmation)
      type: password
      required: true
      placeholder: Mot de passe (confirmation)
      placeholder_expression: false
      order: 1

  - id: password-setup-prompt
    model: authentik_stages_prompt.promptstage
    identifiers:
      name: password-setup-prompt
    attrs:
      fields:
        - !KeyOf password-setup-field-password
        - !KeyOf password-setup-field-password-repeat
      validation_policies:
        - !KeyOf password-setup-password-policy

  - id: password-setup-user-write
    model: authentik_stages_user_write.userwritestage
    identifiers:
      name: password-setup-user-write
    attrs:
      user_creation_mode: never_create

  - id: password-setup-user-login
    model: authentik_stages_user_login.userloginstage
    identifiers:
      name: password-setup-user-login

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf password-setup-flow
      stage: !KeyOf password-setup-prompt
      order: 10
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf password-setup-flow
      stage: !KeyOf password-setup-user-write
      order: 20
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf password-setup-flow
      stage: !KeyOf password-setup-user-login
      order: 100
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: false

  # E-mail template used by "Send recovery link". It is not bound to the flow:
  # the admin action picks it and sends the link to the user's `email` only.
  - id: password-setup-email
    model: authentik_stages_email.emailstage
    identifiers:
      name: password-setup-email
    attrs:
      use_global_settings: true
      subject: "smadja.dev : définissez votre mot de passe"
      template: email/password_reset.html
      token_expiry: hours=24
      activate_user_on_success: false

  # Admin recovery links use the brand's recovery flow (UserViewSet
  # `_create_recovery_link`: "No recovery flow set." without it). Partial update:
  # brands.yaml keeps owning the other brand attributes. Kept in this file so the
  # !KeyOf resolves in the same run.
  - model: authentik_brands.brand
    state: present
    identifiers:
      domain: authentik-default
    attrs:
      flow_recovery: !KeyOf password-setup-flow
