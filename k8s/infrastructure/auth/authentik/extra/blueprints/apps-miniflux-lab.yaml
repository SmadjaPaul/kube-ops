# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Miniflux of the OKE lab (openchoreo-lab apps/miniflux/app.yaml, https://miniflux.lab.smadja.dev).
# Per-provider issuer (Authentik default): https://auth.smadja.dev/application/o/miniflux-lab/.
# Not an OpenChoreo client. OAUTH2_USER_CREATION=1 on the Miniflux side: any holder of a valid
# token gets an account, so the refusal MUST come from here (family + friends bindings only;
# zero marginal cost, PLT-176). No authentik-admins binding (Paul's request).
# client_secret is NOT declared: Authentik generates it; Paul copies it out of Git
# (key MINIFLUX_OAUTH2_CLIENT_SECRET of the lab vault).
version: 1
metadata:
  name: Apps - Miniflux (OKE lab)
entries:
  - id: miniflux-lab-provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: lab.smadja.dev/miniflux
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "default-provider-invalidation-flow"]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      issuer_mode: per_provider
      client_type: confidential
      grant_types: [authorization_code]
      client_id: miniflux
      redirect_uris:
        - {url: "https://miniflux.lab.smadja.dev/oauth2/oidc/callback", matching_mode: strict}
      access_code_validity: minutes=1
      access_token_validity: minutes=5
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "groups"]]
  - id: miniflux-lab-application
    model: authentik_core.application
    identifiers: {slug: miniflux-lab}
    attrs:
      name: Miniflux (lab)
      group: Personal
      meta_launch_url: "https://miniflux.lab.smadja.dev"
      provider: !KeyOf miniflux-lab-provider
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf miniflux-lab-application, group: !Find [authentik_core.group, [name, "family"]]}
    attrs: {order: 10}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf miniflux-lab-application, group: !Find [authentik_core.group, [name, "friends"]]}
    attrs: {order: 20}
