# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# yamllint disable-file
---
version: 1
metadata:
  name: Apps - Omnigent
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: System - OAuth2 Provider - Scopes
      required: true
  - model: authentik_providers_oauth2.oauth2provider
    id: omnigent-provider
    identifiers:
      name: omnigent
    attrs:
      name: omnigent
      client_id: omnigent
      client_type: confidential
      grant_types: [authorization_code]
      client_secret: !Env OMNIGENT_OIDC_CLIENT_SECRET
      include_claims_in_id_token: true
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
      redirect_uris:
        - matching_mode: strict
          url: https://omnigent.smadja.dev/auth/callback
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
  - model: authentik_core.application
    id: omnigent-application
    identifiers:
      slug: omnigent
    attrs:
      name: Omnigent
      slug: omnigent
      provider: !KeyOf omnigent-provider
      policy_engine_mode: any
      meta_launch_url: https://omnigent.smadja.dev
      meta_description: Agentic software factory control plane
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, omnigent]]
      group: !Find [authentik_core.group, [name, dev]]
    attrs:
      order: 0
