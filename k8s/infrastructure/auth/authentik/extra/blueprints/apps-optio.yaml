# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# PLT-509 (D-2026-11-25-05, MANDAT 30): OIDC client of Optio (k8s/applications/platform/optio).
# Client id and secret come from the optional Secret authentik-blueprint-optio
# (optio-oidc-externalsecret.yaml): until Paul creates them in Doppler, only this blueprint fails.
version: 1
metadata:
  name: Apps - Optio
entries:
  - id: optio_provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: k8s.smadja.dev/platform/optio
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "default-provider-invalidation-flow"]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      client_type: confidential
      grant_types: [authorization_code]
      client_id: !Env OPTIO_OIDC_CLIENT_ID
      client_secret: !Env OPTIO_OIDC_CLIENT_SECRET
      redirect_uris:
        - {url: https://optio.smadja.dev/api/auth/oidc/callback, matching_mode: strict}
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "groups"]]
  - id: optio_application
    model: authentik_core.application
    identifiers: {slug: optio}
    attrs:
      name: Optio
      group: Platform
      meta_launch_url: https://optio.smadja.dev
      provider: !KeyOf optio_provider
      policy_engine_mode: any
  # Access: authentik-admins only.
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf optio_application, group: !Find [authentik_core.group, [name, "authentik-admins"]]}
    attrs: {order: 100}
