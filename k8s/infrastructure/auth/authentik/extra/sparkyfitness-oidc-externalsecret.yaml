# SparkyFitness blueprint consumes this value through the Authentik worker env.
# The same Doppler value is delivered to the SparkyFitness runtime ESO.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-sparkyfitness
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: authentik-blueprint-sparkyfitness
    creationPolicy: Owner
  data:
    - secretKey: SPARKYFITNESS_OIDC_CLIENT_SECRET
      remoteRef:
        key: APP_SPARKYFITNESS_OIDC_CLIENT_SECRET
