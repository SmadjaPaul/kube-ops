apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-polyfin
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: authentik-blueprint-polyfin
    creationPolicy: Owner
  data:
    - secretKey: POLYFIN_OIDC_CLIENT_SECRET
      remoteRef:
        key: APP_POLYFIN_OIDC_CLIENT_SECRET
