# Secret client OIDC de miniflux : genere une fois (CreatedOnce), lu par Authentik via envFrom
# (authentik-blueprint-miniflux), et lu par l'application via SecretStore auth-source.
# La cle est propre au service (MINIFLUX_OIDC_CLIENT_SECRET) car envFrom fusionne toutes les
# authentik-blueprint-* dans le pod Authentik : deux cles identiques s'ecraseraient.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: authentik-blueprint-miniflux
  namespace: auth
spec:
  length: 64
  digits: 10
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-miniflux
  namespace: auth
spec:
  refreshPolicy: CreatedOnce
  target:
    name: authentik-blueprint-miniflux
    creationPolicy: Orphan
    template:
      engineVersion: v2
      type: Opaque
      data:
        MINIFLUX_OIDC_CLIENT_SECRET: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: authentik-blueprint-miniflux
---
# Lecture du seul secret par le SA secret-reader de miniflux (namespace auth, Role nommee).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authentik-blueprint-miniflux-reader
  namespace: auth
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["authentik-blueprint-miniflux"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authentik-blueprint-miniflux-reader
  namespace: auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authentik-blueprint-miniflux-reader
subjects:
  - kind: ServiceAccount
    name: miniflux-secret-reader
    namespace: miniflux
