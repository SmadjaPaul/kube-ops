# k8s/infrastructure/auth/authentik/extra/secrets.yml
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-core-secrets
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: authentik-core-secrets
    creationPolicy: Owner
  data:
    # --- Authentik Secret Key ---
    # Changed from 'secret-key' to 'AUTHENTIK_SECRET_KEY' for env var usage
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: 'APP_AUTHENTIK_SECRET_KEY'

    # --- Redis Password ---
    - secretKey: redis-password
      remoteRef:
        key: 'APP_AUTHENTIK_REDIS_PASSWORD'

    - secretKey: AUTHENTIK_REDIS__PASSWORD
      remoteRef:
        key: 'APP_AUTHENTIK_REDIS_PASSWORD'
    # --- Bootstrap Credentials ---
    - secretKey: AUTHENTIK_BOOTSTRAP_TOKEN
      remoteRef:
        key: 'APP_AUTHENTIK_BOOTSTRAP_TOKEN'
    - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
      remoteRef:
        key: 'APP_AUTHENTIK_BOOTSTRAP_PASSWORD'
    - secretKey: AUTHENTIK_BOOTSTRAP_EMAIL
      remoteRef:
        key: 'APP_AUTHENTIK_ADMIN_EMAIL'

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-secrets
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: authentik-blueprint-secrets
    creationPolicy: Owner
