      remoteRef:
        key: 'APP_AUTHENTIK_NOTIFICATIONS_SLACK_WEBHOOK'

    # --- User Emails ---
    - secretKey: ARGOCD_ADMIN_EMAIL
      remoteRef:
        key: 'APP_AUTHENTIK_ADMIN_EMAIL' # Replace with your admin email item key
