---
# Per-new-app secrets. Each is its own ExternalSecret so a missing
# Doppler key on one app cannot break the others. The blueprint
# mounting list (Authentik deployment envFrom:) declares each one
# individually; if Doppler doesn't have one app key yet, only that
# blueprint fails to render its provider.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-mealie
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: authentik-blueprint-mealie
    creationPolicy: Owner
  data:
    - secretKey: MEALIE_CLIENT_SECRET
      remoteRef: { key: 'APP_MEALIE_OIDC_CLIENT_SECRET' }

