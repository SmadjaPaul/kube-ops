# k8s/infrastructure/auth/authentik/extra/secrets.yml
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-core-secrets
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: authentik-core-secrets
    creationPolicy: Owner
  data:
    # --- Authentik Secret Key ---
    # Changed from 'secret-key' to 'AUTHENTIK_SECRET_KEY' for env var usage
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: 'APP_AUTHENTIK_SECRET_KEY'

    # --- Redis Password ---
    - secretKey: redis-password
      remoteRef:
        key: 'APP_AUTHENTIK_REDIS_PASSWORD'

    - secretKey: AUTHENTIK_REDIS__PASSWORD
      remoteRef:
        key: 'APP_AUTHENTIK_REDIS_PASSWORD'
    # --- Bootstrap Credentials ---
    - secretKey: AUTHENTIK_BOOTSTRAP_TOKEN
      remoteRef:
        key: 'APP_AUTHENTIK_BOOTSTRAP_TOKEN'
    - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
      remoteRef:
        key: 'APP_AUTHENTIK_BOOTSTRAP_PASSWORD'
    - secretKey: AUTHENTIK_BOOTSTRAP_EMAIL
      remoteRef:
        key: 'APP_AUTHENTIK_ADMIN_EMAIL'

---
# Shared admin email + synthetic QA identity + ArgoCD client secret.
# These are referenced by other Authentik blueprints (admin landing
# page, Grafana viewer provisioning) so they live in their own
# ExternalSecret. Failure here blocks only the auth apps group,
# not the media/automation consumers.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-core-secrets
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: authentik-blueprint-core-secrets
    creationPolicy: Owner
  data:
    - secretKey: ARGOCD_ADMIN_EMAIL
      remoteRef:
        key: 'APP_AUTHENTIK_ADMIN_EMAIL'
    - secretKey: GRAFANA_VIEWER_EMAIL
      remoteRef:
        key: 'APP_AUTHENTIK_ADMIN_EMAIL'
    - secretKey: E2E_USER_PASSWORD
      remoteRef:
        key: 'APP_E2E_USER_PASSWORD'
    - secretKey: ARGOCD_CLIENT_SECRET
      remoteRef:
        key: 'APP_ARGOCD_OIDC_CLIENT_SECRET_V1'

---
