# Dormant companion to blueprints/apps-librechat.dormant.yaml. The values are
# owned by the operator in Doppler and are never placed in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-librechat
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: authentik-blueprint-librechat
    creationPolicy: Owner
  data:
    - secretKey: LIBRECHAT_OIDC_CLIENT_SECRET
      remoteRef:
        key: APP_LIBRECHAT_OIDC_CLIENT_SECRET
