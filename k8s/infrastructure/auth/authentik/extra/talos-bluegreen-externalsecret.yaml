---
# Staged client contract for the six Authentik native OIDC cells. The values
# are generated/provisioned in the external Doppler authority, never in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-talos-bluegreen
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: authentik-blueprint-talos-bluegreen
    creationPolicy: Owner
  data:
    - secretKey: TALOS_PERSONAL_BLUE_CLIENT_ID
      remoteRef: {key: APP_TALOS_PERSONAL_BLUE_OAUTH_CLIENT_ID}
    - secretKey: TALOS_PERSONAL_BLUE_CLIENT_SECRET
      remoteRef: {key: APP_TALOS_PERSONAL_BLUE_OAUTH_CLIENT_SECRET}
    - secretKey: TALOS_PERSONAL_GREEN_CLIENT_ID
      remoteRef: {key: APP_TALOS_PERSONAL_GREEN_OAUTH_CLIENT_ID}
    - secretKey: TALOS_PERSONAL_GREEN_CLIENT_SECRET
      remoteRef: {key: APP_TALOS_PERSONAL_GREEN_OAUTH_CLIENT_SECRET}
    - secretKey: TALOS_OPS_BLUE_CLIENT_ID
      remoteRef: {key: APP_TALOS_OPS_BLUE_OAUTH_CLIENT_ID}
    - secretKey: TALOS_OPS_BLUE_CLIENT_SECRET
      remoteRef: {key: APP_TALOS_OPS_BLUE_OAUTH_CLIENT_SECRET}
    - secretKey: TALOS_OPS_GREEN_CLIENT_ID
      remoteRef: {key: APP_TALOS_OPS_GREEN_OAUTH_CLIENT_ID}
    - secretKey: TALOS_OPS_GREEN_CLIENT_SECRET
      remoteRef: {key: APP_TALOS_OPS_GREEN_OAUTH_CLIENT_SECRET}
    - secretKey: TALOS_TEST_BLUE_CLIENT_ID
      remoteRef: {key: APP_TALOS_TEST_BLUE_OAUTH_CLIENT_ID}
    - secretKey: TALOS_TEST_BLUE_CLIENT_SECRET
      remoteRef: {key: APP_TALOS_TEST_BLUE_OAUTH_CLIENT_SECRET}
    - secretKey: TALOS_TEST_GREEN_CLIENT_ID
      remoteRef: {key: APP_TALOS_TEST_GREEN_OAUTH_CLIENT_ID}
    - secretKey: TALOS_TEST_GREEN_CLIENT_SECRET
      remoteRef: {key: APP_TALOS_TEST_GREEN_OAUTH_CLIENT_SECRET}
