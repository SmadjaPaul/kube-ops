apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-postgresql-restored
  namespace: auth
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7
  bootstrap:
    initdb:
      database: app
      owner: app
  # PLT-221: a Cluster has a single WAL archiver; the archive moved from
  # Hetzner to authentik-r2-store. PLT-94: the Hetzner store was removed from
  # kube-ops; recovery points live on R2 only.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: authentik-r2-store
  storage:
    size: 40Gi
    storageClass: longhorn-fast
  walStorage:
    size: 30Gi
    storageClass: longhorn-fast
  resources:
    requests:
      memory: 512Mi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: 1000m
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "2621kB"
      huge_pages: "off"
      min_wal_size: "1GB"
      # PLT-344 lot 0, décision Paul 2026-11-15 (Authentik protégée) : réglage à chaud,
      # aucun redémarrage. archive_timeout 5min (défaut CNPG) forçait 288 segments WAL/jour
      # -> 96. Contrepartie : RPO R2 jusqu'à 15 min (données perdues si le volume disparaît
      # entre deux archivages).
      checkpoint_timeout: "15min"
      max_wal_size: "2GB"
      wal_compression: "lz4"
      archive_timeout: "15min"
  monitoring:
    enablePodMonitor: false
  minSyncReplicas: 0
  maxSyncReplicas: 0
  affinity:
    enablePodAntiAffinity: false
