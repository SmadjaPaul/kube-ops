apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-postgresql-restored
  namespace: auth
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7
  bootstrap:
    initdb:
      database: app
      owner: app
  # PLT-221: a Cluster has a single WAL archiver; the archive moved from
  # authentik-hetzner-store to authentik-r2-store (database-r2.yaml). Rollback:
  # revert the cutover PR, which points barmanObjectName back to
  # authentik-hetzner-store both here and in database-scheduled-backup.yaml,
  # then take a new base backup there. Hetzner rollback point: base
  # 20261112T2329* (23:29Z) with no recovery target; base 20261112T234612 is
  # not restorable from Hetzner alone (its WAL went to R2), never use "latest".
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: authentik-r2-store
  storage:
    size: 40Gi
    storageClass: longhorn-fast
  walStorage:
    size: 30Gi
    storageClass: longhorn-fast
  resources:
    requests:
      memory: 512Mi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: 1000m
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "2621kB"
      huge_pages: "off"
      min_wal_size: "1GB"
      max_wal_size: "3GB"
  monitoring:
    enablePodMonitor: false
  minSyncReplicas: 0
  maxSyncReplicas: 0
  affinity:
    enablePodAntiAffinity: false
