apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-postgresql-restored
  namespace: auth
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7
  bootstrap:
    initdb:
      database: app
      owner: app
  storage:
    size: 40Gi
    storageClass: proxmox-csi
  walStorage:
    size: 30Gi
    storageClass: proxmox-csi
  resources:
    requests:
      memory: 512Mi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: 1000m
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "2621kB"
      huge_pages: "off"
      min_wal_size: "1GB"
      max_wal_size: "3GB"
  monitoring:
    enablePodMonitor: false
  minSyncReplicas: 0
  maxSyncReplicas: 0
  affinity:
    enablePodAntiAffinity: false
