apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: auth
resources:
- database.yaml
- database-scheduled-backup.yaml
- database-r2.yaml
- backup-r2-initial.yaml
- podmonitor.yaml
- podmonitor-app.yaml
- httproute.yaml
- extra
helmCharts:
- name: authentik
  namespace: auth
  releaseName: authentik
  repo: https://charts.goauthentik.io
  valuesFile: values.yaml
  version: 2026.8.6
