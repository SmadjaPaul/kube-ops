apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: authentik-postgresql-weekly
  namespace: auth
spec:
  schedule: "0 0 2 * * 0"
  backupOwnerReference: self
  cluster:
    name: authentik-postgresql-restored
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      # PLT-221: base backups follow the WAL archive to R2.
      barmanObjectName: authentik-r2-store
