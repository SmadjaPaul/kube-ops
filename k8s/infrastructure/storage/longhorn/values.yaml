# Longhorn is staged alongside Proxmox CSI until the dedicated Talos data
# volume is present and a runtime canary has passed. Do not make it the
# cluster default or migrate existing PVCs in this foundation change.
#
# V1 is intentional: Talos provides iscsi-tools + util-linux-tools and the V2
# SPDK engine would add dedicated CPU/hugepage overhead that is unnecessary on
# the current single-node cluster.
service:
  ui:
    type: ClusterIP

persistence:
  # Do not create the upstream generic "longhorn" class.  The cluster exposes
  # explicit fast/bulk classes so workloads cannot silently land on the wrong
  # physical tier.
  createStorageClass: false
  defaultClass: false

preUpgradeChecker:
  # Longhorn documents this hook as unsuitable for Argo CD / GitOps upgrades.
  jobEnabled: false

csi:
  kubeletRootDir: /var/lib/kubelet
  # HA replicas of stateless CSI sidecars add scheduler pressure but no
  # machine-level availability on a single-node cluster.
  attacherReplicaCount: 1
  provisionerReplicaCount: 1
  resizerReplicaCount: 1
  snapshotterReplicaCount: 1

defaultSettings:
  defaultDataPath: /var/mnt/k8s-fast/longhorn
  v1DataEngine: true
  v2DataEngine: false
  defaultReplicaCount: '{"v1":"1","v2":"1"}'
  # The single fast disk already carries existing 1-replica volumes whose
  # scheduled capacity is above physical usage. 180% provides bounded virtual
  # headroom for the current set while retaining the 10% physical free-space
  # guard. This small increase is required to admit the already-qualified
  # Polyfin PVC expansion; it does not change the disk, replica count, or
  # physical free-space threshold.
  storageOverProvisioningPercentage: 180
  storageMinimalAvailablePercentage: 10
  defaultDataLocality: best-effort
  createDefaultDiskLabeledNodes: true
  autoSalvage: true
  autoDeletePodWhenVolumeDetachedUnexpectedly: true
  allowVolumeCreationWithDegradedAvailability: false
  # Longhorn defaults V1 instance-manager requests to 12% of allocatable CPU.
  # The current node carries many mostly-idle services, so reserve 6% for the
  # V1 data plane initially and validate it with real I/O before further tuning.
  guaranteedInstanceManagerCPU: '{"v1":"6","v2":"0"}'
  # Detached volumes are not attached for recurring backups (PLT-187).
  # Evidence 2026-11-12: 99 detached volumes = 87 PV Released without PVC,
  # 4 Released whose PVC name now binds another PV, 4 DR-exercise volumes
  # without PV, 4 Bound but unmounted. For executor/data-executor-0,
  # atlantis-system/atlantis-pilot-data and rustical-pilot/rustical-data the
  # last completed Longhorn backup is newer than the last pod mount
  # (lastPodRefAt); Velero file-system backups do not cover them without a pod.
  # atlantis-apps-data is faulted with no backup either way. A detached volume
  # cannot be written, and existing backups are not pruned while no new backup
  # is taken. Residual risk: a volume written and detached again between two
  # 03:17 runs (executor scaled 0/0, future mastra-sandbox workspaces) is not
  # backed up until it is attached at run time. Revert to true to restore the
  # nightly attach/backup/detach cycle.
  allowRecurringJobWhileVolumeDetached: false

defaultBackupStore:
  # Reuse the existing Hetzner Object Storage bucket with a Longhorn-specific
  # prefix; Velero owns the separate `velero/` prefix.
  backupTarget: s3://smadja-dev-homelab-backups@fsn1/longhorn/
  backupTargetCredentialSecret: longhorn-hetzner-credentials
  pollInterval: 300

networkPolicies:
  # The parent storage kustomization owns immutable workload selector labels.
  # Disable Longhorn's optional internal policies to avoid injecting those
  # ownership labels into selectors that do not match the CSI pods. Cilium's
  # cluster-wide policy remains the network boundary for this namespace.
  restrictInternalTraffic: false

longhornManager:
  priorityClass: system-cluster-critical
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

longhornDriver:
  priorityClass: system-cluster-critical

metrics:
  serviceMonitor:
    enabled: true
    # kube-prometheus-stack selects ServiceMonitors by this release label.
    # Longhorn's chart exposes the upstream metrics without it by default.
    additionalLabels:
      release: kube-prometheus-stack
    interval: 30s
    scrapeTimeout: 10s
