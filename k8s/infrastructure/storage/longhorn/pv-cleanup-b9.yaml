# One-shot cleanup batch b9 (Paul 15/11, PLT-340 partie 2): PVC media/decypharr-state (REBUILDABLE, no pod mounts it, Argo Prune=false) + its PV pvc-57dc7e2a-794c-48cf-8a89-2c1c988d2f80,
# and the Released PV pvc-8cb52648-2643-4c86-94b1-471cd59ab1f4 (claimRef media/audiobookrequest-config, AudioBookRequest decommissioned) + their two Longhorn volumes. Exact names only.
# kubectl-rw.sh refuses pvc/pv/Longhorn deletes, hence this Job. Removed by a follow-up PR. backoffLimit 0: guards are not replayable after the first delete.
# kubectl image is distroless (no shell): guards are kubectl waits that fail the Job. Longhorn volumes must be detached (no consumer) before any delete.
# PVC delete is cluster-scoped RBAC limited by resourceNames (the kustomization namespace transformer would force a Role into longhorn-system); the command targets -n media only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pv-cleanup-b9
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pv-cleanup-b9
rules:
- apiGroups:
  - ''
  resources:
  - persistentvolumes
  resourceNames:
  - pvc-57dc7e2a-794c-48cf-8a89-2c1c988d2f80
  - pvc-8cb52648-2643-4c86-94b1-471cd59ab1f4
  verbs:
  - get
  - list
  - watch
  - delete
- apiGroups:
  - ''
  resources:
  - persistentvolumeclaims
  resourceNames:
  - decypharr-state
  verbs:
  - get
  - list
  - watch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pv-cleanup-b9
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pv-cleanup-b9
subjects:
- kind: ServiceAccount
  name: pv-cleanup-b9
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pv-cleanup-b9
  namespace: longhorn-system
rules:
- apiGroups:
  - longhorn.io
  resources:
  - volumes
  resourceNames:
  - pvc-57dc7e2a-794c-48cf-8a89-2c1c988d2f80
  - pvc-8cb52648-2643-4c86-94b1-471cd59ab1f4
  verbs:
  - get
  - list
  - watch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pv-cleanup-b9
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pv-cleanup-b9
subjects:
- kind: ServiceAccount
  name: pv-cleanup-b9
  namespace: longhorn-system
---
