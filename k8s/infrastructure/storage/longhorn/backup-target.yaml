# PLT-222 (decision Paul 12/11, PLT-219) : cible de sauvegarde Longhorn = R2.
# values.yaml (defaultBackupStore) ne s'applique qu'a l'installation : la cible
# vivante `default` est donc declaree ici. Un seul backup target.
# Les objets Hetzner restent intacts (rollback : revert de cette PR).
apiVersion: longhorn.io/v1beta2
kind: BackupTarget
metadata:
  name: default
  namespace: longhorn-system
spec:
  backupTargetURL: s3://homelab-backup-longhorn@auto/
  credentialSecret: longhorn-r2-credentials
  pollInterval: 5m0s
