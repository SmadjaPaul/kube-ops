# One-shot cleanup batch b6 (Paul, PLT-46, drills recents romm-drill et pinepods-drill): exact-name PV + Longhorn volumes.
# Removed by a follow-up PR. backoffLimit 0: guards are not replayable after the PV delete.
# kubectl image is distroless (no shell): guards are kubectl waits that fail the Job.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pv-cleanup-b6
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pv-cleanup-b6
rules:
- apiGroups:
  - ''
  resources:
  - persistentvolumes
  resourceNames:
  - pvc-2b8f07a2-7040-4155-a3b1-a78c94cdef84
  - pvc-587aa957-063b-4366-8701-fcb03c9796d3
  verbs:
  - get
  - list
  - watch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pv-cleanup-b6
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pv-cleanup-b6
subjects:
- kind: ServiceAccount
  name: pv-cleanup-b6
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pv-cleanup-b6
  namespace: longhorn-system
rules:
- apiGroups:
  - longhorn.io
  resources:
  - volumes
  resourceNames:
  - pvc-2b8f07a2-7040-4155-a3b1-a78c94cdef84
  - pvc-587aa957-063b-4366-8701-fcb03c9796d3
  verbs:
  - get
  - list
  - watch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pv-cleanup-b6
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pv-cleanup-b6
subjects:
- kind: ServiceAccount
  name: pv-cleanup-b6
  namespace: longhorn-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pv-cleanup-b6
  namespace: longhorn-system
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pv-cleanup-b6
    spec:
      serviceAccountName: pv-cleanup-b6
      restartPolicy: Never
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: guard-pv-released
        image: registry.k8s.io/kubectl:v1.36.3@sha256:6e4fce3c83651edb91b74bc67701c5cd263dd8aa3cd4254b1798d6425a5ab789
        args:
        - wait
        - --for=jsonpath={.status.phase}=Released
        - --timeout=60s
        - pv/pvc-2b8f07a2-7040-4155-a3b1-a78c94cdef84
        - pv/pvc-587aa957-063b-4366-8701-fcb03c9796d3
        env:
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      - name: guard-longhorn-detached
        image: registry.k8s.io/kubectl:v1.36.3@sha256:6e4fce3c83651edb91b74bc67701c5cd263dd8aa3cd4254b1798d6425a5ab789
        args:
        - wait
        - --for=jsonpath={.status.state}=detached
        - --timeout=60s
        - -n
        - longhorn-system
        - volumes.longhorn.io/pvc-2b8f07a2-7040-4155-a3b1-a78c94cdef84
        - volumes.longhorn.io/pvc-587aa957-063b-4366-8701-fcb03c9796d3
        env:
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      - name: delete-pv
        image: registry.k8s.io/kubectl:v1.36.3@sha256:6e4fce3c83651edb91b74bc67701c5cd263dd8aa3cd4254b1798d6425a5ab789
        args:
        - delete
        - pv
        - pvc-2b8f07a2-7040-4155-a3b1-a78c94cdef84
        - pvc-587aa957-063b-4366-8701-fcb03c9796d3
        env:
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      containers:
      - name: delete-longhorn-volumes
        image: registry.k8s.io/kubectl:v1.36.3@sha256:6e4fce3c83651edb91b74bc67701c5cd263dd8aa3cd4254b1798d6425a5ab789
        args:
        - delete
        - -n
        - longhorn-system
        - volumes.longhorn.io
        - pvc-2b8f07a2-7040-4155-a3b1-a78c94cdef84
        - pvc-587aa957-063b-4366-8701-fcb03c9796d3
        env:
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 16Mi
