# One-shot cleanup batch b10 (PLT-46, 15/11): Released PV pvc-281640a1-e323-49cf-8902-cb77b4f0cd35 (claimRef polyfin-drill/polyfin-db-restore-1, drill PLT-227 retire par #1465/#1467) + its Longhorn volume. Exact name only.
# Source media/polyfin-db healthy, R2 backup polyfin-r2-initial-20261115 completed, drill PLT-227 Done: the drill copy is not the only copy.
# kubectl-rw.sh refuses pv/Longhorn deletes, hence this Job. Removed by a follow-up PR. backoffLimit 0: guards are not replayable after the first delete.
# kubectl image is distroless (no shell): guards are kubectl waits that fail the Job. The Longhorn volume must be detached before any delete.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pv-cleanup-b10
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pv-cleanup-b10
rules:
- apiGroups:
  - ''
  resources:
  - persistentvolumes
  resourceNames:
  - pvc-281640a1-e323-49cf-8902-cb77b4f0cd35
  verbs:
  - get
  - list
  - watch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pv-cleanup-b10
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pv-cleanup-b10
subjects:
- kind: ServiceAccount
  name: pv-cleanup-b10
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pv-cleanup-b10
  namespace: longhorn-system
rules:
- apiGroups:
  - longhorn.io
  resources:
  - volumes
  resourceNames:
  - pvc-281640a1-e323-49cf-8902-cb77b4f0cd35
  verbs:
  - get
  - list
  - watch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pv-cleanup-b10
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pv-cleanup-b10
subjects:
- kind: ServiceAccount
  name: pv-cleanup-b10
  namespace: longhorn-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pv-cleanup-b10
  namespace: longhorn-system
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pv-cleanup-b10
    spec:
      serviceAccountName: pv-cleanup-b10
      restartPolicy: Never
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: guard-pv-released
        image: registry.k8s.io/kubectl:v1.36.3@sha256:6e4fce3c83651edb91b74bc67701c5cd263dd8aa3cd4254b1798d6425a5ab789
        args:
        - wait
        - --for=jsonpath={.status.phase}=Released
        - --timeout=60s
        - pv/pvc-281640a1-e323-49cf-8902-cb77b4f0cd35
        env:
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      - name: guard-pv-handle
        image: registry.k8s.io/kubectl:v1.36.3@sha256:6e4fce3c83651edb91b74bc67701c5cd263dd8aa3cd4254b1798d6425a5ab789
        args:
