# One-shot retirement of the abandoned OpenClaw operator (Paul, 2026-11-12, PLT-46).
# Removed by a follow-up PR. backoffLimit 0: guards are not replayable after the delete.
# Continuation of b5: the namespace was already deleted by b5 (its wait lacked list/watch).
# Guard: no OpenClaw CR anywhere.
# No PV/PVC exists for this namespace (checked read-only before this PR).
# kubectl image is distroless (no shell): guards are kubectl waits that fail the Job.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-retire-b5b
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openclaw-retire-b5b
rules:
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  resourceNames:
  - openclawclusterdefaults.openclaw.rocks
  - openclawinstances.openclaw.rocks
  - openclawselfconfigs.openclaw.rocks
  verbs:
  - get
  - list
  - watch
  - delete
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterroles
  resourceNames:
  - openclaw-operator-manager-role-cluster
  - openclaw-operator-metrics-reader
  verbs:
  - get
  - list
  - watch
  - delete
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterrolebindings
  resourceNames:
  - openclaw-operator-manager-rolebinding-cluster
  verbs:
  - get
  - list
  - watch
  - delete
- apiGroups:
  - openclaw.rocks
  resources:
  - openclawclusterdefaults
  - openclawinstances
  - openclawselfconfigs
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openclaw-retire-b5b
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openclaw-retire-b5b
subjects:
- kind: ServiceAccount
  name: openclaw-retire-b5b
  namespace: longhorn-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openclaw-retire-b5b
  namespace: longhorn-system
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openclaw-retire-b5b
    spec:
      serviceAccountName: openclaw-retire-b5b
      restartPolicy: Never
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: guard-no-openclawclusterdefaults
        image: registry.k8s.io/kubectl:v1.36.3@sha256:6e4fce3c83651edb91b74bc67701c5cd263dd8aa3cd4254b1798d6425a5ab789
        args:
        - wait
        - --for=delete
        - --all
        - -A
        - --timeout=10s
        - openclawclusterdefaults.openclaw.rocks
        env:
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      - name: guard-no-openclawinstances
        image: registry.k8s.io/kubectl:v1.36.3@sha256:6e4fce3c83651edb91b74bc67701c5cd263dd8aa3cd4254b1798d6425a5ab789
        args:
        - wait
        - --for=delete
        - --all
        - -A
        - --timeout=10s
        - openclawinstances.openclaw.rocks
        env:
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      - name: guard-no-openclawselfconfigs
        image: registry.k8s.io/kubectl:v1.36.3@sha256:6e4fce3c83651edb91b74bc67701c5cd263dd8aa3cd4254b1798d6425a5ab789
        args:
        - wait
        - --for=delete
        - --all
        - -A
        - --timeout=10s
        - openclawselfconfigs.openclaw.rocks
        env:
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      - name: delete-crds
        image: registry.k8s.io/kubectl:v1.36.3@sha256:6e4fce3c83651edb91b74bc67701c5cd263dd8aa3cd4254b1798d6425a5ab789
        args:
        - delete
        - crd
        - openclawclusterdefaults.openclaw.rocks
        - openclawinstances.openclaw.rocks
        - openclawselfconfigs.openclaw.rocks
        env:
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      - name: delete-clusterrolebinding
        image: registry.k8s.io/kubectl:v1.36.3@sha256:6e4fce3c83651edb91b74bc67701c5cd263dd8aa3cd4254b1798d6425a5ab789
        args:
        - delete
        - clusterrolebinding
        - openclaw-operator-manager-rolebinding-cluster
        env:
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      containers:
      - name: delete-clusterroles
        image: registry.k8s.io/kubectl:v1.36.3@sha256:6e4fce3c83651edb91b74bc67701c5cd263dd8aa3cd4254b1798d6425a5ab789
        args:
        - delete
        - clusterrole
        - openclaw-operator-manager-role-cluster
        - openclaw-operator-metrics-reader
        env:
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 16Mi
