# One-shot cleanup (Paul, 2026-11-12 21:07): the two Released PVs left by the
# PLT-202 Matrix MAS drill (12 Gi, longhorn-bulk, reconstructible restore data),
# plus their two detached, never-scheduled, backup-less Longhorn volumes.
# RBAC is limited by exact name. This file is removed by a follow-up PR.
# kubectl image is distroless (no shell): guards are kubectl waits that fail the
# Job, and delete commands name each object explicitly.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drill-pv-cleanup
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: drill-pv-cleanup
rules:
- apiGroups:
  - ''
  resources:
  - persistentvolumes
  resourceNames:
  - pvc-08b80ab8-0586-43ce-a5ce-832b9e592bdd
  - pvc-d04c8041-6f23-4dcf-a054-3af128f9c90f
  verbs:
  - get
  - list
  - watch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: drill-pv-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: drill-pv-cleanup
subjects:
- kind: ServiceAccount
  name: drill-pv-cleanup
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: drill-pv-cleanup
  namespace: longhorn-system
rules:
- apiGroups:
  - longhorn.io
  resources:
  - volumes
  resourceNames:
  - pvc-08b80ab8-0586-43ce-a5ce-832b9e592bdd
  - pvc-d04c8041-6f23-4dcf-a054-3af128f9c90f
  verbs:
  - get
  - list
  - watch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: drill-pv-cleanup
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: drill-pv-cleanup
subjects:
- kind: ServiceAccount
  name: drill-pv-cleanup
  namespace: longhorn-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: drill-pv-cleanup-20261112
  namespace: longhorn-system
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drill-pv-cleanup
    spec:
      serviceAccountName: drill-pv-cleanup
      restartPolicy: Never
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: guard-pv-released
        image: registry.k8s.io/kubectl:v1.36.3@sha256:6e4fce3c83651edb91b74bc67701c5cd263dd8aa3cd4254b1798d6425a5ab789
        args:
        - wait
        - --for=jsonpath={.status.phase}=Released
        - --timeout=30s
        - pv/pvc-08b80ab8-0586-43ce-a5ce-832b9e592bdd
        - pv/pvc-d04c8041-6f23-4dcf-a054-3af128f9c90f
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        env:
        - name: HOME
          value: /tmp
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      - name: guard-pv-claim-namespace
        image: registry.k8s.io/kubectl:v1.36.3@sha256:6e4fce3c83651edb91b74bc67701c5cd263dd8aa3cd4254b1798d6425a5ab789
        args:
        - wait
        - --for=jsonpath={.spec.claimRef.namespace}=matrix-mas-drill
        - --timeout=30s
        - pv/pvc-08b80ab8-0586-43ce-a5ce-832b9e592bdd
        - pv/pvc-d04c8041-6f23-4dcf-a054-3af128f9c90f
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        env:
        - name: HOME
          value: /tmp
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      - name: guard-longhorn-detached
        image: registry.k8s.io/kubectl:v1.36.3@sha256:6e4fce3c83651edb91b74bc67701c5cd263dd8aa3cd4254b1798d6425a5ab789
        args:
        - wait
        - --for=jsonpath={.status.state}=detached
        - --timeout=30s
        - -n
        - longhorn-system
        - volumes.longhorn.io/pvc-08b80ab8-0586-43ce-a5ce-832b9e592bdd
        - volumes.longhorn.io/pvc-d04c8041-6f23-4dcf-a054-3af128f9c90f
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        env:
        - name: HOME
          value: /tmp
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      - name: delete-pv
        image: registry.k8s.io/kubectl:v1.36.3@sha256:6e4fce3c83651edb91b74bc67701c5cd263dd8aa3cd4254b1798d6425a5ab789
        args:
        - delete
        - pv
        - pvc-08b80ab8-0586-43ce-a5ce-832b9e592bdd
        - pvc-d04c8041-6f23-4dcf-a054-3af128f9c90f
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        env:
        - name: HOME
          value: /tmp
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      containers:
      - name: delete-longhorn-volumes
        image: registry.k8s.io/kubectl:v1.36.3@sha256:6e4fce3c83651edb91b74bc67701c5cd263dd8aa3cd4254b1798d6425a5ab789
        args:
        - delete
        - -n
        - longhorn-system
        - volumes.longhorn.io
        - pvc-08b80ab8-0586-43ce-a5ce-832b9e592bdd
        - pvc-d04c8041-6f23-4dcf-a054-3af128f9c90f
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        env:
        - name: HOME
          value: /tmp
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 16Mi
