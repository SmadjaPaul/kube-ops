# PLT-222 (brouillon) : identite d'ecriture R2 pour le backupstore Longhorn.
# Un seul backup target Longhorn : ne referencer ce secret qu'a la bascule.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-r2-credentials
  namespace: longhorn-system
  labels:
    app.kubernetes.io/part-of: storage
    app.kubernetes.io/component: longhorn-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: longhorn-r2-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        AWS_ACCESS_KEY_ID: "{{ .ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .SECRET_ACCESS_KEY }}"
        AWS_ENDPOINTS: "{{ .ENDPOINT }}"
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: R2_LONGHORN_WRITER_ACCESS_KEY_ID
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: R2_LONGHORN_WRITER_SECRET_ACCESS_KEY
    - secretKey: ENDPOINT
      remoteRef:
        key: R2_S3_ENDPOINT
