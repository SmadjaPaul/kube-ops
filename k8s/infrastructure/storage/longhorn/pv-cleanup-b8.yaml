# One-shot cleanup batch b8 (Paul 13/11, PLT-94/PLT-46, volumes abandonnes : anciens PV authentik-restored-1/-wal, sparkyfitness-db-1, executor): exact-name PV + Longhorn volumes.
# Old PVs whose claimRef.uid no longer matches the live PVCs of the same name; live PVCs untouched. Removed by a follow-up PR. backoffLimit 0: guards are not replayable after the PV delete.
# kubectl image is distroless (no shell): guards are kubectl waits that fail the Job.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pv-cleanup-b8
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pv-cleanup-b8
rules:
- apiGroups:
  - ''
  resources:
  - persistentvolumes
  resourceNames:
  - pvc-994f98ea-4974-47e0-a83e-ba285a295e0b
  - pvc-af862e58-67ba-4260-b20d-ac931c20d6cb
  - pvc-347aff51-c65a-4cac-a73d-c4a6d95be820
  - pvc-dee0d6ef-edab-493b-bb94-56a2c98c9716
  verbs:
  - get
  - list
  - watch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pv-cleanup-b8
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pv-cleanup-b8
subjects:
- kind: ServiceAccount
  name: pv-cleanup-b8
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pv-cleanup-b8
  namespace: longhorn-system
rules:
- apiGroups:
  - longhorn.io
  resources:
  - volumes
