apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proxmox-csi-plugin
  namespace: csi-proxmox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: proxmox-csi-plugin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |
          clusters:
            - url: "https://10.0.20.51:8006/api2/json"
              insecure: true
              token_id: "{{ .tokenId }}"
              token_secret: "{{ .tokenSecret }}"
              region: homeops
  data:
    - secretKey: tokenId
      remoteRef:
        key: PROXMOX_CSI_TOKEN_ID
    - secretKey: tokenSecret
      remoteRef:
        key: PROXMOX_CSI_TOKEN_SECRET
