apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-default-alerts
  namespace: cnpg-system
spec:
  groups:
    - name: cnp-default.rules
      rules:
        # PLT-459 (23/11/2026): removed LongRunningTransaction, BackendsWaiting,
        # PGDatabaseXidAge and DatabaseDeadlockConflicts. Their metrics
        # (cnpg_backends_*, cnpg_pg_database_xid_age, cnpg_pg_stat_database_deadlocks)
        # are not exported by this CNPG version's default queries and no custom
        # queries exist, so they could never fire. XID wraparound is NOT watched
        # until a custom query is added (PLT-459 follow-up).
        # PLT-459: backups go through the barman-cloud plugin, so the native
        # cnpg_collector_last_*_backup_timestamp series stay 0. Most clusters
        # back up weekly (pg-shared-homelab daily): 8 days = one missed run.
        - alert: CNPGPluginBackupStale
          annotations:
            description: No successful barman-cloud backup for over 8 days in namespace {{ $labels.namespace }} (cluster {{ $labels.cluster }}).
            summary: The last available plugin backup of a CNPG cluster is too old
          expr: |-
            (time() - max by (namespace, cluster) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp > 0)) > 8 * 86400
          for: 30m
          labels:
            severity: warning
        - alert: CNPGPluginBackupFailed
          annotations:
            description: The latest barman-cloud backup failed after the last successful one in namespace {{ $labels.namespace }} (cluster {{ $labels.cluster }}).
            summary: A CNPG plugin backup failed
          expr: |-
            max by (namespace, cluster) (barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp)
              > max by (namespace, cluster) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)
          for: 30m
          labels:
            severity: warning
        - alert: PGReplication
          annotations:
            description:
              Standby is lagging behind by over 300 seconds (5 minutes)
            summary: The standby is lagging behind the primary
          expr: |-
            cnpg_pg_replication_lag > 300
          for: 1m
          labels:
            severity: warning
        - alert: LastFailedArchiveTime
          annotations:
            description: Archiving failed for {{ $labels.pod }}
            summary:
              Checks the last time archiving failed. Will be < 0 when it has not
              failed.
          expr: |-
            (cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time) > 1
          for: 1m
          labels:
            severity: warning
        - alert: ReplicaFailingReplication
          annotations:
            description: Replica {{ $labels.pod }} is failing to replicate
            summary: Checks if the replica is failing to replicate
          expr: |-
            cnpg_pg_replication_in_recovery > cnpg_pg_replication_is_wal_receiver_up
          for: 1m
          labels:
            severity: warning
