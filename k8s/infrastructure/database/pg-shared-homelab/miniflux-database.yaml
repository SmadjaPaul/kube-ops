# PLT-152 (T3, golden path): Miniflux database in pg-shared-homelab. Owner
# role miniflux (no superuser, no createdb). The role password is a Doppler
# value that Paul creates (PG_SHARED_HOMELAB_MINIFLUX_PASSWORD, hex only, never
# in Git); the application reads the same value to build DATABASE_URL.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-shared-homelab-miniflux
  namespace: databases
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: pg-shared-homelab-miniflux
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: miniflux
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: PG_SHARED_HOMELAB_MINIFLUX_PASSWORD }
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: miniflux
  namespace: databases
spec:
  name: miniflux
  owner: miniflux
  cluster: { name: pg-shared-homelab }
---
# Access is restricted at the network layer (no pg_hba precedent in k8s/).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: { name: pg-shared-homelab-miniflux, namespace: databases }
spec:
  endpointSelector: { matchLabels: { cnpg.io/cluster: pg-shared-homelab } }
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: miniflux
            app.kubernetes.io/name: miniflux
      toPorts:
        - ports:
            - { protocol: TCP, port: "5432" }
