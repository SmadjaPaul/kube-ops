# PLT-375: login role `pgdump` used only by the daily logical dump CronJob.
# Password generated in the cluster (ESO Password generator, CreatedOnce,
# Orphan, class T1), read by the CronJob in this namespace through
# secretKeyRef: no Doppler key, no copy, no entry in the ESO reader allow-list.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata: {name: pg-pgdump, namespace: databases}
spec: {length: 48, digits: 10, symbols: 0, allowRepeat: true}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-pgdump
  namespace: databases
  annotations: {kube-ops.io/secret-class: T1}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: pg-pgdump
    creationPolicy: Orphan
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: pgdump
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: pg-pgdump}
---
# PLT-375: R2 writer of bucket homelab-backup-pgdump (minted by OpenTofu,
# homelab-infra terraform/grafana-cloud/r2-identities.tf). Names only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-shared-homelab-pgdump-r2-credentials
  namespace: databases
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: pg-shared-homelab-pgdump-r2-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: R2_PGDUMP_WRITER_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: R2_PGDUMP_WRITER_SECRET_ACCESS_KEY
    - secretKey: AWS_ENDPOINT_URL_S3
      remoteRef:
        key: R2_S3_ENDPOINT
