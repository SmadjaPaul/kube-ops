# PLT-339, drill D1b (docs/operations/pg-shared-app-restore-drill.md): three SYNTHETIC rows in table
# restore_drill_marks of database `optio`, written before the owner first signs in. The restore drill
# (pg-shared-restore-drill) counts them after a PITR. Merge under MANDAT only. Idempotent. The table
# is removed, if ever, by an operator: removing this file deletes nothing in the database.
apiVersion: batch/v1
kind: Job
metadata:
  name: pg-shared-homelab-optio-d1b-seed
  namespace: databases
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: {app.kubernetes.io/name: pg-shared-homelab-optio-d1b-seed}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        fsGroup: 26
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: seed
          image: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie@sha256:ebf3919504d7523a63e8e2fee9b051211de714644b36469275558c624afd50ec
          command: [sh, -ec]
          args:
            - |
              i=0
              until psql -v ON_ERROR_STOP=1 -tA -c "SELECT 1" >/dev/null 2>&1; do
                i=$((i+1)); [ "$i" -ge 30 ] && { echo "SEED_STATUS=FAIL reason=not_ready"; exit 1; }
                sleep 10
              done
              psql -v ON_ERROR_STOP=1 -q <<'SQL'
              CREATE TABLE IF NOT EXISTS public.restore_drill_marks (
                id integer PRIMARY KEY,
                mark text NOT NULL,
                written_at timestamptz NOT NULL DEFAULT now()
              );
              INSERT INTO public.restore_drill_marks (id, mark)
                VALUES (1, 'synthetic-1'), (2, 'synthetic-2'), (3, 'synthetic-3')
                ON CONFLICT (id) DO NOTHING;
              SQL
              n=$(psql -v ON_ERROR_STOP=1 -tA -c "SELECT count(*) FROM public.restore_drill_marks WHERE mark LIKE 'synthetic-%'")
              echo "SEED_ROWS=$n"
              test "$n" = "3"
              psql -v ON_ERROR_STOP=1 -tA -c "SELECT 'SEED_LAST_WRITTEN_UTC=' || (max(written_at) AT TIME ZONE 'UTC') FROM public.restore_drill_marks"
              echo "SEED_STATUS=PASS"
          env:
            - {name: PGHOST, value: pg-shared-homelab-rw.databases.svc.cluster.local}
            - {name: PGDATABASE, value: optio}
            - {name: PGSSLMODE, value: require}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: pg-optio, key: username}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: pg-optio, key: password}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: pg-shared-homelab-optio-d1b-seed, namespace: databases}
spec:
  endpointSelector: {matchLabels: {cnpg.io/cluster: pg-shared-homelab}}
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: pg-shared-homelab-optio-d1b-seed
      toPorts:
        - ports:
            - {protocol: TCP, port: "5432"}
