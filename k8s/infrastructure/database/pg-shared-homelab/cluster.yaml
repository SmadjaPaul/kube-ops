# PLT-375 (T2): PostgreSQL partage du homelab (D-2026-11-13-02). New databases
# go here as Database + managed role (see app-database.example.tmpl); no
# application with irreplaceable data before the restore drill has PASSed
# (docs/operations/pg-shared-homelab-restore-drill.md, to be written).
#
# Image: PostgreSQL 18.4 standard trixie, multi-arch INDEX digest resolved from
# ghcr.io on 2026-11-16 (same pinning method as oracle-a1 pg-shared, whose
# 17.7 digest it reproduces when resolved the same way).
#
# archive_timeout 5min bounds the RPO of the shared archive (study pg-shared-etude.md
# section 4.3). Backups: barman-cloud plugin, ObjectStore pg-shared-homelab-r2.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-shared-homelab
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie@sha256:ebf3919504d7523a63e8e2fee9b051211de714644b36469275558c624afd50ec
  postgresql:
    parameters:
      archive_timeout: "5min"
      wal_compression: "lz4"
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: pg-shared-homelab-r2
  storage:
    storageClass: longhorn-fast
    size: 20Gi
  walStorage:
    storageClass: longhorn-fast
    size: 5Gi
  resources:
    requests: {cpu: 200m, memory: 768Mi}
    limits: {cpu: "1", memory: 2Gi}
