# PLT-375: WAL archive and base backups of pg-shared-homelab on R2 (bucket
# homelab-backup-cnpg, jurisdiction eu), prefix homelab/pg-shared (serverName
# defaults to the Cluster name). Same per-bucket writer identity and sidecar
# env as paperless-r2-store (R2 only, no new store). Endpoint from Doppler
# R2_S3_ENDPOINT through the Secret, never written in this repository.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: pg-shared-homelab-r2
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  retentionPolicy: "14d"
  instanceSidecarConfiguration:
    env:
      # plugin-barman-cloud v0.11.0: boto3 default flexible checksums are not
      # all supported by R2.
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
      - name: AWS_DEFAULT_REGION
        value: auto
      - name: AWS_ENDPOINT_URL_S3
        valueFrom:
          secretKeyRef:
            name: pg-shared-homelab-cnpg-r2-credentials
            key: AWS_ENDPOINT_URL_S3
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
  configuration:
    destinationPath: s3://homelab-backup-cnpg/homelab/pg-shared
    s3Credentials:
      accessKeyId:
        name: pg-shared-homelab-cnpg-r2-credentials
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: pg-shared-homelab-cnpg-r2-credentials
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
      maxParallel: 2
    data:
      compression: gzip
