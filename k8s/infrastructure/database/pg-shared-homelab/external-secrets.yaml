# PLT-375: R2 writer identity of bucket homelab-backup-cnpg (same Doppler keys
# as paperless-cnpg-r2-credentials). Names only; values live in Doppler cluster/prd.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-shared-homelab-cnpg-r2-credentials
  namespace: databases
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: pg-shared-homelab-cnpg-r2-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: R2_CNPG_WRITER_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: R2_CNPG_WRITER_SECRET_ACCESS_KEY
    - secretKey: AWS_ENDPOINT_URL_S3
      remoteRef:
        key: R2_S3_ENDPOINT
