# PLT-339 (D-2026-11-25-05): database `optio` of Optio (namespace optio), from app-database.example.tmpl.
# Role password generated in the cluster (class T1, CreatedOnce, Orphan), copied into optio by the
# ExternalSecret optio-db (store k8s-databases). Never in Doppler, never in Git.
# Precondition before the first real data: drill D1b (docs/operations/pg-shared-app-restore-drill.md),
# status NOT_RUN on 25/11, run by an operator under MANDAT.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata: {name: pg-optio, namespace: databases}
spec: {length: 48, digits: 10, symbols: 0, allowRepeat: true}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-optio
  namespace: databases
  annotations: {kube-ops.io/secret-class: T1}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: pg-optio
    creationPolicy: Orphan
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: optio
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: pg-optio}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata: {name: optio, namespace: databases}
spec:
  name: optio
  owner: optio
  databaseReclaimPolicy: retain
  cluster: {name: pg-shared-homelab}
---
# Isolation: REVOKE CONNECT FROM PUBLIC, bounded wait for the database and the role (Argo CD has no
# CNPG health check, the Job can start before the role password is applied).
apiVersion: batch/v1
kind: Job
metadata:
  name: pg-shared-homelab-optio-isolation
  namespace: databases
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {app.kubernetes.io/name: pg-shared-homelab-optio-isolation}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        fsGroup: 26
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: isolate
          image: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie@sha256:ebf3919504d7523a63e8e2fee9b051211de714644b36469275558c624afd50ec
          command: [sh, -ec]
          args:
            - |
              i=0
              until psql -v ON_ERROR_STOP=1 -tA -c "SELECT 1" >/dev/null 2>&1; do
                i=$((i+1)); [ "$i" -ge 60 ] && { echo "database optio or role optio not ready after 10 min" >&2; exit 1; }
                sleep 10
              done
              psql -v ON_ERROR_STOP=1 -c "REVOKE CONNECT ON DATABASE optio FROM PUBLIC"
              ok=$(psql -v ON_ERROR_STOP=1 -tA -c "SELECT d.datacl IS NOT NULL AND NOT EXISTS (SELECT 1 FROM aclexplode(d.datacl) a WHERE a.grantee = 0 AND a.privilege_type = 'CONNECT') FROM pg_database d WHERE d.datname = 'optio'")
              test "$ok" = "t" || { echo "PUBLIC still has CONNECT on optio" >&2; exit 1; }
          env:
            - {name: PGHOST, value: pg-shared-homelab-rw.databases.svc.cluster.local}
            - {name: PGDATABASE, value: optio}
            - {name: PGSSLMODE, value: require}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: pg-optio, key: username}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: pg-optio, key: password}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: pg-shared-homelab-optio, namespace: databases}
spec:
  endpointSelector: {matchLabels: {cnpg.io/cluster: pg-shared-homelab}}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: optio
            app: optio-api
        - matchLabels:
            app.kubernetes.io/name: pg-shared-homelab-optio-isolation
      toPorts:
        - ports:
            - {protocol: TCP, port: "5432"}
