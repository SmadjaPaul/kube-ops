# Lot 0 (spec section 4.3): ESO store k8s-databases reads Secrets of namespace databases by `get` on listed names only.
# The sentinel name MUST stay: an empty `resourceNames` list would grant `get` on EVERY Secret of the
# namespace (spec F4). Each generated source adds its own name `pg-<namespace>` here; the contract
# test tests/harness/eso-generated-secrets-contract-test.sh refuses a Role without the sentinel,
# with another verb or with a name outside `pg-*`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-k8s-databases-reader
  namespace: databases
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
    resourceNames:
      - eso-k8s-sentinel-none   # never remove: an empty list would grant all Secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-k8s-databases-reader
  namespace: databases
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-k8s-databases-reader
subjects:
  - kind: ServiceAccount
    name: eso-k8s-databases-reader
    namespace: external-secrets
