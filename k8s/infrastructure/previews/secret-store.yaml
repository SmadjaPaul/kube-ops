# Preview secrets never come from the production Doppler config. This store reads
# a dedicated Doppler config (project apps, config preview) with its own service
# token, and only answers to namespaces pr-*. The Secret holding that token is a
# gesture of Paul (see PR body); until it exists the store is simply not ready and
# previews that need secrets stay Degraded, nothing else is affected.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: doppler-preview
  annotations:
    smadja.dev/provider: doppler
spec:
  conditions:
    - namespaceRegexes:
        - "^pr-[0-9]+-[a-z0-9-]+$"
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            key: token
            name: doppler-preview-access-token
            namespace: external-secrets
