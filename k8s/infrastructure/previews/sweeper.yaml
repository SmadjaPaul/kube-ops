# Safety net behind the ApplicationSet finalizer: deletes preview namespaces that
# no Argo Application owns any more (closed PR, removed label) once older than
# TTL_HOURS. Argo keeps CreateNamespace namespaces after the Application is gone.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: preview-sweeper
  namespace: preview-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: preview-sweeper
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: preview-sweeper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: preview-sweeper
subjects:
  - kind: ServiceAccount
    name: preview-sweeper
    namespace: preview-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: preview-sweeper-applications
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: preview-sweeper-applications
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: preview-sweeper-applications
subjects:
  - kind: ServiceAccount
    name: preview-sweeper
    namespace: preview-system
---
# The ClusterRole above cannot be narrowed by name pattern: this admission policy
# restricts the sweeper to deleting preview namespaces.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: preview-sweeper-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [DELETE]
        resources: [namespaces]
  matchConditions:
    - name: is-sweeper
      expression: "request.userInfo.username == 'system:serviceaccount:preview-system:preview-sweeper'"
  validations:
    - expression: >-
        oldObject.metadata.name.matches('^pr-[0-9]+-[a-z0-9-]+$') && has(oldObject.metadata.labels) && 'smadja.dev/preview' in oldObject.metadata.labels && oldObject.metadata.labels['smadja.dev/preview'] == 'true'
      message: "preview-sweeper may only delete namespaces pr-<n>-<app> labelled smadja.dev/preview=true."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: preview-sweeper-scope
spec:
  policyName: preview-sweeper-scope
  validationActions: [Deny]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: preview-sweeper-script
  namespace: preview-system
data:
  sweep.sh: |
    #!/bin/sh
    set -eu
    now=$(date +%s)
    ttl=$((TTL_HOURS * 3600))
    kubectl get namespaces -l smadja.dev/preview=true -o json \
      | jq -r '.items[] | "\(.metadata.name) \(.metadata.creationTimestamp | fromdateiso8601)"' \
      | while read -r ns created; do
      case "$ns" in pr-[0-9]*-*) ;; *) echo "SKIP $ns (name)"; continue ;; esac
      age=$((now - created))
      owners=$(kubectl -n argocd get applications.argoproj.io -l "smadja.dev/preview-namespace=$ns" -o name | wc -l)
      if [ "$owners" -gt 0 ]; then echo "KEEP $ns (application present)"; continue; fi
      if [ "$age" -lt "$ttl" ]; then echo "KEEP $ns (orphan, age ${age}s < ${ttl}s)"; continue; fi
      echo "DELETE $ns (orphan, age ${age}s)"
      kubectl delete namespace "$ns" --wait=false
    done
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: preview-sweeper
  namespace: preview-system
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: preview-sweeper
          automountServiceAccountToken: true
          hostNetwork: false
          hostPID: false
          hostIPC: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sweep
              image: alpine/k8s:1.37.2 # renovate: docker=alpine/k8s
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/sweep.sh"]
              env:
                - name: TTL_HOURS
                  value: "24"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: preview-sweeper-script
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: preview-system-default-deny
  namespace: preview-system
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    - toEntities:
        - kube-apiserver
