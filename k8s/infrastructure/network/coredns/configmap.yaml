apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        log . {
            class error
        }
        prometheus :9153

        # Kubernetes service domain
        kubernetes cluster.local cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            ttl 30
            fallthrough
        }

        # Forward non-cluster queries to UniFi gateway (10.0.20.1).
        # UniFi is the sole LAN resolver: it serves private app records
        # pushed by ExternalDNS-private and forwards the rest to the
        # Internet. A public secondary resolver would break split-horizon
        # because clients could bypass UniFi for smadja.dev lookups.
        forward . 10.0.20.1 {
            policy sequential
        }

        cache 30
        loop
        reload
        loadbalance
    }
