apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Cilium 1.20 requires Gateway API v1.6.1. Use the immutable upstream release
# manifest here and in bootstrap so both paths install the exact same CRDs.
resources:
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.1/standard-install.yaml

commonAnnotations:
  argocd.argoproj.io/sync-wave: "-30"
