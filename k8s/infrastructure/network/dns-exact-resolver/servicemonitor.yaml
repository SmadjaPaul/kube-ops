# Label release=kube-prometheus-stack: required by the Prometheus selectors.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dns-exact-resolver
  namespace: dns-exact-resolver
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: infrastructure
    app.kubernetes.io/component: dns-exact-resolver
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dns-exact-resolver-metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
