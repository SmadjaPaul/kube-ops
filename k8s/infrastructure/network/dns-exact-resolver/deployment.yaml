apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-exact-resolver
  namespace: dns-exact-resolver
  labels:
    app.kubernetes.io/name: dns-exact-resolver
    app.kubernetes.io/part-of: infrastructure
    app.kubernetes.io/component: dns-exact-resolver
spec:
  # One node (homeops-01) and a stateless resolver: one replica. A PDB would
  # only block drains, so none is declared.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: dns-exact-resolver
  template:
    metadata:
      annotations:
        # One-shot rollout so the pod picks up the 35-name Corefile (the running
        # process predates the `reload` plugin). Bump only to force a restart.
        dns-exact-resolver/corefile-rev: "2"
      labels:
        app.kubernetes.io/name: dns-exact-resolver
        app.kubernetes.io/part-of: infrastructure
        app.kubernetes.io/component: dns-exact-resolver
    spec:
      # Node resolver config, never kube-dns: this pod must not depend on the
      # cluster DNS it is not part of (see the loop note in the ConfigMap).
      dnsPolicy: Default
      automountServiceAccountToken: false
      # Non-root (platform-baseline Kyverno rule). Listens on 1053; the Service
      # maps 53 to it. NET_BIND_SERVICE is still added back because the
      # upstream /coredns binary carries a file capability (cap_net_bind_service):
      # with drop ALL and no allowPrivilegeEscalation the exec is refused
      # ("exec /coredns: operation not permitted") unless it is in the bounding set.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coredns
          image: coredns/coredns:1.15.0@sha256:0a9d8c8ddf34347eb59aad9a8784f0710de88d6d112726d11d271f9bc6daca26
          args: ["-conf", "/etc/coredns/Corefile"]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          ports:
            - name: dns-udp
              containerPort: 1053
              protocol: UDP
            - name: dns-tcp
              containerPort: 1053
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
            - name: ready
              containerPort: 8181
              protocol: TCP
            - name: metrics
              containerPort: 9153
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: ready
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: dns-exact-resolver
            items:
              - key: Corefile
                path: Corefile
