apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dns-exact-resolver
  namespace: dns-exact-resolver
  labels:
    app.kubernetes.io/part-of: infrastructure
    app.kubernetes.io/component: dns-exact-resolver
spec:
  description: "Only UniFi (10.0.20.1) may query the resolver on 53; the resolver may query only UniFi on 53; Prometheus may scrape metrics."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: dns-exact-resolver
  ingress:
    - fromCIDR:
        - 10.0.20.1/32
      toPorts:
        - ports:
            - port: "1053"
              protocol: UDP
            - port: "1053"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9153"
              protocol: TCP
  egress:
    - toCIDR:
        - 10.0.20.1/32
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
