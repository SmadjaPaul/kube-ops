# PLT-149 lot 1.4: ClusterIP dedicated to the CoreDNS `prometheus` plugin (9153).
# The DNS LoadBalancer Service exposes 53 only, so the ServiceMonitor needs this one.
apiVersion: v1
kind: Service
metadata:
  name: dns-exact-resolver-metrics
  namespace: dns-exact-resolver
  labels:
    app.kubernetes.io/name: dns-exact-resolver-metrics
    app.kubernetes.io/part-of: infrastructure
    app.kubernetes.io/component: dns-exact-resolver
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dns-exact-resolver
  ports:
    - name: metrics
      port: 9153
      targetPort: metrics
      protocol: TCP
