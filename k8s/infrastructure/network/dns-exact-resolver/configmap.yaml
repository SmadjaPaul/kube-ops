apiVersion: v1
kind: ConfigMap
metadata:
  name: dns-exact-resolver
  namespace: dns-exact-resolver
  labels:
    app.kubernetes.io/part-of: infrastructure
    app.kubernetes.io/component: dns-exact-resolver
data:
  Corefile: |
    .:1053 {
        errors
        health {
            lameduck 5s
        }
        ready
        # A changed Corefile (list of names) is applied without a pod restart; an
        # invalid one is ignored and the previous config keeps serving.
        reload 30s 5s
        log . {
            class error
        }
        prometheus :9153

        # Exact names only: no wildcard, no apex, tv.smadja.dev excluded.
        # The SAME name list must appear in the four blocks below (checked by
        # tests/harness/dns-exact-resolver-contract-test.sh).
        # A = Gateway/internal VIP 10.0.20.192; AAAA/HTTPS/SVCB = NOERROR/NODATA.
        # Any other name falls through to the forward below.
        template IN A smadja.dev {
            match "^(account[.]smadja[.]dev|aiostreams[.]smadja[.]dev|alertmanager[.]smadja[.]dev|argocd[.]smadja[.]dev|auth[.]smadja[.]dev|bookorbit[.]smadja[.]dev|calendar[.]smadja[.]dev|chat[.]smadja[.]dev|factory[.]smadja[.]dev|facture[.]smadja[.]dev|fitness[.]smadja[.]dev|fleet[.]smadja[.]dev|grafana[.]smadja[.]dev|hassio[.]smadja[.]dev|hubble[.]smadja[.]dev|immich[.]smadja[.]dev|ittools[.]smadja[.]dev|karakeep[.]smadja[.]dev|librechat[.]smadja[.]dev|matrix[.]smadja[.]dev|mealie[.]smadja[.]dev|media[.]smadja[.]dev|ntfy[.]smadja[.]dev|opencode[.]smadja[.]dev|paperless[.]smadja[.]dev|pdf[.]smadja[.]dev|pinepods[.]smadja[.]dev|prometheus[.]smadja[.]dev|research[.]smadja[.]dev|romm[.]smadja[.]dev|search[.]smadja[.]dev|sure[.]smadja[.]dev|tasks[.]smadja[.]dev|trilium[.]smadja[.]dev)[.]$"
            answer "{{ .Name }} 300 IN A 10.0.20.192"
            rcode NOERROR
            fallthrough
        }
        template IN AAAA smadja.dev {
            match "^(account[.]smadja[.]dev|aiostreams[.]smadja[.]dev|alertmanager[.]smadja[.]dev|argocd[.]smadja[.]dev|auth[.]smadja[.]dev|bookorbit[.]smadja[.]dev|calendar[.]smadja[.]dev|chat[.]smadja[.]dev|factory[.]smadja[.]dev|facture[.]smadja[.]dev|fitness[.]smadja[.]dev|fleet[.]smadja[.]dev|grafana[.]smadja[.]dev|hassio[.]smadja[.]dev|hubble[.]smadja[.]dev|immich[.]smadja[.]dev|ittools[.]smadja[.]dev|karakeep[.]smadja[.]dev|librechat[.]smadja[.]dev|matrix[.]smadja[.]dev|mealie[.]smadja[.]dev|media[.]smadja[.]dev|ntfy[.]smadja[.]dev|opencode[.]smadja[.]dev|paperless[.]smadja[.]dev|pdf[.]smadja[.]dev|pinepods[.]smadja[.]dev|prometheus[.]smadja[.]dev|research[.]smadja[.]dev|romm[.]smadja[.]dev|search[.]smadja[.]dev|sure[.]smadja[.]dev|tasks[.]smadja[.]dev|trilium[.]smadja[.]dev)[.]$"
            rcode NOERROR
            fallthrough
        }
        template IN HTTPS smadja.dev {
            match "^(account[.]smadja[.]dev|aiostreams[.]smadja[.]dev|alertmanager[.]smadja[.]dev|argocd[.]smadja[.]dev|auth[.]smadja[.]dev|bookorbit[.]smadja[.]dev|calendar[.]smadja[.]dev|chat[.]smadja[.]dev|factory[.]smadja[.]dev|facture[.]smadja[.]dev|fitness[.]smadja[.]dev|fleet[.]smadja[.]dev|grafana[.]smadja[.]dev|hassio[.]smadja[.]dev|hubble[.]smadja[.]dev|immich[.]smadja[.]dev|ittools[.]smadja[.]dev|karakeep[.]smadja[.]dev|librechat[.]smadja[.]dev|matrix[.]smadja[.]dev|mealie[.]smadja[.]dev|media[.]smadja[.]dev|ntfy[.]smadja[.]dev|opencode[.]smadja[.]dev|paperless[.]smadja[.]dev|pdf[.]smadja[.]dev|pinepods[.]smadja[.]dev|prometheus[.]smadja[.]dev|research[.]smadja[.]dev|romm[.]smadja[.]dev|search[.]smadja[.]dev|sure[.]smadja[.]dev|tasks[.]smadja[.]dev|trilium[.]smadja[.]dev)[.]$"
            rcode NOERROR
            fallthrough
        }
        template IN SVCB smadja.dev {
            match "^(account[.]smadja[.]dev|aiostreams[.]smadja[.]dev|alertmanager[.]smadja[.]dev|argocd[.]smadja[.]dev|auth[.]smadja[.]dev|bookorbit[.]smadja[.]dev|calendar[.]smadja[.]dev|chat[.]smadja[.]dev|factory[.]smadja[.]dev|facture[.]smadja[.]dev|fitness[.]smadja[.]dev|fleet[.]smadja[.]dev|grafana[.]smadja[.]dev|hassio[.]smadja[.]dev|hubble[.]smadja[.]dev|immich[.]smadja[.]dev|ittools[.]smadja[.]dev|karakeep[.]smadja[.]dev|librechat[.]smadja[.]dev|matrix[.]smadja[.]dev|mealie[.]smadja[.]dev|media[.]smadja[.]dev|ntfy[.]smadja[.]dev|opencode[.]smadja[.]dev|paperless[.]smadja[.]dev|pdf[.]smadja[.]dev|pinepods[.]smadja[.]dev|prometheus[.]smadja[.]dev|research[.]smadja[.]dev|romm[.]smadja[.]dev|search[.]smadja[.]dev|sure[.]smadja[.]dev|tasks[.]smadja[.]dev|trilium[.]smadja[.]dev)[.]$"
            rcode NOERROR
            fallthrough
        }

        # UniFi is the only upstream (ExternalDNS A/TXT and public names).
        # Never kube-dns (10.96.0.10): kube-dns forwards to UniFi, which
        # forwards exact names back here: that would loop.
        forward . 10.0.20.1

        loop
    }
