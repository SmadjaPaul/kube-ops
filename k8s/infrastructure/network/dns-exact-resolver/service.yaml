apiVersion: v1
kind: Service
metadata:
  name: dns-exact-resolver
  namespace: dns-exact-resolver
  labels:
    app.kubernetes.io/name: dns-exact-resolver
    app.kubernetes.io/part-of: infrastructure
    app.kubernetes.io/component: dns-exact-resolver
  annotations:
    # Fixed address in internal-gateway-pool (10.0.20.192/28). .192 is the
    # Gateway/internal VIP and .193 the Gateway/external VIP: .194 is free.
    lbipam.cilium.io/ips: "10.0.20.194"
spec:
  type: LoadBalancer
  # Keep the client source IP (UniFi 10.0.20.1) for the ingress policy.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: dns-exact-resolver
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
