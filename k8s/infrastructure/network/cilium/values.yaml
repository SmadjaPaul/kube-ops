cluster:
  name: homeops
  id: 1

# Talos is created with cluster.network.cni.name=none and cluster.proxy.disabled=true.
kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445

securityContext:
  capabilities:
    ciliumAgent:
      [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Talos host DNS forwarding requires legacy host routing with Cilium.
bpf:
  hostLegacyRouting: true

ipam:
  mode: kubernetes

resources:
  requests:
    # PLT-281: p95 14 d = 692m; 400m approved by Paul (2026-11-15).
    cpu: 400m
    memory: 384Mi
  limits:
    memory: 768Mi

operator:
  replicas: 1
  rollOutPods: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      # Revue séries 2026-11-23: chart default is 10s. Cilium operator, agent and
      # Hubble export ~6k series; 30s keeps the [1m] rates of the Hubble
      # dashboards valid and cuts ~400 samples/s.
      interval: 30s
      labels:
        release: kube-prometheus-stack
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

rollOutCiliumPods: true

# PLT-293: the agent logs "Timed out waiting for datapath updates of FQDN IP
# information" (186 in 3 h on 2026-11-20/21, default 100ms). The DNS answer
# reached the pod before the resolved IP was in the toFQDNs policy map, so the
# first connection from the ARC runner to api.migadu.com hung (TLS handshake
# timeout, POST without response). Give the datapath more time to catch up.
# 2026-11-22: 1s still timed out 827 times in 12 h (name-lock waits dominated
# by CI-runner names: mise-versions.jdx.dev, files.pythonhosted.org, pypi.org,
# registry.opentofu.org), which made aiostreams fetches fail (ETIMEDOUT, a
# config PUT returned 400). 3s trades a slower first DNS answer for no refused
# first SYN. See docs/runbooks/egress-why.md; revert to 1s if DNS latency
# alerts fire.
dnsProxy:
  proxyResponseMaxDelay: 3s

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    trustCRDsExist: true
    labels:
      release: kube-prometheus-stack

gatewayAPI:
  enabled: true

ingressController:
  enabled: false

l2announcements:
  enabled: true

externalIPs:
  enabled: false

loadBalancer:
  algorithm: maglev

envoy:
  # Chart 1.20.4 no longer defaults xdsMode to "ads", but the agent ConfigMap
  # keeps envoy-xds-mode=ads (field still owned by the bootstrap Helm release).
  # Pin it so the agent and the Envoy bootstrap agree; a split/ADS mismatch
  # blocks NPDS ACKs, endpoint regeneration and toFQDNs egress (PLT-200).
  xdsMode: ads
  # Restart cilium-envoy when its bootstrap ConfigMap changes.
  rollOutPods: true
  securityContext:
    capabilities:
      keepCapNetBindService: true
      envoy: [NET_ADMIN, PERFMON, BPF]

hubble:
  enabled: true
  metrics:
    enableOpenMetrics: true
    enabled:
      # Attribution par workload (PLT-411) : labelsContext borne la cardinalité
      # (namespace x workload, quelques dizaines de séries par métrique).
      - dns:labelsContext=source_namespace,source_workload
      - drop:destinationContext=dns;labelsContext=source_namespace,source_workload
      - tcp
      - flow:labelsContext=source_namespace,source_workload
      - port-distribution
    serviceMonitor:
      enabled: true
      interval: 30s
      labels:
        release: kube-prometheus-stack
    dashboards:
      enabled: true
  relay:
    enabled: true
    rollOutPods: true
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
  ui:
    enabled: true
    rollOutPods: true
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
