cluster:
  name: homeops
  id: 1

# Talos is created with cluster.network.cni.name=none and cluster.proxy.disabled=true.
kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445

securityContext:
  capabilities:
    ciliumAgent:
      [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Talos host DNS forwarding requires legacy host routing with Cilium.
bpf:
  hostLegacyRouting: true

ipam:
  mode: kubernetes

resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    memory: 768Mi

operator:
  replicas: 1
  rollOutPods: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

rollOutCiliumPods: true

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true
    labels:
      release: kube-prometheus-stack

gatewayAPI:
  enabled: true

ingressController:
  enabled: false

l2announcements:
  enabled: true

externalIPs:
  enabled: false

loadBalancer:
  algorithm: maglev

envoy:
  securityContext:
    capabilities:
      keepCapNetBindService: true
      envoy: [NET_ADMIN, PERFMON, BPF]

hubble:
  enabled: true
  metrics:
    enableOpenMetrics: true
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
    dashboards:
      enabled: true
  relay:
    enabled: true
    rollOutPods: true
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
  ui:
    enabled: true
    rollOutPods: true
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
