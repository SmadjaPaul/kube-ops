apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: clusterwide-matrix-mas-oidc-egress
  labels:
    policy-type: platform
spec:
  description: "Allow Gateway Envoy to reach the Authentik backend for the MAS OIDC hairpin"
  enableDefaultDeny:
    egress: false
  endpointSelector:
    matchExpressions:
      - key: reserved:ingress
        operator: Exists
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: auth
            app.kubernetes.io/name: authentik
            app.kubernetes.io/component: server
      toPorts:
        - ports:
            - {port: "9000", protocol: TCP}
