apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: clusterwide-matrix-mas-oidc-egress
  labels:
    policy-type: platform
spec:
  description: "Allow the Matrix MAS Gateway hairpin without constraining shared Gateway routes"
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchExpressions:
      - key: reserved:ingress
        operator: Exists
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: auth
            app.kubernetes.io/name: authentik
            app.kubernetes.io/component: server
      toPorts:
        - ports:
            - {port: "9000", protocol: TCP}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: matrix
            k8s:app.kubernetes.io/name: matrix-authentication-service
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
