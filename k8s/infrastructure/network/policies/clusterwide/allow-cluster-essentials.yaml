apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: clusterwide-dns-kubeapi
  labels:
    policy-type: audit-baseline
spec:
  endpointSelector:
    matchExpressions:
      # MAS has an explicit egress policy. Do not inherit this audit baseline's
      # broad RFC1918 allowance, which would bypass MAS backend isolation.
      - key: k8s:app.kubernetes.io/name
        operator: NotIn
        values:
          - matrix-authentication-service
  enableDefaultDeny:
    ingress: false
    egress: false
  description: "Allow DNS and Kubernetes API access cluster-wide"
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
      rules:
        dns:
          - matchPattern: "*"
  - toEntities:
    - kube-apiserver
  - toCIDR: ["10.0.0.0/8"]
