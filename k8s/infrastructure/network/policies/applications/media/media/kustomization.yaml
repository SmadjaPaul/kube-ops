apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- allow-media-access.yaml
# The Arr/Prowlarr/Decypharr policies remain as historical source manifests
# for audit and rollback, but are intentionally not rendered after the media
# retirement. The retirement contract proves this active-graph boundary.
namespace: media
labels:
- pairs:
    policy-type: media-audit
    network-policy: cilium-audit
