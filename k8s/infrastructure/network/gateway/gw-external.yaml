apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  namespace: gateway
spec:
  gatewayClassName: cilium
  listeners:
    - protocol: HTTPS
      port: 443
      name: https-subdomains
      hostname: "*.smadja.dev"
      tls:
        certificateRefs:
          - kind: Secret
            name: cert-smadja
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - {key: smadja.dev/preview, operator: NotIn, values: ["true"]}
    - protocol: HTTPS
      port: 443
      name: https-apex
      hostname: smadja.dev
      tls:
        certificateRefs:
          - kind: Secret
            name: cert-smadja
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - {key: smadja.dev/preview, operator: NotIn, values: ["true"]}
