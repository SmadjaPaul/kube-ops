# PLT-237 — garde-fou d'admission de l'identité agent-operator.
# Indépendant du RBAC : même si un rôle devient trop large, toute écriture de
# system:serviceaccount:agent-operator:agent-operator est refusée hors de ce
# périmètre. Ne concerne aucune autre identité (matchConditions).
# Liste `admitted` = scope.tsv (vérifié par tests/agent-guard/agent-operator-identity-test.sh).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: agent-operator-guard
  labels:
    app.kubernetes.io/name: agent-operator
    app.kubernetes.io/part-of: security
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["*"]
        resources: ["*/*"]
        scope: "*"
    # Auto-diagnostic de l'agent (kubectl auth whoami / can-i) : sans effet.
    excludeResourceRules:
      - apiGroups: [authentication.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE]
        resources: [selfsubjectreviews]
      - apiGroups: [authorization.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE]
        resources: [selfsubjectaccessreviews, selfsubjectrulesreviews]
  matchConditions:
    - name: agent-operator-identity
      expression: request.userInfo.username == 'system:serviceaccount:agent-operator:agent-operator'
    # Proxy de lecture Prometheus/Loki : GET d'un service proxy arrive en CONNECT,
    # que la garde refuserait (namespace monitoring hors scope.tsv). Seules ces
    # deux cibles nommées sont exemptées ; la méthode HTTP n'est pas visible ici,
    # c'est le RBAC (Role agent-operator-monitoring-query, verbe get seul) qui
    # refuse POST/PUT/DELETE (create/update/delete).
    - name: not-monitoring-query-proxy
      expression: >-
        !(request.operation == 'CONNECT' && request.resource.group == '' &&
        request.resource.resource == 'services' && request.subResource == 'proxy' &&
        request.namespace == 'monitoring' &&
        request.name in ['kube-prometheus-stack-prometheus:9090', 'loki-gateway:80'])
    # PRD-88 : lecture des flux Hubble (scripts/kubectl-ro.sh hubble). Le
    # port-forward arrive en CONNECT pods/portforward ; seul un pod du Deployment
    # hubble-relay de kube-system est exempté (nom <deployment>-<hash>-<suffixe>,
    # aucun autre pod, aucun autre namespace). Le RBAC (Role
    # agent-operator-hubble-relay) n'accorde ce verbe que dans kube-system ;
    # l'agent ne peut créer aucun pod dans kube-system.
    - name: not-hubble-relay-portforward
      expression: >-
        !(request.operation == 'CONNECT' && request.resource.group == '' &&
        request.resource.resource == 'pods' && request.subResource == 'portforward' &&
        request.namespace == 'kube-system' &&
        request.name.matches('^hubble-relay-[a-z0-9]{6,10}-[a-z0-9]{5}$'))
  variables:
    - name: admitted
      expression: >-
        ['agentgateway', 'factory-platform', 'gpt-researcher',
        'it-tools', 'mastra-factory', 'mastra-sandbox', 'media', 'mqtt', 'ntfy',
        'open-connector', 'opencode', 'pinepods', 'searxng', 'stirling-pdf']
    - name: target
      expression: >-
        request.resource.group + '/' + request.resource.resource +
        (has(request.subResource) && request.subResource != '' ? '/' + request.subResource : '')
    # PRD-88 : Jobs manuels admis hors scope.tsv, couples namespace/cronjob de
    # cronjob-run.tsv (vérifié par le test d'identité). Seule la création d'un Job
    # nommé <cronjob>-manual-<AAAAMMJJhhmmss> ; la policy agent-operator-cronjob-run
    # impose que son pod template soit celui du CronJob de Git.
    - name: manualRuns
      expression: >-
        ['home-assistant/ha-mcp-token-rotate', 'music-assistant/ma-publish-tokens',
        'music-assistant/ma-reconcile-apply', 'music-assistant/ma-reconcile-plan',
        'music-assistant/ma-sync']
    - name: manualRun
      expression: >-
        request.operation == 'CREATE' && variables.target == 'batch/jobs' &&
        variables.manualRuns.exists(r,
        (request.namespace + '/' + object.metadata.name).matches('^' + r + '-manual-[0-9]{14}$'))
    - name: templated
      expression: >-
        request.operation in ['CREATE', 'UPDATE'] &&
        variables.target in ['apps/deployments', 'apps/statefulsets', 'apps/daemonsets', 'batch/jobs', 'batch/cronjobs']
    # Les variables suivantes ne sont évaluées que si `templated` est vrai.
    - name: newSpec
      expression: >-
        request.resource.resource == 'cronjobs' ?
        object.spec.jobTemplate.spec.template.spec : object.spec.template.spec
    - name: oldSpec
      expression: >-
        request.resource.resource == 'cronjobs' ?
        oldObject.spec.jobTemplate.spec.template.spec : oldObject.spec.template.spec
    - name: newContainers
      expression: >-
        variables.newSpec.containers +
        (has(variables.newSpec.initContainers) ? variables.newSpec.initContainers : [])
    - name: oldContainers
      expression: >-
        variables.oldSpec.containers +
        (has(variables.oldSpec.initContainers) ? variables.oldSpec.initContainers : [])
    - name: newVolumes
      expression: "has(variables.newSpec.volumes) ? variables.newSpec.volumes : []"
    - name: oldVolumes
      expression: "has(variables.oldSpec.volumes) ? variables.oldSpec.volumes : []"
    - name: newSecretEnv
      expression: >-
        variables.newContainers.map(c, has(c.env) ?
        c.env.filter(e, has(e.valueFrom) && has(e.valueFrom.secretKeyRef)) : [])
        .filter(l, size(l) > 0)
    - name: oldSecretEnv
      expression: >-
        variables.oldContainers.map(c, has(c.env) ?
        c.env.filter(e, has(e.valueFrom) && has(e.valueFrom.secretKeyRef)) : [])
        .filter(l, size(l) > 0)
    - name: newSecretEnvFrom
      expression: >-
        variables.newContainers.map(c, has(c.envFrom) ?
        c.envFrom.filter(f, has(f.secretRef)) : []).filter(l, size(l) > 0)
    - name: oldSecretEnvFrom
      expression: >-
        variables.oldContainers.map(c, has(c.envFrom) ?
        c.envFrom.filter(f, has(f.secretRef)) : []).filter(l, size(l) > 0)
    - name: newServiceAccount
      expression: >-
        has(variables.newSpec.serviceAccountName) ? variables.newSpec.serviceAccountName :
        (has(variables.newSpec.serviceAccount) ? variables.newSpec.serviceAccount : 'default')
    - name: oldServiceAccount
      expression: >-
        has(variables.oldSpec.serviceAccountName) ? variables.oldSpec.serviceAccountName :
        (has(variables.oldSpec.serviceAccount) ? variables.oldSpec.serviceAccount : 'default')
    - name: newHostFlags
      expression: >-
        [has(variables.newSpec.hostNetwork) && variables.newSpec.hostNetwork,
        has(variables.newSpec.hostPID) && variables.newSpec.hostPID,
        has(variables.newSpec.hostIPC) && variables.newSpec.hostIPC]
    - name: oldHostFlags
      expression: >-
        [has(variables.oldSpec.hostNetwork) && variables.oldSpec.hostNetwork,
        has(variables.oldSpec.hostPID) && variables.oldSpec.hostPID,
        has(variables.oldSpec.hostIPC) && variables.oldSpec.hostIPC]
    - name: newPrivileged
      expression: >-
        variables.newContainers.filter(c, has(c.securityContext) &&
        has(c.securityContext.privileged) && c.securityContext.privileged).map(c, c.name)
    - name: oldPrivileged
      expression: >-
        variables.oldContainers.filter(c, has(c.securityContext) &&
        has(c.securityContext.privileged) && c.securityContext.privileged).map(c, c.name)
    # Un template qui porte déjà des credentials (Secret en env/envFrom/volume,
    # volume projeté, ServiceAccount dédié) est gelé : changer image, commande ou
    # arguments permettrait de les exfiltrer par pods/log.
    - name: oldCarriesCredentials
      expression: >-
        size(variables.oldSecretEnv) > 0 || size(variables.oldSecretEnvFrom) > 0 ||
        variables.oldServiceAccount != 'default' ||
        variables.oldVolumes.exists(v, has(v.secret) || has(v.projected) || has(v.csi))
  validations:
    - expression: request.namespace in variables.admitted || variables.manualRun
      reason: Forbidden
      message: "agent-operator : namespace hors périmètre ou objet cluster-scoped (scope.tsv)"
    - expression: >-
        variables.target in ['apps/deployments', 'apps/statefulsets', 'apps/daemonsets',
        'apps/replicasets', 'batch/jobs', 'batch/cronjobs', '/pods']
      reason: Forbidden
      message: "agent-operator : ressource hors périmètre (workloads, Jobs, Pods seulement ; jamais Secret, PVC, RBAC, réseau)"
    - expression: >-
        (object == null || !has(object.metadata.labels) ||
        !('smadja.dev/agent-protected' in object.metadata.labels) ||
        object.metadata.labels['smadja.dev/agent-protected'] != 'true') &&
        (oldObject == null || !has(oldObject.metadata.labels) ||
        !('smadja.dev/agent-protected' in oldObject.metadata.labels) ||
        oldObject.metadata.labels['smadja.dev/agent-protected'] != 'true') &&
        (namespaceObject == null || !has(namespaceObject.metadata.labels) ||
        !('smadja.dev/agent-protected' in namespaceObject.metadata.labels) ||
        namespaceObject.metadata.labels['smadja.dev/agent-protected'] != 'true')
      reason: Forbidden
      message: "agent-operator : objet ou namespace étiqueté smadja.dev/agent-protected=true"
    - expression: >-
        variables.target != '/pods' || oldObject == null ||
        !has(oldObject.metadata.labels) || !('cnpg.io/cluster' in oldObject.metadata.labels)
      reason: Forbidden
      message: "agent-operator : pod de base CNPG (passer par l'opérateur CNPG, pas par une suppression de pod)"
    - expression: >-
        variables.target != 'apps/statefulsets' ||
        ([object, oldObject].filter(o, o != null).all(o,
        !has(o.spec.persistentVolumeClaimRetentionPolicy) ||
        ((!has(o.spec.persistentVolumeClaimRetentionPolicy.whenDeleted) ||
        o.spec.persistentVolumeClaimRetentionPolicy.whenDeleted != 'Delete') &&
        (!has(o.spec.persistentVolumeClaimRetentionPolicy.whenScaled) ||
        o.spec.persistentVolumeClaimRetentionPolicy.whenScaled != 'Delete'))))
      reason: Forbidden
      message: "agent-operator : StatefulSet dont la rétention des PVC vaut Delete (suppression de données)"
    - expression: >-
        !variables.templated || request.operation != 'CREATE' || variables.manualRun ||
        (size(variables.newSecretEnv) == 0 && size(variables.newSecretEnvFrom) == 0 &&
        !variables.newVolumes.exists(v, has(v.secret) || has(v.projected) || has(v.csi) ||
        has(v.hostPath) || has(v.persistentVolumeClaim) || has(v.ephemeral)) &&
        variables.newServiceAccount == 'default' &&
        !variables.newHostFlags.exists(f, f) && size(variables.newPrivileged) == 0)
      reason: Forbidden
      message: "agent-operator : création d'un workload qui référence un Secret, un PVC, un ServiceAccount, un hostPath ou un accès hôte (passer par GitOps)"
    - expression: >-
        !variables.templated || request.operation != 'UPDATE' ||
        (variables.newVolumes == variables.oldVolumes &&
        variables.newSecretEnv == variables.oldSecretEnv &&
        variables.newSecretEnvFrom == variables.oldSecretEnvFrom &&
        variables.newServiceAccount == variables.oldServiceAccount &&
        [0, 1, 2].all(i, !variables.newHostFlags[i] || variables.oldHostFlags[i]) &&
        variables.newPrivileged.all(n, n in variables.oldPrivileged))
      reason: Forbidden
      message: "agent-operator : modification des volumes, des références de Secret, du ServiceAccount ou de l'accès hôte (passer par GitOps)"
    - expression: >-
        !variables.templated || request.operation != 'UPDATE' ||
        !variables.oldCarriesCredentials || variables.newSpec == variables.oldSpec
      reason: Forbidden
      message: "agent-operator : workload porteur de credentials, pod template gelé (seuls réplicas, restart et suspend ; image et commande par GitOps)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: agent-operator-guard
  labels:
    app.kubernetes.io/name: agent-operator
    app.kubernetes.io/part-of: security
spec:
  policyName: agent-operator-guard
  validationActions: [Deny]
---
# PRD-88 — un Job manuel de l'agent (kubectl-rw.sh run-cronjob) reprend exactement
# le CronJob de Git : même pod spec (image, commande, ServiceAccount, Secret,
# volumes), mêmes labels et annotations de pod (hors labels posés par le
# contrôleur Job), pas de manualSelector. Le CronJob sert de paramètre : un
# binding par ligne de cronjob-run.tsv, paramètre absent = refus. L'agent ne peut
# modifier aucun de ces CronJobs (namespaces hors scope.tsv) : le contenu du Job
# vient donc de Git.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: agent-operator-cronjob-run
  labels:
    app.kubernetes.io/name: agent-operator
    app.kubernetes.io/part-of: security
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: batch/v1
    kind: CronJob
  matchConstraints:
    resourceRules:
      - apiGroups: [batch]
        apiVersions: ["*"]
        operations: [CREATE]
        resources: [jobs]
  matchConditions:
    - name: agent-operator-identity
      expression: request.userInfo.username == 'system:serviceaccount:agent-operator:agent-operator'
  variables:
    - name: isRun
      expression: >-
        object.metadata.name.matches('^' + params.metadata.name + '-manual-[0-9]{14}$')
    - name: controllerLabels
      expression: >-
        ['controller-uid', 'job-name', 'batch.kubernetes.io/controller-uid', 'batch.kubernetes.io/job-name']
    # Branches de même forme (map ou {}) : jamais d'objet ObjectMeta face à une map vide.
    - name: jobLabels
      expression: >-
        has(object.spec.template.metadata) && has(object.spec.template.metadata.labels) ?
        object.spec.template.metadata.labels : {}
    - name: cronLabels
      expression: >-
        has(params.spec.jobTemplate.spec.template.metadata) &&
        has(params.spec.jobTemplate.spec.template.metadata.labels) ?
        params.spec.jobTemplate.spec.template.metadata.labels : {}
    - name: jobAnnotations
      expression: >-
        has(object.spec.template.metadata) && has(object.spec.template.metadata.annotations) ?
        object.spec.template.metadata.annotations : {}
    - name: cronAnnotations
      expression: >-
        has(params.spec.jobTemplate.spec.template.metadata) &&
        has(params.spec.jobTemplate.spec.template.metadata.annotations) ?
        params.spec.jobTemplate.spec.template.metadata.annotations : {}
  validations:
    - expression: >-
        !variables.isRun ||
        object.spec.template.spec == params.spec.jobTemplate.spec.template.spec
      reason: Forbidden
      message: "agent-operator : Job manuel dont le pod spec diffère du CronJob de Git"
    - expression: >-
        !variables.isRun || !has(object.spec.manualSelector) || !object.spec.manualSelector
      reason: Forbidden
      message: "agent-operator : Job manuel avec manualSelector"
    - expression: >-
        !variables.isRun || variables.jobAnnotations == variables.cronAnnotations
      reason: Forbidden
      message: "agent-operator : Job manuel dont les annotations de pod diffèrent du CronJob"
    - expression: >-
        !variables.isRun ||
        (variables.jobLabels.all(k, k in variables.controllerLabels ||
        (k in variables.cronLabels && variables.cronLabels[k] == variables.jobLabels[k])) &&
        variables.cronLabels.all(k, k in variables.jobLabels && variables.jobLabels[k] == variables.cronLabels[k]))
      reason: Forbidden
      message: "agent-operator : Job manuel dont les labels de pod diffèrent du CronJob"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: agent-operator-cronjob-run-ha-mcp-token-rotate
  labels:
    app.kubernetes.io/name: agent-operator
    app.kubernetes.io/part-of: security
spec:
  policyName: agent-operator-cronjob-run
  validationActions: [Deny]
  paramRef:
    name: ha-mcp-token-rotate
    namespace: home-assistant
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: home-assistant
---
