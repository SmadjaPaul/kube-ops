apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falco-slack-webhook
  namespace: security-system
spec:
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: falco-slack-webhook
    creationPolicy: Owner
  refreshInterval: 1h
  data:
  - secretKey: slack-webhook-url
    remoteRef:
      key: "FALCO_SLACK_WEBHOOK_URL"