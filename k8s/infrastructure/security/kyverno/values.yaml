# PLT-214: three Kyverno controllers renew their leader-election Lease every
# 2 s (background, cleanup, reports: ~1.5 etcd writes/s, each one a WAL fsync
# on the Talos system disk). A single replica gains nothing from fast
# failover: renew every 10 s (Lease 60 s, renew deadline 50 s). A restarted
# pod waits at most one Lease duration before its controller leads. The
# admission controller keeps the 2 s default: its leader runs the webhook
# controller that updates webhook rules from policies, and a 60 s delay after
# a restart could leave a new policy outside the rules (CodeRabbit, #1282).
# PLT-400: the single admission replica restarted 49 times in 47 h: probes
# (5 s timeout, liveness failureThreshold 2) timed out while the process was
# starved on the shared single node (no CPU throttling, no OOM: no CPU limit,
# peak memory ~140 Mi vs 384 Mi limit), and every restart opened a window where
# the fail-policy webhook refused admissions (Velero PodVolumeBackups, PLT-392).
# 3 replicas keep the webhook served during a restart or rollout (the chart then
# creates the PodDisruptionBudget on its own, minAvailable 1). Only the leader
# renews the Lease, so extra replicas add no etcd writes (PLT-214 unaffected).
# The cluster has one node: anti-affinity is only "preferred", HA covers pod
# restarts, not a node loss.
# PLT-400 root cause (logs --previous, 22/11): the restarts are not liveness
# kills (no Unhealthy/Killing event, exit code 0). The leader's Lease renewal
# fails with "etcdserver: request timed out" (single node, slow etcd fsync); with
# the 2 s retry period the renew deadline is only 10 s, so the leader loses the
# lease, the process shuts down gracefully (exit 0) and restarts. A 5 s retry
# period gives Lease 30 s / renew deadline 25 s: an etcd stall is ridden out.
# A new policy waits at most 30 s for the webhook rules if the leader dies,
# and with 3 replicas the webhook keeps answering meanwhile.
admissionController:
  replicas: 3
  # PLT-280: chart 3.x reads the admission container's resources under
  # admissionController.container.resources; a top-level resources key is
  # ignored and the chart default (100m) applied. Requests only: the chart's
  # limits (memory 384Mi, no CPU limit) stay as they run today.
  # PLT-400: CPU request 50m -> 100m (observed peak ~85m) for a fair share
  # under node CPU contention.
  container:
    # The chart reads admission flags under container.extraArgs (a top-level
    # extraArgs key is ignored for this component).
    extraArgs:
      leaderElectionRetryPeriod: 5s
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
  # PLT-400: tolerate a slow answer under load instead of killing the pod.
  livenessProbe:
    httpGet:
      path: /health/liveness
      port: 9443
      scheme: HTTPS
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 4
    successThreshold: 1
  readinessProbe:
    httpGet:
      path: /health/readiness
      port: 9443
      scheme: HTTPS
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 6
    successThreshold: 1
  tolerations:
    - key: node.kubernetes.io/disk-pressure
      operator: Exists
      effect: NoSchedule
    - key: node.kubernetes.io/memory-pressure
      operator: Exists
      effect: NoSchedule
    - key: node.kubernetes.io/not-ready
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 300
    - key: node.kubernetes.io/unreachable
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 300
backgroundController:
  replicas: 1
  extraArgs:
    leaderElectionRetryPeriod: 10s
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  tolerations:
    - key: node.kubernetes.io/disk-pressure
      operator: Exists
      effect: NoSchedule
    - key: node.kubernetes.io/memory-pressure
      operator: Exists
      effect: NoSchedule
    - key: node.kubernetes.io/not-ready
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 300
    - key: node.kubernetes.io/unreachable
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 300
cleanupController:
  replicas: 1
  extraArgs:
    leaderElectionRetryPeriod: 10s
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  tolerations:
    - key: node.kubernetes.io/disk-pressure
      operator: Exists
      effect: NoSchedule
    - key: node.kubernetes.io/memory-pressure
      operator: Exists
      effect: NoSchedule
    - key: node.kubernetes.io/not-ready
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 300
    - key: node.kubernetes.io/unreachable
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 300
reportsController:
  replicas: 1
  extraArgs:
    leaderElectionRetryPeriod: 10s
  resources:
    requests:
      cpu: 200m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  tolerations:
    - key: node.kubernetes.io/disk-pressure
      operator: Exists
      effect: NoSchedule
    - key: node.kubernetes.io/memory-pressure
      operator: Exists
      effect: NoSchedule
    - key: node.kubernetes.io/not-ready
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 300
    - key: node.kubernetes.io/unreachable
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 300
crds:
  create: true
  install: true

# Features
# PLT-417: etcd write load on the single node (etcd write latency spikes to
# 0.5-2 s, scheduler/controller-manager lose their lease). Measured 22/11:
# ~16 etcd writes/s, of which ~4.6/s Events (14k Event objects, ~7k of them
# Kyverno PolicyViolation on audit policies) and ~6/s ephemeralreports and
# policyreports. Violations stay visible in the PolicyReports.
# The previous `features.logging.omitEvents` key does not exist in chart 3.8
# (the running args were still the chart default): the right key is
# `features.omitEvents`.
# Rollback: remove PolicyViolation from the list, set admissionReports back to
# true and backgroundScanInterval to 1h.
features:
  omitEvents:
    eventTypes:
      - PolicyApplied
      - PolicySkipped
      - PolicyViolation
  # No per-admission EphemeralReport: policy results come from the background
  # scan (every 6 h instead of 1 h).
  admissionReports:
    enabled: false
  backgroundScan:
    backgroundScanInterval: 6h

# Configuration
config:

  # -- Create the configmap.
  create: true

  # -- Preserve the configmap settings during upgrade.
  preserve: true

  # -- (string) The configmap name (required if `create` is `false`).
  name: ~

  # -- Additional annotations to add to the configmap.
  annotations: {}

  # -- Enable registry mutation for container images. Enabled by default.
  enableDefaultRegistryMutation: true

  # -- The registry hostname used for the image mutation.
  defaultRegistry: docker.io

  # -- Exclude groups
  excludeGroups:
    - system:nodes

  # -- Exclude usernames
  excludeUsernames: []
    # - '!system:kube-scheduler'

  # -- Exclude roles
  excludeRoles: []

  # -- Exclude roles
  excludeClusterRoles: []

  # -- Generate success events.
  generateSuccessEvents: false

  # -- Maximum cumulative size of context data during policy evaluation.
  # Supports Kubernetes quantity format (e.g., 100Mi, 2Gi) or plain bytes (e.g., 2097152).
  # Limits memory used by context variables to prevent unbounded growth.
  # Increase if policies legitimately need large context data (e.g., processing large ConfigMaps).
  # Set to 0 to disable the limit (not recommended for production).
  # @default -- 2Mi
  maxContextSize: ~

  # -- Sets the threshold for the total number of UpdateRequests generated for mutateExisitng and generate policies.
  updateRequestThreshold: 1000

  # -- Defines the `namespaceSelector`/`objectSelector` in the webhook configurations.
  # The Kyverno namespace is excluded if `excludeKyvernoNamespace` is `true` (default)
  webhooks:
    # Exclude namespaces
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
          - kube-system
          # PLT-400: nothing a policy targets lives there; saves webhook calls.
          - kube-public
          - kube-node-lease
    # Exclude objects
    # objectSelector:
    #   matchExpressions:
    #   - key: webhooks.kyverno.io/exclude
    #     operator: DoesNotExist

  # -- Defines annotations to set on webhook configurations.
  webhookAnnotations:
    # Example to disable admission enforcer on AKS:
    'admissions.enforcer/disabled': 'true'

  # -- Defines labels to set on webhook configurations.
  webhookLabels: {}
    # Example to adopt webhook resources in ArgoCD:
    # 'argocd.argoproj.io/instance': 'kyverno'

  # -- Defines match conditions to set on webhook configurations (requires Kubernetes 1.27+).
  matchConditions: []

  # -- Exclude Kyverno namespace
  # Determines if default Kyverno namespace exclusion is enabled for webhooks and resourceFilters
  excludeKyvernoNamespace: true

  # -- resourceFilter namespace exclude
  # Namespaces to exclude from the default resourceFilters
  resourceFiltersExcludeNamespaces: []

  # -- resourceFilters exclude list
  # Items to exclude from config.resourceFilters
  resourceFiltersExclude: []

  # -- resourceFilter namespace include
  # Namespaces to include to the default resourceFilters
  resourceFiltersIncludeNamespaces: []

  # -- resourceFilters include list
  # Items to include to config.resourceFilters
  resourceFiltersInclude: []
