apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: platform-baseline-env-secret-via-secretkeyref
  annotations:
    description: "Les variables d'environnement secretes viennent d'un secretKeyRef, jamais d'une valeur litterale."
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  # PLT-400: 5 s instead of 10 s; with Ignore a slow Kyverno must not hold API writes.
  webhookConfiguration:
    timeoutSeconds: 5
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: not-system-namespace
      expression: >-
        !has(object.metadata.namespace) || !(object.metadata.namespace in ['gatekeeper-system', 'kube-node-lease', 'kube-public', 'kube-system', 'kubearmor', 'kyverno', 'monitoring', 'security-system'])
  variables:
    - name: c
      expression: >-
        object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : []) + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
  validations:
    - expression: >-
        variables.c.all(c, !has(c.env) || c.env == null || c.env.all(e, !e.name.matches('(?i).*(PASSWORD|PASSWD|SECRET|TOKEN|API_?KEY|PRIVATE_?KEY|CREDENTIAL).*') || e.name.matches('(?i).*(_FILE|_PATH|_NAME|_ENABLED|_URL)$') || !has(e.value) || string(e.value) == ''))
      message: "Une variable d'environnement de type secret doit utiliser valueFrom.secretKeyRef, pas une valeur litterale. (env-secret-via-secretkeyref)"
