# Socle de durcissement de la plateforme : ValidatingPolicy CEL (policies.kyverno.io/v1).
# Remplace la ClusterPolicy legacy nsa-hardening-all-namespaces (kyverno.io/v1), refusee par la
# CLI Kyverno 1.20 et deprecated cote serveur.
#
# Versions : Kyverno 1.18.1 deploye (chart 3.8.1, CRD validatingpolicies.policies.kyverno.io :
# v1 servie ; verifie sur le rendu de k8s/infrastructure/security/kyverno) ; CLI de test 1.20.0
# (CI figee sur la meme version). Meme source pour le cluster (Audit) et pour `just check`
# (scripts/policy-check.sh : `kyverno apply` sur le rendu, avec cliquet sur policy/baseline.tsv).
#
# Mode Audit, sauf les INTERDITS ABSOLUS (PLT-390 lot 5) en Deny : no-privileged et no-loadbalancer
# (la 3e, route publique sans auth, est indecidable a l'admission : auth OIDC native dans l'app ; elle
# est bloquee en CI par app-test `oidc`). Retour arriere : repasser validationActions en [Audit]
# (une PR d'une ligne par politique). Exceptions explicites : csi-proxmox et longhorn-system (DaemonSets
# CSI/stockage privilegies par conception), Services LoadBalancer cilium-gateway-* (ns gateway,
# crees par Cilium) et dns-exact-resolver (PLT-149). failurePolicy Ignore : Kyverno indisponible ne
# bloque pas le cluster. Pour le reste, le gate statique est ce qui bloque (violation nouvelle = echec). Les politiques ciblent Pod ; Kyverno
# genere les regles pour Deployment, StatefulSet, DaemonSet, Job et CronJob (autogen).
# Namespaces systeme exclus : meme liste que l'ancienne politique (+ kyverno).
# Exceptions : policies.kyverno.io/v1 PolicyException (voir opencode et hassio). Rappel : le chart
# lance les controleurs avec --enablePolicyException=false, donc elles n'ont pas d'effet runtime.
# Regles reservees au depot (pas d'admission) : policy/static/repo-contract.yaml.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: platform-baseline-non-root-containers
  annotations:
    description: "Conteneurs en non-root (k8s/CLAUDE.md, NSA/CISA 3.4.4)."
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  # PLT-400: 5 s instead of 10 s; with Ignore a slow Kyverno must not hold API writes.
  webhookConfiguration:
    timeoutSeconds: 5
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: not-system-namespace
      expression: >-
        !has(object.metadata.namespace) || !(object.metadata.namespace in ['gatekeeper-system', 'kube-node-lease', 'kube-public', 'kube-system', 'kubearmor', 'kyverno', 'monitoring', 'security-system'])
  variables:
    - name: c
      expression: >-
        object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : []) + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
  validations:
    - expression: >-
        variables.c.all(c, (has(c.securityContext) && has(c.securityContext.runAsNonRoot)) ? c.securityContext.runAsNonRoot : (has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot) && object.spec.securityContext.runAsNonRoot))
      message: "Chaque conteneur doit tourner avec runAsNonRoot: true (niveau conteneur ou pod). (non-root-containers)"
    - expression: >-
        variables.c.all(c, (has(c.securityContext) && has(c.securityContext.runAsUser)) ? c.securityContext.runAsUser != 0 : !(has(object.spec.securityContext) && has(object.spec.securityContext.runAsUser) && object.spec.securityContext.runAsUser == 0))
      message: "Aucun conteneur ne doit tourner avec runAsUser: 0. (non-root-containers)"
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: platform-baseline-no-privileged
  annotations:
    description: "Aucun conteneur privilegie (NSA/CISA 4.1)."
spec:
  validationActions: [Deny]
  failurePolicy: Ignore
  # PLT-400: 5 s instead of 10 s; with Ignore a slow Kyverno must not hold API writes.
  webhookConfiguration:
    timeoutSeconds: 5
  matchConstraints:
    # PLT-467: l'autogen reecrit le matchCondition namespace pour les controleurs sur
    # spec.template.metadata.namespace (jamais renseigne) : DaemonSet csi-proxmox et longhorn-system
    # etaient refuses a l'admission/dry-run Argo. Un namespaceSelector s'applique a tous les kinds.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [csi-proxmox, longhorn-system]
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: not-system-namespace
      expression: >-
        !has(object.metadata.namespace) || !(object.metadata.namespace in ['gatekeeper-system', 'kube-node-lease', 'kube-public', 'kube-system', 'kubearmor', 'kyverno', 'monitoring', 'security-system', 'csi-proxmox', 'longhorn-system'])
  variables:
    - name: c
      expression: >-
        object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : []) + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
  validations:
    - expression: >-
        variables.c.all(c, !(has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged))
      message: "Aucun conteneur privilegie (privileged: true). (no-privileged)"
---
