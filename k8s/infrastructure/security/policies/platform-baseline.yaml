apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: platform-baseline-no-loadbalancer
  annotations:
    description: "Pas de Service LoadBalancer hors exceptions explicites (interdit absolu, PLT-390)."
spec:
  validationActions: [Deny]
  failurePolicy: Ignore
  # PLT-400: 5 s instead of 10 s; with Ignore a slow Kyverno must not hold API writes.
  webhookConfiguration:
    timeoutSeconds: 5
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [services]
  matchConditions:
    - name: not-system-namespace
      expression: >-
        !has(object.metadata.namespace) || !(object.metadata.namespace in ['gatekeeper-system', 'kube-node-lease', 'kube-public', 'kube-system', 'kubearmor', 'kyverno', 'monitoring', 'security-system'])
    - name: not-explicit-exception
      expression: >-
        !((object.metadata.namespace == 'gateway' && object.metadata.name.startsWith('cilium-gateway-')) || (object.metadata.namespace == 'dns-exact-resolver' && object.metadata.name == 'dns-exact-resolver'))
  validations:
    - expression: >-
        !has(object.spec.type) || object.spec.type != 'LoadBalancer'
      message: "Un Service ne doit pas etre de type LoadBalancer (exposition via Gateway). (no-loadbalancer)"
---
