apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ups-thermal
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: host.thermal
      rules:
        # PLT-268: the target is a CPU Tctl below 85 C under sustained load.
        # The PLT-215 policy keeps the host near 60 C average (max 71.6 C).
        - alert: HostCpuTemperatureHigh
          expr: >-
            max by (instance) (node_hwmon_temp_celsius{job="proxmox-host",chip="pci0000:00_0000:00:18_3",sensor="temp1"}) > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Proxmox host CPU Tctl is above 85 C"
            description: >-
              Tctl {{ $value | humanize }} C for 10 minutes on {{ $labels.instance }}.
              The PLT-268 target is below 85 C under sustained load. Check the
              CPU frequency policy (proxmox-cpufreq), the fans and the dust.
            runbook_url: https://github.com/SmadjaPaul/homelab-infra/blob/main/docs/operations/proxmox-cpufreq.md
        - alert: HostCpuTemperatureCritical
          expr: >-
            max by (instance) (node_hwmon_temp_celsius{job="proxmox-host",chip="pci0000:00_0000:00:18_3",sensor="temp1"}) > 95
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Proxmox host CPU Tctl is above 95 C"
            description: >-
              Tctl {{ $value | humanize }} C on {{ $labels.instance }}, near the
              hardware thermal limit. Reduce load now and check the cooling.
            runbook_url: https://github.com/SmadjaPaul/homelab-infra/blob/main/docs/operations/proxmox-cpufreq.md
    # PLT-268 / PLT-471 (23/11/2026): the group `ups.nut` (UpsOnBattery,
    # UpsLowBattery, UpsCollectorFailing, UpsTelemetryStale) was removed. No UPS
    # is installed (PLT-268 waits for Paul's purchase) and the proxmox_nut role
    # is disabled, so no nut_* series exists and none of these rules could fire.
    # Restore them from git history together with the NUT role once a UPS is
    # plugged in and proxmox_nut_enabled is set.
