# PLT-344 L7: stable local admin credentials for Grafana. Generated once by
# External Secrets (CreatedOnce): no value is stored in Git or Doppler, and the
# chart no longer re-randomises the password at each Argo render.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  length: 40
  digits: 8
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  refreshPolicy: CreatedOnce
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: grafana-admin-credentials
