apiVersion: v1
kind: ConfigMap
metadata:
  name: homeops-logs-efficiency-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  homeops-logs-efficiency.json: |
    {
      "id": null,
      "uid": "homeops-logs-efficiency",
      "title": "HomeOps — Logs & Collection Cost",
      "tags": [
        "homeops",
        "loki",
        "alloy",
        "efficiency"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "2m",
      "time": {
        "from": "now-2h",
        "to": "now"
      },
      "editable": false,
      "templating": {
        "list": [
          {
            "name": "DS_LOKI",
            "label": "Loki datasource",
            "type": "datasource",
            "query": "loki",
            "current": {
              "text": "Loki",
              "value": "Loki"
            },
            "refresh": 1,
            "hide": 0,
            "includeAll": false,
            "multi": false
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "title": "Read me — interpretation",
          "type": "text",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 3
          },
          "options": {
            "mode": "markdown",
            "content": "**Source:** one Grafana Alloy Kubernetes API log reader, Loki monolithic backed by `longhorn-bulk` (HDD). This dashboard measures ingestion/stream volume; it does **not** prove that Loki prevents disk standby. No filters or data-dropping are introduced. Use a short time range before investigating top senders."
          }
        },
        {
          "id": 2,
          "title": "Kubernetes log bytes/s by namespace",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 3,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "loki",
            "uid": "${DS_LOKI}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(12,sum by (namespace)(bytes_rate({source=\"kubernetes\"}[5m])))",
              "legendFormat": "{{namespace}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 3,
          "title": "Kubernetes log lines/s by namespace",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 3,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "loki",
            "uid": "${DS_LOKI}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(12,sum by (namespace)(rate({source=\"kubernetes\"}[5m])))",
              "legendFormat": "{{namespace}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 4,
          "title": "Total application log bytes/s",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 11,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "loki",
            "uid": "${DS_LOKI}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(bytes_rate({source=\"kubernetes\"}[5m]))",
              "legendFormat": "application logs"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 5,
          "title": "Kubernetes event lines/s",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 11,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "loki",
            "uid": "${DS_LOKI}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate({source=\"kubernetes-events\"}[5m]))",
              "legendFormat": "events"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 6,
          "title": "Loki and Alloy CPU cores",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 19,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace,pod) (rate(container_cpu_usage_seconds_total{namespace=\"monitoring\",pod=~\"(loki|alloy).*\",container!=\"\",container!=\"POD\"}[5m]))",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 7,
          "title": "Loki and Alloy working-set memory",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 19,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace,pod) (container_memory_working_set_bytes{namespace=\"monitoring\",pod=~\"(loki|alloy).*\",container!=\"\",container!=\"POD\"})",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ]
    }
