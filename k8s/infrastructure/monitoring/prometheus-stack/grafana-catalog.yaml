      "links":[{"title":"Platform Overview","type":"link","url":"/d/homeops-operations","targetBlank":false},{"title":"Prometheus Diagnostics","type":"link","url":"/d/9fa0d141-d019-4ad7-8bc5-42196ee308bd","targetBlank":false},{"title":"Explore Loki","type":"link","url":"/explore?orgId=1&left=%7B%22datasource%22:%22Loki%22%7D","targetBlank":true},{"title":"Explore Tempo","type":"link","url":"/explore?orgId=1&left=%7B%22datasource%22:%22tempo%22%7D","targetBlank":true}],
      "templating":{"list":[{"name":"namespace","label":"Namespace","type":"query","datasource":{"type":"prometheus","uid":"prometheus"},"query":"label_values(kube_pod_info, namespace)","refresh":1,"includeAll":true,"allValue":".*","current":{"text":"All","value":"$__all"}}]},
      "panels":[
        {"id":1,"type":"text","title":"Interpretation","gridPos":{"x":0,"y":0,"w":24,"h":3},"options":{"mode":"markdown","content":"This dashboard measures telemetry flow and operational cost. Loki log volume, request errors and the configured 168h retention policy are kept together with Prometheus and Tempo ingestion/storage. Alloy has a healthy scrape target, but the current Alloy build exposes no component-cardinality metric; CPU/memory and target health are the safe pipeline signals. No panel treats missing telemetry as zero."}},
        {"id":2,"type":"timeseries","title":"Prometheus samples appended","gridPos":{"x":0,"y":3,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum(rate(prometheus_tsdb_head_samples_appended_total[5m]))","legendFormat":"samples/s"}],"fieldConfig":{"defaults":{"unit":"ops","noValue":"No data","min":0}},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}}},
        {"id":3,"type":"timeseries","title":"Prometheus head series","gridPos":{"x":12,"y":3,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"prometheus_tsdb_head_series","legendFormat":"head series"},{"refId":"B","expr":"prometheus_tsdb_storage_blocks_bytes","legendFormat":"blocks"}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","min":0},"overrides":[{"matcher":{"id":"byName","options":"blocks"},"properties":[{"id":"unit","value":"bytes"}]}]},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}}},
        {"id":4,"type":"timeseries","title":"Loki bytes received","gridPos":{"x":0,"y":11,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum(rate(loki_distributor_bytes_received_total[5m]))","legendFormat":"Loki bytes/s"}],"fieldConfig":{"defaults":{"unit":"Bps","noValue":"No data","min":0}},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}}},
        {"id":5,"type":"timeseries","title":"Tempo spans and bytes received","gridPos":{"x":12,"y":11,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum(rate(tempo_distributor_spans_received_total[5m]))","legendFormat":"Tempo spans/s"},{"refId":"B","expr":"sum(rate(tempo_distributor_bytes_received_total[5m]))","legendFormat":"Tempo bytes/s"}],"fieldConfig":{"defaults":{"unit":"ops","noValue":"No data","min":0},"overrides":[{"matcher":{"id":"byName","options":"Tempo bytes/s"},"properties":[{"id":"unit","value":"Bps"}]}]},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}}},
        {"id":6,"type":"timeseries","title":"Telemetry component resources","gridPos":{"x":0,"y":19,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"monitoring\",pod=~\"(alloy|loki|tempo|kube-prometheus-stack-prometheus).*\",container!=\"\",container!=\"POD\"}[5m]))","legendFormat":"{{pod}} CPU"},{"refId":"B","expr":"sum by (pod) (container_memory_working_set_bytes{namespace=\"monitoring\",pod=~\"(alloy|loki|tempo|kube-prometheus-stack-prometheus).*\",container!=\"\",container!=\"POD\"})","legendFormat":"{{pod}} memory"}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","min":0},"overrides":[{"matcher":{"id":"byName","options":"{{pod}} memory"},"properties":[{"id":"unit","value":"bytes"}]}]},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}}},
        {"id":7,"type":"timeseries","title":"Loki request rate","gridPos":{"x":12,"y":19,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum by (route) (rate(loki_request_duration_seconds_count[5m]))","legendFormat":"{{route}}"}],"fieldConfig":{"defaults":{"unit":"ops","noValue":"No data","min":0}},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull"]}}},
        {"id":8,"type":"timeseries","title":"Loki application log bytes/s","gridPos":{"x":0,"y":27,"w":12,"h":8},"datasource":{"type":"loki","uid":"${DS_LOKI}"},"targets":[{"refId":"A","expr":"sum by (namespace) (bytes_rate({source=\"kubernetes\"}[5m]))","legendFormat":"{{namespace}}"}],"fieldConfig":{"defaults":{"unit":"Bps","noValue":"No data","min":0}},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}}},
        {"id":9,"type":"timeseries","title":"Loki request errors","gridPos":{"x":12,"y":27,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum by (route) (rate(loki_request_duration_seconds_count{status_code=~\"5..\"}[5m]))","legendFormat":"{{route}} 5xx"}],"fieldConfig":{"defaults":{"unit":"ops","noValue":"No data","min":0}},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull"]}}},
        {"id":10,"type":"text","title":"Loki retention policy","gridPos":{"x":0,"y":35,"w":24,"h":3},"options":{"mode":"markdown","content":"Git configures Loki retention for **168h** with the compactor enabled on the filesystem-backed `longhorn-bulk` PVC. The chart's Thanos object-store and Bloom dashboards are disabled because those components are not deployed. Retention execution remains a runtime/controller check, not a fabricated metric."}}
      ]
    }
