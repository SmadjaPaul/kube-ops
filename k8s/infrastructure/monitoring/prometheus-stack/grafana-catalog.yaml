apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-platform-overview-dashboard
  namespace: monitoring
  annotations:
    grafana_folder: "00 — Overview"
  labels:
    grafana_dashboard: "1"
data:
  platform-overview.json: |
    {
      "uid":"homeops-operations",
      "title":"Platform Overview",
      "description":"Primary entry point for cluster health, critical services, GitOps state and capacity.",
      "tags":["platform","kubernetes","security"],
      "timezone":"browser",
      "schemaVersion":39,
      "version":2,
      "refresh":"1m",
      "time":{"from":"now-3h","to":"now"},
      "editable":false,
      "links":[
        {"title":"Host & Hardware","type":"link","url":"/d/homeops-edge-boot-io","targetBlank":false},
        {"title":"Cluster & Workloads","type":"link","url":"/d/cluster-workloads","targetBlank":false},
        {"title":"Telemetry Pipeline","type":"link","url":"/d/homeops-logs-efficiency","targetBlank":false},
        {"title":"Explore Prometheus","type":"link","url":"/explore?orgId=1","targetBlank":true}
      ],
      "templating":{"list":[{"name":"namespace","label":"Namespace","type":"query","datasource":{"type":"prometheus","uid":"prometheus"},"query":"label_values(kube_pod_info, namespace)","refresh":1,"includeAll":true,"allValue":".*","current":{"text":"All","value":"$__all"}},{"name":"DS_LOKI","label":"Loki datasource","type":"datasource","query":"loki","refresh":1,"includeAll":false,"current":{"text":"Loki","value":"Loki"}}]},
      "panels":[
        {"id":1,"type":"text","title":"How to read this page","gridPos":{"x":0,"y":0,"w":24,"h":3},"options":{"mode":"markdown","content":"This is the operational landing page. A zero is an observed zero; **No data** is unknown. Follow the links for host, workload, network, telemetry, factory and data-platform diagnosis. GitOps state is controller evidence, not proof that a user journey works."}},
        {"id":2,"type":"stat","title":"Ready Kubernetes nodes","gridPos":{"x":0,"y":3,"w":4,"h":5},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})","instant":true}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","min":0},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"]},"colorMode":"value","graphMode":"none"}},
        {"id":3,"type":"stat","title":"Critical alerts firing","gridPos":{"x":4,"y":3,"w":4,"h":5},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum(ALERTS{alertstate=\"firing\",severity=\"critical\"}) or vector(0)","instant":true}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","min":0},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"]},"colorMode":"value","graphMode":"none"}},
        {"id":4,"type":"stat","title":"User-ready probes (%)","gridPos":{"x":8,"y":3,"w":4,"h":5},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"100 * sum(probe_success{v1_user_ready=\"true\"}) / clamp_min(count(probe_success{v1_user_ready=\"true\"}),1)","instant":true}],"fieldConfig":{"defaults":{"unit":"percent","noValue":"No data","min":0,"max":100},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"]},"colorMode":"value","graphMode":"none"}},
        {"id":5,"type":"stat","title":"Argo apps not Synced","gridPos":{"x":12,"y":3,"w":4,"h":5},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum(argocd_app_info{sync_status!=\"Synced\"}) or vector(0)","instant":true}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","min":0},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"]},"colorMode":"value","graphMode":"none"}},
        {"id":6,"type":"stat","title":"PVCs pending","gridPos":{"x":16,"y":3,"w":4,"h":5},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum(kube_persistentvolumeclaim_status_phase{phase=\"Pending\"}) or vector(0)","instant":true}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","min":0},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"]},"colorMode":"value","graphMode":"none"}},
        {"id":7,"type":"stat","title":"Prometheus head series","gridPos":{"x":20,"y":3,"w":4,"h":5},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"prometheus_tsdb_head_series","instant":true}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","min":0},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"]},"colorMode":"value","graphMode":"none"}},
        {"id":8,"type":"timeseries","title":"Service availability","gridPos":{"x":0,"y":8,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"probe_success{v1_user_ready=\"true\"}","legendFormat":"{{target}}"}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","min":0,"max":1},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull"]}}},
        {"id":9,"type":"timeseries","title":"Top namespaces by CPU","gridPos":{"x":12,"y":8,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"topk(12,sum by (namespace) (rate(container_cpu_usage_seconds_total{container!=\"\",container!=\"POD\",image!=\"\",namespace=~\"$namespace\"}[5m])))","legendFormat":"{{namespace}}"}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","min":0},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}}},
        {"id":10,"type":"timeseries","title":"Scrape targets down","gridPos":{"x":0,"y":16,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum by (job) (up == 0)","legendFormat":"{{job}}"}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","min":0}},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}}},
        {"id":11,"type":"timeseries","title":"Container working-set memory","gridPos":{"x":12,"y":16,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum by (namespace) (container_memory_working_set_bytes{container!=\"\",container!=\"POD\",image!=\"\",namespace=~\"$namespace\"})","legendFormat":"{{namespace}}"}],"fieldConfig":{"defaults":{"unit":"bytes","noValue":"No data","min":0}},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}}}
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-host-hardware-dashboard
  namespace: monitoring
  annotations:
    grafana_folder: "10 — Infrastructure"
  labels:
    grafana_dashboard: "1"
data:
  host-hardware.json: |
    {
      "uid":"homeops-edge-boot-io",
      "title":"Host & Hardware",
      "description":"Physical Proxmox host and Talos guest resource diagnosis, with explicit sensor gaps.",
      "tags":["infrastructure","storage","advanced"],
      "timezone":"browser","schemaVersion":39,"version":2,"refresh":"30s","time":{"from":"now-2h","to":"now"},"editable":false,
      "links":[{"title":"Platform Overview","type":"link","url":"/d/homeops-operations","targetBlank":false},{"title":"Storage & Backups","type":"link","url":"/d/storage-backups","targetBlank":false},{"title":"Explore Prometheus","type":"link","url":"/explore?orgId=1","targetBlank":true}],
      "templating":{"list":[{"name":"instance","label":"Host","type":"query","datasource":{"type":"prometheus","uid":"prometheus"},"query":"label_values(node_uname_info{job=\"proxmox-host\"}, instance)","refresh":1,"includeAll":true,"allValue":".*","current":{"text":"All","value":"$__all"}}]},
      "panels":[
        {"id":1,"type":"text","title":"Scope and sensor evidence","gridPos":{"x":0,"y":0,"w":24,"h":3},"options":{"mode":"markdown","content":"This view separates the physical Proxmox exporter (`job=proxmox-host`) from Talos guest metrics. CPU modes, iowait, disk I/O, busy ratio, load and memory are measured. The current exporter exposes **no hwmon temperature/fan or SMART series**, so their absence is shown as unknown rather than zero. Do not add the guest and physical I/O totals together."}},
        {"id":2,"type":"stat","title":"Proxmox exporter up","gridPos":{"x":0,"y":3,"w":6,"h":5},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"up{job=\"proxmox-host\",instance=~\"$instance\"}","instant":true}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","min":0,"max":1},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"]},"colorMode":"value","graphMode":"none"}},
        {"id":3,"type":"timeseries","title":"CPU modes and iowait","gridPos":{"x":6,"y":3,"w":18,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum by (mode) (rate(node_cpu_seconds_total{job=\"proxmox-host\",instance=~\"$instance\",mode=~\"user|system|iowait|idle|steal\"}[5m]))","legendFormat":"{{mode}}"}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","min":0}},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}}},
        {"id":4,"type":"timeseries","title":"Load average","gridPos":{"x":0,"y":11,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"node_load1{job=\"proxmox-host\",instance=~\"$instance\"}","legendFormat":"1m"},{"refId":"B","expr":"node_load5{job=\"proxmox-host\",instance=~\"$instance\"}","legendFormat":"5m"},{"refId":"C","expr":"node_load15{job=\"proxmox-host\",instance=~\"$instance\"}","legendFormat":"15m"}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","min":0}},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull"]}}},
        {"id":5,"type":"timeseries","title":"Physical disk throughput","gridPos":{"x":12,"y":11,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum by (device) (rate(node_disk_read_bytes_total{job=\"proxmox-host\",instance=~\"$instance\",device!~\"loop.*|dm-.*\"}[5m]))","legendFormat":"{{device}} read"},{"refId":"B","expr":"sum by (device) (rate(node_disk_written_bytes_total{job=\"proxmox-host\",instance=~\"$instance\",device!~\"loop.*|dm-.*\"}[5m]))","legendFormat":"{{device}} write"}],"fieldConfig":{"defaults":{"unit":"Bps","noValue":"No data","min":0}},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}}},
        {"id":6,"type":"timeseries","title":"Disk IOPS","gridPos":{"x":0,"y":19,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum by (device) (rate(node_disk_reads_completed_total{job=\"proxmox-host\",instance=~\"$instance\",device!~\"loop.*|dm-.*\"}[5m]))","legendFormat":"{{device}} read IOPS"},{"refId":"B","expr":"sum by (device) (rate(node_disk_writes_completed_total{job=\"proxmox-host\",instance=~\"$instance\",device!~\"loop.*|dm-.*\"}[5m]))","legendFormat":"{{device}} write IOPS"}],"fieldConfig":{"defaults":{"unit":"ops","noValue":"No data","min":0}},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}}},
        {"id":7,"type":"timeseries","title":"Disk busy ratio","gridPos":{"x":12,"y":19,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum by (device) (rate(node_disk_io_time_seconds_total{job=\"proxmox-host\",instance=~\"$instance\",device!~\"loop.*|dm-.*\"}[5m]))","legendFormat":"{{device}}"}],"fieldConfig":{"defaults":{"unit":"percentunit","noValue":"No data","min":0,"max":1}},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}}},
        {"id":8,"type":"timeseries","title":"Host memory available","gridPos":{"x":0,"y":27,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"node_memory_MemAvailable_bytes{job=\"proxmox-host\",instance=~\"$instance\"}","legendFormat":"available"},{"refId":"B","expr":"node_memory_MemTotal_bytes{job=\"proxmox-host\",instance=~\"$instance\"}","legendFormat":"total"}],"fieldConfig":{"defaults":{"unit":"bytes","noValue":"No data","min":0}},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull"]}}}
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-storage-backups-dashboard
  namespace: monitoring
  annotations:
    grafana_folder: "10 — Infrastructure"
  labels:
    grafana_dashboard: "1"
data:
  storage-backups.json: |
    {
      "uid":"storage-backups","title":"Storage & Backups","description":"PVC, Longhorn-backed capacity, database workload and backup job evidence without double-counting I/O.","tags":["storage","infrastructure","platform"],"timezone":"browser","schemaVersion":39,"version":1,"refresh":"2m","time":{"from":"now-24h","to":"now"},"editable":false,
      "links":[{"title":"Platform Overview","type":"link","url":"/d/homeops-operations","targetBlank":false},{"title":"Host & Hardware","type":"link","url":"/d/homeops-edge-boot-io","targetBlank":false},{"title":"Explore Prometheus","type":"link","url":"/explore?orgId=1","targetBlank":true}],
      "templating":{"list":[{"name":"namespace","label":"Namespace","type":"query","datasource":{"type":"prometheus","uid":"prometheus"},"query":"label_values(kube_persistentvolumeclaim_info, namespace)","refresh":1,"includeAll":true,"allValue":".*","current":{"text":"All","value":"$__all"}}]},
      "panels":[
        {"id":1,"type":"text","title":"Interpretation","gridPos":{"x":0,"y":0,"w":24,"h":3},"options":{"mode":"markdown","content":"Capacity is shown from Kubernetes PVC/PV evidence. Longhorn, ZFS and physical disk I/O are deliberately not added together. The current scrape has no native Longhorn, ZFS, Velero or Kopia metric families; backup job state and PVC evidence are therefore shown here, while the missing exporter signals remain an explicit gap."}},
        {"id":2,"type":"timeseries","title":"PVC used / capacity","gridPos":{"x":0,"y":3,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"topk(20,100 * kubelet_volume_stats_used_bytes{namespace=~\"$namespace\"} / clamp_min(kubelet_volume_stats_capacity_bytes{namespace=~\"$namespace\"},1))","legendFormat":"{{namespace}}/{{persistentvolumeclaim}}"}],"fieldConfig":{"defaults":{"unit":"percent","noValue":"No data","min":0,"max":100}},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}}},
        {"id":3,"type":"timeseries","title":"Requested storage by class","gridPos":{"x":12,"y":3,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum by (storageclass) (kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace=~\"$namespace\"})","legendFormat":"{{storageclass}}"}],"fieldConfig":{"defaults":{"unit":"bytes","noValue":"No data","min":0}},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull"]}}},
        {"id":4,"type":"stat","title":"Longhorn PVs","gridPos":{"x":0,"y":11,"w":6,"h":5},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"count(kube_persistentvolume_info{storageclass=~\"longhorn.*\"}) or vector(0)","instant":true}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","min":0}},"options":{"reduceOptions":{"calcs":["lastNotNull"]},"colorMode":"value","graphMode":"none"}},
        {"id":5,"type":"stat","title":"Velero backup job failures","gridPos":{"x":6,"y":11,"w":6,"h":5},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum(kube_job_status_failed{namespace=\"velero\"}) or vector(0)","instant":true}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","min":0}},"options":{"reduceOptions":{"calcs":["lastNotNull"]},"colorMode":"value","graphMode":"none"}},
        {"id":6,"type":"timeseries","title":"Backup and database job outcomes","gridPos":{"x":12,"y":11,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum by (namespace) (kube_job_status_failed{namespace=~\"velero|factory-platform\"})","legendFormat":"{{namespace}} failed"},{"refId":"B","expr":"sum by (namespace) (kube_job_status_succeeded{namespace=~\"velero|factory-platform\"})","legendFormat":"{{namespace}} succeeded"}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","min":0}},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}}},
        {"id":7,"type":"timeseries","title":"CNPG workload memory","gridPos":{"x":0,"y":19,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum by (namespace) (container_memory_working_set_bytes{namespace=~\"cnpg-system|factory-platform\",container!=\"\",container!=\"POD\"})","legendFormat":"{{namespace}}"}],"fieldConfig":{"defaults":{"unit":"bytes","noValue":"No data","min":0}},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull"]}}},
        {"id":8,"type":"text","title":"Data coverage","gridPos":{"x":12,"y":19,"w":12,"h":8},"options":{"mode":"markdown","content":"**Known:** PVC capacity, Longhorn-backed PV count, CNPG/factory workload resources and Kubernetes backup-job outcomes.\n\n**Not currently scraped:** ZFS pool health/WAL, Longhorn volume latency, Velero/Kopia object-store transfer and retention counters. Those require exporter/controller metrics in the owning infrastructure repositories; this dashboard does not infer them from unrelated disk counters."}}
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-cluster-workloads-dashboard
  namespace: monitoring
  annotations:
    grafana_folder: "20 — Kubernetes"
  labels:
    grafana_dashboard: "1"
data:
  cluster-workloads.json: |
    {
      "uid":"cluster-workloads","title":"Cluster & Workloads","description":"Talos/Kubernetes health, saturation, restarts, OOM and GitOps workload state.","tags":["kubernetes","platform","advanced"],"timezone":"browser","schemaVersion":39,"version":1,"refresh":"1m","time":{"from":"now-6h","to":"now"},"editable":false,
      "links":[{"title":"Platform Overview","type":"link","url":"/d/homeops-operations","targetBlank":false},{"title":"Networking","type":"link","url":"/d/networking","targetBlank":false},{"title":"Storage & Backups","type":"link","url":"/d/storage-backups","targetBlank":false},{"title":"Explore Prometheus","type":"link","url":"/explore?orgId=1","targetBlank":true}],
      "templating":{"list":[{"name":"namespace","label":"Namespace","type":"query","datasource":{"type":"prometheus","uid":"prometheus"},"query":"label_values(kube_pod_info, namespace)","refresh":1,"includeAll":true,"allValue":".*","current":{"text":"All","value":"$__all"}}]},
      "panels":[
        {"id":1,"type":"text","title":"Workload diagnosis","gridPos":{"x":0,"y":0,"w":24,"h":3},"options":{"mode":"markdown","content":"Use saturation, restarts and OOM together. A pending or unscheduled workload is not equivalent to a failed process. Argo state is included to connect desired state to runtime evidence."}},
        {"id":2,"type":"stat","title":"Ready nodes","gridPos":{"x":0,"y":3,"w":4,"h":5},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})","instant":true}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","min":0}},"options":{"reduceOptions":{"calcs":["lastNotNull"]},"colorMode":"value","graphMode":"none"}},
        {"id":3,"type":"stat","title":"Pods not running","gridPos":{"x":4,"y":3,"w":4,"h":5},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum(kube_pod_status_phase{phase=~\"Pending|Failed\",namespace=~\"$namespace\"}) or vector(0)","instant":true}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","min":0}},"options":{"reduceOptions":{"calcs":["lastNotNull"]},"colorMode":"value","graphMode":"none"}},
        {"id":4,"type":"timeseries","title":"CPU saturation by namespace","gridPos":{"x":8,"y":3,"w":8,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum by (namespace) (rate(container_cpu_usage_seconds_total{container!=\"\",container!=\"POD\",image!=\"\",namespace=~\"$namespace\"}[5m]))","legendFormat":"{{namespace}} usage"}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","min":0}},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}}},
        {"id":5,"type":"timeseries","title":"Working-set memory by namespace","gridPos":{"x":16,"y":3,"w":8,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum by (namespace) (container_memory_working_set_bytes{container!=\"\",container!=\"POD\",image!=\"\",namespace=~\"$namespace\"})","legendFormat":"{{namespace}}"}],"fieldConfig":{"defaults":{"unit":"bytes","noValue":"No data","min":0}},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}}},
        {"id":6,"type":"timeseries","title":"Container restarts (1h)","gridPos":{"x":0,"y":11,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"topk(15,sum by (namespace,pod) (increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[1h])))","legendFormat":"{{namespace}}/{{pod}}"}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","min":0}},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}}},
        {"id":7,"type":"timeseries","title":"OOMKilled containers","gridPos":{"x":12,"y":11,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum by (namespace,pod) (kube_pod_container_status_last_terminated_reason{reason=\"OOMKilled\",namespace=~\"$namespace\"})","legendFormat":"{{namespace}}/{{pod}}"}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","min":0}},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}}},
        {"id":8,"type":"timeseries","title":"Top workloads by CPU","gridPos":{"x":0,"y":19,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"topk(15,sum by (namespace,pod) (rate(container_cpu_usage_seconds_total{container!=\"\",container!=\"POD\",image!=\"\",namespace=~\"$namespace\"}[5m])))","legendFormat":"{{namespace}}/{{pod}}"}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","min":0}},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}}},
        {"id":9,"type":"timeseries","title":"Argo applications not healthy","gridPos":{"x":12,"y":19,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum by (health_status) (argocd_app_info{health_status!=\"Healthy\"})","legendFormat":"{{health_status}}"}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","min":0}},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull"]}}}
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-networking-dashboard
  namespace: monitoring
  annotations:
    grafana_folder: "20 — Kubernetes"
  labels:
    grafana_dashboard: "1"
data:
  networking.json: |
    {
      "uid":"networking","title":"Networking","description":"Cilium datapath, drops, DNS and route-facing probe evidence.","tags":["network","kubernetes","security"],"timezone":"browser","schemaVersion":39,"version":1,"refresh":"1m","time":{"from":"now-3h","to":"now"},"editable":false,
      "links":[{"title":"Platform Overview","type":"link","url":"/d/homeops-operations","targetBlank":false},{"title":"Cluster & Workloads","type":"link","url":"/d/cluster-workloads","targetBlank":false},{"title":"Explore Prometheus","type":"link","url":"/explore?orgId=1","targetBlank":true}],
      "panels":[
        {"id":1,"type":"text","title":"Network evidence","gridPos":{"x":0,"y":0,"w":24,"h":3},"options":{"mode":"markdown","content":"Cilium is the kube-proxy replacement. Drops and forwarding are shown from Cilium counters; DNS is shown from CoreDNS. Gateway API and Cloudflare reachability are represented by the existing blackbox/user-ready probes because no separate Gateway/Cloudflare metric family is currently scraped."}},
        {"id":2,"type":"stat","title":"Cilium agent up","gridPos":{"x":0,"y":3,"w":6,"h":5},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum(up{job=\"cilium-agent\"})","instant":true}],"fieldConfig":{"defaults":{"unit":"short","noValue":"No data","min":0}},"options":{"reduceOptions":{"calcs":["lastNotNull"]},"colorMode":"value","graphMode":"none"}},
        {"id":3,"type":"timeseries","title":"Cilium datapath drops","gridPos":{"x":6,"y":3,"w":18,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum by (reason) (rate(cilium_drop_count_total[5m]))","legendFormat":"{{reason}}"}],"fieldConfig":{"defaults":{"unit":"ops","noValue":"No data","min":0}},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}}},
        {"id":4,"type":"timeseries","title":"Cilium forwarding rate","gridPos":{"x":0,"y":11,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"refId":"A","expr":"sum(rate(cilium_forward_count_total[5m]))","legendFormat":"forwarded packets"},{"refId":"B","expr":"sum(rate(cilium_forward_bytes_total[5m]))","legendFormat":"forwarded bytes"}],"fieldConfig":{"defaults":{"unit":"ops","noValue":"No data","min":0}},"options":{"legend":{"displayMode":"table","placement":"bottom","calcs":["lastNotNull","max"]}}},
