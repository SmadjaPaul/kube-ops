apiVersion: v1
kind: ConfigMap
metadata:
  name: factory-data-platform-v2-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  factory-data-platform-v2.json: |
    {
      "id": null,
      "uid": "factory-data-platform-v2",
      "title": "Data Platform V2",
      "tags": ["factory", "dbt", "duckdb", "quality", "otel"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "editable": false,
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "Interpretation",
          "gridPos": {"x": 0, "y": 0, "w": 24, "h": 3},
          "options": {
            "mode": "markdown",
            "content": "**Data Platform V2:** dbt v2/Fusion transforms from a read-only PostgreSQL source into ephemeral DuckDB and publishes validated marts transactionally. `No data` is unknown, not success. Quality outcomes are bounded fixed labels; trace search is available in Tempo."
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Latest dbt job completion",
          "gridPos": {"x": 0, "y": 3, "w": 6, "h": 5},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "max(kube_job_status_completion_time{namespace=\"factory-platform\",job_name=~\"factory-platform-dbt.*\"})", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "dateTimeAsIso", "noValue": "No data"}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "none"}
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "dbt transformation duration",
          "gridPos": {"x": 6, "y": 3, "w": 9, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "kube_job_status_completion_time{namespace=\"factory-platform\",job_name=~\"factory-platform-dbt.*\"} - kube_job_status_start_time{namespace=\"factory-platform\",job_name=~\"factory-platform-dbt.*\"}", "legendFormat": "{{job_name}}"}],
          "fieldConfig": {"defaults": {"unit": "s", "noValue": "No data"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}}
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Source freshness",
          "gridPos": {"x": 15, "y": 3, "w": 9, "h": 5},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "factory_dbt_source_freshness_seconds", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "s", "noValue": "No data"}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "none"}
        },
        {
          "id": 5,
          "type": "bargauge",
          "title": "Latest dbt test outcomes",
          "gridPos": {"x": 0, "y": 11, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "factory_dbt_tests", "instant": true, "legendFormat": "{{outcome}}"}],
          "fieldConfig": {"defaults": {"unit": "short", "noValue": "No data"}, "overrides": []},
          "options": {"orientation": "horizontal", "displayMode": "gradient", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "dbt job failures / publication gate",
          "gridPos": {"x": 12, "y": 11, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(kube_job_status_failed{namespace=\"factory-platform\",job_name=~\"factory-platform-dbt.*\"})", "legendFormat": "failed dbt jobs"}],
          "fieldConfig": {"defaults": {"unit": "short", "min": 0, "noValue": "No data"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}}
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Factory API/dbt CPU",
          "gridPos": {"x": 0, "y": 19, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum by (container) (rate(container_cpu_usage_seconds_total{namespace=\"factory-platform\",container=~\"api|dbt\"}[5m]))", "legendFormat": "{{container}}"}],
          "fieldConfig": {"defaults": {"unit": "short", "min": 0, "noValue": "No data"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}}
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Factory API/dbt memory",
          "gridPos": {"x": 12, "y": 19, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum by (container) (container_memory_working_set_bytes{namespace=\"factory-platform\",container=~\"api|dbt\"})", "legendFormat": "{{container}}"}],
          "fieldConfig": {"defaults": {"unit": "bytes", "min": 0, "noValue": "No data"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"]}}
        },
        {
          "id": 9,
          "type": "text",
          "title": "Tempo trace search",
          "gridPos": {"x": 0, "y": 27, "w": 24, "h": 3},
          "options": {
            "mode": "markdown",
            "content": "[Open Grafana Explore and select Tempo](/explore?orgId=1&left=%7B%22datasource%22:%22tempo%22,%22queries%22:%5B%7B%22refId%22:%22A%22%7D%5D%7D) to search Factory API and dbt traces. Native Fusion node spans require a completed dbt run with OTLP export; wrapper spans alone are not acceptance evidence."
          }
        }
      ]
    }
