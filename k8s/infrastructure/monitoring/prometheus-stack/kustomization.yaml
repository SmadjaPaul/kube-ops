apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - alertmanager-http-route.yaml
  - grafana-http-route.yaml
  - grafana-oauth-secret.yaml
  - prometheus-http-route.yaml
  - grafana-catalog.yaml
  - grafana-resource-efficiency.yaml
  - nvme-endurance-rules.yaml

patches:
  - path: kube-apiserver-cardinality-patch.json
    target:
      group: monitoring.coreos.com
      version: v1
      kind: ServiceMonitor
      name: kube-prometheus-stack-apiserver
  # PLT-212 lot 1: appended to the chart's cAdvisor relabelings (values would
  # replace the chart defaults). The test ops fail the build if the chart
  # reorders endpoints instead of silently patching the wrong one.
  - path: kubelet-cardinality-patch.json
    target:
      group: monitoring.coreos.com
      version: v1
      kind: ServiceMonitor
      name: kube-prometheus-stack-kubelet

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 88.3.0 # renovate: datasource=helm depName=prometheus-community/kube-prometheus-stack
    releaseName: kube-prometheus-stack
    namespace: monitoring
    valuesFile: values.yaml
    includeCRDs: true
