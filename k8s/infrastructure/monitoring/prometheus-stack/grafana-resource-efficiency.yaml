apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-resource-efficiency-dashboard
  namespace: monitoring
  annotations:
    grafana_folder: "20 — Kubernetes"
  labels:
    grafana_dashboard: "1"
data:
  resource-efficiency.json: |
    {
      "uid": "cluster-resource-efficiency",
      "title": "Cluster Resource Efficiency",
      "description": "Scheduler requests versus actual CPU and RAM with 24h P95 candidates, throttling and restarts. Read-only observability for PLT-53.",
      "tags": [
        "kubernetes",
        "capacity",
        "rightsizing"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "editable": false,
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(kube_pod_info, namespace)",
            "refresh": 1,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "Scope and interpretation",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 3
          },
          "options": {
            "mode": "markdown",
            "content": "**GitOps requests ≠ current node consumption.** CPU requests are scheduler commitments; CPU limits throttle; memory limits can OOM. Panels use kube-state-metrics and cAdvisor. Namespace/pod sums exclude some Pod overhead/init/effective-request and system allocations; compare against `kubectl describe node`. The top gap table is a **candidate list**, not proof of safe reduction. No data means unknown. P95 is over the trailing 24h of 5-minute CPU rates sampled every 10m, not a 7–30d sizing decision."
          }
        },
        {
          "id": 2,
          "title": "CPU allocatable (cores)",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 3,
            "w": 4,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_node_status_allocatable{resource=\"cpu\",unit=\"core\"})",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 3,
          "title": "Container CPU requests (cores)",
          "type": "stat",
          "gridPos": {
            "x": 4,
            "y": 3,
            "w": 4,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_container_resource_requests{resource=\"cpu\",unit=\"core\",namespace=~\"$namespace\"})",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 4,
          "title": "CPU used now (cores)",
          "type": "stat",
          "gridPos": {
            "x": 8,
            "y": 3,
            "w": 4,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"\",container!=\"POD\",image!=\"\",namespace=~\"$namespace\"}[5m]))",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 5,
          "title": "Container memory requests",
          "type": "stat",
          "gridPos": {
            "x": 12,
            "y": 3,
            "w": 4,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_container_resource_requests{resource=\"memory\",unit=\"byte\",namespace=~\"$namespace\"})",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "noValue": "No data",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 6,
          "title": "Memory working set now",
          "type": "stat",
          "gridPos": {
            "x": 16,
            "y": 3,
            "w": 4,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(container_memory_working_set_bytes{container!=\"\",container!=\"POD\",image!=\"\",namespace=~\"$namespace\"})",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "noValue": "No data",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 7,
          "title": "Unschedulable pods",
          "type": "stat",
          "gridPos": {
            "x": 20,
            "y": 3,
            "w": 4,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_unschedulable{namespace=~\"$namespace\"})",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 8,
          "title": "CPU requested by namespace (cores)",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(20,sum by(namespace)(kube_pod_container_resource_requests{resource=\"cpu\",unit=\"core\",namespace=~\"$namespace\"}))",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            }
          }
        },
        {
          "id": 9,
          "title": "CPU actually used by namespace (cores)",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(20,sum by(namespace)(rate(container_cpu_usage_seconds_total{container!=\"\",container!=\"POD\",image!=\"\",namespace=~\"$namespace\"}[5m])))",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            }
          }
        },
        {
          "id": 10,
          "title": "Top 20 CPU request minus CPU P95 (24h) candidates",
          "type": "table",
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 24,
            "h": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(20, clamp_min(kube_pod_container_resource_requests{resource=\"cpu\",unit=\"core\",namespace=~\"$namespace\"} - on(namespace,pod,container) max by(namespace,pod,container) (quantile_over_time(0.95, rate(container_cpu_usage_seconds_total{container!=\"\",container!=\"POD\",image!=\"\",namespace=~\"$namespace\"}[5m])[24h:10m])), 0))",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "showHeader": true
          }
        },
        {
          "id": 11,
          "title": "Memory requested by namespace",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 25,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(20,sum by(namespace)(kube_pod_container_resource_requests{resource=\"memory\",unit=\"byte\",namespace=~\"$namespace\"}))",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "noValue": "No data",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            }
          }
        },
        {
          "id": 12,
          "title": "Memory working set by namespace",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 25,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(20,sum by(namespace)(container_memory_working_set_bytes{container!=\"\",container!=\"POD\",image!=\"\",namespace=~\"$namespace\"}))",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "noValue": "No data",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            }
          }
        },
        {
          "id": 13,
          "title": "CPU CFS throttled periods ratio by namespace",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 33,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(namespace)(rate(container_cpu_cfs_throttled_periods_total{container!=\"\",container!=\"POD\",namespace=~\"$namespace\"}[5m])) / clamp_min(sum by(namespace)(rate(container_cpu_cfs_periods_total{container!=\"\",container!=\"POD\",namespace=~\"$namespace\"}[5m])),0.000001)",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "noValue": "No data",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            }
          }
        },
        {
          "id": 14,
          "title": "Container restarts over 24h",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 33,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(20,sum by(namespace,pod,container)(increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[24h])))",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            }
          }
        }
      ]
    }
