# PLT-263: Alertmanager receiver URLs, mounted as files under
# /etc/alertmanager/secrets/<secret>/url (alertmanagerSpec.secrets). Both
# values are written to Doppler cluster/prd by OpenTofu (homelab-infra,
# terraform/grafana-cloud); no value is in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-healthchecks-ping
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: alertmanager-healthchecks-ping
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: HEALTHCHECKS_WATCHDOG_PING_URL
---
# Full ntfy.sh publish URL with the secret topic (same topic as the Grafana
# Cloud contact point). ntfy.sh is outside the homelab by design.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-ntfy-url
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: alertmanager-ntfy-url
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: ALERTMANAGER_NTFY_URL
