# PLT-417: control-plane scrape on Talos. etcd is not a pod, so its endpoint is
# the node IP (listen-metrics-urls in homelab-infra terraform/proxmox/modules/
# talos, plain HTTP 2381 on the node IP). The scheduler and controller-manager
# are static pods (hostNetwork): their bind-address is opened by the same Talos
# patch (default 127.0.0.1 gave `up == 0`) and they serve self-signed TLS.
# Until that patch is applied the three targets stay down (KubeSchedulerDown
# etc. already fire for the two static pods today).
#
# etcd is scraped by the static `kube-etcd` job in additionalScrapeConfigs, not
# by the chart's Service + static Endpoints: Argo CD excludes Endpoints and
# EndpointSlice (argocd-cm resource.exclusions), so the chart's Endpoints object
# was never applied and the target list stayed empty for 54 days. enabled stays
# true so the chart's etcd PrometheusRule keeps rendering.
kubeEtcd:
  enabled: true
  service:
    enabled: false
  serviceMonitor:
    enabled: false
kubeScheduler:
  serviceMonitor:
    https: true
    insecureSkipVerify: true
    interval: 30s
    # Revue 2026-11-23: no rule, alert or dashboard reads these families
    # (~1.4k series). Scheduler latency SLIs and pending pods stay scraped.
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: "scheduler_plugin_execution_duration_seconds_bucket|workqueue_(work|queue)_duration_seconds_bucket|kubernetes_feature_enabled"
      # Revue séries 2026-11-23 (lot 2): REST client and informer internals,
      # per-plugin scheduler histograms; no rule, alert or dashboard reads them.
      - action: drop
        sourceLabels: [__name__]
        regex: "rest_client_(rate_limiter_duration|request_duration|request_size|response_size)_.*|informer_(processing_latency_seconds_.*|queued_items)|workqueue_(adds_total|longest_running_processor_seconds|unfinished_work_seconds|retries_total|queue_duration_seconds_.*|work_duration_seconds_.*)|scheduler_(event_handling_duration_seconds_bucket|framework_extension_point_duration_seconds_bucket|plugin_evaluation_total|plugin_execution_duration_seconds_.*|get_node_hint_duration_seconds_bucket|store_schedule_results_duration_seconds_bucket)|authentication_(duration_seconds|token_cache_request_duration_seconds)_.*|authorization_duration_seconds_.*|apiserver_storage_data_key_generation_duration_seconds_bucket|job_controller_job_sync_duration_seconds_.*|go_(gc_heap_.*|sched_.*|gc_pauses_seconds_bucket)"
kubeControllerManager:
  serviceMonitor:
    https: true
    insecureSkipVerify: true
    interval: 30s
    # Revue 2026-11-23: no rule, alert or dashboard reads these families
    # (~2.1k series). workqueue_depth and leader election stay scraped.
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: "informer_processing_latency_seconds_bucket|workqueue_(work|queue)_duration_seconds_bucket|kubernetes_feature_enabled"
      # Revue séries 2026-11-23 (lot 2): see kubeScheduler.
      - action: drop
        sourceLabels: [__name__]
        regex: "rest_client_(rate_limiter_duration|request_duration|request_size|response_size)_.*|informer_(processing_latency_seconds_.*|queued_items)|workqueue_(adds_total|longest_running_processor_seconds|unfinished_work_seconds|retries_total|queue_duration_seconds_.*|work_duration_seconds_.*)|scheduler_(event_handling_duration_seconds_bucket|framework_extension_point_duration_seconds_bucket|plugin_evaluation_total|plugin_execution_duration_seconds_.*|get_node_hint_duration_seconds_bucket|store_schedule_results_duration_seconds_bucket)|authentication_(duration_seconds|token_cache_request_duration_seconds)_.*|authorization_duration_seconds_.*|apiserver_storage_data_key_generation_duration_seconds_bucket|job_controller_job_sync_duration_seconds_.*|go_(gc_heap_.*|sched_.*|gc_pauses_seconds_bucket)"

# Talos disables kube-proxy; Cilium implements kubeProxyReplacement=true.
# Do not create dead kube-proxy targets or alert KubeProxyDown for a component
# intentionally absent from this cluster. Network/Cilium alerts remain active.
kubeProxy:
  enabled: false

# The chart's availability group evaluates 30-day recording rules while this
# homelab retains 10 days. No repository or live dashboard/rule consumer was
# found for these recordings.
# PLT-187 (2026-11-12): the burn-rate group re-reads 1d/3d windows of ~8k
# apiserver SLI histogram series every 30s. Since 2026-11-11 ~18Z it took
# 30-37s per 30s cycle (missed iterations), with the Go heap pinned at the
# 1Gi limit: ~370 major page faults/s, ~500 MB/s continuous reads on the
# Longhorn Prometheus PVC and instance-manager CPU 0.26 -> 2.4 cores. No
# repository dashboard/rule consumes apiserver_request:burnrate*, and the SLO
# alerts (KubeAPIErrorBudgetBurn) only read those recordings while Alertmanager
# has no receiver. Raw apiserver metrics stay scraped.
# PLT-208 (2026-11-13): #1256 validated at runtime (instance-manager night CPU
# 0.32-0.42 cores, PVC reads 365 -> 0 MB/s). Prometheus memory is raised
# (limit 1Gi -> 2Gi; working set peaked at 1007 MiB pinned at the old limit,
# now ~780 MiB) and ONLY the burn-rate group is re-enabled. Availability and
# SLO groups stay off (30d windows vs 10d retention, no consumer). Rollback
# criteria: rule evaluation > 30s, working set > 1.6Gi or PVC reads > 50 MB/s
# -> set kubeApiserverBurnrate back to false.
defaultRules:
  # PLT-470: KubeQuotaFullyUsed is replaced by quota-rules.yaml (same expression,
  # arc-runners* excluded: a runner quota at 100% is the concurrency bound working).
  disabled:
    KubeQuotaFullyUsed: true
  rules:
    # Revue alertes 2026-11-23: info-only, 22 firing samples in 7 days, limits are
    # deliberately tight on the single node. Throttling stays visible in dashboards.
    cpuThrottlingHigh: false
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: true
    kubeApiserverSlos: false
    # Revue séries 2026-11-23: recording rules with no reader in any rule,
    # alert or dashboard (~1.9k series). Raw cAdvisor/apiserver metrics stay.
    # The histogram_quantile rules need every `le`; the burn-rate rules only
    # read le=1|5|30, so the other buckets are dropped at scrape.
    kubeApiserverHistogram: false
    k8sContainerCpuUsageSecondsTotal: false
    k8sContainerMemoryCache: false
    k8sContainerMemoryRss: false
    k8sContainerMemorySwap: false
    k8sContainerMemoryWorkingSetBytes: false

# Edge/single-node budget: apiserver exposes ~68k series and accounts for
# ~2,274 accepted samples/s at the observed 30s scrape cadence (Phase 2).
# Scrape every 60s to lower ingestion and API metrics serialization load while
# retaining every metric, label and the chart's default histogram relabelings.
# This is a reversible A/B candidate: validate alert windows and query fidelity
# before merging; it does NOT reduce TSDB series cardinality by itself.
kubeApiServer:
  serviceMonitor:
    interval: 60s

# Trial: slower scrape for Grafana's own /metrics only (not UI or dashboards).
# Expect fewer monitoring samples; verify grafana alert inputs before merge.
grafana:
  # Chart 13 (kps 89+) rend un Pod de test Helm (bats) ; Argo ne joue pas les
  # hooks de test, on ne le rend donc pas.
  testFramework:
    enabled: false
  serviceMonitor:
    interval: 60s
    # PLT-212 lot 1: no dashboard, rule or alert reads Grafana's own histograms
    # (~3.7k series). Counters/gauges, go_* and process_* stay scraped.
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: "grafana_.*_bucket|grafana_feature_toggles_info|grafana_(access_.*|index_server_.*|apiserver_.*|live_.*|http_.*|storage_server_.*)"
  # The chart's full default catalogue is not the operational interface. The
  # curated ConfigMaps in grafana-catalog.yaml retain the useful signals while
  # keeping upstream metrics, rules and alerting untouched.
  defaultDashboardsEnabled: false
  sidecar:
    dashboards:
      # The Grafana catalogue is owned by this namespace. Restricting the
      # sidecar avoids importing unrelated dashboard ConfigMaps into Grafana.
      searchNamespace: monitoring
      # WATCH can miss a DELETE during an Argo prune/reconcile transition.
      # SLEEP performs a full list every 60s and removes files absent from the
      # current ConfigMap set, making catalogue retirement reproducible.
      watchMethod: SLEEP
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  # PLT-344 L7: without an existing Secret the Grafana subchart renders a new
  # random admin password at every Argo render, so checksum/secret changed and
  # the Deployment rolled out ~73 times a day (~18 GB/day written). The password
  # now lives in a stable Secret created once by External Secrets (no value in
  # Git); sign-in stays on Authentik OIDC.
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  # OIDC Configuration for Authentik
  persistence: {}
  grafana.ini:
    server:
      domain: grafana.smadja.dev
      root_url: https://grafana.smadja.dev/
    auth.generic_oauth:
      enabled: true
      name: Authentik
      client_id: $__env{GRAFANA_OAUTH_CLIENT_ID}
      client_secret: $__env{GRAFANA_OAUTH_CLIENT_SECRET}
      scopes: openid profile email
      auth_url: https://auth.smadja.dev/application/o/authorize/
      token_url: https://auth.smadja.dev/application/o/token/
      api_url: https://auth.smadja.dev/application/o/userinfo/
      login_attribute_path: preferred_username
      groups_attribute_path: groups
      name_attribute_path: name
      email_attribute_path: email
      role_attribute_path: contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Users') && 'Editor' || 'Viewer'
      allow_sign_up: true
      auto_login: false
      use_pkce: true

  # Environment variables from ExternalSecret
  envFromSecrets:
    - name: grafana-oauth-credentials
      optional: false

  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      isDefault: false
      editable: false
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3200
      isDefault: false
      editable: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Trial: kube-state-metrics' state is event-updated; Prometheus need not scrape
# 21k object-state samples every 30s on a single-node homelab.
# Change only the metrics endpoint; retain all metric families and labels.
# Test short-window readiness/phase alerts before merge, then measure at 45s.
kube-state-metrics:
  prometheus:
    monitor:
      http:
        interval: 45s
      # PLT-470: ephemeral ARC runner pods (one per job) and their per-pod
      # series churn ~5k series per 2 h in the head. No rule reads them;
      # runner concurrency is read from kube_resourcequota and gha_* (Alloy).
      metricRelabelings:
        - action: drop
          sourceLabels: [__name__, namespace]
          separator: ";"
          regex: "kube_pod_.*;arc-runners.*"
  # PLT-212 lot 1: families with no consumer in live rules or in the repo
  # (rules, dashboards, scripts). kube_replicaset_owner, kube_pod_status_*
  # used by alerts and kube_pod_container_status_* stay exported.
  metricDenylist:
    - kube_pod_status_scheduled
    - kube_pod_status_scheduled_time
    - kube_pod_status_qos_class
    - kube_pod_tolerations
    - kube_pod_service_account
    - kube_pod_scheduler
    - kube_pod_restart_policy
    - kube_pod_created
    - kube_replicaset_created
    - kube_replicaset_metadata_generation
    - kube_replicaset_spec_replicas
    - kube_replicaset_status_fully_labeled_replicas
    - kube_replicaset_status_observed_generation
    - kube_replicaset_status_ready_replicas
    - kube_replicaset_status_replicas
    - kube_replicaset_status_terminating_replicas
    # Revue séries 2026-11-23 (lot 2): ~9.5k series with no reader (kube_secret_*
    # also exposes Secret metadata). Alerts keep kube_pod_status_*,
    # kube_pod_container_status_{ready,restarts_total,waiting_reason,
    # last_terminated_reason}, kube_job_status_*, kube_deployment_status_*.
    # The regex is matched unanchored by kube-state-metrics: without the final
    # `$`, `pod_container_status_waiting` also dropped `..._waiting_reason`
    # (KubePodCrashLooping, KubeContainerWaiting) and `deployment_status_replicas`
    # dropped `_available`/`_updated` (KubeDeploymentReplicasMismatch). PLT-470.
    - "kube_(secret_.*|configmap_(info|created|metadata_resource_version)|endpointslice_(ports|info|created|endpoints)|service_(info|created|spec_type)|pod_(ips|start_time|status_initialized_time|status_ready_time|status_container_ready_time|completion_time|container_state_started|init_container_(info|status_.*|state_started|resource_.*)|spec_volumes_persistentvolumeclaims_readonly|status_disruption_reason)|pod_container_status_(running|terminated|waiting)|namespace_(created|status_phase)|deployment_(created|owner|spec_paused|status_replicas|status_replicas_ready|status_terminating_replicas|spec_strategy_.*)|persistentvolume_(claim_ref|capacity_bytes|created|volume_mode|access_mode)|persistentvolumeclaim_created|volumeattachment_.*|validatingwebhookconfiguration_webhook_clientconfig_service|lease_(owner|renew_time)|poddisruptionbudget_(created|status_pod_disruptions_allowed|status_observed_generation)|job_(complete|info|created|spec_parallelism|spec_completions|status_ready))$"

kubeStateMetrics:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

kubelet:
  serviceMonitor:
    # cAdvisor is the largest accepted scrape source (~1,396 samples/s).
    # 30s preserves the existing metric families and 5m rule/dashboard
    # windows while halving cAdvisor's scrape frequency.
    # PR revue 2026-11-23: 60s. Every rate() on kubelet/cAdvisor families in
    # the repo uses a window >= 5m (chart rules included), so 60s is safe.
    interval: 60s
    cAdvisorInterval: 60s
    # Revue séries 2026-11-23: unread kubelet /metrics histograms (~2k series).
    # Replaces the chart default (csi/storage bucket trimming), now subsumed.
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: "kubelet_(runtime_operations_duration_seconds_.*|http_requests_duration_seconds_.*|image_pull_duration_seconds_.*|cgroup_manager_duration_seconds_.*|pod_start_.*duration_seconds_bucket|volume_metric_collection_duration_seconds_.*|pleg_pod_relist_duration_seconds_bucket|evented_pleg_.*|pod_status_sync_duration_seconds_bucket|pod_worker_start_duration_seconds_bucket|run_podsandbox_duration_seconds_bucket|topology_manager_.*|certificate_manager_server_rotation_seconds_bucket|containers_per_pod_count_bucket)|storage_operation_duration_seconds_.*|volume_operation_total_seconds_.*|csi_operations_seconds_.*|dra_operations_duration_seconds_.*|authentication_token_cache_request_duration_seconds_.*|apiserver_delegated_auth[nz]_request_duration_seconds_.*|apiserver_storage_data_key_generation_duration_seconds_.*|rest_client_(rate_limiter_duration|request_duration|request_size|response_size|exec_plugin_certificate_rotation_age)_.*|workqueue_(queue|work)_duration_seconds_(bucket)|kubernetes_feature_enabled|go_(gc_heap_.*|sched_.*|gc_pauses_seconds_bucket)"
    # PLT-212 lot 1: kubelet probe latency histograms (~3.5k series) have no
    # consumer. prober_probe_total (probe failures) stays scraped. The cAdvisor
    # drops live in kubelet-cardinality-patch.json (chart defaults preserved).
    probesMetricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: "prober_probe_duration_seconds_bucket"

prometheusOperator:
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheus:
  serviceMonitor:
    # Revue séries 2026-11-23: Prometheus self-metrics nobody reads (~1.1k).
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: "prometheus_target_sync_length_.*|net_conntrack_dialer_.*|prometheus_http_(request_duration_seconds_bucket|response_size_bytes_bucket)"
  prometheusSpec:
    replicas: 1
    # Persistence sizing evidence (2026-10-21): Prometheus ingests about
    # 4,671 samples/s and had about 371 MB of persisted blocks, 223 MiB of WAL
    # and 59 MB of head chunks after 11.2 h. A 10-day projection is about 8 GB
    # of blocks before WAL/head and compaction headroom. Longhorn-fast had about
    # 464 GiB available at capture time. 20Gi leaves operational headroom while
    # retentionSize=14GB bounds TSDB growth below the PVC capacity; re-evaluate
    # after a full week of persisted history.
    # Migration done: the live TSDB is on PVC prometheus-...-db-...-0
    # (longhorn-fast, 20Gi, Bound since 2026-10-22, verified 2026-11-14), so a
    # pod replacement keeps the history.
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-fast
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
    retention: 10d
    retentionSize: 14GB
    # HOST EXPORTER PRECONDITION: Proxmox 10.0.20.51 must run the upstream
    # node_exporter on a private LAN endpoint, firewall-restricted to the
    # Talos monitoring traffic. No exporter is installed by this repo change.
    # Never expose unauthenticated node_exporter through Cloudflare.
    # Default collectors read kernel counters/hwmon; NVMe health comes from the
    # host textfile collector (nvme_*, read-only smart-log, PLT-216); no smartctl.
    additionalScrapeConfigs:
      # PLT-417: etcd metrics (plain HTTP, listen-metrics-urls on the node IP).
      # job_name must stay `kube-etcd`: the Alloy federate allowlist and the
      # control-plane alerts select job="kube-etcd".
      - job_name: kube-etcd
        scrape_interval: 30s
        metrics_path: /metrics
        static_configs:
          - targets: ["10.0.20.60:2381"]
            labels:
              node: homeops-01
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: "etcd_.*|process_(resident_memory_bytes|cpu_seconds_total|open_fds)"
            action: keep
      - job_name: proxmox-host
        scrape_interval: 30s
        metrics_path: /metrics
        static_configs:
          - targets: ["10.0.20.51:9100"]
            labels:
              origin: proxmox
              host: tatouine
        # Revue 2026-11-23: node_systemd_unit_state exports 5 states per unit
        # (985 series). Only state="failed" is read (NodeSystemdServiceFailed
        # pattern); the other states are dropped (~790 series).
        metric_relabel_configs:
          - source_labels: [__name__, state]
            regex: "node_systemd_unit_state;(activating|active|deactivating|inactive)"
            action: drop
          # Revue séries 2026-11-23: same unread disk families as in-cluster
          # node-exporter (~400 series). ZFS dataset counters stay (PLT-417).
          - source_labels: [__name__]
            regex: "node_(nfs_requests_total|disk_(discard_time_seconds_total|discarded_sectors_total|discards_completed_total|discards_merged_total|flush_requests_time_seconds_total|flush_requests_total|io_now|reads_merged_total|writes_merged_total|filesystem_info))"
            action: drop
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            prometheus: k8s
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

alertmanager:
  serviceMonitor:
    # Revue séries 2026-11-23: notification latency histograms and Go runtime
    # buckets (~360 series); notifications_total/failed_total stay.
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: "alertmanager_(notification_latency_seconds_.*|http_request_duration_seconds_bucket|http_response_size_bytes_bucket|nflog_query_duration_seconds_bucket|silences_query_duration_seconds_bucket)|go_(gc_heap_.*|sched_.*|gc_pauses_seconds_bucket)"
  # PLT-263: dead-man switch and critical notifications. The two receiver URLs
  # are secrets (Healthchecks ping UUID, ntfy topic): they live only in Doppler
  # cluster/prd, written by OpenTofu (homelab-infra terraform/grafana-cloud),
  # and reach Alertmanager as files through External Secrets.
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers: ['severity = critical']
        target_matchers: ['severity =~ warning|info']
        equal: [namespace, alertname]
      - source_matchers: ['severity = warning']
        target_matchers: ['severity = info']
        equal: [namespace, alertname]
      - source_matchers: ['alertname = InfoInhibitor']
        target_matchers: ['severity = info']
        equal: [namespace]
      - target_matchers: ['alertname = InfoInhibitor']
    route:
      group_by: [namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
      routes:
        # Watchdog always fires: ping Healthchecks.io every 2 minutes. When the
        # pings stop, Healthchecks notifies ntfy (7 minutes worst case).
        - receiver: healthchecks-watchdog
          matchers: ['alertname = Watchdog']
          group_by: [alertname]
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 2m
        - receiver: ntfy-critical
          matchers: ['severity = critical']
          group_by: [namespace, alertname]
    receivers:
      - name: 'null'
      - name: healthchecks-watchdog
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-healthchecks-ping/url
            send_resolved: false
            max_alerts: 1
      - name: ntfy-critical
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-ntfy-url/url
            send_resolved: true
            max_alerts: 10
    templates:
      - /etc/alertmanager/config/*.tmpl
  alertmanagerSpec:
    secrets:
      - alertmanager-healthchecks-ping
      - alertmanager-ntfy-url
    replicas: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: alertmanager
    podDisruptionBudget:
      enabled: false
      minAvailable: 1

coreDns:
  serviceMonitor:
    # Revue séries 2026-11-23: proxy/size/programming histograms unread (~180).
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: "coredns_(proxy_request_duration_seconds_.*|kubernetes_dns_programming_duration_seconds_.*|dns_request_size_bytes_.*|dns_response_size_bytes_.*|health_request_duration_seconds_bucket)"

prometheus-node-exporter:
  prometheus:
    monitor:
      # Revue séries 2026-11-23: discard/flush/merged/io_now/NFS families have
      # no reader (~500 series here). Reads/writes/io_time stay.
      metricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: "node_(nfs_requests_total|disk_(discard_time_seconds_total|discarded_sectors_total|discards_completed_total|discards_merged_total|flush_requests_time_seconds_total|flush_requests_total|io_now|reads_merged_total|writes_merged_total|filesystem_info))"
  # PLT-212 lot 1: ~150 Cilium lxc* host-side veths x ~30 node_network_*
  # families (~4k series) duplicate per-pod cAdvisor network metrics. Physical
  # (eth0), cilium_* and lo interfaces stay exported; the chart's *_excluding_
  # virtual recordings only ever looked at non-veth devices.
  # Helm replaces list values: the chart's two filesystem exclusions are
  # repeated here verbatim (kube-prometheus-stack 88.3.0 defaults).
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
    - --collector.netdev.device-exclude=^lxc.*$
    - --collector.netclass.ignored-devices=^lxc.*$
  tolerations:
    - key: "gpu"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
