# Talos disables kube-proxy; Cilium implements kubeProxyReplacement=true.
# Do not create dead kube-proxy targets or alert KubeProxyDown for a component
# intentionally absent from this cluster. Network/Cilium alerts remain active.
kubeProxy:
  enabled: false

# The chart's availability group evaluates 30-day recording rules while this
# homelab retains 10 days. No repository or live dashboard/rule consumer was
# found for these recordings.
# PLT-187 (2026-11-12): the burn-rate group re-reads 1d/3d windows of ~8k
# apiserver SLI histogram series every 30s. Since 2026-11-11 ~18Z it took
# 30-37s per 30s cycle (missed iterations), with the Go heap pinned at the
# 1Gi limit: ~370 major page faults/s, ~500 MB/s continuous reads on the
# Longhorn Prometheus PVC and instance-manager CPU 0.26 -> 2.4 cores. No
# repository dashboard/rule consumes apiserver_request:burnrate*, and the SLO
# alerts (KubeAPIErrorBudgetBurn) only read those recordings while Alertmanager
# has no receiver. Raw apiserver metrics stay scraped.
# PLT-208 (2026-11-13): #1256 validated at runtime (instance-manager night CPU
# 0.32-0.42 cores, PVC reads 365 -> 0 MB/s). Prometheus memory is raised
# (limit 1Gi -> 2Gi; working set peaked at 1007 MiB pinned at the old limit,
# now ~780 MiB) and ONLY the burn-rate group is re-enabled. Availability and
# SLO groups stay off (30d windows vs 10d retention, no consumer). Rollback
# criteria: rule evaluation > 30s, working set > 1.6Gi or PVC reads > 50 MB/s
# -> set kubeApiserverBurnrate back to false.
defaultRules:
  rules:
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: true
    kubeApiserverSlos: false

# Edge/single-node budget: apiserver exposes ~68k series and accounts for
# ~2,274 accepted samples/s at the observed 30s scrape cadence (Phase 2).
# Scrape every 60s to lower ingestion and API metrics serialization load while
# retaining every metric, label and the chart's default histogram relabelings.
# This is a reversible A/B candidate: validate alert windows and query fidelity
# before merging; it does NOT reduce TSDB series cardinality by itself.
kubeApiServer:
  serviceMonitor:
    interval: 60s

# Trial: slower scrape for Grafana's own /metrics only (not UI or dashboards).
# Expect fewer monitoring samples; verify grafana alert inputs before merge.
grafana:
  serviceMonitor:
    interval: 60s
    # PLT-212 lot 1: no dashboard, rule or alert reads Grafana's own histograms
    # (~3.7k series). Counters/gauges, go_* and process_* stay scraped.
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: "grafana_.*_bucket|grafana_feature_toggles_info"
  # The chart's full default catalogue is not the operational interface. The
  # curated ConfigMaps in grafana-catalog.yaml retain the useful signals while
  # keeping upstream metrics, rules and alerting untouched.
  defaultDashboardsEnabled: false
  sidecar:
    dashboards:
      # The Grafana catalogue is owned by this namespace. Restricting the
      # sidecar avoids importing unrelated dashboard ConfigMaps into Grafana.
      searchNamespace: monitoring
      # WATCH can miss a DELETE during an Argo prune/reconcile transition.
      # SLEEP performs a full list every 60s and removes files absent from the
      # current ConfigMap set, making catalogue retirement reproducible.
      watchMethod: SLEEP
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  # OIDC Configuration for Authentik
  persistence: {}
  grafana.ini:
    server:
      domain: grafana.smadja.dev
      root_url: https://grafana.smadja.dev/
    auth.generic_oauth:
      enabled: true
      name: Authentik
      client_id: $__env{GRAFANA_OAUTH_CLIENT_ID}
      client_secret: $__env{GRAFANA_OAUTH_CLIENT_SECRET}
      scopes: openid profile email
      auth_url: https://auth.smadja.dev/application/o/authorize/
      token_url: https://auth.smadja.dev/application/o/token/
      api_url: https://auth.smadja.dev/application/o/userinfo/
      login_attribute_path: preferred_username
      groups_attribute_path: groups
      name_attribute_path: name
      email_attribute_path: email
      role_attribute_path: contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Users') && 'Editor' || 'Viewer'
      allow_sign_up: true
      auto_login: false
      use_pkce: true

  # Environment variables from ExternalSecret
  envFromSecrets:
    - name: grafana-oauth-credentials
      optional: false

  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      isDefault: false
      editable: false
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3200
      isDefault: false
      editable: false

  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Trial: kube-state-metrics' state is event-updated; Prometheus need not scrape
# 21k object-state samples every 30s on a single-node homelab.
# Change only the metrics endpoint; retain all metric families and labels.
# Test short-window readiness/phase alerts before merge, then measure at 45s.
kube-state-metrics:
  prometheus:
    monitor:
      http:
        interval: 45s
  # PLT-212 lot 1: families with no consumer in live rules or in the repo
  # (rules, dashboards, scripts). kube_replicaset_owner, kube_pod_status_*
  # used by alerts and kube_pod_container_status_* stay exported.
  metricDenylist:
    - kube_pod_status_scheduled
    - kube_pod_status_scheduled_time
    - kube_pod_status_qos_class
    - kube_pod_tolerations
    - kube_pod_service_account
    - kube_pod_scheduler
    - kube_pod_restart_policy
    - kube_pod_created
    - kube_replicaset_created
    - kube_replicaset_metadata_generation
    - kube_replicaset_spec_replicas
    - kube_replicaset_status_fully_labeled_replicas
    - kube_replicaset_status_observed_generation
    - kube_replicaset_status_ready_replicas
    - kube_replicaset_status_replicas
    - kube_replicaset_status_terminating_replicas

kubeStateMetrics:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

kubelet:
  serviceMonitor:
    # cAdvisor is the largest accepted scrape source (~1,396 samples/s).
    # 30s preserves the existing metric families and 5m rule/dashboard
    # windows while halving cAdvisor's scrape frequency.
    cAdvisorInterval: 30s
    # PLT-212 lot 1: kubelet probe latency histograms (~3.5k series) have no
    # consumer. prober_probe_total (probe failures) stays scraped. The cAdvisor
    # drops live in kubelet-cardinality-patch.json (chart defaults preserved).
    probesMetricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: "prober_probe_duration_seconds_bucket"

prometheusOperator:
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheus:
  prometheusSpec:
    replicas: 1
    # Persistence sizing evidence (2026-10-21): Prometheus ingests about
    # 4,671 samples/s and had about 371 MB of persisted blocks, 223 MiB of WAL
    # and 59 MB of head chunks after 11.2 h. A 10-day projection is about 8 GB
    # of blocks before WAL/head and compaction headroom. Longhorn-fast had about
    # 464 GiB available at capture time. 20Gi leaves operational headroom while
    # retentionSize=14GB bounds TSDB growth below the PVC capacity; re-evaluate
    # after a full week of persisted history.
    # Migration gate: the current live TSDB is emptyDir. The first StatefulSet
    # replacement will lose that ephemeral history because this PR does not
    # migrate it. Merge/reconcile requires explicit operator acceptance of that
    # history loss; no PVC or existing backup is deleted by this change.
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-fast
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
    retention: 10d
    retentionSize: 14GB
    # HOST EXPORTER PRECONDITION: Proxmox 10.0.20.51 must run the upstream
    # node_exporter on a private LAN endpoint, firewall-restricted to the
    # Talos monitoring traffic. No exporter is installed by this repo change.
    # Never expose unauthenticated node_exporter through Cloudflare.
    # Default collectors read kernel counters/hwmon; NVMe health comes from the
    # host textfile collector (nvme_*, read-only smart-log, PLT-216); no smartctl.
    additionalScrapeConfigs:
      - job_name: proxmox-host
        scrape_interval: 30s
        metrics_path: /metrics
        static_configs:
          - targets: ["10.0.20.51:9100"]
            labels:
              origin: proxmox
              host: tatouine
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            prometheus: k8s
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

alertmanager:
  alertmanagerSpec:
    replicas: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: alertmanager
    podDisruptionBudget:
      enabled: false
      minAvailable: 1

prometheus-node-exporter:
  # PLT-212 lot 1: ~150 Cilium lxc* host-side veths x ~30 node_network_*
  # families (~4k series) duplicate per-pod cAdvisor network metrics. Physical
  # (eth0), cilium_* and lo interfaces stay exported; the chart's *_excluding_
  # virtual recordings only ever looked at non-veth devices.
  # Helm replaces list values: the chart's two filesystem exclusions are
  # repeated here verbatim (kube-prometheus-stack 88.3.0 defaults).
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
    - --collector.netdev.device-exclude=^lxc.*$
    - --collector.netclass.ignored-devices=^lxc.*$
  tolerations:
    - key: "gpu"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
