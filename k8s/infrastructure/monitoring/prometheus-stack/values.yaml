# Talos disables kube-proxy; Cilium implements kubeProxyReplacement=true.
# Do not create dead kube-proxy targets or alert KubeProxyDown for a component
# intentionally absent from this cluster. Network/Cilium alerts remain active.
kubeProxy:
  enabled: false

# Edge/single-node budget: apiserver exposes ~68k series and accounts for
# ~2,274 accepted samples/s at the observed 30s scrape cadence (Phase 2).
# Scrape every 60s to lower ingestion and API metrics serialization load while
# retaining every metric, label and the chart's default histogram relabelings.
# This is a reversible A/B candidate: validate alert windows and query fidelity
# before merging; it does NOT reduce TSDB series cardinality by itself.
kubeApiServer:
  serviceMonitor:
    interval: 60s

# Trial: slower scrape for Grafana's own /metrics only (not UI or dashboards).
# Expect fewer monitoring samples; verify grafana alert inputs before merge.
grafana:
  serviceMonitor:
    interval: 60s
  # OIDC Configuration for Authentik
  persistence: {}
  grafana.ini:
    server:
      domain: grafana.smadja.dev
      root_url: https://grafana.smadja.dev/
    auth.generic_oauth:
      enabled: true
      name: Authentik
      client_id: $__env{GRAFANA_OAUTH_CLIENT_ID}
      client_secret: $__env{GRAFANA_OAUTH_CLIENT_SECRET}
      scopes: openid profile email
      auth_url: https://auth.smadja.dev/application/o/authorize/
      token_url: https://auth.smadja.dev/application/o/token/
      api_url: https://auth.smadja.dev/application/o/userinfo/
      login_attribute_path: preferred_username
      groups_attribute_path: groups
      name_attribute_path: name
      email_attribute_path: email
      role_attribute_path: contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Users') && 'Editor' || 'Viewer'
      allow_sign_up: true
      auto_login: false
      use_pkce: true

  # Environment variables from ExternalSecret
  envFromSecrets:
    - name: grafana-oauth-credentials
      optional: false

  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      isDefault: false
      editable: false

  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Trial: kube-state-metrics' state is event-updated; Prometheus need not scrape
# 21k object-state samples every 30s on a single-node homelab.
# Change only the metrics endpoint; retain all metric families and labels.
# Test short-window readiness/phase alerts before merge, then measure at 45s.
kube-state-metrics:
  prometheus:
    monitor:
      http:
        interval: 45s

kubeStateMetrics:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

kubelet:
  serviceMonitor:
    cAdvisorInterval: 15s

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheus:
  prometheusSpec:
    replicas: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            prometheus: k8s
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

# GATED: do not merge before APP_ALERTMANAGER_NTFY_PUBLISHER_TOKEN exists in
# Doppler, ExternalSecret is Ready, and an isolated ntfy firing/resolved E2E
# has passed. Only critical alerts route to ntfy; the 43 existing warnings
# continue to the null receiver. No credentials are embedded in Git.
alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-ntfy-publisher
  config:
    global:
      resolve_timeout: 5m
    # Preserve KPS default inhibition so severity escalations don't duplicate.
    inhibit_rules:
      - source_matchers: ['severity = critical']
        target_matchers: ['severity =~ warning|info']
        equal: [namespace, alertname]
      - source_matchers: ['severity = warning']
        target_matchers: ['severity = info']
        equal: [namespace, alertname]
      - source_matchers: ['alertname = InfoInhibitor']
        target_matchers: ['severity = info']
        equal: [namespace]
      - target_matchers: ['alertname = InfoInhibitor']
    route:
      group_by: [namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
      routes:
        - receiver: 'null'
          matchers: ['alertname = Watchdog']
        - receiver: ntfy-critical
          matchers: ['severity = critical']
          group_by: [namespace, alertname]
    receivers:
      - name: 'null'
      - name: ntfy-critical
        webhook_configs:
          - url: http://ntfy.ntfy.svc.cluster.local/homeops-critical?template=alertmanager
            send_resolved: true
            max_alerts: 10
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/alertmanager-ntfy-publisher/token
    templates:
      - /etc/alertmanager/config/*.tmpl
    replicas: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: alertmanager
    podDisruptionBudget:
      enabled: false
      minAvailable: 1

prometheus-node-exporter:
  tolerations:
    - key: "gpu"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
