# Dormant until APP_ALERTMANAGER_NTFY_PUBLISHER_TOKEN is provisioned (the
# healthchecks ping URL secret below needs HEALTHCHECKS_WATCHDOG_PING_URL, PLT-262/263);
# do not add to kustomization.yaml before verifying a scoped write-only ntfy token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-ntfy-publisher
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: alertmanager-ntfy-publisher
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: APP_ALERTMANAGER_NTFY_PUBLISHER_TOKEN
---
# PLT-263: Healthchecks.io ping URL for the Watchdog dead-man switch. The URL
# is created by OpenTofu (homelab-infra) and stored only in Doppler.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-healthchecks-ping
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: alertmanager-healthchecks-ping
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: HEALTHCHECKS_WATCHDOG_PING_URL
