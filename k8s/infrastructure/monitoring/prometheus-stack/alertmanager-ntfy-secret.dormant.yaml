# Dormant until APP_ALERTMANAGER_NTFY_PUBLISHER_TOKEN is provisioned;
# do not add to kustomization.yaml before verifying a scoped write-only ntfy token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-ntfy-publisher
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: alertmanager-ntfy-publisher
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: APP_ALERTMANAGER_NTFY_PUBLISHER_TOKEN
        property: value
