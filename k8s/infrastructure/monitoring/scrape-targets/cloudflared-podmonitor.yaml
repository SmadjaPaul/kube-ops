# PLT-459: cloudflared exposes Prometheus metrics on :2000 (--metrics) but
# nothing scraped them. cloudflared_tunnel_ha_connections = live edge
# connections of the tunnel (0 = tunnel cut even if the pod is Ready).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloudflared
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: cloudflared
spec:
  namespaceSelector:
    matchNames: [cloudflared]
  selector:
    matchLabels:
      app: cloudflared
  podMetricsEndpoints:
    - port: metrics
      scheme: http
      interval: 60s
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: cloudflared_tunnel_(ha_connections|total_requests|request_errors)
          action: keep
