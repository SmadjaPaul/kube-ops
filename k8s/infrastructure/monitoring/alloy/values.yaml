alloy:
  enableReporting: false
  stabilityLevel: generally-available
  storagePath: /tmp/alloy
  mounts:
    varlog: false
    dockercontainers: false
    extra:
      - name: alloy-storage
        mountPath: /tmp/alloy
  extraPorts:
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 473
    runAsGroup: 473
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  configMap:
    content: |-
      logging {
        level  = "info"
        format = "logfmt"
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node_name"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "job"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        // SparkyFitness official images can emit sensitive integration
        // diagnostics directly to stdout/stderr. Keep Kubernetes probes and
        // metrics unchanged, but do not ingest these application streams into
        // Loki (or its retention/backups).
        stage.match {
          selector = `{namespace="wellness", pod=~"sparkyfitness-(server|garmin)-.*"}`
          action   = "drop"
        }
        // PLT-212 lot 2: drop high-volume, low-value repeated lines before
        // ingestion. Measured over 6h on 2026-11-12 (626 MB ingested in total);
        // errors, warnings, security alerts and backup/restore evidence are
        // never matched. See docs/operations/telemetry-policy.md.
        //
        // Falco keeps emitting these events to falcosidekick and to its
        // Prometheus counters; only the Loki copy of CI runner pods (which
        // download and execute tools by design) is dropped. 154k events,
        // ~390 MB/6h during CI bursts. Events from every other namespace and
        // every other rule stay in Loki. The namespace match is token-bounded so
        // that e.g. arc-runners-production is not dropped.
        stage.match {
          selector            = `{namespace="falco", container="falco"} |= "Executing binary not part of base image" |~ "k8s_ns_name=arc-runners([^a-zA-Z0-9_-]|$)"`
          action              = "drop"
          drop_counter_reason = "falco_arc_runner_exec"
        }
        // Alloy's own "opened log stream" INFO line, re-emitted in a loop for a
        // CrashLoopBackOff pod (10.2 MB/6h). The crash loop itself stays visible
        // through kube_pod_container_status_restarts_total.
        stage.match {
          selector            = `{namespace="monitoring", container="alloy"} |= "opened log stream"`
          action              = "drop"
          drop_counter_reason = "alloy_opened_log_stream"
        }
        // MongoDB per-connection chatter (17.8 MB/6h of 18.9 MB). Authentication
        // and error lines are kept.
        stage.match {
          selector            = `{namespace="librechat", container="mongodb"} |~ "Connection accepted|Connection ended|client metadata"`
          action              = "drop"
          drop_counter_reason = "mongodb_connection_chatter"
        }
        // Argo CD routine reconcile INFO lines (6.3 MB/6h) and repo-server INFO
        // (12.4 MB/6h). Only level=info lines are matched, so WARN/ERROR lines (such
        // as "Skipping auto-sync: failed previous sync attempt") and sync results
        // are kept.
        stage.match {
          selector            = `{namespace="argocd", container="application-controller"} |= "level=info" |~ "Reconciliation completed|No status changes|Refreshing app status|Skipping auto-sync|Comparing app state"`
          action              = "drop"
          drop_counter_reason = "argocd_controller_routine_info"
        }
        stage.match {
          selector            = `{namespace="argocd", container="repo-server"} |= "level=info"`
          action              = "drop"
          drop_counter_reason = "argocd_repo_server_info"
        }
        stage.static_labels {
          values = {
            cluster = "homeops",
            source  = "kubernetes",
          }
        }
        forward_to = [loki.write.local.receiver]
      }

      loki.source.kubernetes_events "events" {
        job_name   = "integrations/kubernetes/eventhandler"
        forward_to = [loki.process.events.receiver]
      }

      loki.process "events" {
        stage.static_labels {
          values = {
            cluster = "homeops",
            source  = "kubernetes-events",
          }
        }
        forward_to = [loki.write.local.receiver]
      }

      loki.write "local" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }

      // OTLP is only exposed via the private Alloy ClusterIP service.
      otelcol.receiver.otlp "factory" {
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          traces = [otelcol.processor.batch.factory.input]
        }
      }

      otelcol.processor.batch "factory" {
        output {
          traces = [otelcol.exporter.otlphttp.tempo.input]
        }
      }

      otelcol.exporter.otlphttp "tempo" {
        client {
          endpoint = "http://tempo.monitoring.svc.cluster.local:4318"
        }
      }

controller:
  type: deployment
  replicas: 1
  hostNetwork: false
  hostPID: false
  volumes:
    extra:
      - name: alloy-storage
        emptyDir: {}

rbac:
  create: false

serviceAccount:
  create: true
  name: alloy
  automountServiceAccountToken: true

serviceMonitor:
  enabled: true
  additionalLabels:
    release: kube-prometheus-stack
