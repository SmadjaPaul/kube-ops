apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alloy-factory-dp-otlp
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: alloy-factory-dp-otlp
    creationPolicy: Owner
  data:
    - secretKey: FACTORY_DP_INGEST_KEY
      remoteRef:
        key: APP_FACTORY_PLATFORM_INGEST_API_KEY
