# PLT-306: Grafana Cloud push contract for the homelab Alloy. The values are
# written to Doppler cluster/prd by homelab-infra terraform/grafana-cloud
# (write-only token, scopes metrics:write and logs:write on stack smadja).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alloy-grafana-cloud
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: alloy-grafana-cloud
    creationPolicy: Owner
  data:
    - secretKey: GRAFANA_CLOUD_PROMETHEUS_URL
      remoteRef:
        key: GRAFANA_CLOUD_PROMETHEUS_URL
    - secretKey: GRAFANA_CLOUD_PROMETHEUS_USERNAME
      remoteRef:
        key: GRAFANA_CLOUD_PROMETHEUS_USERNAME
    - secretKey: GRAFANA_CLOUD_LOKI_URL
      remoteRef:
        key: GRAFANA_CLOUD_LOKI_URL
    - secretKey: GRAFANA_CLOUD_LOKI_USERNAME
      remoteRef:
        key: GRAFANA_CLOUD_LOKI_USERNAME
    - secretKey: GRAFANA_CLOUD_WRITE_TOKEN
      remoteRef:
        key: GRAFANA_CLOUD_HOMELAB_WRITE_TOKEN
