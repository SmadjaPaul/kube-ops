apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

helmCharts:
  - name: loki
    repo: https://grafana-community.github.io/helm-charts
    version: 18.13.7
    releaseName: loki
    namespace: monitoring
    valuesFile: values.yaml

patches:
  - path: pvc-backup-policy-patch.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: loki
