deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1
  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 168h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    volume_enabled: true
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    # Keep the live PVC's existing class unchanged. A fast-tier cutover must
    # be performed by a separately approved StatefulSet/PVC migration.
    storageClass: longhorn-bulk
    size: 20Gi
    whenDeleted: Retain
    whenScaled: Retain
  resources:
    requests:
      cpu: 25m
      memory: 384Mi
    limits:
      cpu: 1000m
      memory: 1Gi

gateway:
  enabled: true
  replicas: 1
  # Loki chart 21 sets a required podAntiAffinity on the gateway by default.
  # Single node: the surge pod of a rollout can never schedule next to the old
  # one (FailedScheduling, rollout stuck). `null` removes the chart default ({} would merge).
  affinity: null
  # The running pod of the previous ReplicaSet still carries the chart's
  # anti-affinity, so a surge pod can never schedule on one node. Recreate
  # stops the old pod first (a few seconds without gateway).
  deploymentStrategy:
    type: Recreate
  verboseLogging: false
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

lokiCanary:
  enabled: false

test:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0

monitoring:
  dashboards:
    # Loki metrics and recording rules remain enabled; only the chart's
    # dashboard ConfigMaps are disabled because Telemetry Pipeline owns the
    # curated Loki views.
    enabled: false
  serviceMonitor:
    enabled: true
    # Revue séries 2026-11-23: chart default is 15s; Loki self-metrics are read
    # through 5m rates only.
    interval: 60s
    labels:
      release: kube-prometheus-stack
