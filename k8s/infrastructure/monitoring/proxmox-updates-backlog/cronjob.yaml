apiVersion: batch/v1
kind: CronJob
metadata:
  name: proxmox-updates-backlog
  namespace: monitoring
  labels:
    app.kubernetes.io/name: proxmox-updates-backlog
    app.kubernetes.io/part-of: monitoring
spec:
  # Monday morning: one refresh of the single Linear ticket per week.
  schedule: "0 7 * * 1"
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: proxmox-updates-backlog
            app.kubernetes.io/part-of: monitoring
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backlog
              image: python:3.14.5-alpine3.22@sha256:1a5f0303fd8941565b5bbda3fac2345148a9fd8245d575c2971ccefcd77c78f6
              imagePullPolicy: IfNotPresent
              command: ["python3", "-I", "/opt/backlog/proxmox_updates_backlog.py"]
              env:
                - name: PROMETHEUS_URL
                  value: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
                - name: LINEAR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: proxmox-updates-backlog-linear
                      key: LINEAR_API_KEY
                      optional: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: script
                  mountPath: /opt/backlog
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: proxmox-updates-backlog
