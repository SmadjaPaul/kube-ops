# Dedicated Linear API key of the backlog job (Doppler cluster/prd), created by
# Paul. Until it exists the job runs in dry-run mode (prints the ticket).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proxmox-updates-backlog-linear
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: proxmox-updates-backlog-linear
    creationPolicy: Owner
  data:
    - secretKey: LINEAR_API_KEY
      remoteRef:
        key: PROXMOX_UPDATES_LINEAR_API_KEY
