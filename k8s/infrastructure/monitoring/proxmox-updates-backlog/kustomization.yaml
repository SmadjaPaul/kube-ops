# PLT-475: weekly backlog of pending Proxmox host updates as ONE Linear ticket.
# Reads Prometheus only; never touches the host. Runbook:
# docs/operations/proxmox-updates.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - externalsecret.yaml
  - networkpolicy.yaml
  - cronjob.yaml
configMapGenerator:
  - name: proxmox-updates-backlog
    files:
      - proxmox_updates_backlog.py
