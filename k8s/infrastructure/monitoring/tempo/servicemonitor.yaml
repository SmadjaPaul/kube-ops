apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tempo
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: factory-telemetry
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: factory.observability
      rules:
        - alert: FactoryTempoDown
          expr: up{namespace="monitoring",service="tempo"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Tempo trace backend unavailable"
        - alert: FactoryDBTJobFailed
          expr: kube_job_status_failed{namespace="factory-platform",job_name=~"factory-platform-dbt.*"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Factory dbt v2 run failed; serving marts may be stale"
