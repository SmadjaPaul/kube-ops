apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: factory-tempo-ingress
  namespace: monitoring
spec:
  description: "Only monitoring components can ingest/query traces; Tempo is not public."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tempo
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "3200"
              protocol: TCP
            - port: "4318"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: factory-alloy-otlp-ingress
  namespace: monitoring
spec:
  description: "Allow OTLP only from private Factory workloads and monitoring probes."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: factory-platform
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: mastra-factory
            app.kubernetes.io/name: mastra-factory
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentgateway
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
---
# PLT-470: factory-alloy-otlp-ingress selects the Alloy pods, so Cilium denies
# every other ingress, including Prometheus scraping Alloy's own metrics on
# :12345 (target `alloy` was up == 0). Allow only the Prometheus pods.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alloy-self-metrics-ingress
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "12345"
              protocol: TCP
