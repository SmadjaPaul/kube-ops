apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PLT-397 phase 1: kubechecks removed. Argo refuses an automated sync that would
# leave the Application empty ("auto-sync will wipe out all resources"), so a
# harmless placeholder keeps the render non-empty and lets Argo prune kubechecks.
# Phase 2, once the prune is seen: remove this path from the infrastructure
# ApplicationSet generator (and the placeholder with it).
resources:
  - placeholder-configmap.yaml
