apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubechecks

resources:
  - namespace.yaml
  - http-route.yaml
  - pdb.yaml

patches:
  # The upstream chart omits metadata.namespace and Kustomize does not apply
  # the namespace transformer to Helm-generated resources. Keep the rendered
  # workload namespaced so Argo can validate and apply the application.
  - target:
      version: v1
      kind: ServiceAccount
      name: kubechecks
    patch: |-
      - op: add
        path: /metadata/namespace
        value: kubechecks
  - target:
      version: v1
      kind: Service
      name: kubechecks
    patch: |-
      - op: add
        path: /metadata/namespace
        value: kubechecks
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: kubechecks
    patch: |-
      - op: add
        path: /metadata/namespace
        value: kubechecks

helmCharts:
  - name: kubechecks
    repo: https://zapier.github.io/kubechecks
    version: 3.0.0
    releaseName: kubechecks
    namespace: kubechecks
    valuesFile: values.yaml
