apiVersion: v1
kind: LimitRange
metadata:
  name: preview
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 20m
        memory: 64Mi
      default:
        cpu: 250m
        memory: 256Mi
      max:
        cpu: "1"
        memory: 768Mi
    - type: PersistentVolumeClaim
      max:
        storage: 2Gi
