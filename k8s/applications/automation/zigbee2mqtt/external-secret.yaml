apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zigbee2mqtt-secrets
  namespace: zigbee2mqtt
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: zigbee2mqtt-secrets
    creationPolicy: Owner
  data:
    - secretKey: ZIGBEE2MQTT_CONFIG_MQTT_USER
      remoteRef:
        key: "APP_MQTT_USER"
    - secretKey: ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD
      remoteRef:
        key: "APP_MQTT_PASSWORD"
    - secretKey: ZIGBEE2MQTT_CONFIG_ADVANCED_NETWORK_KEY
      remoteRef:
        key: "ZIGBEE_NETWORK_KEY"
    - secretKey: ZIGBEE2MQTT_CONFIG_ADVANCED_PAN_ID
      remoteRef:
        key: "ZIGBEE_PAN_ID"
    - secretKey: ZIGBEE2MQTT_CONFIG_ADVANCED_EXTENDED_PAN_ID
      remoteRef:
        key: "ZIGBEE_EXT_PAN_ID"
