apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/instance: home-assistant
spec:
  serviceName: home-assistant
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
      app.kubernetes.io/instance: home-assistant
  template:
    metadata:
      annotations:
        # ConfigMap montée en subPath : elle n'est relue qu'au démarrage du pod.
        # Incrémenter pour redémarrer HA après un changement de configuration.yaml.
        smadja.dev/config-rev: "3"
      labels:
        app.kubernetes.io/name: home-assistant
        app.kubernetes.io/instance: home-assistant
    spec:
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
      serviceAccountName: home-assistant
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
      - name: install-openid
        image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { cpu: 100m, memory: 64Mi }
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c"]
        args:
        - >-
          set -eu;
          archive=/tmp/hass-openid.tar.gz;
          wget -q -O "$archive" "$OPENID_ARCHIVE_URL";
          echo "$OPENID_ARCHIVE_SHA256  $archive" | sha256sum -c -;
          mkdir -p /config/custom_components;
          tar -xzf "$archive" -C /tmp;
          rm -rf /config/custom_components/openid;
          cp -R /tmp/hass-openid-$OPENID_COMMIT/custom_components/openid /config/custom_components/openid;
          echo "$OPENID_UI_VIEWS_UPSTREAM_SHA256  /config/custom_components/openid/ui_views.py" | sha256sum -c -;
          cp /openid-patch/openid-ui_views.py /config/custom_components/openid/ui_views.py;
          echo "$OPENID_UI_VIEWS_PATCHED_SHA256  /config/custom_components/openid/ui_views.py" | sha256sum -c -;
          test -f /config/custom_components/openid/__init__.py
        env:
        - name: OPENID_COMMIT
          value: 0135a6f8150693ecb99cd5ba42446e0d1e66994d
        - name: OPENID_ARCHIVE_URL
          value: https://github.com/cavefire/hass-openid/archive/0135a6f8150693ecb99cd5ba42446e0d1e66994d.tar.gz
        - name: OPENID_ARCHIVE_SHA256
          value: bf742ea17a3111ddb7b060835225dcaebb3d9debe73a89b4ddec62ae880ee6f4
        # PRD-87b : ui_views.py corrigé (PR cavefire/hass-openid#101, non mergée) ; à retirer quand elle l'est.
        - name: OPENID_UI_VIEWS_UPSTREAM_SHA256
          value: 7ba0578671820ac5504fbde3201e12092512a3a1ee101e0a05bad9dad6c27b01
        - name: OPENID_UI_VIEWS_PATCHED_SHA256
          value: 858d760fe9f52456cf3840f6ecd703234ed756bef244f4a593e32edc8950c807
        volumeMounts:
        - name: data
          mountPath: /config
        - name: openid-patch
          mountPath: /openid-patch
          readOnly: true
      - name: init-ui-files
        # PLT-444 : crée sur le PVC les fichiers inclus par configuration.yaml s'ils manquent.
        # Ne jamais écraser un fichier existant (UI HA et provider OpenTofu y écrivent).
        image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { cpu: 100m, memory: 64Mi }
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c"]
        args:
        - >-
          set -eu;
          [ -e /config/automations.yaml ] || echo '[]' > /config/automations.yaml;
          [ -e /config/scenes.yaml ] || echo '[]' > /config/scenes.yaml;
          [ -e /config/scripts.yaml ] || echo '{}' > /config/scripts.yaml
        volumeMounts:
        - name: data
          mountPath: /config
      - name: volume-permissions
        image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { cpu: 100m, memory: 64Mi }
        # PLT-502 : /config/matter-server appartient à l'UID 1000 du Matter Server (sidecar).
        command: ["sh", "-c", "chmod -R 755 /config && chown -R root:root /config && mkdir -p /config/matter-server && chown -R 1000:1000 /config/matter-server"]
        volumeMounts:
        - name: data
          mountPath: /config
      containers:
        # PLT-502 : Matter Server (matter.js) en sidecar. Il partage le hostNetwork de HA
        # (mDNS et IPv6 de l'hôte, indispensables à Matter) sans nouvelle charge de travail
        # hors politique ; WebSocket limité au loopback, HA s'y connecte par ws://localhost:5580/ws.
        # Données (fabric Matter) sur le PVC de HA, sous /config/matter-server.
        - name: matter-server
          image: ghcr.io/matter-js/matterjs-server:1.6.0@sha256:9eb98c839d0b4b07f9230b96ad52de570f7f2a7c286c5992b4c04b6b26c08a3f
          imagePullPolicy: IfNotPresent
          env:
            - name: LISTEN_ADDRESS
              value: "127.0.0.1"
            - name: PRIMARY_INTERFACE
              value: eth0
            - name: STORAGE_PATH
              value: /data
            - name: MATTER_LOG_FORMAT
              value: plain
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: matter-server
            - name: matter-tmp
              mountPath: /tmp
          livenessProbe:
            exec:
              command: ["/usr/local/bin/healthcheck.sh"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 6
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.11.2@sha256:493a07e8f6530fc640223f4a0a5248f20a61ca2f718bb1d31efbf08a2c5ea28f
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8123
              name: http
              protocol: TCP
            - containerPort: 8124
              name: sia
              protocol: TCP
          env:
            - name: TZ
              value: Europe/Stockholm
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - NET_BROADCAST
          volumeMounts:
            - name: data
              mountPath: /config
            - name: core-config
              mountPath: /config/configuration.yaml
              readOnly: true
              subPath: configuration.yaml
            - name: secrets
              mountPath: /config/secrets.yaml
              readOnly: true
              subPath: secrets.yaml

          livenessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
      volumes:
        - name: matter-tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: openid-patch
          configMap:
            name: ha-openid-ui-views-patch
        - name: core-config
          configMap:
            name: ha-core-config
            items:
              - key: configuration.yaml
                path: configuration.yaml
        - name: secrets
          secret:
            secretName: hassio-secrets
            items:
              - key: secrets.yaml
                path: secrets.yaml
        - name: data
          persistentVolumeClaim:
            claimName: home-assistant-home-assistant-0
