apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-assistant

configMapGenerator:
  - name: ha-core-config
    files:
      - config/configuration.yaml
  - name: ha-mcp-token-rotate-script
    files:
      - ha-mcp-token-rotate.py

resources:
  - namespace.yaml
  - pvc.yaml
  - http-route.yaml
  - serviceaccount.yaml
  - svc.yaml
  - statefulset.yaml
  - policy-exception.yaml
  - external-secret.yaml
  - ha-mcp-deployment.yaml
  - ha-mcp-service.yaml
  - ha-mcp-network-policy.yaml
  - ha-mcp-token-rotate.yaml

generatorOptions:
  disableNameSuffixHash: true
