# Dérogation migrée de kyverno.io/v2 vers policies.kyverno.io/v1 (le socle est en ValidatingPolicy).
# Rappel : le chart Kyverno lance les controleurs avec --enablePolicyException=false : sans effet
# runtime tant que cette option reste a false ; le gate statique (policy/baseline.tsv) porte la dette.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: home-assistant-required-host-access
  namespace: home-assistant
  annotations:
    description: "Narrow exception for Home Assistant host networking and required device capabilities."
spec:
  policyRefs:
    - name: platform-baseline-non-root-containers
      kind: ValidatingPolicy
    - name: platform-baseline-drop-all-capabilities
      kind: ValidatingPolicy
    - name: platform-baseline-no-added-capabilities
      kind: ValidatingPolicy
    - name: platform-baseline-read-only-root-filesystem
      kind: ValidatingPolicy
    - name: platform-baseline-no-host-namespaces
      kind: ValidatingPolicy
  matchConditions:
    - name: home-assistant
      expression: >-
        has(object.metadata.namespace) && object.metadata.namespace == 'home-assistant' && has(object.metadata.name) && object.metadata.name.startsWith('home-assistant')
