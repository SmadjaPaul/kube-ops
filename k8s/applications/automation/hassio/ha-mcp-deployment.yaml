apiVersion: apps/v1
kind: Deployment
metadata:
  name: ha-mcp
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: ha-mcp
    app.kubernetes.io/instance: ha-mcp
  annotations:
    # PRD-80: Reloader redemarre ha-mcp quand le CronJob ha-mcp-token-rotate patche le Secret.
    secret.reloader.stakater.com/reload: "ha-mcp-token"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ha-mcp
      app.kubernetes.io/instance: ha-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ha-mcp
        app.kubernetes.io/instance: ha-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ha-mcp
          image: ghcr.io/homeassistant-ai/ha-mcp:9.2.0@sha256:9de5bf6c4216142fdffe862900abe72dac8dfe9621dd0b2b050d132372b676ba
          imagePullPolicy: IfNotPresent
          command:
            - ha-mcp-web
          ports:
            - name: http
              containerPort: 8086
              protocol: TCP
          env:
            # PLT-447: ha-mcp is for agent exploration only, never durable writes.
            # READ_ONLY_MODE hides write tools and blocks write calls (ha-mcp 9.2.0 docs);
            # the settings UI stays off so the toggle cannot be flipped at runtime.
            - name: READ_ONLY_MODE
              value: "true"
            - name: HA_MCP_DISABLE_SETTINGS_UI
              value: "true"
            # HA en hostNetwork sur le noeud, jamais expose par Tunnel (PRD-91).
            - name: HOMEASSISTANT_URL
              value: "http://10.0.20.60:8123"
            # Secret Kubernetes natif ha-mcp-token (cle token), cree hors Git avec le jeton
            # agent-maison (prerequis PRD-91) ; sans lui le pod reste en CreateContainerConfigError.
            - name: HOMEASSISTANT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ha-mcp-token
                  key: token
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/mcpuser/.cache
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: cache
          emptyDir:
            sizeLimit: 64Mi
