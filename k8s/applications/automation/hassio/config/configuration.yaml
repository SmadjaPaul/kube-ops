# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
#frontend:
#  themes: !include_dir_merge_named themes
 # extra_module_url:
 #   - /hacsfiles/lovelace-card-mod/card-mod.js
 #   - /hacsfiles/Bubble-Card/bubble-pop-up-fix.js

# http: retiré (HA >= 2026.8 l'a importé dans .storage ; réglage via Paramètres > Système > Réseau)

# Socle PLT-444 (décision E de PLT-441) : ces trois fichiers vivent sur le PVC, appartiennent à HA
# (éditeur UI et provider OpenTofu `toelke/homeassistant`) et ne sont JAMAIS écrasés par Git.
# L'initContainer init-ui-files les crée vides s'ils manquent. Voir README.md.
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# auth_header : déclaré mais non installé en custom_components (constat PLT-416), donc sans effet ;
# conservé tel quel pour ne pas élargir ce changement.
auth_header:
  username_header: X-ak-hass-user
  debug: true

openid:
  client_id: !secret ha_oidc_client_id
  client_secret: !secret ha_oidc_client_secret
  configure_url: "https://auth.smadja.dev/application/o/home-assistant/.well-known/openid-configuration"
  username_field: preferred_username
  scope: "openid profile email"
  block_login: false
  openid_text: "Login with OpenID / OAuth2"

bluetooth:

## Recorder ##
recorder:
  purge_keep_days: 10
  commit_interval: 5
  include:
    domains:
      - sensor
      - switch
      - media_player
      - light
      - binary_sensor
      - cover
      - remote
    entity_globs:
      - device_tracker.person1_*
      - device_tracker.person2_*
  exclude:
    entities:
      - sensor.date
      - sensor.time
      - sensor.date_time
    event_types:
      - browser_mod

## Logger ##
logger:
  default: warning
  logs:
    homeassistant.core: warning
    homeassistant.components.mqtt: warning

## history ##
history:
  include:
    domains:
      - sensor
      - switch
      - media_player
      - light
      - binary_sensor
      - cover
  exclude:
    entities:
      - sensor.date
      - sensor.time
      - sensor.date_time

## Lovelace Config ##
lovelace:
  mode: storage
