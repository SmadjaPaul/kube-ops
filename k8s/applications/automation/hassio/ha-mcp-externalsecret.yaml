apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ha-mcp-secrets
  namespace: home-assistant
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: ha-mcp-secrets
    creationPolicy: Owner
  data:
    - secretKey: HOMEASSISTANT_URL
      remoteRef:
        key: APP_HA_MCP_URL
    - secretKey: HOMEASSISTANT_TOKEN
      remoteRef:
        key: APP_HA_MCP_TOKEN
    - secretKey: MCP_SECRET_PATH
      remoteRef:
        key: APP_HA_MCP_SECRET_PATH
