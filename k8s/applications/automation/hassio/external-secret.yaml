apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hassio-secrets
  namespace: home-assistant
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: hassio-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        secrets.yaml: |
          ha_oidc_client_id: {{ .ha_oidc_client_id | quote }}
          ha_oidc_client_secret: {{ .ha_oidc_client_secret | quote }}
  data:
    - secretKey: ha_oidc_client_id
      remoteRef:
        key: APP_HASSIO_OAUTH_CLIENT_ID
    - secretKey: ha_oidc_client_secret
      remoteRef:
        key: APP_HASSIO_OAUTH_CLIENT_SECRET
---
# PRD-104 : jeton de service Doppler en ecriture sur cluster/prd (nom : ha-agent-write), range dans
# Doppler cluster/prd. Monte uniquement par le CronJob ha-mcp-token-rotate (secretKeyRef optionnel),
# qui y publie HA_AGENT_TOKEN pour le client MCP du Mac (consommateur hors cluster).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ha-agent-doppler-write
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: ha-mcp-token-rotate
  annotations:
    kube-ops.io/secret-class: T5
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: ha-agent-doppler-write
    creationPolicy: Owner
  data:
    - secretKey: APP_HA_AGENT_DOPPLER_WRITE_TOKEN
      remoteRef:
        key: APP_HA_AGENT_DOPPLER_WRITE_TOKEN
