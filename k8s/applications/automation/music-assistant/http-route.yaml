apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: music-assistant
  namespace: music-assistant
spec:
  # Interne uniquement : aucune route sur Gateway/external.
  parentRefs:
    - name: internal
      namespace: gateway
  hostnames:
    - "music.smadja.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: music-assistant
          port: 8095
