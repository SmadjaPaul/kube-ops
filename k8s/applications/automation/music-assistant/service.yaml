apiVersion: v1
kind: Service
metadata:
  name: music-assistant
  namespace: music-assistant
  labels:
    app.kubernetes.io/name: music-assistant
spec:
  selector:
    app.kubernetes.io/name: music-assistant
  ports:
    - name: http
      port: 8095
      targetPort: http
      protocol: TCP
    - name: stream
      port: 8097
      targetPort: stream
      protocol: TCP
