# PRD-84 : publie le jeton MA de svc-home-assistant dans Doppler home/prd_maison (cle MA_HOME_ASSISTANT_TOKEN),
# lu hors cluster par OpenTofu/ARC (PRD-82). Voir docs/runbooks/music-assistant-reconcile.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ma-publish-tokens
  namespace: music-assistant
  labels:
    app.kubernetes.io/name: ma-publish-tokens
spec:
  # Suspendu : a planifier apres l'apply, ou a lancer a la main :
  # kubectl-rw.sh run-cronjob music-assistant cronjob/ma-publish-tokens
  suspend: true
  schedule: "30 6 * * *"
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 1209600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ma-publish-tokens
        spec:
          restartPolicy: Never
          # Aucun acces a l'API Kubernetes : le jeton arrive par secretKeyRef (kubelet).
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: publish
              image: python:3.14.5-alpine3.22@sha256:1a5f0303fd8941565b5bbda3fac2345148a9fd8245d575c2971ccefcd77c78f6
              command: ["python3", "-I", "/scripts/ma_publish_tokens.py"]
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: APP_MA_HA_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: ma-home-assistant-token
                      key: token
                - name: APP_MAISON_DOPPLER_WRITE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: maison-doppler-write
                      key: APP_MAISON_DOPPLER_WRITE_TOKEN
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: ma-publish-tokens-script
                defaultMode: 0444
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ma-publish-tokens
  namespace: music-assistant
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ma-publish-tokens
  description: "ma-publish-tokens: egress DNS et api.doppler.com:443 seulement; aucun ingress."
  ingress: []
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: api.doppler.com
    - toFQDNs:
        - matchName: api.doppler.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
