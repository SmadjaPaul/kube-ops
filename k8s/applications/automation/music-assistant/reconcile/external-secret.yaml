# Mot de passe svc-music-assistant : reste dans Doppler cluster/prd (le provider OpenTofu polyfin, via ARC, le lit aussi).
# Le jeton MA admin est un Secret natif ma-reconcile-token (non versionne, voir docs/runbooks/music-assistant-reconcile.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ma-reconcile
  namespace: music-assistant
  labels:
    app.kubernetes.io/name: ma-reconcile
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: ma-reconcile
    creationPolicy: Owner
  data:
    - secretKey: APP_MA_POLYFIN_PASSWORD
      remoteRef:
        key: APP_MA_POLYFIN_PASSWORD
