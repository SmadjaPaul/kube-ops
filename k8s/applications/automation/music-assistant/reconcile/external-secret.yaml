apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ma-reconcile
  namespace: music-assistant
  labels:
    app.kubernetes.io/name: ma-reconcile
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: ma-reconcile
    creationPolicy: Owner
  data:
    - secretKey: APP_MA_RECONCILE_TOKEN
      remoteRef:
        key: APP_MA_RECONCILE_TOKEN
    - secretKey: APP_MA_POLYFIN_PASSWORD
      remoteRef:
        key: APP_MA_POLYFIN_PASSWORD
