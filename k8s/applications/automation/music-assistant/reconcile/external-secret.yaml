# Mot de passe svc-music-assistant : reste dans Doppler cluster/prd (lu aussi par le provider polyfin, ARC).
# Le jeton MA admin est un Secret natif ma-reconcile-token, hors Git (docs/runbooks/music-assistant-reconcile.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ma-reconcile
  namespace: music-assistant
  labels:
    app.kubernetes.io/name: ma-reconcile
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: ma-reconcile
    creationPolicy: Owner
  data:
    - secretKey: APP_MA_POLYFIN_PASSWORD
      remoteRef:
        key: APP_MA_POLYFIN_PASSWORD
---
# PRD-84 : Secret natif ma-home-assistant-token (clé token), jeton longue durée de svc-home-assistant.
# Créé une fois avec une valeur aléatoire (CreatedOnce + Orphan, comme qbittorrent-mam) qui sert de
# valeur factice : MA la refuse (401), donc le réconciliateur apply émet le vrai jeton et le range ici
# par PATCH. Le Role du réconciliateur n'a donc ni create ni get. Consommé hors cluster par
# l'intégration HA n'en a plus l'usage (PRD-103) : HA garde son propre jeton MA ; voir docs/runbooks/music-assistant-reconcile.md.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ma-home-assistant-token-placeholder
  namespace: music-assistant
spec:
  length: 48
  digits: 10
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ma-home-assistant-token
  namespace: music-assistant
  annotations:
    kube-ops.io/secret-class: T5
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: ma-home-assistant-token
    creationPolicy: Orphan
    template:
      engineVersion: v2
      data:
        token: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ma-home-assistant-token-placeholder
