apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ma-reconcile
  namespace: music-assistant
  labels:
    policy-type: application
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ma-reconcile
  description: "Reconciliateur MA : DNS et API Music Assistant (8095) seulement."
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: music-assistant
      toPorts:
        - ports:
            - port: "8095"
              protocol: TCP
