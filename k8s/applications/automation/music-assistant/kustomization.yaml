apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: music-assistant
configMapGenerator:
  - name: ma-reconcile-script
    files:
      - reconcile/ma_reconcile.py
  - name: ma-jellyfin-parsers-patch
    files:
      - parsers.py=patches/jellyfin-parsers.py
  - name: ma-reconcile-desired
    files:
      - reconcile/desired.json

generatorOptions:
  disableNameSuffixHash: true

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - http-route.yaml
  - tcp-route.yaml
  - networkpolicy.yaml
  - reconcile/external-secret.yaml
  - reconcile/rbac.yaml
  - reconcile/cronjobs.yaml
