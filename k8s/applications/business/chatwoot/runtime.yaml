apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chatwoot-runtime
  namespace: chatwoot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: chatwoot-runtime
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SECRET_KEY_BASE: "{{ .SECRET_KEY_BASE }}"
        REDIS_PASSWORD: "{{ .REDIS_PASSWORD }}"
        REDIS_URL: "redis://:{{ .REDIS_PASSWORD }}@chatwoot-redis:6379"
        SMTP_ADDRESS: "{{ .SMTP_ADDRESS }}"
        SMTP_PORT: "{{ .SMTP_PORT }}"
        SMTP_USERNAME: "{{ .SMTP_USERNAME }}"
        SMTP_PASSWORD: "{{ .SMTP_PASSWORD }}"
        MAILER_SENDER_EMAIL: "{{ .MAILER_SENDER_EMAIL }}"
  data:
    - secretKey: SECRET_KEY_BASE
      remoteRef: { key: APP_CHATWOOT_SECRET_KEY_BASE }
    - secretKey: REDIS_PASSWORD
      remoteRef: { key: APP_CHATWOOT_REDIS_PASSWORD }
    - secretKey: SMTP_ADDRESS
      remoteRef: { key: MIGADU_SMTP_HOST }
    - secretKey: SMTP_PORT
      remoteRef: { key: MIGADU_SMTP_PORT }
    - secretKey: SMTP_USERNAME
      remoteRef: { key: MIGADU_SMTP_USER }
    - secretKey: SMTP_PASSWORD
      remoteRef: { key: MIGADU_SMTP_PASSWORD }
    - secretKey: MAILER_SENDER_EMAIL
      remoteRef: { key: MIGADU_SMTP_FROM }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatwoot-redis
  namespace: chatwoot
  annotations:
    secret.reloader.stakater.com/reload: "chatwoot-runtime"
spec:
  # V1 dormant: Redis is volatile by design (no persistence); no cache/queue pod is kept.
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: chatwoot-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatwoot-redis
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          command: ["sh","-c"]
          args:
            - exec redis-server --save '' --appendonly no --maxmemory-policy noeviction --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chatwoot-runtime
                  key: REDIS_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - { name: redis, containerPort: 6379 }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: chatwoot-redis
  namespace: chatwoot
spec:
  selector:
    app.kubernetes.io/name: chatwoot-redis
  ports:
    - { name: redis, port: 6379, targetPort: redis }
