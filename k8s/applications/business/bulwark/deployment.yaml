apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulwark
  namespace: bulwark
  annotations:
    secret.reloader.stakater.com/reload: "bulwark-runtime"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bulwark
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bulwark
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bulwark
          image: ghcr.io/bulwarkmail/webmail:1.11.2
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: bulwark-runtime
          env:
            - name: NODE_ENV
              value: production
            - name: HOSTNAME
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: APP_NAME
              value: Smadja Mail
            - name: JMAP_SERVER_URL
              value: https://mail.smadja.dev
            - name: STALWART_FEATURES
              value: "true"
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
