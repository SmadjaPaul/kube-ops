apiVersion: apps/v1
kind: Deployment
metadata:
  name: twenty-server
  namespace: twenty
  annotations:
    secret.reloader.stakater.com/reload: "twenty-runtime,twenty-postgresql-app"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: twenty-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: twenty-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: twenty
          image: twentycrm/twenty:v2.41.0
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_PORT
              value: "3000"
            - name: PG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: twenty-postgresql-app
                  key: uri
            - name: SERVER_URL
              value: https://crm.smadja.dev
            - name: REDIS_URL
              value: redis://twenty-redis:6379
            - name: STORAGE_TYPE
              value: local
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: twenty-runtime
                  key: APP_SECRET
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: twenty-runtime
                  key: APP_SECRET
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          volumeMounts:
            - name: storage
              mountPath: /app/packages/twenty-server/.local-storage
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: twenty-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twenty-worker
  namespace: twenty
  annotations:
    secret.reloader.stakater.com/reload: "twenty-runtime,twenty-postgresql-app"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: twenty-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: twenty-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: twentycrm/twenty:v2.41.0
          imagePullPolicy: IfNotPresent
          command: ["yarn", "worker:prod"]
          env:
            - name: PG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: twenty-postgresql-app
                  key: uri
            - name: SERVER_URL
              value: https://crm.smadja.dev
            - name: REDIS_URL
              value: redis://twenty-redis:6379
            - name: STORAGE_TYPE
              value: local
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: twenty-runtime
                  key: APP_SECRET
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: twenty-runtime
                  key: APP_SECRET
            - name: DISABLE_DB_MIGRATIONS
              value: "true"
            - name: DISABLE_CRON_JOBS_REGISTRATION
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: storage
              mountPath: /app/packages/twenty-server/.local-storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: twenty-storage
