apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: twenty-runtime
  namespace: twenty
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: twenty-runtime
    creationPolicy: Owner
  data:
    - secretKey: APP_SECRET
      remoteRef: { key: APP_TWENTY_APP_SECRET }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: twenty-storage
  namespace: twenty
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: proxmox-csi
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twenty-redis
  namespace: twenty
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: twenty-redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: twenty-redis }
    spec:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server","--maxmemory-policy","noeviction","--save",""]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          ports:
            - { name: redis, containerPort: 6379 }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: twenty-redis
  namespace: twenty
spec:
  selector: { app.kubernetes.io/name: twenty-redis }
  ports:
    - { name: redis, port: 6379, targetPort: redis }
