apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: twenty-postgresql
  namespace: twenty
spec:
  instances: 1
  bootstrap:
    initdb:
      database: twenty
      owner: twenty
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: twenty-hetzner-store
  storage:
    size: 10Gi
    storageClass: proxmox-csi
  affinity:
    enablePodAntiAffinity: false
