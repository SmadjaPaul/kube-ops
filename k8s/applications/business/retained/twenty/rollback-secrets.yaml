apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: twenty-runtime
  namespace: twenty
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: twenty-runtime
    creationPolicy: Owner
  data:
    - secretKey: ENCRYPTION_KEY
      remoteRef: { key: APP_TWENTY_ENCRYPTION_KEY }
