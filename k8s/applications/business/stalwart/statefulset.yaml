apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stalwart
  namespace: stalwart
spec:
  serviceName: stalwart
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stalwart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stalwart
          image: ghcr.io/stalwartlabs/stalwart:v0.16.23
          imagePullPolicy: IfNotPresent
          env:
            - name: STALWART_PUBLIC_URL
              value: https://mail.smadja.dev
          envFrom:
            - secretRef:
                name: stalwart-bootstrap
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          ports:
            - { name: https, containerPort: 443 }
            - { name: mgmt, containerPort: 8080 }
            - { name: smtp, containerPort: 25 }
            - { name: submission, containerPort: 587 }
            - { name: submissions, containerPort: 465 }
            - { name: imap, containerPort: 143 }
            - { name: imaps, containerPort: 993 }
            - { name: sieve, containerPort: 4190 }
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/stalwart
            - name: data
              mountPath: /var/lib/stalwart
          readinessProbe:
            tcpSocket:
              port: mgmt
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mgmt
            initialDelaySeconds: 30
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn-fast
        resources:
          requests:
            storage: 2Gi
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn-fast
        resources:
          requests:
            storage: 20Gi
