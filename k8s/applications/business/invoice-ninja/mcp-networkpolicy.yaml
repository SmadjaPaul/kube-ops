apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: invoice-ninja-mcp
  namespace: invoice-ninja
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: invoice-ninja-mcp }
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: openclaw
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: paperclip
      toPorts:
        - ports: [{ protocol: TCP, port: "8539" }]
