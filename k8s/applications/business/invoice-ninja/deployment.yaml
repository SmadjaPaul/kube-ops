apiVersion: apps/v1
kind: Deployment
metadata: { name: invoice-ninja, namespace: invoice-ninja }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: invoice-ninja }
  template:
    metadata:
      labels: { app.kubernetes.io/name: invoice-ninja }
      annotations:
        secret.reloader.stakater.com/reload: invoice-ninja-runtime
        configmap.reloader.stakater.com/reload: invoice-ninja-env,invoice-ninja-nginx
    spec:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: invoiceninja/invoiceninja-debian:5.13.43
          envFrom:
            - configMapRef: { name: invoice-ninja-env }
            - secretRef: { name: invoice-ninja-runtime }
          ports: [{ name: fpm, containerPort: 9000 }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "1", memory: 1536Mi }
          startupProbe:
            tcpSocket: { port: fpm }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket: { port: fpm }
            periodSeconds: 10
          volumeMounts:
            - { name: public, mountPath: /var/www/html/public }
            - { name: storage, mountPath: /var/www/html/storage }
        - name: nginx
          image: nginx:1.30.5-alpine
          ports: [{ name: http, containerPort: 8080 }]
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 300m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - { name: public, mountPath: /var/www/html/public, readOnly: true }
            - { name: storage, mountPath: /var/www/html/storage, readOnly: true }
            - { name: nginx-config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
      volumes:
        - name: public
          persistentVolumeClaim: { claimName: invoice-ninja-public }
        - name: storage
          persistentVolumeClaim: { claimName: invoice-ninja-storage }
        - name: nginx-config
          configMap: { name: invoice-ninja-nginx }
