apiVersion: apps/v1
kind: Deployment
metadata: { name: invoice-ninja, namespace: invoice-ninja }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: invoice-ninja }
  template:
    metadata:
      labels: { app.kubernetes.io/name: invoice-ninja }
      annotations:
        secret.reloader.stakater.com/reload: invoice-ninja-runtime
        configmap.reloader.stakater.com/reload: invoice-ninja-env,invoice-ninja-nginx
    spec:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-dependencies
          image: busybox:1.38.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until nc -z invoice-ninja-mysql 3306; do echo "waiting for mysql"; sleep 2; done
              until nc -z invoice-ninja-redis 6379; do echo "waiting for redis"; sleep 2; done
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: invoiceninja/invoiceninja-debian:5.13.49@sha256:05efd0913eb0d72d0246ec96d6cb6adf5ac3d3e59b9b91514b9f64b892f21c92
          envFrom:
            - configMapRef: { name: invoice-ninja-env }
            - secretRef: { name: invoice-ninja-runtime }
          ports: [{ name: fpm, containerPort: 9000 }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "1", memory: 1536Mi }
          startupProbe:
            tcpSocket: { port: fpm }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket: { port: fpm }
            periodSeconds: 10
          volumeMounts:
            - { name: public, mountPath: /var/www/html/public }
            - { name: storage, mountPath: /var/www/html/storage }
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31.7-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
          ports: [{ name: http, containerPort: 8080 }]
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 300m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - { name: public, mountPath: /var/www/html/public, readOnly: true }
            - { name: storage, mountPath: /var/www/html/storage, readOnly: true }
            - { name: nginx-config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
      volumes:
        - name: public
          persistentVolumeClaim: { claimName: invoice-ninja-public }
        - name: storage
          persistentVolumeClaim: { claimName: invoice-ninja-storage }
        - name: nginx-config
          configMap: { name: invoice-ninja-nginx }
