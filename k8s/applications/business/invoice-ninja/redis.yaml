apiVersion: v1
kind: Service
metadata: { name: invoice-ninja-redis, namespace: invoice-ninja }
spec:
  selector: { app.kubernetes.io/name: invoice-ninja-redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: invoice-ninja-redis, namespace: invoice-ninja }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: invoice-ninja-redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: invoice-ninja-redis }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: redis:8.2-alpine3.22
          args: [redis-server, --appendonly, "yes", --appendfsync, everysec]
          ports: [{ name: redis, containerPort: 6379 }]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
          readinessProbe: { exec: { command: [redis-cli, ping] } }
          livenessProbe: { exec: { command: [redis-cli, ping] } }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: invoice-ninja-redis }
