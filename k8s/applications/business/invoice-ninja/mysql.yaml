apiVersion: v1
kind: Service
metadata: { name: invoice-ninja-mysql, namespace: invoice-ninja }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: invoice-ninja-mysql }
  ports:
    - { name: mysql, port: 3306, targetPort: mysql }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: invoice-ninja-mysql, namespace: invoice-ninja }
spec:
  serviceName: invoice-ninja-mysql
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: invoice-ninja-mysql }
  template:
    metadata:
      labels: { app.kubernetes.io/name: invoice-ninja-mysql }
    spec:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mysql
          image: mysql:8.4.11
          ports: [{ name: mysql, containerPort: 3306 }]
          env:
            - { name: MYSQL_DATABASE, value: ninja }
            - { name: MYSQL_USER, value: ninja }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: invoice-ninja-mysql, key: MYSQL_PASSWORD } }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: invoice-ninja-mysql, key: MYSQL_ROOT_PASSWORD } }
          args: [--innodb-buffer-pool-size=256M]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe:
            exec: { command: [sh, -c, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"'] }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: { command: [sh, -c, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"'] }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn-bulk
        resources: { requests: { storage: 10Gi } }
