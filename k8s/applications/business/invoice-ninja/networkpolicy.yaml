apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: invoice-ninja }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-gateway, namespace: invoice-ninja }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: invoice-ninja }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: gateway }
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-mysql-from-app, namespace: invoice-ninja }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: invoice-ninja-mysql }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: invoice-ninja }
      ports: [{ protocol: TCP, port: 3306 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-redis-from-app, namespace: invoice-ninja }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: invoice-ninja-redis }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: invoice-ninja }
      ports: [{ protocol: TCP, port: 6379 }]
