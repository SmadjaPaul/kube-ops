apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: invoice-ninja-public
  namespace: invoice-ninja
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/persistent-offsite-backup: enabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-bulk
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: invoice-ninja-storage
  namespace: invoice-ninja
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/persistent-offsite-backup: enabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-bulk
  resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: invoice-ninja-redis, namespace: invoice-ninja }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-bulk
  resources: { requests: { storage: 1Gi } }
