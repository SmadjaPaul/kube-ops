apiVersion: v1
kind: Service
metadata: { name: invoice-ninja, namespace: invoice-ninja }
spec:
  selector: { app.kubernetes.io/name: invoice-ninja }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: invoice-ninja, namespace: invoice-ninja }
spec:
  parentRefs:
    - { name: external, namespace: gateway }
    - { name: internal, namespace: gateway }
  hostnames: [gestion.lechaplais.com]
  rules:
    - backendRefs:
        - { name: invoice-ninja, port: 80 }
