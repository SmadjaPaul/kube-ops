apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: invoice-ninja-mcp
  namespace: invoice-ninja
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: invoice-ninja-mcp
    creationPolicy: Owner
  data:
    - secretKey: INVOICE_NINJA_API_TOKEN
      remoteRef: { key: APP_INVOICE_NINJA_API_TOKEN }
    - secretKey: MCP_TOKEN_OPENCLAW
      remoteRef: { key: APP_INVOICE_NINJA_MCP_OPENCLAW_TOKEN }
    - secretKey: MCP_TOKEN_PAPERCLIP
      remoteRef: { key: APP_INVOICE_NINJA_MCP_PAPERCLIP_TOKEN }
