# DORMANT: excluded from invoice-ninja/kustomization.yaml. Upstream MCP server
# refuses to start with no MCP_TOKEN_* bearer credential; reactivate only with
# a new owner-specific identity (Mastra/OpenConnector) and valid network policy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: invoice-ninja-mcp
  namespace: invoice-ninja
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: invoice-ninja-mcp
    creationPolicy: Owner
  data:
    - secretKey: INVOICE_NINJA_API_TOKEN
      remoteRef: { key: APP_INVOICE_NINJA_API_TOKEN }
