apiVersion: batch/v1
kind: CronJob
metadata:
  name: invoice-ninja-mysql-logical-backup
  namespace: invoice-ninja
spec:
  schedule: "15 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: invoice-ninja-backup
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            # The Invoice Ninja storage PVC is owned by the image's
            # www-data identity (33:33). The dump must be able to replace
            # mysql-latest.sql on that shared PVC without running as root.
            runAsUser: 33
            runAsGroup: 33
            fsGroup: 33
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: mysqldump
              image: mysql:8.4.11
              command:
                - /bin/sh
                - -ec
                - |
                  umask 077
                  backup_dir=/backup/logical-backups
                  target="$backup_dir/mysql-latest.sql"
                  tmp="$backup_dir/.mysql-latest.sql.tmp.$$"

                  cleanup() {
                    rm -f "$tmp" 2>/dev/null || true
                  }
                  trap cleanup EXIT

                  mkdir -p "$backup_dir"
                  test -w "$backup_dir"

                  ready=no
                  for attempt in $(seq 1 12); do
                    if mysqladmin ping \
                      --host=invoice-ninja-mysql \
                      --port=3306 \
                      --user=ninja \
                      --protocol=tcp \
                      --connect-timeout=5 \
                      --silent >/dev/null 2>&1; then
                      ready=yes
                      break
                    fi
                    sleep 5
                  done
                  test "$ready" = yes

                  mysqldump \
                    --host=invoice-ninja-mysql \
                    --port=3306 \
                    --user=ninja \
                    --protocol=tcp \
                    --single-transaction \
                    --quick \
                    --skip-lock-tables \
                    --no-tablespaces \
                    --routines \
                    --events \
                    --triggers \
                    ninja > "$tmp"
                  test -s "$tmp"
                  mv "$tmp" "$target"
              env:
                - name: MYSQL_PWD
                  valueFrom:
                    secretKeyRef:
                      name: invoice-ninja-mysql
                      key: MYSQL_PASSWORD
              securityContext:
                runAsNonRoot: true
                runAsUser: 33
                runAsGroup: 33
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
                seccompProfile: { type: RuntimeDefault }
              resources:
                requests: { cpu: 25m, memory: 64Mi }
                limits: { cpu: 300m, memory: 256Mi }
              volumeMounts:
                - name: storage
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: storage
              persistentVolumeClaim:
                claimName: invoice-ninja-storage
            - name: tmp
              emptyDir: { sizeLimit: 256Mi }
