apiVersion: batch/v1
kind: Job
metadata:
  name: messages-migrate
  namespace: messages
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: messages-migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/suitenumerique/messages-backend:0.9.0
          command: ["python","manage.py","migrate","--noinput"]
          envFrom:
            - configMapRef:
                name: messages-config
            - secretRef:
                name: messages-runtime
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef: { name: messages-postgresql-app, key: host }
            - name: DB_PORT
              valueFrom:
                secretKeyRef: { name: messages-postgresql-app, key: port }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: messages-postgresql-app, key: dbname }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: messages-postgresql-app, key: user }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: messages-postgresql-app, key: password }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
