apiVersion: batch/v1
kind: Job
metadata:
  name: messages-migrate
  namespace: messages
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/suitenumerique/messages-backend:0.9.0
          command: ["python","manage.py","migrate","--noinput"]
          envFrom:
            - configMapRef:
                name: messages-config
            - secretRef:
                name: messages-runtime
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: messages-postgresql-app
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
