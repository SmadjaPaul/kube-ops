apiVersion: apps/v1
kind: Deployment
metadata:
  name: messages-web
  namespace: messages
  annotations:
    configmap.reloader.stakater.com/reload: "messages-config"
    secret.reloader.stakater.com/reload: "messages-runtime,messages-postgresql-app"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: messages-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: messages-web
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/suitenumerique/messages-backend:0.9.0
          envFrom:
            - configMapRef:
                name: messages-config
            - secretRef:
                name: messages-runtime
          env:
            - name: WORKER_CONCURRENCY
              value: "2"
            - name: DB_HOST
              valueFrom:
                secretKeyRef: { name: messages-postgresql-app, key: host }
            - name: DB_PORT
              valueFrom:
                secretKeyRef: { name: messages-postgresql-app, key: port }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: messages-postgresql-app, key: dbname }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: messages-postgresql-app, key: user }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: messages-postgresql-app, key: password }
          ports:
            - name: backend
              containerPort: 8000
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe:
            httpGet:
              path: /__heartbeat__/
              port: backend
              httpHeaders:
                - { name: Host, value: messages.smadja.dev }
                - { name: X-Forwarded-Proto, value: https }
            initialDelaySeconds: 15
            periodSeconds: 10
        - name: frontend
          image: ghcr.io/suitenumerique/messages-frontend:0.9.0
          env:
            - name: MESSAGES_FRONTEND_BACKEND_SERVER
              value: localhost:8000
            - name: DJANGO_ADMIN_URL
              value: admin
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /__lbheartbeat__, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: messages-worker
  namespace: messages
  annotations:
    configmap.reloader.stakater.com/reload: "messages-config"
    secret.reloader.stakater.com/reload: "messages-runtime,messages-postgresql-app"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: messages-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: messages-worker
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/suitenumerique/messages-backend:0.9.0
          command: ["python","worker.py","--loglevel=INFO"]
          envFrom:
            - configMapRef:
                name: messages-config
            - secretRef:
                name: messages-runtime
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef: { name: messages-postgresql-app, key: host }
            - name: DB_PORT
              valueFrom:
                secretKeyRef: { name: messages-postgresql-app, key: port }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: messages-postgresql-app, key: dbname }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: messages-postgresql-app, key: user }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: messages-postgresql-app, key: password }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 150m, memory: 384Mi }
            limits: { cpu: "1", memory: 1Gi }
