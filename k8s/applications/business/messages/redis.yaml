apiVersion: apps/v1
kind: Deployment
metadata:
  name: messages-redis
  namespace: messages
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: messages-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: messages-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server","--save","","--appendonly","no"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - { name: redis, containerPort: 6379 }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 384Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: messages-redis
  namespace: messages
spec:
  selector:
    app.kubernetes.io/name: messages-redis
  ports:
    - { name: redis, port: 6379, targetPort: redis }
