# PLT-152: runtime secret of Miniflux. DATABASE_URL is built here from the
# Doppler value of the pg-shared-homelab role password (the same key feeds
# the role Secret pg-shared-homelab-miniflux in the databases namespace; ESO
# cannot read a Secret across namespaces without a kubernetes-provider store,
# which the repository does not have). Names only; values live in Doppler cluster/prd.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miniflux-runtime
  namespace: miniflux
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: miniflux-runtime
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DATABASE_URL: "user=miniflux password={{ .DB_PASSWORD }} host=pg-shared-homelab-rw.databases.svc.cluster.local port=5432 dbname=miniflux sslmode=require"
        OAUTH2_CLIENT_SECRET: "{{ .OAUTH2_CLIENT_SECRET }}"
  data:
    - secretKey: DB_PASSWORD
      remoteRef: { key: PG_SHARED_HOMELAB_MINIFLUX_PASSWORD }
    - secretKey: OAUTH2_CLIENT_SECRET
      remoteRef: { key: APP_MINIFLUX_OIDC_CLIENT_SECRET }
