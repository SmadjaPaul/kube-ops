# PLT-152: runtime secret of Miniflux. DATABASE_URL is built from the role
# password generated in-cluster (databases/pg-shared-homelab-miniflux, read via
# SecretStore miniflux-db-source). OAUTH2 stays in miniflux-oidc (Doppler, human
# until the Authentik generator of #1594 is in place). Names only, no values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miniflux-runtime
  namespace: miniflux
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: miniflux-db-source
    kind: SecretStore
  target:
    name: miniflux-runtime
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DATABASE_URL: "user=miniflux password={{ .DB_PASSWORD }} host=pg-shared-homelab-rw.databases.svc.cluster.local port=5432 dbname=miniflux sslmode=require"
  data:
    - secretKey: DB_PASSWORD
      remoteRef: { key: pg-shared-homelab-miniflux, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miniflux-oidc
  namespace: miniflux
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: miniflux-oidc
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        OAUTH2_CLIENT_SECRET: "{{ .OAUTH2_CLIENT_SECRET }}"
  data:
    - secretKey: OAUTH2_CLIENT_SECRET
      remoteRef: { key: APP_MINIFLUX_OIDC_CLIENT_SECRET }
