apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniflux
  namespace: miniflux
  labels:
    app.kubernetes.io/name: miniflux
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: miniflux
  template:
    metadata:
      labels:
        app.kubernetes.io/name: miniflux
    spec:
      serviceAccountName: miniflux
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: miniflux/miniflux:2.3.5@sha256:8fd6c3c434ecc3d4083306f83e03c0bb74c632e0f8378da5ead7e1773b0b89c9
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: GF_SERVER_HTTP_PORT, value: "8080"}
            - {name: GF_SERVER_ROOT_URL, value: "https://miniflux.smadja.dev/"}
            - {name: GF_DATABASE_TYPE, value: postgres}
            - {name: GF_DATABASE_HOST, value: "pg-shared-homelab-rw.databases.svc.cluster.local:5432"}
            - {name: GF_DATABASE_NAME, value: "miniflux"}
            - {name: GF_DATABASE_USER, value: "miniflux"}
            - {name: GF_DATABASE_SSL_MODE, value: require}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_AUTH_GENERIC_OAUTH_ENABLED, value: "true"}
            - {name: GF_AUTH_GENERIC_OAUTH_NAME, value: Authentik}
            - {name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID, value: "miniflux"}
            - {name: GF_AUTH_GENERIC_OAUTH_SCOPES, value: "openid email profile"}
            - {name: GF_AUTH_GENERIC_OAUTH_AUTH_URL, value: "https://auth.smadja.dev/application/o/miniflux/authorize/"}
            - {name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL, value: "https://auth.smadja.dev/application/o/miniflux/token/"}
            - {name: GF_AUTH_GENERIC_OAUTH_API_URL, value: "https://auth.smadja.dev/application/o/miniflux/userinfo/"}
            - {name: GF_AUTH_GENERIC_OAUTH_USE_PKCE, value: "true"}
          envFrom:
            - secretRef: {name: miniflux-db}
            - secretRef: {name: miniflux-oidc}
            - secretRef: {name: miniflux-secret-key}
            - secretRef: {name: miniflux-admin}
          readinessProbe:
            httpGet: {path: "/", port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: "/", port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: grafana-data, mountPath: /var/lib/grafana}
            - {name: grafana-logs, mountPath: /var/log/grafana}
            - {name: tmp, mountPath: /tmp}
      volumes:
        # Etat durable dans PostgreSQL : ces volumes sont des emptyDir (plugins, cache).
        - {name: grafana-data, emptyDir: {}}
        - {name: grafana-logs, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
