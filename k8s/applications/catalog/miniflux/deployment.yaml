apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniflux
  namespace: miniflux
  annotations:
    secret.reloader.stakater.com/reload: "miniflux-runtime"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: miniflux
  template:
    metadata:
      labels:
        app.kubernetes.io/name: miniflux
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: miniflux
          image: miniflux/miniflux:2.3.5@sha256:8fd6c3c434ecc3d4083306f83e03c0bb74c632e0f8378da5ead7e1773b0b89c9
          envFrom:
            - secretRef:
                name: miniflux-runtime
            - secretRef:
                name: miniflux-oidc
          env:
            - { name: BASE_URL, value: "https://rss.smadja.dev" }
            - { name: LISTEN_ADDR, value: "0.0.0.0:8080" }
            # Schema migrations are forward-only; safe to re-run (idempotent) at each start.
            - { name: RUN_MIGRATIONS, value: "1" }
            - { name: DATABASE_MAX_CONNS, value: "5" }
            - { name: OAUTH2_PROVIDER, value: "oidc" }
            - { name: OAUTH2_OIDC_PROVIDER_NAME, value: "Authentik" }
            - { name: OAUTH2_OIDC_DISCOVERY_ENDPOINT, value: "https://auth.smadja.dev/application/o/miniflux/" }
            - { name: OAUTH2_CLIENT_ID, value: "miniflux" }
            - { name: OAUTH2_REDIRECT_URL, value: "https://rss.smadja.dev/oauth2/oidc/callback" }
            - { name: OAUTH2_USER_CREATION, value: "1" }
            # Access is bound to the Authentik group family in the blueprint (auth PR), never per user.
            - { name: OAUTH2_ADDITIONAL_SCOPES, value: "groups" }
            - { name: OAUTH2_GROUP_CLAIM, value: "groups" }
            - { name: OAUTH2_ADMIN_GROUP, value: "authentik-admins" }
          ports:
            - { name: http, containerPort: 8080 }
          livenessProbe:
            httpGet: { path: /liveness, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /readiness, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: "500m", memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
