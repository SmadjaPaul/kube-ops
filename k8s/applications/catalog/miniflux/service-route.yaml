# LAN only (Gateway/internal). The family group is not on the LAN, so any
# public route on Gateway/external is a separate MANDAT, not part of this PR.
apiVersion: v1
kind: Service
metadata:
  name: miniflux
  namespace: miniflux
spec:
  selector: { app.kubernetes.io/name: miniflux }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: miniflux
  namespace: miniflux
spec:
  parentRefs:
    - { name: internal, namespace: gateway }
  hostnames: [rss.smadja.dev]
  rules:
    - backendRefs:
        - { name: miniflux, port: 80 }
