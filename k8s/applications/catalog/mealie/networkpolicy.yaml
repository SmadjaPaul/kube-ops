apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: mealie, namespace: mealie }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: mealie } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: gateway }
      ports:
        - { protocol: TCP, port: 9000 }
