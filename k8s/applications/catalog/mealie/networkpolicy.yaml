apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: { name: mealie, namespace: mealie }
spec:
  endpointSelector: { matchLabels: { app.kubernetes.io/name: mealie } }
  ingress:
    # Native SparkyFitness recipe lookup; no cross-namespace broad access.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: wellness
            sparkyfitness.io/server: "true"
      toPorts:
        - ports:
            - { protocol: TCP, port: "9000" }
    - fromEntities: [host, remote-node, ingress]
      toPorts:
        - ports:
            - { protocol: TCP, port: "9000" }
