apiVersion: v1
kind: Service
metadata:
  name: mealie
  namespace: mealie
spec:
  selector: { app.kubernetes.io/name: mealie }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mealie
  namespace: mealie
spec:
  parentRefs:
    - { name: external, namespace: gateway }
    - { name: internal, namespace: gateway }
  hostnames: [mealie.smadja.dev]
  rules:
    - backendRefs:
        - { name: mealie, port: 80 }
