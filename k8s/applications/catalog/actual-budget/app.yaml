apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: actual-data
  namespace: actual-budget
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-fast
  resources:
    requests: { storage: 5Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual
  namespace: actual-budget
spec:
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: actual }
  template:
    metadata:
      labels: { app.kubernetes.io/name: actual }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: actual
          image: actualbudget/actual-server:26.9.0
          env:
            - { name: ACTUAL_PORT, value: "5006" }
            - { name: ACTUAL_HOSTNAME, value: "0.0.0.0" }
          ports:
            - { name: http, containerPort: 5006 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /, port: http }
          livenessProbe:
            httpGet: { path: /, port: http }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: actual-data }
---
apiVersion: v1
kind: Service
metadata: { name: actual, namespace: actual-budget }
spec:
  selector: { app.kubernetes.io/name: actual }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: actual, namespace: actual-budget }
spec:
  parentRefs:
    - { name: internal, namespace: gateway }
  hostnames: [budget.smadja.dev]
  rules:
    - backendRefs:
        - { name: actual, port: 80 }
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: { name: actual, namespace: actual-budget }
spec:
  endpointSelector: { matchLabels: { app.kubernetes.io/name: actual } }
  ingress:
    # Cilium Gateway Envoy runs hostNetwork; its connection to the backend
    # therefore carries the host identity, not the gateway namespace identity.
    - fromEntities: [host, remote-node, ingress]
      toPorts:
        - ports: [{ protocol: TCP, port: "5006" }]
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: gateway }
      toPorts:
        - ports: [{ protocol: TCP, port: "5006" }]
