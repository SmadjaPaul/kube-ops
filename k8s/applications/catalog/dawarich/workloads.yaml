apiVersion: apps/v1
kind: Deployment
metadata:
  name: dawarich
  namespace: dawarich
  annotations:
    secret.reloader.stakater.com/reload: "dawarich-runtime"
spec:
  # V1 dormant: keep the Deployment and PVC references for reversible reactivation.
  replicas: 0
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: dawarich }
  template:
    metadata:
      labels: { app.kubernetes.io/name: dawarich }
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Longhorn-backed PVCs contain an ext4 `lost+found` directory owned
        # by root. The upstream entrypoint chowns recursively and fails with
        # EPERM on lost+found because capabilities are dropped. Pre-chown
        # as root with CAP_CHOWN, then the upstream entrypoint skips its
        # chown because the directory is already owned by 1000:1000.
        - name: fix-volume-permissions
          image: busybox:1.37
          command: ["sh","-c"]
          args:
            - >-
              chown -R 1000:1000
              /var/app/public
              /var/app/storage
              /var/app/tmp
              /var/app/db
              /var/app/log
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - { name: public, mountPath: /var/app/public }
            - { name: storage, mountPath: /var/app/storage }
            - { name: tmp, mountPath: /var/app/tmp }
            - { name: db, mountPath: /var/app/db }
            - { name: log, mountPath: /var/app/log }
        # On a fresh CNPG cluster the schema is empty. The upstream Rails
        # boot initializers (feature_flags / Flipper) query
        # `flipper_features` before migrations finish, so the web pod
        # exits 0 cleanly and CrashLoops. db:prepare is the upstream
        # idempotent idiom: create DB if missing, else migrate. Wait for
        # the CNPG primary, then prepare. Run as root so createdb can
        # create the database if needed.
        - name: db-prepare
          image: freikin/dawarich:1.15.2
          command: ["sh","-c"]
          args:
            - >-
              until PGPASSWORD=$DATABASE_PASSWORD
              psql -h "$DATABASE_HOST" -p "$DATABASE_PORT"
              -U "$DATABASE_USERNAME" -d postgres -c '\q' 2>/dev/null;
              do >&2 echo "postgres unavailable, retrying..."; sleep 2; done;
              >&2 echo "postgres reachable, running db:prepare";
              bundle exec rails db:prepare
          env:
            - { name: RAILS_ENV, value: "production" }
            - { name: REDIS_URL, value: "redis://dawarich-redis:6379" }
            - { name: DATABASE_HOST, value: "dawarich-postgis" }
            - { name: DATABASE_PORT, value: "5432" }
            - { name: DATABASE_USERNAME, value: "dawarich" }
            - { name: DATABASE_NAME, value: "dawarich" }
            - name: DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: dawarich-runtime, key: POSTGRES_PASSWORD } }
            - name: SECRET_KEY_BASE
              valueFrom: { secretKeyRef: { name: dawarich-runtime, key: SECRET_KEY_BASE } }
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN","FOWNER","DAC_OVERRIDE"]
      containers:
        - name: web
          image: freikin/dawarich:1.15.2
          command: ["web-entrypoint.sh"]
          args: ["bundle","exec","rails","server","-p","3000","-b","::"]
          env:
            - { name: RAILS_ENV, value: "production" }
            - { name: REDIS_URL, value: "redis://dawarich-redis:6379" }
            - { name: DATABASE_HOST, value: "dawarich-postgis" }
            - { name: DATABASE_PORT, value: "5432" }
            - { name: DATABASE_USERNAME, value: "dawarich" }
            - { name: DATABASE_NAME, value: "dawarich" }
            - name: DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: dawarich-runtime, key: POSTGRES_PASSWORD } }
            - name: SECRET_KEY_BASE
              valueFrom: { secretKeyRef: { name: dawarich-runtime, key: SECRET_KEY_BASE } }
            - { name: APPLICATION_HOSTS, value: "dawarich.smadja.dev" }
            - { name: APPLICATION_PROTOCOL, value: "https" }
            - { name: TIME_ZONE, value: "Europe/Paris" }
            - { name: SELF_HOSTED, value: "true" }
            - { name: STORE_GEODATA, value: "true" }
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: WEB_CONCURRENCY, value: "1" }
          ports: [{ name: http, containerPort: 3000 }]
          securityContext:
            allowPrivilegeEscalation: false
            # Add back only the capabilities the upstream image needs to
            # honor PUID/PGID privilege drop (gosu uses SETUID/SETGID).
            # drop ALL still satisfies the NSA hardening policy.
            capabilities:
              drop: ["ALL"]
              add: ["SETUID","SETGID"]
          resources:
            requests: { cpu: 150m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
          volumeMounts:
            - { name: storage, mountPath: /var/app/storage }
            - { name: public, mountPath: /var/app/public }
            - { name: tmp, mountPath: /var/app/tmp }
            - { name: db, mountPath: /var/app/db }
            - { name: log, mountPath: /var/app/log }
      volumes:
        - name: storage
          persistentVolumeClaim: { claimName: dawarich-storage }
        - name: public
          persistentVolumeClaim: { claimName: dawarich-public }
        - name: tmp
          emptyDir: { sizeLimit: 2Gi }
        - name: db
          emptyDir: { sizeLimit: 512Mi }
        - name: log
          emptyDir: { sizeLimit: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dawarich-sidekiq
  namespace: dawarich
  annotations:
    secret.reloader.stakater.com/reload: "dawarich-runtime"
spec:
  # V1 dormant: keep the worker manifest; no background compute is required now.
  replicas: 0
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: dawarich-sidekiq }
  template:
    metadata:
      labels: { app.kubernetes.io/name: dawarich-sidekiq }
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: fix-volume-permissions
          image: busybox:1.37
          command: ["sh","-c"]
          args:
            - >-
              chown -R 1000:1000
              /var/app/public
              /var/app/storage
              /var/app/tmp
              /var/app/db
              /var/app/log
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - { name: public, mountPath: /var/app/public }
            - { name: storage, mountPath: /var/app/storage }
            - { name: tmp, mountPath: /var/app/tmp }
            - { name: db, mountPath: /var/app/db }
            - { name: log, mountPath: /var/app/log }
        # Idempotent db:prepare: creates the DB if missing, otherwise
        # applies pending migrations. Same as the web init so Sidekiq
        # doesn't race the web on schema introspection.
        - name: db-prepare
          image: freikin/dawarich:1.15.2
          command: ["sh","-c"]
          args:
            - >-
              until PGPASSWORD=$DATABASE_PASSWORD
              psql -h "$DATABASE_HOST" -p "$DATABASE_PORT"
              -U "$DATABASE_USERNAME" -d postgres -c '\q' 2>/dev/null;
              do >&2 echo "postgres unavailable, retrying..."; sleep 2; done;
              >&2 echo "postgres reachable, running db:prepare";
              bundle exec rails db:prepare
          env:
            - { name: RAILS_ENV, value: "production" }
            - { name: DATABASE_HOST, value: "dawarich-postgis" }
            - { name: DATABASE_PORT, value: "5432" }
            - { name: DATABASE_USERNAME, value: "dawarich" }
            - { name: DATABASE_NAME, value: "dawarich" }
            - name: DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: dawarich-runtime, key: POSTGRES_PASSWORD } }
            - name: SECRET_KEY_BASE
              valueFrom: { secretKeyRef: { name: dawarich-runtime, key: SECRET_KEY_BASE } }
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN","FOWNER","DAC_OVERRIDE"]
      containers:
        - name: sidekiq
          image: freikin/dawarich:1.15.2
          command: ["sidekiq-entrypoint.sh"]
          args: []
          env:
            - { name: RAILS_ENV, value: "production" }
            - { name: REDIS_URL, value: "redis://dawarich-redis:6379" }
            - { name: DATABASE_HOST, value: "dawarich-postgis" }
            - { name: DATABASE_PORT, value: "5432" }
            - { name: DATABASE_USERNAME, value: "dawarich" }
            - { name: DATABASE_NAME, value: "dawarich" }
            - name: DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: dawarich-runtime, key: POSTGRES_PASSWORD } }
            - name: SECRET_KEY_BASE
              valueFrom: { secretKeyRef: { name: dawarich-runtime, key: SECRET_KEY_BASE } }
            - { name: APPLICATION_HOSTS, value: "dawarich.smadja.dev" }
            - { name: APPLICATION_PROTOCOL, value: "https" }
            - { name: TIME_ZONE, value: "Europe/Paris" }
            - { name: SELF_HOSTED, value: "true" }
            - { name: STORE_GEODATA, value: "true" }
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: BACKGROUND_PROCESSING_CONCURRENCY, value: "3" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["SETUID","SETGID"]
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { cpu: "1", memory: 1536Mi }
          volumeMounts:
            - { name: storage, mountPath: /var/app/storage }
            - { name: public, mountPath: /var/app/public }
            - { name: tmp, mountPath: /var/app/tmp }
            - { name: db, mountPath: /var/app/db }
            - { name: log, mountPath: /var/app/log }
      volumes:
        - name: storage
          persistentVolumeClaim: { claimName: dawarich-storage }
        - name: public
          persistentVolumeClaim: { claimName: dawarich-public }
        - name: tmp
          emptyDir: { sizeLimit: 2Gi }
        - name: db
          emptyDir: { sizeLimit: 512Mi }
        - name: log
          emptyDir: { sizeLimit: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: dawarich, namespace: dawarich }
spec:
  selector: { app.kubernetes.io/name: dawarich }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: dawarich, namespace: dawarich }
spec:
  parentRefs: [{ name: internal, namespace: gateway }]
  hostnames: [dawarich.smadja.dev]
  rules:
    - backendRefs: [{ name: dawarich, port: 80 }]
