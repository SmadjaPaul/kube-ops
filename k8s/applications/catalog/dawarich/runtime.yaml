apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: dawarich-runtime, namespace: dawarich }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: doppler-cluster, kind: ClusterSecretStore }
  target: { name: dawarich-runtime, creationPolicy: Owner }
  data:
    - secretKey: SECRET_KEY_BASE
      remoteRef: { key: APP_DAWARICH_SECRET_KEY_BASE }
    - secretKey: POSTGRES_PASSWORD
      remoteRef: { key: APP_DAWARICH_POSTGRES_PASSWORD }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: dawarich-redis, namespace: dawarich }
spec:
  # V1 dormant: Redis is disposable cache/queue state and has no persistence.
  replicas: 0
  selector:
    matchLabels: { app.kubernetes.io/name: dawarich-redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: dawarich-redis }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server","--save","","--appendonly","no"]
          ports: [{ name: redis, containerPort: 6379 }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: dawarich-redis, namespace: dawarich }
spec:
  selector: { app.kubernetes.io/name: dawarich-redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
