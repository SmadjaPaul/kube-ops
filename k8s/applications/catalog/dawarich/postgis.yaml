apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: dawarich-postgis, namespace: dawarich }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-fast
  resources:
    requests: { storage: 20Gi }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: dawarich-postgis, namespace: dawarich }
spec:
  serviceName: dawarich-postgis
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: dawarich-postgis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: dawarich-postgis }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgis/postgis:17-3.5-alpine
          env:
            - { name: POSTGRES_DB, value: dawarich }
            - { name: POSTGRES_USER, value: dawarich }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: dawarich-runtime, key: POSTGRES_PASSWORD } }
          ports: [{ name: postgres, containerPort: 5432 }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: dawarich-postgis }
        - name: run
          emptyDir: { sizeLimit: 32Mi }
---
apiVersion: v1
kind: Service
metadata: { name: dawarich-postgis, namespace: dawarich }
spec:
  selector: { app.kubernetes.io/name: dawarich-postgis }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
