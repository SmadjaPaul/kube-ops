apiVersion: v1
kind: Namespace
metadata:
  name: searxng
  labels:
    # SearXNG upstream image still ships USER root as of 2026.9.30.
    # Pin enforce to baseline so the pod is admitted; rootless revisit post-V1.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
