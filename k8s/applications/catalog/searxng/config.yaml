apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: searxng
data:
  settings.yml: |
    use_default_settings: true
    server:
      bind_address: "0.0.0.0"
      port: 8080
      base_url: "https://search.smadja.dev/"
      limiter: false
      image_proxy: true
    search:
      safe_search: 0
      autocomplete: ""
    ui:
      static_use_hash: true
