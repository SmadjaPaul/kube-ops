apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: searxng
  annotations:
    configmap.reloader.stakater.com/reload: "searxng-config"
    secret.reloader.stakater.com/reload: "searxng-runtime"
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: searxng }
  template:
    metadata:
      labels: { app.kubernetes.io/name: searxng }
    spec:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: searxng
          image: searxng/searxng:2026.9.30-a9d990033
          envFrom:
            - secretRef: { name: searxng-runtime }
          ports:
            - { name: http, containerPort: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 768Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/searxng/settings.yml, subPath: settings.yml, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: searxng-config }
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
---
apiVersion: v1
kind: Service
metadata: { name: searxng, namespace: searxng }
spec:
  selector: { app.kubernetes.io/name: searxng }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: searxng, namespace: searxng }
spec:
  parentRefs:
    - { name: internal, namespace: gateway }
  hostnames: [search.smadja.dev]
  rules:
    - backendRefs:
        - { name: keda-add-ons-http-interceptor-proxy, namespace: keda, port: 8080 }
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: { name: searxng, namespace: searxng }
spec:
  endpointSelector: { matchLabels: { app.kubernetes.io/name: searxng } }
  ingress:
    # Cilium Gateway Envoy runs hostNetwork; its connection to the backend
    # therefore carries the host identity, not the gateway namespace identity.
    - fromEntities: [host, remote-node, ingress]
      toPorts:
        - ports: [{ protocol: TCP, port: "8080" }]
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: gateway }
      toPorts:
        - ports: [{ protocol: TCP, port: "8080" }]
    # KEDA HTTP interceptor becomes the reverse proxy for scale-to-zero traffic.
    # Allow only interceptor pods from the keda namespace to reach SearXNG.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: keda
            k8s:app.kubernetes.io/name: http-add-on
            k8s:app.kubernetes.io/component: interceptor
      toPorts:
        - ports: [{ protocol: TCP, port: "8080" }]
