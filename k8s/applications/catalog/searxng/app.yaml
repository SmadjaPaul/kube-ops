apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: searxng
  annotations:
    configmap.reloader.stakater.com/reload: "searxng-config"
    secret.reloader.stakater.com/reload: "searxng-runtime"
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: searxng }
  template:
    metadata:
      labels: { app.kubernetes.io/name: searxng }
    spec:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: searxng
          image: searxng/searxng:2026.9.30-a9d990033
          envFrom:
            - secretRef: { name: searxng-runtime }
          ports:
            - { name: http, containerPort: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 768Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/searxng/settings.yml, subPath: settings.yml, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: searxng-config }
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
---
apiVersion: v1
kind: Service
metadata: { name: searxng, namespace: searxng }
spec:
  selector: { app.kubernetes.io/name: searxng }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: searxng, namespace: searxng }
spec:
  parentRefs:
    - { name: internal, namespace: gateway }
  hostnames: [search.smadja.dev]
  rules:
    - backendRefs:
        - { name: searxng, port: 80 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: searxng, namespace: searxng }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: searxng } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: gateway }
      ports:
        - { protocol: TCP, port: 8080 }
