apiVersion: v1
kind: Service
metadata: { name: vikunja, namespace: vikunja }
spec:
  selector: { app.kubernetes.io/name: vikunja }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: vikunja, namespace: vikunja }
spec:
  parentRefs:
    - { name: external, namespace: gateway }
    - { name: internal, namespace: gateway }
  hostnames: [tasks.smadja.dev]
  rules:
    - backendRefs:
        - { name: vikunja, port: 80 }
