# Contrat de test (PLT-392) : OIDC natif, la racine / sert la page de login ou le SPA (200).
# La sonde runtime vise un endpoint protege, qui repond 401 sans cookie.
auth: oidc
auth_probe: /api/v1/tasks
exceptions:
  observability: "base CNPG surveillee par le PodMonitor central monitoring/cnpg-instances ; l'app n'expose pas de metrics, couverture generique kube-prometheus-stack (KubePodCrashLooping, KubePodNotReady)"
  rootfs: "l'image ecrit hors des volumes montes (caches/runtime) : readOnlyRootFilesystem non valide sur cluster ; le reste du securityContext est conforme"
