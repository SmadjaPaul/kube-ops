apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-hetzner-credentials
  namespace: vikunja
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: cnpg-hetzner-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: HETZNER_S3_ACCESS_KEY_ID }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: HETZNER_S3_SECRET_ACCESS_KEY }
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: vikunja-hetzner-store
  namespace: vikunja
spec:
  retentionPolicy: "14d"
  configuration:
    destinationPath: s3://smadja-dev-homelab-backups/cnpg/vikunja
    endpointURL: https://fsn1.your-objectstorage.com
    s3Credentials:
      accessKeyId: { name: cnpg-hetzner-credentials, key: AWS_ACCESS_KEY_ID }
      secretAccessKey: { name: cnpg-hetzner-credentials, key: AWS_SECRET_ACCESS_KEY }
    wal: { compression: gzip, maxParallel: 2 }
    data: { compression: gzip }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: vikunja-postgresql-weekly
  namespace: vikunja
spec:
  schedule: "0 30 6 * * 0"
  backupOwnerReference: self
  cluster: { name: vikunja-postgresql }
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters: { barmanObjectName: vikunja-hetzner-store }
