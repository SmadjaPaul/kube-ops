apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: vikunja-postgresql-weekly
  namespace: vikunja
spec:
  schedule: "0 30 6 * * 0"
  backupOwnerReference: self
  cluster: { name: vikunja-postgresql }
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    # PLT-221: base backups follow the WAL archive to R2.
    parameters: { barmanObjectName: vikunja-r2-store }
