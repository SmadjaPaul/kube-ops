apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: paperless-data, namespace: paperless }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: proxmox-csi
  resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: paperless-media, namespace: paperless }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: proxmox-csi
  resources: { requests: { storage: 20Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless
  annotations:
    secret.reloader.stakater.com/reload: "paperless-runtime,paperless-postgresql-app"
spec:
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: paperless }
  template:
    metadata:
      labels: { app.kubernetes.io/name: paperless }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: paperless
          image: ghcr.io/paperless-ngx/paperless-ngx:3.2.1
          env:
            - { name: PAPERLESS_URL, value: "https://paperless.smadja.dev" }
            - { name: PAPERLESS_REDIS, value: "redis://paperless-redis:6379" }
            - { name: PAPERLESS_DBENGINE, value: "postgresql" }
            - name: PAPERLESS_DBHOST
              valueFrom: { secretKeyRef: { name: paperless-postgresql-app, key: host } }
            - name: PAPERLESS_DBNAME
              valueFrom: { secretKeyRef: { name: paperless-postgresql-app, key: dbname } }
            - name: PAPERLESS_DBUSER
              valueFrom: { secretKeyRef: { name: paperless-postgresql-app, key: user } }
            - name: PAPERLESS_DBPASS
              valueFrom: { secretKeyRef: { name: paperless-postgresql-app, key: password } }
            - name: PAPERLESS_SECRET_KEY
              valueFrom: { secretKeyRef: { name: paperless-runtime, key: PAPERLESS_SECRET_KEY } }
            - { name: PAPERLESS_TIME_ZONE, value: "Europe/Paris" }
            - { name: PAPERLESS_OCR_LANGUAGE, value: "fra+eng" }
          ports: [{ name: http, containerPort: 8000 }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          volumeMounts:
            - { name: data, mountPath: /usr/src/paperless/data }
            - { name: media, mountPath: /usr/src/paperless/media }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: paperless-data }
        - name: media
          persistentVolumeClaim: { claimName: paperless-media }
        - name: tmp
          emptyDir: { sizeLimit: 2Gi }
---
apiVersion: v1
kind: Service
metadata: { name: paperless, namespace: paperless }
spec:
  selector: { app.kubernetes.io/name: paperless }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: paperless, namespace: paperless }
spec:
  parentRefs: [{ name: internal, namespace: gateway }]
  hostnames: [paperless.smadja.dev]
  rules:
    - backendRefs: [{ name: paperless, port: 80 }]
