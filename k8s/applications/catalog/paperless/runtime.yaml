apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: paperless-runtime, namespace: paperless }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: doppler-cluster, kind: ClusterSecretStore }
  target: { name: paperless-runtime, creationPolicy: Owner }
  data:
    - secretKey: PAPERLESS_SECRET_KEY
      remoteRef: { key: APP_PAPERLESS_SECRET_KEY }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: paperless-redis, namespace: paperless }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: paperless-redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: paperless-redis }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: valkey/valkey:9-alpine
          args: ["valkey-server","--save","","--appendonly","no"]
          ports: [{ name: redis, containerPort: 6379 }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: paperless-redis, namespace: paperless }
spec:
  selector: { app.kubernetes.io/name: paperless-redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
