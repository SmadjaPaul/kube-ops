apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperless-postgresql
  namespace: paperless
spec:
  instances: 1
  bootstrap:
    initdb:
      database: paperless
      owner: paperless
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: paperless-hetzner-store
  storage:
    size: 10Gi
    storageClass: proxmox-csi
  affinity:
    enablePodAntiAffinity: false
