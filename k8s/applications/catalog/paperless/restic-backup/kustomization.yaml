# PLT-286: client-side encrypted restic backups of Paperless (documents + database)
# to R2 bucket homelab-backup-restic, repository paperless/.
#
# ACTIVE since the PLT-286 activation PR (`- restic-backup` in
# ../kustomization.yaml). Prerequisites, all required before merge:
#   1. homelab-infra ARC apply of grafana-cloud: Doppler cluster/prd
#      RESTIC_BACKUP_PASSWORD (random, generated by OpenTofu);
#   2. homelab-infra ARC apply of cloudflare-r2: bucket homelab-backup-restic;
#   3. R2 writer identity in Doppler cluster/prd R2_RESTIC_WRITER_*;
#   4. Paul's paper copy of the password, confirmed on PLT-264.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: paperless
resources:
  - externalsecret.yaml
  - networkpolicy.yaml
  - cronjob-backup.yaml
  - cronjob-maintenance.yaml
components:
  - ../../../../components/restic-backup
