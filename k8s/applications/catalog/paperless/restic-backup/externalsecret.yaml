# PLT-286: restic repository access for Paperless. Doppler cluster/prd:
#   RESTIC_BACKUP_PASSWORD       generated by homelab-infra (grafana-cloud root);
#   R2_RESTIC_WRITER_*           Object Read & Write on homelab-backup-restic only;
#   R2_S3_ENDPOINT               existing; keeps the account id out of Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-backup
  namespace: paperless
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: restic-backup
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RESTIC_REPOSITORY: "s3:{{ .endpoint }}/homelab-backup-restic/paperless"
        RESTIC_PASSWORD: "{{ .password }}"
        AWS_ACCESS_KEY_ID: "{{ .accessKeyId }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secretAccessKey }}"
  data:
    - secretKey: password
      remoteRef:
        key: RESTIC_BACKUP_PASSWORD
    - secretKey: accessKeyId
      remoteRef:
        key: R2_RESTIC_WRITER_ACCESS_KEY_ID
    - secretKey: secretAccessKey
      remoteRef:
        key: R2_RESTIC_WRITER_SECRET_ACCESS_KEY
    - secretKey: endpoint
      remoteRef:
        key: R2_S3_ENDPOINT
