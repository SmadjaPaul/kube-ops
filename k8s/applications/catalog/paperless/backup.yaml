apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata: { name: paperless-postgresql-weekly, namespace: paperless }
spec:
  schedule: "0 30 6 * * 0"
  backupOwnerReference: self
  cluster: { name: paperless-postgresql }
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    # PLT-244: base backups follow the WAL archive to R2.
    parameters: { barmanObjectName: paperless-r2-store }
