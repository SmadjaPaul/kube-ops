apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: stirling-config, namespace: stirling-pdf }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-fast
  resources:
    requests: { storage: 2Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
spec:
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: stirling-pdf }
  template:
    metadata:
      labels: { app.kubernetes.io/name: stirling-pdf }
    spec:
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: fix-volume-permissions
          image: busybox:1.37
          command: ["sh", "-c"]
          args:
            - >-
              chown -R 1001:1001
              /configs
              /logs
              /customFiles
              /pipeline
              /storage
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - { name: config, mountPath: /configs }
            - { name: logs, mountPath: /logs }
            - { name: custom-files, mountPath: /customFiles }
            - { name: pipeline, mountPath: /pipeline }
            - { name: storage, mountPath: /storage }
      containers:
        - name: stirling-pdf
          image: stirlingtools/stirling-pdf:3.0.0
          env:
            - { name: SECURITY_ENABLELOGIN, value: "false" }
            - { name: PUID, value: "1001" }
            - { name: PGID, value: "1001" }
          ports:
            - { name: http, containerPort: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          volumeMounts:
            - { name: config, mountPath: /configs }
            - { name: logs, mountPath: /logs }
            - { name: custom-files, mountPath: /customFiles }
            - { name: pipeline, mountPath: /pipeline }
            - { name: storage, mountPath: /storage }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          persistentVolumeClaim: { claimName: stirling-config }
        - name: logs
          emptyDir: { sizeLimit: 256Mi }
        - name: custom-files
          emptyDir: { sizeLimit: 256Mi }
        - name: pipeline
          emptyDir: { sizeLimit: 512Mi }
        - name: storage
          emptyDir: { sizeLimit: 1Gi }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
---
apiVersion: v1
kind: Service
metadata: { name: stirling-pdf, namespace: stirling-pdf }
spec:
  selector: { app.kubernetes.io/name: stirling-pdf }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: stirling-pdf, namespace: stirling-pdf }
spec:
  parentRefs:
    - { name: internal, namespace: gateway }
  hostnames: [pdf.smadja.dev]
  rules:
    - backendRefs:
        - { name: stirling-pdf, port: 80 }
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: { name: stirling-pdf, namespace: stirling-pdf }
spec:
  endpointSelector: { matchLabels: { app.kubernetes.io/name: stirling-pdf } }
  ingress:
    # Cilium Gateway Envoy runs hostNetwork; its connection to the backend
    # carries the host identity rather than the gateway namespace identity.
    - fromEntities: [host, remote-node, ingress]
      toPorts:
        - ports: [{ protocol: TCP, port: "8080" }]
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: gateway }
      toPorts:
        - ports: [{ protocol: TCP, port: "8080" }]
