apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stirling-config
  namespace: stirling-pdf
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-fast
  resources:
    requests: { storage: 2Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
spec:
  strategy: { type: Recreate }
  # Replica count is controlled by the KEDA ScaledObject (minReplicaCount 0); do not pin it in GitOps.
  selector:
    matchLabels: { app.kubernetes.io/name: stirling-pdf }
  template:
    metadata:
      labels: { app.kubernetes.io/name: stirling-pdf }
    spec:
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: fix-volume-permissions
          image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          command: ["sh", "-c"]
          args:
            - >-
              chown -R 1001:1001
              /configs
              /logs
              /customFiles
              /pipeline
              /storage
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - { name: config, mountPath: /configs }
            - { name: logs, mountPath: /logs }
            - { name: custom-files, mountPath: /customFiles }
            - { name: pipeline, mountPath: /pipeline }
            - { name: storage, mountPath: /storage }
      containers:
        - name: stirling-pdf
          image: stirlingtools/stirling-pdf:3.4.0@sha256:972ffc10fbd63a9e7178253a49050c7658e0d4e03b2701005c3e12e210d2e068
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
            failureThreshold: 3
          env:
            - { name: SECURITY_ENABLELOGIN, value: "false" }
            - { name: PUID, value: "1001" }
            - { name: PGID, value: "1001" }
            # RAM : JVM inactive ~675 Mo ; GC serie et heap rendu a l'OS (revue RAM 23/11).
            - { name: JAVA_TOOL_OPTIONS, value: "-XX:+UseSerialGC -XX:MaxRAMPercentage=50 -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=30 -Xss512k" }
          ports:
            - { name: http, containerPort: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 50m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          volumeMounts:
            - { name: config, mountPath: /configs }
            - { name: logs, mountPath: /logs }
            - { name: custom-files, mountPath: /customFiles }
            - { name: pipeline, mountPath: /pipeline }
            - { name: storage, mountPath: /storage }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          persistentVolumeClaim: { claimName: stirling-config }
        - name: logs
          emptyDir: { sizeLimit: 256Mi }
        - name: custom-files
          emptyDir: { sizeLimit: 256Mi }
        - name: pipeline
          emptyDir: { sizeLimit: 512Mi }
        - name: storage
          emptyDir: { sizeLimit: 1Gi }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
---
apiVersion: v1
kind: Service
metadata: { name: stirling-pdf, namespace: stirling-pdf }
spec:
  selector: { app.kubernetes.io/name: stirling-pdf }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: stirling-pdf, namespace: stirling-pdf }
spec:
  parentRefs:
    - { name: internal, namespace: gateway }
  hostnames: [pdf.smadja.dev]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # KEDA HTTP add-on: the interception proxy wakes the app (scale-to-zero) then relays.
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: { name: stirling-pdf, namespace: stirling-pdf }
spec:
  endpointSelector: { matchLabels: { app.kubernetes.io/name: stirling-pdf } }
  ingress:
    # Cilium Gateway Envoy runs hostNetwork; its connection to the backend
    # carries the host identity rather than the gateway namespace identity.
    - fromEntities: [host, remote-node, ingress]
      toPorts:
        - ports: [{ protocol: TCP, port: "8080" }]
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: gateway }
      toPorts:
        - ports: [{ protocol: TCP, port: "8080" }]
    # KEDA HTTP add-on: the interceptor (namespace keda) relays the request to the woken pod.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: keda
            app.kubernetes.io/name: http-add-on
            app.kubernetes.io/component: interceptor
      toPorts:
        - ports: [{ protocol: TCP, port: "8080" }]
