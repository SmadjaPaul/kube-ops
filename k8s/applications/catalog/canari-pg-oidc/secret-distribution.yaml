# Distribution des credentials sans donner de Secret au pod.
# - SA dedie aux SecretStore ESO (PAS le SA du pod, qui n'a aucun droit sur les Secrets).
# - SecretStore pg-source : lit UNIQUEMENT pg-shared-homelab-canari-pg-oidc dans databases (Role get, resourceNames).
# - SecretStore auth-source : lit UNIQUEMENT authentik-blueprint-canari-pg-oidc dans auth (Role get, resourceNames).
# - Secrets propres a l'application : generes dans le namespace (Password CreatedOnce), aucun Secret tiers.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: canari-pg-oidc-secret-reader
  namespace: canari-pg-oidc
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: canari-pg-oidc-pg-source
  namespace: canari-pg-oidc
spec:
  provider:
    kubernetes:
      remoteNamespace: databases
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: canari-pg-oidc-secret-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: canari-pg-oidc-auth-source
  namespace: canari-pg-oidc
spec:
  provider:
    kubernetes:
      remoteNamespace: auth
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: canari-pg-oidc-secret-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: canari-pg-oidc-db
  namespace: canari-pg-oidc
spec:
  refreshInterval: 1h
  secretStoreRef: {name: canari-pg-oidc-pg-source, kind: SecretStore}
  target:
    name: canari-pg-oidc-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        GF_DATABASE_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: {key: pg-shared-homelab-canari-pg-oidc, property: password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: canari-pg-oidc-oidc
  namespace: canari-pg-oidc
spec:
  refreshInterval: 1h
  secretStoreRef: {name: canari-pg-oidc-auth-source, kind: SecretStore}
  target:
    name: canari-pg-oidc-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef: {key: authentik-blueprint-canari-pg-oidc, property: CANARIPGOIDC_OIDC_CLIENT_SECRET}
---
# Secrets internes de l'application (chiffrement et mot de passe admin local), generes une fois.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: canari-pg-oidc-secret-key
  namespace: canari-pg-oidc
spec:
  length: 64
  digits: 10
  symbols: 0
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: canari-pg-oidc-admin
  namespace: canari-pg-oidc
spec:
  length: 40
  digits: 8
  symbols: 0
  allowRepeat: true
---
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: canari-pg-oidc-secret-key
  namespace: canari-pg-oidc
spec:
  refreshPolicy: CreatedOnce
  target:
    name: canari-pg-oidc-secret-key
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        GF_SECURITY_SECRET_KEY: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: canari-pg-oidc-secret-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: canari-pg-oidc-admin
  namespace: canari-pg-oidc
spec:
  refreshPolicy: CreatedOnce
  target:
    name: canari-pg-oidc-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        GF_SECURITY_ADMIN_PASSWORD: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: canari-pg-oidc-admin
