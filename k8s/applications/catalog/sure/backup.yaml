apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-hetzner-credentials
  namespace: sure
spec:
  refreshInterval: 1h
  secretStoreRef: { name: doppler-cluster, kind: ClusterSecretStore }
  target: { name: cnpg-hetzner-credentials, creationPolicy: Owner }
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: HETZNER_S3_ACCESS_KEY_ID }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: HETZNER_S3_SECRET_ACCESS_KEY }
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
# PLT-245: no longer referenced by the Cluster nor the ScheduledBackup (archive
# moved to sure-r2-store). Kept as the rollback target with its existing
# backups (pre-cutover base 20261113T181527).
metadata: { name: sure-hetzner-store, namespace: sure }
spec:
  retentionPolicy: "14d"
  # PLT-245 (prep before the R2 cutover, lesson of the romm 4 min outage):
  # the sidecar environment is fixed when the pod starts, so during the
  # cutover the old pod archives its last WAL to R2 with THIS environment.
  # It must already carry what R2 needs (endpoint read from the R2 Secret, a
  # region R2 accepts, boto3 checksums when_required). The explicit endpointURL
  # below keeps Hetzner as the target of this store.
  instanceSidecarConfiguration:
    env:
      - name: AWS_DEFAULT_REGION
        value: us-east-1
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
      - name: AWS_ENDPOINT_URL_S3
        valueFrom:
          secretKeyRef:
            name: sure-cnpg-r2-credentials
            key: AWS_ENDPOINT_URL_S3
            optional: true
  configuration:
    destinationPath: s3://smadja-dev-homelab-backups/cnpg/sure
    endpointURL: https://fsn1.your-objectstorage.com
    s3Credentials:
      accessKeyId: { name: cnpg-hetzner-credentials, key: AWS_ACCESS_KEY_ID }
      secretAccessKey: { name: cnpg-hetzner-credentials, key: AWS_SECRET_ACCESS_KEY }
    wal: { compression: gzip, maxParallel: 2 }
    data: { compression: gzip }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata: { name: sure-postgresql-weekly, namespace: sure }
spec:
  schedule: "0 30 6 * * 0"
  backupOwnerReference: self
  cluster: { name: sure-postgresql }
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    # PLT-245: base backups follow the WAL archive to R2.
    parameters: { barmanObjectName: sure-r2-store }
