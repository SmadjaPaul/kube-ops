# PLT-245: first base backup of sure-postgresql on R2, right after the WAL
# archive switch (first WAL on R2 at 18:34Z). Closes the window without an R2
# recovery point.
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: sure-postgresql-r2-initial-20261113
  namespace: sure
  labels:
    backup.smadja.dev/purpose: r2-cutover
spec:
  cluster:
    name: sure-postgresql
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: sure-r2-store
