apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure-runtime
  namespace: sure
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: sure-runtime
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY_BASE
      remoteRef: { key: APP_SURE_SECRET_KEY_BASE }
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef: { key: APP_SURE_OIDC_CLIENT_SECRET }
