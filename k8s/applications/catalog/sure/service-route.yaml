apiVersion: v1
kind: Service
metadata:
  name: sure
  namespace: sure
spec:
  selector:
    app.kubernetes.io/name: sure
    app.kubernetes.io/component: web
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sure
  namespace: sure
spec:
  parentRefs:
    - name: internal
      namespace: gateway
  hostnames:
    - sure.smadja.dev
  rules:
    - backendRefs:
        - { name: sure, port: 80 }
