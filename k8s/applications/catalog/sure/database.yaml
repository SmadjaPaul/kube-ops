apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sure-postgresql
  namespace: sure
  annotations:
    # PLT-245: rolling restart (same mechanism as `kubectl cnpg restart`) so the
    # barman sidecar picks up the environment added to sure-hetzner-store in #1374.
    kubectl.kubernetes.io/restartedAt: "2026-11-13T18:05:00Z"
spec:
  instances: 1
  bootstrap:
    initdb:
      database: sure
      owner: sure
  # PLT-245: a Cluster has a single WAL archiver; the archive moved from
  # sure-hetzner-store to sure-r2-store (database-r2.yaml). Rollback: point
  # barmanObjectName back to sure-hetzner-store, restore from the Hetzner base
  # 20261113T181527 (backupID, never "latest"), then take a new base backup there
  # (homelab-infra docs/operations/r2-migration.md). WARNING: writes made after
  # the cutover (18:33Z on 2026-11-13) only have their WAL on R2; a Hetzner
  # rollback restores up to the switch unless the R2 WAL is also made available.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: sure-r2-store
  storage:
    size: 10Gi
    storageClass: longhorn-fast
  affinity:
    enablePodAntiAffinity: false
