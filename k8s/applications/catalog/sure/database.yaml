apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sure-postgresql
  namespace: sure
  annotations:
    # PLT-245: rolling restart (same mechanism as `kubectl cnpg restart`) so the
    # barman sidecar picks up the environment added to sure-hetzner-store in #1374.
    kubectl.kubernetes.io/restartedAt: "2026-11-13T18:05:00Z"
spec:
  instances: 1
  bootstrap:
    initdb:
      database: sure
      owner: sure
  postgresql:
    parameters:
      # PLT-344 lot 0 : WAL réduit (golden path stockage). archive_timeout 5min -> 15min : 96 segments forcés/jour au lieu de 288 (RPO R2 15 min).
      checkpoint_timeout: "15min"
      max_wal_size: "2GB"
      wal_compression: "lz4"
      archive_timeout: "15min"
  # PLT-245: a Cluster has a single WAL archiver; the archive moved from
  # Hetzner to sure-r2-store. PLT-94: the Hetzner store was removed from
  # kube-ops; recovery points live on R2 only.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: sure-r2-store
  storage:
    size: 10Gi
    storageClass: longhorn-fast
  affinity:
    enablePodAntiAffinity: false
