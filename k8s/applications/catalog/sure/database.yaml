apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sure-postgresql
  namespace: sure
  annotations:
    # PLT-245: rolling restart (same mechanism as `kubectl cnpg restart`) so the
    # barman sidecar picks up the environment added to sure-hetzner-store in #1374.
    kubectl.kubernetes.io/restartedAt: "2026-11-13T18:05:00Z"
spec:
  instances: 1
  bootstrap:
    initdb:
      database: sure
      owner: sure
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: sure-hetzner-store
  storage:
    size: 10Gi
    storageClass: longhorn-fast
  affinity:
    enablePodAntiAffinity: false
