# PLT-566 : sure est inactive la plupart du temps ; elle dort a zero et se reveille sur le
# premier hit. Le trafic passe par le proxy KEDA (namespace keda), qui relaie vers le Service
# `sure` et previent le scaler, qui ramene le Deployment a 1 replica.
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: sure
  namespace: sure
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  target:
    service: sure
    port: 80
  rules:
    - hosts:
        - sure.smadja.dev
  scalingMetric:
    concurrency:
      targetValue: 10
  coldStart:
    maxPendingRequests: 100
  timeouts:
    # PLT-566 : le demarrage a froid (Rails + base) peut depasser le delai par defaut.
    readiness: 120s
    responseHeader: 15s
---
# Le web porte le trafic HTTP ; le worker attend le web (sa sonde de readiness exige
# sidekiq), il ne peut donc pas rester seul a 1 replica : les deux sont ramenes a zero
# par KEDA et reveilles par la meme route.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: sure-web
  namespace: sure
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sure-web
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 300
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
        interceptorRoute: sure
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: sure-worker
  namespace: sure
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sure-worker
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 300
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
        interceptorRoute: sure
