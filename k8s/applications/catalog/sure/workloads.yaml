apiVersion: apps/v1
kind: Deployment
metadata:
  name: sure-web
  namespace: sure
  annotations:
    secret.reloader.stakater.com/reload: "sure-runtime,sure-postgresql-app"
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: sure, app.kubernetes.io/component: web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sure, app.kubernetes.io/component: web }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ghcr.io/we-promise/sure:0.7.5-hotfix.1
          imagePullPolicy: IfNotPresent
          env:
            - { name: SELF_HOSTED, value: "true" }
            - { name: APP_DOMAIN, value: "sure.smadja.dev" }
            - { name: ONBOARDING_STATE, value: "open" }
            - { name: AUTH_LOCAL_LOGIN_ENABLED, value: "false" }
            - { name: AUTH_LOCAL_ADMIN_OVERRIDE_ENABLED, value: "false" }
            - { name: AUTH_JIT_MODE, value: "create_and_link" }
            - { name: OIDC_BUTTON_LABEL, value: "Authentik" }
            - { name: OIDC_CLIENT_ID, value: "sure" }
            - { name: OIDC_ISSUER, value: "https://auth.smadja.dev/application/o/sure/" }
            - { name: OIDC_REDIRECT_URI, value: "https://sure.smadja.dev/auth/openid_connect/callback" }
            - { name: REDIS_URL, value: "redis://sure-redis:6379/1" }
            - name: SECRET_KEY_BASE
              valueFrom: { secretKeyRef: { name: sure-runtime, key: SECRET_KEY_BASE } }
            - name: OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: sure-runtime, key: OIDC_CLIENT_SECRET } }
            - name: DB_HOST
              valueFrom: { secretKeyRef: { name: sure-postgresql-app, key: host } }
            - name: DB_PORT
              valueFrom: { secretKeyRef: { name: sure-postgresql-app, key: port } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: sure-postgresql-app, key: dbname } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: sure-postgresql-app, key: user } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: sure-postgresql-app, key: password } }
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /up, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /up, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: storage, mountPath: /rails/storage }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: storage
          persistentVolumeClaim: { claimName: sure-storage }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sure-worker
  namespace: sure
  annotations:
    secret.reloader.stakater.com/reload: "sure-runtime,sure-postgresql-app"
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: sure, app.kubernetes.io/component: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sure, app.kubernetes.io/component: worker }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ghcr.io/we-promise/sure:0.7.5-hotfix.1
          imagePullPolicy: IfNotPresent
          command: ["bash", "-lc"]
          args:
            - |
              until curl -fsS http://sure:80/up >/dev/null; do sleep 5; done
              exec bundle exec sidekiq -C config/sidekiq.yml
          env:
            - { name: SELF_HOSTED, value: "true" }
            - { name: APP_DOMAIN, value: "sure.smadja.dev" }
            - { name: ONBOARDING_STATE, value: "open" }
            - { name: AUTH_LOCAL_LOGIN_ENABLED, value: "false" }
            - { name: AUTH_LOCAL_ADMIN_OVERRIDE_ENABLED, value: "false" }
            - { name: AUTH_JIT_MODE, value: "create_and_link" }
            - { name: OIDC_BUTTON_LABEL, value: "Authentik" }
            - { name: OIDC_CLIENT_ID, value: "sure" }
            - { name: OIDC_ISSUER, value: "https://auth.smadja.dev/application/o/sure/" }
            - { name: OIDC_REDIRECT_URI, value: "https://sure.smadja.dev/auth/openid_connect/callback" }
            - { name: REDIS_URL, value: "redis://sure-redis:6379/1" }
            - name: SECRET_KEY_BASE
              valueFrom: { secretKeyRef: { name: sure-runtime, key: SECRET_KEY_BASE } }
            - name: OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: sure-runtime, key: OIDC_CLIENT_SECRET } }
            - name: DB_HOST
              valueFrom: { secretKeyRef: { name: sure-postgresql-app, key: host } }
            - name: DB_PORT
              valueFrom: { secretKeyRef: { name: sure-postgresql-app, key: port } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: sure-postgresql-app, key: dbname } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: sure-postgresql-app, key: user } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: sure-postgresql-app, key: password } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: storage, mountPath: /rails/storage }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: storage
          persistentVolumeClaim: { claimName: sure-storage }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
