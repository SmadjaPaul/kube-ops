apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: ntfy-data, namespace: ntfy }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-fast
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: ntfy
spec:
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: ntfy }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ntfy }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: bootstrap-admin
          image: binwiederhier/ntfy:v2.28.0
          command: ["sh","-c"]
          args:
            - >-
              set -eu;
              export NTFY_AUTH_FILE=/var/lib/ntfy/auth.db;
              ntfy serve >/tmp/ntfy-serve.log 2>&1 &
              SERVER_PID=$$!;
              for i in $$(seq 1 30); do
                [ -f /var/lib/ntfy/auth.db ] && break;
                sleep 1;
              done;
              if [ ! -f /var/lib/ntfy/auth.db ]; then
                echo "ntfy auth.db not created after 30s" >&2;
                cat /tmp/ntfy-serve.log >&2 || true;
                kill $$SERVER_PID 2>/dev/null || true;
                exit 1;
              fi;
              ntfy user add --role=admin admin || ntfy user change-pass admin;
              kill $$SERVER_PID 2>/dev/null || true;
              wait $$SERVER_PID 2>/dev/null || true
          envFrom:
            - secretRef:
                name: ntfy-runtime
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/ntfy }
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:v2.28.0
          args: ["serve"]
          env:
            - { name: NTFY_LISTEN_HTTP, value: ":8080" }
            - { name: NTFY_BASE_URL, value: "https://ntfy.smadja.dev" }
            - { name: NTFY_CACHE_FILE, value: "/var/lib/ntfy/cache.db" }
            - { name: NTFY_AUTH_FILE, value: "/var/lib/ntfy/auth.db" }
            - { name: NTFY_AUTH_DEFAULT_ACCESS, value: "deny-all" }
          ports:
            - { name: http, containerPort: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 250m, memory: 192Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/ntfy }
            - { name: tmp, mountPath: /tmp }
          readinessProbe: { httpGet: { path: /v1/health, port: http } }
          livenessProbe: { httpGet: { path: /v1/health, port: http } }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: ntfy-data }
        - name: tmp
          emptyDir: { sizeLimit: 32Mi }
---
apiVersion: v1
kind: Service
metadata: { name: ntfy, namespace: ntfy }
spec:
  selector: { app.kubernetes.io/name: ntfy }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: ntfy, namespace: ntfy }
spec:
  parentRefs:
    - { name: external, namespace: gateway }
    - { name: internal, namespace: gateway }
  hostnames: [ntfy.smadja.dev]
  rules:
    - backendRefs:
        - { name: ntfy, port: 80 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: ntfy, namespace: ntfy }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: ntfy } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: gateway }
      ports:
        - { protocol: TCP, port: 8080 }
