apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: openclaw
  namespace: openclaw
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  suspended: false
  image:
    repository: ghcr.io/smadjapaul/openclaw-ops
    tag: "2026.9.6"
    pullPolicy: IfNotPresent
  config:
    configMapRef:
      name: openclaw-config
      key: openclaw.json
    mergeMode: overwrite
  workspace:
    initialDirectories:
      - repos
    initialFiles:
      AGENTS.md: |-
        # Smadja Homelab Agent Contract

        You run inside the OpenClaw Kubernetes pod. This pod plus its persistent workspace PVC is your workstation. Do not require SSH, Docker socket access, or host filesystem access.

        Canonical repositories:
        - SmadjaPaul/kube-ops: Kubernetes desired state reconciled by Argo CD.
        - SmadjaPaul/homelab-infra: Proxmox, Talos, UniFi, Cloudflare, Doppler bootstrap and external infrastructure.

        Operating rules:
        - Git is desired state; runtime Kubernetes is evidence.
        - Never use kubectl apply, patch, edit, scale, or delete for durable changes.
        - Prefer read-only runtime inspection, then implement the fix in Git.
        - Work on a branch, run repository checks, push, and open a PR. Never push directly to main.
        - R0 read-only investigation is autonomous.
        - R1 reversible GitOps changes may proceed when checks are green.
        - R2 destructive, data-bearing, Talos-disruptive, PVC, firewall, credential or irreversible changes require Paul approval.
        - Never print or commit secrets.
        - Keep PRs small and causal.

        Workspace convention:
        - Clone repositories under ./repos/.
        - Preserve the persistent workspace between pod restarts.
  envFrom:
    - secretRef:
        name: app-openclaw-litellm-api-key
  initContainers:
    - name: configure-exec-allowlist
      image: ghcr.io/smadjapaul/openclaw-ops:2026.9.6
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      command: ["sh", "-c"]
      args:
        - >-
          set -eu;
          openclaw approvals allowlist add --agent default /usr/bin/git;
          openclaw approvals allowlist add --agent default /usr/local/bin/kubectl
      env:
        - name: HOME
          value: /home/openclaw
      volumeMounts:
        - name: data
          mountPath: /home/openclaw/.openclaw
        - name: data
          mountPath: /home/openclaw/.local
          subPath: .local
        - name: data
          mountPath: /home/openclaw/.cache
          subPath: .cache
        - name: data
          mountPath: /home/openclaw/.config
          subPath: .config
        - name: tmp
          mountPath: /tmp
  gateway:
    existingSecret: app-openclaw-gateway-token
    controlUiOrigins:
      - https://openclaw.smadja.dev
  storage:
    persistence:
      enabled: true
      storageClass: longhorn-fast
      size: 10Gi
      accessModes:
        - ReadWriteOnce
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  security:
    networkPolicy:
      enabled: false
    rbac:
      createServiceAccount: false
      serviceAccountName: talos-ops
  selfConfigure:
    enabled: false
  networking:
    service:
      type: ClusterIP
    httpRoute:
      enabled: true
      parentRefs:
        - name: internal
          namespace: gateway
          sectionName: https-subdomains
      hostnames:
        - openclaw.smadja.dev
      port: 18789
  probes:
    diskReadiness:
      enabled: true
      minFree: 128Mi
  observability:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 30s
    logging:
      level: info
      format: json
