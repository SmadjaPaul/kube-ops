apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: openclaw
  namespace: openclaw
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  image:
    repository: ghcr.io/openclaw/openclaw
    tag: "2026.9.6"
    pullPolicy: IfNotPresent
  config:
    configMapRef:
      name: openclaw-config
      key: openclaw.json
    mergeMode: overwrite
  envFrom:
    - secretRef:
        name: app-openclaw-litellm-api-key
  initContainers:
    - name: migrate-persistent-state
      image: ghcr.io/openclaw/openclaw:2026.9.6
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c"]
      args: ["exec openclaw doctor --fix"]
      env:
        - name: HOME
          value: /home/openclaw
      volumeMounts:
        - name: data
          mountPath: /home/openclaw/.openclaw
        - name: data
          mountPath: /home/openclaw/.local
          subPath: .local
        - name: data
          mountPath: /home/openclaw/.cache
          subPath: .cache
        - name: data
          mountPath: /home/openclaw/.config
          subPath: .config
        - name: tmp
          mountPath: /tmp
  gateway:
    existingSecret: app-openclaw-gateway-token
    controlUiOrigins:
      - https://openclaw.smadja.dev
  storage:
    persistence:
      enabled: true
      storageClass: longhorn-fast
      size: 10Gi
      accessModes:
        - ReadWriteOnce
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  security:
    networkPolicy:
      enabled: false
    rbac:
      createServiceAccount: true
  networking:
    service:
      type: ClusterIP
    httpRoute:
      enabled: true
      parentRefs:
        - name: external
          namespace: gateway
          sectionName: https-subdomains
        - name: internal
          namespace: gateway
          sectionName: https-subdomains
      hostnames:
        - openclaw.smadja.dev
      port: 18789
  probes:
    diskReadiness:
      enabled: true
      minFree: 128Mi
  observability:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 30s
    logging:
      level: info
      format: json
