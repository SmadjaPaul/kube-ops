apiVersion: v1
kind: ServiceAccount
metadata:
  name: talos-ops
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw
    app.kubernetes.io/instance: openclaw
    app.kubernetes.io/component: ops-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: talos-ops-readonly
  labels:
    app.kubernetes.io/name: openclaw
    app.kubernetes.io/instance: openclaw
    app.kubernetes.io/component: ops-agent
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: talos-ops-readonly
  labels:
    app.kubernetes.io/name: openclaw
    app.kubernetes.io/instance: openclaw
    app.kubernetes.io/component: ops-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: talos-ops-readonly
subjects:
  - kind: ServiceAccount
    name: talos-ops
    namespace: openclaw
