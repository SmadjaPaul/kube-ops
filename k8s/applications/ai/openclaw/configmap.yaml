apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw
data:
  openclaw.json: |
    {
      "logging": {
        "level": "info",
        "consoleLevel": "info",
        "consoleStyle": "pretty",
        "redactSensitive": "tools"
      },
      "messages": {
        "messagePrefix": "[openclaw]",
        "responsePrefix": ">",
        "ackReaction": "👀",
        "ackReactionScope": "group-mentions",
        "groupChat": {
          "mentionPatterns": [
            "@openclaw",
            "openclaw"
          ],
          "historyLimit": 50
        },
        "queue": {
          "mode": "collect",
          "debounceMs": 1000,
          "cap": 20,
          "drop": "summarize"
        }
      },
      "session": {
        "scope": "per-sender",
        "reset": {
          "mode": "daily",
          "atHour": 4,
          "idleMinutes": 60
        },
        "resetTriggers": [
          "/new",
          "/reset"
        ],
        "typingIntervalSeconds": 5
      },
      "channels": {
        "slack": {
          "enabled": false
        }
      },
      "plugins": {
        "entries": {
          "whatsapp": {
            "enabled": false
          }
        }
      },
      "agents": {
        "defaults": {
          "userTimezone": "Europe/Paris",
          "model": {
            "primary": "litellm/minimax/MiniMax-M3",
            "fallbacks": [
              "litellm/minimax/MiniMax-M2.7"
            ]
          },
          "thinkingDefault": "low",
          "verboseDefault": "off",
          "elevatedDefault": "off",
          "timeoutSeconds": 600,
          "typingIntervalSeconds": 5,
          "maxConcurrent": 2,
          "utilityModel": "litellm/minimax/MiniMax-M2.7",
          "modelPolicy": {
            "allow": [
              "litellm/minimax/MiniMax-M3",
              "litellm/minimax/MiniMax-M2.7"
            ]
          }
        },
        "list": [
          {
            "id": "default",
            "default": true,
            "identity": {
              "name": "Samantha",
              "theme": "helpful sloth",
              "emoji": "🦥"
            }
          }
        ]
      },
      "tools": {
        "allow": [
          "read",
          "write",
          "edit",
          "apply_patch",
          "memory_search",
          "memory_get",
          "exec",
          "process"
        ],
        "deny": [
          "browser",
          "canvas"
        ],
        "elevated": {
          "enabled": false
        },
        "exec": {
          "host": "gateway",
          "mode": "allowlist",
          "strictInlineEval": true
        },
        "sessions": {
          "visibility": "agent"
        }
      },
      "models": {
        "mode": "merge",
        "providers": {
          "litellm": {
            "api": "openai-completions",
            "baseUrl": "http://litellm.litellm.svc.cluster.local:80/v1",
            "apiKey": "${LITELLM_API_KEY}",
            "models": [
              {
                "id": "minimax/MiniMax-M3",
                "name": "MiniMax M3"
              },
              {
                "id": "minimax/MiniMax-M2.7",
                "name": "MiniMax M2.7"
              }
            ]
          }
        }
      },
      "gateway": {
        "mode": "local",
        "port": 18789,
        "http": {
          "endpoints": {
            "chatCompletions": {
              "enabled": true
            }
          }
        }
      },
      "memory": {
        "search": {
          "provider": "openai-compatible",
          "model": "qwen3-embedding-0.6b",
          "remote": {
            "baseUrl": "http://litellm.litellm.svc.cluster.local:80/v1/",
            "apiKey": "${LITELLM_API_KEY}"
          },
          "rememberAcrossConversations": true
        }
      }
    }
