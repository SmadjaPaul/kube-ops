apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw
data:
  openclaw.json: |
    {
      "logging": {
        "level": "info",
        "consoleLevel": "info",
        "consoleStyle": "pretty",
        "redactSensitive": "tools"
      },
      "messages": {
        "messagePrefix": "[openclaw]",
        "responsePrefix": ">",
        "ackReaction": "👀",
        "ackReactionScope": "group-mentions",
        "groupChat": {
          "mentionPatterns": ["@openclaw", "openclaw"],
          "historyLimit": 50
        },
        "queue": {
          "mode": "collect",
          "debounceMs": 1000,
          "cap": 20,
          "drop": "summarize"
        }
      },
      "session": {
        "scope": "per-sender",
        "reset": {
          "mode": "daily",
          "atHour": 4,
          "idleMinutes": 60
        },
        "resetTriggers": ["/new", "/reset"],
        "typingIntervalSeconds": 5
      },
      "channels": {
        "slack": {
          "enabled": true,
          "botToken": "${SLACK_BOT_TOKEN}",
          "appToken": "${SLACK_APP_TOKEN}",
          "channels": {
            "#general": {"allow": true, "requireMention": true}
          },
          "dm": {"enabled": true, "allowFrom": ["U123"]},
          "slashCommand": {
            "enabled": true,
            "name": "openclaw",
            "sessionPrefix": "slack:slash",
            "ephemeral": true
          }
        }
      },
      "agents": {
        "defaults": {
          "userTimezone": "Europe/Paris",
          "model": {
            "primary": "litellm/auto"
          },
          "thinkingDefault": "low",
          "verboseDefault": "off",
          "elevatedDefault": "off",
          "timeoutSeconds": 600,
          "typingIntervalSeconds": 5,
          "maxConcurrent": 2
        },
        "list": [
          {
            "id": "default",
            "default": true,
            "identity": {
              "name": "Samantha",
              "theme": "helpful sloth",
              "emoji": "🦥"
            }
          }
        ]
      },
      "tools": {
        "allow": ["read", "write", "edit", "apply_patch"],
        "deny": ["browser", "canvas"],
        "elevated": {"enabled": false}
      },
      "models": {
        "mode": "merge",
        "providers": {
          "litellm": {
            "api": "openai-completions",
            "baseUrl": "http://litellm.litellm.svc.cluster.local:4000/v1",
            "apiKey": "${LITELLM_API_KEY}",
            "models": [
              {"id": "auto", "name": "Automatic Cost Router"},
              {"id": "fast", "name": "Fast"},
              {"id": "reasoning", "name": "Reasoning"}
            ]
          }
        }
      },
      "gateway": {
        "mode": "local",
        "port": 18789
      }
    }
