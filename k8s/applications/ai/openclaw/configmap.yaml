apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw
data:
  openclaw.json: |
    {
      "logging": {
        "level": "info",
        "consoleLevel": "info",
        "consoleStyle": "pretty",
        "redactSensitive": "tools"
      },
      "messages": {
        "messagePrefix": "[openclaw]",
        "responsePrefix": ">",
        "ackReaction": "👀",
        "ackReactionScope": "group-mentions",
        "groupChat": {
          "mentionPatterns": ["@openclaw", "openclaw"],
          "historyLimit": 50
        },
        "queue": {
          "mode": "collect",
          "debounceMs": 1000,
          "cap": 20,
          "drop": "summarize"
        }
      },
      "session": {
        "scope": "per-sender",
        "reset": {
          "mode": "daily",
          "atHour": 4,
          "idleMinutes": 60
        },
        "resetTriggers": ["/new", "/reset"],
        "typingIntervalSeconds": 5
      },
      "channels": {
        "slack": {
          "enabled": false
        }
      },
      "plugins": {
        "entries": {
          "whatsapp": {
            "enabled": false
          }
        }
      },
      "agents": {
        "defaults": {
          "userTimezone": "Europe/Paris",
          "model": {
            "primary": "litellm/anthropic/claude-sonnet-4-6"
          },
          "thinkingDefault": "low",
          "verboseDefault": "off",
          "elevatedDefault": "off",
          "timeoutSeconds": 600,
          "typingIntervalSeconds": 5,
          "maxConcurrent": 2
        },
        "list": [
          {
            "id": "default",
            "default": true,
            "identity": {
              "name": "Samantha",
              "theme": "helpful sloth",
              "emoji": "🦥"
            }
          }
        ]
      },
      "tools": {
        "allow": ["read", "write", "edit", "apply_patch"],
        "deny": ["browser", "canvas"],
        "elevated": {"enabled": false}
      },
      "models": {
        "mode": "merge",
        "providers": {
          "litellm": {
            "api": "openai-completions",
            "baseUrl": "http://litellm.litellm.svc.cluster.local:80/v1",
            "apiKey": "${LITELLM_API_KEY}",
            "models": [
              {"id": "anthropic/claude-sonnet-4-6", "name": "Claude Sonnet 4.6"},
              {"id": "anthropic/claude-haiku-4-5", "name": "Claude Haiku 4.5"}
            ]
          }
        }
      },
      "gateway": {
        "mode": "local",
        "port": 18789
      }
    }
