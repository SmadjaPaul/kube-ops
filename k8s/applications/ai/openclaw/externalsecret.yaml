---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-openclaw-litellm-api-key
  namespace: openclaw
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: app-openclaw-litellm-api-key
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: APP_MOLTBOT_LITELLM_API_KEY

