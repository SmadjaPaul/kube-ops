apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: open-webui
  namespace: open-webui
spec:
  serviceName: "open-webui-service"
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  volumeClaimTemplates:
  - metadata:
      name: openwebui-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "longhorn-fast"
      resources:
        requests:
          storage: 10Gi
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: static-files
          emptyDir:
            sizeLimit: 2Gi
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.9.5-slim
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: openwebui-data
              mountPath: /app/backend/data
            - name: tmp
              mountPath: /tmp
            - name: static-files
              mountPath: /app/backend/open_webui/static
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: '25m'
              memory: '1Gi'
            limits:
              cpu: '1000m'
              memory: '2Gi'
          env:
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: openwebui-secret
                  key: WEBUI_SECRET_KEY
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: openwebui-secret
                  key: OAUTH_CLIENT_ID
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: openwebui-secret
                  key: OAUTH_CLIENT_SECRET
            - name: OAUTH_PROVIDER_NAME
              value: 'authentik'
            - name: ENABLE_OAUTH
              value: 'true'
            # Open WebUI v0.9.5 treats an empty database as onboarding. Use its
            # upstream headless bootstrap path so no ClickOps/local signup is
            # required. The random password is machine-owned and password auth
            # is disabled below; Paul's later OIDC login merges by email.
            - name: WEBUI_ADMIN_EMAIL
              value: 'paul@smadja.dev'
            - name: WEBUI_ADMIN_NAME
              value: 'Paul'
            - name: WEBUI_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openwebui-secret
                  key: WEBUI_ADMIN_PASSWORD
            - name: ENABLE_PASSWORD_AUTH
              value: 'false'
            - name: ENABLE_PASSWORD_CHANGE_FORM
              value: 'false'
            - name: ENABLE_LOGIN_FORM
              value: 'false'
            - name: ENABLE_SIGNUP
              value: 'false'
            - name: OPENID_PROVIDER_URL
              value: 'https://auth.smadja.dev/application/o/openwebui/.well-known/openid-configuration'
            - name: OPENID_REDIRECT_URI
              value: 'https://chat.smadja.dev/oauth/oidc/callback'
            - name: WEBUI_URL
              value: 'https://chat.smadja.dev'
            - name: ENABLE_OAUTH_SIGNUP
              value: 'true'
            - name: OAUTH_SCOPES
              value: 'openid email profile roles'
            - name: ENABLE_OAUTH_ROLE_MANAGEMENT
              value: 'true'
            - name: OAUTH_ROLES_CLAIM
              value: 'roles'
            - name: OAUTH_ALLOWED_ROLES
              value: 'user'
            - name: OAUTH_ADMIN_ROLES
              value: 'admin'
            - name: CORS_ALLOW_ORIGIN
              value: 'https://chat.smadja.dev'
            - name: STARTUP_TIMEOUT
              value: '600'
            - name: USER_AGENT
              value: 'OpenWebUI/0.6.15'
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: 'true'
            - name: VECTOR_DB
              value: 'qdrant'
            - name: QDRANT_URI
              value: 'http://qdrant.qdrant.svc.cluster.local:6333'
            - name: ENABLE_QDRANT_MULTITENANCY_MODE
              value: 'true'
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-openwebui-qdrant-api-key
                  key: QDRANT_API_KEY
            - name: QDRANT_PREFER_GRPC
              value: 'false'
            - name: OPENAI_API_BASE_URL
              value: 'http://litellm.litellm.svc.cluster.local:80/v1'
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-openwebui-litellm-api-key
                  key: OPENAI_API_KEY
            - name: OPENAI_API_BASE_URLS
              value: 'http://litellm.litellm.svc.cluster.local:80/v1;http://openclaw.openclaw.svc.cluster.local:18789/v1;http://talos-personal.openclaw-talos-personal.svc.cluster.local:18789/v1'
            - name: OPENAI_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: openwebui-ai-backend-keys
                  key: OPENAI_API_KEYS
            - name: RAG_OPENAI_API_BASE_URL
              value: 'http://litellm.litellm.svc.cluster.local:80/v1'
            - name: RAG_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-openwebui-litellm-api-key
                  key: OPENAI_API_KEY
            - name: RAG_EMBEDDING_ENGINE
              value: 'openai'
            - name: RAG_EMBEDDING_MODEL
              value: 'factory/embedding'
            - name: CHAT_RESPONSE_STREAM_DELTA_CHUNK_SIZE
              value: '10'
            - name: ENABLE_FORWARD_USER_INFO_HEADERS
              value: 'true'
          tty: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 30
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
