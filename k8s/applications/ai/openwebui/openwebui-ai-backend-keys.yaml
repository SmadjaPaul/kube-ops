apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-ai-backend-keys
  namespace: open-webui
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: openwebui-ai-backend-keys
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPENAI_API_KEYS: "{{ .litellmKey }};{{ .talosPersonalGatewayToken }}"
  data:
    - secretKey: litellmKey
      remoteRef:
        key: APP_OPENWEBUI_FACTORY_LITELLM_API_KEY
    - secretKey: talosPersonalGatewayToken
      remoteRef:
        key: APP_OPENCLAW_TALOS_PERSONAL_GATEWAY_TOKEN
