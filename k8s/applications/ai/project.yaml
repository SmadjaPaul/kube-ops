apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ai
  namespace: argocd
spec:
  sourceRepos:
    - 'https://github.com/SmadjaPaul/kube-ops.git'
  destinations:
    - namespace: 'karakeep'
      server: '*'
    - namespace: 'opencode'
      server: '*'
    - namespace: 'paperclip'
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
