apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-openclaw-talos-ops-litellm-api-key
  namespace: openclaw-talos-ops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: app-openclaw-talos-ops-litellm-api-key
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: APP_MOLTBOT_LITELLM_API_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-openclaw-talos-ops-gateway-token
  namespace: openclaw-talos-ops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: app-openclaw-talos-ops-gateway-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: APP_OPENCLAW_TALOS_OPS_GATEWAY_TOKEN
