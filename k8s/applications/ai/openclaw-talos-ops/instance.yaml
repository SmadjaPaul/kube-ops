apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: talos-ops
  namespace: openclaw-talos-ops
  labels:
    app.kubernetes.io/name: openclaw
    app.kubernetes.io/instance: talos-ops
    openclaw.rocks/trust-domain: talos-ops
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  suspended: false
  image:
    repository: ghcr.io/smadjapaul/openclaw-ops
    tag: "2026.9.6"
    pullPolicy: IfNotPresent
  config:
    configMapRef:
      name: talos-ops-config-source
      key: openclaw.json
    mergeMode: overwrite
  workspace:
    initialDirectories:
      - repos
    initialFiles:
      AGENTS.md: |-
        # Talos Ops Cell

        This is an isolated read-only Kubernetes observer for the Talos trust domain.
        Kubernetes access is limited by ServiceAccount RBAC to get/list/watch diagnostics.
        Never read, print, write, patch, edit, scale, delete, or apply Secrets or resources.
        GitHub factory access and Git changes are not configured; future factory access is R2.
        Never print or commit secrets.
  envFrom:
    - secretRef:
        name: app-openclaw-talos-ops-litellm-api-key
  initContainers:
    - name: configure-ops-readonly-allowlist
      image: ghcr.io/smadjapaul/openclaw-ops:2026.9.6
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      command: ["sh", "-c"]
      args:
        - >-
          set -eu;
          openclaw approvals allowlist add --agent talos-ops /usr/local/bin/kubectl
      env:
        - name: HOME
          value: /home/openclaw
      volumeMounts:
        - name: data
          mountPath: /home/openclaw/.openclaw
        - name: data
          mountPath: /home/openclaw/.local
          subPath: .local
        - name: data
          mountPath: /home/openclaw/.cache
          subPath: .cache
        - name: data
          mountPath: /home/openclaw/.config
          subPath: .config
        - name: tmp
          mountPath: /tmp
  extraVolumes:
    - name: kubernetes-api-access
      projected:
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
          - configMap:
              name: kube-root-ca.crt
              items:
                - key: ca.crt
                  path: ca.crt
          - downwardAPI:
              items:
                - path: namespace
                  fieldRef:
                    fieldPath: metadata.namespace
  extraVolumeMounts:
    - name: kubernetes-api-access
      mountPath: /var/run/secrets/kubernetes.io/serviceaccount
      readOnly: true
  gateway:
    existingSecret: app-openclaw-talos-ops-gateway-token
    controlUiOrigins:
      - https://talos-ops-next.smadja.dev
  storage:
    persistence:
      enabled: true
      storageClass: longhorn-fast
      size: 10Gi
      accessModes: [ReadWriteOnce]
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  security:
    networkPolicy:
      enabled: false
    rbac:
      createServiceAccount: false
      serviceAccountName: talos-ops
  selfConfigure:
    enabled: false
  networking:
    service:
      type: ClusterIP
    httpRoute:
      enabled: true
      parentRefs:
        - name: internal
          namespace: gateway
          sectionName: https-subdomains
      hostnames:
        - talos-ops-next.smadja.dev
      port: 18789
  probes:
    diskReadiness:
      enabled: true
      minFree: 128Mi
  observability:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 30s
    logging:
      level: info
      format: json
