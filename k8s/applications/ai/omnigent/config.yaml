apiVersion: v1
kind: ConfigMap
metadata:
  name: omnigent-config
  namespace: omnigent
data:
  HOST: "0.0.0.0"
  PORT: "8000"
  ARTIFACT_DIR: "/data/artifacts"
  OMNIGENT_FEATURES: ""
  OMNIGENT_ADMIN_CREDENTIALS_PATH: "/data/admin-credentials"
  OMNIGENT_AUTH_ENABLED: "1"
  OMNIGENT_AUTH_PROVIDER: "oidc"
  OMNIGENT_OIDC_ISSUER: "https://auth.smadja.dev/application/o/omnigent/"
  OMNIGENT_OIDC_CLIENT_ID: "omnigent"
  OMNIGENT_OIDC_REDIRECT_URI: "https://omnigent.smadja.dev/auth/callback"
  OMNIGENT_OIDC_SKIP_EMAIL_VERIFICATION: "1"
  OMNIGENT_DOMAIN: "omnigent.smadja.dev"
  OMNIGENT_CREDENTIAL_CIPHER: "vault"
  OMNIGENT_CREDENTIAL_VAULT_KEY: "omnigent-credentials"
  OMNIGENT_CREDENTIAL_VAULT_MOUNT: "transit"
  VAULT_ADDR: "http://127.0.0.1:8100"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: omnigent-sandbox-config
  namespace: omnigent
data:
  config.yaml: |
    sandbox:
      provider: kubernetes
      server_url: http://omnigent.omnigent.svc.cluster.local
      kubernetes:
        namespace: omnigent-sandboxes
        secret_name: omnigent-creds
        service_account: omnigent-runner
        in_cluster: true
        home_size_limit: 8Gi
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
            ephemeral-storage: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
            ephemeral-storage: "8Gi"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: omnigent-openbao-agent
  namespace: omnigent
data:
  agent.hcl: |
    exit_after_auth = false
    vault {
      address = "http://openbao.openbao.svc.cluster.local:8200"
    }
    auto_auth {
      method "kubernetes" {
        config = { role = "omnigent" }
      }
    }
    cache {}
    api_proxy {
      use_auto_auth_token = "force"
    }
    listener "tcp" {
      address = "0.0.0.0:8100"
      tls_disable = true
    }
