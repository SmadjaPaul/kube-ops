apiVersion: v1
kind: Service
metadata:
  name: omnigent
  namespace: omnigent
spec:
  type: ClusterIP
  selector:
    app: omnigent
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: omnigent
  namespace: omnigent
spec:
  parentRefs:
    - name: external
      namespace: gateway
    - name: internal
      namespace: gateway
  hostnames:
    - omnigent.smadja.dev
  rules:
    - backendRefs:
        - name: omnigent
          port: 80
