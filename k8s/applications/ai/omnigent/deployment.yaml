apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnigent
  namespace: omnigent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omnigent
  template:
    metadata:
      labels:
        app: omnigent
        app.kubernetes.io/name: omnigent
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: omnigent-server
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: omnigent
          image: ghcr.io/omnigent-ai/omnigent-server-kubernetes:v0.14.0
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: omnigent-config
            - secretRef:
                name: omnigent-runtime
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: omnigent-postgresql-app
                  key: uri
            - name: OMNIGENT_CONFIG
              value: /etc/omnigent/config.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: artifacts
              mountPath: /data/artifacts
            - name: sandbox-config
              mountPath: /etc/omnigent
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 90
            periodSeconds: 30
        - name: openbao-agent
          image: quay.io/openbao/openbao:2.6.2
          args: ["proxy","-config=/etc/openbao/agent.hcl"]
          ports:
            - name: proxy
              containerPort: 8100
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: agent-config
              mountPath: /etc/openbao
              readOnly: true
            - name: agent-tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: artifacts
          persistentVolumeClaim: { claimName: omnigent-artifacts }
        - name: sandbox-config
          configMap: { name: omnigent-sandbox-config }
        - name: agent-config
          configMap: { name: omnigent-openbao-agent }
        - name: agent-tmp
          emptyDir: {}
