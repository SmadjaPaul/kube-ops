apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnigent-runtime
  namespace: omnigent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: omnigent-runtime
    creationPolicy: Owner
  data:
    - secretKey: OMNIGENT_OIDC_CLIENT_SECRET
      remoteRef: { key: APP_OMNIGENT_OIDC_CLIENT_SECRET }
    - secretKey: OMNIGENT_OIDC_COOKIE_SECRET
      remoteRef: { key: APP_OMNIGENT_OIDC_COOKIE_SECRET }
    - secretKey: OMNIGENT_GITHUB_APP_CLIENT_ID
      remoteRef: { key: APP_OMNIGENT_GITHUB_APP_CLIENT_ID }
    - secretKey: OMNIGENT_GITHUB_APP_CLIENT_SECRET
      remoteRef: { key: APP_OMNIGENT_GITHUB_APP_CLIENT_SECRET }
    - secretKey: OMNIGENT_GITHUB_APP_SLUG
      remoteRef: { key: APP_OMNIGENT_GITHUB_APP_SLUG }
    - secretKey: OMNIGENT_GITHUB_APP_REDIRECT_URI
      remoteRef: { key: APP_OMNIGENT_GITHUB_APP_REDIRECT_URI }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omnigent-creds
  namespace: omnigent-sandboxes
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: omnigent-creds
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPENAI_API_KEY: "{{ .LITELLM_API_KEY }}"
        OPENAI_BASE_URL: "http://litellm.litellm.svc.cluster.local:4000/v1"
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef: { key: APP_OMNIGENT_LITELLM_API_KEY }
