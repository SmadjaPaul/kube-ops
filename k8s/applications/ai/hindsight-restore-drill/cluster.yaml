# Restauration isolee de hindsight-personal/hindsight-db depuis R2 (PLT-301, critere drill).
# Pas d'archiveur WAL : le drill n'ecrit rien dans R2. Jamais la base vivante.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hindsight-db-drill
  namespace: hindsight-restore-drill
  labels:
    backup.smadja.dev/restore-drill: "true"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7-standard-trixie@sha256:44c64899a6fb61c01b56a91322cb9cfdc955aa5fd1c8f34ff3a0a9f51664a202
  bootstrap:
    recovery:
      source: hindsight-live
      database: hindsight
      owner: hindsight
      # Pas de secret : CNPG genere hindsight-db-drill-app pour le drill.
  externalClusters:
    - name: hindsight-live
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: hindsight-live-r2-ro
          serverName: hindsight-db
  storage: {size: 10Gi, storageClass: longhorn-bulk}
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  affinity:
    enablePodAntiAffinity: false
