# Identite lecture seule du bucket homelab-backup-cnpg : le drill n'ecrit jamais.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-restore-drill-r2-ro
  namespace: hindsight-restore-drill
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: hindsight-restore-drill-r2-ro, creationPolicy: Owner}
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: {key: R2_CNPG_RESTORE_RO_ACCESS_KEY_ID}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: {key: R2_CNPG_RESTORE_RO_SECRET_ACCESS_KEY}
    - secretKey: AWS_ENDPOINT_URL_S3
      remoteRef: {key: R2_S3_ENDPOINT}
