apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: talos-personal-network-policy
  namespace: openclaw-talos-personal
  labels:
    app.kubernetes.io/name: openclaw
    app.kubernetes.io/instance: talos-personal
    policy-type: ai-audit
spec:
  description: "Talos Personal: isolated cell with LiteLLM, Qdrant, DNS and internal Gateway ingress only."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw
      app.kubernetes.io/instance: talos-personal
  ingress:
    - fromEntities: [host, remote-node, ingress]
      toPorts:
        - ports:
            - port: "18790"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: litellm
            app: litellm
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "4000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: qdrant
            app: qdrant
      toPorts:
        - ports:
            - port: "6333"
              protocol: TCP
            - port: "6334"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
