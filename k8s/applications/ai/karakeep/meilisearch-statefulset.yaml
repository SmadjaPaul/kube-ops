apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: meilisearch
spec:
  serviceName: "meilisearch"
  replicas: 1
  selector:
    matchLabels:
      app: meilisearch
  volumeClaimTemplates:
    - metadata:
        name: meilisearch-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "longhorn-fast"
        resources:
          requests:
            storage: 5Gi
  template:
    metadata:
      labels:
        app: meilisearch
      annotations:
        # The index is rebuilt from Karakeep's durable web data.
        backup.velero.io/backup-volumes-excludes: meilisearch-data
    spec:
      hostIPC: false
      hostPID: false
      hostNetwork: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: meilisearch
          # Pinned to v1.46.x (renovate.json rule "Composant critique Meilisearch"):
          # a minor bump cannot open the existing index without a migration
          # (CrashLoopBackOff "database version 1.46.0 incompatible with engine 1.57.0" after #1816).
          # Upgrade by hand: https://docs.karakeep.com/administration/meilisearch-upgrade
          # - in place: MEILI_UPGRADE_DB=true for one start (one-way; v1.51+ target), then remove it;
          # - or rebuild: empty data.ms, then Admin Settings > Background Jobs > Reindex All Bookmarks.
          image: getmeili/meilisearch:v1.46.0@sha256:2ca7c957b853238addd0352e1e78a24423740356045a6f65973b6373f859f066
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: '25m'
              memory: '250Mi'
            limits:
              cpu: '1000m'
              memory: '500Mi'
          env:
            - name: MEILI_NO_ANALYTICS
              value: 'true'
          volumeMounts:
            - mountPath: /meili_data
              name: meilisearch-data
            - mountPath: /tmp
              name: tmp
          envFrom:
            - secretRef:
                name: karakeep-secrets
            - configMapRef:
                name: karakeep-configuration
          livenessProbe:
            httpGet:
              path: /health
              port: 7700
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 7700
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
