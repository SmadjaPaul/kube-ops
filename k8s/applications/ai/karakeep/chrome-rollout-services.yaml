apiVersion: v1
kind: Service
metadata:
  name: chrome-rollout-active
  namespace: karakeep
spec:
  type: ClusterIP
  selector:
    app: chrome-rollout
  ports:
    - {name: http, port: 9222, targetPort: 9222, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: chrome-rollout-preview
  namespace: karakeep
spec:
  type: ClusterIP
  selector:
    app: chrome-rollout
  ports:
    - {name: http, port: 9222, targetPort: 9222, protocol: TCP}
