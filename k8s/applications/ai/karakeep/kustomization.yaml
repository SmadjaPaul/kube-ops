apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: karakeep

configMapGenerator:
- literals:
  - NEXTAUTH_URL=https://karakeep.smadja.dev
  name: karakeep-configuration

resources:
- namespace.yaml
- web-statefulset.yaml
- web-service.yaml
- chrome-deployment.yaml
- chrome-service.yaml
- meilisearch-statefulset.yaml
- meilisearch-service.yaml
- http-route.yaml
- karakeep-secrets-external.yaml

# Tag + digest portes par le transformateur images (PLT-392) : un replacement sur le champ image
# cassait l'epinglage par digest (delimiter ':'). Renovate suit newTag/digest (manager kustomize).
images:
- name: ghcr.io/karakeep-app/karakeep
  newTag: 0.32.0
  digest: sha256:64d6a9bbf2d37b5c808cf06b5d87f1f1c7846fdd3844724145a9741aeb06fd31
