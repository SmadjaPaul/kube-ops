apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep-secrets
  namespace: karakeep
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: karakeep-secrets
    creationPolicy: Owner
  data:
    - secretKey: NEXTAUTH_SECRET
      remoteRef:
        key: APP_KARAKEEP_NEXTAUTH_SECRET
    - secretKey: MEILI_MASTER_KEY
      remoteRef:
        key: APP_KARAKEEP_MEILI_MASTER_KEY
    - secretKey: NEXT_PUBLIC_SECRET
      remoteRef:
        key: APP_KARAKEEP_NEXT_PUBLIC_SECRET
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: GLOBAL_OPENAI_API_KEY
    - secretKey: OAUTH_CLIENT_ID
      remoteRef:
        key: 'APP_KARAKEEP_OAUTH_CLIENT_ID'
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: 'APP_KARAKEEP_OAUTH_CLIENT_SECRET'

