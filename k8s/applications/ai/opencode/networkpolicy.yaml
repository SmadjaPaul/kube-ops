# PLT-392 : deny ingress par defaut ; seul le port web 5003 est joignable depuis la Gateway/hote.
# playwright-mcp (8931) et opencode (127.0.0.1) restent en loopback du pod, non concernes.
# PLT-567 : le reverse proxy KEDA (namespace keda) devient la porte d'entree du trafic
# applicatif ; il doit pouvoir joindre le port 5003. Selection par namespace : le chart
# http-add-on n'est pas fige dans Git (helmCharts), un libelle de pod ne l'est pas.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: { name: opencode-web, namespace: opencode }
spec:
  endpointSelector:
    matchLabels: { app: opencode-web }
  ingress:
    - fromEntities: [host, remote-node, ingress]
      toPorts:
        - ports:
            - { protocol: TCP, port: "5003" }
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: keda
      toPorts:
        - ports:
            - { protocol: TCP, port: "5003" }
