
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-opencode-secrets
  namespace: opencode
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: app-opencode-secrets
    creationPolicy: Owner
  data:
    - secretKey: AUTH_SECRET
      remoteRef:
        key: APP_OPENCODE_AUTH_SECRET
    - secretKey: VAPID_PUBLIC_KEY
      remoteRef:
        key: APP_OPENCODE_VAPID_PUBLIC
    - secretKey: VAPID_PRIVATE_KEY
      remoteRef:
        key: APP_OPENCODE_VAPID_PRIVATE