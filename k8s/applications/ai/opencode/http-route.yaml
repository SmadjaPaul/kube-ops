# PLT-567 : le trafic passe par le reverse proxy du http-add-on KEDA (namespace keda),
# qui redemarre opencode a froid puis relaie la requete (ScaledObject, min 0).
# Le ReferenceGrant qui autorise cette reference inter-namespace est dans keda/.
apiVersion: gateway.networking.k8s.io/v1  
kind: HTTPRoute  
metadata:  
  name: opencode-web  
  namespace: opencode  
spec:  
  parentRefs:  
    - name: internal  
      namespace: gateway  
  hostnames:  
    - "opencode.smadja.dev"  
  rules:  
    - matches:  
        - path:  
            type: PathPrefix  
            value: /api/sse/  
      backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
      timeouts:  
        request: "0s"
      filters:  
      - type: ResponseHeaderModifier  
        responseHeaderModifier:  
          add:  
            - name: Cache-Control  
              value: "no-cache"  
            - name: Connection  
              value: "keep-alive"  
            - name: Content-Type  
              value: "text/event-stream"
    - matches:  
        - path:  
            type: PathPrefix  
            value: /  
      backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
