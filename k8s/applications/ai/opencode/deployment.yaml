apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode-web
  namespace: opencode
  labels:
    app: opencode-web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: opencode-web
  template:
    metadata:
      labels:
        app: opencode-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: kustomize
          image: registry.k8s.io/kustomize/kustomize:v5.7.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args: ["mkdir -p /opt/shared-tools/bin && cp /app/kustomize /opt/shared-tools/bin/kustomize && chmod 755 /opt/shared-tools/bin/kustomize"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: shared-tools
              mountPath: /opt/shared-tools
        - name: helm
          image: alpine/helm:3.18.6
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args: ["mkdir -p /opt/shared-tools/bin && cp /usr/bin/helm /opt/shared-tools/bin/helm && chmod 755 /opt/shared-tools/bin/helm"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: shared-tools
              mountPath: /opt/shared-tools
      containers:
      - name: opencode-web
        image: ghcr.io/chriswritescode-dev/opencode-manager:0.13.0
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 5003
        env:
        - name: OPENCODE_HOST
          value: "127.0.0.1"
        - name: AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: app-opencode-secrets
              key: AUTH_SECRET
        - name: ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              name: app-opencode-secrets
              key: ADMIN_EMAIL
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-opencode-secrets
              key: ADMIN_PASSWORD
        - name: AUTH_TRUSTED_ORIGINS
          value: "https://opencode.smadja.dev,http://localhost:5003"
        - name: AUTH_SECURE_COOKIES
          value: "true"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=512"
        - name: PATH
          value: "/opt/shared-tools/bin:/opt/bun/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: data
          mountPath: /app/data
        - name: shared-tools
          mountPath: /opt/shared-tools
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5003
          initialDelaySeconds: 40
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5003
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 5
        startupProbe:
          httpGet:
            path: /api/health
            port: 5003
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      - name: playwright-mcp
        image: mcr.microsoft.com/playwright:v1.60.0-jammy
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            export HOME=/home/pwuser
            export PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
            export NPM_CONFIG_CACHE=/home/pwuser/.npm
            export XDG_CONFIG_HOME=/home/pwuser/.config
            npx @playwright/mcp@latest --host 127.0.0.1 --port 8931 --isolated --allowed-hosts '*' --browser chromium
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: mcp-cache
            mountPath: /home/pwuser/.cache
          - name: mcp-npm
            mountPath: /home/pwuser/.npm
          - name: mcp-config
            mountPath: /home/pwuser/.config
          - name: mcp-tmp
            mountPath: /tmp
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: opencode-workspace-pvc
      - name: data
        persistentVolumeClaim:
          claimName: opencode-data-pvc
      - name: shared-tools
        emptyDir:
          sizeLimit: 1Gi
      - name: mcp-cache
        emptyDir:
          sizeLimit: 3Gi
      - name: mcp-npm
        emptyDir:
          sizeLimit: 1Gi
      - name: mcp-config
        emptyDir:
          sizeLimit: 128Mi
      - name: mcp-tmp
        emptyDir:
          sizeLimit: 512Mi
