apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: opencode-initcontainer-root
  namespace: opencode
  annotations:
    description: "Exception for OpenCode's upstream entrypoint and initContainers, which require narrowly scoped root capabilities for writable-volume setup and tool installation."
spec:
  match:
    any:
    - resources:
        kinds:
          - Deployment
        namespaces:
          - opencode
        names:
          - opencode-web
  exceptions:
    - policyName: nsa-hardening-all-namespaces
      ruleNames:
        - require-non-root-containers
        - require-read-only-root-filesystem
