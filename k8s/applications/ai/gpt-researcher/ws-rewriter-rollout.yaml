apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ws-rewriter-rollout
  namespace: gpt-researcher
  labels:
    app.kubernetes.io/name: ws-rewriter-rollout
spec:
  replicas: 1
  revisionHistoryLimit: 4
  progressDeadlineSeconds: 300
  progressDeadlineAbort: true
  rollbackWindow:
    revisions: 3
  strategy:
    blueGreen:
      activeService: ws-rewriter-rollout-active
      previewService: ws-rewriter-rollout-preview
      autoPromotionEnabled: true
      # Retain old ReplicaSet until post-analysis has finished.
      prePromotionAnalysis:
        templates:
          - templateName: ws-rewriter-http
        args:
          - name: service-name
            value: ws-rewriter-rollout-preview.gpt-researcher.svc.cluster.local
      postPromotionAnalysis:
        templates:
          - templateName: ws-rewriter-http
        args:
          - name: service-name
            value: ws-rewriter-rollout-active.gpt-researcher.svc.cluster.local
  selector:
    matchLabels:
      app.kubernetes.io/name: ws-rewriter-rollout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ws-rewriter-rollout
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: caddy:2.11.2-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: true
            runAsNonRoot: false
            runAsUser: 0
            capabilities:
              drop:
                - NET_RAW
            readOnlyRootFilesystem: false
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy
              readOnly: true
            - name: caddy-cache
              mountPath: /tmp
            - name: caddy-data
              mountPath: /data
            - name: caddy-run
              mountPath: /run/caddy
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: caddy-config
          configMap:
            name: ws-rewriter-config
        - name: caddy-cache
          emptyDir: {}
        - name: caddy-data
          emptyDir: {}
        - name: caddy-run
          emptyDir: {}
