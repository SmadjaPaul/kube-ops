apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: litellm-postgresql-weekly
  namespace: litellm
spec:
  schedule: "0 30 2 * * 0"
  backupOwnerReference: self
  cluster:
    name: litellm-postgresql-restored
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: litellm-hetzner-store
