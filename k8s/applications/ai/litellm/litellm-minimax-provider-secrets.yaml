apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-minimax-provider-secrets
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: litellm-minimax-provider-secrets
    creationPolicy: Owner
  data:
    - secretKey: MINIMAX_API_KEY
      remoteRef:
        key: APP_MINIMAX_TOKEN_PLAN_API_KEY
    - secretKey: MINIMAX_API_BASE
      remoteRef:
        key: APP_MINIMAX_TOKEN_PLAN_API_BASE
