apiVersion: apps/v1
kind: Deployment
metadata:
  name: von
  namespace: litellm
  labels:
    app: von
    app.kubernetes.io/name: von
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: von
  template:
    metadata:
      labels:
        app: von
        app.kubernetes.io/name: von
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: von
          image: ghcr.io/wfzyx/von:1.3.7-cpu
          imagePullPolicy: IfNotPresent
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --device
            - openvino:cpu
            - --on-overflow
            - refuse
            - --no-chains
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - secretRef:
                name: von-secrets
          env:
            - name: HF_HOME
              value: /data/huggingface
            - name: HOME
              value: /tmp
            - name: OPENVINO_CACHE_DIR
              value: /data/huggingface/openvino
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: model-cache
              mountPath: /data/huggingface
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: von-model-cache
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
