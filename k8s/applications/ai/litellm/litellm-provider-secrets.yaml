# Provider credentials are delivered by ESO from Doppler; values never belong in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-provider-secrets
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: litellm-provider-secrets
    creationPolicy: Owner
  data:
    - secretKey: VLLM_API_KEY
      remoteRef:
        key: APP_VLLM_EMBED_API_KEY
    - secretKey: openai_base_url_1
      remoteRef:
        key: APP_OPENAI_BASE_URL_1
    - secretKey: openai_api_key_1
      remoteRef:
        key: APP_OPENAI_API_KEY_1
    - secretKey: CLOUDFLARE_WORKERS_API_BASE
      remoteRef:
        key: APP_CLOUDFLARE_WORKERS_API_BASE
    - secretKey: CLOUDFLARE_WORKERS_API_KEY
      remoteRef:
        key: APP_CLOUDFLARE_WORKERS_API_KEY
    - secretKey: CEREBRAS_API_KEY
      remoteRef:
        key: APP_CEREBRAS_API_KEY
    - secretKey: openai_base_url_2
      remoteRef:
        key: APP_OPENAI_BASE_URL_2
    - secretKey: openai_api_key_2
      remoteRef:
        key: APP_OPENAI_API_KEY_2
    - secretKey: MISTRAL_API_KEY
      remoteRef:
        key: APP_MISTRAL_API_KEY
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: APP_ANTHROPIC_API_KEY
    - secretKey: TAVILY_API_KEY
      remoteRef:
        key: APP_TAVILY_API_KEY
    - secretKey: XIAOMI_MIMO_API_KEY
      remoteRef:
        key: APP_XIAOMI_MIMO_API_KEY
    - secretKey: DASHSCOPE_API_KEY
      remoteRef:
        key: APP_ALIBABA_MODEL_STUDIO_API_KEY
    - secretKey: ALIBABA_MODEL_STUDIO_BASE_URL
      remoteRef:
        key: APP_ALIBABA_MODEL_STUDIO_BASE_URL
