apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: litellm

# The LiteLLM proxy itself is deployed by the official litellm-helm child
# Application. This Kustomization owns the namespace-local dependencies and
# policy inputs that remain first-class GitOps resources.
resources:
- namespace.yaml
- http-route.yaml
- litellm-secrets.yaml
- litellm-provider-secrets.yaml
- von-secrets.yaml
- von-pvc.yaml
- von-deployment.yaml
- von-service.yaml
- redis.yaml
- database.yaml
- database-scheduled-backup.yaml
- database-objectstore.yaml
- database-s3-credentials.yaml
- backup-smoke-20260929.yaml
- podmonitor.yaml
