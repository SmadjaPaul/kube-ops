apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: litellm

# Pin the rendered workload to the patched monolithic image recommended for
# PostgreSQL-backed LiteLLM deployments. Keep the base Deployment generic so the
# version policy remains visible at the Kustomize boundary.
images:
- name: ghcr.io/berriai/litellm-non_root
  newName: ghcr.io/berriai/litellm
  newTag: v1.103.2

configMapGenerator:
- name: litellm-config
  files:
  - proxy_server_config.yaml

resources:
- namespace.yaml
- http-route.yaml
- litellm-secrets.yaml
- litellm-provider-secrets.yaml
- deployment.yaml
- redis.yaml
- svc.yaml
- database.yaml
- database-scheduled-backup.yaml
- database-objectstore.yaml
- database-s3-credentials.yaml
- backup-smoke-20260929.yaml
- podmonitor.yaml
