apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: litellm

# The patched stable is published on LiteLLM's monolithic PostgreSQL-capable
# image. The Deployment still enforces runAsNonRoot, UID 1000, dropped
# capabilities and a read-only root filesystem.
images:
- name: ghcr.io/berriai/litellm-non_root
  newName: ghcr.io/berriai/litellm
  newTag: v1.103.2

configMapGenerator:
- name: litellm-config
  files:
  - proxy_server_config.yaml

resources:
- namespace.yaml
- http-route.yaml
- litellm-secrets.yaml
- litellm-provider-secrets.yaml
- deployment.yaml
- redis.yaml
- svc.yaml
- database.yaml
- database-scheduled-backup.yaml
- database-objectstore.yaml
- database-s3-credentials.yaml
- backup-smoke-20260929.yaml
- podmonitor.yaml
