apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: litellm

# The old non_root image line remains in deployment.yaml so PR #131 can merge
# independently. Desired state is pinned here to the current patched monolithic
# image recommended for PostgreSQL-backed LiteLLM deployments.
images:
- name: ghcr.io/berriai/litellm-non_root
  newName: ghcr.io/berriai/litellm
  newTag: v1.103.2

configMapGenerator:
- name: litellm-config
  files:
  - proxy_server_config.yaml

resources:
- namespace.yaml
- http-route.yaml
- litellm-secrets.yaml
- litellm-provider-secrets.yaml
- deployment.yaml
- redis.yaml
- svc.yaml
- database.yaml
- database-scheduled-backup.yaml
- database-objectstore.yaml
- database-s3-credentials.yaml
- backup-smoke-20260929.yaml
- podmonitor.yaml
