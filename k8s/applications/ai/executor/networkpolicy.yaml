apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: executor
  namespace: executor
  labels:
    policy-type: ai-audit
spec:
  description: "Executor POC: private Gateway and Paperclip ingress; DNS-only egress until an integration is explicitly approved."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: executor
      app.kubernetes.io/component: server
  ingress:
    - fromEntities:
        - host
        - remote-node
        - ingress
      toPorts:
        - ports:
            - port: "4400"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: paperclip
            app.kubernetes.io/name: paperclip
            app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "4400"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
