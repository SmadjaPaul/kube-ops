apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: paperclip
  namespace: paperclip
  labels:
    policy-type: ai-audit
spec:
  description: "Paperclip V1: internal Gateway ingress; egress only to CNPG, LiteLLM, DNS and GitHub/npm bootstrap surfaces."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: paperclip
      app.kubernetes.io/component: server
  ingress:
    - fromEntities:
        - host
        - remote-node
        - ingress
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: litellm
            app: litellm
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: paperclip
            cnpg.io/cluster: paperclip-postgresql
      toPorts:
        - ports:
            - port: "5432"
          protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: auth
            app.kubernetes.io/name: authentik
      toPorts:
        - ports:
            - port: "9000"
          protocol: TCP
    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
        - matchName: raw.githubusercontent.com
        - matchName: objects.githubusercontent.com
        - matchName: codeload.github.com
        - matchName: registry.npmjs.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: paperclip-postgresql-backup
  namespace: paperclip
  labels:
    policy-type: ai-audit
spec:
  description: "Allow Paperclip CNPG WAL/base backups to Hetzner Object Storage."
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: paperclip-postgresql
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toFQDNs:
        - matchName: fsn1.your-objectstorage.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
