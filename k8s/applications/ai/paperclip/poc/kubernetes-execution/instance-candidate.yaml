apiVersion: paperclip.inc/v1alpha1
kind: Instance
metadata:
  name: paperclip
  namespace: paperclip
spec:
  plugins:
    - name: "@paperclipai/plugin-kubernetes"
      # Stable npm pin qualified on 2026-10-08. This is not an activation.
      version: "2026.1005.0"
  adapters:
    execution:
      mode: kubernetes
      kubernetes:
        # Stable fallback. sandbox-cr is excluded until the plugin moves from
        # agents.x-k8s.io/v1alpha1 to the currently released v1beta1 API.
        backend: job
        egressMode: cilium
        egressPolicy: allowlist
        egressAllowFQDNs:
          - paperclip.paperclip.svc.cluster.local
          - litellm.litellm.svc.cluster.local
          - github.com
          - api.github.com
          - raw.githubusercontent.com
          - objects.githubusercontent.com
          - codeload.github.com
          - registry.npmjs.org
        namespacePrefix: paperclip-exec-
        perTenantQuota:
          pods: "4"
          requestsCpu: "2"
          requestsMemory: "4Gi"
          limitsCpu: "4"
          limitsMemory: "8Gi"
        perTenantLimitRange:
          defaultCpu: "500m"
          defaultMemory: "1Gi"
          defaultRequestCpu: "100m"
          defaultRequestMemory: "256Mi"
          maxCpu: "2"
          maxMemory: "4Gi"
