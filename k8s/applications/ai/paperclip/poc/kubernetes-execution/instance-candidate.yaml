apiVersion: paperclip.inc/v1alpha1
kind: Instance
metadata:
  name: paperclip
  namespace: paperclip
spec:
  plugins:
    - name: "@paperclipai/plugin-kubernetes"
      # Published package version observed in the upstream plugin manifest.
      # Keep this candidate non-live until the server/plugin compatibility
      # matrix and the agent-sandbox controller version are refreshed together.
      version: "0.1.0"
  adapters:
    execution:
      mode: kubernetes
      kubernetes:
        backend: sandbox-cr
        namespacePrefix: paperclip-exec-
        egressMode: cilium
        # This is the Paperclip Operator bridge schema. It maps to the
        # provider's environment configuration; it is intentionally not the
        # provider's direct egressAllowFqdns spelling.
        egressPolicy: allowlist
        egressAllowFQDNs:
          - paperclip.paperclip.svc.cluster.local
          - litellm.litellm.svc.cluster.local
          - github.com
          - api.github.com
          - raw.githubusercontent.com
          - objects.githubusercontent.com
          - codeload.github.com
          - registry.npmjs.org
        perTenantQuota:
          pods: "4"
          requestsCpu: "2"
          requestsMemory: 4Gi
          limitsCpu: "4"
          limitsMemory: 8Gi
        perTenantLimitRange:
          defaultCpu: 500m
          defaultMemory: 1Gi
          defaultRequestCpu: 100m
          defaultRequestMemory: 256Mi
          maxCpu: "2"
          maxMemory: 4Gi
        # The upstream provider currently resolves opencode_local to a v1 tag.
        # The operator bridge has no direct digest field. Do not activate this
        # candidate until the operator-to-provider translation and an immutable
        # image reference are independently verified.
