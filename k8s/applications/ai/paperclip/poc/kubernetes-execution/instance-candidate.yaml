apiVersion: paperclip.inc/v1alpha1
kind: Instance
metadata:
  name: paperclip
  namespace: paperclip
spec:
  plugins:
    - name: "@paperclipai/plugin-kubernetes"
      # Candidate pin only. Refresh against the live Paperclip server before use.
      version: "2026.1005.0"
  adapters:
    execution:
      mode: kubernetes
      kubernetes:
        backend: sandbox-cr
        namespacePrefix: paperclip-exec-
        egressMode: cilium
        egressAllowFQDNs:
          - paperclip.paperclip.svc.cluster.local
          - litellm.litellm.svc.cluster.local
          - github.com
          - api.github.com
          - raw.githubusercontent.com
          - objects.githubusercontent.com
          - codeload.github.com
          - registry.npmjs.org
        perTenantQuota:
          pods: "4"
          requestsCpu: "2"
          requestsMemory: 4Gi
          limitsCpu: "4"
          limitsMemory: 8Gi
        perTenantLimitRange:
          defaultCpu: 500m
          defaultMemory: 1Gi
          defaultRequestCpu: 100m
          defaultRequestMemory: 256Mi
          maxCpu: "2"
          maxMemory: 4Gi
