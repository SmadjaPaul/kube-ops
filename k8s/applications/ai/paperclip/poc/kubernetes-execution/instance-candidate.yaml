apiVersion: paperclip.inc/v1alpha1
kind: Instance
metadata:
  name: paperclip
  namespace: paperclip
spec:
  # Do not declare spec.plugins here. Operator v0.19.1 exposes that field in
  # the CRD but does not consume it when rendering the StatefulSet and does
  # not install npm packages from it. The Kubernetes provider is selected by
  # Paperclip's bundled local-plugin path in the image (self-hosted
  # auto-install key: "kubernetes"). Keeping the npm reference here would be
  # misleading and could select the incompatible upstream alpha package.
  env:
    # Future activation reference only. ESO must provide a dedicated scoped
    # LiteLLM virtual key under this name; the master key is never permitted.
    - name: LITELLM_API_KEY
      valueFrom:
        secretKeyRef:
          name: paperclip-agent-litellm
          key: LITELLM_API_KEY
          optional: false
    # `port` is the Cilium post-DNAT backend port (4000). OpenCode still uses
    # the LiteLLM Service frontend URL on port 80.
    - name: PAPERCLIP_K8S_INTERNAL_SERVICES
      value: '[{"name":"litellm","namespace":"litellm","port":4000}]'
    - name: PAPERCLIP_K8S_SERVER_ENDPOINT_LABELS
      value: '{"app.kubernetes.io/name":"paperclip","app.kubernetes.io/component":"server"}'
    # Non-secret, immutable adapter registry consumed by the deployed Paperclip
    # bootstrap. This is the supported environment-level image selection path;
    # it is not a Kubernetes pod override and is intentionally non-live.
    - name: PAPERCLIP_ADAPTERS
      value: >-
        [{"adapterType":"opencode_local","enabled":true,"runtimeImage":"ghcr.io/paperclipai/agent-runtime-opencode@sha256:349fc68e609998f1d9fc77f94208d50263368b49631f746a51f819917d9b0d2d","envKeys":["LITELLM_API_KEY"],"allowFqdns":["github.com","api.github.com","raw.githubusercontent.com","objects.githubusercontent.com","codeload.github.com","registry.npmjs.org"],"probeCommand":["opencode","--version"],"defaultEnv":{"OPENCODE_CONFIG_CONTENT":"{\"$schema\":\"https://opencode.ai/config.json\",\"enabled_providers\":[\"litellm\"],\"model\":\"litellm/factory/default\",\"small_model\":\"litellm/factory/fast\",\"provider\":{\"litellm\":{\"npm\":\"@ai-sdk/openai-compatible\",\"name\":\"Smadja LiteLLM\",\"options\":{\"baseURL\":\"http://litellm.litellm.svc.cluster.local:80/v1\",\"apiKey\":\"{env:LITELLM_API_KEY}\"}}}}"}}]
  adapters:
    execution:
      mode: kubernetes
      kubernetes:
        backend: sandbox-cr
        namespacePrefix: paperclip-exec-
        egressMode: cilium
        # This is the Paperclip Operator bridge schema. It maps to the
        # provider's environment configuration; it is intentionally not the
        # provider's direct egressAllowFqdns spelling.
        egressPolicy: allowlist
        egressAllowFQDNs:
          - github.com
          - api.github.com
          - raw.githubusercontent.com
          - objects.githubusercontent.com
          - codeload.github.com
          - registry.npmjs.org
        perTenantQuota:
          pods: "4"
          requestsCpu: "2"
          requestsMemory: 4Gi
          limitsCpu: "4"
          limitsMemory: 8Gi
        perTenantLimitRange:
          defaultCpu: 500m
          defaultMemory: 1Gi
          defaultRequestCpu: 100m
          defaultRequestMemory: 256Mi
          maxCpu: "2"
          maxMemory: 4Gi
        # The operator bridge has no direct digest field. The immutable image is
        # supplied through PAPERCLIP_ADAPTERS above, which the deployed
        # Paperclip bootstrap translates into the provider adapter registry.
        # Do not activate this candidate until that path is runtime-verified.
