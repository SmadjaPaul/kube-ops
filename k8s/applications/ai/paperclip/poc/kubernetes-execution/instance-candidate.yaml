apiVersion: paperclip.inc/v1alpha1
kind: Instance
metadata:
  name: paperclip
  namespace: paperclip
spec:
  plugins:
    - name: "@paperclipai/plugin-kubernetes"
      # Candidate pin only. Refresh against the live Paperclip server before use.
      version: "2026.916.1"
  adapters:
    execution:
      mode: kubernetes
      kubernetes:
        inCluster: true
        backend: sandbox-cr
        adapterType: opencode_local
        namespacePrefix: paperclip-exec-
        imageRegistry: ghcr.io/smadjapaul
        imageAllowList:
          - ghcr.io/smadjapaul/agent-runtime-opencode@sha256:4867139b5f0a557801656615898075afb0a821d89d359ab03c83aba245fd605f
        adapters:
          - adapterType: opencode_local
            enabled: true
            runtimeImage: ghcr.io/smadjapaul/agent-runtime-opencode@sha256:4867139b5f0a557801656615898075afb0a821d89d359ab03c83aba245fd605f
            # No production API or GitHub credentials are forwarded to the agent pod.
            envKeys: []
            allowFqdns: []
            probeCommand: ["opencode", "--version"]
        imagePullSecrets: []
        egressMode: cilium
        egressAllowFqdns:
          - paperclip.paperclip.svc.cluster.local
          - litellm.litellm.svc.cluster.local
          - github.com
          - api.github.com
          - raw.githubusercontent.com
          - objects.githubusercontent.com
          - codeload.github.com
          - registry.npmjs.org
        defaultResources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "2"
            memory: 4Gi
        serviceAccountAnnotations: {}
        jobTtlSecondsAfterFinished: 900
        podActivityDeadlineSec: 3600
