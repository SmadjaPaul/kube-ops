apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperclip-admin-bootstrap
  namespace: paperclip
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: paperclip-admin-bootstrap
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: APP_PAPERCLIP_ADMIN_PASSWORD
