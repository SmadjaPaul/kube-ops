apiVersion: v1
kind: ConfigMap
metadata:
  name: paperclip-runtime-config
  namespace: paperclip
data:
  DO_NOT_TRACK: "1"
  PAPERCLIP_TELEMETRY_DISABLED: "1"
  PAPERCLIP_MANAGED_RUNTIME_HTTPS: "off"
  OPENCODE_CONFIG_CONTENT: |
    {
      "$schema": "https://opencode.ai/config.json",
      "enabled_providers": ["litellm"],
      "model": "litellm/anthropic/claude-sonnet-4-6",
      "small_model": "litellm/anthropic/claude-haiku-4-5",
      "provider": {
        "litellm": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "Smadja LiteLLM",
          "options": {
            "baseURL": "http://litellm.litellm.svc.cluster.local:80/v1",
            "apiKey": "{env:LITELLM_API_KEY}"
          },
          "models": {
            "anthropic/claude-haiku-4-5": {"name": "Claude Haiku 4.5 via LiteLLM"},
            "anthropic/claude-sonnet-4-6": {"name": "Claude Sonnet 4.6 via LiteLLM"},
            "anthropic/claude-opus-4-6": {"name": "Claude Opus 4.6 via LiteLLM"},
            "azure/gpt-5.3-codex": {"name": "GPT-5.3 Codex via LiteLLM"},
            "minimax/MiniMax-M2.7": {"name": "MiniMax M2.7 via LiteLLM"}
          }
        }
      }
    }
