apiVersion: v1
kind: ConfigMap
metadata:
  name: paperclip-runtime-config
  namespace: paperclip
data:
  DO_NOT_TRACK: "1"
  PAPERCLIP_TELEMETRY_DISABLED: "1"
  PAPERCLIP_MANAGED_RUNTIME_HTTPS: "off"
  PAPERCLIP_GITHUB_BROKER_URL: "http://paperclip:3100"
  OPENCODE_CONFIG_CONTENT: |
    {
      "$schema": "https://opencode.ai/config.json",
      "enabled_providers": ["agentgateway"],
      "model": "agentgateway/factory/code",
      "small_model": "agentgateway/factory/fast",
      "provider": {
        "agentgateway": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "Smadja Agentgateway",
          "options": {
            "baseURL": "http://agentgateway.agentgateway.svc.cluster.local:4000/v1",
            "apiKey": "{env:AGENTGATEWAY_API_KEY}"
          },
          "models": {
            "factory/fast": {"name": "Factory fast"},
            "factory/code": {"name": "Factory code"}
          }
        }
      }
    }
