apiVersion: v1
kind: ConfigMap
metadata:
  name: paperclip-runtime-config
  namespace: paperclip
data:
  DO_NOT_TRACK: "1"
  PAPERCLIP_TELEMETRY_DISABLED: "1"
  PAPERCLIP_MANAGED_RUNTIME_HTTPS: "off"
  OPENCODE_CONFIG_CONTENT: |
    {
      "$schema": "https://opencode.ai/config.json",
      "enabled_providers": ["litellm"],
      "model": "litellm/factory-implement",
      "small_model": "litellm/factory-research",
      "provider": {
        "litellm": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "Smadja LiteLLM",
          "options": {
            "baseURL": "http://litellm.litellm.svc.cluster.local:80/v1",
            "apiKey": "{env:LITELLM_API_KEY}"
          },
          "models": {
            "factory-manager": {"name": "Factory Manager via LiteLLM"},
            "factory-research": {"name": "Factory Research via LiteLLM"},
            "factory-implement": {"name": "Factory Implement via LiteLLM"},
            "factory-review": {"name": "Factory Review via LiteLLM"},
            "factory-qa": {"name": "Factory QA via LiteLLM"}
          }
        }
      }
    }
