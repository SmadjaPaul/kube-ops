apiVersion: v1
kind: ConfigMap
metadata:
  name: paperclip-runtime-config
  namespace: paperclip
data:
  DO_NOT_TRACK: "1"
  PAPERCLIP_TELEMETRY_DISABLED: "1"
  PAPERCLIP_MANAGED_RUNTIME_HTTPS: "off"
  OPENCODE_CONFIG_CONTENT: |
    {
      "$schema": "https://opencode.ai/config.json",
      "enabled_providers": ["litellm"],
      "model": "litellm/code",
      "small_model": "litellm/fast",
      "provider": {
        "litellm": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "Smadja LiteLLM",
          "options": {
            "baseURL": "http://litellm.litellm.svc.cluster.local:4000/v1",
            "apiKey": "{env:LITELLM_API_KEY}"
          },
          "models": {
            "research": {"name": "Research"},
            "fast": {"name": "Fast"},
            "code": {"name": "Code"},
            "reasoning": {"name": "Reasoning"},
            "review": {"name": "Independent Review"},
            "auto": {"name": "Automatic Cost Router"}
          }
        }
      }
    }
