apiVersion: v1
kind: ConfigMap
metadata:
  name: paperclip-runtime-config
  namespace: paperclip
data:
  DO_NOT_TRACK: "1"
  PAPERCLIP_TELEMETRY_DISABLED: "1"
  PAPERCLIP_MANAGED_RUNTIME_HTTPS: "off"
  OPENCODE_CONFIG_CONTENT: |
    {
      "$schema": "https://opencode.ai/config.json",
      "enabled_providers": ["minimax", "mimo"],
      "model": "minimax/MiniMax-M3",
      "small_model": "minimax/MiniMax-M3",
      "provider": {
        "minimax": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "MiniMax Token Plan",
          "options": {
            "baseURL": "https://api.minimax.io/v1",
            "apiKey": "{env:MINIMAX_TOKEN_PLAN_API_KEY}"
          },
          "models": {
            "MiniMax-M3": {"name": "MiniMax M3"}
          }
        },
        "mimo": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "Xiaomi MiMo Token Plan",
          "options": {
            "baseURL": "https://token-plan-ams.xiaomimimo.com/v1",
            "apiKey": "{env:MIMO_TOKEN_PLAN_API_KEY}"
          },
          "models": {
            "mimo-v2.6-pro": {"name": "MiMo V2.6 Pro"}
          }
        }
      }
    }
