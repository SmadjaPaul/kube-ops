apiVersion: v1
kind: ConfigMap
metadata:
  name: paperclip-runtime-config
  namespace: paperclip
data:
  DO_NOT_TRACK: "1"
  PAPERCLIP_TELEMETRY_DISABLED: "1"
  PAPERCLIP_MANAGED_RUNTIME_HTTPS: "off"
  PAPERCLIP_GITHUB_BROKER_URL: "http://paperclip:3100"
  OPENCODE_CONFIG_CONTENT: |
    {
      "$schema": "https://opencode.ai/config.json",
      "enabled_providers": ["litellm"],
      "model": "litellm/factory/default",
      "small_model": "litellm/factory/fast",
      "provider": {
        "litellm": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "Smadja LiteLLM",
          "options": {
            "baseURL": "http://litellm.litellm.svc.cluster.local:80/v1",
            "apiKey": "{env:LITELLM_API_KEY}"
          },
          "models": {
            "factory/default": {"name": "Factory default"},
            "factory/fast": {"name": "Factory fast"},
            "factory/code": {"name": "Factory code"},
            "factory/research": {"name": "Factory research"},
            "factory/review": {"name": "Factory review"},
            "factory/embedding": {"name": "Factory embedding"}
          }
        }
      }
    }
