apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperclip-runtime-secrets
  namespace: paperclip
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: paperclip-runtime-secrets
    creationPolicy: Owner
  data:
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: APP_PAPERCLIP_BETTER_AUTH_SECRET
    - secretKey: PAPERCLIP_SECRETS_MASTER_KEY
      remoteRef:
        key: APP_PAPERCLIP_SECRETS_MASTER_KEY
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: APP_PAPERCLIP_FACTORY_LITELLM_API_KEY
