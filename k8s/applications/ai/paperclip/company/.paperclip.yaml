schema: paperclip/v1
agents:
  engineering-manager:
    adapter: opencode_local
    adapterConfig:
      model: litellm/reasoning
    budgetMonthlyCents: 3000
    runtimeConfig:
      heartbeat:
        enabled: false
  researcher:
    adapter: opencode_local
    adapterConfig:
      model: litellm/research
    budgetMonthlyCents: 1500
    runtimeConfig:
      heartbeat:
        enabled: false
  implementation-engineer:
    adapter: opencode_local
    adapterConfig:
      model: litellm/code
    budgetMonthlyCents: 3000
    runtimeConfig:
      heartbeat:
        enabled: false
  reviewer:
    adapter: opencode_local
    adapterConfig:
      model: litellm/review
    budgetMonthlyCents: 2000
    runtimeConfig:
      heartbeat:
        enabled: false
  qa-release-engineer:
    adapter: opencode_local
    adapterConfig:
      model: litellm/review
    budgetMonthlyCents: 2000
    runtimeConfig:
      heartbeat:
        enabled: false

projects:
  kube-ops:
    workspaces:
      main:
        name: kube-ops
        sourceType: git_repo
        repoUrl: https://github.com/SmadjaPaul/kube-ops.git
        repoRef: main
        defaultRef: main
        isPrimary: true
  homelab-infra:
    workspaces:
      main:
        name: homelab-infra
        sourceType: git_repo
        repoUrl: https://github.com/SmadjaPaul/homelab-infra.git
        repoRef: main
        defaultRef: main
        isPrimary: true
