schema: paperclip/v1
schemaVersion: 7
company:
  requireBoardApprovalForNewAgents: true
agents:
  engineering-manager:
    adapter:
      type: opencode_local
      config:
        model: litellm/factory/default
    budgetMonthlyCents: 3000
    runtime:
      heartbeat:
        enabled: false
  researcher:
    adapter:
      type: opencode_local
      config:
        model: litellm/factory/research
    budgetMonthlyCents: 1500
    runtime:
      heartbeat:
        enabled: false
  implementation-engineer:
    adapter:
      type: opencode_local
      config:
        model: litellm/factory/code
    budgetMonthlyCents: 3000
    runtime:
      heartbeat:
        enabled: false
  reviewer:
    adapter:
      type: opencode_local
      config:
        model: litellm/factory/review
    budgetMonthlyCents: 2000
    runtime:
      heartbeat:
        enabled: false
  qa-release-engineer:
    adapter:
      type: opencode_local
      config:
        model: litellm/factory/review
    budgetMonthlyCents: 2000
    runtime:
      heartbeat:
        enabled: false
  factory-platform-lead:
    adapter:
      type: opencode_local
      config:
        model: litellm/factory/default
    budgetMonthlyCents: 2500
    runtime:
      heartbeat:
        enabled: false
  data-platform-engineer:
    adapter:
      type: opencode_local
      config:
        model: litellm/factory/code
    budgetMonthlyCents: 3000
    runtime:
      heartbeat:
        enabled: false
  harness-engineer:
    adapter:
      type: opencode_local
      config:
        model: litellm/factory/code
    budgetMonthlyCents: 2500
    runtime:
      heartbeat:
        enabled: false

# Safe import into an existing Company intentionally omits executionWorkspacePolicy.
# Paperclip rejects runtime execution policy inside the safe-import package.
# Apply the reviewed policy explicitly with project update after import.
projects:
  kube-ops:
    workspaces:
      main:
        name: kube-ops
        sourceType: git_repo
        repoUrl: https://github.com/SmadjaPaul/kube-ops.git
        repoRef: main
        defaultRef: main
        isPrimary: true
  homelab-infra:
    workspaces:
      main:
        name: homelab-infra
        sourceType: git_repo
        repoUrl: https://github.com/SmadjaPaul/homelab-infra.git
        repoRef: main
        defaultRef: main
        isPrimary: true
  factory-platform:
    workspaces:
      main:
        name: factory-platform
        sourceType: git_repo
        repoUrl: https://github.com/SmadjaPaul/factory-platform.git
        repoRef: main
        defaultRef: main
        isPrimary: true
