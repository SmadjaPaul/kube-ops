  - externalId: KOPS-E04
    type: EPIC
    title: Argo delivery and reconciliation evidence
    status: backlog
    intent: Separate desired state, reconciliation and runtime evidence.
  - externalId: KOPS-E05
    type: EPIC
    title: Workload reliability and lifecycle
    status: backlog
    intent: Track bounded reliability work without prescribing product behavior.
  - externalId: KOPS-E06
    type: EPIC
    title: Network and Gateway correctness
    status: backlog
    intent: Maintain local-first routing, TLS and least-privilege connectivity.
  - externalId: KOPS-E07
    type: EPIC
    title: Identity and access integration
    status: backlog
