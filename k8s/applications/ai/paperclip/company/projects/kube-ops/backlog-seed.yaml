schema: paperclip/backlog-seed/v2
seedVersion: 2
project:
  name: kube-ops
  slug: kube-ops
  repository: SmadjaPaul/kube-ops
  defaultRef: main
  externalIdNamespace: smadja/kube-ops
policy:
  importMode: preview_then_create
  collisionStrategy: fail
  updateStrategy: no_replace
  preserveExisting: true
  createCredentials: false
  importLiveBacklog: false
  requireHumanApproval: true
  maxInitialTodoIssues: 10
  stableIdentity: externalId
issueTypes:
  - EPIC
  - EXECUTE
  - DISCOVER
  - DECIDE
  - HUMAN
statusVocabulary:
  epic: backlog
  initialTodo: todo
  noIssueIsInProgress: true
  noIssueIsDone: true
epics:
  - externalId: KOPS-E01
