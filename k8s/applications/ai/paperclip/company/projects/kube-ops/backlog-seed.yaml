initialTodoIssues:
  - externalId: KOPS-I001
    type: EXECUTE
    title: Ensure scheduled OpenClaw backup includes openclaw-data
    status: todo
    parentExternalId: KOPS-E10
    source: preserved-existing-backup-follow-up-seed
    description: >-
      Make a normal scheduled OpenClaw backup contain completed volume data for
      the legacy openclaw/openclaw-data PVC, then prove an isolated restore
      from that scheduled backup without mutating the legacy PVC.
    nonGoals:
      - Delete, replace, scale or restore over the legacy PVC.
      - Expose the restore publicly or inject production credentials.
  - externalId: KOPS-I002
    type: DISCOVER
    title: Document Paperclip company import compatibility
    status: todo
    parentExternalId: KOPS-E14
    description: Confirm the supported import format and version assumptions
      for the canonical company package without performing an import.
  - externalId: KOPS-I003
    type: EXECUTE
    title: Add static validation for the backlog seed
    status: todo
    parentExternalId: KOPS-E03
    description: Add a bounded check for unique external IDs, allowed types,
      epic references and the ten-issue initial todo limit.
  - externalId: KOPS-I004
    type: DISCOVER
    title: Audit Argo ownership boundaries for factory changes
    status: todo
