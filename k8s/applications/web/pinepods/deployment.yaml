apiVersion: apps/v1
kind: Deployment
metadata:
  name: pinepods
  namespace: pinepods
  labels:
    app.kubernetes.io/name: pinepods
    app.kubernetes.io/part-of: pinepods
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pinepods
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pinepods
        app.kubernetes.io/part-of: pinepods
        app.kubernetes.io/component: web
    spec:
      hostIPC: false
      hostPID: false
      hostNetwork: false
      securityContext:
        runAsUser: 911
        runAsGroup: 911
        fsGroup: 911
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-pinepods-runtime
          image: madeofpendletonwool/pinepods:0.8.2
          command:
            - sh
            - -c
            - |
              set -e
              # The pinepods:0.8.2 image's Dockerfile declares the
              # `pinepods` user/group at build time but the resulting
              # /etc/passwd does not include it (likely a BusyBox
              # adduser quirk on the tag the operator pinned). The
              # main container's startup.sh then runs usermod/groupmod
              # against a non-existent user and Horust fails to spawn
              # the children with 'User 911 not found'. Re-create the
              # user/group here from the init container.
              if ! getent passwd 911 >/dev/null; then
                addgroup -g 911 pinepods
                adduser -D -H -u 911 -G pinepods -h /pinepods pinepods
              fi
              # Take ownership of every path the main pinepods container
              # needs to write to. The main container runs as 911:911 with
              # allowPrivilegeEscalation=false and capabilities drop [ALL],
              # so it cannot chown these paths itself.
              chown 911:911 /var/log/pinepods /var/log/nginx /var/lib/nginx \
                              /run /var/run/horust /etc/horust/services
              # Seed the horust services directory from the image's baked-in
              # /pinepods/startup/services/. The main container's startup.sh
              # then re-copies them, but that's an idempotent operation that
              # only needs the directory to be writable.
              if [ -d /pinepods/startup/services ]; then
                cp -n /pinepods/startup/services/*.toml /etc/horust/services/ 2>/dev/null || true
              fi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
          volumeMounts:
            - name: var-log-pinepods
              mountPath: /var/log/pinepods
            - name: var-log-nginx
              mountPath: /var/log/nginx
            - name: var-lib-nginx
              mountPath: /var/lib/nginx
            - name: run
              mountPath: /run
            - name: var-run-horust
              mountPath: /var/run/horust
            - name: etc-horust-services
              mountPath: /etc/horust/services
      containers:
        - name: pinepods
          image: madeofpendletonwool/pinepods:0.8.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 911
            runAsGroup: 911
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8040
              name: http
          envFrom:
            - configMapRef:
                name: pinepods-config
            - secretRef:
                name: es-pinepods-admin
                optional: true
          env:
            - name: TZ
              value: Europe/Stockholm
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: pinepods-db-app
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: pinepods-db-app
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: pinepods-db-app
                  key: dbname
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: pinepods-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pinepods-db-app
                  key: password
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/pinepods_check
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/pinepods_check
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: downloads
              mountPath: /opt/pinepods/downloads
            - name: backups
              mountPath: /opt/pinepods/backups
            - name: certs
              mountPath: /opt/pinepods/certs
            - name: cache
              mountPath: /pinepods/cache
            - name: var-log-pinepods
              mountPath: /var/log/pinepods
            - name: var-log-nginx
              mountPath: /var/log/nginx
            - name: var-lib-nginx
              mountPath: /var/lib/nginx
            - name: run
              mountPath: /run
            - name: var-run-horust
              mountPath: /var/run/horust
            - name: etc-horust-services
              mountPath: /etc/horust/services
      volumes:
        - name: downloads
          persistentVolumeClaim:
            claimName: pinepods-downloads
        - name: backups
          persistentVolumeClaim:
            claimName: pinepods-backups
        - name: certs
          emptyDir:
            sizeLimit: 100Mi
        - name: cache
          emptyDir:
            sizeLimit: 3Gi
        - name: var-log-pinepods
          emptyDir:
            sizeLimit: 200Mi
        - name: var-log-nginx
          emptyDir:
            sizeLimit: 100Mi
        - name: var-lib-nginx
          emptyDir:
            sizeLimit: 200Mi
        - name: run
          emptyDir:
            sizeLimit: 100Mi
        - name: var-run-horust
          emptyDir:
            sizeLimit: 50Mi
        - name: etc-horust-services
          emptyDir:
            sizeLimit: 50Mi
