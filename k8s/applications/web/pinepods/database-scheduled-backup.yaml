apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pinepods-db-daily
  namespace: pinepods
spec:
  schedule: "0 30 3 * * *"
  backupOwnerReference: self
  cluster:
    name: pinepods-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: pinepods-hetzner-store
