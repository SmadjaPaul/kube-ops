apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pinepods-db-weekly
  namespace: pinepods
spec:
  schedule: "0 30 3 * * 0"
  backupOwnerReference: self
  cluster:
    name: pinepods-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      # PLT-221: base backups follow the WAL archive to R2.
      barmanObjectName: pinepods-r2-store
