apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: pinepods-db
  namespace: pinepods
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  enablePDB: false
  bootstrap:
    initdb:
      database: app
      owner: app
  # PLT-221: a Cluster has a single WAL archiver; the archive moved from
  # Hetzner to pinepods-r2-store. PLT-94: the Hetzner store was removed from
  # kube-ops; recovery points live on R2 only.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: pinepods-r2-store
  storage:
    size: 60Gi
    storageClass: longhorn-fast
  monitoring:
    enablePodMonitor: false
  postgresql:
    parameters:
      # PLT-344 lot 0 : WAL réduit (golden path stockage). archive_timeout 5min -> 15min : 96 segments forcés/jour au lieu de 288 (RPO R2 15 min).
      max_connections: "200"
      shared_buffers: "256MB"
      checkpoint_timeout: "15min"
      max_wal_size: "2GB"
      wal_compression: "lz4"
      archive_timeout: "15min"
  resources:
    requests:
      cpu: "25m"
      memory: "512Mi"
    limits:
      memory: "1Gi"
  affinity:
    enablePodAntiAffinity: false
