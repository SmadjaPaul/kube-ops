apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pinepods-db
  namespace: pinepods
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  enablePDB: false
  bootstrap:
    initdb:
      database: app
      owner: app
  # PLT-221: a Cluster has a single WAL archiver; the archive moved from
  # pinepods-hetzner-store to pinepods-r2-store (database-r2.yaml). Rollback:
  # point barmanObjectName back to pinepods-hetzner-store, then take a new
  # base backup there (homelab-infra docs/operations/r2-migration.md).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: pinepods-r2-store
  storage:
    size: 60Gi
    storageClass: longhorn-fast
  monitoring:
    enablePodMonitor: false
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
  resources:
    requests:
      cpu: "25m"
      memory: "512Mi"
    limits:
      memory: "1Gi"
  affinity:
    enablePodAntiAffinity: false
