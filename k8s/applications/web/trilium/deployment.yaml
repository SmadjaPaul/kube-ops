apiVersion: apps/v1
kind: Deployment
metadata:
  name: trilium
  namespace: trilium
  labels:
    app.kubernetes.io/name: trilium
    app.kubernetes.io/part-of: trilium
spec:
  # Replica count is controlled by the KEDA ScaledObject; do not pin it in GitOps.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trilium
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trilium
    spec:
      hostNetwork: false
      hostPID: false
      hostIPC: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: chown-data
          image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          command: ["sh", "-c", "chown -R 1000:1000 /home/node/trilium-data"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
              drop: []
          volumeMounts:
            - name: trilium-data
              mountPath: /home/node/trilium-data
      containers:
        - name: trilium
          image: ghcr.io/triliumnext/trilium:sha-621f1ff@sha256:53ca455e5e1d922a4064c46727988d46c906f3708d67a483eeb57b42ba6bef67 # renovate: docker=ghcr.io/triliumnext/trilium
          imagePullPolicy: IfNotPresent
          env:
            - name: TRILIUM_DATA_DIR
              value: /home/node/trilium-data
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            capabilities:
              add:
                - SETUID
                - SETGID
              drop: []
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/health-check
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/health-check
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health-check
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: trilium-data
              mountPath: /home/node/trilium-data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: trilium-data
          persistentVolumeClaim:
            claimName: trilium-data
        - name: tmp
          emptyDir:
            sizeLimit: 200Mi
