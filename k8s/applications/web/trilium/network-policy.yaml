apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trilium
  namespace: trilium
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: trilium
  ingress:
    - fromEntities:
        - host
        - remote-node
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # PLT-564 : le proxy KEDA (namespace keda) relaie le trafic vers Trilium ; c'est
    # lui qui reveille l'application a zero et qui sert le cold start.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: keda
            app.kubernetes.io/name: http-add-on
            app.kubernetes.io/component: interceptor
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
