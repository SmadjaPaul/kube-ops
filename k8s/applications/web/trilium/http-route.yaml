apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: trilium
  namespace: trilium
spec:
  parentRefs:
    - name: internal
      namespace: gateway
    - name: external
      namespace: gateway
  hostnames:
    - "trilium.smadja.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # PLT-564 : le trafic passe par le proxy KEDA, seul a savoir reveiller
        # Trilium a zero (ReferenceGrant : k8s/infrastructure/controllers/keda).
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
