exceptions:
  auth: "login applicatif natif (comptes locaux), pas d'authentification en amont ; route externe pour clients et API (302 vers /login)"
  observability: "trilium sans endpoint /metrics natif ; surveillance par la couverture generique kube-prometheus-stack (KubePodCrashLooping, KubePodNotReady)"
