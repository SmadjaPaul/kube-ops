apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: trilium
  namespace: trilium
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  target:
    service: trilium
    port: 8080
  rules:
    - hosts:
        - trilium.smadja.dev
  scalingMetric:
    concurrency:
      targetValue: 10
  coldStart:
    maxPendingRequests: 100
  timeouts:
    # PLT-564 : 120 s de cold start (Trilium a zero se leve, PVC Longhorn attache).
    readiness: 120s
    responseHeader: 60s
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: trilium
  namespace: trilium
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trilium
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 300
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
        interceptorRoute: trilium
