apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: romm
  namespace: romm
  labels:
    policy-type: games-audit
spec:
  description: "RomM: Gateway ingress; egress to CNPG, Authentik, DNS and keyless metadata providers."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: romm
  ingress:
    - fromEntities:
        - host
        - remote-node
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: romm
            cnpg.io/cluster: romm-postgresql
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toFQDNs:
        - matchName: auth.smadja.dev
        - matchName: hasheous.org
        - matchPattern: "*.hasheous.org"
        - matchPattern: "*.igdb.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: romm-postgresql-backup
  namespace: romm
  labels:
    policy-type: games-audit
spec:
  description: "Allow RomM CNPG WAL/base backups to Hetzner Object Storage."
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: romm-postgresql
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toFQDNs:
        - matchName: fsn1.your-objectstorage.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
