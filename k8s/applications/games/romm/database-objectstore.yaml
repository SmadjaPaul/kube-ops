# PLT-228: no longer referenced by the Cluster nor the ScheduledBackup (archive
# moved to romm-r2-store). Kept as the rollback target with its existing
# backups; no plugin sidecar applies its retentionPolicy anymore.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: romm-hetzner-store
  namespace: romm
spec:
  retentionPolicy: "14d"
  instanceSidecarConfiguration:
    env:
      - name: AWS_DEFAULT_REGION
        value: fsn1
  configuration:
    destinationPath: s3://smadja-dev-homelab-backups/cnpg/romm
    endpointURL: https://fsn1.your-objectstorage.com
    s3Credentials:
      accessKeyId:
        name: cnpg-hetzner-credentials
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-hetzner-credentials
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
      maxParallel: 2
    data:
      compression: gzip
