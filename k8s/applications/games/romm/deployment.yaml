apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm
  namespace: romm
  labels:
    app.kubernetes.io/name: romm
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: romm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: romm
        app.kubernetes.io/part-of: games
        backup.smadja.dev/velero: "true"
    spec:
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: romm
          image: ghcr.io/rommapp/romm:5.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: romm-runtime
          env:
            - name: TZ
              value: Europe/Paris
            - name: ROMM_DB_DRIVER
              value: postgresql
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: romm-postgresql-app
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: romm-postgresql-app
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: romm-postgresql-app
                  key: dbname
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: romm-postgresql-app
                  key: username
            - name: DB_PASSWD
              valueFrom:
                secretKeyRef:
                  name: romm-postgresql-app
                  key: password
            - name: ROMM_BASE_URL
              value: https://romm.smadja.dev
            - name: ROMM_SESSION_SECURE_COOKIE
              value: "true"
            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_PROVIDER
              value: authentik
            - name: OIDC_REDIRECT_URI
              value: https://romm.smadja.dev/api/oauth/openid
            - name: OIDC_SERVER_APPLICATION_URL
              value: https://auth.smadja.dev/application/o/romm/
            - name: OIDC_CLAIM_ROLES
              value: groups
            - name: OIDC_ROLE_ADMIN
              value: authentik-admins
            - name: OIDC_ROLE_VIEWER
              value: family,media
            - name: HASHEOUS_API_ENABLED
              value: "true"
            - name: SCAN_WORKERS
              value: "2"
            - name: WEB_SERVER_CONCURRENCY
              value: "2"
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: library
              mountPath: /romm/library
            - name: assets
              mountPath: /romm/assets
            - name: resources
              mountPath: /romm/resources
            - name: redis-data
              mountPath: /redis-data
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: romm-library
        - name: assets
          persistentVolumeClaim:
            claimName: romm-assets
        - name: resources
          persistentVolumeClaim:
            claimName: romm-resources
        - name: redis-data
          persistentVolumeClaim:
            claimName: romm-redis-data
