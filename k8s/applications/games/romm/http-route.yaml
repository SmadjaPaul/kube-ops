apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: romm
  namespace: romm
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: https-subdomains
    - name: external
      namespace: gateway
      sectionName: https-subdomains
  hostnames:
    - romm.smadja.dev
  rules:
    - backendRefs:
        # PLT-566 : le proxy KEDA (namespace keda) reveille l'application a froid ; le
        # ReferenceGrant qui autorise cette reference cross-namespace est dans keda/.
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
