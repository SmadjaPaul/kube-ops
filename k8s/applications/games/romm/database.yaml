apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: romm-postgresql
  namespace: romm
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7
  bootstrap:
    initdb:
      database: romm
      owner: romm
  # PLT-228: a Cluster has a single WAL archiver; the archive moved from
  # romm-hetzner-store to romm-r2-store (database-r2.yaml). Rollback: point
  # barmanObjectName back to romm-hetzner-store, then take a new base backup
  # there (homelab-infra docs/operations/r2-migration.md).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: romm-r2-store
  storage:
    size: 10Gi
    storageClass: longhorn-fast
  walStorage:
    size: 5Gi
    storageClass: longhorn-fast
    resizeInUseVolumes: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  monitoring:
    enablePodMonitor: false
  affinity:
    enablePodAntiAffinity: false
