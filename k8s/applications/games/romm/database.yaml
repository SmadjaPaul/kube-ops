apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: romm-postgresql
  namespace: romm
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7
  bootstrap:
    initdb:
      database: romm
      owner: romm
  postgresql:
    parameters:
      # PLT-344 lot 0 : WAL réduit (golden path stockage). archive_timeout 5min -> 15min : 96 segments forcés/jour au lieu de 288 (RPO R2 15 min).
      checkpoint_timeout: "15min"
      max_wal_size: "2GB"
      wal_compression: "lz4"
      archive_timeout: "15min"
  # PLT-228: a Cluster has a single WAL archiver; the archive moved from
  # Hetzner to romm-r2-store (database-r2.yaml). PLT-219: the Hetzner store and
  # its objects are gone; recovery points live on R2 only.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: romm-r2-store
  storage:
    size: 10Gi
    storageClass: longhorn-fast
  walStorage:
    size: 5Gi
    storageClass: longhorn-fast
    resizeInUseVolumes: true
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  monitoring:
    enablePodMonitor: false
  affinity:
    enablePodAntiAffinity: false
