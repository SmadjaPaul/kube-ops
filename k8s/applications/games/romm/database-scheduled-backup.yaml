apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: romm-postgresql-weekly
  namespace: romm
spec:
  schedule: "0 20 3 * * 0"
  backupOwnerReference: self
  cluster:
    name: romm-postgresql
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      # PLT-228: base backups follow the WAL archive to R2.
      barmanObjectName: romm-r2-store
