# Observation only: keep recommendation generation separate from workload
# ownership; no automatic updates or evictions are permitted.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: romm
  namespace: romm
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: romm
  updatePolicy:
    updateMode: "Off"
