apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-mam-auth
  namespace: media
  annotations:
    kube-ops.io/secret-class: T8
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: qbittorrent-mam-auth
    creationPolicy: Owner
  data:
    - secretKey: WEBUI_PASSWORD
      remoteRef:
        key: BOOKORBIT_QBITTORRENT_WEBUI_PASSWORD
