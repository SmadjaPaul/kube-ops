# PLT-474: qBittorrent WebUI password, generated inside the cluster
# (D-2026-11-20-04, internal secret: only qBittorrent and BookOrbit use it).
# bootstrap.py derives WebUI\Password_PBKDF2 from it (length >= 24 required).
# Never in Doppler, never in Git. CreatedOnce + Orphan: the value is stable and
# survives a deletion of the ExternalSecret.
# Rotate: rename the Password and the ExternalSecret (keep target.name), then
# restart qbittorrent-mam and update the BookOrbit download client
# (docs/operations/secrets-generated-runbook.md).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: qbittorrent-mam-webui
  namespace: media
spec:
  length: 48
  digits: 10
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-mam-auth
  namespace: media
  annotations:
    kube-ops.io/secret-class: T5
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: qbittorrent-mam-auth
    creationPolicy: Orphan
    template:
      engineVersion: v2
      data:
        WEBUI_PASSWORD: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: qbittorrent-mam-webui
