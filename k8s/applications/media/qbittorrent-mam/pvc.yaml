apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-mam-config
  namespace: media
  labels:
    app.kubernetes.io/name: qbittorrent-mam
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-fast
  resources:
    requests:
      storage: 2Gi
