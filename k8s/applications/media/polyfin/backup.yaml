apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: polyfin-postgresql-weekly
  namespace: media
spec:
  schedule: "0 30 6 * * 0"
  backupOwnerReference: self
  cluster:
    name: polyfin-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      # PLT-227: base backups follow the WAL archive to R2.
      barmanObjectName: polyfin-r2-store
