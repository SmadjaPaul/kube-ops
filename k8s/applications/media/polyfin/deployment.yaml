apiVersion: apps/v1
kind: Deployment
metadata:
  name: polyfin
  namespace: media
  labels:
    app.kubernetes.io/name: polyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: polyfin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: polyfin
    spec:
      automountServiceAccountToken: false
      # Scoped split-DNS fix: the configured AIOStreams manifest uses this
      # HTTPS hostname, while its public AAAA resolves to Cloudflare.
      # Route only Polyfin's requests through the existing internal
      # Cilium Gateway. TLS SNI/hostname validation remains unchanged.
      hostAliases:
        - ip: "10.0.20.192"
          hostnames:
            - aiostreams.smadja.dev
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: polyfin
          # Official upstream release; the linux/amd64 digest is bound by the T2 admission record.
          image: ghcr.io/moodiness/polyfin:0.61.1@sha256:1e55720ea21bca9448ddbdd80a21251622d21448ee2e31974ad18ae2a9f6c975 # renovate: datasource=docker depName=ghcr.io/moodiness/polyfin
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Paris
            - name: POLYFIN_LISTEN
              value: ":8096"
            - name: POLYFIN_DATA_DIR
              value: /data
            - name: POLYFIN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: polyfin-db-app
                  key: uri
            - name: POLYFIN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: polyfin-bootstrap
                  key: POLYFIN_SECRET_KEY
          ports:
            - name: http
              containerPort: 8096
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: polyfin-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
