apiVersion: apps/v1
kind: Deployment
metadata:
  name: polyfin
  namespace: media
  labels:
    app.kubernetes.io/name: polyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: polyfin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: polyfin
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: polyfin
          # Verified upstream release metadata: Polyfin 0.50.0.
          # Activation remains blocked until the image security gate passes.
          image: ghcr.io/moodiness/polyfin:0.50.0@sha256:b544e75ae8f028214d6dd1ea7fd55094b75211c081a41d7c6afe0917637cc719
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Paris
            - name: POLYFIN_LISTEN
              value: ":8096"
            - name: POLYFIN_DATA_DIR
              value: /data
            - name: POLYFIN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: polyfin-db-app
                  key: uri
            - name: POLYFIN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: polyfin-bootstrap
                  key: POLYFIN_SECRET_KEY
          ports:
            - name: http
              containerPort: 8096
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: polyfin-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
