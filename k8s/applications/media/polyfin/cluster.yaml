apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: polyfin-db
  namespace: media
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  instances: 1
  bootstrap:
    initdb:
      database: polyfin
      owner: polyfin
  postgresql:
    parameters:
      # PLT-344 lot 0 : WAL réduit (golden path stockage). archive_timeout 5min -> 15min : 96 segments forcés/jour au lieu de 288 (RPO R2 15 min).
      checkpoint_timeout: "15min"
      max_wal_size: "2GB"
      wal_compression: "lz4"
      archive_timeout: "15min"
  # Barman plugin activation is required: ObjectStore + ScheduledBackup alone
  # do not enable WAL archiving or base backups on this Cluster.
  # PLT-227: a Cluster has a single WAL archiver; the archive moved from
  # Hetzner to polyfin-r2-store. PLT-94: the Hetzner store was removed from
  # kube-ops; recovery points live on R2 only.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: polyfin-r2-store
  storage:
    storageClass: longhorn-fast
    size: 5Gi
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 1Gi
# CNPG auto-generates polyfin-db-app (uri key).
# Confirm S3 backup/restore before activating this pilot.
