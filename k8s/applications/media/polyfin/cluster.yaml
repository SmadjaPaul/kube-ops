apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: polyfin-db
  namespace: media
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  instances: 1
  bootstrap:
    initdb:
      database: polyfin
      owner: polyfin
  # Barman plugin activation is required: ObjectStore + ScheduledBackup alone
  # do not enable WAL archiving or base backups on this Cluster.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: polyfin-hetzner-store
  storage:
    storageClass: longhorn-fast
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
# CNPG auto-generates polyfin-db-app (uri key).
# Confirm S3 backup/restore before activating this pilot.
