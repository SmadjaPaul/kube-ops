apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: polyfin-data
  namespace: media
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-fast
  resources:
    requests:
      # Polyfin keeps rebuildable source/image metadata caches under /data.
      # The 5Gi pilot volume exhausted during normal catalogue use; retain
      # the existing PVC and expand it in place rather than deleting cache or
      # application data.
      storage: 20Gi
