apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: polyfin-pilot
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: polyfin
  description: "Private pilot, scoped control traffic only"
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: polyfin-db
            k8s:io.kubernetes.pod.namespace: media
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # The configured AIOStreams manifest and its child endpoints use
    # https://aiostreams.smadja.dev, resolved internally via the Cilium
    # Gateway VIP. The direct AIOStreams Pod ingress policy does NOT admit
    # Polyfin, so do not pretend that port 3000 traffic would work.
    - toCIDRSet:
        - cidr: 10.0.20.192/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toFQDNs:
        - matchName: aiometadata.streetle.dev
        - matchName: v3-cinemeta.strem.io
        - matchName: api.torbox.app
        - matchName: search-api.torbox.app
        # Authentik OIDC discovery/token exchange for the native provider.
        # The Pod resolves this private application hostname to its Cloudflare
        # edge address; keep the allowance exact and HTTPS-only.
        - matchName: auth.smadja.dev
        # SoundCloud Eclipse addon manifest; stream/CDN hosts remain
        # separately scoped after the addon returns a concrete URL.
        - matchName: sc.eclipsemusic.app
        # Nebula artworkURL points at Tidal's public artwork origin. Keep the
        # image fetch scoped to this exact host; no wildcard Internet egress.
        - matchName: resources.tidal.com
        # Nebula is a TorBox-backed Eclipse music addon. This is only its
        # reviewed public control-plane host, not blanket TorBox/CDN egress.
        # Verify the tokenized install URL host before importing the addon.
        - matchName: nebula.eclipsemusic.app
        # Observed by the qualified warm-track stream resolution. Keep this
        # exact CDN host scoped; do not replace it with world:443 or a wildcard.
        - matchName: nexus-326.ceur.tb-cdn.st
        # Anime identifier maps are fetched from the pinned upstream GitHub
        # repository; keep this exact HTTPS FQDN allowlisted instead of
        # granting arbitrary Internet egress.
        - matchName: raw.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
# This allowlist deliberately blocks unknown IPTV, Eclipse and TorBox-CDN
# traffic until Codex observes, scopes and validates the requested flows.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: polyfin-db-access
  namespace: media
spec:
  description: "Allow only the Polyfin pilot to reach its CNPG primary on PostgreSQL."
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: polyfin-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            app.kubernetes.io/name: polyfin
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: polyfin-aiostreams-control
  namespace: media
spec:
  description: "Allow only the Polyfin pilot to reach the AIOStreams control API."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: polyfin
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            app.kubernetes.io/name: aiostreams
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
