apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: polyfin-bootstrap
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: polyfin-bootstrap
    creationPolicy: Owner
  data:
    - secretKey: POLYFIN_SECRET_KEY
      remoteRef:
        key: APP_POLYFIN_SECRET_KEY
