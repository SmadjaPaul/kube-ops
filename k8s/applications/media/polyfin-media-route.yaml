apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: polyfin-media
  namespace: media
spec:
  # Stage 2: Polyfin becomes the sole owner of tv.smadja.dev on both
  # Gateways. Keep media.smadja.dev as a temporary OIDC/client fallback.
  parentRefs:
    - name: internal
      namespace: gateway
    - name: external
      namespace: gateway
  hostnames:
    - media.smadja.dev
    - tv.smadja.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: polyfin
          port: 80
