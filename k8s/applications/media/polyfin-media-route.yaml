apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: polyfin-media
  namespace: media
spec:
  # Stage 1: canary Polyfin on media.smadja.dev. Do not take over
  # tv.smadja.dev until this public path passes runtime/security checks.
  parentRefs:
    - name: internal
      namespace: gateway
    - name: external
      namespace: gateway
  hostnames:
    - media.smadja.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: polyfin
          port: 80
