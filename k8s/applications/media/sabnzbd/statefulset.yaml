apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sabnzbd
  namespace: media
spec:
  serviceName: sabnzbd
  replicas: 1
  selector:
    matchLabels:
      app: sabnzbd
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-fast
        resources:
          requests:
            storage: 6Gi
    - metadata:
        name: nzb-backup
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-fast
        resources:
          requests:
            storage: 1Gi
  template:
    metadata:
      labels:
        app: sabnzbd
    spec:
      securityContext:
        runAsUser: 2501
        runAsNonRoot: true
        fsGroup: 2501
      containers:
        - name: sabnzbd
          image: ghcr.io/theepicsaxguy/sabnzbd:5.0.4
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: sabnzbd-secrets
            - configMapRef:
                name: sabnzbd-env-config
          env:
            - name: PUID
              value: "2501"
            - name: PGID
              value: "2501"
            - name: SAB_DOWNLOAD_DIR
              value: "/data/usenet"
            - name: SAB_INCOMPLETE_DIR
              value: "/data/usenet/incomplete"
            - name: SAB_COMPLETE_DIR
              value: "/data/usenet/complete"
            - name: TZ
              value: "Europe/Paris"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media-share
              mountPath: /data
            - name: nzb-backup
              mountPath: /downloads/nzb-backup
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /api?mode=version
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /api?mode=version
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: media-share
          persistentVolumeClaim:
            claimName: media-share
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
