apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sabnzbd-secrets
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: sabnzbd-secrets
    creationPolicy: Owner
  data:
    # Internal application keys are generated by homelab-infra.
    # Usenet account credentials are intentionally not part of the bootstrap
    # contract; the app can become healthy before an operator picks a provider.
    - secretKey: SAB__misc__api_key
      remoteRef:
        key: APP_SABNZBD_API_KEY
    - secretKey: SAB__misc__nzb_key
      remoteRef:
        key: APP_SABNZBD_NZB_KEY
