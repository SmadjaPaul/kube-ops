apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sabnzbd-secrets
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: sabnzbd-secrets
    creationPolicy: Owner
  data:
    - secretKey: SAB__misc__api_key
      remoteRef:
        key: APP_SABNZBD_API_KEY
    - secretKey: SAB__misc__nzb_key
      remoteRef:
        key: APP_SABNZBD_NZB_KEY
    - secretKey: SAB__servers__newsnewshostingcom__username
      remoteRef:
        key: APP_SABNZBD_USENET_USERNAME
    - secretKey: SAB__servers__newsnewshostingcom__password
      remoteRef:
        key: APP_SABNZBD_USENET_PASSWORD
