kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: jellyfin
  namespace: media
  annotations:
    secret.reloader.stakater.com/reload: "jellyfin-sso"
spec:
  serviceName: "jellyfin"
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2501
        runAsGroup: 2501
        fsGroup: 2501
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [44, 104]
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-oidc
          image: python:3.13-alpine3.22@sha256:e81548ac35b07a3bd4805f275107592ef458b1e893c0e04d45aedaa19416cca5
          imagePullPolicy: IfNotPresent
          command: ["python", "-c"]
          args:
            - |
              import hashlib
              import io
              import pathlib
              import xml.etree.ElementTree as ET
              import urllib.request
              import zipfile
              from xml.sax.saxutils import escape

              url = "https://github.com/aussierk/jellyfin-plugin-oidc/releases/download/v1.0.7.0/oidc-rbac.zip"
              expected = "84265ab9d374f9cfd53028fc78b6b27941f9f27e5c7fb61aeba9aa33016fe8bc"
              target = pathlib.Path("/plugin")
              with urllib.request.urlopen(url, timeout=30) as response:
                  payload = response.read()
              actual = hashlib.sha256(payload).hexdigest()
              if actual != expected:
                  raise SystemExit(f"OIDC plugin checksum mismatch: {actual}")
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  for member in archive.namelist():
                      parts = pathlib.PurePosixPath(member).parts
                      if pathlib.PurePosixPath(member).is_absolute() or ".." in parts:
                          raise SystemExit(f"unsafe archive member: {member}")
                  archive.extractall(target)

              config_path = pathlib.Path("/config/plugins/configurations/Jellyfin.Plugin.OIDC.xml")
              system_config_path = pathlib.Path("/config/config/system.xml")
              client_id_path = pathlib.Path("/run/jellyfin-oidc/client_id")
              client_secret_path = pathlib.Path("/run/jellyfin-oidc/client_secret")
              server_base_url = "https://jellyfin.smadja.dev"
              requested_scopes = "openid profile email groups"
              managed_role_mappings = {
                  "media": {
                      "IsAdmin": "false",
                      "EnableAllLibraries": "true",
                      "EnableMediaPlayback": "true",
                      "EnableRemoteAccess": "true",
                      "EnableTranscoding": "true",
                  },
                  "Jellyfin Users": {
                      "IsAdmin": "false",
                      "EnableAllLibraries": "true",
                      "EnableMediaPlayback": "true",
                      "EnableRemoteAccess": "true",
                      "EnableTranscoding": "true",
                  },
                  "authentik-admins": {
                      "IsAdmin": "true",
                      "EnableAllLibraries": "true",
                      "EnableMediaPlayback": "true",
                      "EnableRemoteAccess": "true",
                      "EnableTranscoding": "true",
                      "EnableContentDeletion": "true",
                      "EnableCollectionManagement": "true",
                      "EnableSubtitleManagement": "true",
                  },
                  "Jellyfin Admins": {
                      "IsAdmin": "true",
                      "EnableAllLibraries": "true",
                      "EnableMediaPlayback": "true",
                      "EnableRemoteAccess": "true",
                      "EnableTranscoding": "true",
                      "EnableContentDeletion": "true",
                      "EnableCollectionManagement": "true",
                      "EnableSubtitleManagement": "true",
                  },
              }
              client_secret_value = client_secret_path.read_text().strip()
              client_secret = escape(client_secret_value)
              if not config_path.exists():
                  client_id = escape(client_id_path.read_text().strip())
                  config_path.parent.mkdir(parents=True, exist_ok=True)
                  config_path.write_text(f'''<?xml version="1.0" encoding="utf-8"?>
              <PluginConfiguration>
                <Providers>
                  <OidcProviderConfig>
                    <ProviderId>authentik</ProviderId>
                    <DisplayName>Authentik</DisplayName>
                    <Authority>https://auth.smadja.dev/application/o/jellyfin/</Authority>
                    <ClientId>{client_id}</ClientId>
                    <ClientSecret>{client_secret}</ClientSecret>
                    <Scopes>{requested_scopes}</Scopes>
                    <RoleClaim>groups</RoleClaim>
                    <UsernameClaim>preferred_username</UsernameClaim>
                    <DisplayNameClaim>name</DisplayNameClaim>
                    <Enabled>true</Enabled>
                    <ServerBaseUrl>{server_base_url}</ServerBaseUrl>
                  </OidcProviderConfig>
                </Providers>
                <RoleMappings>
                  <RoleMapping>
                    <RoleName>media</RoleName>
                    <EnableAllLibraries>true</EnableAllLibraries>
                    <EnableMediaPlayback>true</EnableMediaPlayback>
                    <EnableRemoteAccess>true</EnableRemoteAccess>
                    <EnableTranscoding>true</EnableTranscoding>
                  </RoleMapping>
                  <RoleMapping>
                    <RoleName>Jellyfin Users</RoleName>
                    <EnableAllLibraries>true</EnableAllLibraries>
                    <EnableMediaPlayback>true</EnableMediaPlayback>
                    <EnableRemoteAccess>true</EnableRemoteAccess>
                    <EnableTranscoding>true</EnableTranscoding>
                  </RoleMapping>
                  <RoleMapping>
                    <RoleName>authentik-admins</RoleName>
                    <IsAdmin>true</IsAdmin>
                    <EnableAllLibraries>true</EnableAllLibraries>
                    <EnableMediaPlayback>true</EnableMediaPlayback>
                    <EnableRemoteAccess>true</EnableRemoteAccess>
                    <EnableTranscoding>true</EnableTranscoding>
                    <EnableContentDeletion>true</EnableContentDeletion>
                    <EnableCollectionManagement>true</EnableCollectionManagement>
                    <EnableSubtitleManagement>true</EnableSubtitleManagement>
                  </RoleMapping>
                  <RoleMapping>
                    <RoleName>Jellyfin Admins</RoleName>
                    <IsAdmin>true</IsAdmin>
                    <EnableAllLibraries>true</EnableAllLibraries>
                    <EnableMediaPlayback>true</EnableMediaPlayback>
                    <EnableRemoteAccess>true</EnableRemoteAccess>
                    <EnableTranscoding>true</EnableTranscoding>
                    <EnableContentDeletion>true</EnableContentDeletion>
                    <EnableCollectionManagement>true</EnableCollectionManagement>
                    <EnableSubtitleManagement>true</EnableSubtitleManagement>
                  </RoleMapping>
                </RoleMappings>
                <AutoCreateUsers>true</AutoCreateUsers>
                <MigrateLocalUsers>true</MigrateLocalUsers>
                <DefaultRoleName>media</DefaultRoleName>
                <ManageUserPolicy>true</ManageUserPolicy>
                <EnableLibraryAccessManagement>true</EnableLibraryAccessManagement>
              </PluginConfiguration>\n''')
              else:
                  tree = ET.parse(config_path)
                  root = tree.getroot()
                  provider = next(
                      (
                          item
                          for item in root.findall("./Providers/OidcProviderConfig")
                          if item.findtext("ProviderId") == "authentik"
                      ),
                      None,
                  )
                  if provider is None:
                      raise SystemExit("OIDC provider authentik missing from persistent configuration")

                  def set_root_value(name, value):
                      element = root.find(name)
                      if element is None:
                          element = ET.SubElement(root, name)
                      if element.text != value:
                          element.text = value
                          return True
                      return False

                  def set_provider_value(name, value):
                      element = provider.find(name)
                      if element is None:
                          element = ET.SubElement(provider, name)
                      if element.text != value:
                          element.text = value
                          return True
                      return False

                  changed = set_root_value("MigrateLocalUsers", "true")
                  changed = set_provider_value("ClientSecret", client_secret_value) or changed
                  changed = set_provider_value("Scopes", requested_scopes) or changed
                  changed = set_provider_value("RoleClaim", "groups") or changed
                  changed = set_provider_value("UsernameClaim", "preferred_username") or changed
                  changed = set_provider_value("ServerBaseUrl", server_base_url) or changed
                  legacy_server_base = root.find("ServerBaseUrl")
                  if legacy_server_base is not None:
                      root.remove(legacy_server_base)
                      changed = True

                  role_mappings = root.find("RoleMappings")
                  if role_mappings is None:
                      role_mappings = ET.SubElement(root, "RoleMappings")
                      changed = True
                  admin_role_names = {"authentik-admins", "Jellyfin Admins"}
                  for mapping in role_mappings.findall("RoleMapping"):
                      role_name = mapping.findtext("RoleName")
                      if (
                          mapping.findtext("IsAdmin", "false").lower() == "true"
                          and role_name not in admin_role_names
                      ):
                          raise SystemExit(
                              f"unmanaged admin RoleMapping is not allowed: {role_name}"
                          )
                  for role_name, values in managed_role_mappings.items():
                      matches = [
                          item
                          for item in role_mappings.findall("RoleMapping")
                          if item.findtext("RoleName") == role_name
                      ]
                      if len(matches) > 1:
                          raise SystemExit(f"duplicate managed RoleMapping: {role_name}")
                      mapping = matches[0] if matches else ET.SubElement(role_mappings, "RoleMapping")
                      if not matches:
                          changed = True
                      for name, value in {"RoleName": role_name, **values}.items():
                          element = mapping.find(name)
                          if element is None:
                              element = ET.SubElement(mapping, name)
                          if element.text != value:
                              element.text = value
                              changed = True

                  for name, value in {
                      "AutoCreateUsers": "true",
                      "DefaultRoleName": "media",
                      "ManageUserPolicy": "true",
                      "EnableLibraryAccessManagement": "true",
                  }.items():
                      element = root.find(name)
                      if element is None:
                          element = ET.SubElement(root, name)
                      if element.text != value:
                          element.text = value
                          changed = True
                  if changed:
                      tree.write(config_path, encoding="utf-8", xml_declaration=True)
              config_path.chmod(0o600)

              if not system_config_path.exists():
                  raise SystemExit("Jellyfin system configuration is missing")
              system_tree = ET.parse(system_config_path)
              system_root = system_tree.getroot()
              login_disclaimer = system_root.find("LoginDisclaimer")
              if login_disclaimer is None:
                  login_disclaimer = ET.SubElement(system_root, "LoginDisclaimer")
              if not (login_disclaimer.text or "").strip():
                  login_disclaimer.text = (
                      '<div style="margin:1em 0;text-align:center;">'
                      '<a href="/sso/OIDC/Start/authentik" '
                      'style="display:block;margin:0.5em auto;padding:0.7em 1.5em;'
                      'background:#4285F4;color:#fff;text-decoration:none;border-radius:4px;'
                      'font-size:1em;max-width:300px;">Authentik</a>'
                      '<div style="margin:1em 0;color:#888;">'
                      '— or sign in with password —</div></div>'
                  )
                  system_tree.write(system_config_path, encoding="utf-8", xml_declaration=True)
          securityContext:
            runAsNonRoot: true
            runAsUser: 2501
            runAsGroup: 2501
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: sso-plugin
              mountPath: /plugin
            - name: config
              mountPath: /config
            - name: jellyfin-oidc-secret
              mountPath: /run/jellyfin-oidc
              readOnly: true
      containers:
        - name: jellyfin
          image: ghcr.io/jellyfin/jellyfin:10.11.11
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: '200m'
              memory: '2Gi'
            limits:
              cpu: '4000m'
              memory: '5Gi'
          envFrom:
            - configMapRef:
                name: jellyfin-env
          ports:
            - name: http
              containerPort: 8096
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data
            - name: media
              mountPath: /app/data
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
            - name: sso-plugin
              mountPath: "/config/plugins/SSO-OIDC-Authentication_1.0.7.0"
            - name: jellyfin-oidc-secret
              mountPath: /run/jellyfin-oidc
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: 8096
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8096
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-share
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: sso-plugin
          emptyDir:
            sizeLimit: 16Mi
        - name: jellyfin-oidc-secret
          secret:
            secretName: jellyfin-sso
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "longhorn-fast"
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: cache
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "longhorn-fast"
        resources:
          requests:
            storage: 10Gi
