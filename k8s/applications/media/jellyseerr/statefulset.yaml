# Resource names intentionally remain jellyseerr during migration so the existing
# config-jellyseerr-0 PVC is reused and Seerr can run its automatic migration.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jellyseerr
  namespace: media
  labels:
    app: jellyseerr
  annotations:
    secret.reloader.stakater.com/reload: "jellyseerr-secrets,seerr-oidc"
spec:
  serviceName: jellyseerr
  replicas: 1
  selector:
    matchLabels:
      app: jellyseerr
  template:
    metadata:
      labels:
        app: jellyseerr
    spec:
      serviceAccountName: jellyseerr
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: configure-oidc
          image: ghcr.io/seerr-team/seerr:preview-new-oidc@sha256:28744b1ced522beb7af8e5c966b73c6e46b1dc2c4c8cb497ad2f12d3139699a3
          imagePullPolicy: IfNotPresent
          command:
            - node
            - -e
            - |
              const fs = require('fs');
              const path = '/app/config/settings.json';
              if (!fs.existsSync(path)) {
                console.log('SEERR_OIDC_BOOTSTRAP=SKIP_NO_SETTINGS');
                process.exit(0);
              }
              const settings = JSON.parse(fs.readFileSync(path, 'utf8'));
              settings.main = settings.main || {};
              settings.main.oidcLogin = true;
              settings.network = settings.network || {};
              settings.network.trustProxy = true;
              settings.oidc = settings.oidc || {};
              const provider = {
                slug: 'authentik',
                name: 'Authentik',
                issuerUrl: 'https://auth.smadja.dev/application/o/jellyseerr/',
                clientId: process.env.OIDC_CLIENT_ID,
                clientSecret: process.env.OIDC_CLIENT_SECRET,
                logo: 'https://auth.smadja.dev/static/dist/assets/icons/icon.svg',
                newUserLogin: true
              };
              const providers = Array.isArray(settings.oidc.providers)
                ? settings.oidc.providers.filter((p) => p.slug !== 'authentik')
                : [];
              providers.push(provider);
              settings.oidc.providers = providers;
              const tmp = path + '.tmp';
              fs.writeFileSync(tmp, JSON.stringify(settings, null, 2) + '\n', { mode: 0o600 });
              fs.renameSync(tmp, path);
              console.log('SEERR_OIDC_BOOTSTRAP=PASS');
          env:
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: seerr-oidc
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: seerr-oidc
                  key: OIDC_CLIENT_SECRET
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /app/config
      containers:
        - name: jellyseerr
          image: ghcr.io/seerr-team/seerr:preview-new-oidc@sha256:28744b1ced522beb7af8e5c966b73c6e46b1dc2c4c8cb497ad2f12d3139699a3
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                # Jellyfin bootstrap remains optional; Seerr can start in first-run
                # mode and reuse the existing Jellyseerr configuration PVC.
                name: jellyseerr-secrets
                optional: true
          ports:
            - name: http
              containerPort: 5055
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-fast
        resources:
          requests:
            storage: 5Gi
