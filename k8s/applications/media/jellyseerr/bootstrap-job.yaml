apiVersion: batch/v1
kind: Job
metadata:
  name: seerr-first-run-bootstrap-v4
  namespace: media
  labels:
    app: jellyseerr
    app.kubernetes.io/component: bootstrap
spec:
  backoffLimit: 12
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: jellyseerr
        app.kubernetes.io/component: bootstrap
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: python:3.13-alpine3.22@sha256:e81548ac35b07a3bd4805f275107592ef458b1e893c0e04d45aedaa19416cca5
          imagePullPolicy: IfNotPresent
          command: ["python", "-c"]
          args:
            - |
              import http.cookiejar as http_cookiejar
              import json
              import os
              import pathlib
              import time
              import urllib.error
              import urllib.parse
              import urllib.request

              SEERR = "http://jellyseerr:5055"
              JELLYFIN = "http://jellyfin:8096"
              SECRET_DIR = pathlib.Path("/run/seerr-bootstrap")
              JELLYFIN_USER = "seerr-service"
              SEERR_ADMIN_EMAIL = "seerr-admin@smadja.invalid"

              def http(
                  opener,
                  method,
                  url,
                  payload=None,
                  headers=None,
                  expected=(200,),
                  expected_errors=(),
              ):
                  request_headers = {"Accept": "application/json"}
                  if headers:
                      request_headers.update(headers)
                  body = None
                  if payload is not None:
                      body = json.dumps(payload).encode("utf-8")
                      request_headers["Content-Type"] = "application/json"
                  request = urllib.request.Request(
                      url, data=body, headers=request_headers, method=method
                  )
                  try:
                      with opener.open(request, timeout=15) as response:
                          status = response.status
                          raw = response.read()
                  except urllib.error.HTTPError as error:
                      if error.code in expected_errors:
                          return {"_http_status": error.code}
                      raise RuntimeError(f"{method} {url} returned HTTP {error.code}") from None
                  if status not in expected:
                      raise RuntimeError(f"{method} {url} returned HTTP {status}")
                  if not raw:
                      return None
                  return json.loads(raw.decode("utf-8"))

              plain = urllib.request.build_opener()

              deadline = time.time() + 300
              while True:
                  try:
                      public = http(
                          plain,
                          "GET",
                          f"{SEERR}/api/v1/settings/public",
                          expected=(200,),
                      )
                      break
                  except Exception:
                      if time.time() >= deadline:
                          raise RuntimeError("Seerr did not become reachable before timeout")
                      time.sleep(5)

              if public.get("initialized") is True:
                  print("SEERR_FIRST_RUN_BOOTSTRAP=PASS_ALREADY_INITIALIZED")
                  raise SystemExit(0)

              secret_deadline = time.time() + 900
              api_key_path = SECRET_DIR / "JELLYFIN_API_KEY"
              password_path = SECRET_DIR / "SEERR_BOOTSTRAP_ADMIN_PASSWORD"
              while not (api_key_path.exists() and password_path.exists()):
                  if time.time() >= secret_deadline:
                      raise RuntimeError("Seerr bootstrap Secret did not become Ready before timeout")
                  time.sleep(5)

              jellyfin_api_key = api_key_path.read_text().strip()
              bootstrap_password = password_path.read_text().strip()
              if not jellyfin_api_key or not bootstrap_password:
                  raise RuntimeError("Seerr bootstrap Secret contains an empty required key")

              jellyfin_headers = {"X-Emby-Token": jellyfin_api_key}

              http(
                  plain,
                  "GET",
                  f"{JELLYFIN}/System/Info",
                  headers=jellyfin_headers,
                  expected=(200,),
              )

              users = http(
                  plain,
                  "GET",
                  f"{JELLYFIN}/Users",
                  headers=jellyfin_headers,
                  expected=(200,),
              )
              service_user = next(
                  (user for user in users if user.get("Name") == JELLYFIN_USER),
                  None,
              )
              if service_user is None:
                  service_user = http(
                      plain,
                      "POST",
                      f"{JELLYFIN}/Users/New",
                      {"Name": JELLYFIN_USER},
                      headers=jellyfin_headers,
                      expected=(200,),
                  )

              user_id = service_user["Id"]
              service_user = http(
                  plain,
                  "GET",
                  f"{JELLYFIN}/Users/{user_id}",
                  headers=jellyfin_headers,
                  expected=(200,),
              )
              original_policy = dict(service_user.get("Policy") or {})
              service_user_was_admin = original_policy.get("IsAdministrator") is True
              elevated_policy = dict(original_policy)
              elevated_policy["IsAdministrator"] = True
              elevated_policy["IsDisabled"] = False
              elevated_policy["IsHidden"] = True

              restored_policy = dict(original_policy)
              restored_policy["IsAdministrator"] = False

              def restore_policy():
                  last_error = None
                  for attempt in range(3):
                      try:
                          http(
                              plain,
                              "POST",
                              f"{JELLYFIN}/Users/{user_id}/Policy",
                              restored_policy,
                              headers=jellyfin_headers,
                              expected=(204,),
                          )
                          observed_user = http(
                              plain,
                              "GET",
                              f"{JELLYFIN}/Users/{user_id}",
                              headers=jellyfin_headers,
                              expected=(200,),
                          )
                          if dict(observed_user.get("Policy") or {}) != restored_policy:
                              raise RuntimeError("Jellyfin service-user policy was not restored exactly")
                          return
                      except Exception as error:
                          last_error = error
                          if attempt < 2:
                              time.sleep(2)
                  raise RuntimeError("Jellyfin service-user policy restoration failed") from last_error

              try:
                  if service_user_was_admin:
                      restore_policy()
                      raise RuntimeError(
                          "Seerr service user was already an administrator; normalized to non-admin and stopped"
                      )
                  try:
                      http(
                          plain,
                          "POST",
                          f"{JELLYFIN}/Users/{user_id}/Policy",
                          elevated_policy,
                          headers=jellyfin_headers,
                          expected=(204,),
                      )
                  except Exception:
                      restore_policy()
                      raise

                  http(
                      plain,
                      "POST",
                      f"{JELLYFIN}/Users/Password?{urllib.parse.urlencode({'userId': user_id})}",
                      {
                          "CurrentPw": "",
                          "NewPw": bootstrap_password,
                          "ResetPassword": False,
                      },
                      headers=jellyfin_headers,
                      expected=(204,),
                  )

                  cookie_jar = http_cookiejar.CookieJar()
                  seerr_session = urllib.request.build_opener(
                      urllib.request.HTTPCookieProcessor(cookie_jar)
                  )

                  http(
                      seerr_session,
                      "POST",
                      f"{SEERR}/api/v1/auth/jellyfin",
                      {
                          "username": JELLYFIN_USER,
                          "password": bootstrap_password,
                          "hostname": "jellyfin",
                          "port": 8096,
                          "useSsl": False,
                          "urlBase": "",
                          "email": SEERR_ADMIN_EMAIL,
                          "serverType": 2,
                      },
                      expected=(200,),
                  )

                  sync_result = http(
                      seerr_session,
                      "POST",
                      f"{SEERR}/api/v1/settings/jellyfin/library/sync",
                      expected=(200,),
                      expected_errors=(404,),
                  )
                  if sync_result and sync_result.get("_http_status") == 404:
                      print("SEERR_LIBRARY_SYNC=NO_SUPPORTED_LIBRARIES")
                  settings = http(
                      seerr_session,
                      "GET",
                      f"{SEERR}/api/v1/settings/jellyfin",
                      expected=(200,),
                  )
                  enabled = 0
                  for library in settings.get("libraries", []):
                      if not library.get("enabled"):
                          http(
                              seerr_session,
                              "PUT",
                              f"{SEERR}/api/v1/settings/jellyfin/library/{library['id']}",
                              {"enabled": True},
                              expected=(200,),
                          )
                      enabled += 1

                  http(
                      seerr_session,
                      "POST",
                      f"{SEERR}/api/v1/settings/initialize",
                      expected=(200,),
                  )
                  final_public = http(
                      plain,
                      "GET",
                      f"{SEERR}/api/v1/settings/public",
                      expected=(200,),
                  )
                  if final_public.get("initialized") is not True:
                      raise RuntimeError("Seerr did not report initialized=true")
              finally:
                  restore_policy()

              print(f"SEERR_FIRST_RUN_BOOTSTRAP=PASS LIBRARIES_ENABLED={enabled}")
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          volumeMounts:
            - name: bootstrap-secret
              mountPath: /run/seerr-bootstrap
              readOnly: true
      volumes:
        - name: bootstrap-secret
          secret:
            secretName: seerr-first-run
            optional: true
