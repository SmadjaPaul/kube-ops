apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seerr-first-run
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: seerr-first-run
    creationPolicy: Owner
  data:
    - secretKey: JELLYFIN_API_KEY
      remoteRef:
        key: APP_JELLYSEERR_JELLYFIN_API_KEY
    - secretKey: SEERR_BOOTSTRAP_ADMIN_PASSWORD
      remoteRef:
        key: APP_SEERR_BOOTSTRAP_ADMIN_PASSWORD
