apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
# Arr, Seerr and Jellyfin retired from active media on 2026-11-08.
# Historical manifests are retained for audit, but no longer included by GitOps.
# Keep media-share, AIOStreams, Polyfin, Decypharr and other live media clients intact.
- namespace.yaml
- project.yaml
- media-share-pvc.yaml
- media-layout-job.yaml
- decypharr
- immich
- audiobookrequest
- aiostreams
- polyfin
- ../../optional/polyfin-nebula
- polyfin-media-route.yaml

# Intentionally disabled from V1:
# - whisperasr: local CPU transcription is too expensive on the current single-node host.

# Keep Polyfin's Authentik OIDC discovery on the same private HTTPS Gateway
# as its existing AIOStreams addon. This Pod-scoped /etc/hosts override
# avoids Cloudflare/split-DNS drift without broadening the Cilium egress.
# TLS still validates the original hostname; the Gateway VIP is already
# authorized by Polyfin's existing egress policy (10.0.20.192/32:443).
# Active media overlay only; historical Polyfin pilot gate remains unchanged.
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: polyfin
    patch: |-
      - op: add
        path: /spec/template/spec/hostAliases/0/hostnames/-
        value: auth.smadja.dev
  # Cilium Gateway hairpin: in-cluster egress is checked against the
  # destination backend endpoint identity/port, not only the Gateway VIP.
  # Without this, Envoy can return 403 Access denied after successful TLS.
  # Authentik ingress already permits media namespace on port 9000.
  # Scope to Polyfin -> Authentik (auth namespace) TCP/9000 only.
  - target:
      group: cilium.io
      version: v2
      kind: CiliumNetworkPolicy
      name: polyfin-pilot
    patch: |-
      - op: add
        path: /spec/egress/-
        value:
          toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: auth
                app.kubernetes.io/name: authentik
          toPorts:
            - ports:
                - port: "9000"
                  protocol: TCP
      # Public IPv4 HTTPS egress for the Polyfin media workload ONLY.
      # Additive CIDR policy: excludes RFC1918/LAN, CGNAT, loopback,
      # link-local and other reserved address space. Keep Pod/DB/Gateway
      # identity-specific rules intact. No HTTP/IPv6 wildcard here.
      - op: add
        path: /spec/egress/-
        value:
          toCIDRSet:
            - cidr: 0.0.0.0/0
              except:
                - 0.0.0.0/8
                - 10.0.0.0/8
                - 100.64.0.0/10
                - 127.0.0.0/8
                - 169.254.0.0/16
                - 172.16.0.0/12
                - 192.0.0.0/24
                - 192.0.2.0/24
                - 192.88.99.0/24
                - 192.168.0.0/16
                - 198.18.0.0/15
                - 198.51.100.0/24
                - 203.0.113.0/24
                - 224.0.0.0/4
                - 240.0.0.0/4
          toPorts:
            - ports:
                - port: "443"
                  protocol: TCP
