apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PLT-394 : le domaine media est eclate en une Application par app (un descripteur par dossier,
# Application app-<app>). Cette kustomization n'est plus suivie par Argo : elle reste l'agregat du
# domaine (controle d'equivalence de rendu, scripts/check-argo-app-descriptors.sh).
# Owner-approved retirement: Arr, Seerr, Jellyfin, Decypharr and Prowlarr are absent.
resources:
- media-shared
- aiostreams
- bookorbit
- immich
- polyfin
- qbittorrent-mam

# Intentionally disabled from V1:
# - whisperasr: local CPU transcription, not enabled from V1; reconsider when the need is confirmed.
