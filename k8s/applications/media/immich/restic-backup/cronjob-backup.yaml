# PLT-286: daily cycle. Order enforced by Kubernetes: init `postgres-dump`
# must succeed before the `files` container starts, so a failed dump creates
# no snapshot and no files snapshot. Source data is mounted read-only (PVC
# and mount). No disk write: restic cache, temp and manifest are in memory.
# thumbs/ and encoded-video/ are regenerated by Immich and are excluded.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-restic-backup
  namespace: immich
  labels:
    app.kubernetes.io/name: restic-backup
    app.kubernetes.io/instance: immich
spec:
  # Evening slot (PLT-286): the host is powered off by its power key around
  # 01:15-03:40 on many nights, so a 02:30/03:00 run is often missed. A missed run
  # still starts at the next boot (deadline 18 h), like the Velero schedules.
  schedule: "0 22 * * *"
  timeZone: Europe/Paris
  startingDeadlineSeconds: 64800
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      # The first cycle uploads the whole library; later cycles are incremental.
      activeDeadlineSeconds: 43200
      ttlSecondsAfterFinished: 172800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: restic-backup
            app.kubernetes.io/instance: immich
        spec:
          restartPolicy: Never
          hostNetwork: false
          hostPID: false
          hostIPC: false
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
          affinity:
            # library-immich-server-0 is ReadWriteOnce: share the node of the
            # running server pod. Required: a backup waits (Pending, then the 48 h alert) rather than
            # being placed on a node where the volume cannot attach.
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: immich
                      app.kubernetes.io/name: server
          initContainers:
            - name: restic-binary
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              command: ["cp", "/usr/bin/restic", "/restic-bin/restic"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 5m, memory: 16Mi }
                limits: { cpu: 100m, memory: 64Mi }
              volumeMounts:
                - { name: restic-bin, mountPath: /restic-bin }
            - name: postgres-dump
              # Same major version as the immich-postgresql Cluster image.
              image: ghcr.io/cloudnative-pg/postgresql:17.7@sha256:dab846a58e8ca3c8872584ab2225ee93fb9e659a87c52e163fefae9275b46f51
              command: ["/bin/bash", "/scripts/backup-db.sh"]
              env:
                - { name: APP, value: immich }
                - { name: RESTIC_HOST, value: immich-restic }
                - { name: RESTIC_BIN, value: /restic-bin/restic }
                - { name: RESTIC_CACHE_DIR, value: /cache }
                - { name: AWS_DEFAULT_REGION, value: auto }
                - { name: HOME, value: /tmp }
                - { name: TMPDIR, value: /tmp }
                - name: PGHOST
                  valueFrom: { secretKeyRef: { name: immich-postgresql-app, key: host } }
                - name: PGPORT
                  valueFrom: { secretKeyRef: { name: immich-postgresql-app, key: port } }
                - name: PGDATABASE
                  valueFrom: { secretKeyRef: { name: immich-postgresql-app, key: dbname } }
                - name: PGUSER
                  valueFrom: { secretKeyRef: { name: immich-postgresql-app, key: user } }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: immich-postgresql-app, key: password } }
              envFrom:
                - secretRef: { name: restic-backup }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 10m, memory: 128Mi }
                limits: { cpu: "1", memory: 1536Mi }
              volumeMounts:
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: restic-bin, mountPath: /restic-bin, readOnly: true }
                - { name: cache, mountPath: /cache }
                - { name: tmp, mountPath: /tmp }
          containers:
            - name: files
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              command: ["/bin/sh", "/scripts/backup-files.sh"]
              env:
                - { name: APP, value: immich }
                - { name: RESTIC_HOST, value: immich-restic }
                - { name: RESTIC_BIN, value: /usr/bin/restic }
                - { name: RESTIC_CACHE_DIR, value: /cache }
                - { name: AWS_DEFAULT_REGION, value: auto }
                - { name: HOME, value: /tmp }
                - { name: TMPDIR, value: /tmp }
                - { name: GOMAXPROCS, value: "1" }
                - { name: SOURCES, value: /source/immich }
                - { name: EXCLUDES, value: "/source/immich/thumbs /source/immich/encoded-video" }
                - { name: MANIFEST_DIR, value: /manifest }
                - { name: WORK_DIR, value: /tmp/work }
              envFrom:
                - secretRef: { name: restic-backup }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 10m, memory: 256Mi }
                limits: { cpu: 500m, memory: 2Gi }
              volumeMounts:
                - { name: source, mountPath: /source/immich, readOnly: true }
                - { name: manifest, mountPath: /manifest }
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: cache, mountPath: /cache }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: source
              persistentVolumeClaim:
                claimName: library-immich-server-0
                readOnly: true
            - name: scripts
              configMap:
                name: restic-backup-scripts
                defaultMode: 0555
            - name: restic-bin
              emptyDir: { medium: Memory, sizeLimit: 64Mi }
            - name: cache
              emptyDir: { medium: Memory, sizeLimit: 512Mi }
            - name: tmp
              emptyDir: { medium: Memory, sizeLimit: 256Mi }
            - name: manifest
              emptyDir: { medium: Memory, sizeLimit: 128Mi }
