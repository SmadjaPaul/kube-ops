apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-postgresql
  namespace: immich
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7
  bootstrap:
    initdb:
      database: immich
      owner: immich
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS "vector";
        - CREATE EXTENSION IF NOT EXISTS "earthdistance" CASCADE;
  # PLT-243: a Cluster has a single WAL archiver; the archive moved from
  # immich-hetzner-store to immich-r2-store (database-r2.yaml). Rollback:
  # point barmanObjectName back to immich-hetzner-store, restore from the
  # Hetzner base 20261113T153727 (backupID, never "latest"), then take a new
  # base backup there (homelab-infra docs/operations/r2-migration.md).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-r2-store
  storage:
    size: 15Gi
    storageClass: longhorn-fast
  walStorage:
    size: 20Gi
    storageClass: longhorn-fast
  resources:
    requests:
      memory: 512Mi
      cpu: 25m
    limits:
      memory: 1Gi
      cpu: 1000m
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "2621kB"
      huge_pages: "off"
      min_wal_size: "512MB"
      max_wal_size: "2GB"
  monitoring:
    enablePodMonitor: false
  minSyncReplicas: 0
  maxSyncReplicas: 0
  affinity:
    enablePodAntiAffinity: false
