apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-postgresql-daily
  namespace: immich
spec:
  schedule: "0 0 3 * * *"
  backupOwnerReference: self
  cluster:
    name: immich-postgresql
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: immich-hetzner-store
