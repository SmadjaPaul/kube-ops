apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-postgresql-weekly
  namespace: immich
spec:
  schedule: "0 0 3 * * 0"
  backupOwnerReference: self
  cluster:
    name: immich-postgresql
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      # PLT-243: base backups follow the WAL archive to R2.
      barmanObjectName: immich-r2-store
