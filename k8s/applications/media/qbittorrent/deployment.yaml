apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media
  labels:
    app.kubernetes.io/name: qbittorrent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
    spec:
      containers:
        - name: gluetun
          image: qmcgaw/gluetun:v3.41.3
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: gluetun-vpn
          env:
            - name: TZ
              value: Europe/Paris
            - name: FIREWALL_INPUT_PORTS
              value: "8080"
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: gluetun
              mountPath: /gluetun
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: qbittorrent
          image: ghcr.io/home-operations/qbittorrent:5.2.3@sha256:4fcf15b7f265c2c8d7bc2a7e13240a07e0593c326f3cf3b5b9bb69eec5b79299
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Paris
          ports:
            - name: web
              containerPort: 8080
              protocol: TCP
            - name: torrent-tcp
              containerPort: 6881
              protocol: TCP
            - name: torrent-udp
              containerPort: 6881
              protocol: UDP
          securityContext:
            runAsNonRoot: true
            runAsUser: 2501
            runAsGroup: 2501
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            tcpSocket:
              port: web
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: web
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: web
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: media
          persistentVolumeClaim:
            claimName: media-share
        - name: gluetun
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
