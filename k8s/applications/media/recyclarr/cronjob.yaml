apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
  namespace: media
spec:
  schedule: "17 4 * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: recyclarr
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: recyclarr
              image: ghcr.io/recyclarr/recyclarr:8.7.2
              args: ["sync"]
              env:
                - name: TZ
                  value: Europe/Paris
                - name: RECYCLARR_CONFIG_DIR
                  value: /config
                - name: RECYCLARR_DATA_DIR
                  value: /data
                - name: RADARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: recyclarr-arr-api
                      key: RADARR_API_KEY
                - name: SONARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: recyclarr-arr-api
                      key: SONARR_API_KEY
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 25m
                  memory: 96Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: config
                  mountPath: /config
                - name: generated-config
                  mountPath: /config/configs/radarr.yml
                  subPath: radarr.yml
                  readOnly: true
                - name: generated-config
                  mountPath: /config/configs/sonarr.yml
                  subPath: sonarr.yml
                  readOnly: true
                - name: data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: config
              persistentVolumeClaim:
                claimName: recyclarr-config
            - name: generated-config
              configMap:
                name: recyclarr-config
            - name: data
              emptyDir:
                sizeLimit: 512Mi
            - name: tmp
              emptyDir:
                sizeLimit: 128Mi
