apiVersion: batch/v1
kind: Job
metadata:
  name: media-layout-v1
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-layout
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 2501
        runAsGroup: 2501
        fsGroup: 2501
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-layout
          image: busybox:1.36.1
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p \
                /data/media/movies \
                /data/media/tv \
                /data/media/music \
                /data/media/books \
                /data/media/audiobooks \
                /data/media/podcasts \
                /data/torrents/movies \
                /data/torrents/tv \
                /data/torrents/music \
                /data/torrents/books \
                /data/usenet/incomplete \
                /data/usenet/complete/movies \
                /data/usenet/complete/tv \
                /data/usenet/complete/music \
                /data/usenet/complete/books \
                /data/decypharr-downloads/movies \
                /data/decypharr-downloads/tv \
                /data/decypharr-downloads/music \
                /data/decypharr-downloads/books
              echo "MEDIA_LAYOUT_V1=PASS"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: media
              mountPath: /data
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-share
