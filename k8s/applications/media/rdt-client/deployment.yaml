apiVersion: apps/v1
kind: Deployment
metadata:
  name: rdt-client
  namespace: media
  labels:
    app.kubernetes.io/name: rdt-client
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rdt-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rdt-client
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # The upstream s6 image initializes as root then drops to PUID/PGID.
      # Bound any privileged startup behavior in the isolated canary;
      # never chown the shared 2Ti media PVC recursively.
      initContainers:
        - name: prepare-state
          image: busybox:1.36.1
          command: ["/bin/sh", "-ec", "chown 2501:2501 /data/db"]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - name: state
              mountPath: /data/db
      containers:
        - name: rdt-client
          # Official stable release (2026-10-26). PIN the registry-resolved
          # multi-arch digest and verify the image before active root admission.
          image: rogerfar/rdtclient:2.0.142
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Paris
            - name: PUID
              value: "2501"
            - name: PGID
              value: "2501"
            # Upstream 2.0.140+; prevents recursive chown of media-share.
            - name: SKIP_CHOWN
              value: "true"
          ports:
            - name: http
              containerPort: 6500
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            # The database and the media pool must be distinct PVCs.
            - name: media
              mountPath: /data
            - name: state
              mountPath: /data/db
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-share
        - name: state
          persistentVolumeClaim:
            claimName: rdt-client-state
