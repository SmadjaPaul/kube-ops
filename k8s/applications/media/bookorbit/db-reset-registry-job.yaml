# PLT-340: one-shot reset of the drizzle migration registry of the bookorbit
# database. Diagnosis (Job bookorbit-db-diagnose-20261115, 15/11): schema
# `public` has zero relations while drizzle.__drizzle_migrations lists 132
# applied migrations, so the migrator skips everything and the application
# crashes on missing tables. The application never started successfully since
# 3.6.0, so there is no user data. Recovery point: Backup
# bookorbit-postgresql-pre-reset-20261115 (R2, Completed).
# The guard refuses (single transaction, nothing dropped) if `public` holds any
# relation. Remove this file in the follow-up PR after the proof.
apiVersion: batch/v1
kind: Job
metadata:
  name: bookorbit-db-reset-registry-20261115
  namespace: media
  labels:
    app.kubernetes.io/name: bookorbit-db-maintenance
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookorbit-db-maintenance
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        fsGroup: 26
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie
          command: ["/bin/bash", "-ceu"]
          args:
            - |
              psql -X -1 -v ON_ERROR_STOP=1 -P pager=off <<'SQL'
              DO $$
              BEGIN
                IF (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                    WHERE n.nspname = 'public' AND c.relkind IN ('r','p','v','m','f')) > 0 THEN
                  RAISE EXCEPTION 'schema public is not empty: refusing to reset the registry';
                END IF;
              END $$;
              DROP SCHEMA IF EXISTS drizzle CASCADE;
              SQL
              echo "== after"
              psql -X -At -P pager=off -c "select nspname from pg_namespace where nspname !~ '^pg_' and nspname <> 'information_schema' order by 1"
          env:
            - name: PGHOST
              valueFrom: {secretKeyRef: {name: bookorbit-postgresql-app, key: host}}
            - name: PGPORT
              valueFrom: {secretKeyRef: {name: bookorbit-postgresql-app, key: port}}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: bookorbit-postgresql-app, key: user}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: bookorbit-postgresql-app, key: password}}
            - name: PGDATABASE
              valueFrom: {secretKeyRef: {name: bookorbit-postgresql-app, key: dbname}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
