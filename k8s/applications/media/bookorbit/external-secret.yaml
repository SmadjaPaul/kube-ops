apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookorbit-runtime
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: bookorbit-runtime
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: APP_BOOKORBIT_JWT_SECRET
    - secretKey: SETUP_BOOTSTRAP_TOKEN
      remoteRef:
        key: APP_BOOKORBIT_SETUP_BOOTSTRAP_TOKEN
    - secretKey: PODCAST_ENCRYPTION_KEY
      remoteRef:
        key: APP_BOOKORBIT_PODCAST_ENCRYPTION_KEY
    - secretKey: BOOK_REQUEST_ENCRYPTION_KEY
      remoteRef:
        key: APP_BOOKORBIT_BOOK_REQUEST_ENCRYPTION_KEY
