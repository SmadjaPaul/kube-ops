apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bookorbit-runtime
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: bookorbit
  ingress:
    - fromEntities:
        - host
        - remote-node
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Authentik issuer is pinned to the internal Gateway and backend identity.
    - toCIDR:
        - 10.0.20.192/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: auth
            app.kubernetes.io/name: authentik
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    # TorBox download client (BookOrbit >= 3.8.0): REST API plus the CDN
    # links it returns for finished downloads. Configured in the BookOrbit UI
    # (Settings > System > Requests), not through env vars.
    - toFQDNs:
        - matchName: api.torbox.app
        - matchPattern: "*.tb-cdn.io"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # LibriVox plugin (public-domain audiobooks): catalogue API on librivox.org,
    # chapter zips served by the Internet Archive.
    - toFQDNs:
        - matchName: librivox.org
        - matchName: archive.org
        - matchPattern: "*.archive.org"
        - matchPattern: "*.us.archive.org"
        # Official Project Gutenberg generated-content mirror (curated EPUB integration).
        - matchName: gutenberg.pglaf.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # MyAnonaMouse plugin: search API, .torrent download and seedbox registration.
    - toFQDNs:
        - matchName: www.myanonamouse.net
        - matchName: t.myanonamouse.net
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toFQDNs:
        - matchName: auth.smadja.dev
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            app.kubernetes.io/name: postgresql
            app.kubernetes.io/instance: bookorbit-postgresql
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Dedicated qBittorrent WebUI/API for public qualification only. MAM
    # source egress remains denied until separately approved.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            app.kubernetes.io/name: qbittorrent-mam
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bookorbit-postgresql
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: bookorbit-postgresql
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            app.kubernetes.io/name: bookorbit
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # One-shot maintenance Jobs (PLT-340).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            app.kubernetes.io/name: bookorbit-db-maintenance
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # CNPG operator status endpoint: without it the Cluster stays
    # "Instance Status Extraction Error" and Argo never reports it Healthy.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Prometheus scrape of the CNPG exporter (PodMonitor monitoring/cnpg-instances,
    # PLT-391): without it the target stays up==0 and the DB is unmonitored.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bookorbit-db-maintenance
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: bookorbit-db-maintenance
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            app.kubernetes.io/name: postgresql
            app.kubernetes.io/instance: bookorbit-postgresql
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
