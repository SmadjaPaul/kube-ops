apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bookorbit-postgresql
  namespace: media
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie
  bootstrap:
    initdb:
      database: bookorbit
      owner: bookorbit
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        - CREATE EXTENSION IF NOT EXISTS pg_trgm;
        - CREATE EXTENSION IF NOT EXISTS unaccent;
        - CREATE EXTENSION IF NOT EXISTS vector;
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: bookorbit-r2-store
  storage:
    size: 10Gi
    storageClass: longhorn-fast
  affinity:
    enablePodAntiAffinity: false
---
# Extensions gérées par l'opérateur (superuser) : le rôle applicatif ne peut pas
# CREATE EXTENSION vector (BookOrbit 3.6.0 en CrashLoop, PLT-340).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: bookorbit
  namespace: media
spec:
  name: bookorbit
  owner: bookorbit
  databaseReclaimPolicy: retain
  cluster:
    name: bookorbit-postgresql
  extensions:
    - name: uuid-ossp
      ensure: present
    - name: pg_trgm
      ensure: present
    - name: unaccent
      ensure: present
    - name: vector
      ensure: present
