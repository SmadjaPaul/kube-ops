apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
  - database.yaml
  - backup.yaml
  - external-secret.yaml
  - app.yaml
  - networkpolicy.yaml
  - backup-pre-reset-20261115.yaml

configMapGenerator:
  - name: bookorbit-plugin-gutenberg-fr-candide
    files:
      - index.mjs=plugins/gutenberg-fr-candide.mjs

# PLT-394 (protection avant eclatement du domaine media) : ces objets quitteront le suivi de
# l'Application apps-media, qui subsiste pour Polyfin. Sans Prune=false vivant, son prochain sync
# les elaguerait avant que app-bookorbit ne les reprenne. Annotation transitoire, retiree par le
# commit d'eclatement une fois l'app propre en charge. Les objets deja annotes ne changent pas.
patches:
  - target:
      annotationSelector: "!argocd.argoproj.io/sync-options"
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: Prune=false
