apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: bookorbit-data
  namespace: media
  labels:
    app.kubernetes.io/name: bookorbit
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-fast
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookorbit
  namespace: media
  labels:
    app.kubernetes.io/name: bookorbit
  annotations:
    secret.reloader.stakater.com/reload: "bookorbit-runtime,bookorbit-postgresql-app"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bookorbit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookorbit
      annotations:
        # Opt-in only /appdata; never include the shared 2-TiB media PVC.
        backup.velero.io/backup-volumes: data
    spec:
      # Private split-DNS used by Authentik discovery without Cloudflare AAAA drift.
      hostAliases:
        - ip: "10.0.20.192"
          hostnames:
            - auth.smadja.dev
      securityContext:
        runAsNonRoot: true
        runAsUser: 2501
        runAsGroup: 2501
        fsGroup: 2501
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bookorbit
          image: ghcr.io/bookorbit/bookorbit:3.9.0@sha256:79cd9c66c990a82944514e3e82d5be5987f21eda96cb37a378ed1484043716fc
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            # OIDC is configured in Settings after local admin bootstrap.
            # Only authenticated administrators can add the trusted local issuer.
            - name: OIDC_ALLOW_LOCAL_ISSUERS
              value: "true"
            - name: PORT
              value: "3000"
            - name: APP_URL
              value: https://book.smadja.dev
            - name: CLIENT_URL
              value: https://book.smadja.dev
            - name: TZ
              value: Europe/Paris
            - name: PUID
              value: "2501"
            - name: PGID
              value: "2501"
            - name: BOOKORBIT_FIX_PERMISSIONS
              value: "false"
            - name: APP_DATA_PATH
              value: /appdata
            - name: BOOK_DOCK_PATH
              value: /data/book-dock
            - name: LIBRARY_BROWSE_ROOT
              value: /data/media/books
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: bookorbit-postgresql-app
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: bookorbit-postgresql-app
                  key: port
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: bookorbit-postgresql-app
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookorbit-postgresql-app
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: bookorbit-postgresql-app
                  key: dbname
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bookorbit-runtime
                  key: JWT_SECRET
            - name: SETUP_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bookorbit-runtime
                  key: SETUP_BOOTSTRAP_TOKEN
            - name: PODCAST_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: bookorbit-runtime
                  key: PODCAST_ENCRYPTION_KEY
            - name: BOOK_REQUEST_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: bookorbit-runtime
                  key: BOOK_REQUEST_ENCRYPTION_KEY
            - name: AI_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: bookorbit-runtime
                  key: AI_ENCRYPTION_KEY
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /appdata
            - name: gutenberg-plugin
              mountPath: /appdata/plugins/indexers/gutenberg-fr-candide
              readOnly: true
            - name: mam-plugin
              mountPath: /appdata/plugins/indexers/myanonamouse
              readOnly: true
            - name: media
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bookorbit-data
        - name: gutenberg-plugin
          configMap:
            name: bookorbit-plugin-gutenberg-fr-candide
        - name: mam-plugin
          configMap:
            name: bookorbit-plugin-myanonamouse
        - name: media
          persistentVolumeClaim:
            claimName: media-share
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bookorbit
  namespace: media
spec:
  selector:
    app.kubernetes.io/name: bookorbit
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookorbit
  namespace: media
spec:
  # PRD-122: `external` publishes book.smadja.dev through the Cloudflare tunnel,
  # ONLY behind the Cloudflare Access applications for BookOrbit (homelab-infra
  # MANDAT 28, SmadjaPaul/homelab-infra#828; ARC apply not before 2026-11-30
  # 11:00 UTC; mandate expires 2026-12-15). *.smadja.dev already points to the
  # tunnel: the route is public as soon as it merges. Merge only after Access is
  # applied and an anonymous request to https://book.smadja.dev/ is redirected to
  # smadja.cloudflareaccess.com. Only the KOReader and OPDS paths of the mandate
  # bypass Access; BookOrbit authenticates them. Rollback: remove `external` first
  # (the Access applications stay).
  # `internal` keeps the LAN and NetBird path.
  parentRefs:
    - { name: internal, namespace: gateway }
    - { name: external, namespace: gateway }
  hostnames:
    - book.smadja.dev
  rules:
    - backendRefs:
        - name: bookorbit
          port: 80
