apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: configarr-preview-access
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: configarr-preview
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            app: radarr
      toPorts:
        - ports:
            - port: "7878"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            app: sonarr
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            app: prowlarr
      toPorts:
        - ports:
            - port: "9696"
              protocol: TCP
    # Configarr may retrieve pinned public TRaSH/Recyclarr references.
    # Effective namespace policy is additive: validate with Hubble at runtime.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
