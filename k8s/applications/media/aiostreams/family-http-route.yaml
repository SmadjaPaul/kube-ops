apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aiostreams-family
  namespace: media
spec:
  parentRefs:
    - name: external
      namespace: gateway
    - name: internal
      namespace: gateway
  hostnames:
    - tv.smadja.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: polyfin
          port: 80
