apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aiostreams-family
  namespace: media
spec:
  parentRefs:
    - name: internal
      namespace: gateway
    - name: external
      namespace: gateway
  hostnames:
    - tv.smadja.dev
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /jellyfin/u/tv/web/
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: aiostreams
          port: 80
