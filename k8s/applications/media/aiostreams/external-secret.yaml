apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aiostreams-bootstrap
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: aiostreams-bootstrap
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: APP_AIOSTREAMS_SECRET_KEY
    - secretKey: AIOSTREAMS_AUTH
      remoteRef:
        key: APP_AIOSTREAMS_OPERATOR_AUTH
