apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
  - pvc.yaml
  - external-secret.yaml
  - oidc-external-secret.dormant.yaml
  - deployment.yaml
  - service.yaml
  - http-route.yaml
  - family-http-route.yaml
  - networkpolicy.yaml
patchesStrategicMerge:
  - oidc-deployment-patch.dormant.yaml

# PLT-394 (protection avant eclatement du domaine media) : ces objets quitteront le suivi de
# l'Application apps-media, qui subsiste pour Polyfin. Sans Prune=false vivant, son prochain sync
# les elaguerait avant que app-aiostreams ne les reprenne. Annotation transitoire, retiree par le
# commit d'eclatement une fois l'app propre en charge. Les objets deja annotes ne changent pas.
patches:
  - target:
      annotationSelector: "!argocd.argoproj.io/sync-options"
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: Prune=false
