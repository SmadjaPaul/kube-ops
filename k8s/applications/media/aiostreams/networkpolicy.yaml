apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: aiostreams-runtime
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: aiostreams
  description: "AIOStreams metadata/control only; no media proxy permitted by config or E2E acceptance"
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # External addon/metadata/TorBox lookups. Tighten by observed FQDNs after
    # exact addon selection; no video delivery is authorized via this Pod.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
