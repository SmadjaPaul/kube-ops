apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: aiostreams-runtime
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: aiostreams
  description: "AIOStreams metadata/control only; no media proxy permitted by config or E2E acceptance"
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toFQDNs:
        - matchName: auth.smadja.dev
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # The issuer resolves to Gateway/internal on the cluster DNS view.  Cilium
    # Gateway hairpin traffic needs the VIP and the routed Authentik backend
    # explicitly allowed; keep both destinations bounded and do not grant
    # world:443.  This mirrors the already-qualified Matrix MAS workaround.
    - toCIDRSet:
        - cidr: 10.0.20.192/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: auth
            app.kubernetes.io/name: authentik
            app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    # This application is active in the private media root. Keep external
    # egress closed until a follow-up admission change records the exact
    # addon, metadata, indexer and debrid FQDNs actually used.
    # In particular, never replace this with world:443: AIOStreams accepts
    # user-supplied addon URLs and contains a built-in media proxy route.
