apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: aiostreams-runtime
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: aiostreams
  description: "AIOStreams metadata/control only; no media proxy permitted by config or E2E acceptance"
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: atlantis-system
            k8s:app: atlantis
            k8s:release: atlantis-pilot
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toFQDNs:
        - matchName: auth.smadja.dev
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # The issuer resolves to Gateway/internal on the cluster DNS view.  Cilium
    # Gateway hairpin traffic needs the VIP and the routed Authentik backend
    # explicitly allowed; keep both destinations bounded and do not grant
    # world:443.  This mirrors the already-qualified Matrix MAS workaround.
    - toCIDRSet:
        - cidr: 10.0.20.192/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: auth
            app.kubernetes.io/name: authentik
            app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    # PLT-121: explicit metadata, addon and TorBox control-plane endpoints
    # observed for the native video profile. These hosts are used to fetch
    # metadata or stream descriptors; they do not permit media bytes / CDN
    # egress. Extra AIOMetadata/custom-addon hosts require a separate observed
    # FQDN admission; do NOT add broad world:443 or a video proxy.
    - toFQDNs:
        - matchName: api.torbox.app
        - matchName: search-api.torbox.app
        - matchName: v3-cinemeta.strem.io
        - matchName: v3.sg.media-imdb.com
        - matchName: remuxdb.1632022.xyz
        - matchName: comet.feels.legal
        - matchName: meteorfortheweebs.midnightignite.me
        - matchName: stremthru.13377001.xyz
        - matchName: opensubtitles-v3.strem.io
        - matchName: aiometadata.streetle.dev
        - matchName: tmdb.elfhosted.com
        - matchName: 1fe84bc728af-stremio-anime-catalogs.baby-beamup.club
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
