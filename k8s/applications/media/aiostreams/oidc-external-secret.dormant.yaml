# DORMANT. Intentionally NOT included in aiostreams/kustomization.yaml.
# Admit together with the provider secret on the Authentik side.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aiostreams-oidc
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: aiostreams-oidc
    creationPolicy: Owner
  data:
    - secretKey: AIOSTREAMS_OIDC_CLIENT_SECRET
      remoteRef:
        key: APP_AIOSTREAMS_OIDC_CLIENT_SECRET
