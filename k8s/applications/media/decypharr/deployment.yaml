apiVersion: apps/v1
kind: Deployment
metadata:
  name: decypharr
  namespace: media
  labels:
    app.kubernetes.io/name: decypharr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: decypharr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: decypharr
    spec:
      securityContext:
        fsGroup: 2501
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-config
          image: busybox:1.36.1
          command:
            - /bin/sh
            - -ec
            - |
              if [ ! -f /app/config.json ]; then
                cp /seed/config.json /app/config.json
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /app
            - name: seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: decypharr
          image: ghcr.io/sirrobot01/decypharr:v2.5@sha256:a65c62a18843ca3dfa73cdee5eecccd3732d98f3ff845ae8338a1caf7060dd1a
          env:
            - name: TZ
              value: Europe/Paris
            - name: PUID
              value: "2501"
            - name: PGID
              value: "2501"
          ports:
            - name: http
              containerPort: 8282
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: state
              mountPath: /app
            - name: media
              mountPath: /data
            - name: cache
              mountPath: /cache
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: decypharr-state
        - name: media
          persistentVolumeClaim:
            claimName: media-share
        - name: seed
          configMap:
            name: decypharr-config
        - name: cache
          emptyDir:
            sizeLimit: 4Gi
