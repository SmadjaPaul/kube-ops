apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: decypharr-state
  namespace: media
  annotations:
    # PLT-251: Decypharr is retired but this PVC is data; Argo must never prune it.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-fast
  resources:
    requests:
      storage: 2Gi
