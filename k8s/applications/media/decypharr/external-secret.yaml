apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: decypharr-api
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: decypharr-api
    creationPolicy: Owner
  data:
    - secretKey: TORBOX_API_KEY
      remoteRef:
        key: APP_TORBOX_API_KEY
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: APP_RADARR_API_KEY
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: APP_SONARR_API_KEY
