apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: factory-platform-postgresql-source
  namespace: factory-platform
spec:
  length: 48
  digits: 10
  symbols: 8
  symbolCharacters: "-_@"
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: factory-platform-postgresql-source
  namespace: factory-platform
spec:
  refreshPolicy: CreatedOnce
  target:
    name: factory-platform-postgresql-source
    creationPolicy: Orphan
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: factory_source_ro
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: factory-platform-postgresql-source
