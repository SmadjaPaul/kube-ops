apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: factory-cubestore-data, namespace: factory-platform}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-bulk
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: factory-cubestore, namespace: factory-platform}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: factory-cubestore}}
  template:
    metadata: {labels: {app: factory-cubestore}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cubestore
          image: cubejs/cubestore@sha256:4a5c06b207bc3d289b2d919104eb8923730f5e39d5911bef8b49277c81f4275c
          env: [{name: CUBESTORE_REMOTE_DIR, value: /cube/data}]
          ports: [{name: http, containerPort: 3030}]
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: data, mountPath: /cube/data}
            - {name: metastore, mountPath: /cube/.cubestore}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: factory-cubestore-data}
        - name: metastore
          emptyDir: {sizeLimit: 256Mi}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: factory-cubestore, namespace: factory-platform}
spec:
  selector: {app: factory-cubestore}
  ports: [{name: http, port: 3030, targetPort: http}]
