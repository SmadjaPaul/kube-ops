apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: factory-cubestore-data, namespace: factory-platform}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-bulk
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: factory-cubestore, namespace: factory-platform}
spec:
  replicas: 0 # same readiness gate as Cube API
  strategy: {type: Recreate}
  selector: {matchLabels: {app: factory-cubestore}}
  template:
    metadata: {labels: {app: factory-cubestore}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: cubestore
          image: cubejs/cubestore:v1.8.3
          env: [{name: CUBESTORE_REMOTE_DIR, value: /cube/data}]
          ports: [{name: http, containerPort: 3030}]
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /cube/data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: factory-cubestore-data}
---
apiVersion: v1
kind: Service
metadata: {name: factory-cubestore, namespace: factory-platform}
spec:
  selector: {app: factory-cubestore}
  ports: [{name: http, port: 3030, targetPort: http}]
