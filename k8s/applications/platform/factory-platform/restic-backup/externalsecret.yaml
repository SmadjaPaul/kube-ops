# PLT-369: restic repository access for factory-platform (repository factory-platform/
# in bucket homelab-backup-restic). Doppler cluster/prd keys, all already used by
# the paperless restic-backup (PLT-286); values are never written to Git:
#   RESTIC_BACKUP_PASSWORD       restic repository password (shared restic password);
#   R2_RESTIC_WRITER_*           Object Read & Write on homelab-backup-restic only;
#   R2_S3_ENDPOINT               existing; keeps the account id out of Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: restic-backup
  namespace: factory-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: restic-backup
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RESTIC_REPOSITORY: "s3:{{ .endpoint }}/homelab-backup-restic/factory-platform"
        RESTIC_PASSWORD: "{{ .password }}"
        AWS_ACCESS_KEY_ID: "{{ .accessKeyId }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secretAccessKey }}"
  data:
    - secretKey: password
      remoteRef:
        key: RESTIC_BACKUP_PASSWORD
    - secretKey: accessKeyId
      remoteRef:
        key: R2_RESTIC_WRITER_ACCESS_KEY_ID
    - secretKey: secretAccessKey
      remoteRef:
        key: R2_RESTIC_WRITER_SECRET_ACCESS_KEY
    - secretKey: endpoint
      remoteRef:
        key: R2_S3_ENDPOINT
