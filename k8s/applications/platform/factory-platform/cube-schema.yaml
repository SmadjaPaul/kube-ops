apiVersion: v1
kind: ConfigMap
metadata: {name: factory-cube-schema, namespace: factory-platform}
data:
  FactoryOverview.js: |
    cube('FactoryOverview', {
      sql: `SELECT * FROM analytics.mart_factory_overview`,
      measures: {
        totalEvents: { sql: 'total_events', type: 'max' },
        githubPullRequests: { sql: 'github_pull_requests', type: 'max' },
        githubWorkflowRuns: { sql: 'github_workflow_runs', type: 'max' },
        paperclipRuns: { sql: 'paperclip_runs', type: 'max' },
        ciSuccessRate: { sql: 'ci_success_rate', type: 'max' },
        humanInterventions: { sql: 'human_interventions', type: 'max' }
      },
      dimensions: {},
    });
