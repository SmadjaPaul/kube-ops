# PLT-168: replacement for factory-platform-postgresql (hibernated, kept for
# forensics). Recovered from the Barman archive of the old cluster (serverName
# factory-platform-postgresql) at the PITR target used for the validated
# restore factory-platform-recovery/factory-platform-restore-20261104.
# The bootstrap block is ignored by CNPG once the cluster exists.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: factory-platform-pg2
  namespace: factory-platform
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    # PLT-369 opt-in read by scripts/backup-coverage-static.py and
    # scripts/backup-static-contract.sh: the Velero FS backup of the instance PVCs
    # (defaultVolumesToFsBackup, namespace schedule) is accepted as a crash-consistent
    # backup, the only PVC-level one for this cluster. Not restore-tested: see
    # docs/operations/factory-platform-pg2-restore.md before relying on it.
    backup.smadja.dev/velero-crash-consistent: "PLT-369"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7
  bootstrap:
    recovery:
      source: factory-platform-old
      database: factory
      owner: factory
      recoveryTarget:
        targetTime: "2026-10-29T00:35:32Z"
  externalClusters:
    - name: factory-platform-old
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: factory-platform-hetzner-store
          serverName: factory-platform-postgresql
  managed:
    roles:
      - name: factory_source_ro
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        inRoles:
          - pg_read_all_data
        passwordSecret:
          name: factory-platform-postgresql-source
  # PLT-94 lot 7 (MANDAT 21, D-2026-11-16-07) : arret de l'archivage WAL vers
  # Hetzner. Le plugin WAL barman-cloud (store factory-platform-pg2-store) est
  # retire. Perte de l'archivage WAL et de la sauvegarde de pg2 acceptee
  # (MANDAT 17 D-2026-11-16-06 + MANDAT 21). pg_wal est recycle localement par
  # Postgres (archive_mode off), donc le volume ne se remplit pas. Le bloc
  # externalClusters/bootstrap.recovery (source factory-platform-old) est
  # CONSERVE : son retrait est refusable par le webhook CNPG tant que
  # bootstrap.recovery.source le reference, et exige un dry-run serveur (acces
  # en ecriture) ; voir la description de la PR.
  storage:
    size: 20Gi
    storageClass: longhorn-bulk
  walStorage:
    size: 5Gi
    storageClass: longhorn-bulk
    resizeInUseVolumes: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  monitoring:
    enablePodMonitor: false
  affinity:
    enablePodAntiAffinity: false
