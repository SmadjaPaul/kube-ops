apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: factory-platform

resources:
  - namespace.yaml
  - registry-externalsecret.yaml
  - runtime-externalsecret.yaml
  - database-s3-credentials.yaml
  - database-source-credentials.yaml
  - database-objectstore.yaml
  - database-pg2-objectstore.yaml
  - database-r2-recovery.yaml
  - database.yaml
  - database-pg2.yaml
  # PLT-94 lot 7 : ScheduledBackup factory-platform-pg2-weekly retire (backup
  # plugin impossible sans le plugin WAL retire du Cluster).
  - database-pg2-initial-backup.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
  - collector-cronjob.yaml
  # PLT-369: logical dump of factory-platform-pg2 to R2 (restic), PLT-286 pattern.
  - restic-backup
  - dbt-cronjob.yaml
  - networkpolicy.yaml
  - cube-schema.yaml
  - cube-secrets.yaml
  - cubestore.yaml
  - cube.yaml
  - cube-networkpolicy.yaml
