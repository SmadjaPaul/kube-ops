apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: factory-platform-postgresql
  namespace: factory-platform
  annotations:
    # PLT-168: instance crashloops since 2026-10-29 (PANIC replication checkpoint
    # wrong magic). Hibernation stops the loop and keeps PGDATA/WAL PVCs intact
    # for forensics. Owner: Paul. Remove only once the restored cluster
    # (factory-platform-recovery/factory-platform-restore-20261104, PITR
    # 2026-10-29T00:35:32Z) has been promoted or this data is deliberately retired.
    cnpg.io/hibernation: "on"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7
  bootstrap:
    initdb:
      database: factory
      owner: factory
  managed:
    roles:
      - name: factory_source_ro
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        inRoles:
          - pg_read_all_data
        passwordSecret:
          name: factory-platform-postgresql-source
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: factory-platform-hetzner-store
  storage:
    size: 20Gi
    storageClass: longhorn-bulk
  walStorage:
    size: 5Gi
    storageClass: longhorn-bulk
    resizeInUseVolumes: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  monitoring:
    enablePodMonitor: false
  affinity:
    enablePodAntiAffinity: false
