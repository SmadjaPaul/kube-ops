apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: factory-cube-auth, namespace: factory-platform}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: factory-cube-auth, creationPolicy: Owner}
  data:
    - secretKey: CUBEJS_API_SECRET
      remoteRef: {key: APP_FACTORY_CUBE_API_SECRET}
