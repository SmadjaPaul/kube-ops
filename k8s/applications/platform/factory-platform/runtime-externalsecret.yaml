apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: factory-platform-runtime
  namespace: factory-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: factory-platform-runtime
    creationPolicy: Owner
  data:
    - secretKey: github-app-token
      remoteRef:
        key: APP_FACTORY_PLATFORM_GITHUB_APP_TOKEN
    - secretKey: ingest-api-key
      remoteRef:
        key: APP_FACTORY_PLATFORM_INGEST_API_KEY
