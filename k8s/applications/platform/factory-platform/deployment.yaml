apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-platform
  namespace: factory-platform
  labels:
    app.kubernetes.io/name: factory-platform
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: factory-platform
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: factory-platform
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: platform
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: factory-platform-ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/smadjapaul/factory-platform@sha256:44907535c5cbc1eb85efea80cd171cdcef2b8325c1c8862868ab45ff1412b722
          imagePullPolicy: IfNotPresent
          command: ["alembic"]
          args: ["upgrade", "head"]
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.monitoring.svc.cluster.local:4318
            - name: DEPLOYMENT_ENVIRONMENT
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: factory-platform-postgresql-app
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      containers:
        - name: api
          image: ghcr.io/smadjapaul/factory-platform@sha256:44907535c5cbc1eb85efea80cd171cdcef2b8325c1c8862868ab45ff1412b722
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: factory-platform-postgresql-app
                  key: uri
            - name: FACTORY_TENANT_ID
              value: smadja-internal
            - name: FACTORY_GITHUB_REPOS
              value: SmadjaPaul/kube-ops,SmadjaPaul/factory-platform,SmadjaPaul/homelab-infra,SmadjaPaul/website
            - name: FACTORY_GITHUB_PULL_MAX_PAGES
              value: "4"
            - name: FACTORY_GITHUB_WORKFLOW_MAX_PAGES
              value: "2"
            - name: FACTORY_OTLP_TENANT_ID
              value: smadja-internal
            - name: FACTORY_INGEST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: factory-platform-runtime
                  key: ingest-api-key
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
