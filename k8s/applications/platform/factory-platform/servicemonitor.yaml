apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: factory-platform
  namespace: factory-platform
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: factory-platform
    app.kubernetes.io/component: api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: factory-platform
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: /metrics
      # Revue séries 2026-11-23: the factory is frozen, none of its factory_*
      # gauges changed in 24 h (`changes(...[24h]) == 0`), and no alert reads
      # up{job="factory-platform"}. 2m keeps the Factory dashboards fresh.
      interval: 2m
      scrapeTimeout: 10s
