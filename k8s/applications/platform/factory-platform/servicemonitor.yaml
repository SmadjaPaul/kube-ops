apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: factory-platform
  namespace: factory-platform
  labels:
    app.kubernetes.io/name: factory-platform
    app.kubernetes.io/component: api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: factory-platform
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
