apiVersion: batch/v1
kind: CronJob
metadata:
  name: factory-platform-dbt
  namespace: factory-platform
  labels:
    app.kubernetes.io/name: factory-platform
    app.kubernetes.io/component: dbt
spec:
  schedule: "5,35 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: factory-platform
            app.kubernetes.io/component: dbt
            app.kubernetes.io/part-of: platform
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: factory-platform-ghcr
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dbt
              image: ghcr.io/smadjapaul/factory-platform@sha256:926644cfe104db4c909d9d1b726bcb8631de722f5b7d8adfef645a2ff3d7c4bd
              imagePullPolicy: IfNotPresent
              args: ["dbt-build"]
              env:
                - name: DBT_HOST
                  valueFrom:
                    secretKeyRef:
                      name: factory-platform-postgresql-app
                      key: host
                - name: DBT_PORT
                  valueFrom:
                    secretKeyRef:
                      name: factory-platform-postgresql-app
                      key: port
                - name: DBT_USER
                  valueFrom:
                    secretKeyRef:
                      name: factory-platform-postgresql-app
                      key: user
                - name: DBT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: factory-platform-postgresql-app
                      key: password
                - name: DBT_DBNAME
                  valueFrom:
                    secretKeyRef:
                      name: factory-platform-postgresql-app
                      key: dbname
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 512Mi
