apiVersion: batch/v1
kind: CronJob
metadata:
  name: factory-platform-dbt
  namespace: factory-platform
  labels:
    app.kubernetes.io/name: factory-platform
    app.kubernetes.io/component: dbt
spec:
  schedule: "5,35 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: factory-platform
            app.kubernetes.io/component: dbt
            app.kubernetes.io/part-of: platform
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: factory-platform-ghcr
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dbt
              image: ghcr.io/smadjapaul/factory-platform-dbt@sha256:0f198eefdcf0ed9b0b319b50c24cd36e91780b59164367ec53c0dcf5a39aa166
              imagePullPolicy: IfNotPresent
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: factory-platform-postgresql-app
                      key: uri
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: http://alloy.monitoring.svc.cluster.local:4318
                - name: DEPLOYMENT_ENVIRONMENT
                  value: production
                - name: FACTORY_REPOSITORY
                  value: SmadjaPaul/factory-platform
                - name: DBT_DUCKDB_PATH
                  value: /tmp/factory.duckdb
                - name: DBT_TARGET_PATH
                  value: /tmp/dbt-target
                - name: DBT_LOG_PATH
                  value: /tmp/dbt-logs
                - name: DBT_HOST
                  valueFrom:
                    secretKeyRef:
                      name: factory-platform-postgresql-app
                      key: host
                - name: DBT_PORT
                  valueFrom:
                    secretKeyRef:
                      name: factory-platform-postgresql-app
                      key: port
                - name: DBT_USER
                  valueFrom:
                    secretKeyRef:
                      name: factory-platform-postgresql-source
                      key: username
                - name: DBT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: factory-platform-postgresql-source
                      key: password
                - name: DBT_DBNAME
                  valueFrom:
                    secretKeyRef:
                      name: factory-platform-postgresql-app
                      key: dbname
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
