apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: factory-platform-ghcr
  namespace: factory-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: factory-platform-ghcr
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: FACTORY_PLATFORM_GHCR_USERNAME
    - secretKey: token
      remoteRef:
        key: FACTORY_PLATFORM_GHCR_TOKEN
