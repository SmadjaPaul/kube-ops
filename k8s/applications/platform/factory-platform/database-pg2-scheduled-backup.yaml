apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: factory-platform-pg2-weekly
  namespace: factory-platform
spec:
  schedule: "0 15 3 * * 0"
  backupOwnerReference: self
  cluster:
    name: factory-platform-pg2
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: factory-platform-pg2-store
