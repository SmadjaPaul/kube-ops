apiVersion: apps/v1
kind: Deployment
metadata: {name: factory-cube, namespace: factory-platform}
spec:
  replicas: 1
  selector: {matchLabels: {app: factory-cube}}
  template:
    metadata: {labels: {app: factory-cube}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cube
          image: cubejs/cube@sha256:a84bae164de5d6b6a8ab3f5e6bb55f62a17dbc31021aa85d8a226ebc1e52eb5c
          ports: [{name: http, containerPort: 4000}]
          env:
            - {name: CUBEJS_DB_TYPE, value: postgres}
            - {name: CUBEJS_DEV_MODE, value: "false"}
            - {name: CUBEJS_TELEMETRY, value: "false"}
            - {name: CUBEJS_CUBESTORE_HOST, value: factory-cubestore.factory-platform.svc.cluster.local}
            - {name: CUBEJS_DB_HOST, valueFrom: {secretKeyRef: {name: factory-platform-postgresql-app, key: host}}}
            - {name: CUBEJS_DB_PORT, valueFrom: {secretKeyRef: {name: factory-platform-postgresql-app, key: port}}}
            - {name: CUBEJS_DB_NAME, valueFrom: {secretKeyRef: {name: factory-platform-postgresql-app, key: dbname}}}
            - {name: CUBEJS_DB_USER, valueFrom: {secretKeyRef: {name: factory-platform-postgresql-source, key: username}}}
            - {name: CUBEJS_DB_PASS, valueFrom: {secretKeyRef: {name: factory-platform-postgresql-source, key: password}}}
            - {name: CUBEJS_API_SECRET, valueFrom: {secretKeyRef: {name: factory-cube-auth, key: CUBEJS_API_SECRET}}}
          volumeMounts:
            - {name: models, mountPath: /cube/conf/model/FactoryOverview.js, subPath: FactoryOverview.js, readOnly: true}
            - {name: cube-config, mountPath: /cube/conf/cube.js, subPath: cube.js, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 100m, memory: 768Mi}
            limits: {cpu: "1", memory: 2Gi}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: models
          configMap:
            name: factory-cube-schema
            items: [{key: FactoryOverview.js, path: FactoryOverview.js}]
        - name: cube-config
          configMap:
            name: factory-cube-schema
            items: [{key: cube.js, path: cube.js}]
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: factory-cube, namespace: factory-platform}
spec:
  selector: {app: factory-cube}
  ports: [{name: http, port: 4000, targetPort: http}]
