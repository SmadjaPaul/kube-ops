# PLT-339: the Agentgateway virtual key `optio` is an internal secret (generated in the cluster).
# Optio only reads API keys from its own encrypted store, so this CronJob writes it there with
# Optio's own storeSecret(), from the Secrets already synced in this namespace. Nobody handles the
# value; a rotated key is picked up at the next run.
# PLT-515: the rows are private (scope "user") to one Optio user. Work that user owns signs in
# through Agentgateway: CLAUDE_AUTH_MODE=gateway is a mode Optio does not handle, so it injects no
# Claude credential, and the user's private connection exports the URL and key. Organization work
# keeps the instance-wide sign-in. Undocumented upstream: re-check on every Optio upgrade.
# The mode is written last: URL and key exist before any work stops getting the instance sign-in.
# PLT-516 (janitor, same run): a repo task stopped for 2 hours without being `completed`
# (needs_attention, failed, cancelled, pr_opened) stops holding its agent pod, and a pod record in
# error that never had a pod is removed. Optio then deletes the idle StatefulSet, and Kubernetes its
# volumes (k8s/infrastructure/security/optio-agents). Uncommitted work of such a task is lost.
# Relies on internal modules and tables of the pinned image.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: optio-secret-sync
  labels: {app.kubernetes.io/name: optio-secret-sync}
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: {app: optio-secret-sync, app.kubernetes.io/name: optio-secret-sync}
        spec:
          restartPolicy: Never
          # Counted outside the agent pod quota (quota.yaml): full agent slots must not stop it.
          priorityClassName: optio-maintenance
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: sync
              image: ghcr.io/jonwiggins/optio-api:0.26.4@sha256:31de15bb8cd9d672cec1cac21717b0ef488f3d1c255a0a91b1fd99c695eedc68
              workingDir: /app/apps/api
              command:
                - tsx
                - -e
                - |
                  (async () => {
                    const s = await import("./src/services/secret-service.ts");
                    const user = process.env.OPTIO_GATEWAY_USER_ID;
                    const key = process.env.GATEWAY_KEY;
                    if (!user || !key) throw new Error("input empty");
                    const rows = [
                      ["OPTIO_GATEWAY_URL", process.env.GATEWAY_URL],
                      ["OPTIO_GATEWAY_KEY", key],
                      ["CLAUDE_AUTH_MODE", "gateway"],
                    ];
                    for (const [name, wanted] of rows) {
                      if (!wanted) throw new Error("value empty");
                      const current = await s.retrieveSecret(name, "user", null, user).catch(() => null);
                      if (current !== wanted) await s.storeSecret(name, wanted, "user", null, user);
                      console.log(`SYNC_STATUS=PASS ${name} ${current === wanted ? "unchanged" : "written"}`);
                    }
                    const { db } = await import("./src/db/client.ts");
                    const { sql } = await import("drizzle-orm");
                    const released = await db.execute(sql`
                      update tasks set worktree_state = 'removed'
                      where kind = 'repo' and worktree_state = 'preserved' and recovery_required = false
                        and state in ('needs_attention', 'failed', 'cancelled', 'pr_opened')
                        and updated_at < now() - interval '2 hours'
                      returning id`);
                    const pruned = await db.execute(sql`
                      delete from agent_pods
                      where pool = 'repo' and state = 'error' and pod_name is null and active_count = 0
                        and updated_at < now() - interval '15 minutes'
                      returning id`);
                    console.log(`JANITOR_STATUS=PASS released=${released.length} pruned=${pruned.length}`);
                    process.exit(0);
                  })().catch((e) => { console.error("SYNC_STATUS=FAIL " + (e?.name ?? "error")); process.exit(1); });
              env:
                - {name: HOME, value: /tmp}
                - name: DATABASE_URL
                  valueFrom: {secretKeyRef: {name: optio-db, key: DATABASE_URL}}
                - name: OPTIO_ENCRYPTION_KEY
                  valueFrom: {secretKeyRef: {name: optio-app, key: OPTIO_ENCRYPTION_KEY}}
                # Optio user whose own work goes through Agentgateway (users.id, not a credential).
                - {name: OPTIO_GATEWAY_USER_ID, value: 12b02c53-6780-4c8f-975f-220ac1301fd4}
                - {name: GATEWAY_URL, value: "http://agentgateway.agentgateway.svc.cluster.local:4000"}
                - name: GATEWAY_KEY
                  valueFrom: {secretKeyRef: {name: optio-llm, key: ANTHROPIC_API_KEY}}
              resources:
                requests: {cpu: 50m, memory: 192Mi}
                limits: {cpu: 500m, memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: optio-secret-sync
spec:
  endpointSelector:
    matchLabels: {app: optio-secret-sync}
  egress:
    - toEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: databases, cnpg.io/cluster: pg-shared-homelab}
      toPorts:
        - ports: [{port: "5432", protocol: TCP}]
