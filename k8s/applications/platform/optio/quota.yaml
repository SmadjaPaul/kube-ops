# PLT-339: 2 agents at most (MANDAT 30). A quota cannot select pods by label, so the cap counts
# every pod of the namespace: 4 = api (with its web container) + redis + 2 agent pods (repo pod or Job, PR review
# included). A third agent pod is refused by the API server (Forbidden: exceeded quota).
# 2 PVCs = the agent home directories. The per-workspace concurrency in Optio must also be 2
# (UI or config-as-code, NON VERIFIE: no chart value for it in 0.26.4).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: optio-agents
  namespace: optio
spec:
  hard:
    pods: "4"
    persistentvolumeclaims: "2"
    requests.cpu: "6"
    requests.memory: 16Gi
    limits.cpu: "12"
    limits.memory: 32Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: optio-container-defaults
  namespace: optio
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 250m, memory: 512Mi}
      default: {cpu: "2", memory: 4Gi}
    - type: PersistentVolumeClaim
      max: {storage: 20Gi}
