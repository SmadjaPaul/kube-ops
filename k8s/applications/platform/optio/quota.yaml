# PLT-339: 2 agents at most (MANDAT 30). A quota cannot select pods by label, so the pod cap is a
# second quota counting every pod without a PriorityClass: 4 = api (with its web container) + redis +
# 2 agent pods (repo pod or Job, PR review included). A third agent pod is refused by the API server
# (Forbidden: exceeded quota). Only the maintenance CronJob has a PriorityClass. The per-workspace
# concurrency in Optio must also be 2 (UI or config-as-code, NON VERIFIE: no chart value in 0.26.4).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: optio-agents
  namespace: optio
spec:
  hard:
    # Two PVCs (home, workspace) per repo pod, deleted with its StatefulSet (PLT-516,
    # k8s/infrastructure/security/optio-agents).
    persistentvolumeclaims: "8"
    requests.storage: 80Gi
    requests.cpu: "6"
    requests.memory: 16Gi
    limits.cpu: "12"
    limits.memory: 32Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: optio-agent-pods
  namespace: optio
spec:
  hard:
    pods: "4"
  scopeSelector:
    matchExpressions:
      - {scopeName: PriorityClass, operator: DoesNotExist}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: optio-container-defaults
  namespace: optio
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 250m, memory: 512Mi}
      default: {cpu: "2", memory: 4Gi}
    - type: PersistentVolumeClaim
      max: {storage: 20Gi}
