# MANDAT 35: 10 agents in parallel. The agent limit is OPTIO_MAX_CONCURRENT (kustomization.yaml) and
# the repository settings in Optio; one pod hosts several agents. These quotas only bound the namespace:
# pods without a PriorityClass (api, redis, agent and job pods; the maintenance CronJob has one).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: optio-agents
  namespace: optio
spec:
  hard:
    # Two PVCs (home, workspace) per repo pod, deleted with its StatefulSet (PLT-516,
    # k8s/infrastructure/security/optio-agents).
    persistentvolumeclaims: "24"
    requests.storage: 240Gi
    requests.cpu: "8"
    requests.memory: 24Gi
    limits.cpu: "40"
    limits.memory: 80Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: optio-agent-pods
  namespace: optio
spec:
  hard:
    pods: "12"
  scopeSelector:
    matchExpressions:
      - {scopeName: PriorityClass, operator: DoesNotExist}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: optio-container-defaults
  namespace: optio
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 250m, memory: 512Mi}
      default: {cpu: "2", memory: 4Gi}
    - type: PersistentVolumeClaim
      max: {storage: 20Gi}
