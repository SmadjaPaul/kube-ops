# LAN only (Gateway/internal): no new public exposure (MANDAT 30). Linear is polled, no inbound webhook.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: optio
  namespace: optio
spec:
  parentRefs:
    - {name: internal, namespace: gateway}
  hostnames:
    - optio.smadja.dev
  rules:
    # /api/internal/ is for agent pods, over the cluster Service. Never through the gateway
    # (the upstream chart blocks it at its ingress): a rule without backend answers an error.
    - matches:
        - path: {type: PathPrefix, value: /api/internal}
    # WebSockets go straight to the API (session cookie + trusted Origin).
    - matches:
        - path: {type: PathPrefix, value: /ws}
      backendRefs:
        - {name: optio-api, port: 4000}
    # API clients with their own token (PAT, CLI): the web proxy drops Authorization.
    - matches:
        - path: {type: PathPrefix, value: /api}
          headers:
            - {type: RegularExpression, name: Authorization, value: "^Bearer .+"}
      backendRefs:
        - {name: optio-api, port: 4000}
    # Everything else, /api included, goes through the web app: its proxy turns the session
    # cookie into a token and adds the browser challenge that sign-in requires
    # (upstream docs/sign-in.md, "Browser authentication").
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: optio-web, port: 3000}
