apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: optio

resources:
  - namespace.yaml
  - quota.yaml
  - networkpolicy.yaml
  - externalsecrets.yaml
  - httproute.yaml

helmCharts:
  - name: optio
    repo: oci://ghcr.io/jonwiggins
    version: 0.26.4
    releaseName: optio
    namespace: optio
    includeCRDs: false
    valuesFile: values.yaml

# OPTIO_MAX_AUTO_RESUMES (default 10, docs/reconciliation.md) has no chart value in 0.26.4: set it on
# the API container. 3 automatic resumes at most per task (MANDAT 30).
patches:
  - target: {group: apps, version: v1, kind: Deployment, name: optio-api}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: OPTIO_MAX_AUTO_RESUMES, value: "3"}
      # The chart config holds no secret value (secrets come from existingSecrets): served as a
      # ConfigMap, a rendered Secret is refused by repo-contract-no-rendered-secret.
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0
        value: {configMapRef: {name: optio-config}}
      # emptyDir size limits (platform-baseline-emptydir-size-limit).
      - op: replace
        path: /spec/template/spec/volumes/0/emptyDir
        value: {sizeLimit: 512Mi}
      - op: replace
        path: /spec/template/spec/volumes/1/emptyDir
        value: {sizeLimit: 256Mi}
      - op: replace
        path: /spec/template/spec/volumes/2/emptyDir
        value: {sizeLimit: 1Gi}
  # Web container (second container of the API pod): probes (app-test observability/selfheal).
  - target: {group: apps, version: v1, kind: Deployment, name: optio-api}
    patch: |-
      - op: test
        path: /spec/template/spec/containers/1/name
        value: web
      - op: add
        path: /spec/template/spec/containers/1/readinessProbe
        value: {tcpSocket: {port: 3000}, periodSeconds: 10, failureThreshold: 6}
      - op: add
        path: /spec/template/spec/containers/1/livenessProbe
        value: {tcpSocket: {port: 3000}, initialDelaySeconds: 30, periodSeconds: 20, failureThreshold: 3}
  # Restart the API when the GitHub App secret changes: envFrom is read at start only.
  - target: {group: apps, version: v1, kind: Deployment, name: optio-api}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: optio-api
        annotations:
          secret.reloader.stakater.com/reload: "optio-github-app"
  # Redis: RuntimeDefault seccomp and probes.
  - target: {group: apps, version: v1, kind: Deployment, name: optio-redis}
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext/seccompProfile
        value: {type: RuntimeDefault}
      - op: test
        path: /spec/template/spec/containers/0/name
        value: redis
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe
        value: {tcpSocket: {port: 6379}, periodSeconds: 10, failureThreshold: 6}
      - op: add
        path: /spec/template/spec/containers/0/livenessProbe
        value: {tcpSocket: {port: 6379}, initialDelaySeconds: 15, periodSeconds: 20, failureThreshold: 3}
  # No NetworkPolicy from Optio: its per-repo "restricted" policy (utils/agent-network-policy.ts)
  # opens 0.0.0.0/0 minus private ranges, and policies add up, which would void the FQDN allow-list
  # of networkpolicy.yaml. Without the right, a repo set to "restricted" fails to start (fail closed).
  - target: {group: rbac.authorization.k8s.io, version: v1, kind: Role, name: optio-pod-manager}
    patch: |-
      - op: test
        path: /rules/9/resources/0
        value: networkpolicies
      - op: remove
        path: /rules/9
  - target: {version: v1, kind: Secret, name: optio-config}
    patch: |-
      - op: replace
        path: /kind
        value: ConfigMap
      - op: move
        from: /stringData
        path: /data
      - op: remove
        path: /type
  # Helm test Pods (helm.sh/hook: test): not run by Argo CD, and they would count in quota.yaml.
  - target: {version: v1, kind: Pod, name: optio-test-api}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Pod
      metadata: {name: optio-test-api}
  - target: {version: v1, kind: Pod, name: optio-test-redis}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Pod
      metadata: {name: optio-test-redis}
  - target: {version: v1, kind: Pod, name: optio-test-web}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Pod
      metadata: {name: optio-test-web}
  - target: {version: v1, kind: Pod, name: optio-test-metrics}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Pod
      metadata: {name: optio-test-metrics}
