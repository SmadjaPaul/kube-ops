# PLT-339: every Optio secret, by name only. Values: generated in the cluster or created by Paul (PLT-509).
# 1. Database password: generated source pg-optio (namespace databases, pg-shared-homelab), copy here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: optio-db, namespace: optio}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: k8s-databases}
  target:
    name: optio-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://optio:{{ .password }}@pg-shared-homelab-rw.databases.svc.cluster.local:5432/optio?sslmode=require"
  data:
    - secretKey: password
      remoteRef: {key: pg-optio, property: password}
---
# 2. Encryption key of the secrets Optio stores in its database. Data key (a dump is useless without
#    it): kept in Doppler, outside the cluster, created by Paul (`openssl rand -hex 32`, never shown).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: optio-app, namespace: optio}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: doppler-cluster}
  target: {name: optio-app, creationPolicy: Owner}
  data:
    - secretKey: OPTIO_ENCRYPTION_KEY
      remoteRef: {key: APP_OPTIO_ENCRYPTION_KEY}
---
# 3. OIDC client of Authentik (PLT-509).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: optio-oidc, namespace: optio}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: doppler-cluster}
  target: {name: optio-oidc, creationPolicy: Owner}
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef: {key: APP_OPTIO_OIDC_CLIENT_ID}
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef: {key: APP_OPTIO_OIDC_CLIENT_SECRET}
---
# 4. GitHub App, without the `workflows` permission (PLT-509).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: optio-github-app, namespace: optio}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: doppler-cluster}
  target: {name: optio-github-app, creationPolicy: Owner}
  data:
    - secretKey: GITHUB_APP_ID
      remoteRef: {key: APP_OPTIO_GITHUB_APP_ID}
    - secretKey: GITHUB_APP_INSTALLATION_ID
      remoteRef: {key: APP_OPTIO_GITHUB_APP_INSTALLATION_ID}
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef: {key: APP_OPTIO_GITHUB_APP_PRIVATE_KEY}
    # No GITHUB_APP_CLIENT_ID/SECRET on purpose: Optio turns them into "Sign in with GitHub",
    # open to any account when no domain list is set. Sign-in is Authentik only.
---
# 5. Agentgateway virtual key `optio` (generated in namespace agentgateway, PR agentgateway of PLT-339).
#    Entered as ANTHROPIC_API_KEY of the "passerelle" workspace connection. How Optio reads it from a
#    Kubernetes Secret rather than its own encrypted store is NON VERIFIE.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: optio-llm, namespace: optio}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: k8s-agentgateway}
  target: {name: optio-llm, creationPolicy: Owner}
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef: {key: llm-optio, property: OPTIO_AGENTGATEWAY_KEY}
---
# PLT-542: Agentgateway virtual key `optio-pi` (agentgateway/optio-pi-key.yaml). optio-secret-sync
# writes it as the private Optio secret OPENAI_API_KEY, the only name the Pi credential picker of
# Optio 0.26.4 accepts for an OpenAI-compatible endpoint. It is not an OpenAI key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: optio-llm-pi, namespace: optio}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: k8s-agentgateway}
  target: {name: optio-llm-pi, creationPolicy: Owner}
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef: {key: llm-optio--pi, property: OPTIO_PI_AGENTGATEWAY_KEY}
---
# PLT-542: kubelet-only pull credential of the private image ghcr.io/smadjapaul/factory-optio-pi.
# Same read:packages token as the ARC runners (Doppler key APP_FACTORY_ARC_GHCR_READ_TOKEN,
# k8s/optional/github-actions-arc/factory-ghcr-pull-secret.yaml). No pod references it from this
# change: only the Pi image policy adds it, to the pods that run the private image. Never put it on
# the ServiceAccount optio-agent: a bad token would then also break the public image pulls.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: optio-ghcr-pull, namespace: optio}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: doppler-cluster}
  target:
    name: optio-ghcr-pull
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"SmadjaPaul","password":"{{ .token }}","auth":"{{ printf "%s:%s" "SmadjaPaul" .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef: {key: APP_FACTORY_ARC_GHCR_READ_TOKEN}
---
# 6. Deployment admins of Optio (OPTIO_DEPLOYMENT_ADMINS, comma-separated list). Personal data: kept in
#    Doppler only, created by Paul. Separate ExternalSecret so a missing key breaks nothing else.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: optio-admins, namespace: optio}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: doppler-cluster}
  target: {name: optio-admins, creationPolicy: Owner}
  data:
    - secretKey: OPTIO_DEPLOYMENT_ADMINS
      remoteRef: {key: APP_OPTIO_DEPLOYMENT_ADMINS}
---
# Linear key of the ticket intake job (MANDAT 35): the existing Linear key kept in Doppler, copied by
# optio-secret-sync into the private secret of one Optio user. Never shown to a person or an agent here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: optio-linear, namespace: optio}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: doppler-cluster}
  target: {name: optio-linear, creationPolicy: Owner}
  data:
    - secretKey: LINEAR_API_KEY
      remoteRef: {key: PROXMOX_UPDATES_LINEAR_API_KEY}
