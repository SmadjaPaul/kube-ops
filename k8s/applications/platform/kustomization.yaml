apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - factory-platform
  - open-connector
  - agentgateway
  - mastra-factory
  - mastra-sandbox
  - matrix
  # PLT-202: isolated read-only CNPG recovery drill of the prod MAS database.
  - ../../optional/matrix-mas-drill
  - rustical-pilot
  - ../../optional/sparkyfitness
  # Hermes foundation is intentionally active with an empty tenant registry.
  # Tenant admission remains a separate, identity- and secret-gated change.
  - ../../optional/hermes-personal
