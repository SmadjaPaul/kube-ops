# PLT-408 : compare l'empreinte de la restauration hors Oracle a celle relevee sur OKE
# (oke-fingerprint.expected, relevee le 22/11/2026 apres seed B, WAL archive). Le Job reussit
# seulement si chaque ligne est identique ; sinon il affiche le diff et echoue.
apiVersion: batch/v1
kind: Job
metadata:
  name: pg-shared-drill-verify
  namespace: pg-shared-oke-drill
spec:
  backoffLimit: 12
  template:
    spec:
      restartPolicy: Never
      hostNetwork: false
      hostPID: false
      hostIPC: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        fsGroup: 26
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: verify
          image: ghcr.io/cloudnative-pg/postgresql:17.7-standard-trixie@sha256:e079dae5253fa6ed26fc65fda06d515af764dbec392dd4b46b17ab11eebd8131
          command:
            - sh
            - -c
            - |
              set -eu
              psql -v ON_ERROR_STOP=1 -f /sql/fingerprint.sql | grep = > /tmp/actual.txt
              if diff /expected/oke-fingerprint.expected /tmp/actual.txt; then
                echo FINGERPRINT_IDENTICAL
              else
                echo FINGERPRINT_DIFFERS
                exit 1
              fi
          env:
            - {name: PGHOST, value: pg-shared-offsite-rw}
            - {name: PGDATABASE, value: backup_drill}
            - {name: PGSSLMODE, value: verify-full}
            - {name: PGSSLROOTCERT, value: /ca/ca.crt}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: pg-shared-offsite-app, key: username}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: pg-shared-offsite-app, key: password}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: sql, mountPath: /sql}
            - {name: expected, mountPath: /expected}
            - {name: ca, mountPath: /ca}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: sql
          configMap: {name: pg-shared-drill-sql}
        - name: expected
          configMap: {name: pg-shared-drill-expected}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
        - name: ca
          secret:
            secretName: pg-shared-offsite-ca
            items: [{key: ca.crt, path: ca.crt}]
