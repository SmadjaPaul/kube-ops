apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-mas-oidc
  namespace: matrix
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target:
    name: matrix-mas-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        authentik.yaml: |
          # MAS upstream OIDC provider. The provider id is deliberately a
          # stable ULID because MAS uses it in the callback URL.
          upstream_oauth2:
            providers:
              - id: 01HFRQFT5QFMJFGF01P7JAV2ME
                human_name: Authentik
                issuer: "https://auth.smadja.dev/application/o/matrix-mas/"
                client_id: {{ .client_id | quote }}
                client_secret: {{ .client_secret | quote }}
                token_endpoint_auth_method: client_secret_basic
                scope: "openid profile email"
                claims_imports:
                  localpart:
                    action: require
                    template: '{{ "{{ user.preferred_username }}" }}'
                  displayname:
                    action: suggest
                    template: '{{ "{{ user.name }}" }}'
                  email:
                    action: suggest
                    template: '{{ "{{ user.email }}" }}'
  data:
    - secretKey: client_id
      remoteRef: {key: APP_MATRIX_MAS_AUTHENTIK_OIDC_CLIENT_ID}
    - secretKey: client_secret
      remoteRef: {key: APP_MATRIX_MAS_AUTHENTIK_OIDC_CLIENT_SECRET}
