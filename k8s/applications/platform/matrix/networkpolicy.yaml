apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: matrix-workloads
  namespace: matrix
  labels: {policy-type: platform}
spec:
  description: "Bound Matrix ingress, intra-stack traffic, DNS, separate CNPG databases and Authentik OIDC/federation egress."
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: matrix
      app.kubernetes.io/part-of: matrix-stack
  ingress:
    - fromEntities: [host, remote-node, ingress]
      toPorts:
        - ports:
            - {port: "80", protocol: TCP}
            - {port: "8008", protocol: TCP}
            - {port: "8010", protocol: TCP}
            - {port: "8080", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: matrix
      toPorts:
        - ports:
            - {port: "80", protocol: TCP}
            - {port: "8008", protocol: TCP}
            - {port: "8010", protocol: TCP}
            - {port: "8080", protocol: TCP}
            - {port: "8081", protocol: TCP}
            - {port: "8405", protocol: TCP}
            - {port: "9001", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - {port: "8081", protocol: TCP}
            - {port: "8405", protocol: TCP}
            - {port: "9001", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: mastra-factory
            app.kubernetes.io/name: mastra-factory
      toPorts:
        - ports:
            - {port: "8008", protocol: TCP}
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: matrix
      toPorts:
        - ports:
            - {port: "80", protocol: TCP}
            - {port: "8008", protocol: TCP}
            - {port: "8010", protocol: TCP}
            - {port: "8080", protocol: TCP}
            - {port: "8081", protocol: TCP}
            - {port: "8405", protocol: TCP}
            - {port: "9001", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: matrix
            cnpg.io/cluster: matrix-synapse-postgresql
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: matrix
            cnpg.io/cluster: matrix-mas-postgresql
      toPorts:
        - ports:
            - {port: "5432", protocol: TCP}
    - toFQDNs:
        - {matchName: auth.smadja.dev}
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
    - toCIDRSet:
        - cidr: 0.0.0.0/0
          except:
            - 0.0.0.0/8
            - 10.0.0.0/8
            - 100.64.0.0/10
            - 127.0.0.0/8
            - 169.254.0.0/16
            - 172.16.0.0/12
            - 192.0.0.0/24
            - 192.0.2.0/24
            - 192.168.0.0/16
            - 198.18.0.0/15
            - 198.51.100.0/24
            - 203.0.113.0/24
            - 224.0.0.0/4
            - 240.0.0.0/4
        - cidr: ::/0
          except:
            - ::/128
            - ::1/128
            - ::ffff:0:0/96
            - 2001:db8::/32
            - fc00::/7
            - fe80::/10
            - ff00::/8
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "8448", protocol: TCP}
