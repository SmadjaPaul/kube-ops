apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: matrix-synapse-hetzner-store
  namespace: matrix
  annotations:
    argocd.argoproj.io/sync-wave: "-11"
spec:
  retentionPolicy: "14d"
  instanceSidecarConfiguration:
    # PLT-247 (prep before the R2 cutover, lesson of the romm 4 min outage):
    # the sidecar environment is fixed when the pod starts, so during the
    # cutover the old pod archives its last WAL to R2 with THIS environment.
    # It must therefore already carry what R2 needs: its endpoint (read from
    # the R2 Secret, account id kept out of this public repository), a region
    # R2 accepts (us-east-1; fsn1 is rejected with InvalidRegionName) and
    # boto3 checksums on when_required. The explicit endpointURL below keeps
    # Hetzner as the target of this store.
    env:
      - name: AWS_DEFAULT_REGION
        value: us-east-1
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
      - name: AWS_ENDPOINT_URL_S3
        valueFrom:
          secretKeyRef:
            name: matrix-synapse-cnpg-r2-credentials
            key: AWS_ENDPOINT_URL_S3
  configuration:
    destinationPath: s3://smadja-dev-homelab-backups/cnpg/matrix-synapse
    endpointURL: https://fsn1.your-objectstorage.com
    s3Credentials:
      accessKeyId: {name: cnpg-hetzner-credentials, key: AWS_ACCESS_KEY_ID}
      secretAccessKey: {name: cnpg-hetzner-credentials, key: AWS_SECRET_ACCESS_KEY}
    wal: {compression: gzip, maxParallel: 2}
    data: {compression: gzip}
---
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: matrix-mas-clean-hetzner-store
  namespace: matrix
  annotations:
    argocd.argoproj.io/sync-wave: "-11"
spec:
  retentionPolicy: "14d"
  instanceSidecarConfiguration:
    env:
      - name: AWS_DEFAULT_REGION
        value: fsn1
  configuration:
    destinationPath: s3://smadja-dev-homelab-backups/cnpg/matrix-mas-clean
    endpointURL: https://fsn1.your-objectstorage.com
    s3Credentials:
      accessKeyId: {name: cnpg-hetzner-credentials, key: AWS_ACCESS_KEY_ID}
      secretAccessKey: {name: cnpg-hetzner-credentials, key: AWS_SECRET_ACCESS_KEY}
    wal: {compression: gzip, maxParallel: 2}
    data: {compression: gzip}
