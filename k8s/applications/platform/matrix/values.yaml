serverName: smadja.dev

storage:
  storageClassName: longhorn-bulk
  resourcePolicy: keep

ingress:
  tlsEnabled: true
  tlsSecret: cert-smadja

matrixRTC:
  enabled: false

elementAdmin:
  enabled: false

elementWeb:
  enabled: true
  # PLT-280: request seule (p95 14 j 0,08m, max 1,7m) ; limite mémoire du chart conservée.
  resources:
    requests:
      cpu: 25m
  ingress:
    host: chat.smadja.dev
    tlsSecret: cert-smadja

hookshot:
  enabled: false

postgres:
  enabled: false

# PLT-280: requests CPU seules, 14 j de mesures (p95 / max) : haproxy 0,7m / 2,4m.
haproxy:
  resources:
    requests:
      cpu: 50m

synapse:
  # PLT-280: request seule (p95 4,8m, max 21,7m) ; limite mémoire du chart conservée.
  resources:
    requests:
      cpu: 50m
  ingress:
    host: matrix.smadja.dev
    tlsSecret: cert-smadja
  postgres:
    host: matrix-synapse-postgresql-fast-rw.matrix.svc.cluster.local
    port: 5432
    user: synapse
    database: synapse
    sslMode: prefer
    password:
      secret: matrix-synapse-postgresql-fast-app
      secretKey: password
  media:
    storage:
      existingClaim: matrix-synapse-media-fast

matrixAuthenticationService:
  # PLT-280: request seule (p95 1,3m, max 3,0m) ; limite mémoire du chart conservée.
  resources:
    requests:
      cpu: 25m
  ingress:
    host: account.smadja.dev
    tlsSecret: cert-smadja
  postgres:
    host: matrix-mas-postgresql-fast-rw.matrix.svc.cluster.local
    port: 5432
    user: mas
    database: mas
    sslMode: prefer
    password:
      secret: matrix-mas-postgresql-fast-app
      secretKey: password
  additional:
    authentik:
      configSecret: matrix-mas-oidc
      configSecretKey: authentik.yaml
    migration-passwords:
      config: |
        passwords:
          enabled: true
          schemes:
            - version: 1
              algorithm: bcrypt
              unicode_normalization: true
            - version: 2
              algorithm: argon2id

wellKnownDelegation:
  enabled: true
  ingress:
    tlsSecret: cert-smadja
  baseDomainRedirect:
    enabled: false
