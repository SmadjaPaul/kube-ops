# PLT-248: fresh Hetzner base backup taken before the R2 cutover of
# matrix-mas-postgresql-clean. It is the rollback point: after the cutover,
# Hetzner stays restorable up to the last WAL segment archived to Hetzner
# before the switch (this base plus that WAL), not exactly up to the switch:
# the old pod may archive its final WAL to R2 during the cutover (see the
# Hetzner ObjectStore sidecar comment), so commits after that point need the
# R2 WAL too. A rollback targets this backupID or a precise time no later
# than that last Hetzner WAL, never "latest".
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: matrix-mas-postgresql-clean-hetzner-precutover-20261114
  namespace: matrix
  labels:
    backup.smadja.dev/purpose: r2-cutover-rollback
spec:
  cluster:
    name: matrix-mas-postgresql-clean
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: matrix-mas-clean-hetzner-store
