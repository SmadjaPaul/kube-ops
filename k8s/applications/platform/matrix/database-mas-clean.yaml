apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: matrix-mas-postgresql-clean
  namespace: matrix
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    backup.smadja.dev/cnpg-cluster: matrix-mas-postgresql-clean
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7
  bootstrap:
    initdb:
      database: mas
      owner: mas
      encoding: UTF8
      locale: C
      localeCType: C
      localeCollate: C
  # PLT-145: temporary read-only role for the user-count control Job
  # (mas-user-count-check.yaml). SELECT only via pg_read_all_data. Removed by
  # PR (ensure: absent) right after the measurement.
  managed:
    roles:
      - name: mas_count_ro
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        inherit: true
        connectionLimit: 2
        inRoles:
          - pg_read_all_data
        passwordSecret:
          name: matrix-mas-count-ro
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: matrix-mas-clean-hetzner-store
  storage:
    size: 10Gi
    storageClass: longhorn-bulk
  walStorage:
    size: 5Gi
    storageClass: longhorn-bulk
    resizeInUseVolumes: true
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  affinity:
    enablePodAntiAffinity: false
