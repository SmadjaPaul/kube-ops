apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: matrix-mas-postgresql-clean
  namespace: matrix
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    backup.smadja.dev/cnpg-cluster: matrix-mas-postgresql-clean
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7
  bootstrap:
    initdb:
      database: mas
      owner: mas
      encoding: UTF8
      locale: C
      localeCType: C
      localeCollate: C
  # PLT-248: a Cluster has a single WAL archiver; the archive moved from
  # matrix-mas-clean-hetzner-store to matrix-mas-clean-r2-store
  # (database-mas-clean-r2.yaml). Rollback of the archive destination only
  # (healthy database, R2 archiving failing): point barmanObjectName back to
  # matrix-mas-clean-hetzner-store (and the ScheduledBackup in
  # database-scheduled-backups.yaml with it) and take a new base backup there;
  # do NOT restore, nothing is lost. Hetzner base 20261114T122314 (backupID,
  # never "latest") is reserved for database recovery (homelab-infra
  # docs/operations/r2-migration.md); writes made after the cutover only have
  # their WAL on R2, so such a recovery needs the R2 WAL too.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: matrix-mas-clean-r2-store
  storage:
    size: 10Gi
    storageClass: longhorn-bulk
  walStorage:
    size: 5Gi
    storageClass: longhorn-bulk
    resizeInUseVolumes: true
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  affinity:
    enablePodAntiAffinity: false
