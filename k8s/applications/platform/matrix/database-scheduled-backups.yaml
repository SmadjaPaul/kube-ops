apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: matrix-synapse-postgresql-fast-weekly
  namespace: matrix
spec:
  schedule: "0 30 3 * * 0"
  backupOwnerReference: self
  cluster: {name: matrix-synapse-postgresql-fast}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      # PLT-247: base backups follow the WAL archive to R2.
      barmanObjectName: matrix-synapse-r2-store
---
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: matrix-mas-postgresql-fast-weekly
  namespace: matrix
spec:
  schedule: "0 0 4 * * 0"
  backupOwnerReference: self
  cluster: {name: matrix-mas-postgresql-fast}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      # PLT-248: base backups follow the WAL archive to R2.
      barmanObjectName: matrix-mas-clean-r2-store
