# PLT-248: first base backup of matrix-mas-postgresql-clean on R2, right after
# the WAL archive switch (cutover 2026-11-14 12:32Z, #1420). Closes the window
# without an R2 recovery point.
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: matrix-mas-postgresql-clean-r2-initial-20261114
  namespace: matrix
  labels:
    backup.smadja.dev/purpose: r2-cutover
spec:
  cluster:
    name: matrix-mas-postgresql-clean
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: matrix-mas-clean-r2-store
