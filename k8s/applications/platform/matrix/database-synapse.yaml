apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: matrix-synapse-postgresql
  namespace: matrix
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    backup.smadja.dev/cnpg-cluster: matrix-synapse-postgresql
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7
  bootstrap:
    initdb:
      database: synapse
      owner: synapse
      encoding: UTF8
      locale: C
      localeCType: C
      localeCollate: C
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: matrix-synapse-hetzner-store
  storage:
    size: 20Gi
    storageClass: longhorn-bulk
  walStorage:
    size: 5Gi
    storageClass: longhorn-bulk
    resizeInUseVolumes: true
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  affinity:
    enablePodAntiAffinity: false
