apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: matrix-synapse-postgresql-fast
  namespace: matrix
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    backup.smadja.dev/cnpg-cluster: matrix-synapse-postgresql-fast
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7
  bootstrap:
    initdb:
      database: synapse
      owner: synapse
      encoding: UTF8
      locale: C
      localeCType: C
      localeCollate: C
  postgresql:
    parameters:
      # PLT-344 lot 0, décision Paul 2026-11-15 (Matrix protégée, service non utilisé) : 288 segments WAL
      # forcés/jour par archive_timeout 5min (~4,6 Go/j sur le HDD) -> 96 (RPO R2 15 min).
      # Rechargement à chaud, aucun redémarrage.
      checkpoint_timeout: "15min"
      max_wal_size: "2GB"
      wal_compression: "lz4"
      archive_timeout: "15min"
  # PLT-247: a Cluster has a single WAL archiver (R2 store, database-synapse-r2.yaml).
  # PLT-145/344: clean install on longhorn-fast (Paul, 2026-11-15: no user, nothing to
  # keep). New name = new Barman serverName, so the old R2 prefix is never reused.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: matrix-synapse-r2-store
  storage:
    size: 10Gi
    storageClass: longhorn-fast
  walStorage:
    size: 5Gi
    storageClass: longhorn-fast
    resizeInUseVolumes: true
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  affinity:
    enablePodAntiAffinity: false
