# PLT-145: compare the production MAS user count with the PLT-202 restore
# (users=0). Read-only by construction: dedicated role mas_count_ro with
# pg_read_all_data only (no write grant), read-only transaction, counts only
# (no row content). Removed by PR right after the measurement.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: matrix-mas-count-ro
  namespace: matrix
  annotations:
    argocd.argoproj.io/sync-wave: "-12"
spec:
  length: 48
  digits: 10
  symbols: 8
  symbolCharacters: "-_@"
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-mas-count-ro
  namespace: matrix
  annotations:
    argocd.argoproj.io/sync-wave: "-11"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: matrix-mas-count-ro
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: mas_count_ro
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: matrix-mas-count-ro
---
apiVersion: batch/v1
kind: Job
metadata:
  name: matrix-mas-user-count-check
  namespace: matrix
  labels:
    app.kubernetes.io/name: matrix-mas-user-count-check
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix-mas-user-count-check
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        fsGroup: 26
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: check
          image: ghcr.io/cloudnative-pg/postgresql:17.7
          env:
            - name: PGHOST
              value: matrix-mas-postgresql-clean-rw.matrix.svc.cluster.local
            - name: PGDATABASE
              value: mas
            - name: PGSSLMODE
              value: require
            - name: PGUSER
              valueFrom:
                secretKeyRef: {name: matrix-mas-count-ro, key: username}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: matrix-mas-count-ro, key: password}
            - name: PGOPTIONS
              value: "-c default_transaction_read_only=on"
          command: ["/bin/bash", "-ec"]
          args:
            - |
              psql -v ON_ERROR_STOP=1 -At <<'SQL'
              SELECT 'role=' || current_user || ' tx_read_only=' || current_setting('transaction_read_only');
              SELECT 'can_insert_any_public_table=' || bool_or(has_table_privilege(c.oid, 'INSERT'))
                FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE n.nspname = 'public' AND c.relkind = 'r';
              SELECT 'in_recovery=' || pg_is_in_recovery() || ' walfile=' || pg_walfile_name(pg_current_wal_lsn());
              SELECT 'public_tables=' || count(*) FROM pg_tables WHERE schemaname = 'public';
              SELECT 'user_tables=' || coalesce(string_agg(tablename, ',' ORDER BY tablename), '') FROM pg_tables
                WHERE schemaname = 'public' AND tablename ~ '(^|_)users?($|_)';
              SELECT 'max_migration=' || coalesce(max(version)::text, 'null') FROM public._sqlx_migrations;
              SELECT format('SELECT %L || count(*) FROM public.%I', 'count.' || tablename || '=', tablename)
                FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename \gexec
              SQL
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
