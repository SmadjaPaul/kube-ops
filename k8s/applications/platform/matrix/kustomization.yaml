apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: matrix

resources:
  - namespace.yaml
  - database-synapse.yaml
  - database-mas.yaml
  - database-synapse-r2.yaml
  - database-mas-r2.yaml
  - database-scheduled-backups.yaml
  - media-pvc.yaml
  - externalsecret.yaml
  - httproutes.yaml
  - networkpolicy.yaml
  - database-r2-initial-backup.yaml

helmCharts:
  - name: matrix-stack
    repo: oci://ghcr.io/element-hq/ess-helm
    version: 26.10.2
    releaseName: matrix
    namespace: matrix
    includeCRDs: false
    valuesFile: values.yaml

# The cluster uses Cilium Gateway API, while ESS Community emits Ingress
# objects. Keep the chart's service/workload graph and replace only its edge
# objects with the explicit HTTPRoutes above.
patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: matrix-element-web
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: matrix-element-web
      $patch: delete
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: matrix-matrix-authentication-service
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: matrix-matrix-authentication-service
      $patch: delete
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: matrix-synapse
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: matrix-synapse
      $patch: delete
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: matrix-well-known
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: matrix-well-known
      $patch: delete
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: matrix-matrix-authentication-service
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value:
          secret.reloader.stakater.com/reload: matrix-mas-oidc,matrix-mas-postgresql-fast-app
  - target:
      group: batch
      version: v1
      kind: Job
      name: matrix-synapse-check-config
    patch: |-
      - op: remove
        path: /metadata/annotations/helm.sh~1hook
      - op: remove
        path: /metadata/annotations/helm.sh~1hook-weight
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1hook
        value: Sync
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1hook-delete-policy
        value: BeforeHookCreation,HookSucceeded
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "10"

# Images epinglees par digest (PLT-392) : le transformateur images s'applique aussi a la sortie
# du chart Helm. Tags = ceux du chart 26.10.2 ; Renovate met a jour newTag et digest.
images:
  - name: docker.io/library/haproxy
    newTag: 3.4.7-alpine
    digest: sha256:b9fe316f718d5015c5cfebd8ca019591f3e44656f61d93cb8b59a1028961e530
  - name: ghcr.io/element-hq/ess-helm/matrix-tools
    newTag: 0.10.4
    digest: sha256:81ddb47cacd613f169acc9009244eebb36fc01dd8cfca25e9222388b4d157601
  - name: oci.element.io/element-web
    newTag: v1.12.32
    digest: sha256:f8700633d4336258af7a05b53865a4f479e0d628cf2d9ca83d28b5939314d4ce
  - name: oci.element.io/matrix-authentication-service
    newTag: 1.27.0
    digest: sha256:085e37263957b3b79be85de9cfda1980b97e9653f284fba0c902445e06c200b8
  - name: oci.element.io/synapse
    newTag: v1.163.0
    digest: sha256:e98ab72138d90fa8b8876c6421fe78a9fdb181c0d7cc690ad740e5173e0c65e6
