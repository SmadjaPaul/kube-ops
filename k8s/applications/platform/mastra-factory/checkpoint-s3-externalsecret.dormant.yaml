# Activated by the PLT-109/PLT-24 qualification PR using the existing shared
# Hetzner credentials. IAM isolation is intentionally not claimed:
# IAM_ISOLATION=RUNTIME_FAIL — RISK_ACCEPTED_V1. The object prefix remains an
# application namespace, not an IAM boundary. Revert this resource from the
# Kustomization to disable checkpoint capture without exposing secret values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mastra-factory-checkpoint-s3
  namespace: mastra-factory
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: mastra-factory-checkpoint-s3, creationPolicy: Owner}
  data:
    - secretKey: FACTORY_CHECKPOINT_S3_ENDPOINT
      remoteRef: {key: FACTORY_CHECKPOINT_S3_ENDPOINT}
    - secretKey: FACTORY_CHECKPOINT_S3_REGION
      remoteRef: {key: FACTORY_CHECKPOINT_S3_REGION}
    - secretKey: FACTORY_CHECKPOINT_S3_BUCKET
      remoteRef: {key: FACTORY_CHECKPOINT_S3_BUCKET}
    - secretKey: FACTORY_CHECKPOINT_S3_PREFIX
      remoteRef: {key: FACTORY_CHECKPOINT_S3_PREFIX}
    - secretKey: FACTORY_CHECKPOINT_S3_ACCESS_KEY_ID
      remoteRef: {key: HETZNER_S3_ACCESS_KEY_ID}
    - secretKey: FACTORY_CHECKPOINT_S3_SECRET_ACCESS_KEY
      remoteRef: {key: HETZNER_S3_SECRET_ACCESS_KEY}
    - secretKey: FACTORY_CHECKPOINT_INTERVAL_SECONDS
      remoteRef: {key: FACTORY_CHECKPOINT_INTERVAL_SECONDS}
