apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mastra-factory
  namespace: mastra-factory
  labels: {policy-type: platform-audit}
spec:
  description: "Internal ingress and bounded backend access; Research may fetch public HTTPS only after its application-level SSRF and redirect checks."
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: mastra-factory}
  ingress:
    - fromEntities: [host, remote-node, ingress]
      toPorts:
        - ports:
            - {port: "4111", protocol: TCP}
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: mastra-sandbox
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
            - {port: "9090", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: mastra-factory
            cnpg.io/cluster: mastra-factory-postgresql
      toPorts:
        - ports:
            - {port: "5432", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentgateway
            app: agentgateway
      toPorts:
        - ports:
            - {port: "4000", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: searxng
            app.kubernetes.io/name: searxng
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: alloy
      toPorts:
        - ports:
            - {port: "4318", protocol: TCP}
    - toFQDNs:
        - {matchName: api.github.com}
        - {matchName: github.com}
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
    # Better Auth performs OIDC discovery and the authorization-code token
    # exchange against the canonical HTTPS issuer. Preserve the host-scoped
    # policy for auth.smadja.dev:443.
    - toFQDNs:
        - {matchName: auth.smadja.dev}
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
    # Cilium Gateway API can enforce client egress on the selected HTTPRoute
    # backend identity and *Pod port*, even though the request targets the
    # HTTPS Gateway (https://github.com/cilium/cilium/issues/47617).
    # Authentik chart 2026.8.3: Service authentik-server:80 -> server Pod:9000.
    # Select only the Authentik server Pods; not the worker or whole namespace.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: auth
            app.kubernetes.io/name: authentik
            app.kubernetes.io/instance: authentik
            app.kubernetes.io/component: server
      toPorts:
        - ports:
            - {port: "9000", protocol: TCP}
    # Research page fetches are restricted to public HTTPS destinations here.
    # The application independently rejects private/reserved DNS answers,
    # literal private addresses and unsafe redirects; this rule does not grant
    # access to cluster, node, RFC1918, link-local or other reserved ranges.
    - toCIDRSet:
        - cidr: 0.0.0.0/0
          except:
            - 0.0.0.0/8
            - 10.0.0.0/8
            - 100.64.0.0/10
            - 127.0.0.0/8
            - 169.254.0.0/16
            - 172.16.0.0/12
            - 192.0.0.0/24
            - 192.0.2.0/24
            - 192.168.0.0/16
            - 198.18.0.0/15
            - 198.51.100.0/24
            - 203.0.113.0/24
            - 224.0.0.0/4
            - 240.0.0.0/4
        - cidr: ::/0
          except:
            - ::/128
            - ::1/128
            - ::ffff:0:0/96
            - 2001:db8::/32
            - fc00::/7
            - fe80::/10
            - ff00::/8
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
