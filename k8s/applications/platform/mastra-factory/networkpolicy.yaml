apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mastra-factory
  namespace: mastra-factory
  labels: {policy-type: platform-audit}
spec:
  description: "Internal ingress and destination-scoped backend access for Factory runtime and historical S3 checkpoints."
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: mastra-factory}
  ingress:
    - fromEntities: [host, remote-node, ingress]
      toPorts:
        - ports:
            - {port: "4111", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: arc-runners
            k8s:actions.github.com/scale-set-name: homelab-iac-pilot-arc
      toPorts:
        - ports:
            - {port: "4111", protocol: TCP}
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: mastra-sandbox
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
            - {port: "9090", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: mastra-factory
            cnpg.io/cluster: mastra-factory-postgresql
      toPorts:
        - ports:
            - {port: "5432", protocol: TCP}
    # Factory's reviewed Matrix adapter sends only to the ESS Synapse client
    # API service; inbound commands and federation remain out of scope.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: matrix
            app.kubernetes.io/name: haproxy
            app.kubernetes.io/part-of: matrix-stack
      toPorts:
        - ports:
            - {port: "8008", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentgateway
            app: agentgateway
      toPorts:
        - ports:
            - {port: "4000", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: alloy
      toPorts:
        - ports:
            - {port: "4318", protocol: TCP}
    # Native GitHub and Linear APIs: retain exact HTTPS egress after
    # removing Research's broad public-HTTPS destination rule.
    - toFQDNs:
        - {matchName: api.github.com}
        - {matchName: github.com}
        - {matchName: api.linear.app}
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
    # Better Auth performs OIDC discovery and the authorization-code token
    # exchange against the canonical HTTPS issuer. Preserve the host-scoped
    # policy for auth.smadja.dev:443.
    - toFQDNs:
        - {matchName: auth.smadja.dev}
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
    # Cilium Gateway API can enforce client egress on the selected HTTPRoute
    # backend identity and *Pod port*, even though the request targets the
    # HTTPS Gateway (https://github.com/cilium/cilium/issues/47617).
    # Authentik chart 2026.8.3: Service authentik-server:80 -> server Pod:9000.
    # Select only the Authentik server Pods; not the worker or whole namespace.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: auth
            app.kubernetes.io/name: authentik
            app.kubernetes.io/instance: authentik
            app.kubernetes.io/component: server
      toPorts:
        - ports:
            - {port: "9000", protocol: TCP}
    # Retained only for checkpoint objects in the existing S3-compatible store.
    - toFQDNs:
        - {matchName: fsn1.your-objectstorage.com}
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
