apiVersion: apps/v1
kind: Deployment
metadata:
  name: mastra-factory
  namespace: mastra-factory
  labels: {app.kubernetes.io/name: mastra-factory, app.kubernetes.io/part-of: platform}
  annotations:
    factory-platform.dev/source-sha: faa07b66b2e1ee37534967c46f8306b3d87474ea
spec:
  replicas: 1 # Keep one dispatcher until cross-replica sandbox claim locking is qualified.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: mastra-factory}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mastra-factory}
      annotations:
        secret.reloader.stakater.com/reload: mastra-factory-runtime,mastra-factory-authentik-oidc,mastra-factory-linear-oauth,mastra-factory-matrix,mastra-factory-checkpoint-s3
    spec:
      serviceAccountName: mastra-factory
      automountServiceAccountToken: true # Restricted namespace RoleBinding, not cluster-admin
      imagePullSecrets:
        - name: mastra-factory-ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: factory
          # Rollback digest: sha256:e7482fde895bc19218031e6275ec538e954c65a2da2bb1ddd69988c5347a8cc5
          image: ghcr.io/smadjapaul/mastra-factory@sha256:7d98ff1784dd45706305e5d31eb7cfb482964ed195a8c7228623f5680e7bd107
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4111
          env:
            - {name: NODE_ENV, value: production}
            # Keep long tool-heavy reviewer sessions below the default V8
            # heap ceiling while leaving headroom under the 2Gi container cap.
            - {name: NODE_OPTIONS, value: "--max-old-space-size=1536"}
            - {name: PORT, value: "4111"}
            - {name: FACTORY_SANDBOX_PROVIDER, value: kubernetes}
            - {name: FACTORY_KUBERNETES_NAMESPACE, value: mastra-sandbox}
            - {name: FACTORY_KUBERNETES_WARMPOOL, value: mastra-code}
            - {name: FACTORY_KUBERNETES_WORKSPACE_ROOT, value: /workspace}
            - {name: FACTORY_KUBERNETES_TTL_SECONDS, value: "7200"}
            - {name: MASTRACODE_PUBLIC_URL, value: "https://factory.smadja.dev"}
            # PLT-126 canary ended; new autonomous admission is disabled. Delivery remains enabled.
            - {name: MASTRACODE_AUTONOMOUS_DELIVERY_ENABLED, value: "1"}
            - {name: MASTRACODE_AUTONOMOUS_ENABLED, value: "0"}
            - {name: MASTRACODE_AUTONOMOUS_READY_LABEL, value: "factory-canary-v1-e2e-2026-11-04-ready"}
            - {name: MASTRACODE_AUTONOMOUS_DEPENDENCIES_READY_LABEL, value: "factory-canary-v1-e2e-2026-11-04-dependencies-ready"}
            - {name: MASTRACODE_AUTONOMOUS_QUALIFIED, value: "1"}
            - {name: MASTRACODE_AUTONOMOUS_MAX_IN_FLIGHT, value: "1"}
            - {name: MASTRACODE_AUTONOMOUS_MAX_ATTEMPTS, value: "1"}
            - {name: MASTRACODE_AUTONOMOUS_MAX_TOKENS, value: "50000"}
            - {name: MASTRACODE_AUTONOMOUS_MAX_COST_USD, value: "1"}
            - {name: FACTORY_AUTHENTIK_OIDC_DISCOVERY_URL, value: "https://auth.smadja.dev/application/o/factory/.well-known/openid-configuration"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://alloy.monitoring.svc.cluster.local:4318"}
            - {name: OTEL_SERVICE_NAME, value: "mastra-factory"}
            - {name: DEPLOYMENT_ENVIRONMENT, value: "production"}
            # Factory's outbound Matrix adapter is enabled only after the
            # bot, private room and authenticated API smoke have passed.
            - {name: MASTRACODE_MATRIX_NOTIFICATIONS_ENABLED, value: "1"}
            - {name: MATRIX_HOMESERVER_URL, value: "http://matrix-synapse.matrix.svc.cluster.local:8008"}
            - {name: MATRIX_BOT_USER_ID, value: "@factory-notifier:smadja.dev"}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: mastra-factory-postgresql-app, key: uri}
            - name: MASTRACODE_REVIEW_ONLY_ENABLED
              value: "0"
          envFrom:
            - secretRef: {name: mastra-factory-runtime}
            # Optional until the separate OIDC client credential is provisioned.
            # Missing optional Secret cannot break today's Factory login.
            - secretRef: {name: mastra-factory-authentik-oidc, optional: true}
            # Native LinearIntegration reads this optional, paired OAuth credential Secret.
            # Provision via Doppler/ESO only after the actual OAuth app exists.
            - secretRef: {name: mastra-factory-linear-oauth, optional: true}
            # Required by the enabled Matrix adapter; ESO must reconcile this
            # Secret before the workload can start.
            - secretRef: {name: mastra-factory-matrix}
            # Dormant until the shared-bucket policy and all Doppler keys
            # exist. Factory's own config parser remains all-or-none.
            - secretRef: {name: mastra-factory-checkpoint-s3, optional: true}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: cache, mountPath: /home/node/.cache}
            - {name: config, mountPath: /home/node/.config}
            - {name: local, mountPath: /home/node/.local}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
        - name: cache
          emptyDir: {sizeLimit: 512Mi}
        - name: config
          emptyDir: {sizeLimit: 32Mi}
        - name: local
          emptyDir: {sizeLimit: 128Mi}
