# The deployment references this generated Secret optionally so existing
# login remains available while External Secrets reconciles it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mastra-factory-authentik-oidc
  namespace: mastra-factory
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: mastra-factory-authentik-oidc, creationPolicy: Owner}
  data:
    - secretKey: FACTORY_AUTHENTIK_OIDC_CLIENT_ID
      remoteRef: {key: APP_MASTRA_FACTORY_AUTHENTIK_OIDC_CLIENT_ID}
    - secretKey: FACTORY_AUTHENTIK_OIDC_CLIENT_SECRET
      remoteRef: {key: APP_MASTRA_FACTORY_AUTHENTIK_OIDC_CLIENT_SECRET}
