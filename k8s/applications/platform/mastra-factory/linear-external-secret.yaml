# Native @mastra/factory LinearIntegration OAuth client credentials.
# Values are managed in Doppler infrastructure/prd, never stored in Git.
# The Deployment consumes this Secret through its optional envFrom reference.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mastra-factory-linear-oauth
  namespace: mastra-factory
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: mastra-factory-linear-oauth
    creationPolicy: Owner
  data:
    - secretKey: LINEAR_CLIENT_ID
      remoteRef:
        key: APP_MASTRA_FACTORY_LINEAR_CLIENT_ID
    - secretKey: LINEAR_CLIENT_SECRET
      remoteRef:
        key: APP_MASTRA_FACTORY_LINEAR_CLIENT_SECRET
