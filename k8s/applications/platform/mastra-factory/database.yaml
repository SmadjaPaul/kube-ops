apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mastra-factory-postgresql
  namespace: mastra-factory
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7
  bootstrap:
    initdb:
      database: mastra
      owner: mastra
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: mastra-factory-hetzner-store
  storage:
    size: 20Gi
    storageClass: longhorn-bulk
  walStorage:
    size: 5Gi
    storageClass: longhorn-bulk
    resizeInUseVolumes: true
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  affinity:
    enablePodAntiAffinity: false
