apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mastra-factory-runtime
  namespace: mastra-factory
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: mastra-factory-runtime, creationPolicy: Owner}
  data:
    - secretKey: BETTER_AUTH_SECRET
      remoteRef: {key: APP_MASTRA_FACTORY_BETTER_AUTH_SECRET}
    - secretKey: FACTORY_CREDENTIAL_ENCRYPTION_KEY
      remoteRef: {key: APP_MASTRA_FACTORY_CREDENTIAL_ENCRYPTION_KEY}
    - secretKey: FACTORY_STATE_SECRET
      remoteRef: {key: APP_MASTRA_FACTORY_STATE_SECRET}
    - secretKey: GITHUB_APP_ID
      remoteRef: {key: APP_MASTRA_FACTORY_GITHUB_APP_ID}
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef: {key: APP_MASTRA_FACTORY_GITHUB_APP_PRIVATE_KEY}
    - secretKey: GITHUB_APP_CLIENT_ID
      remoteRef: {key: APP_MASTRA_FACTORY_GITHUB_APP_CLIENT_ID}
    - secretKey: GITHUB_APP_CLIENT_SECRET
      remoteRef: {key: APP_MASTRA_FACTORY_GITHUB_APP_CLIENT_SECRET}
    - secretKey: GITHUB_APP_SLUG
      remoteRef: {key: APP_MASTRA_FACTORY_GITHUB_APP_SLUG}
    - secretKey: GITHUB_APP_WEBHOOK_SECRET
      remoteRef: {key: APP_MASTRA_FACTORY_GITHUB_APP_WEBHOOK_SECRET}
