# Dormant ESO resources. DO NOT add this file to either active
# kustomization until the secret exists in Doppler and is validated.
# A missing remoteRef would otherwise degrade an existing Authentik rollout.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-factory-oidc
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: authentik-blueprint-factory-oidc, creationPolicy: Owner}
  data:
    - secretKey: FACTORY_OIDC_CLIENT_SECRET
      remoteRef: {key: APP_MASTRA_FACTORY_AUTHENTIK_OIDC_CLIENT_SECRET}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mastra-factory-authentik-oidc
  namespace: mastra-factory
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: mastra-factory-authentik-oidc, creationPolicy: Owner}
  data:
    - secretKey: FACTORY_AUTHENTIK_OIDC_CLIENT_ID
      remoteRef: {key: APP_MASTRA_FACTORY_AUTHENTIK_OIDC_CLIENT_ID}
    - secretKey: FACTORY_AUTHENTIK_OIDC_CLIENT_SECRET
      remoteRef: {key: APP_MASTRA_FACTORY_AUTHENTIK_OIDC_CLIENT_SECRET}
