apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mastra-factory-ghcr
  namespace: mastra-factory
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target:
    name: mastra-factory-ghcr
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {"auths":{"ghcr.io":{"username":"SmadjaPaul","password":"{{ .token }}","auth":"{{ printf "SmadjaPaul:%s" .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef: {key: APP_FACTORY_PLATFORM_GHCR_TOKEN}
