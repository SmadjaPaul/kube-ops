apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mastra-factory-matrix
  namespace: mastra-factory
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: mastra-factory-matrix, creationPolicy: Owner}
  data:
    - secretKey: MATRIX_BOT_ACCESS_TOKEN
      remoteRef: {key: APP_MATRIX_FACTORY_BOT_ACCESS_TOKEN}
    - secretKey: MATRIX_FACTORY_OPS_ROOM_ID
      remoteRef: {key: APP_MATRIX_FACTORY_OPS_ROOM_ID}
