apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: plt71-postgres-isolated
  namespace: factory-plt71-qualification
  labels:
    app.kubernetes.io/part-of: factory-qualification
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: plt71-postgres
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEntities: [host]
      toPorts:
        - ports:
            - {port: "5432", protocol: TCP}
  egressDeny:
    - toEntities: [all]
