apiVersion: apps/v1
kind: Deployment
metadata:
  name: plt71-postgres
  namespace: factory-plt71-qualification
  labels:
    app.kubernetes.io/name: plt71-postgres
    app.kubernetes.io/part-of: factory-qualification
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: plt71-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plt71-postgres
        app.kubernetes.io/part-of: factory-qualification
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres:17.7-alpine@sha256:a6d31f853205ce20d399df4e33a0b4c715672f232f4ee7440499747e6e02c126
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/docker-entrypoint.sh"]
          args: ["postgres"]
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_USER, value: plt71_test}
            - {name: POSTGRES_DB, value: mastra}
            - {name: POSTGRES_HOST_AUTH_METHOD, value: trust}
          ports:
            - {name: postgres, containerPort: 5432, protocol: TCP}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "plt71_test", "-d", "mastra"]
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "plt71_test", "-d", "mastra"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 2Gi
        - name: run
          emptyDir:
            sizeLimit: 32Mi
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: plt71-postgres
  namespace: factory-plt71-qualification
  labels:
    app.kubernetes.io/name: plt71-postgres
    app.kubernetes.io/part-of: factory-qualification
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: plt71-postgres
  ports:
    - {name: postgres, port: 5432, targetPort: postgres, protocol: TCP}
