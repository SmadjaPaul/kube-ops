apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-connector-private
  namespace: open-connector
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: open-connector-private
    creationPolicy: Owner
  data:
    - secretKey: OOMOL_CONNECT_ADMIN_TOKEN
      remoteRef:
        key: APP_OPENCONNECTOR_ADMIN_TOKEN
    - secretKey: OOMOL_CONNECT_ENCRYPTION_KEY
      remoteRef:
        key: APP_OPENCONNECTOR_ENCRYPTION_KEY
