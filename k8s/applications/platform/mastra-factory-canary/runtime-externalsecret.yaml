apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mastra-factory-canary-runtime
  namespace: mastra-factory-canary
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: mastra-factory-canary-runtime, creationPolicy: Owner}
  data:
    - secretKey: BETTER_AUTH_SECRET
      remoteRef: {key: APP_MASTRA_FACTORY_CANARY_BETTER_AUTH_SECRET}
    - secretKey: FACTORY_CREDENTIAL_ENCRYPTION_KEY
      remoteRef: {key: APP_MASTRA_FACTORY_CANARY_CREDENTIAL_ENCRYPTION_KEY}
    - secretKey: FACTORY_STATE_SECRET
      remoteRef: {key: APP_MASTRA_FACTORY_CANARY_STATE_SECRET}
    - secretKey: FACTORY_AUTHENTIK_OIDC_CLIENT_SECRET
      remoteRef: {key: APP_MASTRA_FACTORY_CANARY_AUTHENTIK_OIDC_CLIENT_SECRET}
