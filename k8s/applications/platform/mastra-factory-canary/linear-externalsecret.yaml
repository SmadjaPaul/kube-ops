apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mastra-factory-canary-linear-oauth
  namespace: mastra-factory-canary
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: mastra-factory-canary-linear-oauth, creationPolicy: Owner}
  data:
    - secretKey: LINEAR_CLIENT_ID
      remoteRef: {key: APP_MASTRA_FACTORY_LINEAR_CLIENT_ID}
    - secretKey: LINEAR_CLIENT_SECRET
      remoteRef: {key: APP_MASTRA_FACTORY_LINEAR_CLIENT_SECRET}
