# Archive de pg-shared-homelab (ecrite par le namespace databases), lue en lecture seule.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: pg-shared-homelab-r2-ro
  namespace: pg-shared-restore-drill
spec:
  instanceSidecarConfiguration:
    env:
      - {name: AWS_REQUEST_CHECKSUM_CALCULATION, value: when_required}
      - {name: AWS_RESPONSE_CHECKSUM_VALIDATION, value: when_required}
      - {name: AWS_DEFAULT_REGION, value: auto}
      - name: AWS_ENDPOINT_URL_S3
        valueFrom:
          secretKeyRef: {name: pg-shared-restore-drill-r2-ro, key: AWS_ENDPOINT_URL_S3}
  configuration:
    destinationPath: s3://homelab-backup-cnpg/homelab/pg-shared
    s3Credentials:
      accessKeyId: {name: pg-shared-restore-drill-r2-ro, key: AWS_ACCESS_KEY_ID}
      secretAccessKey: {name: pg-shared-restore-drill-r2-ro, key: AWS_SECRET_ACCESS_KEY}
    wal: {compression: gzip}
    data: {compression: gzip}
