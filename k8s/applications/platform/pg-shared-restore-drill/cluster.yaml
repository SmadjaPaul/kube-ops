# Restauration isolee de databases/pg-shared-homelab depuis R2 (PLT-375, drill par application).
# Pas d'archiveur WAL : le drill n'ecrit rien dans R2. Jamais la base vivante.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-shared-restore
  namespace: pg-shared-restore-drill
  labels:
    backup.smadja.dev/restore-drill: "true"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie@sha256:ebf3919504d7523a63e8e2fee9b051211de714644b36469275558c624afd50ec
  bootstrap:
    recovery:
      source: pg-shared-live
      database: app
      owner: app
      # Pas de secret : CNPG genere pg-shared-restore-app pour le drill.
  externalClusters:
    - name: pg-shared-live
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: pg-shared-homelab-r2-ro
          serverName: pg-shared-homelab
  storage: {size: 10Gi, storageClass: longhorn-bulk}
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  affinity:
    enablePodAntiAffinity: false
