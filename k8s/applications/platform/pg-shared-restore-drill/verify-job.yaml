# Mesure du drill : attend la base restauree, releve l'inventaire, dump d'UNE base (app) avec
# duree, puis relecture du dump par pg_restore --list. Sortie dans les logs, lignes DRILL_*.
apiVersion: batch/v1
kind: Job
metadata:
  name: pg-shared-restore-verify
  namespace: pg-shared-restore-drill
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 2700
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: verify
          image: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie@sha256:ebf3919504d7523a63e8e2fee9b051211de714644b36469275558c624afd50ec
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          env:
            - {name: PGHOST, value: pg-shared-restore-rw}
            - {name: PGDATABASE, value: app}
            - {name: PGSSLMODE, value: require}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: pg-shared-restore-app, key: username}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: pg-shared-restore-app, key: password}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          command: [bash, -c]
          args:
            - |
              set -u
              t0=$(date +%s)
              until pg_isready -q; do
                [ $(( $(date +%s) - t0 )) -lt 2400 ] || { echo "DRILL_STATUS=FAIL reason=not_ready"; exit 1; }
                sleep 5
              done
              echo "DRILL_READY_AFTER_JOB_START_S=$(( $(date +%s) - t0 ))"
              psql -Atc "select 'DRILL_PG_VERSION='||current_setting('server_version')"
              psql -Atc "select 'DRILL_LAST_XACT_REPLAYED_UTC='||coalesce(pg_last_xact_replay_timestamp()::text,'n/a')"
              psql -Atc "select 'DRILL_NOW_UTC='||now()::text"
              psql -Atc "select 'DRILL_DATABASE='||datname||' size='||pg_database_size(datname) from pg_database where not datistemplate order by 1"
              psql -Atc "select 'DRILL_TABLE='||schemaname||'.'||relname||' rows='||n_live_tup from pg_stat_user_tables order by 1"
              s=$(date +%s)
              pg_dump -Fc -f /tmp/app.dump app
              e=$(date +%s)
              echo "DRILL_DUMP_APP_S=$((e - s)) DRILL_DUMP_BYTES=$(stat -c %s /tmp/app.dump)"
              echo "DRILL_RESTORE_LIST_ENTRIES=$(pg_restore --list /tmp/app.dump | grep -vc '^;')"
              echo "DRILL_STATUS=PASS"
      volumes:
        - {name: tmp, emptyDir: {}}
