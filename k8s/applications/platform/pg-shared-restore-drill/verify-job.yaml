# D1b (PLT-339) : connexion au cluster restaure avec le role `optio` et le Secret NEUF, puis compte
# des seules lignes synthetiques. Aucune autre table lue, aucune valeur de secret affichee.
apiVersion: batch/v1
kind: Job
metadata:
  name: pg-shared-restore-d1b-verify
  namespace: pg-shared-restore-drill
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 2700
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: verify
          image: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie@sha256:ebf3919504d7523a63e8e2fee9b051211de714644b36469275558c624afd50ec
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          env:
            - {name: PGHOST, value: pg-shared-restore-rw}
            - {name: PGDATABASE, value: optio}
            - {name: PGSSLMODE, value: require}
            - {name: PGCONNECT_TIMEOUT, value: "5"}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: pg-pg-shared-restore-drill, key: username}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: pg-pg-shared-restore-drill, key: password}}
          command: [bash, -c]
          args:
            - |
              set -u
              t0=$(date +%s)
              until pg_isready -q; do
                [ $(( $(date +%s) - t0 )) -lt 2000 ] || { echo "DRILL_STATUS=FAIL reason=not_ready"; exit 1; }
                sleep 5
              done
              echo "DRILL_READY_AFTER_JOB_START_S=$(( $(date +%s) - t0 ))"
              # CNPG applique le mot de passe apres la restauration : attente bornee a 10 min.
              t1=$(date +%s)
              until user=$(psql -v ON_ERROR_STOP=1 -tAc "select current_user" 2>/tmp/err); do
                [ $(( $(date +%s) - t1 )) -lt 600 ] || { cat /tmp/err; echo "DRILL_STATUS=FAIL reason=connect"; exit 1; }
                sleep 10
              done
              echo "DRILL_CONNECT=PASS user=$user"
              n=$(psql -v ON_ERROR_STOP=1 -tAc "select count(*) from public.restore_drill_marks where mark like 'synthetic-%'") || { echo "DRILL_STATUS=FAIL reason=marks_unreadable"; exit 1; }
              echo "DRILL_SYNTHETIC_ROWS=$n"
              [ "$n" = "3" ] || { echo "DRILL_STATUS=FAIL reason=row_count"; exit 1; }
              echo "DRILL_STATUS=PASS"
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
