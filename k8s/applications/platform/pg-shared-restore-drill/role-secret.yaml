# D1b (PLT-339) : Secret de role NEUF (forme C, classe T1), genere par ESO dans le namespace du drill.
# Aucune copie de la source. Orphan : le Secret survit au retrait du drill, un operateur le supprime.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata: {name: pg-pg-shared-restore-drill, namespace: pg-shared-restore-drill}
spec: {length: 48, digits: 10, symbols: 0, allowRepeat: true}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-pg-shared-restore-drill
  namespace: pg-shared-restore-drill
  annotations: {kube-ops.io/secret-class: T1}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: pg-pg-shared-restore-drill
    creationPolicy: Orphan
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: optio
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: pg-pg-shared-restore-drill}
