# Active SandboxTemplate via apps-platform: new SandboxClaims use these settings.
# WarmPool remains at zero; this change does not start an extra workload.
apiVersion: v1
kind: Namespace
metadata:
  name: mastra-sandbox
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mastra-factory
  namespace: mastra-factory
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mastra-agent-sandbox-client
  namespace: mastra-sandbox
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mastra-agent-sandbox-client
  namespace: mastra-sandbox
subjects:
  - kind: ServiceAccount
    name: mastra-factory
    namespace: mastra-factory
roleRef:
  kind: Role
  name: mastra-agent-sandbox-client
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: mastra-code
  namespace: mastra-sandbox
spec:
  envVarsInjectionPolicy: Disallowed
  volumeClaimTemplatesPolicy: Disallowed
  service: true
  networkPolicyManagement: Unmanaged
  podTemplate:
    spec:
      automountServiceAccountToken: false
      runtimeClassName: gvisor # Must exist and be verified on Talos before any run.
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sandboxd
          # Staged only: gVisor and the full SandboxClaim path must pass before
          # this directory is referenced by the parent kustomization.
          image: ghcr.io/smadjapaul/mastra-sandboxd@sha256:92975c43d1616e64c7abc06f030335ebbdefa9d125eb4f3c92931c6e68755513
          command:
            - /usr/local/bin/sandboxd
            - --root-dir=/workspace
            - --rest-port=8080
            - --grpc-port=9090
          ports:
            - {name: rest, containerPort: 8080}
            - {name: grpc, containerPort: 9090}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "2", memory: 2Gi}
          readinessProbe:
            httpGet: {path: /v1/health, port: rest}
            periodSeconds: 5
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          # npm ci uses /tmp for transient install/extract files; 256Mi caused
          # the PLT-103 sandboxd Pod eviction (emptyDir tmp size limit).
          # This is node-local ephemeral storage, not a memory or PVC quota.
          emptyDir: {sizeLimit: 1Gi}
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn-fast
        resources:
          requests: {storage: 2Gi}
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: mastra-code
  namespace: mastra-sandbox
spec:
  replicas: 0 # Zero idle cost; claims cold-start from the template.
  updateStrategy: {type: Recreate}
  sandboxTemplateRef: {name: mastra-code}
---
# sandboxd's REST/gRPC endpoints are unauthenticated and plaintext inside
# the cluster. Only the trusted Factory pod may reach them.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mastra-sandbox-restricted
  namespace: mastra-sandbox
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: mastra-factory
            app.kubernetes.io/name: mastra-factory
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
            - {port: "9090", protocol: TCP}
  # Workspace preparation and the standard development harness use short-lived
  # GitHub credentials for the repository checkout. Keep the sandbox default
  # deny, but allow only the DNS and HTTPS destinations needed for GitHub
  # transport and the pinned Node dependency registry. This is deliberately
  # narrower than world egress and does not expose Kubernetes credentials.
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - {matchName: github.com}
        - {matchName: api.github.com}
        - {matchName: codeload.github.com}
        - {matchName: objects.githubusercontent.com}
        - {matchName: release-assets.githubusercontent.com}
        - {matchName: registry.npmjs.org}
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
