apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Private pilot admission uses the reviewed persistent contract with synthetic
# data only. FAMILY_GO still requires an isolated SQLite/WAL restore proof.
namespace: rustical-pilot
resources:
  - ../../../optional/rustical
  - pvc-bulk.yaml
patches:
  - target:
      kind: Deployment
      name: rustical
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: rustical-data-bulk
