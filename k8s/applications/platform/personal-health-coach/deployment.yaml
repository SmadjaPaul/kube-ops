apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-health-coach
  namespace: personal-health-coach
  labels: {app.kubernetes.io/name: personal-health-coach, app.kubernetes.io/part-of: personal-platform}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: personal-health-coach}
  template:
    metadata:
      labels: {app.kubernetes.io/name: personal-health-coach, app.kubernetes.io/part-of: personal-platform}
    spec:
      serviceAccountName: personal-health-coach
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      imagePullSecrets:
        - name: personal-health-coach-ghcr
      containers:
        - name: coach
          image: ghcr.io/smadjapaul/personal-health-coach@sha256:81f7d697cc129eb24d6dd97b07a211b75d0675cc6d15e7282ee0b19a0f705205
          imagePullPolicy: IfNotPresent
          env:
            - {name: COACH_MODE, value: synthetic}
            - {name: PORT, value: "8080"}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 3, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10, periodSeconds: 20}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 25m, memory: 96Mi}
            limits: {cpu: 250m, memory: 256Mi}
