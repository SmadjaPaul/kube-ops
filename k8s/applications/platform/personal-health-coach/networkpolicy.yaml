apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: personal-health-coach
  namespace: personal-health-coach
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: personal-health-coach}}
  ingress:
    - fromEntities: [host, remote-node]
      toPorts: [{ports: [{port: "8080", protocol: TCP}]}]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts: [{ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}]}]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentgateway
            app: agentgateway
      toPorts: [{ports: [{port: "4000", protocol: TCP}]}]
