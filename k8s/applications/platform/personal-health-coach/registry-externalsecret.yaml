apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: personal-health-coach-ghcr
  namespace: personal-health-coach
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target:
    name: personal-health-coach-ghcr
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: >-
          {"auths":{"ghcr.io":{"username":"SmadjaPaul","password":"{{ .token }}","auth":"{{ printf "SmadjaPaul:%s" .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef: {key: APP_PERSONAL_HEALTH_COACH_GHCR_TOKEN}
