apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: agentgateway-runtime
  namespace: agentgateway
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: agentgateway-runtime, creationPolicy: Owner}
  data:
    - secretKey: MINIMAX_API_KEY
      remoteRef: {key: APP_MINIMAX_TOKEN_PLAN_API_KEY}
    - secretKey: GPT_RESEARCHER_API_KEY
      remoteRef: {key: APP_GPT_RESEARCHER_FACTORY_LITELLM_API_KEY}
    - secretKey: HINDSIGHT_AGENTGATEWAY_KEY
      remoteRef: {key: APP_HINDSIGHT_AGENTGATEWAY_KEY}
    - secretKey: LIBRECHAT_AGENTGATEWAY_KEY
      remoteRef: {key: APP_LIBRECHAT_LLM_KEY}
---
# PLT-339 (D-2026-11-25-05): Claude API key of the `code/frontier` upstream (Anthropic). Created by Paul
# out of Git, spend limit 50 USD/month set in the Anthropic Console (PLT-509). Separate ExternalSecret so
# that a missing Doppler key never breaks `agentgateway-runtime` (MiniMax, existing consumers).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: agentgateway-anthropic
  namespace: agentgateway
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: agentgateway-anthropic, creationPolicy: Owner}
  data:
    - secretKey: ANTHROPIC_UPSTREAM_API_KEY
      remoteRef: {key: APP_AGENTGATEWAY_ANTHROPIC_API_KEY}
