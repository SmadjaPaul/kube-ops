apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway-runtime
  namespace: agentgateway
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: agentgateway-runtime, creationPolicy: Owner}
  data:
    - secretKey: AGENTGATEWAY_CLIENT_KEY
      remoteRef: {key: APP_AGENTGATEWAY_CLIENT_KEY}
    - secretKey: MINIMAX_API_KEY
      remoteRef: {key: APP_MINIMAX_TOKEN_PLAN_API_KEY}
