apiVersion: v1
kind: Namespace
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: agentgateway
  labels: {pod-security.kubernetes.io/enforce: restricted}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: agentgateway-state
  namespace: agentgateway
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/persistent-offsite-backup: enabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-fast
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentgateway-config
  namespace: agentgateway
data:
  config.yaml: |
    # Agentgateway v1.6.0 OSS standalone. Private canary only.
    config:
      database:
        url: sqlite://data.db
    gateways:
      default:
        port: 4000
    llm:
      gateways: default
      policies:
        apiKey:
          mode: strict
          keys:
            - key: "$AGENTGATEWAY_CLIENT_KEY"
              metadata:
                name: factory-canary
                owner: factory-canary
              allowedModels:
                - factory/fast
                - factory/code
              budgets:
                - name: factory-daily-tokens
                  limit:
                    unit: Tokens
                    amount: 1000000
                  window:
                    rolling: 24h
                  onBudgetExceeded: Block
            - key: "$GPT_RESEARCHER_API_KEY"
              metadata:
                name: gpt-researcher
                owner: gpt-researcher
              allowedModels:
                - text/research
                - factory/research # DEPRECATED, removed once the consumer uses text/research
              budgets:
                - name: gpt-researcher-daily-tokens
                  limit:
                    unit: Tokens
                    amount: 2000
                  window:
                    rolling: 24h
                  onBudgetExceeded: Block
            - key: "$HINDSIGHT_AGENTGATEWAY_KEY"
              metadata:
                name: hindsight-personal
                owner: hindsight-personal
              allowedModels:
                - text/fast
                - factory/fast # DEPRECATED, removed once personal-hindsight uses text/fast
              budgets:
                - name: hindsight-personal-daily-tokens
                  limit:
                    unit: Tokens
                    amount: 200000
                  window:
                    rolling: 24h
                  onBudgetExceeded: Block
            - key: "$LIBRECHAT_AGENTGATEWAY_KEY"
              metadata:
                name: librechat
                owner: librechat
              allowedModels:
                - text/fast
                - factory/fast # DEPRECATED, removed once the consumer uses text/fast
              budgets:
                - name: librechat-daily-tokens
                  limit:
                    unit: Tokens
                    amount: 200000
                  window:
                    rolling: 24h
                  onBudgetExceeded: Block
            # PLT-453: PR triage (agent-harness workflow, ARC runner). Generated key, see pr-triage-key.yaml.
            - key: "$PR_TRIAGE_AGENTGATEWAY_KEY"
              metadata:
                name: pr-triage
                owner: pr-triage
              allowedModels:
                - text/fast
              budgets:
                - name: pr-triage-daily-tokens
                  limit:
                    unit: Tokens
                    amount: 300000
                  window:
                    rolling: 24h
                  onBudgetExceeded: Block
            # PLT-453: incident sentinel (PLT-455, namespace agents). Generated key, see incident-sentinel-key.yaml.
            - key: "$INCIDENT_SENTINEL_AGENTGATEWAY_KEY"
              metadata:
                name: incident-sentinel
                owner: incident-sentinel
              allowedModels:
                - text/fast
              budgets:
                - name: incident-sentinel-daily-tokens
                  limit:
                    unit: Tokens
                    amount: 300000
                  window:
                    rolling: 24h
                  onBudgetExceeded: Block
      models:
        # PLT-496: capability aliases. Consumers call a capability, never a provider model name; the model
        # behind each alias lives only here. factory/* below are DEPRECATED aliases kept while
        # gpt-researcher, hindsight, librechat and factory-canary migrate, then removed.
        - name: text/fast
          provider:
            custom:
              formats:
                - type: completions
          params:
            baseUrl: https://api.minimax.io/v1
            model: MiniMax-M3.1-Flash
            apiKey: "$MINIMAX_API_KEY"
        - name: text/strong
          provider:
            custom:
              formats:
                - type: completions
          params:
            baseUrl: https://api.minimax.io/v1
            model: MiniMax-M3
            apiKey: "$MINIMAX_API_KEY"
        - name: text/research
          provider:
            custom:
              formats:
                - type: completions
          params:
            baseUrl: https://api.minimax.io/v1
            model: MiniMax-M3
            apiKey: "$MINIMAX_API_KEY"
        # DEPRECATED (PLT-496): use text/fast.
        - name: factory/fast
          provider:
            custom:
              formats:
                - type: completions
          params:
            baseUrl: https://api.minimax.io/v1
            # PLT-487: M2.7 retired 2026-11-18 (platform.minimax.io/docs/faq/models); pinned explicitly.
            # Thinking cannot be disabled on M3.1 Flash: callers set reasoning_effort (low) themselves.
            model: MiniMax-M3.1-Flash
            apiKey: "$MINIMAX_API_KEY"
        # DEPRECATED (PLT-496): use text/strong.
        - name: factory/code
          provider:
            custom:
              formats:
                - type: completions
          params:
            baseUrl: https://api.minimax.io/v1
            model: MiniMax-M3
            apiKey: "$MINIMAX_API_KEY"
        # DEPRECATED (PLT-496): use text/research.
        - name: factory/research
          provider:
            custom:
              formats:
                - type: completions
          params:
            baseUrl: https://api.minimax.io/v1
            model: MiniMax-M3
            apiKey: "$MINIMAX_API_KEY"
    frontendPolicies:
      tracing:
        host: alloy.monitoring.svc.cluster.local:4318
        protocol: http
        randomSampling: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  namespace: agentgateway
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: agentgateway}}
  template:
    metadata:
      labels: {app: agentgateway}
      # Bump when the config or envFrom secret contract changes so the
      # process starts with the current runtime configuration.
      annotations:
        checksum/agentgateway-runtime: capabilities-v4
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agentgateway
          image: cr.agentgateway.dev/agentgateway@sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b
          livenessProbe:
            tcpSocket: { port: llm }
            periodSeconds: 20
            failureThreshold: 3
          args: ["-f", "/config/config.yaml"]
          workingDir: /data
          envFrom:
            - secretRef: {name: agentgateway-runtime}
            # PLT-453: generated key of the pr-triage consumer (pr-triage-key.yaml, sync-wave -5).
            - secretRef: {name: llm-arc-runners-agent-harness}
            # PLT-453: generated key of the incident-sentinel consumer (incident-sentinel-key.yaml).
            - secretRef: {name: llm-agents}
          ports:
            - {name: llm, containerPort: 4000}
          readinessProbe:
            tcpSocket: {port: llm}
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 25m, memory: 192Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: state, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: agentgateway-config}
        - name: state
          persistentVolumeClaim: {claimName: agentgateway-state}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  namespace: agentgateway
spec:
  type: ClusterIP
  selector: {app: agentgateway}
  ports:
    - {name: llm, port: 4000, targetPort: llm}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentgateway-private
  namespace: agentgateway
spec:
  endpointSelector: {matchLabels: {app: agentgateway}}
  ingress:
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: mastra-factory}
      toPorts:
        - ports: [{port: "4000", protocol: TCP}]
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: factory-platform}
      toPorts:
        - ports: [{port: "4000", protocol: TCP}]
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: gpt-researcher
            app.kubernetes.io/name: gpt-researcher
      toPorts:
        - ports: [{port: "4000", protocol: TCP}]
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hindsight-personal
      toPorts:
        - ports: [{port: "4000", protocol: TCP}]
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: librechat
      toPorts:
        - ports: [{port: "4000", protocol: TCP}]
    # PLT-453: ARC runner of agent-harness (pr-triage workflow); the key is checked by the gateway.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: arc-runners-agent-harness
      toPorts:
        - ports: [{port: "4000", protocol: TCP}]
    # PLT-453: namespace `agents` (incident sentinel, PLT-455); the key is checked by the gateway.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agents
      toPorts:
        - ports: [{port: "4000", protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: monitoring}
      toPorts:
        - ports: [{port: "4318", protocol: TCP}]
    - toEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: kube-system, k8s:k8s-app: kube-dns}
      toPorts:
        - ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}]
    # Cilium FQDN policy: no blanket world/LAN access. DNS proxy learns
    # api.minimax.io, and only 443/TCP is allowed to that exact FQDN.
    - toFQDNs:
        - matchName: api.minimax.io
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
