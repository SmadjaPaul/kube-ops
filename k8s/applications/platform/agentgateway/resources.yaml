apiVersion: v1
kind: Namespace
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: agentgateway
  labels: {pod-security.kubernetes.io/enforce: restricted}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: agentgateway-state
  namespace: agentgateway
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/persistent-offsite-backup: enabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-fast
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentgateway-config
  namespace: agentgateway
data:
  config.yaml: |
    # Agentgateway v1.6.0 OSS standalone. Private canary only.
    config:
      database:
        url: sqlite://data.db
    gateways:
      default:
        port: 4000
    # PLT-496: capability routes for non-text MiniMax APIs. The consumer calls a capability path and
    # never writes a provider model name: the gateway injects `model` into the JSON body and the
    # provider key. Probe phase: only the agent-harness runner key is accepted (no dedicated key yet).
    routes:
      - name: capability-speech-tts
        gateways: default
        matches:
          - path: {pathPrefix: /speech/tts}
        backends:
          - host: api.minimax.io:443
        policies:
          apiKey:
            mode: strict
            keys:
              - key: "$PR_TRIAGE_AGENTGATEWAY_KEY"
                metadata: {name: media-probe, owner: pr-triage}
          localRateLimit:
            - maxTokens: 20
              tokensPerFill: 20
              fillInterval: 3600s
              type: requests
          urlRewrite:
            authority: {host: api.minimax.io}
            path: {full: /v1/t2a_v2}
          backendTLS: {hostname: api.minimax.io}
          backendAuth:
            key:
              value: $MINIMAX_API_KEY
          transformations:
            request:
              body: 'toJson(json(request.body).merge({"model": "speech-2.8-hd"}))'
      - name: capability-speech-tts-fast
        gateways: default
        matches:
          - path: {pathPrefix: /speech/tts-fast}
        backends:
          - host: api.minimax.io:443
        policies:
          apiKey:
            mode: strict
            keys:
              - key: "$PR_TRIAGE_AGENTGATEWAY_KEY"
                metadata: {name: media-probe, owner: pr-triage}
          localRateLimit:
            - maxTokens: 20
              tokensPerFill: 20
              fillInterval: 3600s
              type: requests
          urlRewrite:
            authority: {host: api.minimax.io}
            path: {full: /v1/t2a_v2}
          backendTLS: {hostname: api.minimax.io}
          backendAuth:
            key:
              value: $MINIMAX_API_KEY
          transformations:
            request:
              body: 'toJson(json(request.body).merge({"model": "speech-2.8-turbo"}))'
      - name: capability-image-generate
        gateways: default
        matches:
          - path: {pathPrefix: /image/generate}
        backends:
          - host: api.minimax.io:443
        policies:
          apiKey:
            mode: strict
            keys:
              - key: "$PR_TRIAGE_AGENTGATEWAY_KEY"
                metadata: {name: media-probe, owner: pr-triage}
          localRateLimit:
            - maxTokens: 20
              tokensPerFill: 20
              fillInterval: 3600s
              type: requests
          urlRewrite:
            authority: {host: api.minimax.io}
            path: {full: /v1/images/generations}
          backendTLS: {hostname: api.minimax.io}
          backendAuth:
            key:
              value: $MINIMAX_API_KEY
          transformations:
            request:
              body: 'toJson(json(request.body).merge({"model": "MiniMax-H3-Image"}))'
      - name: capability-video-generate
        gateways: default
        matches:
          - path: {pathPrefix: /video/generate}
        backends:
          - host: api.minimax.io:443
        policies:
          apiKey:
            mode: strict
            keys:
              - key: "$PR_TRIAGE_AGENTGATEWAY_KEY"
                metadata: {name: media-probe, owner: pr-triage}
          localRateLimit:
            - maxTokens: 20
              tokensPerFill: 20
              fillInterval: 3600s
              type: requests
          urlRewrite:
            authority: {host: api.minimax.io}
            path: {full: /v2/video_generation}
          backendTLS: {hostname: api.minimax.io}
          backendAuth:
            key:
              value: $MINIMAX_API_KEY
          transformations:
            request:
              body: 'toJson(json(request.body).merge({"model": "MiniMax-H3"}))'
    llm:
      gateways: default
      policies:
        apiKey:
          mode: strict
          keys:
            - key: "$GPT_RESEARCHER_API_KEY"
              metadata:
                name: gpt-researcher
                owner: gpt-researcher
              allowedModels:
                - text/research
              budgets:
                - name: gpt-researcher-daily-tokens
                  limit:
                    unit: Tokens
                    amount: 2000
                  window:
                    rolling: 24h
                  onBudgetExceeded: Block
            - key: "$HINDSIGHT_AGENTGATEWAY_KEY"
              metadata:
                name: hindsight-personal
                owner: hindsight-personal
              allowedModels:
                - text/fast
              budgets:
                - name: hindsight-personal-daily-tokens
                  limit:
                    unit: Tokens
                    amount: 200000
                  window:
                    rolling: 24h
                  onBudgetExceeded: Block
            - key: "$LIBRECHAT_AGENTGATEWAY_KEY"
              metadata:
                name: librechat
                owner: librechat
              allowedModels:
                - text/fast
              budgets:
                - name: librechat-daily-tokens
                  limit:
                    unit: Tokens
                    amount: 200000
                  window:
                    rolling: 24h
                  onBudgetExceeded: Block
            # PLT-453: PR triage (agent-harness workflow, ARC runner). Generated key, see pr-triage-key.yaml.
            - key: "$PR_TRIAGE_AGENTGATEWAY_KEY"
              metadata:
                name: pr-triage
                owner: pr-triage
              allowedModels:
                - text/fast
              budgets:
                - name: pr-triage-daily-tokens
                  limit:
                    unit: Tokens
                    amount: 300000
                  window:
                    rolling: 24h
                  onBudgetExceeded: Block
            # PLT-453: incident sentinel (PLT-455, namespace agents). Generated key, see incident-sentinel-key.yaml.
            - key: "$INCIDENT_SENTINEL_AGENTGATEWAY_KEY"
              metadata:
                name: incident-sentinel
                owner: incident-sentinel
              allowedModels:
                - text/fast
              budgets:
                - name: incident-sentinel-daily-tokens
                  limit:
                    unit: Tokens
                    amount: 300000
                  window:
                    rolling: 24h
                  onBudgetExceeded: Block
            # PLT-339 (D-2026-11-25-05, MANDAT 30): Optio agent pods, workspace "passerelle". Generated
            # key, see optio-key.yaml. text/strong = MiniMax (mechanical tickets, builder fallback);
            # code/frontier = Claude API (PR review, model:frontier tickets).
            - key: "$OPTIO_AGENTGATEWAY_KEY"
              metadata:
                name: optio
                owner: optio
              allowedModels:
                - text/strong
                - code/frontier
              budgets:
                - name: optio-daily-tokens
                  limit:
                    unit: Tokens
                    amount: 30000000
                  window:
                    rolling: 24h
                  onBudgetExceeded: Block
                # PLT-515: caps the paid Claude API. The gateway prices code/frontier only (no cost
                # for the MiniMax custom provider, so it is not charged here). Once exceeded, the
                # whole key is blocked until the window resets, text/strong included.
                - name: optio-daily-usd
                  limit:
                    unit: USD
                    amount: 2
                  window:
                    rolling: 24h
                  onBudgetExceeded: Block
      models:
        # PLT-496: capability aliases. Consumers call a capability, never a provider model name; the model
        # behind each alias lives only here. No factory/* alias remains (PLT-496).
        - name: text/fast
          provider:
            custom:
              formats:
                - type: completions
          params:
            baseUrl: https://api.minimax.io/v1
            model: MiniMax-M3.1-Flash
            apiKey: "$MINIMAX_API_KEY"
        - name: text/strong
          provider:
            custom:
              formats:
                - type: completions
                # PLT-339: Anthropic Messages format for Claude Code (Optio). Absolute upstream path,
                # same convention as the deepseek/deepinfra presets of v1.6.0 (crates/llm/src/custom.rs).
                # RUNTIME not proven: tool calls through MiniMax /anthropic.
                - type: messages
                  path: /anthropic/v1/messages
          params:
            baseUrl: https://api.minimax.io/v1
            model: MiniMax-M3
            apiKey: "$MINIMAX_API_KEY"
        # PLT-339: Claude API (Anthropic upstream), built-in `anthropic` provider of v1.6.0
        # (LocalBuiltinModelAIProvider::Anthropic). Key created out of Git by Paul, Console spend limit.
        - name: code/frontier
          provider: anthropic
          params:
            model: claude-opus-5-5
            # `${VAR:-}` (shellexpand, config.rs parse_config): an absent key expands to "" instead of
            # failing the whole config load; code/frontier then answers 401 until the key exists.
            apiKey: "${ANTHROPIC_UPSTREAM_API_KEY:-}"
        - name: text/research
          provider:
            custom:
              formats:
                - type: completions
          params:
            baseUrl: https://api.minimax.io/v1
            model: MiniMax-M3
            apiKey: "$MINIMAX_API_KEY"
    frontendPolicies:
      tracing:
        host: alloy.monitoring.svc.cluster.local:4318
        protocol: http
        randomSampling: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  namespace: agentgateway
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: agentgateway}}
  template:
    metadata:
      labels: {app: agentgateway}
      # Bump when the config or envFrom secret contract changes so the
      # process starts with the current runtime configuration.
      annotations:
        checksum/agentgateway-runtime: optio-v2
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agentgateway
          image: cr.agentgateway.dev/agentgateway@sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b
          livenessProbe:
            tcpSocket: { port: llm }
            periodSeconds: 20
            failureThreshold: 3
          args: ["-f", "/config/config.yaml"]
          workingDir: /data
          envFrom:
            - secretRef: {name: agentgateway-runtime}
            # PLT-453: generated key of the pr-triage consumer (pr-triage-key.yaml, sync-wave -5).
            - secretRef: {name: llm-arc-runners-agent-harness}
            # PLT-453: generated key of the incident-sentinel consumer (incident-sentinel-key.yaml).
            - secretRef: {name: llm-arc-runners-agent-harness--sentinel}
            # PLT-339: generated key of the optio consumer (optio-key.yaml).
            - secretRef: {name: llm-optio}
            # PLT-339: Claude API key of the code/frontier upstream (secrets.yaml, created by Paul).
            # optional: a missing Doppler key must never stop the gateway for its other consumers.
            - secretRef: {name: agentgateway-anthropic, optional: true}
          ports:
            - {name: llm, containerPort: 4000}
          readinessProbe:
            tcpSocket: {port: llm}
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 25m, memory: 192Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: state, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: agentgateway-config}
        - name: state
          persistentVolumeClaim: {claimName: agentgateway-state}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  namespace: agentgateway
spec:
  type: ClusterIP
  selector: {app: agentgateway}
  ports:
    - {name: llm, port: 4000, targetPort: llm}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentgateway-private
  namespace: agentgateway
spec:
  endpointSelector: {matchLabels: {app: agentgateway}}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: gpt-researcher
            app.kubernetes.io/name: gpt-researcher
      toPorts:
        - ports: [{port: "4000", protocol: TCP}]
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hindsight-personal
      toPorts:
        - ports: [{port: "4000", protocol: TCP}]
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: librechat
      toPorts:
        - ports: [{port: "4000", protocol: TCP}]
    # PLT-453: ARC runner of agent-harness (pr-triage workflow); the key is checked by the gateway.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: arc-runners-agent-harness
      toPorts:
        - ports: [{port: "4000", protocol: TCP}]
    # PLT-453: namespace `agents` (incident sentinel, PLT-455); the key is checked by the gateway.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agents
      toPorts:
        - ports: [{port: "4000", protocol: TCP}]
    # PLT-339: Optio agent pods (namespace optio, label managed-by=optio); the key is checked by the gateway.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: optio
            managed-by: optio
      toPorts:
        - ports: [{port: "4000", protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: monitoring}
      toPorts:
        - ports: [{port: "4318", protocol: TCP}]
    - toEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: kube-system, k8s:k8s-app: kube-dns}
      toPorts:
        - ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}]
    # Cilium FQDN policy: no blanket world/LAN access. DNS proxy learns
    # api.minimax.io, and only 443/TCP is allowed to that exact FQDN.
    - toFQDNs:
        - matchName: api.minimax.io
        # PLT-339: code/frontier upstream.
        - matchName: api.anthropic.com
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
