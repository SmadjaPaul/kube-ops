apiVersion: v1
kind: Namespace
metadata:
  name: agentgateway
  labels: {pod-security.kubernetes.io/enforce: restricted}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentgateway-state
  namespace: agentgateway
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/persistent-offsite-backup: enabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-fast
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentgateway-config
  namespace: agentgateway
data:
  config.yaml: |
    # Agentgateway v1.6.0 OSS standalone. Private canary only.
    config:
      database:
        url: sqlite://data.db
    gateways:
      default:
        port: 4000
    llm:
      gateways: default
      policies:
        apiKey:
          mode: strict
          keys:
            - key: "$AGENTGATEWAY_CLIENT_KEY"
              metadata:
                name: factory-canary
                owner: factory-canary
              allowedModels:
                - factory/fast
                - factory/code
              # Token budget works even when the custom MiniMax model has no
              # verified USD entry in the agentgateway price catalog.
              # Per-key USD budgets require measured nonzero catalog costs.
              budgets:
                - name: canary-daily-tokens
                  limit:
                    unit: Tokens
                    # Existing fail-closed factory canary ceiling: 5M tokens
                    # per rolling 24h. Any change requires separate operator
                    # approval after the credential billing boundary is proven.
                    # Keep enforcement fail-closed; per-request usage is
                    # emitted through Agentgateway GenAI/OTel telemetry.
                    amount: 5000000
                  window:
                    rolling: 24h
                  onBudgetExceeded: Block
            - key: "$GPT_RESEARCHER_API_KEY"
              metadata:
                name: gpt-researcher
                owner: gpt-researcher
              allowedModels:
                - factory/research
              budgets:
                - name: gpt-researcher-daily-tokens
                  limit:
                    unit: Tokens
                    amount: 2000
                  window:
                    rolling: 24h
                  onBudgetExceeded: Block
      models:
        - name: factory/fast
          provider:
            custom:
              formats:
                - type: completions
          params:
            baseUrl: https://api.minimax.io/v1
            model: MiniMax-M2.7
            apiKey: "$MINIMAX_API_KEY"
        - name: factory/code
          provider:
            custom:
              formats:
                - type: completions
          params:
            baseUrl: https://api.minimax.io/v1
            model: MiniMax-M3
            apiKey: "$MINIMAX_API_KEY"
        - name: factory/research
          provider:
            custom:
              formats:
                - type: completions
          params:
            baseUrl: https://api.minimax.io/v1
            model: MiniMax-M3
            apiKey: "$MINIMAX_API_KEY"
    frontendPolicies:
      tracing:
        host: alloy.monitoring.svc.cluster.local:4318
        protocol: http
        randomSampling: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  namespace: agentgateway
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: agentgateway}}
  template:
    metadata:
      labels: {app: agentgateway}
      # Bump when the config or envFrom secret contract changes so the
      # process starts with the current runtime configuration.
      annotations:
        checksum/agentgateway-runtime: gpt-researcher-routing-v1
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agentgateway
          image: cr.agentgateway.dev/agentgateway@sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c
          args: ["-f", "/config/config.yaml"]
          workingDir: /data
          envFrom:
            - secretRef: {name: agentgateway-runtime}
          ports:
            - {name: llm, containerPort: 4000}
          readinessProbe:
            tcpSocket: {port: llm}
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: state, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: agentgateway-config}
        - name: state
          persistentVolumeClaim: {claimName: agentgateway-state}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  namespace: agentgateway
spec:
  type: ClusterIP
  selector: {app: agentgateway}
  ports:
    - {name: llm, port: 4000, targetPort: llm}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentgateway-private
  namespace: agentgateway
spec:
  endpointSelector: {matchLabels: {app: agentgateway}}
  ingress:
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: mastra-factory}
      toPorts:
        - ports: [{port: "4000", protocol: TCP}]
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: factory-platform}
      toPorts:
        - ports: [{port: "4000", protocol: TCP}]
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: paperclip}
      toPorts:
        - ports: [{port: "4000", protocol: TCP}]
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: gpt-researcher
            app.kubernetes.io/name: gpt-researcher
      toPorts:
        - ports: [{port: "4000", protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: monitoring}
      toPorts:
        - ports: [{port: "4318", protocol: TCP}]
    - toEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: kube-system, k8s:k8s-app: kube-dns}
      toPorts:
        - ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}]
    # Cilium FQDN policy: no blanket world/LAN access. DNS proxy learns
    # api.minimax.io, and only 443/TCP is allowed to that exact FQDN.
    - toFQDNs:
        - matchName: api.minimax.io
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
