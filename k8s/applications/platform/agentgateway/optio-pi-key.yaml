# PLT-542: Agentgateway key of the `optio-pi` consumer (Optio repository tasks that run the Pi
# harness, role repo-worker), generated inside the cluster like optio-key.yaml (D-2026-11-20-04,
# class T4: disposable, not backed up). Never in Doppler, never in Git.
# Source named `llm-optio--pi` (store k8s-agentgateway, prefix `llm-` + consumer namespace optio,
# suffix --pi, eso-k8s-store-guard).
#   - the gateway reads it through `envFrom` (resources.yaml) and checks it in config.yaml
#     (strict, allowedModels text/strong only, budget 5 000 000 tokens / 24 h, Block);
#   - the copy in namespace optio is the ExternalSecret `optio-llm-pi`
#     (k8s/applications/platform/optio/externalsecrets.yaml), written into Optio by optio-secret-sync.
# Revert: remove this file, its line in kustomization.yaml, the key block in config.yaml, the envFrom
# entry, the Role line, and the ExternalSecret `optio-llm-pi` with its secret-sync entries (Secret is
# orphaned, delete by hand).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: llm-optio--pi
  namespace: agentgateway
spec:
  length: 48
  digits: 10
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-optio--pi
  namespace: agentgateway
  annotations:
    kube-ops.io/secret-class: T4
    kube-ops.io/not-data-key: "bearer token of an internal LLM consumer, encrypts no persisted data"
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: llm-optio--pi
    creationPolicy: Orphan
    template:
      engineVersion: v2
      data:
        OPTIO_PI_AGENTGATEWAY_KEY: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: llm-optio--pi
