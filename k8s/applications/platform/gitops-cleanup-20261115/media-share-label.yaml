# PLT-333: remove the Longhorn default backup group label from media/media-share (Git already
# carries media-no-backup only; the live PVC still has the default group, so the volume would be
# backed up to R2 at 03:17 UTC). Longhorn syncs the PVC labels to the volume (source: enabled).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleanup-media-share-label
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "19"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cleanup-media-share-label
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "19"
rules:
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    resourceNames: [media-share]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cleanup-media-share-label
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "19"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cleanup-media-share-label
subjects:
  - kind: ServiceAccount
    name: cleanup-media-share-label
    namespace: media
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cleanup-media-share-label
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "22"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cleanup-media-share-label
    spec:
      serviceAccountName: cleanup-media-share-label
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 2501
        runAsGroup: 2501
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: label
          image: docker.io/alpine/k8s:1.36.6@sha256:e2d95501b5718673ba67693154fabe6c618dbe1211a32947d6d5cf16285e019b
          env:
            - {name: HOME, value: /tmp}
          command:
            - /bin/bash
            - -euo
            - pipefail
            - -c
            - |
              L=recurring-job-group.longhorn.io/default
              j=$(kubectl get pvc media-share -n media -o json)
              [[ "$(jq -r .metadata.uid <<<"$j")" == b6475b57-666c-45cf-8b63-1cca1568c8a1 ]] || { echo "MEDIA_LABEL=BLOCKED uid différent"; exit 1; }
              [[ "$(jq -r '.metadata.labels["recurring-job-group.longhorn.io/media-no-backup"]' <<<"$j")" == enabled ]] || { echo "MEDIA_LABEL=BLOCKED media-no-backup absent"; exit 1; }
              kubectl label pvc media-share -n media "$L-"
              j=$(kubectl get pvc media-share -n media -o json)
              [[ "$(jq -r --arg l "$L" '.metadata.labels[$l] // "absent"' <<<"$j")" == absent ]] || { echo "MEDIA_LABEL=FAIL label présent"; exit 1; }
              echo "MEDIA_LABEL=DONE"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
