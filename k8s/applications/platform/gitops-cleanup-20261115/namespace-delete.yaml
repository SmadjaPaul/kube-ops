apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleanup-recovery-ns
  namespace: matrix
  annotations:
    argocd.argoproj.io/sync-wave: "19"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cleanup-matrix-recovery-ns
  annotations:
    argocd.argoproj.io/sync-wave: "19"
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [matrix-mas-recovery]
    verbs: [get, delete]
  - apiGroups: [""]
    resources: [persistentvolumes]
    resourceNames:
      - pvc-7f2df114-2368-4357-b2b6-e0d2baea33bf
      - pvc-f1a03e61-fa2b-4d42-a87f-2c8c03330ac4
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cleanup-matrix-recovery-ns
  annotations:
    argocd.argoproj.io/sync-wave: "19"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cleanup-matrix-recovery-ns
subjects:
  - kind: ServiceAccount
    name: cleanup-recovery-ns
    namespace: matrix
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cleanup-matrix-recovery-ns
  namespace: matrix
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cleanup-matrix-recovery-ns
    spec:
      serviceAccountName: cleanup-recovery-ns
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 2501
        runAsGroup: 2501
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cleanup
          image: docker.io/alpine/k8s:1.36.6@sha256:e2d95501b5718673ba67693154fabe6c618dbe1211a32947d6d5cf16285e019b
          env:
            - {name: HOME, value: /tmp}
          command:
            - /bin/bash
            - -euo
            - pipefail
            - -c
            - |
              NS=matrix-mas-recovery
              NS_UID=258098ab-a1f9-4461-b097-e0bced8abbbd
              declare -A PV_UID=(
                [pvc-7f2df114-2368-4357-b2b6-e0d2baea33bf]=be1fa4bb-742e-40d0-8b06-d903099d4966
                [pvc-f1a03e61-fa2b-4d42-a87f-2c8c03330ac4]=145d525a-2ac4-4f1c-9411-90d63bd1fd27 )
              declare -A PV_CLAIM=(
                [pvc-7f2df114-2368-4357-b2b6-e0d2baea33bf]=matrix-mas-recovery/matrix-mas-restore-20261104-1
                [pvc-f1a03e61-fa2b-4d42-a87f-2c8c03330ac4]=matrix-mas-recovery/matrix-mas-restore-20261104-1-wal )
              err=$(mktemp)
              if ns=$(kubectl get ns "$NS" -o json 2>"$err"); then
                [[ "$(jq -r .metadata.uid <<<"$ns")" == "$NS_UID" ]] || { echo "NS_CLEANUP=BLOCKED uid différent"; exit 1; }
                for pv in "${!PV_UID[@]}"; do
                  j=$(kubectl get pv "$pv" -o json)
                  [[ "$(jq -r .metadata.uid <<<"$j")" == "${PV_UID[$pv]}" ]] || { echo "NS_CLEANUP=BLOCKED PV $pv uid différent"; exit 1; }
                  [[ "$(jq -r '.spec.claimRef.namespace + "/" + .spec.claimRef.name' <<<"$j")" == "${PV_CLAIM[$pv]}" ]] || { echo "NS_CLEANUP=BLOCKED PV $pv claimRef inattendu"; exit 1; }
                done
                echo '{"kind":"DeleteOptions","apiVersion":"v1","preconditions":{"uid":"'"$NS_UID"'"}}' >/tmp/del.json
                kubectl delete --raw "/api/v1/namespaces/$NS" -f /tmp/del.json >/dev/null
                echo "NS $NS DELETE demandé"
              elif grep -q '(NotFound)' "$err"; then
                echo "NS $NS déjà absent"
              else
                cat "$err"; echo "NS_CLEANUP=BLOCKED lecture impossible"; exit 1
              fi
              for _ in $(seq 1 90); do
                if kubectl get ns "$NS" >/dev/null 2>&1; then sleep 5; else break; fi
              done
              ! kubectl get ns "$NS" >/dev/null 2>&1 || { echo "NS_CLEANUP=INCOMPLETE namespace encore présent"; exit 1; }
              for pv in "${!PV_UID[@]}"; do
                for _ in $(seq 1 24); do
                  [[ "$(kubectl get pv "$pv" -o jsonpath='{.status.phase}')" == Released ]] && continue 2
                  sleep 5
                done
                echo "NS_CLEANUP=INCOMPLETE PV $pv non Released"; exit 1
              done
              echo "NS_CLEANUP=DONE"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
