apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: matrix-legacy-forensics
  namespace: argocd
  labels:
    app.kubernetes.io/component: dormant-forensics
    app.kubernetes.io/part-of: matrix
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: applications
  source:
    repoURL: https://github.com/SmadjaPaul/kube-ops.git
    targetRevision: main
    path: k8s/optional/matrix-legacy-source
    kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: matrix
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
