apiVersion: v1
kind: LimitRange
metadata:
  name: paperclip-limits
  namespace: paperclip-exec-h3
spec:
  limits:
    - type: Container
      max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: "1"
        memory: 2Gi
      defaultRequest:
        cpu: 250m
        memory: 512Mi
