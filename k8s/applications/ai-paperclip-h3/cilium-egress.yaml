apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: paperclip-egress-fqdn
  namespace: paperclip-exec-h3
  labels:
    paperclip.io/managed-by: paperclip-k8s-plugin
spec:
  endpointSelector:
    matchLabels:
      paperclip.io/role: agent
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: paperclip
            app.kubernetes.io/name: paperclip
            app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
