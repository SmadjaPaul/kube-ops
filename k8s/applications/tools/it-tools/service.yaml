apiVersion: v1
kind: Service
metadata:
  name: it-tools-service
  namespace: it-tools
spec:
  selector:
    app: it-tools
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 80
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: it-tools-preview-service
  namespace: it-tools
spec:
  selector:
    app: it-tools
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 80
  type: ClusterIP
