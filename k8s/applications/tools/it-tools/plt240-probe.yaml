# PLT-240 — ressource jetable de qualification FULL AUTO (D-2026-11-13-01).
# Aucune donnée, aucun credential, aucun Service : sert uniquement à prouver une
# mutation par l'identité agent-operator (kubectl-rw.sh) puis le retour à l'état
# Git par selfHeal Argo. Retirée par la PR de clôture de PLT-240.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plt240-probe
  namespace: it-tools
  labels:
    app: plt240-probe
    homelab.smadja.dev/purpose: qualification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plt240-probe
  template:
    metadata:
      labels:
        app: plt240-probe
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65535
        runAsGroup: 65535
        fsGroup: 65535
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: '5m'
              memory: '8Mi'
            limits:
              cpu: '20m'
              memory: '16Mi'
