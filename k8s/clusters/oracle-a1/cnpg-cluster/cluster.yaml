# Single shared PostgreSQL for all future Oracle databases (D-2026-11-11-17):
# one block volume instead of one per application.
#
# PLT-190/PLT-408: WAL archive + daily base backups to R2 (bucket
# homelab-backup-cnpg, prefix oracle-a1/pg-shared-v2/), writer identity.
# Reconciled by the OKE `infrastructure` ApplicationSet since PLT-408: the
# off-Oracle restore drill (docs/operations/pg-shared-oke-backup-drill.md) runs
# against this cluster. No application database (Polyfin...) is wired before
# that drill is PROVEN.
#
# serverName pg-shared-v2: OKE was rebuilt on 21/11/2026 and the previous
# cluster's archive still sits under oracle-a1/pg-shared/ (barman-cloud refuses
# a non-empty archive). The old prefix is left as is (deletion = Paul's call).
#
# Image: same PostgreSQL 17.7 standard trixie multi-arch INDEX digest as the
# OKE Hindsight cluster, so the off-Oracle restore on the homelab (amd64) runs
# the exact same server version as this arm64 node.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-shared
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7-standard-trixie@sha256:e079dae5253fa6ed26fc65fda06d515af764dbec392dd4b46b17ab11eebd8131
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: pg-shared-oke-r2
        serverName: pg-shared-v2
  storage:
    storageClass: oci-bv
    size: 50Gi
  managed:
    roles:
      - name: polyfin
        ensure: present
        login: true
        passwordSecret:
          name: pg-shared-polyfin
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
