# Role password only; value lives in Doppler (ORACLE_A1_POSTGRES_PASSWORD).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-shared-polyfin
  namespace: databases
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target:
    name: pg-shared-polyfin
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: polyfin
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: {key: ORACLE_A1_POSTGRES_PASSWORD}
---
# Contrat PostgreSQL OKE : mot de passe du role backstage. Valeur dans Doppler (SecretStore
# doppler du namespace databases, cree par #1620 ; projet cluster, config prd) sous ORACLE_A1_BACKSTAGE_DB_PASSWORD, creee par
# Paul (jamais dans Git). Le role est cree par CNPG (managed.roles) ; ce Secret lui donne son mot
# de passe. Backstage ne lit PAS ce Secret (autre namespace) : il a son propre ExternalSecret
# (backstage-db) sur la MEME cle Doppler, voir docs/platform/postgres-oke-contract.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-shared-backstage
  namespace: databases
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler, kind: SecretStore}
  target:
    name: pg-shared-backstage
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: backstage
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: {key: ORACLE_A1_BACKSTAGE_DB_PASSWORD}
---
# PLT-190: writer identity of bucket homelab-backup-cnpg (same per-bucket
# identity as the homelab CNPG clusters and the OKE Hindsight archive). Names
# only; values live in Doppler cluster/prd. Used for the pg-shared WAL archive
# and base backups under oracle-a1/pg-shared/.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-shared-cnpg-r2-writer
  namespace: databases
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: pg-shared-cnpg-r2-writer, creationPolicy: Owner}
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: {key: R2_CNPG_WRITER_ACCESS_KEY_ID}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: {key: R2_CNPG_WRITER_SECRET_ACCESS_KEY}
    - secretKey: AWS_ENDPOINT_URL_S3
      remoteRef: {key: R2_S3_ENDPOINT}
