# Role password only; value lives in Doppler (ORACLE_A1_POSTGRES_PASSWORD).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-shared-polyfin
  namespace: databases
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target:
    name: pg-shared-polyfin
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: polyfin
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: {key: ORACLE_A1_POSTGRES_PASSWORD}
