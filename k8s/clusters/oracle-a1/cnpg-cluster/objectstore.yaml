# PLT-190: pg-shared archive on R2 (bucket homelab-backup-cnpg, jurisdiction eu),
# prefix oracle-a1/ + serverName pg-shared = oracle-a1/pg-shared/. A prefix of
# its own: barman-cloud refuses a non-empty archive and Oracle never writes
# into the homelab prefixes. Same sidecar env as the Hindsight OKE store
# (plugin-barman-cloud v0.11.0; boto3 flexible checksums not all supported by R2).
# The off-Oracle restore reads this prefix with the read-only identity
# (k8s/optional/pg-shared-oke-drill/offsite-restore).
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: pg-shared-oke-r2
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  retentionPolicy: "14d"
  instanceSidecarConfiguration:
    env:
      - {name: AWS_REQUEST_CHECKSUM_CALCULATION, value: when_required}
      - {name: AWS_RESPONSE_CHECKSUM_VALIDATION, value: when_required}
      - {name: AWS_DEFAULT_REGION, value: auto}
      - name: AWS_ENDPOINT_URL_S3
        valueFrom:
          secretKeyRef: {name: pg-shared-cnpg-r2-writer, key: AWS_ENDPOINT_URL_S3}
    resources:
      requests: {cpu: 20m, memory: 96Mi}
      limits: {cpu: 300m, memory: 384Mi}
  configuration:
    destinationPath: s3://homelab-backup-cnpg/oracle-a1
    s3Credentials:
      accessKeyId: {name: pg-shared-cnpg-r2-writer, key: AWS_ACCESS_KEY_ID}
      secretAccessKey: {name: pg-shared-cnpg-r2-writer, key: AWS_SECRET_ACCESS_KEY}
    wal: {compression: gzip, maxParallel: 2}
    data: {compression: gzip}
