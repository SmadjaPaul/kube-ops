# Identite du runner post-merge d'OKE (PLT-407) : lecture seule, meme perimetre que celle du homelab
# (k8s/optional/github-actions-arc-kube-ops/rbac.yaml) moins velero et Prometheus, qui n'existent pas sur OKE.
# get/list seulement : ni create, update, patch, delete, ni watch, exec, logs. Aucun Secret dans le ClusterRole.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-ops-post-merge-oke
  namespace: arc-runners-oke
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    app.kubernetes.io/part-of: github-actions-arc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-ops-post-merge-oke-read
  labels:
    app.kubernetes.io/part-of: github-actions-arc
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods, services, persistentvolumeclaims]
    verbs: [get, list]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, backups, scheduledbackups]
    verbs: [get, list]
  - apiGroups: [keda.sh]
    resources: [scaledobjects]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-ops-post-merge-oke-read
  labels:
    app.kubernetes.io/part-of: github-actions-arc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-ops-post-merge-oke-read
subjects:
  - kind: ServiceAccount
    name: kube-ops-post-merge-oke
    namespace: arc-runners-oke
---
# verify-revision.sh : status.sync.revision et status.operationState d'UNE Application.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-ops-post-merge-oke-argocd
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: github-actions-arc
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-ops-post-merge-oke-argocd
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: github-actions-arc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-ops-post-merge-oke-argocd
subjects:
  - kind: ServiceAccount
    name: kube-ops-post-merge-oke
    namespace: arc-runners-oke
---
# URL ntfy : un seul Secret nomme, `get` seulement (le SA ne peut ni lister ni surveiller les Secrets).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-ops-post-merge-oke-ntfy
  namespace: arc-runners-oke
  labels:
    app.kubernetes.io/part-of: github-actions-arc
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [ntfy-publish-url]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-ops-post-merge-oke-ntfy
  namespace: arc-runners-oke
  labels:
    app.kubernetes.io/part-of: github-actions-arc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-ops-post-merge-oke-ntfy
subjects:
  - kind: ServiceAccount
    name: kube-ops-post-merge-oke
    namespace: arc-runners-oke
