# Meme App GitHub ARC que le homelab (Doppler cluster/prd), copiee par ESO depuis doppler-cluster.
# Lue par le controleur et l'ecouteur (arc-systems les recopie) ; jamais montee dans le pod runner.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app
  namespace: arc-runners-oke
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: arc-github-app
    creationPolicy: Owner
  data:
    - secretKey: github_app_id
      remoteRef:
        key: APP_GITHUB_ARC_ID
    - secretKey: github_app_installation_id
      remoteRef:
        key: APP_GITHUB_ARC_INSTALLATION_ID
    - secretKey: github_app_private_key
      remoteRef:
        key: APP_GITHUB_ARC_PRIVATE_KEY
---
# URL de publication ntfy (le topic est le secret) : lue par scripts/post-merge-notify.sh avec le jeton du pod
# (PM_NTFY_SECRET_NS/PM_NTFY_SECRET_NAME), sous UN seul resourceName (rbac.yaml). Jamais un secret GitHub.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-publish-url
  namespace: arc-runners-oke
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: ntfy-publish-url
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: ALERTMANAGER_NTFY_URL
