# PLT-301: names only. Store doppler-cluster reads Doppler cluster/prd.
# Existing keys (used by the homelab): APP_HINDSIGHT_DB_PASSWORD,
# R2_CNPG_WRITER_ACCESS_KEY_ID, R2_CNPG_WRITER_SECRET_ACCESS_KEY, R2_S3_ENDPOINT.
# Keys to create before activation (PLT-301 sub-issues):
# R2_CNPG_RESTORE_RO_ACCESS_KEY_ID, R2_CNPG_RESTORE_RO_SECRET_ACCESS_KEY
# (runbook homelab-infra docs/operations/r2-migration.md, existence not checked),
# APP_HINDSIGHT_OKE_LLM_API_KEY, APP_HINDSIGHT_MCP_API_KEY.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-runtime
  namespace: hindsight
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: hindsight-runtime, creationPolicy: Owner}
  data:
    - secretKey: postgres-password
      remoteRef: {key: APP_HINDSIGHT_DB_PASSWORD}
    # Oracle has no route to the homelab Agentgateway (one-way flow,
    # D-2026-11-11-17): Hindsight calls the LLM provider directly with a
    # dedicated key.
    - secretKey: HINDSIGHT_API_LLM_API_KEY
      remoteRef: {key: APP_HINDSIGHT_OKE_LLM_API_KEY}
    # API and MCP authentication (ApiKeyTenantExtension, schema public).
    - secretKey: HINDSIGHT_API_TENANT_API_KEY
      remoteRef: {key: APP_HINDSIGHT_MCP_API_KEY}
---
# Application role password re-applied by CNPG after the recovery bootstrap.
# Same Doppler key as the homelab: the restored role keeps a known password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-db-app
  namespace: hindsight
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target:
    name: hindsight-db-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: hindsight
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: {key: APP_HINDSIGHT_DB_PASSWORD}
---
# Writer identity of bucket homelab-backup-cnpg (same per-bucket identity as
# the homelab CNPG clusters). Used for the Oracle WAL archive and base backups.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-cnpg-r2-writer
  namespace: hindsight
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: hindsight-cnpg-r2-writer, creationPolicy: Owner}
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: {key: R2_CNPG_WRITER_ACCESS_KEY_ID}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: {key: R2_CNPG_WRITER_SECRET_ACCESS_KEY}
    - secretKey: AWS_ENDPOINT_URL_S3
      remoteRef: {key: R2_S3_ENDPOINT}
---
# Read-only identity of bucket homelab-backup-cnpg: the recovery source (the
# homelab archive) is never written from Oracle.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-cnpg-r2-restore-ro
  namespace: hindsight
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: hindsight-cnpg-r2-restore-ro, creationPolicy: Owner}
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: {key: R2_CNPG_RESTORE_RO_ACCESS_KEY_ID}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: {key: R2_CNPG_RESTORE_RO_SECRET_ACCESS_KEY}
    - secretKey: AWS_ENDPOINT_URL_S3
      remoteRef: {key: R2_S3_ENDPOINT}
