# PLT-303 (drill): dedicated CNPG cluster for Hindsight on Oracle (V1, 50Gi
# oci-bv). Not pg-shared: one volume per database class (plan OKE, section 2).
#
# Bootstrap = EMPTY database (initdb) + the vector extension, like the homelab
# cluster. No data is migrated from the homelab in the drill (mission PLT-303):
# the homelab Hindsight stays the only holder of the real banks and is never
# read or written from here. Test rows are seeded by k8s/optional/hindsight-oke-drill.
# Backup: WAL archive + daily base backup to R2 (writer identity, prefix
# oracle-a1/hindsight-db/), same model as pg-shared (PLT-190).
# Rollback: remove hindsight.yaml from the Oracle root (Cluster: Prune=false).
#
# Image: same PostgreSQL 17.7 standard trixie as the homelab, pinned to the
# multi-arch INDEX digest. The homelab pin sha256:44c64899... is the amd64-only
# manifest and does not run on the A1 (arm64) node.
#
# Storage: one oci-bv volume of 50Gi (OCI minimum, PLT-183), no separate WAL
# volume (it would cost another 50Gi of the 200Gi Always Free block quota).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hindsight-db
  namespace: hindsight
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7-standard-trixie@sha256:e079dae5253fa6ed26fc65fda06d515af764dbec392dd4b46b17ab11eebd8131
  bootstrap:
    initdb:
      database: hindsight
      owner: hindsight
      secret: {name: hindsight-db-app}
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: hindsight-oke-r2
        serverName: hindsight-db
  storage: {size: 50Gi, storageClass: oci-bv}
  resources:
    requests: {cpu: 50m, memory: 384Mi}
    limits: {cpu: "1", memory: 1Gi}
  affinity:
    enablePodAntiAffinity: false
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: hindsight-db-daily
  namespace: hindsight
spec:
  schedule: "0 40 3 * * *"
  immediate: true
  backupOwnerReference: self
  cluster: {name: hindsight-db}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: hindsight-oke-r2
