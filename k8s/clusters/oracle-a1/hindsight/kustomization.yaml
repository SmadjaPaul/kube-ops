# PLT-301: Hindsight on Oracle (D-2026-11-14-03). NOT in apps/kustomization.yaml:
# the Application apps/hindsight.yaml enters the Oracle root only in the drill
# sub-issue, and agents switch to it only after a backup + restore proven off
# Oracle (README.md, section Hindsight).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hindsight
resources:
  - namespace.yaml
  - externalsecrets.yaml
  - objectstores.yaml
  - database.yaml
  - networkpolicy.yaml
helmCharts:
  - name: hindsight
    repo: oci://ghcr.io/vectorize-io/charts
    version: 1.2.1
    releaseName: hindsight
    namespace: hindsight
    valuesFile: values.yaml

# The chart omits hostNetwork/hostPID/hostIPC; set them explicitly.
patches:
  - target: {kind: Deployment}
    patch: |-
      - {op: add, path: /spec/template/spec/hostNetwork, value: false}
      - {op: add, path: /spec/template/spec/hostPID, value: false}
      - {op: add, path: /spec/template/spec/hostIPC, value: false}
