# PLT-303: Hindsight on Oracle (D-2026-11-14-03), in the Oracle root since the
# drill activation. Empty database + test rows (k8s/optional/hindsight-oke-drill);
# agents switch to it only after a backup + restore proven off Oracle (PLT-305).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hindsight
resources:
  - namespace.yaml
  - externalsecrets.yaml
  - objectstores.yaml
  - database.yaml
  # NetworkPolicy : porte par baseline/default-deny.yaml (namespace hindsight).
  # PLT-303 drill imports removed after the proof (fingerprints identical, off-Oracle
  # restore done); sources kept in k8s/optional/hindsight-oke-drill.
helmCharts:
  - name: hindsight
    repo: oci://ghcr.io/vectorize-io/charts
    version: 1.2.1
    releaseName: hindsight
    namespace: hindsight
    valuesFile: values.yaml

# The chart omits hostNetwork/hostPID/hostIPC; set them explicitly.
patches:
  - target: {kind: Deployment}
    patch: |-
      - {op: add, path: /spec/template/spec/hostNetwork, value: false}
      - {op: add, path: /spec/template/spec/hostPID, value: false}
      - {op: add, path: /spec/template/spec/hostIPC, value: false}
