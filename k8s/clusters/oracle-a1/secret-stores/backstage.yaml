# Store Doppler namespace (backstage). Jeton de service read-only, config Doppler oke-backstage
# uniquement (ADR section 6). Le Secret doppler-token est cree par l'operateur dans
# le namespace, jamais dans Git (voir README, section Secrets par domaine).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: doppler
  namespace: backstage
spec:
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            name: doppler-token
            key: dopplerToken
