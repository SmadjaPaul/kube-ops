apiVersion: v1
kind: Service
metadata:
  name: polyfin
  namespace: media
spec:
  selector: {app.kubernetes.io/name: polyfin}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: polyfin-data
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 20Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polyfin
  namespace: media
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: polyfin}
  template:
    metadata:
      labels: {app.kubernetes.io/name: polyfin}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: polyfin
          # multi-arch index (linux/arm64 present).
          image: ghcr.io/moodiness/polyfin:0.61.1
          env:
            - {name: TZ, value: Europe/Paris}
            - {name: POLYFIN_LISTEN, value: ":8096"}
            - {name: POLYFIN_DATA_DIR, value: /data}
            - name: POLYFIN_DATABASE_URL
              valueFrom: {secretKeyRef: {name: polyfin-db-app, key: uri}}
            - name: POLYFIN_SECRET_KEY
              valueFrom: {secretKeyRef: {name: polyfin-bootstrap, key: POLYFIN_SECRET_KEY}}
          ports:
            - {name: http, containerPort: 8096}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: polyfin-data}
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
