# Oracle reclaims an Always Free instance as idle only if, over 7 days, CPU p95
# < 20% AND network < 20% AND memory < 20% (memory rule: A1 only). Holding
# 3 GiB resident (25% of 12 GB) in tmpfs keeps the memory condition false.
# Verify with OCI Monitoring MemoryUtilization on the instance.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-floor
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: memory-floor}
  template:
    metadata:
      labels: {app.kubernetes.io/name: memory-floor}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: hold
          image: alpine:3.20
          command: [sh, -c, "dd if=/dev/urandom of=/mem/hold bs=1M count=3000 && exec sleep infinity"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 5m, memory: 3300Mi}
            limits: {memory: 3600Mi}
          volumeMounts:
            - {name: mem, mountPath: /mem}
      volumes:
        - name: mem
          emptyDir: {medium: Memory, sizeLimit: 3100Mi}
