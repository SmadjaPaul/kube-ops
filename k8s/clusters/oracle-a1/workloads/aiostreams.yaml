# Cluster-internal only: no route, no tunnel hostname. Same hardening and proxy
# switches as the homelab Deployment (direct play: no proxy in the path).
apiVersion: v1
kind: Service
metadata:
  name: aiostreams
  namespace: media
spec:
  selector: {app.kubernetes.io/name: aiostreams}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aiostreams-data
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiostreams
  namespace: media
  annotations:
    secret.reloader.stakater.com/reload: aiostreams-bootstrap
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: aiostreams}
  template:
    metadata:
      labels: {app.kubernetes.io/name: aiostreams}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 2501
        runAsGroup: 2501
        fsGroup: 2501
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: aiostreams
          # multi-arch index (linux/arm64 present); amd64-only digest from the homelab is not reused.
          image: ghcr.io/viren070/aiostreams:v2.37.0
          env:
            - {name: NODE_ENV, value: production}
            - {name: TZ, value: Europe/Paris}
            - {name: PORT, value: "3000"}
            - {name: BASE_URL, value: "http://aiostreams.media.svc.cluster.local"}
            - name: SECRET_KEY
              valueFrom: {secretKeyRef: {name: aiostreams-bootstrap, key: SECRET_KEY}}
            - name: AIOSTREAMS_AUTH
              valueFrom: {secretKeyRef: {name: aiostreams-bootstrap, key: AIOSTREAMS_AUTH}}
            - {name: AIOSTREAMS_AUTH_REQUIRED, value: "true"}
            - {name: LOG_SENSITIVE_INFO, value: "false"}
            - {name: JELLYFIN_PIN_SIGN_IN, value: "false"}
            - {name: AIOSTREAMS_OIDC_ENABLED, value: "false"}
            - {name: FORCE_PROXY_ENABLED, value: "false"}
            - {name: DEFAULT_PROXY_ENABLED, value: "false"}
            - {name: SHARES_FUSE_ENABLED, value: "false"}
            - {name: DISK_CACHE_DIR, value: /tmp/aiostreams-cache}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /api/v1/health, port: http}
          livenessProbe:
            httpGet: {path: /api/v1/health, port: http}
            periodSeconds: 30
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /app/data}
            - {name: temp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: aiostreams-data}
        - name: temp
          emptyDir: {sizeLimit: 2Gi}
