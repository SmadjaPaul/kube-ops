apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-ntfy
  namespace: gatus
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target:
    name: gatus-ntfy
    creationPolicy: Owner
    template:
      data:
        NTFY_AUTHORIZATION: 'Basic {{ printf "gatus:%s" .password | b64enc }}'
  data:
    - secretKey: password
      remoteRef: {key: ORACLE_A1_NTFY_GATUS_PASSWORD}
