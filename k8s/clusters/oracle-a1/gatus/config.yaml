# External supervision of PUBLIC homelab routes (HTTPRoute parentRef
# Gateway/external) from Oracle, over the public internet only: no NetBird,
# no LAN. LAN-only routes (tv.smadja.dev Polyfin, librechat, aiostreams) are deliberately absent.
# State is in memory: history resets on restart (no data on Oracle, PLT-190).
storage:
  type: memory
web:
  port: 8080
alerting:
  custom:
    url: http://ntfy.ntfy.svc.cluster.local/alerts
    method: POST
    headers:
      Authorization: ${NTFY_AUTHORIZATION}
      Title: Gatus homelab
      Priority: high
    body: "[ALERT_TRIGGERED_OR_RESOLVED]: [ENDPOINT_GROUP]/[ENDPOINT_NAME] [ALERT_DESCRIPTION]"
endpoints:
  - name: auth
    group: homelab-public
    url: https://auth.smadja.dev/-/health/live/
    interval: 1m
    conditions: ["[STATUS] < 400"]
    alerts: &alerts
      - {type: custom, failure-threshold: 3, success-threshold: 2, send-on-resolved: true, description: "public route down"}
  - name: ntfy
    group: homelab-public
    url: https://ntfy.smadja.dev/v1/health
    interval: 1m
    conditions: ["[STATUS] == 200"]
    alerts: *alerts
  - name: immich
    group: homelab-public
    url: https://immich.smadja.dev/api/server/ping
    interval: 1m
    conditions: ["[STATUS] == 200"]
    alerts: *alerts
  - name: matrix-chat
    group: homelab-public
    url: https://chat.smadja.dev/
    interval: 1m
    conditions: ["[STATUS] < 400"]
    alerts: *alerts
