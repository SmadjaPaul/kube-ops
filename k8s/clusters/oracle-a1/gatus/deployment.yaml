apiVersion: apps/v1
kind: Deployment
metadata: {name: gatus, namespace: gatus}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: gatus}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gatus}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gatus
          image: ghcr.io/twin/gatus:v5.38.0
          env:
            - {name: GATUS_CONFIG_PATH, value: /config/config.yaml}
            - name: NTFY_AUTHORIZATION
              valueFrom: {secretKeyRef: {name: gatus-ntfy, key: NTFY_AUTHORIZATION}}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe: {httpGet: {path: /health, port: http}}
          livenessProbe: {httpGet: {path: /health, port: http}}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
      volumes:
        - name: config
          configMap: {name: gatus-config}
