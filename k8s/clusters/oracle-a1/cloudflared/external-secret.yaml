apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-token
  namespace: cloudflared
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: cloudflared-token, creationPolicy: Owner}
  data:
    - secretKey: TUNNEL_TOKEN
      remoteRef: {key: ORACLE_A1_CLOUDFLARE_TUNNEL_TOKEN}
