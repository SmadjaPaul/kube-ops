# SecretStore namespaces par domaine (vague 1 : apres ESO (vague 0) et la baseline (vague 0)).
# Sans le Secret doppler-token, les stores restent NotReady ; aucun ExternalSecret
# existant ne les utilise encore : aucune regression.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-stores
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: oracle-a1
  source:
    repoURL: https://github.com/SmadjaPaul/kube-ops.git
    targetRevision: main
    path: k8s/clusters/oracle-a1/secret-stores
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - ServerSideApply=true
