# PLT-256 : pod routeur NetBird (chemin d'administration vers l'API OKE).
# Activé dans apps/kustomization.yaml une fois NETBIRD_SETUP_KEY_OKE présent
# dans Doppler cluster/prd (la clé est à usage unique : un seul démarrage).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netbird-router
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: oracle-a1
  source:
    repoURL: https://github.com/SmadjaPaul/kube-ops.git
    targetRevision: main
    path: k8s/clusters/oracle-a1/netbird-router
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
