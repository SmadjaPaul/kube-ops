# PLT-303: in apps/kustomization.yaml (drill activation). Rollback: remove the
# line from the root; prune is false, the Cluster, its PVC and the ObjectStore stay.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hindsight
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: oracle-a1
  source:
    repoURL: https://github.com/SmadjaPaul/kube-ops.git
    targetRevision: main
    path: k8s/clusters/oracle-a1/hindsight
  destination:
    server: https://kubernetes.default.svc
    namespace: hindsight
  syncPolicy:
    # PLT-303: prune true (same pattern as cnpg-cluster) so that drill imports
    # (Jobs, Backup, ConfigMap) are removed when their import is removed, without
    # any kubectl write. The data kinds are protected per resource: the Cluster
    # and the ObjectStores carry Prune=false,Delete=false; its PVC is created by
    # CNPG, not tracked by Argo.
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
