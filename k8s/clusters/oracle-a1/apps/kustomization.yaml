apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# D-2026-11-11-17 / PLT-253 : seules les briques sans données sont actives
# au bootstrap. cnpg-cluster.yaml (pg-shared) et media.yaml (Polyfin,
# AIOStreams, PVC) restent hors de la racine jusqu'à PLT-190 : sauvegarde
# CNPG hors Oracle (R2) et restauration prouvée hors Oracle.
# PLT-254 / PLT-255 : cloudflared est actif : le tunnel oracle-a1 (configuration
# 404 seule, aucun hostname publié) et son token Doppler existent (cluster/prd).
# Retour en arrière : retirer cette ligne.
# PLT-328 (décision de Paul, 15/11/2026) : ntfy et gatus retirés de la racine.
# Les alertes passent par ntfy.sh (receiver Alertmanager du homelab, check
# Healthchecks), pas par un ntfy auto-hébergé sur OKE. Retour en arrière : Git
# revert ; clés Doppler ORACLE_A1_NTFY_* conservées.
# PLT-301 : cert-manager (vague -1) et le plugin barman-cloud (vague 1) sont
# actifs : sans données, prérequis de toute sauvegarde CNPG vers R2.
# PLT-309 : observability.yaml (Alloy + kube-state-metrics vers Grafana Cloud)
# est actif. Retour en arrière : retirer cette ligne de la racine.
# PLT-256 : netbird-router (accès admin à l'API OKE, NET_ADMIN) actif ; retour en
# arrière : retirer cette ligne.
# PLT-257 : agent-operator (SA + RBAC de lecture seule des agents) actif.
# PLT-190 : cnpg-cluster (pg-shared, sauvegarde R2) actif pour le drill de
# restauration hors Oracle ; media.yaml reste HORS racine tant que la restauration
# n'est pas prouvée. Retour en arrière : retirer cette ligne (Cluster en Prune=false).
# PLT-303 : hindsight (base vide + données de test, API, sauvegarde R2) actif pour
# le drill ; retour en arrière : retirer cette ligne (Cluster en Prune=false).
resources:
  - baseline.yaml
  - secret-stores.yaml
  - guardrails.yaml
  - external-secrets.yaml
  - cert-manager.yaml
  - cnpg-operator.yaml
  - cnpg-barman-plugin.yaml
  - observability.yaml
  - netbird-router.yaml
  - agent-operator.yaml
  - cnpg-cluster.yaml
  - hindsight.yaml
  - cloudflared.yaml
