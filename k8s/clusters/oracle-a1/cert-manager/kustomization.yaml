# PLT-301: cert-manager on Oracle exists only for the CNPG barman-cloud plugin
# (its gRPC TLS uses a self-signed Issuer and Certificates). No ACME issuer,
# no Cloudflare credential: public certificates stay at the Cloudflare edge.
# The homelab base is not reused: it ships the homelab issuers and their
# Doppler secrets. Chart version tracks the homelab base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: v1.20.2
    releaseName: cert-manager
    namespace: cert-manager
    valuesFile: values.yaml

# The chart omits hostNetwork/hostPID/hostIPC; set them explicitly.
patches:
  - target: {kind: Deployment}
    patch: |-
      - {op: add, path: /spec/template/spec/hostNetwork, value: false}
      - {op: add, path: /spec/template/spec/hostPID, value: false}
      - {op: add, path: /spec/template/spec/hostIPC, value: false}
