crds:
  enabled: true
  keep: true
global:
  # Leader election in its own namespace: the oracle-a1 AppProject does not
  # admit kube-system.
  leaderElection:
    namespace: cert-manager
replicaCount: 1
resources:
  requests: {cpu: 10m, memory: 64Mi}
  limits: {cpu: 100m, memory: 128Mi}
webhook:
  replicaCount: 1
  resources:
    requests: {cpu: 10m, memory: 48Mi}
    limits: {cpu: 100m, memory: 96Mi}
cainjector:
  replicaCount: 1
  resources:
    requests: {cpu: 10m, memory: 96Mi}
    limits: {cpu: 100m, memory: 192Mi}
startupapicheck:
  enabled: false
