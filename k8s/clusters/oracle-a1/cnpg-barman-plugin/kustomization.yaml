# PLT-301: CNPG barman-cloud plugin on Oracle (same release as the homelab base
# k8s/infrastructure/database/cloudnative-pg). Separate Application at a later
# sync-wave than cert-manager: the manifest ships an Issuer and Certificates.
# Images ghcr.io/cloudnative-pg/plugin-barman-cloud{,-sidecar}:v0.11.0 publish
# linux/arm64 (registry index checked 2026-11-14).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.11.0/manifest.yaml
