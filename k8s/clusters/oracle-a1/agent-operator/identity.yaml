# PLT-257 : ServiceAccount agent-operator d'OKE. Le jeton n'est ni monté ni
# stocké dans le cluster : il est émis par TokenRequest (720 h) par
# scripts/agent-operator-oke-token.sh et distribué par Doppler
# infrastructure/prd (KUBERNETES_AGENT_OPERATOR_KUBECONFIG_ORACLE_A1 + _SHA256).
# Namespace `argocd` : l'AppProject oracle-a1 est appliqué à la main (jamais
# synchronisé) ; un nouveau namespace exigerait une réamorce par l'opérateur.
# Identité effective : system:serviceaccount:argocd:agent-operator.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-operator
  namespace: argocd
  labels:
    app.kubernetes.io/name: agent-operator
    app.kubernetes.io/part-of: security
automountServiceAccountToken: false
