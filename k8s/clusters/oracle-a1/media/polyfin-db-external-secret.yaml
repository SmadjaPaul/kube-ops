# Connection URI for the shared CNPG cluster (same Doppler key as the role).
# The password is percent-encoded in the URI only; the raw value is kept as is.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: polyfin-db-app
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target:
    name: polyfin-db-app
    creationPolicy: Owner
    template:
      data:
        password: "{{ .password }}"
        uri: 'postgresql://polyfin:{{ .password | urlquery | replace "+" "%20" }}@pg-shared-rw.databases.svc:5432/polyfin?sslmode=require'
  data:
    - secretKey: password
      remoteRef: {key: ORACLE_A1_POSTGRES_PASSWORD}
