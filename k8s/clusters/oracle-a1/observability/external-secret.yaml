# Push contract written to Doppler cluster/prd by homelab-infra
# terraform/grafana-cloud (oracle-a1 write-only token).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alloy-grafana-cloud
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: alloy-grafana-cloud
    creationPolicy: Owner
  data:
    - secretKey: GRAFANA_CLOUD_PROMETHEUS_URL
      remoteRef:
        key: GRAFANA_CLOUD_PROMETHEUS_URL
    - secretKey: GRAFANA_CLOUD_PROMETHEUS_USERNAME
      remoteRef:
        key: GRAFANA_CLOUD_PROMETHEUS_USERNAME
    - secretKey: GRAFANA_CLOUD_LOKI_URL
      remoteRef:
        key: GRAFANA_CLOUD_LOKI_URL
    - secretKey: GRAFANA_CLOUD_LOKI_USERNAME
      remoteRef:
        key: GRAFANA_CLOUD_LOKI_USERNAME
    - secretKey: GRAFANA_CLOUD_WRITE_TOKEN
      remoteRef:
        key: GRAFANA_CLOUD_ORACLE_A1_WRITE_TOKEN
