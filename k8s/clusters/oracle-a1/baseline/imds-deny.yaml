# Interdit l'IMDS OCI (instance principal) depuis tout pod (ADR section 3 et 7).
# CiliumClusterwideNetworkPolicy : egressDeny, s'ajoute aux autres policies.
# Limite : csi-oci-node tourne en hostNetwork et n'est pas couvert (test a faire).
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-imds
spec:
  endpointSelector: {}
  egressDeny:
    - toCIDR: ["169.254.169.254/32"]
