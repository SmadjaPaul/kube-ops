# Interdit l'IMDS OCI (169.254.169.254, identite instance principal du noeud) depuis tout pod.
#
# Deux CiliumClusterwideNetworkPolicy, a appliquer ENSEMBLE (constate sur le cluster du 17/11/2026) :
#  - deny-imds : egressDeny 169.254.169.254 sur 80 et 443. Le port 53 reste ouvert : le resolveur VCN
#    d'OKE est 169.254.169.254 et CoreDNS y forward. Selectionne TOUS les endpoints Cilium.
#  - allow-egress-unisolated : un egressDeny SEUL met chaque endpoint selectionne en default-deny egress
#    (DNS, API et Internet coupes pour tout pod). Les namespaces non isoles recoivent donc un allow-all
#    explicite ; le deny prevaut sur l'allow.
#    Exclusion (#1629) : un namespace qui porte le label platform.smadja.dev/egress-isolated=true ne
#    recoit PAS cet allow-all ; son egress est regi par ses propres politiques (default-deny + allow
#    listes). NotIn selectionne aussi les namespaces sans ce label.
# Limites : un pod hostNetwork (csi-oci-node, vcn-native-ip-cni, kube-proxy, cilium dans kube-system)
# partage la pile du noeud et n'est pas couvert. Un pod demarre AVANT l'agent Cilium n'est pas un
# endpoint Cilium tant qu'il n'a pas redemarre (doc Cilium OKE).
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-egress-unisolated
spec:
  endpointSelector:
    matchExpressions:
      - key: io.cilium.k8s.namespace.labels.platform.smadja.dev/egress-isolated
        operator: NotIn
        values: ["true"]
  egress:
    - toEntities: [all]
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-imds
spec:
  endpointSelector: {}
  egressDeny:
    - toCIDRSet:
        - cidr: 169.254.169.254/32
      toPorts:
        - ports:
            - {port: "80", protocol: TCP}
            - {port: "443", protocol: TCP}
