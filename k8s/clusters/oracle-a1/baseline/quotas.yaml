# LimitRange + ResourceQuota des namespaces applicatifs d'OKE (noeud A1 unique : 2 OCPU, 12 Go).
# whoami : 1 replica a 10m/16Mi (limits 100m/64Mi), marge pour un rolling update.
# baseline-probe : un Job de sonde a la fois.
# Les valeurs sont relues par tests/oke-baseline/expected-quotas.tsv.
apiVersion: v1
kind: LimitRange
metadata: {name: defaults, namespace: whoami}
spec:
  limits:
    - type: Container
      default: {memory: 64Mi, cpu: 100m}
      defaultRequest: {memory: 16Mi, cpu: 10m}
      max: {memory: 256Mi, cpu: 500m}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: compute, namespace: whoami}
spec:
  hard:
    requests.cpu: 100m
    requests.memory: 128Mi
    limits.memory: 512Mi
    pods: "4"
---
apiVersion: v1
kind: LimitRange
metadata: {name: defaults, namespace: baseline-probe}
spec:
  limits:
    - type: Container
      default: {memory: 64Mi, cpu: 100m}
      defaultRequest: {memory: 16Mi, cpu: 10m}
      max: {memory: 128Mi, cpu: 200m}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: compute, namespace: baseline-probe}
spec:
  hard:
    requests.cpu: 50m
    requests.memory: 64Mi
    limits.memory: 256Mi
    pods: "2"
