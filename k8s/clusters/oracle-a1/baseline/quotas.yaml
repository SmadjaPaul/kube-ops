# ResourceQuota et LimitRange par namespace applicatif (A1 : 8,4 GiB allouables au total).
# LimitRange : defauts pour les pods sans requests/limits (sinon refus par quota).
apiVersion: v1
kind: LimitRange
metadata: {name: defaults, namespace: auth}
spec:
  limits:
    - type: Container
      default: {memory: 512Mi, cpu: 500m}
      defaultRequest: {memory: 128Mi, cpu: 50m}
      max: {memory: 1Gi, cpu: "1"}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: compute, namespace: auth}
spec:
  hard:
    requests.cpu: "400m"
    requests.memory: 1Gi
    limits.memory: 1536Mi
    pods: "8"
---
apiVersion: v1
kind: LimitRange
metadata: {name: defaults, namespace: backstage}
spec:
  limits:
    - type: Container
      default: {memory: 384Mi, cpu: 300m}
      defaultRequest: {memory: 128Mi, cpu: 50m}
      max: {memory: 768Mi, cpu: "1"}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: compute, namespace: backstage}
spec:
  hard:
    requests.cpu: "300m"
    requests.memory: 512Mi
    limits.memory: 768Mi
    pods: "5"
---
