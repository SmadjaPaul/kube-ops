# Default-deny ingress + egress par namespace applicatif, puis allow explicites.
# Appliquees par Cilium (CNI chaining). Matrice de flux : ADR section 5.
# Les namespaces d'infrastructure (argocd, external-secrets, cnpg-system,
# cert-manager, monitoring, cloudflared) ne sont pas isoles ici : leurs besoins
# (API, GitHub, Doppler, NetBird, Grafana Cloud) sont en phase 2, documentes dans le README.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: auth}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: hindsight}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: databases}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# DNS (kube-dns / CoreDNS) : tous les pods des namespaces isoles.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns, namespace: auth}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns, namespace: hindsight}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns, namespace: databases}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
---
# Ingress applicatif : cloudflared (tunnel) et services internes uniquement.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-ingress-auth, namespace: auth}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cloudflared}}
      ports: [{port: 9000, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-ingress-hindsight, namespace: hindsight}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cloudflared}}
      ports: [{port: 8888, protocol: TCP}]
    # Operateur CNPG (statut) : meme port que l'ancien intent hindsight/networkpolicy.yaml.
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cnpg-system}}
      ports: [{port: 8000, protocol: TCP}]
---
# pg-shared (namespace databases) : intra-namespace (replication, instance manager)
# et operateur CNPG (8000, 5432). Aucun client applicatif n'est ouvert ici : Hindsight
# garde son cluster dedie hindsight-db (namespace hindsight, intra-namespace). Le flux
# 5432 d'un client est ajoute par la PR qui cree sa Database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-ingress-databases, namespace: databases}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cnpg-system}}
      ports: [{port: 8000, protocol: TCP}, {port: 5432, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-egress-hindsight, namespace: hindsight}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-egress-databases, namespace: databases}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {}
