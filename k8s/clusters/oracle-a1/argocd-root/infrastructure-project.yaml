apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infrastructure
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: infrastructure
    app.kubernetes.io/managed-by: argocd
spec:
  description: Infrastructure d'OKE (oracle-a1), reconciliee depuis kube-ops
  sourceRepos:
    - https://github.com/SmadjaPaul/kube-ops.git
  destinations:
    # Les manifestes rendus portent leur namespace explicite : destination vide.
    - namespace: ''
      server: https://kubernetes.default.svc
  # Liste fermee : ajouter un kind cluster-scoped d'infrastructure passe par une PR sur ce fichier.
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicyBinding
    # External Secrets (PLT-406) : CRD, webhooks de validation et RBAC cluster du chart.
    # agent-operator utilisait deja ClusterRole et ClusterRoleBinding.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
