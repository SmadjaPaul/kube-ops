# Baseline d'OKE (PLT-405) : une Application `infra-<dossier>` par dossier liste ci-dessous.
# Liste explicite (comme le homelab) : les anciens overlays de k8s/clusters/oracle-a1/ (hindsight,
# cnpg-*, media...) restent dormants et ne sont reconcilies par rien.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  namespace: argocd
  name: infrastructure
  labels:
    app.kubernetes.io/part-of: infrastructure
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
    argocd.argoproj.io/sync-options: Prune=false
spec:
  generators:
    - git:
        repoURL: https://github.com/SmadjaPaul/kube-ops.git
        revision: main
        directories:
          # VAP qui refuse `Service type: LoadBalancer` (PLT-260, Always Free).
          - path: k8s/clusters/oracle-a1/guardrails
          # Lecture seule des agents (SA argocd/agent-operator, RBAC view sans Secret) :
          # requis par scripts/agent-operator-oke-token.sh --provision.
          - path: k8s/clusters/oracle-a1/agent-operator
          # External Secrets + ClusterSecretStore doppler-cluster seul (PLT-406). Le Secret
          # doppler-access-token n'est pas en Git : geste unique de Paul (README).
          - path: k8s/clusters/oracle-a1/external-secrets
          # Pair NetBird `oke-oracle-a1-router` (groupe OKE Routers) : chemin admin vers l'API privee.
          # Apres external-secrets (secret NB_SETUP_KEY via doppler-cluster ; l'Application retente).
          - path: k8s/clusters/oracle-a1/netbird-router
          # Export Grafana Cloud (alloy + kube-state-metrics, label cluster=oracle-a1) : sans lui,
          # scripts/verify-delivery.sh ne voit aucune app d'OKE. Secret via doppler-cluster (apres external-secrets).
          - path: k8s/clusters/oracle-a1/observability
          # Cilium en CNI chaining sur le CNI OCI (PLT-384) : application des NetworkPolicy/CNP/CCNP.
          - path: k8s/clusters/oracle-a1/cilium
          # Baseline reseau (PLT-384) : CCNP deny-imds + allow-egress-unisolated, default-deny whoami,
          # quotas, sonde continue. Ses CRD cilium.io viennent de cilium-operator : l'Application retente
          # (retry ci-dessous) jusqu'a leur enregistrement.
          - path: k8s/clusters/oracle-a1/baseline
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: 'infra-{{ path.basename }}'
      namespace: argocd
      labels:
        app.kubernetes.io/component: 'static-infrastructure'
        app.kubernetes.io/part-of: infrastructure
        kube-ops.dev/cluster: oracle-a1
    spec:
      project: infrastructure
      source:
        repoURL: https://github.com/SmadjaPaul/kube-ops.git
        targetRevision: main
        path: '{{ path }}'
        kustomize: {}
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
          - PruneLast=true
