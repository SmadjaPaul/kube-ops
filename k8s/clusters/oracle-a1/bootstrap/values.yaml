# Argo CD propre a OKE (D-2026-11-21-01, un Argo CD par cluster): pull mode, no ingress, no SSO.
# Break-glass access is the local admin account over port-forward/NetBird.
configs:
  cm:
    create: true
    application.resourceTrackingMethod: annotation
    admin.enabled: true
    kustomize.buildOptions: '--enable-helm'
  params:
    server.insecure: true
    controller.diff.server.side: true
    reposerver.parallelism.limit: "1"
    controller.sync.timeout.seconds: "1800"
  rbac:
    policy.default: role:readonly

global:
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch

crds:
  install: true
  keep: true

dex:
  enabled: false
notifications:
  enabled: false
# PLT-405 : un ApplicationSet `apps` (git files generator) cree les Applications d'OKE.
applicationSet:
  enabled: true
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

controller:
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  emptyDir: {sizeLimit: 1Gi}
server:
  replicas: 1
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  emptyDir: {sizeLimit: 256Mi}
repoServer:
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  emptyDir: {sizeLimit: 2Gi}
redis:
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: {type: RuntimeDefault}
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 250m, memory: 128Mi}
redisSecretInit:
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: {type: RuntimeDefault}
