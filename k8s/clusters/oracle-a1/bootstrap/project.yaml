apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: oracle-a1
  namespace: argocd
spec:
  description: Oracle cluster Argo CD; same repository, in-cluster destination only
  sourceRepos:
    - https://github.com/SmadjaPaul/kube-ops.git
  destinations:
    - {server: https://kubernetes.default.svc, namespace: argocd}
    - {server: https://kubernetes.default.svc, namespace: external-secrets}
    - {server: https://kubernetes.default.svc, namespace: cnpg-system}
    - {server: https://kubernetes.default.svc, namespace: databases}
    - {server: https://kubernetes.default.svc, namespace: cloudflared}
    - {server: https://kubernetes.default.svc, namespace: media}
    - {server: https://kubernetes.default.svc, namespace: ntfy}
    - {server: https://kubernetes.default.svc, namespace: gatus}
  # Explicit list (PLT-254): CRDs, RBAC, webhooks and Namespaces shipped by ESO,
  # CNPG, ntfy and gatus, plus the ClusterSecretStore of the ESO base.
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
    - {group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration}
    - {group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration}
    - {group: external-secrets.io, kind: ClusterSecretStore}
    - {group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicy}
    - {group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicyBinding}
