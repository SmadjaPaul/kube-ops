apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: oracle-a1
  namespace: argocd
spec:
  description: Oracle cluster Argo CD; same repository, in-cluster destination only
  sourceRepos:
    - https://github.com/SmadjaPaul/kube-ops.git
  destinations:
    - {server: https://kubernetes.default.svc, namespace: argocd}
    - {server: https://kubernetes.default.svc, namespace: external-secrets}
    - {server: https://kubernetes.default.svc, namespace: cnpg-system}
    - {server: https://kubernetes.default.svc, namespace: databases}
    - {server: https://kubernetes.default.svc, namespace: cloudflared}
    - {server: https://kubernetes.default.svc, namespace: media}
    - {server: https://kubernetes.default.svc, namespace: ntfy}
    - {server: https://kubernetes.default.svc, namespace: gatus}
  # Operators ship CRDs, ClusterRoles and webhooks; namespaces stay bounded above.
  clusterResourceWhitelist:
    - {group: "*", kind: "*"}
