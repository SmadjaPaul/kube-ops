# One-time operator bootstrap on the Oracle cluster (never synced by the
# homelab Argo CD):
#   kustomize build --enable-helm k8s/clusters/oracle-a1/bootstrap | kubectl apply --server-side -f -
# kubectl has no --enable-helm. Re-run the same command once if the
# Application/AppProject CRDs were not yet established on the first pass.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - project.yaml
  - root-application.yaml

helmCharts:
  - name: argo-cd
    namespace: argocd
    releaseName: argocd
    repo: https://argoproj.github.io/argo-helm
    version: 10.3.3
    valuesFile: values.yaml

# Chart 10.3.3 omits hostNetwork/hostPID/hostIPC; k8s/CLAUDE.md requires them
# explicit. Covers controller (StatefulSet), server, repo-server, redis
# (Deployments) and the redis-secret-init Job.
patches:
  - target: {kind: Deployment}
    patch: |-
      - op: add
        path: /spec/template/spec/hostNetwork
        value: false
      - op: add
        path: /spec/template/spec/hostPID
        value: false
      - op: add
        path: /spec/template/spec/hostIPC
        value: false
  - target: {kind: StatefulSet}
    patch: |-
      - op: add
        path: /spec/template/spec/hostNetwork
        value: false
      - op: add
        path: /spec/template/spec/hostPID
        value: false
      - op: add
        path: /spec/template/spec/hostIPC
        value: false
  - target: {kind: Job}
    patch: |-
      - op: add
        path: /spec/template/spec/hostNetwork
        value: false
      - op: add
        path: /spec/template/spec/hostPID
        value: false
      - op: add
        path: /spec/template/spec/hostIPC
        value: false
