# Bootstrap operateur de l'Argo CD d'OKE (jamais synchronise par un Argo CD) :
#   bash scripts/oke-bootstrap.sh --kubeconfig <fichier>
# Le script rend ce dossier (kustomize --enable-helm), applique d'abord le namespace et les CRD,
# puis le projet `bootstrap` et l'Application `root`. Procedure : k8s/clusters/oracle-a1/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - bootstrap-project.yaml
  - root-application.yaml

helmCharts:
  - name: argo-cd
    namespace: argocd
    releaseName: argocd
    repo: https://argoproj.github.io/argo-helm
    # Meme chart que le homelab (k8s/infrastructure/controllers/argocd) : Argo CD v3.5.1.
    version: 10.3.3
    valuesFile: values.yaml

# Le chart omet hostNetwork/hostPID/hostIPC ; k8s/CLAUDE.md les exige explicites
# (controleur StatefulSet, serveurs, redis, applicationset, Job redis-secret-init).
patches:
  - target: {kind: Deployment}
    patch: |-
      - op: add
        path: /spec/template/spec/hostNetwork
        value: false
      - op: add
        path: /spec/template/spec/hostPID
        value: false
      - op: add
        path: /spec/template/spec/hostIPC
        value: false
  - target: {kind: StatefulSet}
    patch: |-
      - op: add
        path: /spec/template/spec/hostNetwork
        value: false
      - op: add
        path: /spec/template/spec/hostPID
        value: false
      - op: add
        path: /spec/template/spec/hostIPC
        value: false
  - target: {kind: Job}
    patch: |-
      - op: add
        path: /spec/template/spec/hostNetwork
        value: false
      - op: add
        path: /spec/template/spec/hostPID
        value: false
      - op: add
        path: /spec/template/spec/hostIPC
        value: false
