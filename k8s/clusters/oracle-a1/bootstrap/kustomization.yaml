# One-time operator bootstrap on the Oracle cluster (never synced by the
# homelab Argo CD): kubectl apply -k --enable-helm k8s/clusters/oracle-a1/bootstrap
# Re-run once if the Application/AppProject CRDs were not yet established.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - project.yaml
  - root-application.yaml

helmCharts:
  - name: argo-cd
    namespace: argocd
    releaseName: argocd
    repo: https://argoproj.github.io/argo-helm
    version: 10.3.3
    valuesFile: values.yaml
