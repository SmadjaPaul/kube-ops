apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oracle-a1-root
  namespace: argocd
spec:
  project: oracle-a1
  source:
    repoURL: https://github.com/SmadjaPaul/kube-ops.git
    targetRevision: main
    # Root is limited to the Oracle cluster tree; shared bases are only read
    # through the overlays that live under k8s/clusters/oracle-a1/.
    path: k8s/clusters/oracle-a1/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
