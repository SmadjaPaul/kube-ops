# Racine de l'Argo CD d'OKE : reconcilie k8s/clusters/oracle-a1/argocd-root (projets et ApplicationSets).
# Appliquee une seule fois par scripts/oke-bootstrap.sh ; ensuite elle se reconcilie seule depuis Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: gitops
    app.kubernetes.io/component: root
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
spec:
  project: bootstrap
  source:
    repoURL: https://github.com/SmadjaPaul/kube-ops.git
    targetRevision: main
    path: k8s/clusters/oracle-a1/argocd-root
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
