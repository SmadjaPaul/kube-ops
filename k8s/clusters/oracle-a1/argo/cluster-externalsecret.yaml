apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-oracle-a1
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: cluster-oracle-a1
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: cluster
      data:
        name: oracle-a1
        server: "{{ .server }}"
        config: |
          {"bearerToken":"{{ .token }}","tlsClientConfig":{"insecure":false,"caData":"{{ .ca }}"}}
  data:
    - secretKey: server
      remoteRef:
        key: ORACLE_A1_API_SERVER
    - secretKey: token
      remoteRef:
        key: ORACLE_A1_ARGO_BEARER_TOKEN
    - secretKey: ca
      remoteRef:
        key: ORACLE_A1_API_CA_B64
