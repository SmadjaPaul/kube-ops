apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media-oracle-a1
  namespace: argocd
spec:
  project: oracle-a1
  source:
    repoURL: https://github.com/SmadjaPaul/kube-ops.git
    targetRevision: main
    path: k8s/clusters/oracle-a1/workloads
  destination:
    name: oracle-a1
    namespace: media
  # Manual sync during the test phase: rollback = delete this Application.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
