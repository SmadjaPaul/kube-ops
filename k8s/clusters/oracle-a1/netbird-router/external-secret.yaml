apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-router-setup-key
  namespace: netbird
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: netbird-router-setup-key, creationPolicy: Owner}
  data:
    - secretKey: NB_SETUP_KEY
      remoteRef: {key: NETBIRD_SETUP_KEY_OKE}
