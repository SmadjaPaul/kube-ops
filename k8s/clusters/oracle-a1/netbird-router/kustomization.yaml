apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# PLT-256: NetBird routing peer for the admin path to the OKE API. Out of the
# Argo root until the setup key exists (see README of this cluster).
# Deployed in the `cloudflared` namespace (already admitted by the AppProject,
# so no operator re-bootstrap of bootstrap/project.yaml is needed).
namespace: cloudflared
resources:
  - external-secret.yaml
  - deployment.yaml
