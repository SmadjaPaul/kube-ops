apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-gatus-user
  namespace: ntfy
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: ntfy-gatus-user, creationPolicy: Owner}
  data:
    - secretKey: NTFY_PASSWORD
      remoteRef: {key: ORACLE_A1_NTFY_GATUS_PASSWORD}
