# Surcharge OKE (chargee en dernier). Pas de secret. L'hote doit correspondre a
# oracle_a1_backstage_hostname (homelab-infra #606, Cloudflare Access).
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-config
  namespace: backstage
data:
  app-config.oke.yaml: |
    app:
      title: Backstage IDP (oracle-a1)
      baseUrl: https://backstage-oke.smadja.dev
    backend:
      baseUrl: https://backstage-oke.smadja.dev
      cors:
        origin: https://backstage-oke.smadja.dev
