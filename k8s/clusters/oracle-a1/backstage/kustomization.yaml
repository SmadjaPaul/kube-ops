# Overlay Backstage oracle-a1 (PR MANDAT #1618). Racine Argo : apps/backstage.yaml.
# Dependances : baseline (#1620) cree le namespace backstage (PSA restricted), les
# NetworkPolicy et le SecretStore doppler ; contrat PostgreSQL (#1621) cree la base
# backstage et le role. Image epinglee par digest (CI image-build, main, run d5d4ffd).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: backstage
resources:
  - serviceaccount.yaml
  - externalsecret.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
