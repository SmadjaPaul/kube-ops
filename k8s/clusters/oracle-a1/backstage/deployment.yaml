# Backstage 1.56.5 sur OKE (arm64), namespace backstage (PSA restricted, baseline #1620).
# Base : PostgreSQL pg-shared (BACKSTAGE_DB_MODE=pg, defaut). Mode SQLite ephemere = test explicite
# (BACKSTAGE_DB_MODE=sqlite), jamais par defaut. Flux reseau : baseline (#1620) : cloudflared ->
# 7007, backstage -> databases:5432, backstage -> api.github.com:443, DNS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: backstage}
  template:
    metadata:
      labels: {app.kubernetes.io/name: backstage}
    spec:
      serviceAccountName: backstage
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: backstage
          image: ghcr.io/smadjapaul/backstage@sha256:4758cb574cb18f78edefd9d8ff11c14098ca4f3ba96ade9c96daa94a8ae43606
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /tmp/backstage-data
              set -- --config app-config.yaml --config app-config.production.yaml
              case "${BACKSTAGE_DB_MODE:-pg}" in
                pg) set -- "$@" --config app-config.database-pg.yaml ;;
                sqlite) ;;
                *) echo "BACKSTAGE_DB_MODE invalide" >&2; exit 1 ;;
              esac
              exec node packages/backend "$@" --config /etc/backstage/app-config.oke.yaml
          ports:
            - {name: http, containerPort: 7007}
          env:
            - {name: BACKSTAGE_DB_MODE, value: pg}
            - {name: BACKSTAGE_PG_HOST, value: pg-shared-rw.databases.svc.cluster.local}
            - {name: BACKSTAGE_PG_PORT, value: "5432"}
            - {name: BACKSTAGE_PG_USER, value: backstage}
            - {name: BACKSTAGE_PG_DATABASE, value: backstage}
            - name: BACKSTAGE_PG_PASSWORD
              valueFrom: {secretKeyRef: {name: backstage-db, key: password}}
          envFrom:
            - secretRef: {name: backstage-runtime}
          startupProbe:
            httpGet: {path: /.backstage/health/v1/liveness, port: http}
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /.backstage/health/v1/liveness, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet: {path: /.backstage/health/v1/readiness, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: config, mountPath: /etc/backstage, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
        - name: config
          configMap: {name: backstage-config}
