# Runtime Backstage. Noms de cles Doppler cluster/prd (valeurs jamais dans Git) :
#   BACKSTAGE_GH_APP_ID, BACKSTAGE_GH_APP_CLIENT_ID, BACKSTAGE_GH_APP_CLIENT_SECRET,
#   BACKSTAGE_GH_APP_KEY_PEM (GitHub App limitee a SmadjaPaul/kube-ops),
#   BACKSTAGE_AGENT_A_TOKEN, BACKSTAGE_AGENT_B_TOKEN (tokens statiques des agents).
# Pas de mot de passe PostgreSQL : base SQLite ephemere (voir docs/platform/backstage-hosting.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-runtime
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target:
    name: backstage-runtime
    creationPolicy: Owner
  data:
    - secretKey: BACKSTAGE_GH_APP_ID
      remoteRef: {key: BACKSTAGE_GH_APP_ID}
    - secretKey: BACKSTAGE_GH_APP_CLIENT_ID
      remoteRef: {key: BACKSTAGE_GH_APP_CLIENT_ID}
    - secretKey: BACKSTAGE_GH_APP_CLIENT_SECRET
      remoteRef: {key: BACKSTAGE_GH_APP_CLIENT_SECRET}
    - secretKey: BACKSTAGE_GH_APP_KEY_PEM
      remoteRef: {key: BACKSTAGE_GH_APP_KEY_PEM}
    - secretKey: BACKSTAGE_AGENT_A_TOKEN
      remoteRef: {key: BACKSTAGE_AGENT_A_TOKEN}
    - secretKey: BACKSTAGE_AGENT_B_TOKEN
      remoteRef: {key: BACKSTAGE_AGENT_B_TOKEN}
