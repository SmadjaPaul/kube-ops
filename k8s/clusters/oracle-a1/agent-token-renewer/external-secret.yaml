# Jeton d'ecriture Doppler limite a agent-access/prd (geste unique de Paul : cle AGENT_ACCESS_DOPPLER_WRITE_TOKEN
# dans oke/prd, README). Tant que la cle manque, l'ExternalSecret reste en erreur et le Job echoue sans rien ecrire.
# ClusterSecretStore doppler-cluster existant : pas de SecretStore dedie (le fournisseur Doppler d'ESO ne gere pas
# PushSecret, le Job ecrit donc par l'API Doppler).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-access-doppler
  namespace: agent-token-renewer
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-cluster
  target:
    name: agent-access-doppler
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: AGENT_ACCESS_DOPPLER_WRITE_TOKEN
