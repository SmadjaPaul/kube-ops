apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# PLT-481 : renouvellement automatique du jeton agent-operator d'OKE. Namespace `argocd` pour le Role
# (TokenRequest), namespace `agent-token-renewer` pour le Job. Voir README.md.
resources:
  - namespace.yaml
  - rbac.yaml
  - external-secret.yaml
  - egress-policy.yaml
  - cronjob.yaml
configMapGenerator:
  - name: agent-token-renewer-script
    namespace: agent-token-renewer
    files:
      - renew.sh
