apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: polyfin-nebula-config
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: polyfin-nebula-config
    creationPolicy: Owner
  data:
    - secretKey: manifestUrl
      remoteRef:
        key: APP_POLYFIN_NEBULA_MANIFEST_URL
