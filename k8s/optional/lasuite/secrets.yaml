apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lasuite-docs-runtime
  namespace: lasuite
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: lasuite-docs-runtime, creationPolicy: Owner}
  data:
    - secretKey: DJANGO_SECRET_KEY
      remoteRef: {key: APP_LASUITE_DOCS_DJANGO_SECRET_KEY}
    - secretKey: OIDC_RP_CLIENT_ID
      remoteRef: {key: APP_LASUITE_DOCS_OIDC_CLIENT_ID}
    - secretKey: OIDC_RP_CLIENT_SECRET
      remoteRef: {key: APP_LASUITE_DOCS_OIDC_CLIENT_SECRET}
    - secretKey: AWS_S3_ACCESS_KEY_ID
      remoteRef: {key: APP_LASUITE_DOCS_S3_ACCESS_KEY_ID}
    - secretKey: AWS_S3_SECRET_ACCESS_KEY
      remoteRef: {key: APP_LASUITE_DOCS_S3_SECRET_ACCESS_KEY}
    - secretKey: REDIS_URL
      remoteRef: {key: APP_LASUITE_DOCS_REDIS_URL}
    - secretKey: DJANGO_CELERY_BROKER_URL
      remoteRef: {key: APP_LASUITE_DOCS_REDIS_URL}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lasuite-yhub-runtime
  namespace: lasuite
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: lasuite-yhub-runtime, creationPolicy: Owner}
  data:
    - secretKey: POSTGRES
      remoteRef: {key: APP_LASUITE_YHUB_POSTGRES_URI}
    - secretKey: REDIS
      remoteRef: {key: APP_LASUITE_YHUB_REDIS_URL}
---
