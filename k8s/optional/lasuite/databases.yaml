apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: lasuite-docs-db
  namespace: lasuite
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  instances: 1
  bootstrap:
    initdb:
      database: docs
      owner: docs
  storage:
    storageClass: longhorn-fast
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
---
