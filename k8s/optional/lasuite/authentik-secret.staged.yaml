# STAGED only. Do not add to Authentik root before the Doppler keys exist.
# The same values must be supplied to the La Suite app runtime ESO.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-lasuite-docs
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: authentik-blueprint-lasuite-docs, creationPolicy: Owner}
  data:
    - secretKey: LASUITE_DOCS_OIDC_CLIENT_SECRET
      remoteRef: {key: APP_LASUITE_DOCS_OIDC_CLIENT_SECRET}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-lasuite-drive
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: authentik-blueprint-lasuite-drive, creationPolicy: Owner}
  data:
    - secretKey: LASUITE_DRIVE_OIDC_CLIENT_SECRET
      remoteRef: {key: APP_LASUITE_DRIVE_OIDC_CLIENT_SECRET}
