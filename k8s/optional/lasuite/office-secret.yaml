apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lasuite-office-admin
  namespace: lasuite
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: lasuite-office-admin, creationPolicy: Owner}
  data:
    - secretKey: username
      remoteRef: {key: APP_LASUITE_OFFICE_ADMIN_USERNAME}
    - secretKey: password
      remoteRef: {key: APP_LASUITE_OFFICE_ADMIN_PASSWORD}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lasuite-office-proof
  namespace: lasuite
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: lasuite-office-proof, creationPolicy: Owner}
  data:
    - secretKey: proof_key
      remoteRef: {key: APP_LASUITE_OFFICE_WOPI_PROOF_PRIVATE_PEM}
    - secretKey: proof_key.pub
      remoteRef: {key: APP_LASUITE_OFFICE_WOPI_PROOF_PUBLIC_PEM}
