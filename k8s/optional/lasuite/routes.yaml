apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lasuite-docs
  namespace: lasuite
spec:
  parentRefs: [{name: internal, namespace: gateway}]
  hostnames: [docs.smadja.dev]
  rules:
    - matches: [{path: {type: PathPrefix, value: /collaboration/ws/}}]
      backendRefs: [{name: personal-docs-yhub, port: 443}]
    - matches:
        - path: {type: PathPrefix, value: /collaboration/ydoc/}
        - path: {type: PathPrefix, value: /collaboration/activity/}
        - path: {type: PathPrefix, value: /collaboration/changeset/}
        - path: {type: PathPrefix, value: /collaboration/rollback/}
        - path: {type: PathPrefix, value: /collaboration/jwks/}
      backendRefs: [{name: personal-docs-yhub, port: 443}]
    - matches:
        - path: {type: PathPrefix, value: /api}
        - path: {type: PathPrefix, value: /external_api}
      backendRefs: [{name: personal-docs-backend, port: 80}]
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: personal-docs-frontend, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lasuite-drive
  namespace: lasuite
spec:
  parentRefs: [{name: internal, namespace: gateway}]
  hostnames: [drive.smadja.dev]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api}
        - path: {type: PathPrefix, value: /external_api}
      backendRefs: [{name: personal-drive-backend, port: 80}]
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: personal-drive-frontend, port: 80}]
