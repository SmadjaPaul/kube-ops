# Recovery replays the R2 base backup + every archived WAL (no recoveryTarget)
# and promotes. No spec.plugins and no backup section: this cluster never
# archives. Same PostgreSQL image as production (status.image, 2026-11-12).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sparkyfitness-db-restore
  namespace: sparkyfitness-drill
  labels:
    restore.smadja.dev/purpose: isolated-read-only-recovery
    backup.smadja.dev/restore-drill: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie
  inheritedMetadata:
    labels:
      restore.smadja.dev/purpose: isolated-read-only-recovery
  bootstrap:
    recovery:
      source: sparkyfitness-db
      database: sparkyfitness
      owner: sparky_admin
  externalClusters:
    - name: sparkyfitness-db
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: sparkyfitness-r2-source
          serverName: sparkyfitness-db
  storage:
    size: 5Gi
    storageClass: longhorn-bulk
  ephemeralVolumesSizeLimit:
    temporaryData: 1Gi
    shm: 256Mi
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  affinity:
    enablePodAntiAffinity: false
