# PLT-228: R2 restore identity, Object Read only on homelab-backup-cnpg
# (PLT-220: put/delete refused with 403). The endpoint comes from Doppler so
# the account id stays out of this public repository.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-r2-restore-ro
  namespace: romm-drill
  labels:
    restore.smadja.dev/purpose: isolated-read-only-recovery
  annotations:
    argocd.argoproj.io/sync-wave: "-12"
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: cnpg-r2-restore-ro, creationPolicy: Owner}
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: {key: R2_CNPG_RESTORE_RO_ACCESS_KEY_ID}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: {key: R2_CNPG_RESTORE_RO_SECRET_ACCESS_KEY}
    - secretKey: AWS_ENDPOINT_URL_S3
      remoteRef: {key: R2_S3_ENDPOINT}
