apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: librechat
  namespace: librechat
  annotations:
    qa.smadja.dev/path: /health
    qa.smadja.dev/expected-status: "200"
spec:
  parentRefs:
    - {name: internal, namespace: gateway}
  hostnames: [librechat.smadja.dev]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: librechat-librechat, port: 3080}
