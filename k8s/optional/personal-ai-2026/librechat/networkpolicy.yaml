apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: librechat-pilot
  namespace: librechat
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: librechat
    - fromEntities: [host, remote-node]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: librechat
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{port: "53", protocol: TCP}, {port: "53", protocol: UDP}]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentgateway
            app: agentgateway
      toPorts:
        - ports: [{port: "4000", protocol: TCP}]
  # Authentik outbound + restricted MCP added only after OIDC and bank admission.
