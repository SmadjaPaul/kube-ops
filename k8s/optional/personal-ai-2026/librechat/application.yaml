apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: personal-librechat
  namespace: argocd
spec:
  project: personal-ai-pilot
  source:
    repoURL: ghcr.io/librechat-ai/librechat-chart
    chart: librechat
    targetRevision: 3.0.0
    helm:
      releaseName: librechat
      valuesObject:
        global:
          librechat:
            existingSecretName: librechat-credentials-env
            env:
              - name: OPENID_CLIENT_SECRET
                valueFrom:
                  secretKeyRef:
                    name: librechat-credentials-env
                    key: OPENID_CLIENT_SECRET
              - name: OPENID_SESSION_SECRET
                valueFrom:
                  secretKeyRef:
                    name: librechat-credentials-env
                    key: OPENID_SESSION_SECRET
        librechat:
          configEnv:
            ALLOW_REGISTRATION: "false"
            ALLOW_EMAIL_LOGIN: "false"
            ALLOW_EMAIL_LOGIN_OVERRIDE: "false"
            ALLOW_SOCIAL_REGISTRATION: "false"
            ALLOW_SOCIAL_LOGIN: "true"
            ALLOW_SHARED_LINKS: "false"
            ALLOW_SHARED_LINKS_PUBLIC: "false"
            SHARED_LINKS_SNAPSHOT_FILES: "false"
            DOMAIN_CLIENT: https://librechat.smadja.dev
            DOMAIN_SERVER: https://librechat.smadja.dev
            OPENID_CLIENT_ID: librechat
            OPENID_ISSUER: https://auth.smadja.dev/application/o/librechat/.well-known/openid-configuration
            OPENID_CALLBACK_URL: /oauth/openid/callback
            OPENID_SCOPE: openid profile email groups
            OPENID_EMAIL_CLAIM: email
            OPENID_BUTTON_LABEL: Login with Authentik
            OPENID_GENERATE_NONCE: "true"
            OPENID_USE_END_SESSION_ENDPOINT: "true"
          configYamlContent: |
            version: 1.0.8
            endpoints:
              custom:
                - name: Personal Agentgateway
                  apiKey: "${OPENAI_API_KEY}"
                  baseURL: http://agentgateway.agentgateway.svc.cluster.local:4000/v1
                  models:
                    default: [factory/fast]
                    fetch: false
                  titleConvo: true
                  titleModel: factory/fast
                  summarize: false
                  modelDisplayLabel: Personal Agentgateway
          imageVolume:
            enabled: true
            size: 10Gi
            accessModes: ReadWriteOnce
            storageClassName: longhorn-bulk
        image:
          registry: registry.librechat.ai
          repository: librechat-ai/librechat
          tag: v0.8.8
        serviceAccount:
          automount: false
        resources:
          requests: {cpu: 100m, memory: 512Mi}
          limits: {cpu: "1", memory: 2Gi}
        mongodb:
          enabled: true
          auth: {enabled: true}
          persistence:
            storageClass: longhorn-bulk
            size: 10Gi
            resourcePolicy: keep
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
        meilisearch: {enabled: false}
        librechat-rag-api: {enabled: false}
        redis: {enabled: false}
        ingress: {enabled: false}
  destination:
    server: https://kubernetes.default.svc
    namespace: librechat
  # No sync: the OIDC provider/client, credentials, Agentgateway policy,
  # backup/restore and two-user isolation still require admission evidence.
