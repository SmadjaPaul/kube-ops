apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-credentials-env
  namespace: librechat
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: librechat-credentials-env, creationPolicy: Owner}
  data:
    - secretKey: CREDS_KEY
      remoteRef: {key: APP_LIBRECHAT_CREDS_KEY}
    - secretKey: CREDS_IV
      remoteRef: {key: APP_LIBRECHAT_CREDS_IV}
    - secretKey: JWT_SECRET
      remoteRef: {key: APP_LIBRECHAT_JWT_SECRET}
    - secretKey: JWT_REFRESH_SECRET
      remoteRef: {key: APP_LIBRECHAT_JWT_REFRESH_SECRET}
    - secretKey: MEILI_MASTER_KEY
      remoteRef: {key: APP_LIBRECHAT_MEILI_MASTER_KEY}
    - secretKey: OPENAI_API_KEY
      remoteRef: {key: APP_LIBRECHAT_LLM_KEY}
    - secretKey: OPENID_CLIENT_SECRET
      remoteRef: {key: APP_LIBRECHAT_OIDC_CLIENT_SECRET}
    - secretKey: OPENID_SESSION_SECRET
      remoteRef: {key: APP_LIBRECHAT_OPENID_SESSION_SECRET}
