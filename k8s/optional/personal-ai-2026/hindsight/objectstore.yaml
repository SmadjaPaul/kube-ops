apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
# PLT-249: no longer referenced by the Cluster nor the ScheduledBackup (archive
# moved to hindsight-r2-store). Kept as the rollback target with its existing
# backups (pre-cutover base 20261113T204129). Its retentionPolicy (14d) only
# runs when a plugin sidecar uses this store again (rollback): before such a
# rollback, re-check that base 20261113T204129 is still needed or keep it.
metadata:
  name: hindsight-hetzner-store
  namespace: hindsight-personal
spec:
  retentionPolicy: "14d"
  # PLT-249 (prep before the R2 cutover, lesson of the romm 4 min outage): the
  # sidecar environment is fixed when the pod starts, so during the cutover the
  # old pod archives its last WAL to R2 with THIS environment. It must already
  # carry what R2 needs (endpoint read from the R2 Secret, a region R2 accepts,
  # boto3 checksums when_required). The explicit endpointURL below keeps Hetzner
  # as the target of this store.
  instanceSidecarConfiguration:
    env:
      - {name: AWS_DEFAULT_REGION, value: us-east-1}
      - {name: AWS_REQUEST_CHECKSUM_CALCULATION, value: when_required}
      - {name: AWS_RESPONSE_CHECKSUM_VALIDATION, value: when_required}
      - name: AWS_ENDPOINT_URL_S3
        valueFrom:
          secretKeyRef: {name: hindsight-cnpg-r2-credentials, key: AWS_ENDPOINT_URL_S3, optional: true}
  configuration:
    destinationPath: s3://smadja-dev-homelab-backups/cnpg/hindsight-personal
    endpointURL: https://fsn1.your-objectstorage.com
    s3Credentials:
      accessKeyId: {name: hindsight-cnpg-s3, key: AWS_ACCESS_KEY_ID}
      secretAccessKey: {name: hindsight-cnpg-s3, key: AWS_SECRET_ACCESS_KEY}
    wal: {compression: gzip, maxParallel: 2}
    data: {compression: gzip}
