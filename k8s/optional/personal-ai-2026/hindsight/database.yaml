apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hindsight-db
  namespace: hindsight-personal
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7-standard-trixie@sha256:44c64899a6fb61c01b56a91322cb9cfdc955aa5fd1c8f34ff3a0a9f51664a202
  bootstrap:
    initdb:
      database: hindsight
      owner: hindsight
      secret:
        name: hindsight-db-bootstrap
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
  # PLT-249: a Cluster has a single WAL archiver; the archive moved from
  # hindsight-hetzner-store to hindsight-r2-store (database-r2.yaml).
  # Rollback of the archive destination only (healthy database, R2 archiving
  # failing): point barmanObjectName back to hindsight-hetzner-store and take a
  # new base backup there; do NOT restore, nothing is lost. Hetzner base
  # 20261113T204129 (backupID, never "latest") is reserved for database recovery
  # (homelab-infra docs/operations/r2-migration.md); writes made after the cutover
  # only have their WAL on R2, so such a recovery needs the R2 WAL too.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters: {barmanObjectName: hindsight-r2-store}
  storage: {size: 10Gi, storageClass: longhorn-bulk}
  walStorage: {size: 5Gi, storageClass: longhorn-bulk}
  resources:
    requests: {cpu: 25m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  affinity:
    enablePodAntiAffinity: false
