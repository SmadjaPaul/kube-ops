apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: hindsight-db
  namespace: hindsight-personal
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7-standard-trixie@sha256:44c64899a6fb61c01b56a91322cb9cfdc955aa5fd1c8f34ff3a0a9f51664a202
  bootstrap:
    initdb:
      database: hindsight
      owner: hindsight
      secret:
        name: hindsight-db-bootstrap
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
  postgresql:
    parameters:
      # PLT-344 lot 0 : WAL réduit (golden path stockage), sauf archive_timeout (voir ci-dessous).
      checkpoint_timeout: "15min"
      max_wal_size: "2GB"
      wal_compression: "lz4"
      # PLT-301 : RPO <= 5 min exige pour la memoire des agents (critere du ticket) : archive_timeout 5min
      # pour hindsight-db seulement (base de ~Mo, segments forces quasi vides, rechargement sans redemarrage).
      archive_timeout: "5min"
  # PLT-249: a Cluster has a single WAL archiver; the archive moved to
  # hindsight-r2-store (database-r2.yaml). PLT-388: the Hetzner store is gone
  # from kube-ops, so there is no Hetzner rollback any more; recovery points
  # live on R2. The Hetzner bucket objects (base 20261113T204129, DATA-ONLY,
  # PLT-280) are kept untouched until Paul decides; they are not wired here.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters: {barmanObjectName: hindsight-r2-store}
  storage: {size: 10Gi, storageClass: longhorn-bulk}
  walStorage: {size: 5Gi, storageClass: longhorn-bulk}
  resources:
    requests: {cpu: 25m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  affinity:
    enablePodAntiAffinity: false
