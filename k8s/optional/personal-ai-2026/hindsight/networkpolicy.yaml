apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hindsight-personal
  namespace: hindsight-personal
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hindsight-personal
    - fromEntities: [host, remote-node]
      toPorts:
        - ports: [{port: "8888", protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hindsight-personal
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{port: "53", protocol: TCP}, {port: "53", protocol: UDP}]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentgateway
            app: agentgateway
      toPorts:
        - ports: [{port: "4000", protocol: TCP}]
    - toFQDNs:
        - matchName: fsn1.your-objectstorage.com
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
