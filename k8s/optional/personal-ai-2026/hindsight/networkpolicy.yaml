apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hindsight-personal
  namespace: hindsight-personal
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hindsight-personal
    # PLT-249: the CNPG operator reads instance status on 8000; without it the
    # Cluster stayed Ready=False ("Instance Status Extraction Error").
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports: [{port: "8000", protocol: TCP}]
    - fromEntities: [host, remote-node]
      toPorts:
        - ports: [{port: "8888", protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hindsight-personal
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{port: "53", protocol: TCP}, {port: "53", protocol: UDP}]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentgateway
            app: agentgateway
      toPorts:
        - ports: [{port: "4000", protocol: TCP}]
    - toFQDNs:
        - matchName: fsn1.your-objectstorage.com
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
    # PLT-249: Cloudflare R2 EU (CNPG/Barman archive, PLT-221). Hetzner stays
    # allowed until its prefix is deleted (PLT-94).
    - toFQDNs:
        - matchPattern: "*.eu.r2.cloudflarestorage.com"
        - matchPattern: "homelab-backup-cnpg.*.eu.r2.cloudflarestorage.com"
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
