apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: hindsight-personal
  namespace: hindsight-personal
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hindsight-personal
    # PLT-249: the CNPG operator reads instance status on 8000; without it the
    # Cluster stayed Ready=False ("Instance Status Extraction Error").
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports: [{port: "8000", protocol: TCP}]
    # PLT-301 : la Gateway Cilium (entite ingress) joint l'API pour la HTTPRoute MCP.
    - fromEntities: [host, remote-node, ingress]
      toPorts:
        - ports: [{port: "8888", protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hindsight-personal
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{port: "53", protocol: TCP}, {port: "53", protocol: UDP}]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentgateway
            app: agentgateway
      toPorts:
        - ports: [{port: "4000", protocol: TCP}]
    # PLT-94 lot 3 (MANDAT 21) : l'egress fsn1.your-objectstorage.com (Hetzner)
    # est retire. Le store Hetzner et son ExternalSecret sont supprimes dans la
    # meme PR ; hindsight-db archive deja vers R2.
    # PLT-249: Cloudflare R2 EU (CNPG/Barman archive, PLT-221).
    - toFQDNs:
        - matchPattern: "*.eu.r2.cloudflarestorage.com"
        - matchPattern: "homelab-backup-cnpg.*.eu.r2.cloudflarestorage.com"
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
---
# PLT-470: CNPG metrics exporter (:9187) scraped by Prometheus in monitoring.
# The hindsight-db ingress policy only opened 5432/8000, so the target was up == 0.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hindsight-db-metrics
  namespace: hindsight-personal
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: hindsight-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
