apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: hindsight-db-weekly
  namespace: hindsight-personal
spec:
  schedule: "0 15 3 * * 0"
  backupOwnerReference: self
  cluster: {name: hindsight-db}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: hindsight-hetzner-store
