apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: hindsight-db-weekly
  namespace: hindsight-personal
spec:
  schedule: "0 15 3 * * 0"
  backupOwnerReference: self
  cluster: {name: hindsight-db}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      # PLT-249: base backups follow the WAL archive to R2.
      barmanObjectName: hindsight-r2-store
