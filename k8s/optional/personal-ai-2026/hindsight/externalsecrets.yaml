apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-runtime
  namespace: hindsight-personal
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: hindsight-runtime, creationPolicy: Owner}
  data:
    - secretKey: postgres-password
      remoteRef: {key: APP_HINDSIGHT_DB_PASSWORD}
    - secretKey: HINDSIGHT_API_LLM_API_KEY
      remoteRef: {key: APP_HINDSIGHT_AGENTGATEWAY_KEY}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-db-bootstrap
  namespace: hindsight-personal
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target:
    name: hindsight-db-bootstrap
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: hindsight
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: {key: APP_HINDSIGHT_DB_PASSWORD}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-cnpg-s3
  namespace: hindsight-personal
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: hindsight-cnpg-s3, creationPolicy: Owner}
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: {key: HETZNER_S3_ACCESS_KEY_ID}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: {key: HETZNER_S3_SECRET_ACCESS_KEY}
