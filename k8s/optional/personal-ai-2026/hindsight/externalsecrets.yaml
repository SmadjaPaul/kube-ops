apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: hindsight-runtime
  namespace: hindsight-personal
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: hindsight-runtime, creationPolicy: Owner}
  data:
    - secretKey: postgres-password
      remoteRef: {key: APP_HINDSIGHT_DB_PASSWORD}
    - secretKey: HINDSIGHT_API_LLM_API_KEY
      remoteRef: {key: APP_HINDSIGHT_AGENTGATEWAY_KEY}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: hindsight-db-bootstrap
  namespace: hindsight-personal
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target:
    name: hindsight-db-bootstrap
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: hindsight
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: {key: APP_HINDSIGHT_DB_PASSWORD}
# PLT-94 lot 3 (MANDAT 21) : l'ExternalSecret hindsight-cnpg-s3 (credential
# Hetzner du store hindsight-hetzner-store, retire dans la meme PR) est supprime.
# hindsight-db archive deja ses WAL vers hindsight-r2-store (R2).
