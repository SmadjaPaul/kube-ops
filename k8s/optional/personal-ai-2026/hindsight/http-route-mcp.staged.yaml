# NOT ACTIVE: new public exposure (D-2026-11-20-02, MANDAT 25, PLT-304 option B).
# Not listed in kustomization.yaml. Activation order (homelab-infra runbook
# docs/operations/hindsight-homelab-cloudflare-access-runbook.md):
#   1. Cloudflare Access app `hindsight-homelab-mcp` exists and answers first
#      on memory.smadja.dev (homelab-infra terraform/cloudflare/hindsight-homelab.tf);
#   2. Hindsight authentication enabled (HINDSIGHT_API_TENANT_EXTENSION, key
#      from APP_HINDSIGHT_MCP_API_KEY) and the schema check of the runbook PASS;
#   3. only then rename this file to http-route-mcp.yaml and add it to kustomization.yaml.
# Only the single-bank MCP path is routed; every other path gets the Gateway 404.
# Backend Service name `hindsight-api` (chart release `hindsight`): verify with
# `kubectl-ro get svc -n hindsight-personal` before activation.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hindsight-mcp-agents
  namespace: hindsight-personal
spec:
  parentRefs:
    - name: external
      namespace: gateway
  hostnames:
    - memory.smadja.dev
  rules:
    - matches:
        - path: {type: PathPrefix, value: /mcp/agents-homelab/}
      backendRefs:
        - name: hindsight-api
          port: 8888
