# PLT-249: fresh Hetzner base backup taken before the R2 cutover of
# hindsight-db. It is the rollback point: after the cutover, Hetzner stays
# restorable up to the switch (this base plus the WAL archived before it).
# A rollback targets this backupID or a precise time, never "latest".
# Removed from the repository by the cutover PR (the CR could otherwise run
# again after the restart, PLT-221 anomaly); the backup itself stays on Hetzner.
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: hindsight-db-hetzner-precutover-20261113
  namespace: hindsight-personal
  labels:
    backup.smadja.dev/purpose: r2-cutover-rollback
spec:
  cluster:
    name: hindsight-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: hindsight-hetzner-store
