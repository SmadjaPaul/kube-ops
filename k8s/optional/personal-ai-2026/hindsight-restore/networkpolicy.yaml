apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hindsight-restore-20261110
  namespace: hindsight-restore-20261110
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hindsight-restore-20261110
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hindsight-restore-20261110
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{port: "53", protocol: TCP}, {port: "53", protocol: UDP}]
    - toFQDNs:
        - matchName: fsn1.your-objectstorage.com
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
