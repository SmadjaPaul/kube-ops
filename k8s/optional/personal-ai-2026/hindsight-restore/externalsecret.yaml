apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-restore-cnpg-s3
  namespace: hindsight-restore-20261110
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: hindsight-restore-cnpg-s3, creationPolicy: Owner}
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: {key: HETZNER_S3_ACCESS_KEY_ID}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: {key: HETZNER_S3_SECRET_ACCESS_KEY}
