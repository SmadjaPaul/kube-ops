apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-personal-secrets
  namespace: openclaw-personal
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: openclaw-personal-secrets
    creationPolicy: Owner
  data:
    - secretKey: OPENCLAW_GATEWAY_TOKEN
      remoteRef:
        key: APP_OPENCLAW_PERSONAL_GATEWAY_TOKEN
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: APP_OPENCLAW_PERSONAL_LLM_KEY
