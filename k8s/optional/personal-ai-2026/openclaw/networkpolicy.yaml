apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openclaw-personal
  namespace: openclaw-personal
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: openclaw-personal
  # Pilot: no public route. Access via an explicitly authorized kubectl port-forward.
  ingress:
    - fromEntities: [host, remote-node]
      toPorts:
        - ports: [{port: "18789", protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentgateway
            app: agentgateway
      toPorts:
        - ports: [{port: "4000", protocol: TCP}]
