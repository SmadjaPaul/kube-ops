apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aiostreams-bootstrap
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: aiostreams-bootstrap, creationPolicy: Owner}
  data:
    - secretKey: SECRET_KEY
      remoteRef: {key: APP_AIOSTREAMS_SECRET_KEY}
    - secretKey: AIOSTREAMS_AUTH
      remoteRef: {key: APP_AIOSTREAMS_OPERATOR_AUTH}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: polyfin-bootstrap
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: polyfin-bootstrap, creationPolicy: Owner}
  data:
    - secretKey: POLYFIN_SECRET_KEY
      remoteRef: {key: APP_POLYFIN_SECRET_KEY}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: polyfin-db-app
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target:
    name: polyfin-db-app
    creationPolicy: Owner
    template:
      data:
        password: "{{ .password }}"
        uri: "postgresql://polyfin:{{ .password }}@polyfin-db:5432/polyfin?sslmode=disable"
  data:
    - secretKey: password
      remoteRef: {key: ORACLE_PILOT_POSTGRES_PASSWORD}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-token
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: cloudflared-token, creationPolicy: Owner}
  data:
    - secretKey: TUNNEL_TOKEN
      remoteRef: {key: ORACLE_PILOT_CLOUDFLARE_TUNNEL_TOKEN}
