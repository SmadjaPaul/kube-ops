# Outbound-only dedicated pilot tunnel; ingress (tv-pilot -> polyfin) is
# declared in homelab-infra terraform/cloudflare/oracle-pilot.tf.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: cloudflared}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cloudflared}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2025.11.1
          args: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom: {secretKeyRef: {name: cloudflared-token, key: TUNNEL_TOKEN}}
          livenessProbe:
            httpGet: {path: /ready, port: 2000}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
