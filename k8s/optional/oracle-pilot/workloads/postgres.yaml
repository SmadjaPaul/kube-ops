# Pilot-only Postgres (CNPG/Barman is not installed on the pilot). Polyfin data
# on the pilot is disposable until the switch is decided.
apiVersion: v1
kind: Service
metadata:
  name: polyfin-db
  namespace: media
spec:
  selector: {app.kubernetes.io/name: polyfin-db}
  ports:
    - {name: pg, port: 5432, targetPort: pg}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: polyfin-db
  namespace: media
spec:
  serviceName: polyfin-db
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: polyfin-db}
  template:
    metadata:
      labels: {app.kubernetes.io/name: polyfin-db}
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - {name: POSTGRES_DB, value: polyfin}
            - {name: POSTGRES_USER, value: polyfin}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: polyfin-db-app, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: pg, containerPort: 5432}
          readinessProbe:
            exec: {command: [pg_isready, -U, polyfin]}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: {requests: {storage: 10Gi}}
