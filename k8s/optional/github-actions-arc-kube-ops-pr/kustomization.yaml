apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# PLT-442: dedicated ARC scale set for the kube-ops CI jobs that ran on GitHub-hosted runners
# (v1-contract, Documentation integrity, E2E Static). No Kubernetes token is mounted, so PR code
# cannot reach the API server; compare with arc-runners-kube-ops (post-merge, read-only token).
# Synced from main by the infrastructure ApplicationSet. The shared controller in arc-systems
# (github-actions-arc) watches every namespace.
resources:
  - namespace.yaml
  - github-app-secret.yaml
  - runner-quota.yaml
  - egress-networkpolicy.yaml
  - runner-application.yaml
