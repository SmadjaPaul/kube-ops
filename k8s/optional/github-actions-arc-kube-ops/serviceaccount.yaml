# Identity of the post-merge runner pod (PLT-390 lot 3). Mounted only in this scale set's runner pod
# (template.spec.serviceAccountName). Bound by rbac.yaml to read-only rules.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-ops-post-merge
  namespace: arc-runners-kube-ops
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    app.kubernetes.io/part-of: github-actions-arc
