apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-arc-kube-ops-ci
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: applications
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.15.0
    helm:
      releaseName: kube-ops-ci-arc
      valuesObject:
        githubConfigUrl: https://github.com/SmadjaPaul/kube-ops
        # Used only by the controller and listener; never mounted in the runner.
        githubConfigSecret: arc-github-app
        # One job at a time (node CPU request ceiling, D-2026-11-15-05); queued jobs wait.
        minRunners: 0
        maxRunners: 3
        controllerServiceAccount:
          namespace: arc-systems
          name: arc-gha-rs-controller
        template:
          spec:
            # The runner's own read-only identity (rbac.yaml). The only scale set that mounts a token.
            serviceAccountName: kube-ops-post-merge
            automountServiceAccountToken: true
            securityContext:
              runAsNonRoot: true
              runAsUser: 1001
              runAsGroup: 1001
              fsGroup: 1001
              fsGroupChangePolicy: OnRootMismatch
            containers:
              - name: runner
                # Common tooled runner (images/arc-ci-runner); rollback: official runner digest in github-actions-arc/README.md.
                image: ghcr.io/smadjapaul/arc-ci-runner:tools1-576e0cb@sha256:087f055d11e3c2a0afd3606fa9b3a45b54a80401c201cd8df0cb261023557709
                command: ["/home/runner/run.sh"]
                resources:
                  requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 512Mi}
                  limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 4Gi}
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities: {drop: ["ALL"]}
                  seccompProfile: {type: RuntimeDefault}
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners-kube-ops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
