apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# PLT-202: isolated, read-only CNPG recovery drill of the production Matrix MAS
# database (matrix/matrix-mas-postgresql-clean). Nothing here writes to the
# production Barman prefix: no Cluster spec.plugins WAL archiver, no
# ScheduledBackup, no Backup, no ObjectStore retentionPolicy.
resources:
  - namespace.yaml
  - externalsecret.yaml
  - objectstore.yaml
  - cluster.yaml
  - networkpolicy.yaml
  - check-job.yaml
