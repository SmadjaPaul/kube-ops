# Dedicated read-only restore key (separate Hetzner project). The bucket policy
# in homelab-infra terraform/hetzner-object-storage/restore-readonly-policy.tf
# grants it only List/Get under cnpg/matrix-mas-clean and denies every write.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-hetzner-restore-ro
  namespace: matrix-mas-drill
  labels:
    restore.smadja.dev/purpose: isolated-read-only-recovery
  annotations:
    argocd.argoproj.io/sync-wave: "-12"
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: cnpg-hetzner-restore-ro, creationPolicy: Owner}
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: {key: HETZNER_S3_RESTORE_RO_ACCESS_KEY_ID}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: {key: HETZNER_S3_RESTORE_RO_SECRET_ACCESS_KEY}
