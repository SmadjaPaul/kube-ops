# PLT-202: the drill reads the existing production backup key (the same Doppler
# values as matrix/cnpg-hetzner-credentials). The key itself can write, so the
# read-only guarantee is carried by configuration and enforced in CI by
# scripts/restore-drill-readonly-contract.sh: no spec.plugins WAL archiver, no
# spec.backup, no Backup/ScheduledBackup, no retentionPolicy, no
# skipEmptyWalArchiveCheck. Remove this whole directory by PR after the drill.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-hetzner-source-credentials
  namespace: matrix-mas-drill
  labels:
    restore.smadja.dev/purpose: isolated-read-only-recovery
  annotations:
    argocd.argoproj.io/sync-wave: "-12"
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: cnpg-hetzner-source-credentials, creationPolicy: Owner}
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: {key: HETZNER_S3_ACCESS_KEY_ID}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: {key: HETZNER_S3_SECRET_ACCESS_KEY}
