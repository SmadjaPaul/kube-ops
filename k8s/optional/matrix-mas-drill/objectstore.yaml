# Read-only recovery source. Same destinationPath/endpoint as
# matrix/matrix-mas-clean-hetzner-store. Deliberately no retentionPolicy and
# never referenced by a Cluster spec.plugins entry or a (Scheduled)Backup, so
# the barman-cloud plugin never archives, backs up or prunes through it.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: matrix-mas-clean-source
  namespace: matrix-mas-drill
  labels:
    restore.smadja.dev/purpose: isolated-read-only-recovery
  annotations:
    argocd.argoproj.io/sync-wave: "-11"
spec:
  instanceSidecarConfiguration:
    env:
      - name: AWS_DEFAULT_REGION
        value: fsn1
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
  configuration:
    destinationPath: s3://smadja-dev-homelab-backups/cnpg/matrix-mas-clean
    endpointURL: https://fsn1.your-objectstorage.com
    s3Credentials:
      accessKeyId: {name: cnpg-hetzner-source-credentials, key: AWS_ACCESS_KEY_ID}
      secretAccessKey: {name: cnpg-hetzner-source-credentials, key: AWS_SECRET_ACCESS_KEY}
    wal: {compression: gzip}
    data: {compression: gzip}
