# Recovery replays base backup + every archived WAL (no recoveryTarget) and
# promotes. No spec.plugins and no backup section: this cluster never archives.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: matrix-mas-clean-restore
  namespace: matrix-mas-drill
  labels:
    restore.smadja.dev/purpose: isolated-read-only-recovery
    backup.smadja.dev/restore-drill: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7
  inheritedMetadata:
    labels:
      restore.smadja.dev/purpose: isolated-read-only-recovery
  bootstrap:
    recovery:
      source: matrix-mas-postgresql-clean
      database: mas
      owner: mas
  externalClusters:
    - name: matrix-mas-postgresql-clean
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: matrix-mas-clean-source
          serverName: matrix-mas-postgresql-clean
  storage:
    size: 10Gi
    storageClass: longhorn-bulk
  walStorage:
    size: 2Gi
    storageClass: longhorn-bulk
  ephemeralVolumesSizeLimit:
    temporaryData: 1Gi
    shm: 256Mi
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  affinity:
    enablePodAntiAffinity: false
