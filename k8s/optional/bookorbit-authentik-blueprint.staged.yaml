# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# STAGED only: import after the BookOrbit workload, dedicated secret and
# browser/native OIDC tests have been admitted separately.
version: 1
metadata:
  name: Apps - BookOrbit staged v3.6 native OIDC
entries:
  - id: bookorbit_provider_staged
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: k8s.smadja.dev/media/bookorbit-v36-staged
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "default-provider-invalidation-flow"]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      client_type: confidential
      grant_types: [authorization_code]
      client_id: bookorbit-v36-staged
      client_secret: !Env BOOKORBIT_CLIENT_SECRET
      redirect_uris:
        - {url: https://bookorbit.smadja.dev/oauth2-callback, matching_mode: strict}
        - {url: 'bookorbit://oauth2-callback', matching_mode: strict}
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "groups"]]
  - id: bookorbit_application_staged
    model: authentik_core.application
    identifiers: {slug: bookorbit-v36-staged}
    attrs:
      name: BookOrbit v3.6 staged
      group: Media
      meta_launch_url: https://bookorbit.smadja.dev
      provider: !KeyOf bookorbit_provider_staged
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf bookorbit_application_staged, group: !Find [authentik_core.group, [name, "family"]]}
    attrs: {order: 10}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf bookorbit_application_staged, group: !Find [authentik_core.group, [name, "authentik-admins"]]}
    attrs: {order: 100}
