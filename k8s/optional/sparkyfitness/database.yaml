apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sparkyfitness-db
  namespace: wellness
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  instances: 1
  bootstrap:
    initdb:
      database: sparkyfitness
      owner: sparky_admin
  # Upstream bootstrap creates a separate RLS app user at first startup.
  # CNPG maintains the database owner's password in the -app Secret.
  managed:
    roles:
      - name: sparky_admin
        ensure: present
        login: true
        createrole: true
  # Barman plugin activation is required: ObjectStore + ScheduledBackup alone
  # do not enable WAL archiving or base backups on this Cluster.
  # PLT-221: CNPG accepts a single WAL archiver per Cluster, so this R2 pilot
  # switches the archive from sparkyfitness-hetzner-store to
  # sparkyfitness-r2-store (backup-r2.yaml). Rollback: point
  # barmanObjectName back to sparkyfitness-hetzner-store, then take a new
  # base backup there (homelab-infra docs/operations/r2-migration.md).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: sparkyfitness-r2-store
  storage:
    storageClass: longhorn-bulk
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
