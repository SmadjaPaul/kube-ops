apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sparkyfitness-db
  namespace: wellness
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  instances: 1
  bootstrap:
    initdb:
      database: sparkyfitness
      owner: sparky_admin
  # Upstream bootstrap creates a separate RLS app user at first startup.
  # CNPG maintains the database owner's password in the -app Secret.
  managed:
    roles:
      - name: sparky_admin
        ensure: present
        login: true
        createrole: true
  postgresql:
    parameters:
      # PLT-344 lot 0 : WAL réduit (golden path stockage). archive_timeout 5min -> 15min : 96 segments forcés/jour au lieu de 288 (RPO R2 15 min).
      checkpoint_timeout: "15min"
      max_wal_size: "2GB"
      wal_compression: "lz4"
      archive_timeout: "15min"
  # Barman plugin activation is required: ObjectStore + ScheduledBackup alone
  # do not enable WAL archiving or base backups on this Cluster.
  # PLT-221: CNPG accepts a single WAL archiver per Cluster, so this R2 pilot
  # switched the archive from Hetzner to sparkyfitness-r2-store
  # (backup-r2.yaml). PLT-219: the Hetzner store and its objects are gone;
  # recovery points live on R2 only.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: sparkyfitness-r2-store
  storage:
    storageClass: longhorn-bulk
    size: 5Gi
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 1Gi
