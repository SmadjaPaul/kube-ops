apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sparkyfitness-db
  namespace: wellness
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  instances: 1
  bootstrap:
    initdb:
      database: sparkyfitness
      owner: sparky_admin
  # Upstream bootstrap creates a separate RLS app user at first startup.
  # CNPG maintains the database owner's password in the -app Secret.
  managed:
    roles:
      - name: sparky_admin
        ensure: present
        login: true
        createrole: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: sparkyfitness-hetzner-store
  storage:
    storageClass: longhorn-fast
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
