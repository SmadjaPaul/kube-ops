apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: personal-sparkyfitness
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  project: applications
  source:
    repoURL: https://github.com/CodeWithCJ/SparkyFitness.git
    targetRevision: v1.11.0
    path: helm/chart
    helm:
      releaseName: sparkyfitness
      valuesObject:
        global:
          storageClass: longhorn-bulk
        postgresql:
          enabled: false
        externalDatabase:
          host: sparkyfitness-db-rw.wellness.svc.cluster.local
          port: 5432
          database: sparkyfitness
          auth:
            existingSecret: sparkyfitness-db-app
        config:
          timezone: Europe/Paris
          frontendUrl: https://fitness.smadja.dev
          # OIDC auto-provisioning is limited by the Authentik application
          # bindings to the family and authentik-admins groups.
          disableSignup: false
          disableEmailLogin: true
          forceEmailLogin: false
          oidc:
            enabled: true
            providerSlug: authentik
            providerName: Authentik
            # SparkyFitness v1.11.0 removes one trailing slash before storing
            # the issuer. Authentik's discovery document correctly retains one;
            # keep two at the chart boundary until the upstream fix is shipped.
            issuerUrl: https://auth.smadja.dev/application/o/sparkyfitness//
            scope: "openid email profile groups"
            adminGroup: authentik-admins
            autoRegister: true
            autoRedirect: false
            secrets:
              existingSecret: sparkyfitness-oidc
        server:
          replicas: 1
          image:
            tag: v1.11.0
            digest: sha256:51a2d7c19bd99b50ea17e579fe8d9d4febed895595356b1ddafe0fa808caf75e
          secrets:
            generate: false
            existingSecret: sparkyfitness-runtime
          extraEnv:
            SPARKY_FITNESS_ADMIN_EMAIL:
              valueFrom:
                secretKeyRef:
                  name: sparkyfitness-runtime
                  key: SPARKY_FITNESS_ADMIN_EMAIL
          appDatabase:
            username: sparky_app
            existingSecret: sparkyfitness-appdb
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          persistence:
            backup:
              size: 1Gi
              storageClass: longhorn-bulk
            uploads:
              size: 2Gi
              storageClass: longhorn-bulk
        frontend:
          replicas: 1
          image:
            tag: v1.11.0
            digest: sha256:5eb77135ccd8e58492ee9bd19b8714ea4a73a99623b863a9287ccecb0557cd17
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
        networkPolicy:
          enabled: false
        ingress:
          enabled: false
        httpRoute:
          enabled: true
          hostname: fitness.smadja.dev
          parentRef:
            name: internal
            namespace: gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: wellness
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
