apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# backup-r2.yaml: CNPG Barman plugin store on Cloudflare R2, active WAL
# archive and weekly base backup target (PLT-221, R2 pilot cluster).
# backup.yaml: Hetzner store kept as rollback target and the ScheduledBackup
# (PLT-147).
resources:
  - namespace.yaml
  - database.yaml
  - backup.yaml
  - backup-r2.yaml
  - backup-r2-initial.yaml
  - external-secret.yaml
  - networkpolicy.yaml
  - argo-application.yaml
