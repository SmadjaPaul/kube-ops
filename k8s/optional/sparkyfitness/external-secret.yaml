apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sparkyfitness-runtime
  namespace: wellness
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: sparkyfitness-runtime
    creationPolicy: Owner
  data:
    - secretKey: api_encryption_key
      remoteRef:
        key: APP_SPARKYFITNESS_API_ENCRYPTION_KEY
    - secretKey: better_auth_secret
      remoteRef:
        key: APP_SPARKYFITNESS_BETTER_AUTH_SECRET
    - secretKey: SPARKY_FITNESS_ADMIN_EMAIL
      remoteRef:
        key: APP_AUTHENTIK_ADMIN_EMAIL
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sparkyfitness-oidc
  namespace: wellness
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: sparkyfitness-oidc
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: APP_SPARKYFITNESS_OIDC_CLIENT_ID
    - secretKey: client_secret
      remoteRef:
        key: APP_SPARKYFITNESS_OIDC_CLIENT_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sparkyfitness-appdb
  namespace: wellness
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: sparkyfitness-appdb
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: APP_SPARKYFITNESS_DB_APP_USERNAME
    - secretKey: password
      remoteRef:
        key: APP_SPARKYFITNESS_DB_APP_PASSWORD
