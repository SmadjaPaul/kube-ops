apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: sparkyfitness-postgresql-weekly
  namespace: wellness
spec:
  schedule: "0 40 6 * * 0"
  backupOwnerReference: self
  cluster:
    name: sparkyfitness-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      # PLT-221: base backups follow the WAL archive to R2.
      barmanObjectName: sparkyfitness-r2-store
