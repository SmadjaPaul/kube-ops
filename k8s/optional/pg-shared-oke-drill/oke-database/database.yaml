# Drill database, owned by the existing managed role polyfin (no new secret).
# databaseReclaimPolicy: delete, so removing the drill import drops it.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: backup-drill
  namespace: databases
spec:
  name: backup_drill
  owner: polyfin
  databaseReclaimPolicy: delete
  cluster:
    name: pg-shared
