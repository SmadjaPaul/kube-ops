# PLT-190: read-only identity of bucket homelab-backup-cnpg (token
# r2-cnpg-restore-ro, Object Read only): the drill never writes to R2. Names
# only; values live in Doppler cluster/prd.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-shared-oke-drill-r2-ro
  namespace: pg-shared-oke-drill
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: pg-shared-oke-drill-r2-ro, creationPolicy: Owner}
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: {key: R2_CNPG_RESTORE_RO_ACCESS_KEY_ID}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: {key: R2_CNPG_RESTORE_RO_SECRET_ACCESS_KEY}
    - secretKey: AWS_ENDPOINT_URL_S3
      remoteRef: {key: R2_S3_ENDPOINT}
