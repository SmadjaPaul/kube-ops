# PLT-190: psql Job shared by the seed and fingerprint steps of the pg-shared
# drill. Each user sets the Job name, the SQL file, the CNPG service and the
# credentials Secret by JSON patch. CNPG CA (verify-full, no TLS bypass).
# Output: kubectl-ro.sh logs job/<name>.
apiVersion: batch/v1
kind: Job
metadata:
  name: NAME
spec:
  backoffLimit: 8
  template:
    spec:
      restartPolicy: Never
      hostNetwork: false
      hostPID: false
      hostIPC: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        fsGroup: 26
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: psql
          image: ghcr.io/cloudnative-pg/postgresql:17.7-standard-trixie@sha256:e079dae5253fa6ed26fc65fda06d515af764dbec392dd4b46b17ab11eebd8131
          command: [psql, -v, ON_ERROR_STOP=1, -f, /sql/FILE]
          env:
            - {name: PGHOST, value: CLUSTER-rw}
            - {name: PGDATABASE, value: backup_drill}
            - {name: PGSSLMODE, value: verify-full}
            - {name: PGSSLROOTCERT, value: /ca/ca.crt}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: SECRET, key: username}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: SECRET, key: password}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: sql, mountPath: /sql}
            - {name: ca, mountPath: /ca}
      volumes:
        - name: sql
          configMap: {name: pg-shared-drill-sql}
        - name: ca
          secret:
            secretName: CLUSTER-ca
            items: [{key: ca.crt, path: ca.crt}]
