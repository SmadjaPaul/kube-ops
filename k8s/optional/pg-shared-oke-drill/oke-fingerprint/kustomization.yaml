# PLT-190 drill, step "oke-fingerprint": import temporarily into
# k8s/clusters/oracle-a1/cnpg-cluster/kustomization.yaml (with ../oke-database
# already imported), read the Job logs, then remove the import
# (docs/operations/pg-shared-oke-backup-drill.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: databases
components:
  - ../sql
patches:
  - target: {kind: Job, name: NAME}
    patch: |-
      - {op: replace, path: /metadata/name, value: pg-shared-drill-fingerprint}
      - {op: replace, path: /spec/template/spec/containers/0/command/4, value: /sql/fingerprint.sql}
      - {op: replace, path: /spec/template/spec/containers/0/env/0/value, value: pg-shared-rw}
      - {op: replace, path: /spec/template/spec/containers/0/env/4/valueFrom/secretKeyRef/name, value: pg-shared-polyfin}
      - {op: replace, path: /spec/template/spec/containers/0/env/5/valueFrom/secretKeyRef/name, value: pg-shared-polyfin}
      - {op: replace, path: /spec/template/spec/volumes/1/secret/secretName, value: pg-shared-ca}
