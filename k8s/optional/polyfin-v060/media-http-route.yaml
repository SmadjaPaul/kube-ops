apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: polyfin-media
  namespace: media
spec:
  parentRefs:
    - name: internal
      namespace: gateway
  hostnames:
    - media.smadja.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: polyfin
          port: 80
