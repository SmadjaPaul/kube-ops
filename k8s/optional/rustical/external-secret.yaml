apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustical-oidc
  namespace: rustical
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: rustical-oidc
    creationPolicy: Owner
  data:
    - secretKey: RUSTICAL_OIDC__CLIENT_ID
      remoteRef:
        key: APP_RUSTICAL_OIDC_CLIENT_ID
    - secretKey: RUSTICAL_OIDC__CLIENT_SECRET
      remoteRef:
        key: APP_RUSTICAL_OIDC_CLIENT_SECRET
