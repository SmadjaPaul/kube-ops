# Lot 2 of docs/architecture/secrets-migration-spec.md (pilot): copy form (B) of the OIDC client
# secret generated in namespace auth (source `oidc-rustical-pilot`, store k8s-auth). The client id
# is a Git literal (T10). The only consumer is the overlay k8s/applications/platform/rustical-pilot
# (namespace rustical-pilot): the source name below is bound to that rendered namespace by the
# admission rule eso-k8s-store-guard and by the CI contract.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: rustical-oidc
  namespace: rustical
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: k8s-auth
    kind: ClusterSecretStore
  target:
    name: rustical-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RUSTICAL_OIDC__CLIENT_ID: rustical
        RUSTICAL_OIDC__CLIENT_SECRET: "{{ .client_secret }}"
  data:
    - secretKey: client_secret
      remoteRef:
        key: oidc-rustical-pilot
        property: RUSTICAL_OIDC_CLIENT_SECRET
