# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# NOT ACTIVE: staged blueprint; only import into the Authentik blueprint generator
# after Doppler/ESO secret is provisioned in auth and mounted in the worker.
version: 1
metadata:
  name: Apps - RustiCal
entries:
  - id: rustical_provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: k8s.smadja.dev/personal/rustical
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "default-provider-invalidation-flow"]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      client_type: confidential
      grant_types: [authorization_code]
      client_id: rustical
      client_secret: !Env RUSTICAL_OIDC_CLIENT_SECRET
      redirect_uris:
        - {url: https://calendar.smadja.dev/frontend/login/oidc/callback, matching_mode: strict}
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "groups"]]
  - id: rustical_application
    model: authentik_core.application
    identifiers: {slug: rustical}
    attrs:
      name: RustiCal
      group: Personal
      meta_launch_url: https://calendar.smadja.dev
      provider: !KeyOf rustical_provider
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf rustical_application, group: !Find [authentik_core.group, [name, "family"]]}
    attrs: {order: 10}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf rustical_application, group: !Find [authentik_core.group, [name, "authentik-admins"]]}
    attrs: {order: 100}
