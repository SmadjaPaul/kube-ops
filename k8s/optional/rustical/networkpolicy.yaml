apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: rustical
  namespace: rustical
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: rustical
  ingress:
    - fromEntities: [ingress]
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toFQDNs:
        - matchName: auth.smadja.dev
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # The issuer resolves to Gateway/internal on the cluster DNS view. Allow
    # only the internal Gateway VIP and the Authentik server backend required
    # for the OIDC discovery and authorization path.
    - toCIDRSet:
        - cidr: 10.0.20.192/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: auth
            app.kubernetes.io/name: authentik
            app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
