apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: rustical
  namespace: rustical
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: rustical
  ingress:
    - fromEntities: [ingress]
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toFQDNs:
        - matchName: auth.smadja.dev
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
