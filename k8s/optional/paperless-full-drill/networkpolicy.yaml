# Default deny for the drill namespace: ingress only from the same namespace,
# egress only to the same namespace and cluster DNS. No Gateway, no Internet.
# The CiliumNetworkPolicy of the source namespace is excluded from the Restore,
# so nothing widens this.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: drill-paperless-isolation
  namespace: drill-paperless
  labels: {policy-type: platform}
  annotations:
    argocd.argoproj.io/sync-wave: "-13"
spec:
  description: "PLT-171 paperless full restore drill: same-namespace ingress, egress to the namespace and DNS only."
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: drill-paperless
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: drill-paperless
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
          rules:
            dns:
              - matchPattern: "*"
---
# Only the drill CNPG pods (instance and recovery Job): CNPG operator status
# port, kube-apiserver and the R2 EU S3 endpoint (path or virtual-hosted style
# for homelab-backup-cnpg). The account id label is a wildcard to keep it out
# of this public repository.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: drill-paperless-cnpg
  namespace: drill-paperless
  labels: {policy-type: platform}
  annotations:
    argocd.argoproj.io/sync-wave: "-13"
spec:
  description: "PLT-171 paperless drill CNPG pods: operator ingress, egress to API server and R2 EU S3 only."
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: paperless-postgresql
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - {port: "8000", protocol: TCP}
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
    - toFQDNs:
        - matchPattern: "*.eu.r2.cloudflarestorage.com"
        - matchPattern: "homelab-backup-cnpg.*.eu.r2.cloudflarestorage.com"
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
