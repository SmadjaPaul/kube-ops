apiVersion: v1
kind: Service
metadata:
  name: rollout-demo-active
  namespace: argo-rollouts-demo
  annotations:
    # Only the rollouts-pod-template-hash selector is controller-owned.
    # Argo CD needs a narrowly scoped ignoreDifferences on both Services
    # when this optional fixture is enrolled in GitOps.
    app.kubernetes.io/managed-by: argo-rollouts
spec:
  type: ClusterIP
  selector:
    app: rollout-demo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: rollout-demo-preview
  namespace: argo-rollouts-demo
  annotations:
    app.kubernetes.io/managed-by: argo-rollouts
spec:
  type: ClusterIP
  selector:
    app: rollout-demo
  ports:
    - name: http
      port: 80
      targetPort: http
