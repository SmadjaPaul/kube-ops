apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - cluster.yaml

patches:
  - target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: matrix-mas-postgresql
    patch: |-
      - op: add
        path: /metadata/annotations/cnpg.io~1hibernation
        value: "on"
