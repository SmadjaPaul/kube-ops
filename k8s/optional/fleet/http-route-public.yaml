# Public exposure of Fleet agent endpoints only (PLT-317, D-2026-11-14-06
# point 2, Paul's agreement of 2026-11-15). UI, fleetctl and admin API
# (/api/*/fleet/* outside /device/) stay on Gateway/internal (http-route.yaml).
# Paths checked against the Fleet guide "What API endpoints to expose to the
# public internet" on 2026-11-16 (deployed Fleet v4.94.1). Scope: osquery,
# Fleet Desktop / My device, macOS MDM with manual enrollment. Not exposed:
# automatic enrollment (ABM, /api/mdm/apple/enroll, /mdm/sso), ACME (no
# hardware attestation), Windows, iOS, Android, SCEP proxy.
# Edge: wildcard *.smadja.dev tunnel -> Gateway/external. No dedicated edge
# rate limit (PLT-317 choice b): agents authenticate with node key / enroll secret.
# Contract: tests/harness/fleet-public-route-contract-test.sh.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fleet-agents-public
  namespace: fleet
spec:
  parentRefs:
    - name: external
      namespace: gateway
  hostnames:
    - fleet.smadja.dev
  rules:
    - matches:
        # osquery
        - path: {type: PathPrefix, value: /api/osquery/}
        - path: {type: PathPrefix, value: /api/v1/osquery/}
        # fleetd (orbit) and Fleet Desktop
        - path: {type: PathPrefix, value: /api/fleet/orbit/}
        - path: {type: Exact, value: /api/fleet/device/ping}
        # My device page and device-authenticated API (includes /desktop)
        - path: {type: PathPrefix, value: /api/v1/fleet/device/}
        - path: {type: PathPrefix, value: /api/latest/fleet/device/}
        - path: {type: PathPrefix, value: /device/}
        - path: {type: PathPrefix, value: /assets/}
        # macOS MDM protocol
        - path: {type: Exact, value: /mdm/apple/scep}
        - path: {type: Exact, value: /mdm/apple/mdm}
      backendRefs:
        - name: fleet
          port: 80
