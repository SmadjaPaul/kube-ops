apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fleet
  namespace: fleet
spec:
  # LAN and NetBird only: UI, admin API and agents at home.
  parentRefs:
    - name: internal
      namespace: gateway
  hostnames:
    - fleet.smadja.dev
  rules:
    - backendRefs:
        - name: fleet
          port: 80
