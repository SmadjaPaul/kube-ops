apiVersion: v1
kind: Service
metadata:
  name: fleet-valkey
  namespace: fleet
spec:
  selector:
    app.kubernetes.io/name: fleet-valkey
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-valkey
  namespace: fleet
  labels:
    app.kubernetes.io/name: fleet-valkey
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-valkey
    spec:
      hostNetwork: false
      hostPID: false
      hostIPC: false
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          # Cache and query queue only: no persistence, no backup.
          image: valkey/valkey:9.2.0-alpine@sha256:c8e2d17498838af5d91e12eb7c11220b3434a7b7131a333e3af52ad5e0b80882
          imagePullPolicy: IfNotPresent
          args: [valkey-server, --save, "", --appendonly, "no", --maxmemory, 96mb]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [valkey-cli, ping]
          livenessProbe:
            exec:
              command: [valkey-cli, ping]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 64Mi
