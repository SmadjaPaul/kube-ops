apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fleet-mysql
  namespace: fleet
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: fleet-mysql
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: APP_FLEET_MYSQL_PASSWORD
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        key: APP_FLEET_MYSQL_ROOT_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fleet-server
  namespace: fleet
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: fleet-server
    creationPolicy: Owner
  data:
    # Required for Apple MDM; at least 32 bytes.
    - secretKey: FLEET_SERVER_PRIVATE_KEY
      remoteRef:
        key: APP_FLEET_SERVER_PRIVATE_KEY
