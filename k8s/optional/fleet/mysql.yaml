apiVersion: v1
kind: Service
metadata:
  name: fleet-mysql
  namespace: fleet
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: fleet-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  # PLT-344 lot 1: renamed from fleet-mysql because volumeClaimTemplates are
  # immutable. The old StatefulSet's PVC data-fleet-mysql-0 (longhorn-bulk,
  # Retain) is kept as the rollback copy; deleting it is a separate lot.
  name: fleet-mysql-fast
  namespace: fleet
  labels:
    app.kubernetes.io/name: fleet-mysql
spec:
  serviceName: fleet-mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-mysql
      annotations:
        # Consistent logical dump before Velero copies the volume: the dump
        # lives on the data volume, outside the datadir. Restore from
        # /var/lib/mysql/dump/fleet.sql first; a restore drill is required
        # before activation (PLT-315).
        pre.hook.backup.velero.io/container: mysql
        pre.hook.backup.velero.io/timeout: 5m
        pre.hook.backup.velero.io/command: >-
          ["/bin/sh", "-ec", "umask 077; mkdir -p /var/lib/mysql/dump;
          trap 'rm -f /var/lib/mysql/dump/.fleet.sql.tmp' EXIT;
          MYSQL_PWD=\"$MYSQL_PASSWORD\" mysqldump --host=127.0.0.1 --user=fleet --protocol=tcp
          --single-transaction --quick --skip-lock-tables --no-tablespaces --routines --events --triggers
          fleet > /var/lib/mysql/dump/.fleet.sql.tmp; test -s /var/lib/mysql/dump/.fleet.sql.tmp;
          mv /var/lib/mysql/dump/.fleet.sql.tmp /var/lib/mysql/dump/fleet.sql"]
    spec:
      hostNetwork: false
      hostPID: false
      hostIPC: false
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          # Fleet requires MySQL >= 8.0.44 and is incompatible with 9.6.
          image: mysql:8.4.11@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
          imagePullPolicy: IfNotPresent
          # The volume root holds ext4 lost+found; MySQL initializes only an
          # empty data directory, so it uses a child directory of the volume.
          # PLT-344 L8: --skip-log-bin. Neither the Velero hook (logical
          # mysqldump) nor any restore path uses the binary log, so it only
          # costs a second fsync per commit on the bulk HDD.
          # PLT-344 D4: --innodb-flush-log-at-trx-commit=2 (Paul, 2026-11-15:
          # "Oui, Fleet flush=2"). The redo log is written at each commit but
          # fsynced about once per second: an OS or node crash can lose ~1 s
          # of transactions; a mysqld-only crash loses nothing. Backups are
          # unchanged. Revert this line to return to the default (1).
          args:
            - --datadir=/var/lib/mysql/data
            - --innodb-buffer-pool-size=256M
            - --skip-log-bin
            - --innodb-flush-log-at-trx-commit=2
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: fleet
            - name: MYSQL_USER
              value: fleet
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fleet-mysql
                  key: MYSQL_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fleet-mysql
                  key: MYSQL_ROOT_PASSWORD
          readinessProbe:
            exec:
              command: [sh, -c, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"']
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -c, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"']
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          # Keeps liveness off until mysqld accepts connections, so a first
          # start that restores a dump is not restarted halfway (PLT-344).
          startupProbe:
            exec:
              command: [sh, -c, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"']
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            # PLT-344 lot 1: the first start on the empty fast volume restores
            # the dump written by Job fleet-mysql-dump-plt344. The entrypoint
            # ignores it once the datadir exists. Removed in step 3.
            - name: data
              mountPath: /docker-entrypoint-initdb.d
              subPath: migration
              readOnly: true
            - name: run
              mountPath: /var/run/mysqld
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        # Adopts PVC data-fleet-mysql-fast-0 declared in mysql-migration.yaml.
        storageClassName: longhorn-fast
        resources:
          requests:
            # A Fleet database for ~6 hosts is tens of MiB; 10Gi leaves room
            # for the logical dump staged on the same volume.
            storage: 10Gi
