apiVersion: v1
kind: Service
metadata:
  name: fleet-mysql
  namespace: fleet
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: fleet-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fleet-mysql
  namespace: fleet
  labels:
    app.kubernetes.io/name: fleet-mysql
spec:
  serviceName: fleet-mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-mysql
    spec:
      hostNetwork: false
      hostPID: false
      hostIPC: false
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          # Fleet requires MySQL >= 8.0.44 and is incompatible with 9.6.
          image: mysql:8.4.11@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
          imagePullPolicy: IfNotPresent
          # The volume root holds ext4 lost+found; MySQL initializes only an
          # empty data directory, so it uses a child directory of the volume.
          args: [--datadir=/var/lib/mysql/data, --innodb-buffer-pool-size=256M]
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: fleet
            - name: MYSQL_USER
              value: fleet
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fleet-mysql
                  key: MYSQL_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fleet-mysql
                  key: MYSQL_ROOT_PASSWORD
          readinessProbe:
            exec:
              command: [sh, -c, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"']
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -c, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"']
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: run
              mountPath: /var/run/mysqld
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn-bulk
        resources:
          requests:
            storage: 5Gi
