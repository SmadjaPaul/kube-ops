# Consistent MySQL dump before the Velero run (02:35): Velero copies
# /var/lib/mysql live, which is not point-in-time. Restore from
# /backup/mysql-latest.sql first. A restore drill is required before
# activation (PLT-315).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fleet-mysql-dump
  namespace: fleet
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-bulk
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fleet-mysql-logical-backup
  namespace: fleet
spec:
  schedule: "10 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: fleet-backup
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          hostNetwork: false
          hostPID: false
          hostIPC: false
          enableServiceLinks: false
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mysqldump
              image: mysql:8.4.11@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
                - |
                  umask 077
                  target=/backup/mysql-latest.sql
                  tmp="/backup/.mysql-latest.sql.tmp.$$"
                  trap 'rm -f "$tmp" 2>/dev/null || true' EXIT
                  ready=no
                  for attempt in $(seq 1 12); do
                    if mysqladmin ping --host=fleet-mysql --port=3306 --user=fleet \
                      --protocol=tcp --connect-timeout=5 --silent >/dev/null 2>&1; then
                      ready=yes
                      break
                    fi
                    sleep 5
                  done
                  test "$ready" = yes
                  mysqldump --host=fleet-mysql --port=3306 --user=fleet --protocol=tcp \
                    --single-transaction --quick --skip-lock-tables --no-tablespaces \
                    --routines --events --triggers fleet > "$tmp"
                  test -s "$tmp"
                  mv "$tmp" "$target"
              env:
                - name: MYSQL_PWD
                  valueFrom:
                    secretKeyRef:
                      name: fleet-mysql
                      key: MYSQL_PASSWORD
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 300m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: dump
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: dump
              persistentVolumeClaim:
                claimName: fleet-mysql-dump
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
