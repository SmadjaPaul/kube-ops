apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: velero-daily-fleet
  namespace: velero
  labels:
    backup-tier: daily
    backup-app: fleet
spec:
  schedule: "35 2 * * *"
  template:
    includedNamespaces: [fleet]
    includedResources: ["*"]
    excludedResources: [events, storageclasses.storage.k8s.io]
    defaultVolumesToFsBackup: true
    storageLocation: r2
    ttl: 336h
