apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: arc-runners-homelab-infra-polyfin-oci
  namespace: arc-runners
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/part-of: github-actions-arc
    policy-type: github-actions-arc
spec:
  description: "Allow only the dedicated Polyfin OCI state endpoint"
  endpointSelector:
    matchLabels:
      k8s:actions.github.com/scale-set-name: homelab-infra-ci-arc
  egress:
    - toFQDNs:
        - matchName: axnvxxurxefp.compat.objectstorage.eu-paris-1.oraclecloud.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
