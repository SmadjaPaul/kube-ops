apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: arc-runners-homelab-infra-grafana-cloud
  namespace: arc-runners
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/part-of: github-actions-arc
    policy-type: github-actions-arc
spec:
  description: "Allow the homelab-infra CI runner to reach the Grafana Cloud API and the smadja stack only (terraform/grafana-cloud plan and apply)"
  endpointSelector:
    matchLabels:
      k8s:actions.github.com/scale-set-name: homelab-infra-ci-arc
  egress:
    - toFQDNs:
        - matchName: grafana.com
        - matchName: smadja.grafana.net
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
