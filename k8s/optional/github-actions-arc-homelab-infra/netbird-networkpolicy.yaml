apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: arc-runners-homelab-infra-netbird
  namespace: arc-runners
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/part-of: github-actions-arc
    policy-type: github-actions-arc
spec:
  description: "Allow the homelab-infra CI runner to reach the NetBird management API only (terraform/netbird plan)"
  endpointSelector:
    matchLabels:
      k8s:actions.github.com/scale-set-name: homelab-infra-ci-arc
  egress:
    - toFQDNs:
        - matchName: api.netbird.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
