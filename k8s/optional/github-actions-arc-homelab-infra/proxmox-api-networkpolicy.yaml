apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: arc-runners-homelab-infra-proxmox-api
  namespace: arc-runners
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/part-of: github-actions-arc
    policy-type: github-actions-arc
spec:
  description: "Allow the homelab-infra CI runner to reach the Proxmox API (10.0.20.51, TCP 8006) only, for terraform/proxmox plans (PLT-296). No other LAN address, no SSH."
  endpointSelector:
    matchLabels:
      k8s:actions.github.com/scale-set-name: homelab-infra-ci-arc
  egress:
    - toCIDR:
        - 10.0.20.51/32
      toPorts:
        - ports:
            - port: "8006"
              protocol: TCP
