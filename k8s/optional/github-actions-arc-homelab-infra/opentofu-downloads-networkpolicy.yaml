apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: arc-runners-homelab-infra-opentofu-downloads
  namespace: arc-runners
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/part-of: github-actions-arc
    policy-type: github-actions-arc
spec:
  description: "Allow the homelab-infra CI runner to download the pinned OpenTofu release"
  endpointSelector:
    matchLabels:
      k8s:actions.github.com/scale-set-name: homelab-infra-ci-arc
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: get.opentofu.org
        - matchPattern: "*.blob.core.windows.net"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
