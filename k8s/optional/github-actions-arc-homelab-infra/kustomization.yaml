apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The infrastructure ApplicationSet reconciles this directory. The privileged
# pilot remains dormant at the GitHub workflow layer until its environment and
# owner admission are configured.
resources:
  - runner-application.yaml
  - runner-pilot-application.yaml
  - egress-networkpolicy.yaml
  - pilot-egress-networkpolicy.yaml
