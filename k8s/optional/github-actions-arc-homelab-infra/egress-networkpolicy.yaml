apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: arc-runners-homelab-infra-downloads
  namespace: arc-runners
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/part-of: github-actions-arc
    policy-type: github-actions-arc
spec:
  description: "Allow only homelab-infra ARC runners to download the locked CI toolchain"
  endpointSelector:
    matchLabels:
      k8s:actions.github.com/scale-set-name: homelab-infra-ci-arc
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
        - matchName: codeload.github.com
        - matchName: objects.githubusercontent.com
        - matchName: objects-origin.githubusercontent.com
        - matchName: github-releases.githubusercontent.com
        - matchName: github-registry-files.githubusercontent.com
        - matchName: release-assets.githubusercontent.com
        - matchName: raw.githubusercontent.com
        - matchPattern: "*.actions.githubusercontent.com"
        - matchName: registry.opentofu.org
        - matchName: releases.hashicorp.com
        - matchName: mise.jdx.dev
        - matchName: pypi.org
        - matchName: files.pythonhosted.org
        - matchName: registry.npmjs.org
        - matchName: api.nuget.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
