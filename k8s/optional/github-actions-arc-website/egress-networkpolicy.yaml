# Default deny egress for every pod of the namespace (an egress policy selecting a
# pod denies all other egress). Allowed: DNS, GitHub (job protocol, checkout,
# Actions cache) and the npm registry. The LAN (10.0.0.0/8) and the Kubernetes API
# are not allowed. Enforcing from creation: no audit mode while a job can run.
# PRD-28: the partner build reads published Sanity content without a token
# (public dataset tli60dkb/production), so only the four Sanity read hosts are
# allowed, on 443. Phase 2/3 hosts: lechaplais.com (Verify Home, Verify Work Public,
# Rebuild public check) and api.cloudflare.com (Rebuild: deploy hook and Workers Builds API). Node, pnpm and Chromium are in the image.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: arc-runners-website-egress
  namespace: arc-runners-website
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/part-of: github-actions-arc
    policy-type: github-actions-arc
spec:
  description: "website ARC runners: DNS, GitHub, registry.npmjs.org and the Sanity read hosts of project tli60dkb, lechaplais.com and api.cloudflare.com only"
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
        - matchName: codeload.github.com
        - matchName: objects.githubusercontent.com
        - matchName: objects-origin.githubusercontent.com
        - matchName: github-releases.githubusercontent.com
        - matchName: github-registry-files.githubusercontent.com
        - matchName: release-assets.githubusercontent.com
        - matchName: raw.githubusercontent.com
        - matchPattern: "*.actions.githubusercontent.com"
        - matchPattern: "*.blob.core.windows.net"
        - matchName: registry.npmjs.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toFQDNs:
        - matchName: api.sanity.io
        - matchName: tli60dkb.api.sanity.io
        - matchName: tli60dkb.apicdn.sanity.io
        - matchName: cdn.sanity.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toFQDNs:
        - matchName: lechaplais.com
        - matchName: api.cloudflare.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
