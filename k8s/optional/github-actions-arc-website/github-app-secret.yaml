# Same ARC GitHub App credentials as arc-runners, copied by ESO from the existing
# Doppler ClusterSecretStore. Read only by the ARC controller and listener (the
# controller copies what the listener needs); never mounted in the runner pod.
# The website repository must be added to the App installation (owner action).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app
  namespace: arc-runners-website
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: arc-github-app
    creationPolicy: Owner
  data:
    - secretKey: github_app_id
      remoteRef:
        key: APP_GITHUB_ARC_ID
    - secretKey: github_app_installation_id
      remoteRef:
        key: APP_GITHUB_ARC_INSTALLATION_ID
    - secretKey: github_app_private_key
      remoteRef:
        key: APP_GITHUB_ARC_PRIVATE_KEY
