apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# PRD-28: dedicated ARC scale set for SmadjaPaul/website (docs/architecture/website-on-arc.md
# in homelab-infra). Synced from main by the infrastructure ApplicationSet
# (k8s/bootstrap/argocd-root/infrastructure-applicationset.yaml). The shared controller in
# arc-systems (github-actions-arc) watches every namespace.
resources:
  - namespace.yaml
  - github-app-secret.yaml
  - runner-quota.yaml
  - egress-networkpolicy.yaml
  - runner-application.yaml
