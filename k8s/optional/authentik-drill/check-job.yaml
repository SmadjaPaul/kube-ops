# PLT-221: read-only control query on the restored drill database.
# Prints table row counts and two max timestamps only (no row content), in a
# read-only transaction, from the drill namespace to the drill cluster.
# Removed with the whole drill directory by the teardown PR.
apiVersion: batch/v1
kind: Job
metadata:
  name: authentik-drill-check
  namespace: authentik-drill
  labels:
    restore.smadja.dev/purpose: isolated-read-only-recovery
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        restore.smadja.dev/purpose: isolated-read-only-recovery
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        fsGroup: 26
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: check
          image: ghcr.io/cloudnative-pg/postgresql:17.7
          env:
            - name: PGURI
              valueFrom:
                secretKeyRef: {name: authentik-postgresql-restore-app, key: uri}
            - name: PGOPTIONS
              value: "-c default_transaction_read_only=on"
          command: ["/bin/bash", "-ec"]
          args:
            - |
              psql "$PGURI" -v ON_ERROR_STOP=1 -At <<'SQL'
              SELECT 'in_recovery=' || pg_is_in_recovery();
              SELECT 'tx_read_only=' || current_setting('transaction_read_only');
              SELECT 'db_size_bytes=' || pg_database_size(current_database());
              SELECT 'user_tables=' || count(*) FROM pg_tables WHERE schemaname NOT IN ('pg_catalog', 'information_schema');
              SELECT format('SELECT %L || count(*) FROM %I.%I', 'count.' || schemaname || '.' || tablename || '=', schemaname, tablename)
                FROM pg_tables WHERE schemaname NOT IN ('pg_catalog', 'information_schema') ORDER BY schemaname, tablename \gexec
              SELECT 'max_ts.event.created=' || coalesce(max(created)::text, 'null') FROM authentik_events_event;
              SELECT 'max_ts.user.last_login=' || coalesce(max(last_login)::text, 'null') FROM authentik_core_user;
              SELECT 'count.users_active=' || count(*) FROM authentik_core_user WHERE is_active;
              SQL
              # RPO evidence; best effort (some functions may need pg_monitor).
              psql "$PGURI" -At <<'SQL' || true
              SELECT 'last_replayed_xact=' || coalesce(pg_last_xact_replay_timestamp()::text, 'null');
              SELECT 'current_walfile=' || pg_walfile_name(pg_current_wal_lsn());
              SELECT 'checkpoint_timeline=' || timeline_id || ' redo_walfile=' || redo_wal_file || ' checkpoint_time=' || checkpoint_time FROM pg_control_checkpoint();
              SELECT 'postmaster_start=' || pg_postmaster_start_time();
              SQL
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
