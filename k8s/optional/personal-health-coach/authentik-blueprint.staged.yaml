# Staged only: activate after the dedicated client secret exists in Doppler.
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Apps - Personal Health Coach
entries:
  - id: personal_health_coach_provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers: {name: "Personal Health Coach"}
    attrs:
      name: "Personal Health Coach"
      client_id: personal-health-coach
      client_secret: !Env PERSONAL_HEALTH_COACH_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "default-provider-invalidation-flow"]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - {url: https://coach.smadja.dev/auth/callback, matching_mode: strict}
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "groups"]]
  - id: personal_health_coach_application
    model: authentik_core.application
    identifiers: {slug: personal-health-coach}
    attrs:
      name: Personal Health Coach
      slug: personal-health-coach
      provider: !KeyOf personal_health_coach_provider
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf personal_health_coach_application, group: !Find [authentik_core.group, [name, "family"]]}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf personal_health_coach_application, group: !Find [authentik_core.group, [name, "authentik-admins"]]}
