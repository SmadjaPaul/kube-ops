# PLT-315: restore drill of the Fleet MySQL logical dump, before activation.
# Same image and mysqld arguments as k8s/optional/fleet/mysql.yaml. The pod
# generates a throwaway password in memory, never prints it, and prints only
# non-secret results. All data is synthetic and lives in emptyDir volumes.
#   1. initialize MySQL with --datadir=/var/lib/mysql/data on a volume whose
#      root holds lost+found (as the ext4 PVC does);
#   2. seed synthetic rows and write the dump with the exact Velero hook command;
#   3. wipe the datadir, initialize an empty server again, restore the dump;
#   4. compare row counts and a checksum.
apiVersion: batch/v1
kind: Job
metadata:
  name: fleet-mysql-restore-drill
  namespace: fleet-drill
  labels:
    restore.smadja.dev/purpose: isolated-restore-drill
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        restore.smadja.dev/purpose: isolated-restore-drill
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: volume-root
          image: mysql:8.4.11@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
          command: ["/bin/sh", "-ec", "mkdir -p /var/lib/mysql/lost+found && ls -A /var/lib/mysql"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
      containers:
        - name: drill
          image: mysql:8.4.11@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              PW=$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9')
              export MYSQL_DATABASE=fleet MYSQL_USER=fleet MYSQL_PASSWORD="$PW" MYSQL_ROOT_PASSWORD="${PW}R"
              ARGS=(--datadir=/var/lib/mysql/data --innodb-buffer-pool-size=256M)
              start() {
                docker-entrypoint.sh mysqld "${ARGS[@]}" >/tmp/mysqld.log 2>&1 &
                SRV=$!
                for _ in $(seq 1 90); do
                  if mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" >/dev/null 2>&1; then return 0; fi
                  kill -0 "$SRV" 2>/dev/null || { echo "DRILL_FAIL mysqld exited"; tail -n 20 /tmp/mysqld.log | sed "s/$PW/[MASQUE]/g"; exit 1; }
                  sleep 2
                done
                echo "DRILL_FAIL mysqld not ready"; exit 1
              }
              q() { MYSQL_PWD="$MYSQL_PASSWORD" mysql -h 127.0.0.1 -ufleet -N -B fleet -e "$1"; }

              echo "volume_root=$(ls -A /var/lib/mysql | tr '\n' ' ')"
              start
              echo "datadir=$(q 'SELECT @@datadir')"
              echo "version=$(q 'SELECT VERSION()')"
              test -f /var/lib/mysql/data/ibdata1 && echo "datadir_initialized=yes"
              q "CREATE TABLE hosts (id INT PRIMARY KEY AUTO_INCREMENT, name VARCHAR(64) NOT NULL, note TEXT) ENGINE=InnoDB;
                 INSERT INTO hosts (name, note) SELECT CONCAT('host-', n), REPEAT('x', 100) FROM (WITH RECURSIVE s(n) AS (SELECT 1 UNION ALL SELECT n+1 FROM s WHERE n<500) SELECT n FROM s) t;"
              BEFORE="$(q 'SELECT COUNT(*) FROM hosts') $(q 'CHECKSUM TABLE hosts' | cut -f2)"
              echo "seeded count_checksum=$BEFORE"

              # Exact Velero pre-backup hook command of k8s/optional/fleet/mysql.yaml.
              /bin/sh -ec "umask 077; mkdir -p /var/lib/mysql/dump;
                trap 'rm -f /var/lib/mysql/dump/.fleet.sql.tmp' EXIT;
                MYSQL_PWD=\"$MYSQL_PASSWORD\" mysqldump --host=127.0.0.1 --user=fleet --protocol=tcp
                --single-transaction --quick --skip-lock-tables --no-tablespaces --routines --events --triggers
                fleet > /var/lib/mysql/dump/.fleet.sql.tmp; test -s /var/lib/mysql/dump/.fleet.sql.tmp;
                mv /var/lib/mysql/dump/.fleet.sql.tmp /var/lib/mysql/dump/fleet.sql"
              echo "dump_bytes=$(stat -c %s /var/lib/mysql/dump/fleet.sql)"

              MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin -h 127.0.0.1 -uroot shutdown
              wait "$SRV"
              rm -rf /var/lib/mysql/data
              echo "datadir_wiped volume_root=$(ls -A /var/lib/mysql | tr '\n' ' ')"

              start
              echo "restore_target_tables_before=$(q 'SELECT COUNT(*) FROM information_schema.tables WHERE table_schema="fleet"')"
              MYSQL_PWD="$MYSQL_PASSWORD" mysql -h 127.0.0.1 -ufleet fleet < /var/lib/mysql/dump/fleet.sql
              AFTER="$(q 'SELECT COUNT(*) FROM hosts') $(q 'CHECKSUM TABLE hosts' | cut -f2)"
              echo "restored count_checksum=$AFTER"
              if [ "$BEFORE" = "$AFTER" ]; then echo "DRILL_RESULT=PASS"; else echo "DRILL_RESULT=FAIL mismatch"; exit 1; fi
              MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin -h 127.0.0.1 -uroot shutdown
              wait "$SRV"
          resources:
            requests: {cpu: 50m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
            - {name: run, mountPath: /var/run/mysqld}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 1Gi}
        - name: run
          emptyDir: {sizeLimit: 16Mi}
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
