# No ingress and no egress: the drill is a self-contained pod with a synthetic
# database. DNS is not needed (127.0.0.1 only).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: fleet-drill-deny-all
  namespace: fleet-drill
  labels: {policy-type: platform}
  annotations:
    argocd.argoproj.io/sync-wave: "-13"
spec:
  description: "PLT-315 Fleet restore drill: isolated, no ingress, no egress."
  endpointSelector: {}
  ingressDeny:
    - fromEntities: [all]
  egressDeny:
    - toEntities: [all]
