apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-arc-agent-harness-ci
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: applications
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.15.0
    helm:
      # The release name is the runs-on label: `runs-on: agent-harness-ci-arc`.
      releaseName: agent-harness-ci-arc
      valuesObject:
        githubConfigUrl: https://github.com/SmadjaPaul/agent-harness
        # Used only by the controller and listener; never mounted in the runner.
        githubConfigSecret: arc-github-app
        # Ephemeral runner pods, none idle: budget minimal.
        minRunners: 0
        maxRunners: 1
        controllerServiceAccount:
          namespace: arc-systems
          name: arc-gha-rs-controller
        template:
          spec:
            automountServiceAccountToken: false
            securityContext:
              runAsNonRoot: true
              runAsUser: 1001
              runAsGroup: 1001
              fsGroup: 1001
              fsGroupChangePolicy: OnRootMismatch
            # PLT-417: job workspace and /tmp go to a per-pod Longhorn bulk (HDD)
            # volume deleted with the pod, not to the Talos system disk that also
            # holds etcd (single QLC NVMe: CI was ~40 % of the node's disk writes).
            # longhorn-bulk-scratch is Delete/WaitForFirstConsumer; longhorn-bulk is
            # Retain and would leak one volume per job. Rollback: revert the PR.
            volumes:
              - name: work
                ephemeral:
                  volumeClaimTemplate:
                    spec:
                      accessModes: [ReadWriteOnce]
                      storageClassName: longhorn-bulk-scratch
                      resources:
                        requests: {storage: 10Gi}
              - name: tmp
                ephemeral:
                  volumeClaimTemplate:
                    spec:
                      accessModes: [ReadWriteOnce]
                      storageClassName: longhorn-bulk-scratch
                      resources:
                        requests: {storage: 5Gi}
            containers:
              - name: runner
                # Common tooled runner (images/arc-ci-runner); rollback: official runner digest in github-actions-arc/README.md.
                image: ghcr.io/smadjapaul/arc-ci-runner:tools1-576e0cb@sha256:087f055d11e3c2a0afd3606fa9b3a45b54a80401c201cd8df0cb261023557709
                command: ["/home/runner/run.sh"]
                volumeMounts:
                  - {name: work, mountPath: /home/runner/_work}
                  - {name: tmp, mountPath: /tmp}
                # PLT-490: no Agentgateway key here; it lives in the agents scale set only.
                resources:
                  requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 512Mi}
                  limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 4Gi}
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities: {drop: ["ALL"]}
                  seccompProfile: {type: RuntimeDefault}
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners-agent-harness
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
