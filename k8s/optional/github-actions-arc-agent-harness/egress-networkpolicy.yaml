# Default deny egress for every pod of the namespace. Allowed: DNS, GitHub (job protocol, checkout,
# Actions cache, setup-node manifest and tarballs, gitleaks release download) and registry.npmjs.org
# (npm install -g @anthropic-ai/claude-code). The LAN and the Kubernetes API are not allowed.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: arc-runners-agent-harness-egress
  namespace: arc-runners-agent-harness
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/part-of: github-actions-arc
    policy-type: github-actions-arc
spec:
  description: "agent-harness ARC runners: DNS, GitHub and registry.npmjs.org only"
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
        - matchName: codeload.github.com
        - matchName: objects.githubusercontent.com
        - matchName: objects-origin.githubusercontent.com
        - matchName: github-releases.githubusercontent.com
        - matchName: github-registry-files.githubusercontent.com
        - matchName: release-assets.githubusercontent.com
        - matchName: raw.githubusercontent.com
        - matchPattern: "*.actions.githubusercontent.com"
        - matchPattern: "*.blob.core.windows.net"
        - matchName: registry.npmjs.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
