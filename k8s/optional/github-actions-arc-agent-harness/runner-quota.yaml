# PLT-490: two runners (ci + agents scale sets, one each), 250m CPU request each. This value is kept unchanged: it dates from the
# former resource constraint (node at 67 % of allocatable CPU requests against a 70 %
# ceiling, D-2026-11-15-05), which D-2026-11-20-03 lifts. The cap is not re-derived here;
# revisit it before raising the runner count.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: arc-runner-agent-harness-bounds
  namespace: arc-runners-agent-harness
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  hard:
    pods: "3"
    requests.cpu: 750m
    requests.memory: 3Gi
    limits.cpu: "6"
    limits.memory: 12Gi
    requests.ephemeral-storage: 3Gi
    limits.ephemeral-storage: 16Gi
