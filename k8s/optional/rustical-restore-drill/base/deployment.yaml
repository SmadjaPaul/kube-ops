apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustical-restore-fixture
  labels:
    app.kubernetes.io/name: rustical-restore-fixture
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rustical-restore-fixture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustical-restore-fixture
        app.kubernetes.io/part-of: rustical-restore-drill
        backup.smadja.dev/velero: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustical
          image: ghcr.io/lennart-k/rustical:0.18.0@sha256:33ec65f695eeed3fafb15270f274a89f7201d2bb3ffe3369e1be1a94e04af880
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          env:
            # The exact v0.18.0 Figment path is data_store.sqlite.db_url.
            - name: RUSTICAL_DATA_STORE__SQLITE__DB_URL
              value: /var/lib/rustical/db.sqlite3
            - name: RUSTICAL_HTTP__BIND
              value: 0.0.0.0:4000
            - name: RUSTICAL_FRONTEND__ALLOW_PASSWORD_LOGIN
              value: "true"
            - name: RUSTICAL_DAV_PUSH__ENABLED
              value: "false"
            - name: RUSTICAL_NEXTCLOUD_LOGIN__ENABLED
              value: "false"
          # No OIDC, no Doppler, no inherited family users; create synthetic
          # local principals only through an approved scoped drill.
          readinessProbe:
            exec:
              command: ["/usr/local/bin/rustical", "health"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["/usr/local/bin/rustical", "health"]
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/rustical
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustical-restore-fixture-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
