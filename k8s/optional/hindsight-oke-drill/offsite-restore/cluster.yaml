# Off-Oracle restore of the OKE Hindsight archive on the homelab. No WAL
# archiver: the drill writes nothing to R2.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hindsight-db-offsite
  namespace: hindsight-oke-drill
  labels:
    backup.smadja.dev/restore-drill: "true"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7-standard-trixie@sha256:e079dae5253fa6ed26fc65fda06d515af764dbec392dd4b46b17ab11eebd8131
  bootstrap:
    recovery:
      source: hindsight-oke
      database: hindsight
      owner: hindsight
      # No secret: CNPG generates hindsight-db-offsite-app for the drill.
  externalClusters:
    - name: hindsight-oke
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: hindsight-oke-r2-ro
          serverName: hindsight-db
  storage: {size: 10Gi, storageClass: longhorn-bulk}
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  affinity:
    enablePodAntiAffinity: false
