# Read-only identity of bucket homelab-backup-cnpg: the drill never writes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-oke-drill-r2-ro
  namespace: hindsight-oke-drill
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: hindsight-oke-drill-r2-ro, creationPolicy: Owner}
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: {key: R2_CNPG_RESTORE_RO_ACCESS_KEY_ID}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: {key: R2_CNPG_RESTORE_RO_SECRET_ACCESS_KEY}
    - secretKey: AWS_ENDPOINT_URL_S3
      remoteRef: {key: R2_S3_ENDPOINT}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-db-offsite-app
  namespace: hindsight-oke-drill
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target:
    name: hindsight-db-offsite-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: hindsight
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: {key: APP_HINDSIGHT_DB_PASSWORD}
