# PLT-301: read-only fingerprint Job. Kustomize sets the namespace; the
# patches in each user set the CNPG Cluster and the credentials Secret.
# CNPG CA (no TLS bypass). Output: kubectl-ro.sh logs job/hindsight-fingerprint.
apiVersion: batch/v1
kind: Job
metadata:
  name: hindsight-fingerprint
spec:
  backoffLimit: 8
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: psql
          image: ghcr.io/cloudnative-pg/postgresql:17.7-standard-trixie@sha256:e079dae5253fa6ed26fc65fda06d515af764dbec392dd4b46b17ab11eebd8131
          command: [psql, -v, ON_ERROR_STOP=1, -f, /sql/fingerprint.sql]
          env:
            - {name: PGHOST, value: CLUSTER-ro}
            - {name: PGDATABASE, value: hindsight}
            - {name: PGSSLMODE, value: verify-full}
            - {name: PGSSLROOTCERT, value: /ca/ca.crt}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: SECRET, key: username}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: SECRET, key: password}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: sql, mountPath: /sql}
            - {name: ca, mountPath: /ca}
      volumes:
        - name: sql
          configMap: {name: hindsight-fingerprint-sql}
        - name: ca
          secret:
            secretName: CLUSTER-ca
            items: [{key: ca.crt, path: ca.crt}]
