apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-factory-ghcr-pull
  namespace: arc-runners
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: arc-factory-ghcr-pull
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"SmadjaPaul","password":"{{ .token }}","auth":"{{ printf "%s:%s" "SmadjaPaul" .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: APP_FACTORY_ARC_GHCR_READ_TOKEN
