apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-arc-factory-ci
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: applications
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.15.0
    helm:
      releaseName: factory-ci-arc
      valuesObject:
        githubConfigUrl: https://github.com/SmadjaPaul/factory-platform
        githubConfigSecret: arc-github-app
        minRunners: 0
        maxRunners: 3
        controllerServiceAccount:
          namespace: arc-systems
          name: arc-gha-rs-controller
        # No containerMode: first pilot only executes simple steps without
        # Docker, Kubernetes API privileges or PostgreSQL service containers.
        template:
          spec:
            automountServiceAccountToken: false
            securityContext:
              runAsNonRoot: true
              runAsUser: 1001
              runAsGroup: 1001
              fsGroup: 1001
              fsGroupChangePolicy: OnRootMismatch
            containers:
              - name: runner
                image: ghcr.io/actions/actions-runner:2.338.0@sha256:4ffadc0002b2581327e06101fc8c06cd189232baf79fe561fac9caeb76f5e807
                command: ["/home/runner/run.sh"]
                resources:
                  requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 512Mi}
                  limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 4Gi}
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities: {drop: ["ALL"]}
                  seccompProfile: {type: RuntimeDefault}
              # The runner pod is created for one GitHub job and removed after
              # it exits. Keeping PostgreSQL in the same pod gives the job a
              # disposable localhost-only database without Docker or API RBAC.
              - name: postgres
                image: >-
                  postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
                args: ["-c", "listen_addresses=localhost"]
                env:
                  - name: POSTGRES_USER
                    value: factory
                  - name: POSTGRES_PASSWORD
                    value: factory
                  - name: POSTGRES_DB
                    value: factory
                ports:
                  - name: postgres
                    containerPort: 5432
                    protocol: TCP
                startupProbe:
                  exec:
                    command: ["pg_isready", "-U", "factory", "-d", "factory"]
                  periodSeconds: 2
                  failureThreshold: 60
                readinessProbe:
                  exec:
                    command: ["pg_isready", "-U", "factory", "-d", "factory"]
                  periodSeconds: 2
                  timeoutSeconds: 2
                resources:
                  requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 512Mi}
                  limits: {cpu: "1", memory: 1Gi, ephemeral-storage: 2Gi}
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 70
                  runAsGroup: 70
                  allowPrivilegeEscalation: false
                  capabilities: {drop: ["ALL"]}
                  seccompProfile: {type: RuntimeDefault}
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
