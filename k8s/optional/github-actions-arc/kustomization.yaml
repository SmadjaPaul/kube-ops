apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Staged by design. This directory is not referenced by any live Argo ApplicationSet.
# Activate only after review, GitHub App installation and successful security validation.
resources:
  - namespaces.yaml
  - github-app-secret.yaml
  - controller-application.yaml
  - runner-application.yaml
  - runner-quota.yaml
  - github-egress-networkpolicy.yaml
  - factory-sts-egress-networkpolicy.yaml
  - factory-gcp-credentials-egress-networkpolicy.yaml
  - factory-gcs-egress-networkpolicy.yaml
