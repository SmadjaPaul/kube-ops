apiVersion: v1
kind: ResourceQuota
metadata:
  name: arc-runner-bounds
  namespace: arc-runners
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  hard:
    pods: "8"
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "12"
    limits.memory: 12Gi
    requests.ephemeral-storage: 12Gi
    limits.ephemeral-storage: 24Gi
