apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: factory-arc-dependency-cache
  namespace: arc-runners
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/part-of: github-actions-arc
    storage.smadja.dev/data-class: reconstructible
    storage.smadja.dev/backup-contract: exclude
    velero.io/exclude-from-backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-bulk
  resources:
    requests:
      storage: 8Gi
