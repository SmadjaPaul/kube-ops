apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: arc-github-app
    creationPolicy: Owner
  data:
    - secretKey: github_app_id
      remoteRef:
        key: APP_GITHUB_ARC_ID
    - secretKey: github_app_installation_id
      remoteRef:
        key: APP_GITHUB_ARC_INSTALLATION_ID
    - secretKey: github_app_private_key
      remoteRef:
        key: APP_GITHUB_ARC_PRIVATE_KEY
