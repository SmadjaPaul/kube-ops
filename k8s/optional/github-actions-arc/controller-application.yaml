apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-arc-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infrastructure
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set-controller
    targetRevision: 0.15.0
    helm:
      releaseName: arc
      valuesObject:
        replicaCount: 1
        # PLT-459: controller and listener metrics (chart 0.15.0, port name
        # `metrics`). Without this block the chart passes `--metrics-addr=0`
        # and `--listener-metrics-addr=0`, so no gha_* series exist. The
        # controller recreates the listener pods when its flags change.
        metrics:
          controllerManagerAddr: ":8080"
          listenerAddr: ":8080"
          listenerEndpoint: "/metrics"
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-systems
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
