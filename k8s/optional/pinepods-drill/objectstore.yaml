# Read-only recovery source. Same destinationPath as
# the production pinepods R2 ObjectStore. No retentionPolicy, no serverName, and never
# referenced by a Cluster spec.plugins entry or a (Scheduled)Backup.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: pinepods-r2-source
  namespace: pinepods-drill
  labels:
    restore.smadja.dev/purpose: isolated-read-only-recovery
  annotations:
    argocd.argoproj.io/sync-wave: "-11"
spec:
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
      - name: AWS_DEFAULT_REGION
        value: auto
      - name: AWS_ENDPOINT_URL_S3
        valueFrom:
          secretKeyRef: {name: cnpg-r2-restore-ro, key: AWS_ENDPOINT_URL_S3}
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
  configuration:
    destinationPath: s3://homelab-backup-cnpg/pinepods
    s3Credentials:
      accessKeyId: {name: cnpg-r2-restore-ro, key: AWS_ACCESS_KEY_ID}
      secretAccessKey: {name: cnpg-r2-restore-ro, key: AWS_SECRET_ACCESS_KEY}
    wal: {compression: gzip}
    data: {compression: gzip}
