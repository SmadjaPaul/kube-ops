apiVersion: v1
kind: Namespace
metadata:
  name: drill-ntfy2
  annotations:
    # Before the CiliumNetworkPolicy (-13) and the other drill resources.
    argocd.argoproj.io/sync-wave: "-14"
  labels:
    app.kubernetes.io/part-of: platform
    restore.smadja.dev/purpose: isolated-restore-drill
    # baseline (not restricted): Velero injects its restore-wait init container
    # into restored pods. Restricted stays on warn/audit.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
