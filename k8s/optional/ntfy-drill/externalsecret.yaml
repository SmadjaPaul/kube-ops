# Same Doppler key as the production ntfy-runtime ExternalSecret: the restored
# init container reads NTFY_PASSWORD. The Secret stays inside the isolated
# namespace (no egress) and is never printed. Secrets and ExternalSecrets of
# the source namespace are excluded from the Restore.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-runtime
  namespace: drill-ntfy
  labels:
    restore.smadja.dev/purpose: isolated-restore-drill
  annotations:
    argocd.argoproj.io/sync-wave: "-12"
spec:
  refreshInterval: 1h
  secretStoreRef: {name: doppler-cluster, kind: ClusterSecretStore}
  target: {name: ntfy-runtime, creationPolicy: Owner}
  data:
    - secretKey: NTFY_PASSWORD
      remoteRef: {key: APP_NTFY_ADMIN_PASSWORD}
