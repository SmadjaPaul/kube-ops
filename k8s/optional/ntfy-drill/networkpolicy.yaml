# Default deny for the drill namespace: ingress only from the same namespace
# (the check Job), egress only to the same namespace and cluster DNS. No
# Gateway, no kube-apiserver, no Internet. The CiliumNetworkPolicy of the
# source namespace is excluded from the Restore, so nothing widens this.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: drill-ntfy2-isolation
  namespace: drill-ntfy2
  labels: {policy-type: platform}
  annotations:
    argocd.argoproj.io/sync-wave: "-13"
spec:
  description: "PLT-222 ntfy restore drill: same-namespace ingress, egress to the namespace and DNS only."
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: drill-ntfy2
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: drill-ntfy2
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
          rules:
            dns:
              - matchPattern: "*"
