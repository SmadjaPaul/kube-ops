apiVersion: platform.smadja.dev/v1
kind: Application
metadata:
  name: idp-e2e
  owner: "user:default/paul"
  description: "App web interne idp-e2e (traefik/whoami)"
spec:
  profile: web
  source:
    image: "traefik/whoami:v1.10.3@sha256:43a68d10b9dfcfc3ffbfe4dd42100dc9aeaf29b3a5636c856337a5940f1b4f1c"
  runtime:
    replicas: 2
    size: "medium"
    port: 80
    healthPath: "/health"
  exposure:
    mode: private
    auth: none
  backup:
    policy: stateless
  observability:
    metrics: false
    path: "/metrics"
