apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: atlantis-infra-webhook
  namespace: atlantis-infra
  labels:
    app.kubernetes.io/part-of: atlantis-v2
spec:
  parentRefs:
    - name: external
      namespace: gateway
  hostnames:
    - atlantis-infra-webhook.smadja.dev
  rules:
    - matches:
        - path:
            type: Exact
            value: /events
      backendRefs:
        - name: atlantis-infra
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: atlantis-infra-ui
  namespace: atlantis-infra
  labels:
    app.kubernetes.io/part-of: atlantis-v2
spec:
  parentRefs:
    - name: internal
      namespace: gateway
  hostnames:
    - atlantis-infra.smadja.dev
  rules:
    - backendRefs:
        - name: atlantis-infra
          port: 80
