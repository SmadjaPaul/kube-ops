apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlantis-infra-unifi-backend
  namespace: atlantis-infra
  annotations:
    smadja.dev/secret-contract-revision: atlantis-v2-unifi-backend-v1
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: atlantis-infra-unifi-backend
    creationPolicy: Owner
  template:
    type: Opaque
    data:
      AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
      AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
      AWS_REGION: eu-paris-1
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: ATLANTIS_UNIFI_S3_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: ATLANTIS_UNIFI_S3_SECRET_ACCESS_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlantis-infra-unifi-provider
  namespace: atlantis-infra
  annotations:
    smadja.dev/secret-contract-revision: atlantis-v2-unifi-provider-v1
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: atlantis-infra-unifi-provider
    creationPolicy: Owner
  data:
    - secretKey: TF_VAR_unifi_api_url
      remoteRef:
        key: ATLANTIS_UNIFI_API_URL
    - secretKey: TF_VAR_unifi_integration_api_key
      remoteRef:
        key: ATLANTIS_UNIFI_INTEGRATION_API_KEY
    - secretKey: TF_VAR_unifi_verify_ssl
      remoteRef:
        key: ATLANTIS_UNIFI_VERIFY_SSL
    - secretKey: TF_VAR_wifi_trusted_password
      remoteRef:
        key: ATLANTIS_UNIFI_WIFI_TRUSTED_PASSWORD
    - secretKey: TF_VAR_wifi_iot_password
      remoteRef:
        key: ATLANTIS_UNIFI_WIFI_IOT_PASSWORD
    - secretKey: TF_VAR_wifi_guest_password
      remoteRef:
        key: ATLANTIS_UNIFI_WIFI_GUEST_PASSWORD
    - secretKey: TF_VAR_wifi_media_password
      remoteRef:
        key: ATLANTIS_UNIFI_WIFI_MEDIA_PASSWORD
