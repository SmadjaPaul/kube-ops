apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: atlantis-infra
  namespace: atlantis-infra
spec:
  template:
    metadata:
      labels:
        atlantis.smadja.dev/domain: infra
      annotations:
        atlantis.smadja.dev/config-revision: "2026-11-09-v2-infra"
    spec:
      volumes:
        - name: atlantis-home-dir
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp-dir
          emptyDir:
            sizeLimit: 128Mi
