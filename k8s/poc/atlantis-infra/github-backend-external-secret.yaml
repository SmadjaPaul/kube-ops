apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlantis-infra-github-backend
  namespace: atlantis-infra
  annotations:
    smadja.dev/secret-contract-revision: atlantis-v2-github-backend-v1
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: atlantis-infra-github-backend
    creationPolicy: Owner
  template:
    type: Opaque
    data:
      AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
      AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
      AWS_REGION: eu-paris-1
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: OCI_S3_GITHUB_ACCESS_KEY
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: OCI_S3_GITHUB_SECRET_KEY
