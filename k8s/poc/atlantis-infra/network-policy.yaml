apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: atlantis-infra
  namespace: atlantis-infra
spec:
  description: >-
    Atlantis Infra domain: signed GitHub webhook/UI ingress, monitoring, DNS,
    GitHub/provider registries, dedicated OCI S3 endpoints, and UniFi only for
    the explicitly admitted UniFi project.
  endpointSelector:
    matchLabels:
      app: atlantis
      release: atlantis-infra
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "4141"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
            k8s:app.kubernetes.io/instance: kube-prometheus-stack-prometheus
      toPorts:
        - ports:
            - port: "4141"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toFQDNs:
        - matchName: api.github.com
        - matchName: github.com
        - matchName: codeload.github.com
        - matchName: objects.githubusercontent.com
        - matchName: get.opentofu.org
        - matchName: registry.opentofu.org
        - matchName: registry.terraform.io
        - matchName: release-assets.githubusercontent.com
        - matchName: axnvxxurxefp.compat.objectstorage.eu-paris-1.oraclecloud.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toCIDRSet:
        - cidr: 10.0.20.1/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
