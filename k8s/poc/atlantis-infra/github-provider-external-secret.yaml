apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlantis-infra-github-provider
  namespace: atlantis-infra
  annotations:
    smadja.dev/secret-contract-revision: atlantis-v2-github-provider-v1
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: atlantis-infra-github-provider
    creationPolicy: Owner
  data:
    - secretKey: TF_VAR_github_app_id
      remoteRef:
        key: APP_GITHUB_IAC_ID
    - secretKey: TF_VAR_github_app_installation_id
      remoteRef:
        key: APP_GITHUB_IAC_INSTALLATION_ID
    - secretKey: TF_VAR_github_app_pem_file
      remoteRef:
        key: APP_GITHUB_IAC_PRIVATE_KEY
