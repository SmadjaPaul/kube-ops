fullnameOverride: atlantis-pilot

# Isolated pilot plus the GitHub as Code admission root after backend and App
# qualification. The Atlantis GitHub App remains distinct from the GitHub IaC
# App. Secret values are delivered through ESO from Doppler; the server-owned
# workflow selects the pilot or GitHub state identity by project. Apply is
# guarded by the mounted Conftest policies and post-apply state verification.
orgAllowlist: github.com/SmadjaPaul/homelab-infra
atlantisUrl: https://atlantis-webhook.smadja.dev

image:
  repository: ghcr.io/runatlantis/atlantis
  tag: v0.48.1@sha256:42bde40e38ec7b89f02a2968b4b1b74b990121eb8768d0a7de7caad125344298
  pullPolicy: IfNotPresent

githubApp:
  slug: smadja-atlantis
# Atlantis v0.48.1 decodes these two flags as int64. Keep the non-secret
# identity on Cobra's command line so it is parsed before Viper's environment
# decoding; the chart still owns the App slug and secret-file wiring above.
extraArgs:
  - --gh-app-id=5416988
  - --gh-app-installation-id=173903025
  - --enable-policy-checks
vcsSecretName: atlantis-github-app

allowForkPRs: false
allowDraftPRs: false
hidePrevPlanComments: true
hideUnchangedPlanComments: true
disableApply: false
disableApplyAll: true
disableRepoLocking: false
defaultTFDistribution: opentofu
defaultTFVersion: "1.13.1"

environment:
  ATLANTIS_ALLOW_COMMANDS: version,plan,apply,policy_check
  ATLANTIS_DISABLE_APPLY: "false"
  ATLANTIS_CHECKOUT_STRATEGY: merge
  ATLANTIS_RESTRICT_FILE_LIST: "true"
  ATLANTIS_FAIL_ON_PRE_WORKFLOW_HOOK_ERROR: "true"
  ATLANTIS_DISCARD_APPROVAL_ON_PLAN: "true"
  AWS_EC2_METADATA_DISABLED: "true"
  # Provider fallback channels are intentionally empty. The GitHub workflow
  # supplies only TF_VAR_github_app_* from the server-owned secret volume.
  GITHUB_TOKEN: ""
  GH_TOKEN: ""
  TF_VAR_github_token: ""
  GITHUB_APP_ID: ""
  GITHUB_APP_INSTALLATION_ID: ""
  GITHUB_APP_PEM_FILE: ""
  TF_CLI_ARGS: ""
  TF_CLI_ARGS_init: ""
  TF_CLI_ARGS_plan: ""
  TF_CLI_ARGS_apply: ""

environmentSecrets:
  - name: AWS_ACCESS_KEY_ID
    secretKeyRef:
      name: atlantis-pilot-backend
      key: AWS_ACCESS_KEY_ID
  - name: AWS_SECRET_ACCESS_KEY
    secretKeyRef:
      name: atlantis-pilot-backend
      key: AWS_SECRET_ACCESS_KEY
  - name: AWS_REGION
    secretKeyRef:
      name: atlantis-pilot-backend
      key: AWS_REGION

extraVolumes:
  - name: atlantis-pilot-conftest
    configMap:
      name: atlantis-pilot-conftest
  - name: atlantis-github-repository-safety
    configMap:
      name: atlantis-github-repository-safety
      defaultMode: 292
  - name: atlantis-server-admission
    configMap:
      name: atlantis-server-admission
      defaultMode: 365
  - name: atlantis-github-iac
    secret:
      secretName: atlantis-github-iac
      defaultMode: 288

extraVolumeMounts:
  - name: atlantis-pilot-conftest
    mountPath: /etc/atlantis/conftest
    readOnly: true
  - name: atlantis-github-repository-safety
    mountPath: /etc/atlantis/github-repository-safety
    readOnly: true
  - name: atlantis-server-admission
    mountPath: /etc/atlantis/admission
    readOnly: true
  - name: atlantis-github-iac
    mountPath: /etc/atlantis/github-iac
    readOnly: true

repoConfig: |
  repos:
    # Atlantis always has a default repo entry. Keep an explicit server-side
    # deny rule first so a future broad match cannot accidentally inherit an
    # executable workflow. The exact repository rule below wins last.
    - id: /.*/
      branch: /.*/
      workflow: atlantis-deny
      allowed_overrides: []
      allow_custom_workflows: false
    - id: github.com/SmadjaPaul/homelab-infra
      branch: /^main$/
      repo_config_file: .atlantis/plan-only.yaml
      workflow: atlantis-plan-only
      policy_check: true
      pre_workflow_hooks:
        - commands: plan, apply
          description: Enforce server-owned GitHub/fixture admission boundary
          run: /etc/atlantis/admission/github-atlantis-guard.sh
      # Plans are autonomous for this isolated pilot only. Keep the GitHub
      # mergeability and divergence gates. The exact apply workflow below is
      # separately bounded by the native Conftest policy and state verifier.
      plan_requirements: [mergeable, undiverged]
      apply_requirements: [mergeable, undiverged]
      import_requirements: [approved, mergeable, undiverged]
      repo_locks:
        mode: on_plan
      post_workflow_hooks:
        - commands: apply
          description: Verify the selected state after Atlantis apply
          run: |
            set -eu
            if test "$COMMAND_HAS_ERRORS" != "false"; then
              echo failure > "$OUTPUT_STATUS_FILE"
              exit 1
            fi
            test "$BASE_REPO_OWNER/$BASE_REPO_NAME" = "SmadjaPaul/homelab-infra"
            test "$HEAD_REPO_OWNER/$HEAD_REPO_NAME" = "$BASE_REPO_OWNER/$BASE_REPO_NAME"
            test "$BASE_BRANCH_NAME" = "main"
            if test "$PROJECT_NAME" = "github"; then
              test "$REPO_REL_DIR" = "terraform/github"
              TOFU=/atlantis-data/bin/tofu1.12.6
              test -x "$TOFU"
              cd "$DIR/terraform/github"
              test "$($TOFU workspace show)" = "default"
              "$TOFU" state list | grep -Fx 'github_repository.settings["homelab-infra"]'
              exit 0
            fi
            test "$PROJECT_NAME" = "atlantis-pilot"
            test "$HEAD_COMMIT" != ""
            test "$DIR" != ""
            TOFU=/atlantis-data/bin/tofu1.13.1
            test -x "$TOFU"
            if test -f "$DIR/backend.tf" && test -f "$DIR/main.tf"; then
              PILOT_DIR="$DIR"
            elif test -f "$DIR/terraform/atlantis-pilot/backend.tf" && test -f "$DIR/terraform/atlantis-pilot/main.tf"; then
              PILOT_DIR="$DIR/terraform/atlantis-pilot"
            else
              echo "Atlantis pilot root is not present at the expected project or checkout path" >&2
              echo failure > "$OUTPUT_STATUS_FILE"
              exit 1
            fi
            cd "$PILOT_DIR"
            test "$($TOFU workspace show)" = "default"
            test "$("$TOFU" state list)" = "terraform_data.pilot"
      allowed_overrides: []
      allow_custom_workflows: false
  policies:
    owners:
      # No GitHub identity is authorized to bypass the server-owned pilot
      # policy. A failing policy must be fixed in code, never approved away.
      users:
        - __atlantis_pilot_policy_no_bypass__
    approve_count: 1
    policy_sets:
      - name: atlantis-pilot-bounded-change
        path: /etc/atlantis/conftest
        source: local
        approve_count: 1
      - name: github-repository-destructive-safety
        path: /etc/atlantis/github-repository-safety
        source: local
        approve_count: 1
  metrics:
    prometheus:
      endpoint: /metrics
  workflows:
    atlantis-deny:
      plan:
        steps:
          - run: |
              echo "Atlantis server-side repository allowlist denied this repository" >&2
              exit 1
      apply:
        steps:
          - run: |
              echo "Atlantis server-side repository allowlist denied this repository" >&2
              exit 1
      import:
        steps:
          - run: |
              echo "Atlantis server-side repository allowlist denied this repository" >&2
              exit 1
      state_rm:
        steps:
          - run: |
              echo "Atlantis server-side repository allowlist denied this repository" >&2
              exit 1
    atlantis-plan-only:
      plan:
        steps:
          - env:
              name: TF_DATA_DIR
              command: 'printf "%s/atlantis-tofu-data-%s-%s" "${TMPDIR:-/tmp}" "$PROJECT_NAME" "$PULL_NUM"'
          - env:
              name: AWS_ACCESS_KEY_ID
              command: 'if test "$PROJECT_NAME" = github; then cat /etc/atlantis/github-iac/AWS_ACCESS_KEY_ID; else printf "%s" "$AWS_ACCESS_KEY_ID"; fi'
          - env:
              name: AWS_SECRET_ACCESS_KEY
              command: 'if test "$PROJECT_NAME" = github; then cat /etc/atlantis/github-iac/AWS_SECRET_ACCESS_KEY; else printf "%s" "$AWS_SECRET_ACCESS_KEY"; fi'
          - env:
              name: AWS_REGION
              command: 'if test "$PROJECT_NAME" = github; then cat /etc/atlantis/github-iac/AWS_REGION; else printf "%s" "$AWS_REGION"; fi'
          - env:
              name: TF_VAR_github_app_id
              command: 'if test "$PROJECT_NAME" = github; then cat /etc/atlantis/github-iac/APP_GITHUB_IAC_ID; else printf ""; fi'
          - env:
              name: TF_VAR_github_app_installation_id
              command: 'if test "$PROJECT_NAME" = github; then cat /etc/atlantis/github-iac/APP_GITHUB_IAC_INSTALLATION_ID; else printf ""; fi'
          - env:
              name: TF_VAR_github_app_pem_file
              command: 'if test "$PROJECT_NAME" = github; then cat /etc/atlantis/github-iac/APP_GITHUB_IAC_PRIVATE_KEY; else printf ""; fi'
          - run: |
              set -eu
              if test "$PROJECT_NAME" = github; then
                exit 0
              fi
              test "$BASE_REPO_OWNER/$BASE_REPO_NAME" = "SmadjaPaul/homelab-infra"
              test "$HEAD_REPO_OWNER/$HEAD_REPO_NAME" = "$BASE_REPO_OWNER/$BASE_REPO_NAME"
              test "$PROJECT_NAME" = "atlantis-pilot"
              test "$WORKSPACE" = "default"
              test -z "$COMMENT_ARGS"
              test "$HEAD_COMMIT" != ""
              test -f "$DIR/backend.tf"
              test -f "$DIR/main.tf"
              grep -Eq 'required_version = "= 1.13.1"' "$DIR/versions.tf"
              grep -Eq 'key[[:space:]]*=[[:space:]]*"atlantis-pilot/terraform.tfstate"' "$DIR/backend.tf"
              grep -Eq 'bucket[[:space:]]*=[[:space:]]*"homelab-atlantis-pilot-tfstate"' "$DIR/backend.tf"
              grep -Eq 'endpoint[[:space:]]*=[[:space:]]*"https://axnvxxurxefp\.compat\.objectstorage\.eu-paris-1\.oraclecloud\.com"' "$DIR/backend.tf"
              grep -Eq 'use_lockfile[[:space:]]*=[[:space:]]*true' "$DIR/backend.tf"
              if grep -Eq 'REPLACE_WITH_DEDICATED_ATLANTIS_PILOT_' "$DIR/backend.tf"; then
                echo "pilot backend placeholders are forbidden" >&2
                exit 1
              fi
              if grep -REn '^[[:space:]]*(provider|module|data|provisioner)[[:space:]]' "$DIR"/*.tf; then
                echo "external provider/module/data/provisioner is forbidden in the pilot" >&2
                exit 1
              fi
              if grep -REn '^[[:space:]]*resource[[:space:]]+"' "$DIR"/*.tf | grep -v 'resource "terraform_data"'; then
                echo "only terraform_data is permitted in the pilot" >&2
                exit 1
              fi
              forbidden_pattern='DOPPLER|OCI_S3|PROXMOX|KUBECONFIG|cloudflare|unifi|migadu|kubernetes|helm|local-exec|remote-exec|external'
              if grep -REiq "$forbidden_pattern" "$DIR"/*.tf; then
                echo "an existing infrastructure authority or execution escape hatch is forbidden" >&2
                exit 1
              fi
          - init
          - plan
      policy_check:
        steps:
          - env:
              name: TF_DATA_DIR
              command: 'printf "%s/atlantis-tofu-data-%s-%s" "${TMPDIR:-/tmp}" "$PROJECT_NAME" "$PULL_NUM"'
          - show
          - policy_check
      apply:
        steps:
          - env:
              name: TF_DATA_DIR
              command: 'printf "%s/atlantis-tofu-data-%s-%s" "${TMPDIR:-/tmp}" "$PROJECT_NAME" "$PULL_NUM"'
          - env:
              name: AWS_ACCESS_KEY_ID
              command: 'if test "$PROJECT_NAME" = github; then cat /etc/atlantis/github-iac/AWS_ACCESS_KEY_ID; else printf "%s" "$AWS_ACCESS_KEY_ID"; fi'
          - env:
              name: AWS_SECRET_ACCESS_KEY
              command: 'if test "$PROJECT_NAME" = github; then cat /etc/atlantis/github-iac/AWS_SECRET_ACCESS_KEY; else printf "%s" "$AWS_SECRET_ACCESS_KEY"; fi'
          - env:
              name: AWS_REGION
              command: 'if test "$PROJECT_NAME" = github; then cat /etc/atlantis/github-iac/AWS_REGION; else printf "%s" "$AWS_REGION"; fi'
          - env:
              name: TF_VAR_github_app_id
              command: 'if test "$PROJECT_NAME" = github; then cat /etc/atlantis/github-iac/APP_GITHUB_IAC_ID; else printf ""; fi'
          - env:
              name: TF_VAR_github_app_installation_id
              command: 'if test "$PROJECT_NAME" = github; then cat /etc/atlantis/github-iac/APP_GITHUB_IAC_INSTALLATION_ID; else printf ""; fi'
          - env:
              name: TF_VAR_github_app_pem_file
              command: 'if test "$PROJECT_NAME" = github; then cat /etc/atlantis/github-iac/APP_GITHUB_IAC_PRIVATE_KEY; else printf ""; fi'
          - run: |
              set -eu
              if test "$PROJECT_NAME" = github; then
                exit 0
              fi
              test "$BASE_REPO_OWNER/$BASE_REPO_NAME" = "SmadjaPaul/homelab-infra"
              test "$HEAD_REPO_OWNER/$HEAD_REPO_NAME" = "$BASE_REPO_OWNER/$BASE_REPO_NAME"
              test "$BASE_BRANCH_NAME" = "main"
              test "$REPO_REL_DIR" = "terraform/atlantis-pilot"
              test "$PROJECT_NAME" = "atlantis-pilot"
              test "$WORKSPACE" = "default"
              test -z "$COMMENT_ARGS"
              test "$HEAD_COMMIT" != ""
              test -f "$DIR/backend.tf"
              test -f "$DIR/main.tf"
              grep -Eq 'required_version = "= 1.13.1"' "$DIR/versions.tf"
              grep -Eq 'key[[:space:]]*=[[:space:]]*"atlantis-pilot/terraform.tfstate"' "$DIR/backend.tf"
              grep -Eq 'bucket[[:space:]]*=[[:space:]]*"homelab-atlantis-pilot-tfstate"' "$DIR/backend.tf"
              grep -Eq 'endpoint[[:space:]]*=[[:space:]]*"https://axnvxxurxefp\.compat\.objectstorage\.eu-paris-1\.oraclecloud\.com"' "$DIR/backend.tf"
              grep -Eq 'use_lockfile[[:space:]]*=[[:space:]]*true' "$DIR/backend.tf"
          - apply
      import:
        steps:
          - run: |
              echo "Atlantis pilot: import is disabled server-side" >&2
              exit 1
      state_rm:
        steps:
          - run: |
              echo "Atlantis pilot: state operations are disabled server-side" >&2
              exit 1

service:
  type: ClusterIP
  port: 80
  targetPort: 4141

ingress:
  enabled: false
webhook_ingress:
  enabled: false
route:
  main:
    enabled: true
    hostnames:
      - atlantis.smadja.dev
    parentRefs:
      - name: internal
        namespace: gateway

serviceAccount:
  create: true
  mount: false
  name: atlantis-pilot

volumeClaim:
  enabled: true
  dataStorage: 5Gi
  storageClassName: longhorn-fast
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

statefulSet:
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: Always
    seccompProfile:
      type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

test:
  enabled: false

podDisruptionBudget:
  enabled: false
