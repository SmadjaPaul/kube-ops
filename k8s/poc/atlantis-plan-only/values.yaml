fullnameOverride: atlantis-pilot

# Plan-only pilot activated after PLT-89/PLT-90 backend qualification. The
# GitHub App is installed only on SmadjaPaul/homelab-infra. Its Atlantis-
# required permissions are an operator decision: statuses/checks, contents,
# issues, pull requests and webhooks; administration, members and actions
# remain read-only and are added only when the selected authorization feature
# requires them. Secret values are delivered through ESO from Doppler.
orgAllowlist: github.com/SmadjaPaul/homelab-infra
atlantisUrl: https://atlantis-webhook.smadja.dev

image:
  repository: ghcr.io/runatlantis/atlantis
  tag: v0.48.1@sha256:42bde40e38ec7b89f02a2968b4b1b74b990121eb8768d0a7de7caad125344298
  pullPolicy: IfNotPresent

githubApp:
  slug: smadja-atlantis
# Atlantis v0.48.1 decodes these two flags as int64. Keep the non-secret
# identity on Cobra's command line so it is parsed before Viper's environment
# decoding; the chart still owns the App slug and secret-file wiring above.
extraArgs:
  - --gh-app-id=5416988
  - --gh-app-installation-id=173903025
vcsSecretName: atlantis-github-app

allowForkPRs: false
allowDraftPRs: false
hidePrevPlanComments: true
hideUnchangedPlanComments: true
disableApply: true
disableApplyAll: true
disableRepoLocking: false
defaultTFDistribution: opentofu
defaultTFVersion: "1.13.1"

environment:
  ATLANTIS_ALLOW_COMMANDS: version,plan,policy_check
  ATLANTIS_CHECKOUT_STRATEGY: merge
  ATLANTIS_RESTRICT_FILE_LIST: "true"
  ATLANTIS_FAIL_ON_PRE_WORKFLOW_HOOK_ERROR: "true"
  ATLANTIS_DISCARD_APPROVAL_ON_PLAN: "true"
  AWS_EC2_METADATA_DISABLED: "true"

environmentSecrets:
  - name: AWS_ACCESS_KEY_ID
    secretKeyRef:
      name: atlantis-pilot-backend
      key: AWS_ACCESS_KEY_ID
  - name: AWS_SECRET_ACCESS_KEY
    secretKeyRef:
      name: atlantis-pilot-backend
      key: AWS_SECRET_ACCESS_KEY
  - name: AWS_REGION
    secretKeyRef:
      name: atlantis-pilot-backend
      key: AWS_REGION

repoConfig: |
  repos:
    # Atlantis always has a default repo entry. Keep an explicit server-side
    # deny rule first so a future broad match cannot accidentally inherit an
    # executable workflow. The exact repository rule below wins last.
    - id: /.*/
      branch: /.*/
      workflow: atlantis-deny
      allowed_overrides: []
      allow_custom_workflows: false
    - id: github.com/SmadjaPaul/homelab-infra
      branch: /^main$/
      repo_config_file: .atlantis/plan-only.yaml
      workflow: atlantis-plan-only
      # Plans are autonomous for this isolated pilot only. Keep the GitHub
      # mergeability and divergence gates; approval remains mandatory for
      # every mutation-capable command below.
      plan_requirements: [mergeable, undiverged]
      apply_requirements: [approved, mergeable, undiverged]
      import_requirements: [approved, mergeable, undiverged]
      repo_locks:
        mode: on_plan
      allowed_overrides: []
      allow_custom_workflows: false
  workflows:
    atlantis-deny:
      plan:
        steps:
          - run: |
              echo "Atlantis server-side repository allowlist denied this repository" >&2
              exit 1
      apply:
        steps:
          - run: |
              echo "Atlantis server-side repository allowlist denied this repository" >&2
              exit 1
      import:
        steps:
          - run: |
              echo "Atlantis server-side repository allowlist denied this repository" >&2
              exit 1
      state_rm:
        steps:
          - run: |
              echo "Atlantis server-side repository allowlist denied this repository" >&2
              exit 1
    atlantis-plan-only:
      plan:
        steps:
          - run: |
              set -eu
              test "$BASE_REPO_OWNER/$BASE_REPO_NAME" = "SmadjaPaul/homelab-infra"
              test "$HEAD_REPO_OWNER/$HEAD_REPO_NAME" = "$BASE_REPO_OWNER/$BASE_REPO_NAME"
              test "$REPO_REL_DIR" = "terraform/atlantis-pilot"
              test "$PROJECT_NAME" = "atlantis-pilot"
              test -z "$COMMENT_ARGS"
              test "$ATLANTIS_PR_MERGEABLE" = "true"
              test "$HEAD_COMMIT" != ""
              test -f "$DIR/backend.tf"
              test -f "$DIR/main.tf"
              grep -Eq 'required_version = "= 1.13.1"' "$DIR/versions.tf"
              grep -Eq 'key[[:space:]]*=[[:space:]]*"atlantis-pilot/terraform.tfstate"' "$DIR/backend.tf"
              grep -Eq 'bucket[[:space:]]*=[[:space:]]*"homelab-atlantis-pilot-tfstate"' "$DIR/backend.tf"
              grep -Eq 'endpoint[[:space:]]*=[[:space:]]*"https://axnvxxurxefp\.compat\.objectstorage\.eu-paris-1\.oraclecloud\.com"' "$DIR/backend.tf"
              grep -Eq 'use_lockfile[[:space:]]*=[[:space:]]*true' "$DIR/backend.tf"
              if grep -Eq 'REPLACE_WITH_DEDICATED_ATLANTIS_PILOT_' "$DIR/backend.tf"; then
                echo "pilot backend placeholders are forbidden" >&2
                exit 1
              fi
              if grep -REn '^[[:space:]]*(provider|module|data|provisioner)[[:space:]]' "$DIR"/*.tf; then
                echo "external provider/module/data/provisioner is forbidden in the pilot" >&2
                exit 1
              fi
              if grep -REn '^[[:space:]]*resource[[:space:]]+"' "$DIR"/*.tf | grep -v 'resource "terraform_data"'; then
                echo "only terraform_data is permitted in the pilot" >&2
                exit 1
              fi
              forbidden_pattern='DOPPLER|OCI_S3|PROXMOX|KUBECONFIG|cloudflare|unifi|migadu|kubernetes|helm|local-exec|remote-exec|external'
              if grep -REiq "$forbidden_pattern" "$DIR"/*.tf; then
                echo "an existing infrastructure authority or execution escape hatch is forbidden" >&2
                exit 1
              fi
          - init
          - plan
      apply:
        steps:
          - run: |
              echo "plan-only Atlantis: apply is disabled server-side" >&2
              exit 1
      import:
        steps:
          - run: |
              echo "plan-only Atlantis: import is disabled server-side" >&2
              exit 1
      state_rm:
        steps:
          - run: |
              echo "plan-only Atlantis: state operations are disabled server-side" >&2
              exit 1

service:
  type: ClusterIP
  port: 80
  targetPort: 4141

ingress:
  enabled: false
webhook_ingress:
  enabled: false
route:
  main:
    enabled: true
    hostnames:
      - atlantis.smadja.dev
    parentRefs:
      - name: internal
        namespace: gateway

serviceAccount:
  create: true
  mount: false
  name: atlantis-pilot

volumeClaim:
  enabled: true
  dataStorage: 5Gi
  storageClassName: longhorn-fast
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

statefulSet:
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: Always
    seccompProfile:
      type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

test:
  enabled: false

podDisruptionBudget:
  enabled: false
