apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This directory is reconciled by the infrastructure ApplicationSet but remains
# dormant until the approved PLT-89/PLT-90 activation prerequisites are supplied.
# The AppProject and ApplicationSet references are intentionally kept explicit;
# activation still requires operator-provided GitHub App identity and review.
resources:
  - namespace.yaml
  - github-app-external-secret.yaml
  - webhook-route.yaml
  - network-policy.yaml

patches:
  - path: statefulset-patch.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: atlantis-pilot

helmCharts:
  - name: atlantis
    repo: https://runatlantis.github.io/helm-charts
    version: 6.16.1
    releaseName: atlantis-pilot
    namespace: atlantis-system
    valuesFile: values.yaml
