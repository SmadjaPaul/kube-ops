apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This directory is reconciled by the infrastructure ApplicationSet. The
# Atlantis workload remains plan-only; backend credentials are delivered by
# the dedicated ExternalSecret below and never include operator credentials.
resources:
  - namespace.yaml
  - github-app-external-secret.yaml
  - pilot-backend-external-secret.yaml
  - webhook-route.yaml
  - network-policy.yaml

patches:
  - path: statefulset-patch.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: atlantis-pilot
  - path: pvc-backup-patch.yaml
    target:
      version: v1
      kind: PersistentVolumeClaim
      name: atlantis-pilot-data

helmCharts:
  - name: atlantis
    repo: https://runatlantis.github.io/helm-charts
    version: 6.16.1
    releaseName: atlantis-pilot
    namespace: atlantis-system
    valuesFile: values.yaml
