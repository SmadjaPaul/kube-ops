apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This directory is reconciled by the infrastructure ApplicationSet. The
# Atlantis workload is an isolated pilot; backend credentials are delivered
# by the dedicated ExternalSecret below and never include operator credentials.
resources:
  - namespace.yaml
  - github-app-external-secret.yaml
  - pilot-backend-external-secret.yaml
  - webhook-route.yaml
  - network-policy.yaml

configMapGenerator:
  - name: atlantis-pilot-conftest
    files:
      - policies/pilot.rego

generatorOptions:
  disableNameSuffixHash: true

patches:
  - target:
      version: v1
      kind: ConfigMap
      name: atlantis-pilot-conftest
    patch: |-
      - op: add
        path: /metadata/namespace
        value: atlantis-system
  - path: statefulset-patch.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: atlantis-pilot
  - path: pvc-backup-patch.yaml
    target:
      version: v1
      kind: PersistentVolumeClaim
      name: atlantis-pilot-data

helmCharts:
  - name: atlantis
    repo: https://runatlantis.github.io/helm-charts
    version: 6.16.1
    releaseName: atlantis-pilot
    namespace: atlantis-system
    valuesFile: values.yaml
