apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This directory remains reconciled by the infrastructure ApplicationSet only
# to keep the existing namespace. The Atlantis server, hooks, routes,
# credentials and policy projections were retired after ARC qualification.
#
# PLT-46 / MANDAT 16 (D-2026-11-16-05): the recovery PVC atlantis-system/atlantis-pilot-data,
# its PV and its Longhorn volume were deleted by a one-shot GitOps Job (kube-ops#1580), which
# this directory no longer carries (retired like kube-ops#1562). The data had no backup on R2
# and is lost for good; the PVC must not be defined here again.
resources:
  - namespace.yaml
