apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlantis-github-iac
  namespace: atlantis-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: atlantis-github-iac
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: OCI_S3_GITHUB_ACCESS_KEY
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: OCI_S3_GITHUB_SECRET_KEY
    - secretKey: AWS_REGION
      remoteRef:
        key: OCI_CLI_REGION
    - secretKey: APP_GITHUB_IAC_ID
      remoteRef:
        key: APP_GITHUB_IAC_ID
    - secretKey: APP_GITHUB_IAC_INSTALLATION_ID
      remoteRef:
        key: APP_GITHUB_IAC_INSTALLATION_ID
    - secretKey: APP_GITHUB_IAC_PRIVATE_KEY
      remoteRef:
        key: APP_GITHUB_IAC_PRIVATE_KEY
