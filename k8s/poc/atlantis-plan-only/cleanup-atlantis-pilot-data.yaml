# One-shot cleanup of the retired Atlantis recovery volume (MANDAT 16, D-2026-11-16-05).
# Paul has no write kubeconfig: Argo runs one Job under a dedicated ServiceAccount whose RBAC
# is pinned by resourceNames. Scope: PVC atlantis-system/atlantis-pilot-data, PV
# pvc-24ed83e6-2ac2-486f-8f6a-37ea3d064731 and the Longhorn volume of the same name. Nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleanup-atlantis-pilot-data
  namespace: atlantis-system
  annotations:
    argocd.argoproj.io/sync-wave: "19"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cleanup-atlantis-pilot-data
  namespace: atlantis-system
  annotations:
    argocd.argoproj.io/sync-wave: "19"
rules:
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    resourceNames: [atlantis-pilot-data]
    verbs: [get, delete]
  # The script refuses a PVC still mounted by a pod: list cannot be limited by resourceNames.
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cleanup-atlantis-pilot-data
  namespace: atlantis-system
  annotations:
    argocd.argoproj.io/sync-wave: "19"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cleanup-atlantis-pilot-data
subjects:
  - kind: ServiceAccount
    name: cleanup-atlantis-pilot-data
    namespace: atlantis-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cleanup-atlantis-pilot-data
  annotations:
    argocd.argoproj.io/sync-wave: "19"
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    resourceNames: &pvs
      - pvc-24ed83e6-2ac2-486f-8f6a-37ea3d064731
    verbs: [get, delete]
  - apiGroups: [longhorn.io]
    resources: [volumes, volumeattachments]
    resourceNames: *pvs
    verbs: [get]
  - apiGroups: [longhorn.io]
    resources: [volumes]
    resourceNames: *pvs
    verbs: [delete]
  # The script refuses a PV still referenced by a PVC (spec.volumeName): list cannot be
  # limited by resourceNames. Read-only, metadata of PVCs only.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cleanup-atlantis-pilot-data
  annotations:
    argocd.argoproj.io/sync-wave: "19"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cleanup-atlantis-pilot-data
subjects:
  - kind: ServiceAccount
    name: cleanup-atlantis-pilot-data
    namespace: atlantis-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cleanup-atlantis-pilot-data
  namespace: atlantis-system
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  # One run: on failure or discrepancy, stop and ask for a new mandate.
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cleanup-atlantis-pilot-data
    spec:
      serviceAccountName: cleanup-atlantis-pilot-data
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 2501
        runAsGroup: 2501
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cleanup
          image: docker.io/alpine/k8s:1.36.6@sha256:e2d95501b5718673ba67693154fabe6c618dbe1211a32947d6d5cf16285e019b
          env:
            - {name: HOME, value: /tmp}
            - {name: PV_CLEANUP_IN_CLUSTER, value: "yes"}
            - {name: ALLOW_RELEASED_PV_DELETION, value: "yes"}
          command:
            - /bin/bash
            - -c
            - |
              # kubectl finds no in-cluster config by itself here: build an explicit kubeconfig
              # from the ServiceAccount token (same fix as kube-ops#1560).
              sa=/var/run/secrets/kubernetes.io/serviceaccount
              echo "diag: host=${KUBERNETES_SERVICE_HOST:-absent} port=${KUBERNETES_SERVICE_PORT:-absent} token=$([ -s $sa/token ] && echo present || echo absent) ca=$([ -s $sa/ca.crt ] && echo present || echo absent)"
              export KUBECONFIG=/tmp/kubeconfig
              kubectl config set-cluster in --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}" --certificate-authority=$sa/ca.crt >/dev/null
              kubectl config set-credentials sa --token="$(cat $sa/token)" >/dev/null
              kubectl config set-context in --cluster=in --user=sa >/dev/null
              kubectl config use-context in >/dev/null
              exec /bin/bash /scripts/released-pv-cleanup.sh --atlantis-pilot --execute
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: script, mountPath: /scripts, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
        - name: script
          configMap:
            name: released-pv-cleanup-script
