apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlantis-github-app
  namespace: atlantis-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: atlantis-github-app
    creationPolicy: Owner
  data:
    - secretKey: key.pem
      remoteRef:
        key: ATLANTIS_GH_APP_KEY_PEM
    - secretKey: github_secret
      remoteRef:
        key: ATLANTIS_GH_WEBHOOK_SECRET
