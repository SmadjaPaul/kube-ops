apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: atlantis-pilot
  namespace: atlantis-system
spec:
  description: >-
    Atlantis pilot: webhook/UI ingress and Prometheus scrape, DNS, GitHub, the pinned OpenTofu
    distribution endpoints (including the signed GitHub release redirect) and
    the dedicated OCI S3 endpoint only; provider registry and other cloud
    egress remain denied.
  endpointSelector:
    matchLabels:
      app: atlantis
      release: atlantis-pilot
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "4141"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
            k8s:app.kubernetes.io/instance: kube-prometheus-stack-prometheus
      toPorts:
        - ports:
            - port: "4141"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toFQDNs:
        # These are the only outbound destinations for the activated pilot.
        # OpenTofu downloads its pinned toolchain on first start. The OCI
        # hostname is the dedicated object-storage endpoint for the isolated
        # pilot backend; no provider registry is admitted.
        - matchName: api.github.com
        - matchName: github.com
        - matchName: codeload.github.com
        - matchName: objects.githubusercontent.com
        - matchName: get.opentofu.org
        - matchName: releases.hashicorp.com
        - matchName: release-assets.githubusercontent.com
        - matchName: axnvxxurxefp.compat.objectstorage.eu-paris-1.oraclecloud.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
