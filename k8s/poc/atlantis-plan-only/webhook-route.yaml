apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: atlantis-webhook
  namespace: atlantis-system
  labels:
    app.kubernetes.io/part-of: infrastructure
spec:
  parentRefs:
    - name: external
      namespace: gateway
  hostnames:
    - atlantis-webhook.smadja.dev
  rules:
    - matches:
        - path:
            type: Exact
            value: /events
      backendRefs:
        - name: atlantis-pilot
          port: 80
