apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: atlantis-pilot
  namespace: atlantis-system
spec:
  template:
    metadata:
      annotations:
        atlantis.smadja.dev/config-revision: "2026-10-22-native-policy-v2"
    spec:
      volumes:
        - name: atlantis-home-dir
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp-dir
          emptyDir:
            sizeLimit: 128Mi
