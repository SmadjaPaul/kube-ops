apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlantis-aiostreams-provider
  namespace: atlantis-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: atlantis-aiostreams-provider
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: ATLANTIS_AIOSTREAMS_S3_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: ATLANTIS_AIOSTREAMS_S3_SECRET_ACCESS_KEY
    - secretKey: AWS_REGION
      remoteRef:
        key: ATLANTIS_AIOSTREAMS_S3_REGION
    - secretKey: TF_VAR_aiostreams_password
      remoteRef:
        key: APP_AIOSTREAMS_TERRAFORM_PASSWORD
    - secretKey: AIOSTREAMS_PASSWORD
      remoteRef:
        key: APP_AIOSTREAMS_TERRAFORM_PASSWORD
    - secretKey: AIOSTREAMS_OPERATOR_AUTH
      remoteRef:
        key: APP_AIOSTREAMS_OPERATOR_AUTH
    - secretKey: TF_VAR_torbox_api_key
      remoteRef:
        key: APP_TORBOX_API_KEY
