apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlantis-apps-polyfin-provider
  namespace: atlantis-apps
  annotations:
    smadja.dev/secret-contract-revision: atlantis-v2-polyfin-provider-v1
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: atlantis-apps-polyfin-provider
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        POLYFIN_ADMIN_USERNAME: polyfin-breakglass
        POLYFIN_ADMIN_PASSWORD: "{{ .POLYFIN_ADMIN_PASSWORD }}"
  data:
    - secretKey: POLYFIN_ADMIN_PASSWORD
      remoteRef:
        key: APP_POLYFIN_BREAKGLASS_PASSWORD
