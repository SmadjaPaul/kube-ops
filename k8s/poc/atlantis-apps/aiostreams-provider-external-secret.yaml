apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlantis-apps-aiostreams-provider
  namespace: atlantis-apps
  annotations:
    smadja.dev/secret-contract-revision: atlantis-v2-aiostreams-provider-v1
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: atlantis-apps-aiostreams-provider
    creationPolicy: Owner
  data:
    - secretKey: AIOSTREAMS_PASSWORD
      remoteRef:
        key: APP_AIOSTREAMS_TERRAFORM_PASSWORD
    - secretKey: AIOSTREAMS_OPERATOR_AUTH
      remoteRef:
        key: APP_AIOSTREAMS_OPERATOR_AUTH
    - secretKey: TF_VAR_torbox_api_key
      remoteRef:
        key: APP_TORBOX_API_KEY
