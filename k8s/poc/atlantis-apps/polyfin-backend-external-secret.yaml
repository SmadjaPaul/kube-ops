apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlantis-apps-polyfin-backend
  namespace: atlantis-apps
  annotations:
    smadja.dev/secret-contract-revision: atlantis-v2-polyfin-backend-v1
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: atlantis-apps-polyfin-backend
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: ATLANTIS_POLYFIN_S3_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: ATLANTIS_POLYFIN_S3_SECRET_ACCESS_KEY
    - secretKey: AWS_REGION
      remoteRef:
        key: ATLANTIS_POLYFIN_S3_REGION
