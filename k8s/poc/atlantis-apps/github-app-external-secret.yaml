apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlantis-apps-github-app
  namespace: atlantis-apps
  annotations:
    smadja.dev/secret-contract-revision: atlantis-v2-apps-github-v1
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-cluster
    kind: ClusterSecretStore
  target:
    name: atlantis-apps-github-app
    creationPolicy: Owner
  data:
    - secretKey: key.pem
      remoteRef:
        key: ATLANTIS_APPS_GH_APP_KEY_PEM
    - secretKey: github_secret
      remoteRef:
        key: ATLANTIS_APPS_GH_WEBHOOK_SECRET
    - secretKey: APP_ID
      remoteRef:
        key: ATLANTIS_APPS_GH_APP_ID
    - secretKey: INSTALLATION_ID
      remoteRef:
        key: ATLANTIS_APPS_GH_INSTALLATION_ID
