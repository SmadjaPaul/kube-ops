apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: atlantis-apps
  namespace: atlantis-apps
spec:
  template:
    metadata:
      labels:
        atlantis.smadja.dev/domain: apps
      annotations:
        atlantis.smadja.dev/config-revision: "2026-11-09-v2-apps"
    spec:
      volumes:
        - name: atlantis-home-dir
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp-dir
          emptyDir:
            sizeLimit: 128Mi
