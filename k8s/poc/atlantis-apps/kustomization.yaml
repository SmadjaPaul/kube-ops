apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - github-app-external-secret.yaml
  - aiostreams-backend-external-secret.yaml
  - aiostreams-provider-external-secret.yaml
  - polyfin-backend-external-secret.yaml
  - polyfin-provider-external-secret.yaml
  - webhook-route.yaml
  - network-policy.yaml

configMapGenerator:
  - name: atlantis-apps-policy
    files:
      - policies/plan-safety.rego
  - name: atlantis-apps-admission
    files:
      - scripts/guard-project.sh
      - scripts/post-apply-verify.sh

generatorOptions:
  disableNameSuffixHash: true

patches:
  - path: statefulset-patch.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: atlantis-apps

helmCharts:
  - name: atlantis
    repo: https://runatlantis.github.io/helm-charts
    version: 6.16.1
    releaseName: atlantis-apps
    namespace: atlantis-apps
    valuesFile: values.yaml
