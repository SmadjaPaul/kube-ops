apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: atlantis-apps

# Retention-only manifest. The Apps Atlantis server was dormant and never
# carried the active homelab-infra checks; keep its existing volume until a
# separate, state-aware recovery decision proves it can be removed.
resources:
  - namespace.yaml
  - pvc-retention.yaml
