# STAGED EXAMPLE ONLY: never passed to the kube-prometheus-stack chart.
# Once the publisher token exists and the runtime preflight passes, integrate
# this block into the chart's active values.yaml via a separate reviewed PR.
# Alertmanager's existing routing must be compared before activation.
alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-ntfy-publisher
      - alertmanager-healthchecks-ping
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers: ['severity = critical']
        target_matchers: ['severity =~ warning|info']
        equal: [namespace, alertname]
      - source_matchers: ['severity = warning']
        target_matchers: ['severity = info']
        equal: [namespace, alertname]
      - source_matchers: ['alertname = InfoInhibitor']
        target_matchers: ['severity = info']
        equal: [namespace]
      - target_matchers: ['alertname = InfoInhibitor']
    route:
      group_by: [namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
      routes:
        # PLT-263 dead-man switch: Watchdog always fires; Healthchecks.io
        # notifies ntfy (its own integration) when the pings stop.
        - receiver: healthchecks-watchdog
          matchers: ['alertname = Watchdog']
          group_by: [alertname]
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 2m
        - receiver: ntfy-critical
          matchers: ['severity = critical']
          group_by: [namespace, alertname]
    receivers:
      - name: 'null'
      - name: healthchecks-watchdog
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-healthchecks-ping/url
            send_resolved: false
            max_alerts: 1
      - name: ntfy-critical
        webhook_configs:
          - url: http://ntfy.ntfy.svc.cluster.local/homeops-critical?template=alertmanager
            send_resolved: true
            max_alerts: 10
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/alertmanager-ntfy-publisher/token
    templates:
      - /etc/alertmanager/config/*.tmpl
